name = "aria"
main = "worker.js"
compatibility_date = "2026-09-18"

# Worker Previews deliberately start without production runtime secrets or bindings.
# Keep static assets at the top level; Cloudflare requires this empty Preview block.
previews = {}

[assets]
directory = "./pwa/dist"
binding = "ARIA_PWA_ASSETS"
run_worker_first = true

[placement]
mode = "smart"

[triggers]
# No scheduled mission processing while ARIA remains in freeze mode.
crons = []
