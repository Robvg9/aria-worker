<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authorize ARIA</title><style>body{font-family:system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 16px}input,button{font:inherit;width:100%;box-sizing:border-box;padding:10px;margin-top:8px}button{cursor:pointer}</style></head><body><h1 id="title">Authorize Grok</h1><p id="message">ARIA will request permission to use your ChatBending context and memory tools.</p><form id="form" method="post"><input type="hidden" id="pending_id" name="pending_id"><label id="label">Email<br><input id="email" name="email" type="email" required autocomplete="email"></label><button id="button" type="submit">Send code</button></form><script>const p=new URLSearchParams(location.search),id=p.get('pending_id')||'',mode=p.get('mode')||'email',issuer='https://icuqsstxfdbvjytkhlog.supabase.co/functions/v1/aria-mcp-oauth-grok-v2';document.getElementById('pending_id').value=id;if(!id){document.body.innerHTML='<h1>Authorization expired</h1><p>Missing authorization state.</p>';}else if(mode==='otp'){document.getElementById('title').textContent='Verify ARIA';document.getElementById('message').textContent='Enter the one-time verification code sent to your email.';document.getElementById('label').innerHTML='Verification code<br><input name="token" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="8" required>';document.getElementById('button').textContent='Authorize';document.getElementById('form').action=issuer+'/authorize/verify';}else{document.getElementById('form').action=issuer+'/authorize/start';}</script></body></html>
