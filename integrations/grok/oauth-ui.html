<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authorize ARIA</title>
<style>
body{font-family:system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 16px;line-height:1.5}
input,button{font:inherit;width:100%;box-sizing:border-box;padding:10px;margin-top:8px}
button{cursor:pointer}
.ok{padding:12px;border-radius:8px;background:#eef8ee}
.err{padding:12px;border-radius:8px;background:#fff0f0}
</style>
</head>
<body>
<h1 id="title">Authorize Grok</h1>
<p id="message">ARIA will request permission to use your ChatBending context and memory tools.</p>
<form id="form" method="post">
<input type="hidden" id="pending_id" name="pending_id">
<label id="label">Email<br><input id="email" name="email" type="email" required autocomplete="email"></label>
<button id="button" type="submit">Continue with email</button>
</form>
<script>
(async()=>{
const p=new URLSearchParams(location.search);
const id=p.get('pending_id')||'';
const mode=p.get('mode')||'email';
const issuer='https://icuqsstxfdbvjytkhlog.supabase.co/functions/v1/aria-mcp-oauth-grok-v2';
const form=document.getElementById('form');
const title=document.getElementById('title');
const message=document.getElementById('message');
const label=document.getElementById('label');
const button=document.getElementById('button');
if(!id){document.body.innerHTML='<h1>Authorization expired</h1><p>Missing authorization state.</p>';return;}
document.getElementById('pending_id').value=id;
const hash=new URLSearchParams(location.hash.replace(/^#/,''));
const accessToken=hash.get('access_token');
if(accessToken){
form.style.display='none';
title.textContent='Completing authorization…';
message.textContent='Please wait.';
try{
const r=await fetch(issuer+'/authorize/consume',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pending_id:id,access_token:accessToken})});
const d=await r.json();
if(!r.ok||!d.redirect_uri)throw new Error(d.error||'authorization_failed');
location.replace(d.redirect_uri);
}catch(e){
title.textContent='Authorization failed';
message.className='err';
message.textContent='We could not complete authorization. Please restart the connection from Grok.';
}
return;
}
if(mode==='sent'){
form.style.display='none';
title.textContent='Check your email';
message.className='ok';
message.textContent='A secure authorization link was sent to your email. Open that link to finish connecting ARIA to Grok.';
return;
}
if(mode==='otp'){
title.textContent='Verify ARIA';
message.textContent='Enter the one-time verification code sent to your email.';
label.innerHTML='Verification code<br><input name="token" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="8" required>';
button.textContent='Authorize';
form.action=issuer+'/authorize/verify';
}else{
form.action=issuer+'/authorize/start';
}
})();
</script>
</body>
</html>
