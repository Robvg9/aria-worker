<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authorize ARIA</title><style>body{font-family:system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 16px}input,button{font:inherit;width:100%;box-sizing:border-box;padding:10px;margin-top:8px}button{cursor:pointer}</style></head><body><h1>Authorize Grok</h1><p>ARIA will request permission to use your ChatBending context and memory tools.</p><form id="auth-form" method="post"><input type="hidden" id="pending_id" name="pending_id"><label>Email<br><input name="email" type="email" required autocomplete="email"></label><button type="submit">Send code</button></form><script>const params=new URLSearchParams(location.search);const pendingId=params.get('pending_id')||'';const issuer='https://icuqsstxfdbvjytkhlog.supabase.co/functions/v1/aria-mcp-oauth-grok-v2';if(!pendingId){document.body.innerHTML='<h1>Authorization expired</h1><p>Missing authorization state.</p>';}else{document.getElementById('pending_id').value=pendingId;document.getElementById('auth-form').action=issuer+'/authorize/start';}</script></body></html>
