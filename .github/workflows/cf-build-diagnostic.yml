name: Diagnose Cloudflare Workers Build trigger

on:
  pull_request:
    paths:
      - '.github/workflows/cf-build-diagnostic.yml'
      - 'package.json'
      - 'scripts/cloudflare-workers-build.js'
      - 'wrangler.toml'
      - 'worker.js'

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inspect Workers Builds trigger configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/builds/triggers"             > /tmp/triggers.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/triggers.json'))
          print("CF_API_SUCCESS=", data.get("success"))
          for item in data.get("result", []):
              print(json.dumps({
                  "trigger_name": item.get("trigger_name"),
                  "trigger_uuid": item.get("trigger_uuid"),
                  "external_script_id": item.get("external_script_id"),
                  "build_command": item.get("build_command"),
                  "deploy_command": item.get("deploy_command"),
                  "root_directory": item.get("root_directory"),
                  "branch_includes": item.get("branch_includes"),
                  "branch_excludes": item.get("branch_excludes"),
                  "path_includes": item.get("path_includes"),
                  "path_excludes": item.get("path_excludes"),
                  "environment_variables": item.get("environment_variables"),
              }, ensure_ascii=False))
          PY
