name: A6 Windows Agent Read-Only Diagnostic

on:
  push:
    branches:
      - ops/a6-windows-agent-v2-heartbeat-preflight-v1
    paths:
      - '.github/workflows/a6-windows-agent-v2-heartbeat-preflight.yml'

permissions:
  contents: read

concurrency:
  group: a6-windows-agent-readonly-diagnostic
  cancel-in-progress: true

jobs:
  read-only-diagnostic:
    name: Read Windows agent state without changing runtime
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Capture read-only Windows agent evidence
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedDevice = 'windows-fe722cc6681e4f9c9cc35f5ebbb0a089'
          $runtimeRoot = 'D:\ARIA-Windows-Agent'
          $logDir = Join-Path $runtimeRoot 'Logs'
          $dataDir = Join-Path $runtimeRoot 'Data'
          $configPath = Join-Path $dataDir 'config.json'
          $heartbeatPath = Join-Path $logDir 'agent-heartbeat.json'
          $agentPidPath = Join-Path $logDir 'agent.pid'
          $watchdogPidPath = Join-Path $logDir 'watchdog.pid'
          $resultPath = Join-Path $env:GITHUB_WORKSPACE 'a6-windows-readonly-diagnostic.json'
          $capturedAt = [DateTimeOffset]::UtcNow
          $result = [ordered]@{
            status = 'BLOCKED'
            reason = ''
            host = [string]$env:COMPUTERNAME
            expected_host = 'ROBVG'
            device_id_expected = $expectedDevice
            captured_at_utc = $capturedAt.ToString('o')
            runtime_root_exists = Test-Path -LiteralPath $runtimeRoot -PathType Container
            config = $null
            heartbeat = $null
            pid_files = $null
            processes = @()
            scheduled_task = $null
            ollama_process_count = 0
            observation = $null
            process_identity_hashes = @()
          }

          try {
            if ([string]$env:COMPUTERNAME -ine 'ROBVG') {
              throw "A6_RUNNER_HOST_MISMATCH expected=ROBVG actual=$env:COMPUTERNAME"
            }

            if (Test-Path -LiteralPath $configPath -PathType Leaf) {
              $cfg = Get-Content -Raw -LiteralPath $configPath | ConvertFrom-Json
              $result.config = [ordered]@{
                device_id = [string]$cfg.device_id
                node_path = [string]$cfg.node_path
                heartbeat_ms = $cfg.heartbeat_ms
                ollama_enabled = $cfg.ollama_enabled
                capabilities = @($cfg.capabilities | ForEach-Object { [string]$_ })
                last_write_utc = (Get-Item -LiteralPath $configPath).LastWriteTimeUtc.ToString('o')
                sha256 = (Get-FileHash -LiteralPath $configPath -Algorithm SHA256).Hash
              }
            }

            if (Test-Path -LiteralPath $heartbeatPath -PathType Leaf) {
              $rawHeartbeat = Get-Content -Raw -LiteralPath $heartbeatPath
              $hb = $rawHeartbeat | ConvertFrom-Json
              $heartbeatFile = Get-Item -LiteralPath $heartbeatPath
              $heartbeatTimestamp = $null
              $ackTimestamp = $null
              if ($hb.timestamp) { $heartbeatTimestamp = [DateTimeOffset]::Parse([string]$hb.timestamp).ToUniversalTime().ToString('o') }
              if ($hb.last_gateway_heartbeat_at) { $ackTimestamp = [DateTimeOffset]::Parse([string]$hb.last_gateway_heartbeat_at).ToUniversalTime().ToString('o') }
              $result.heartbeat = [ordered]@{
                schema_version = [string]$hb.version
                fields = @($hb.PSObject.Properties.Name | Sort-Object)
                device_id = [string]$hb.device_id
                process_heartbeat_at_utc = $heartbeatTimestamp
                gateway_ack_at_utc = $ackTimestamp
                has_gateway_error = ($null -ne $hb.last_gateway_heartbeat_error)
                file_last_write_utc = $heartbeatFile.LastWriteTimeUtc.ToString('o')
                file_sha256 = (Get-FileHash -LiteralPath $heartbeatPath -Algorithm SHA256).Hash
                age_ms = [long]([DateTimeOffset]::UtcNow - $heartbeatFile.LastWriteTimeUtc).TotalMilliseconds
              }
            }

            $agentPid = $null
            $watchdogPid = $null
            if (Test-Path -LiteralPath $agentPidPath -PathType Leaf) {
              $agentPid = (Get-Content -Raw -LiteralPath $agentPidPath).Trim()
            }
            if (Test-Path -LiteralPath $watchdogPidPath -PathType Leaf) {
              $watchdogPid = (Get-Content -Raw -LiteralPath $watchdogPidPath).Trim()
            }
            $result.pid_files = [ordered]@{ agent_pid = $agentPid; watchdog_pid = $watchdogPid }

            $allProcesses = @(Get-CimInstance Win32_Process -ErrorAction Stop)
            foreach ($proc in $allProcesses | Where-Object { $_.Name -match '^(node|powershell|pwsh|ollama)(\.exe)?$' }) {
              $session = $null
              $owner = $null
              try { $session = [int]$proc.SessionId } catch {}
              try {
                $ownerResult = Invoke-CimMethod -InputObject $proc -MethodName GetOwner -ErrorAction Stop
                if ($ownerResult.ReturnValue -eq 0) { $owner = "$($ownerResult.Domain)\$($ownerResult.User)" }
              } catch {}
              $result.processes += [ordered]@{
                pid = [int]$proc.ProcessId
                parent_pid = [int]$proc.ParentProcessId
                name = [string]$proc.Name
                session_id = $session
                owner = $owner
                executable_path = [string]$proc.ExecutablePath
              }
            }
            $result.ollama_process_count = @($result.processes | Where-Object { $_.name -match '^ollama(\.exe)?$' }).Count

            # Two-minute read-only observation. No runtime/config/process changes.
            $samples = [System.Collections.Generic.List[object]]::new()
            $ackTimes = [System.Collections.Generic.List[DateTimeOffset]]::new()
            $observationStarted = [DateTimeOffset]::UtcNow
            for ($sampleIndex = 0; $sampleIndex -lt 24; $sampleIndex++) {
              $sampleAt = [DateTimeOffset]::UtcNow
              if (Test-Path -LiteralPath $heartbeatPath -PathType Leaf) {
                $sampleRaw = Get-Content -Raw -LiteralPath $heartbeatPath
                $sampleHb = $sampleRaw | ConvertFrom-Json
                $sampleFile = Get-Item -LiteralPath $heartbeatPath
                $processAt = $null
                $ackAt = $null
                $processAtText = $null
                $ackAtText = $null
                $processAgeMs = $null
                $ackAgeMs = $null
                if ($sampleHb.timestamp) {
                  $processAt = [DateTimeOffset]::Parse([string]$sampleHb.timestamp).ToUniversalTime()
                  $processAtText = $processAt.ToString('o')
                  $processAgeMs = [long]($sampleAt - $processAt).TotalMilliseconds
                }
                if ($sampleHb.last_gateway_heartbeat_at) {
                  $ackAt = [DateTimeOffset]::Parse([string]$sampleHb.last_gateway_heartbeat_at).ToUniversalTime()
                  $ackAtText = $ackAt.ToString('o')
                  $ackAgeMs = [long]($sampleAt - $ackAt).TotalMilliseconds
                  if ($ackTimes.Count -eq 0 -or $ackAt -gt $ackTimes[$ackTimes.Count - 1]) { $ackTimes.Add($ackAt) }
                }
                $sampleHash = (Get-FileHash -LiteralPath $heartbeatPath -Algorithm SHA256).Hash
                $samples.Add([ordered]@{
                  sampled_at_utc = $sampleAt.ToString('o')
                  schema_version = [string]$sampleHb.version
                  device_id = [string]$sampleHb.device_id
                  process_heartbeat_at_utc = $processAtText
                  gateway_ack_at_utc = $ackAtText
                  process_heartbeat_age_ms = $processAgeMs
                  gateway_ack_age_ms = $ackAgeMs
                  has_gateway_error = ($null -ne $sampleHb.last_gateway_heartbeat_error)
                  file_last_write_utc = $sampleFile.LastWriteTimeUtc.ToString('o')
                  file_sha256 = $sampleHash
                })
              } else {
                $samples.Add([ordered]@{ sampled_at_utc = $sampleAt.ToString('o'); missing = $true })
              }
              if ($sampleIndex -lt 23) { Start-Sleep -Seconds 5 }
            }
            $ackGaps = @()
            for ($ackIndex = 1; $ackIndex -lt $ackTimes.Count; $ackIndex++) {
              $ackGaps += [long]($ackTimes[$ackIndex] - $ackTimes[$ackIndex - 1]).TotalMilliseconds
            }
            $maxAckGap = $null
            if ($ackGaps.Count -gt 0) { $maxAckGap = [long](($ackGaps | Measure-Object -Maximum).Maximum) }
            $result.observation = [ordered]@{
              window_seconds = [long]([DateTimeOffset]::UtcNow - $observationStarted).TotalSeconds
              sample_count = $samples.Count
              distinct_gateway_ack_count = $ackTimes.Count
              max_gateway_ack_gap_ms = $maxAckGap
              samples = @($samples.ToArray())
            }

            # Capture process ancestry and command-line hashes, never command-line text.
            $allProcessSnapshot = @(Get-CimInstance Win32_Process -ErrorAction Stop)
            $processById = @{}
            foreach ($candidate in $allProcessSnapshot) {
              $processById[[int]$candidate.ProcessId] = $candidate
            }
            $selectedIds = @($allProcessSnapshot | Where-Object { $_.Name -match '^(node|powershell|pwsh|ollama)(\.exe)?$' } | ForEach-Object { [int]$_.ProcessId })
            for ($depth = 0; $depth -lt 4; $depth++) {
              $parentIds = @()
              foreach ($selectedProcessId in $selectedIds) {
                $entry = $processById[[int]$selectedProcessId]
                if ($entry -and [int]$entry.ParentProcessId -gt 0) { $parentIds += [int]$entry.ParentProcessId }
              }
              $selectedIds = @($selectedIds + $parentIds | Select-Object -Unique)
            }
            $processIdentity = @()
            foreach ($selectedProcessId in $selectedIds) {
              $proc = $processById[[int]$selectedProcessId]
              if (-not $proc) { continue }
              $commandHash = $null
              if (-not [string]::IsNullOrWhiteSpace([string]$proc.CommandLine)) {
                $sha = [Security.Cryptography.SHA256]::Create()
                try {
                  $bytes = [Text.Encoding]::UTF8.GetBytes([string]$proc.CommandLine)
                  $commandHash = [BitConverter]::ToString($sha.ComputeHash($bytes)).Replace('-', '')
                } finally { $sha.Dispose() }
              }
              $ownerName = $null
              try {
                $ownerResult = Invoke-CimMethod -InputObject $proc -MethodName GetOwner -ErrorAction Stop
                if ($ownerResult.ReturnValue -eq 0) { $ownerName = "$($ownerResult.Domain)\\$($ownerResult.User)" }
              } catch {}
              $processIdentity += [ordered]@{
                pid = [int]$proc.ProcessId
                parent_pid = [int]$proc.ParentProcessId
                name = [string]$proc.Name
                session_id = [int]$proc.SessionId
                owner = $ownerName
                executable_path = [string]$proc.ExecutablePath
                command_line_sha256 = $commandHash
              }
            }
            $result.process_identity_hashes = $processIdentity

            # Read-only attribution for the watchdog parent and interactive-session Node processes.
            $targetPids = @(2712, 15904, 7088, 8212, 8288, 5052, 5464, 3988)
            $targetProcessDetails = @()
            foreach ($targetPid in $targetPids) {
              $targetProc = $processById[[int]$targetPid]
              if (-not $targetProc) { continue }
              $targetOwner = $null
              try {
                $targetOwnerResult = Invoke-CimMethod -InputObject $targetProc -MethodName GetOwner -ErrorAction Stop
                if ($targetOwnerResult.ReturnValue -eq 0) { $targetOwner = "$($targetOwnerResult.Domain)\\$($targetOwnerResult.User)" }
              } catch {}
              $targetProcessDetails += [ordered]@{
                pid = [int]$targetProc.ProcessId
                parent_pid = [int]$targetProc.ParentProcessId
                name = [string]$targetProc.Name
                session_id = [int]$targetProc.SessionId
                owner = $targetOwner
                executable_path = [string]$targetProc.ExecutablePath
                creation_date_utc = if ($targetProc.CreationDate) { ([Management.ManagementDateTimeConverter]::ToDateTime($targetProc.CreationDate)).ToUniversalTime().ToString('o') } else { $null }
              }
            }
            $result.target_process_details = $targetProcessDetails

            $serviceAttribution = @()
            try {
              $servicesForWatchdogParent = @(Get-CimInstance Win32_Service -Filter "ProcessId=2712" -ErrorAction Stop)
              foreach ($service in $servicesForWatchdogParent) {
                $serviceAttribution += [ordered]@{
                  name = [string]$service.Name
                  display_name = [string]$service.DisplayName
                  state = [string]$service.State
                  start_mode = [string]$service.StartMode
                  process_id = [int]$service.ProcessId
                  start_name = [string]$service.StartName
                  path_name_sha256 = if (-not [string]::IsNullOrWhiteSpace([string]$service.PathName)) {
                    $sha = [Security.Cryptography.SHA256]::Create()
                    try {
                      $bytes = [Text.Encoding]::UTF8.GetBytes([string]$service.PathName)
                      [BitConverter]::ToString($sha.ComputeHash($bytes)).Replace('-', '')
                    } finally { $sha.Dispose() }
                  } else { $null }
                }
              }
            } catch {
              $serviceAttribution = @([ordered]@{ inspection_error = [string]$_.Exception.Message })
            }
            $result.services_hosted_by_watchdog_parent = $serviceAttribution

            $sessionOneNodeAttribution = @()
            foreach ($sessionOneNode in $allProcessSnapshot | Where-Object { $_.Name -match '^node(\\.exe)?            $taskDiscovery = @()
            try {
              $taskOutput = & schtasks.exe /Query /FO CSV /NH 2>$null
              $taskExitCode = $LASTEXITCODE
              if ($taskExitCode -eq 0) {
                $taskRows = @($taskOutput | ConvertFrom-Csv -Header TaskName,NextRunTime,Status)
                $taskDiscovery = @($taskRows | Where-Object { $_.TaskName -match 'ARIA|Agent' } | ForEach-Object {
                  [ordered]@{ task_name = [string]$_.TaskName; status = [string]$_.Status }
                })
              } else {
                $taskDiscovery = @([ordered]@{ inspection_error = "SCHTASKS_QUERY_EXIT=$taskExitCode" })
              }
            } catch {
              $taskDiscovery = @([ordered]@{ inspection_error = [string]$_.Exception.Message })
            }
            $result.scheduled_task_discovery = $taskDiscovery

            try {
              $task = Get-ScheduledTask -TaskName 'ARIA-Windows-Local-Agent' -ErrorAction Stop
              $taskInfo = Get-ScheduledTaskInfo -TaskName 'ARIA-Windows-Local-Agent' -ErrorAction Stop
              $result.scheduled_task = [ordered]@{
                state = [string]$task.State
                task_path = [string]$task.TaskPath
                last_run_time = $taskInfo.LastRunTime.ToString('o')
                last_task_result = [int]$taskInfo.LastTaskResult
              }
            } catch {
              $result.scheduled_task = [ordered]@{ inspection_error = [string]$_.Exception.Message }
            }

            if ($result.config -and $result.heartbeat -and $result.config.device_id -eq $expectedDevice -and $result.heartbeat.device_id -eq $expectedDevice) {
              $result.status = 'CAPTURED'
            } else {
              $result.reason = 'CONFIG_OR_HEARTBEAT_MISSING_OR_DEVICE_MISMATCH'
            }
          } catch {
            $result.reason = [string]$_.Exception.Message
          }

          $result | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $resultPath -Encoding UTF8
          Write-Host "A6_READ_ONLY_STATUS=$($result.status)"
          Write-Host "A6_READ_ONLY_REASON=$($result.reason)"
          Write-Host "A6_READ_ONLY_HOST=$($result.host)"
          if ($result.heartbeat) {
            Write-Host "A6_HEARTBEAT_SCHEMA=$($result.heartbeat.schema_version)"
            Write-Host "A6_HEARTBEAT_AGE_MS=$($result.heartbeat.age_ms)"
          }
          Write-Host "A6_OLLAMA_PROCESS_COUNT=$($result.ollama_process_count)"

      - name: Upload read-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-windows-readonly-diagnostic-${{ github.sha }}
          path: a6-windows-readonly-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
 -and [int]$_.SessionId -eq 1 }) {
              $sessionOneNodeAttribution += [ordered]@{
                pid = [int]$sessionOneNode.ProcessId
                parent_pid = [int]$sessionOneNode.ParentProcessId
                session_id = [int]$sessionOneNode.SessionId
                executable_path = [string]$sessionOneNode.ExecutablePath
                creation_date_utc = if ($sessionOneNode.CreationDate) { ([Management.ManagementDateTimeConverter]::ToDateTime($sessionOneNode.CreationDate)).ToUniversalTime().ToString('o') } else { $null }
              }
            }
            $result.session_one_node_processes = $sessionOneNodeAttribution
            $taskDiscovery = @()
            try {
              $taskOutput = & schtasks.exe /Query /FO CSV /NH 2>$null
              $taskExitCode = $LASTEXITCODE
              if ($taskExitCode -eq 0) {
                $taskRows = @($taskOutput | ConvertFrom-Csv -Header TaskName,NextRunTime,Status)
                $taskDiscovery = @($taskRows | Where-Object { $_.TaskName -match 'ARIA|Agent' } | ForEach-Object {
                  [ordered]@{ task_name = [string]$_.TaskName; status = [string]$_.Status }
                })
              } else {
                $taskDiscovery = @([ordered]@{ inspection_error = "SCHTASKS_QUERY_EXIT=$taskExitCode" })
              }
            } catch {
              $taskDiscovery = @([ordered]@{ inspection_error = [string]$_.Exception.Message })
            }
            $result.scheduled_task_discovery = $taskDiscovery

            try {
              $task = Get-ScheduledTask -TaskName 'ARIA-Windows-Local-Agent' -ErrorAction Stop
              $taskInfo = Get-ScheduledTaskInfo -TaskName 'ARIA-Windows-Local-Agent' -ErrorAction Stop
              $result.scheduled_task = [ordered]@{
                state = [string]$task.State
                task_path = [string]$task.TaskPath
                last_run_time = $taskInfo.LastRunTime.ToString('o')
                last_task_result = [int]$taskInfo.LastTaskResult
              }
            } catch {
              $result.scheduled_task = [ordered]@{ inspection_error = [string]$_.Exception.Message }
            }

            if ($result.config -and $result.heartbeat -and $result.config.device_id -eq $expectedDevice -and $result.heartbeat.device_id -eq $expectedDevice) {
              $result.status = 'CAPTURED'
            } else {
              $result.reason = 'CONFIG_OR_HEARTBEAT_MISSING_OR_DEVICE_MISMATCH'
            }
          } catch {
            $result.reason = [string]$_.Exception.Message
          }

          $result | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $resultPath -Encoding UTF8
          Write-Host "A6_READ_ONLY_STATUS=$($result.status)"
          Write-Host "A6_READ_ONLY_REASON=$($result.reason)"
          Write-Host "A6_READ_ONLY_HOST=$($result.host)"
          if ($result.heartbeat) {
            Write-Host "A6_HEARTBEAT_SCHEMA=$($result.heartbeat.schema_version)"
            Write-Host "A6_HEARTBEAT_AGE_MS=$($result.heartbeat.age_ms)"
          }
          Write-Host "A6_OLLAMA_PROCESS_COUNT=$($result.ollama_process_count)"

      - name: Upload read-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-windows-readonly-diagnostic-${{ github.sha }}
          path: a6-windows-readonly-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
