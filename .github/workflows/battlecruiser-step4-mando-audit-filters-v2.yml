name: BattleCruiser Step 4 Safe Mando Audit Filters V2 (Read Only)
on:
  push:
    branches:
      - aria/bc-step4-android-e2e-20261021
    paths:
      - .github/workflows/battlecruiser-step4-mando-audit-filters-v2.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-step4-mando-audit-filters-v2
  cancel-in-progress: false
jobs:
  android-mando-audit-filters-v2:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Observe read-only Mando audit type/status filters and restore defaults
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.request, urllib.error
          project=os.environ.get('SUPABASE_PROJECT_REF','').strip()
          secret=os.environ.get('ARIA_RUNTIME_SHARED_SECRET','')
          if not project or not secret: raise SystemExit('BLOCKED: production secrets unavailable')
          base=f'https://{project}.supabase.co/functions/v1'
          headers={'Authorization':'Bearer '+secret,'content-type':'application/json','cache-control':'no-store'}
          mission_id=f"mission_bc_step4_mando_audit_filters_readonly_v2_{os.environ['RUN_ID']}_{os.environ['RUN_ATTEMPT']}"
          device='android-termux-a1ebcfc7-9287-4603-a0f9-c519d12fd092'
          marker='BC_STEP4_MANDO_AUDIT_FILTERS_READONLY_V2'
          command=r"""node <<'NODE'
          const {executeAndroidAccessibilityJob,probeLocalIpcHealth}=require('./computer-use/android-accessibility-v1.js');
          const marker='BC_STEP4_MANDO_AUDIT_FILTERS_READONLY_V2',host='battlecruiser.robvg9.workers.dev';
          const deviceBuild='3708b31b319884f7d42082414a82cdd11450fe2d';
          const base={target_package:'com.android.chrome',allow_any_app:false,allowed_hosts:[host]};
          const clean=s=>typeof s==='string'?s.replace(/\s+/g,' ').trim().replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig,'[redacted]').slice(0,110):'';
          const norm=s=>clean(s).toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n').trim();
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function send(q){return await executeAndroidAccessibilityJob({command:JSON.stringify({...base,...q}),timeoutMs:18000});}
          async function observe(){const r=await send({operation:'observe'}),p=r&&r.payload||{},root=p.root||(p.ui&&p.ui.root)||null;return {r,p,root};}
          async function action(a){return await send({operation:'action',action:a});}
          function scan(root){
            const nodes=[],seen=new Set();let count=0;
            const walk=(n,path,d)=>{
              if(!n||typeof n!=='object'||Array.isArray(n)||seen.has(n)||d>28||count>=1200)return;
              seen.add(n);count++;
              const names=['name','label','contentDescription','text','hint'].map(k=>clean(n[k])).filter(Boolean);
              nodes.push({id:typeof n.id==='string'&&n.id?n.id:path,path,role:clean(n.role),className:clean(n.className||n.class),names,text:names.join(' | '),
                visible:n.visible!==false,clickable:!!n.clickable,enabled:n.enabled!==false,scrollable:!!n.scrollable,bounds:n.bounds||null});
              if(Array.isArray(n.children))n.children.forEach((c,i)=>walk(c,path+'.'+i,d+1));
            };
            walk(root,'0',0);return nodes;
          }
          const exact=(nodes,label,opts={})=>nodes.find(n=>n.names.some(t=>norm(t)===norm(label))&&(!opts.visible||n.visible)&&(!opts.clickable||n.clickable)&&(!opts.enabled||n.enabled));
          const controlCandidates=nodes=>nodes.filter(n=>/todos los tipos|todos los estados|limpiar filtros|filtro-aud-tipo|filtro-aud-estado/i.test(norm(n.text))||/combobox|spinner|listbox/i.test(n.role+' '+n.className))
            .map(n=>({id:n.id,path:n.path,role:n.role,className:n.className,text:clean(n.text),visible:n.visible,clickable:n.clickable,enabled:n.enabled,scrollable:n.scrollable,bounds:n.bounds})).slice(0,30);
          const screen=(obs)=>{const nodes=obs.root?scan(obs.root):[];return {hash:obs.p.evidence_hash||null,nodeCount:nodes.length,hasMando:nodes.some(n=>n.visible&&/centro de mando/.test(norm(n.text))),controls:controlCandidates(nodes),scrollables:nodes.filter(n=>n.visible&&n.scrollable).map(n=>({id:n.id,path:n.path,role:n.role,bounds:n.bounds})).slice(0,8),states:nodes.filter(n=>n.visible&&/sin registros de auditoria|cargando auditoria|no se pudo cargar auditoria/i.test(norm(n.text))).map(n=>/sin registros/i.test(norm(n.text))?'empty':/cargando/i.test(norm(n.text))?'loading':'error').slice(0,5),nodeHashes:obs.p.ui&&obs.p.ui.evidence_hash||null};};
          async function fresh(){let c=await observe();for(let k=0;k<5&&(!c.root||c.p.ok!==true);k++){await wait(500);c=await observe();}return c;}
          async function clickWait(node,label,timeline){const r=await action({action:'click',nodeId:node.id});timeline.push({step:label,status:r&&r.status,reason:clean(r&&r.reason||r&&r.payload&&r.payload.reason)});await wait(500);return fresh();}
          function findSelect(nodes,term){
            return nodes.find(n=>n.visible&&n.enabled&&n.clickable&&/combobox|spinner|listbox/i.test(n.role+' '+n.className)&&norm(n.text).includes(norm(term)))
              ||nodes.find(n=>n.visible&&n.enabled&&n.clickable&&norm(n.text)===norm(term))
              ||nodes.find(n=>n.enabled&&n.clickable&&norm(n.text)===norm(term));
          }
          async function chooseOption(cur,option,timeline,step){
            let snap=screen(cur), nodes=cur.root?scan(cur.root):[];
            let opt=exact(nodes,option,{visible:true,clickable:true,enabled:true})||nodes.find(n=>n.visible&&n.clickable&&n.enabled&&norm(n.text)===norm(option));
            if(!opt)return {ok:false,stage:'option_not_found',option,snap:{hash:snap.hash,nodeCount:snap.nodeCount,controls:snap.controls}};
            const before=snap.hash;
            cur=await clickWait(opt,step,timeline);snap=screen(cur);
            return {ok:true,option,hashBefore:before,hashAfter:snap.hash,hashChanged:!!before&&!!snap.hash&&before!==snap.hash,snap:{hash:snap.hash,nodeCount:snap.nodeCount,controls:snap.controls,states:snap.states},cur};
          }
          (async()=>{
            const h=await probeLocalIpcHealth({timeoutMs:2500}),hp=h&&h.payload||{};
            const exactBuild=h&&h.ok===true&&String(hp.version_name)==='1.1.23'&&Number(hp.version_code)===29&&String(hp.build_id)===deviceBuild;
            if(!exactBuild){console.log(JSON.stringify({marker,ok:false,stage:'exact_agent_build_mismatch',build:{ok:!!h?.ok,version_name:hp.version_name||null,version_code:hp.version_code||null,build_id:hp.build_id||null}}));process.exitCode=20;return;}
            const timeline=[];
            const nav=await action({action:'navigate',url:'https://'+host});
            timeline.push({step:'navigate_live',status:nav&&nav.status});
            await wait(2000);
            let cur=await fresh(),nodes=cur.root?scan(cur.root):[];
            let open=exact(nodes,'Abrir menú',{visible:true,clickable:true,enabled:true});
            for(let k=0;k<8&&!open;k++){await wait(500);cur=await fresh();nodes=cur.root?scan(cur.root):[];open=exact(nodes,'Abrir menú',{visible:true,clickable:true,enabled:true});}
            if(!open){console.log(JSON.stringify({marker,ok:false,stage:'menu_not_found',timeline,screen:screen(cur)}));process.exitCode=1;return;}
            cur=await clickWait(open,'open_menu',timeline);
            let s=screen(cur),mando=exact(cur.root?scan(cur.root):[],'Centro de Mando',{visible:true,clickable:true,enabled:true})||exact(cur.root?scan(cur.root):[],'Mando',{visible:true,clickable:true,enabled:true});
            for(let k=0;k<5&&!mando;k++){
              const ns=cur.root?scan(cur.root):[], drawer=ns.find(n=>n.visible&&n.scrollable&&n.path.startsWith('0.0.0.0.2'))||ns.find(n=>n.visible&&n.scrollable);
              if(!drawer)break;
              const sr=await action({action:'scroll',nodeId:drawer.id,direction:k<3?'backward':'forward'});
              timeline.push({step:'scroll_menu_'+(k+1),status:sr&&sr.status});await wait(350);cur=await fresh();
              mando=exact(cur.root?scan(cur.root):[],'Centro de Mando',{visible:true,clickable:true,enabled:true})||exact(cur.root?scan(cur.root):[],'Mando',{visible:true,clickable:true,enabled:true});
            }
            if(!mando){console.log(JSON.stringify({marker,ok:false,stage:'mando_button_not_found',timeline,screen:screen(cur)}));process.exitCode=2;return;}
            cur=await clickWait(mando,'open_mando',timeline);await wait(700);cur=await fresh();
            const initial=screen(cur), scrollHistory=[];
            let ns=cur.root?scan(cur.root):[];
            for(let k=0;k<6;k++){
              const got=controlCandidates(ns);
              const anyTarget=got.some(x=>/todos los tipos/i.test(norm(x.text)))&&got.some(x=>/todos los estados/i.test(norm(x.text)))&&got.some(x=>/limpiar filtros/i.test(norm(x.text))&&x.visible);
              if(anyTarget)break;
              const main=ns.find(n=>n.id==='0.0.0'&&n.visible&&n.scrollable)||ns.find(n=>n.visible&&n.scrollable&&n.path.startsWith('0.0.0'))||ns.find(n=>n.visible&&n.scrollable);
              if(!main)break;
              const before=screen(cur).hash;
              const sr=await action({action:'scroll',nodeId:main.id,direction:'forward'});
              timeline.push({step:'scroll_mando_'+(k+1),status:sr&&sr.status,reason:clean(sr&&sr.reason||sr&&sr.payload&&sr.payload.reason)});
              await wait(350);cur=await fresh();s=screen(cur);ns=cur.root?scan(cur.root):[];
              scrollHistory.push({step:k+1,hash:s.hash,nodeCount:s.nodeCount,controls:s.controls,hashChanged:!!before&&!!s.hash&&before!==s.hash});
            }
            s=screen(cur);ns=cur.root?scan(cur.root):[];
            const typeSel=findSelect(ns,'Todos los tipos'),statusSel=findSelect(ns,'Todos los estados');
            const clear=exact(ns,'Limpiar filtros',{visible:true,clickable:true,enabled:true});
            const outcomes=[];
            let typeApplied=false,statusApplied=false,restored=false;
            if(typeSel){
              cur=await clickWait(typeSel,'open_type_select',timeline);
              let r=await chooseOption(cur,'venta',timeline,'choose_type_venta');
              if(r.ok){typeApplied=true;cur=r.cur;outcomes.push({filter:'type',status:'selected_and_observed',selected:'venta',hashBefore:r.hashBefore,hashAfter:r.hashAfter,hashChanged:r.hashChanged,screen:r.snap});}
              else outcomes.push({filter:'type',status:r.stage,requested:'venta',screen:r.snap});
            } else outcomes.push({filter:'type',status:'SELECT_NOT_FOUND'});
            if(typeApplied){
              ns=cur.root?scan(cur.root):[];const st=findSelect(ns,'Todos los estados')||findSelect(ns,'venta')||ns.find(n=>n.visible&&n.enabled&&n.clickable&&/combobox|spinner|listbox/i.test(n.role+' '+n.className));
              if(st){
                cur=await clickWait(st,'open_status_select',timeline);
                const r=await chooseOption(cur,'error',timeline,'choose_status_error');
                if(r.ok){statusApplied=true;cur=r.cur;outcomes.push({filter:'status',status:'selected_and_observed',selected:'error',hashBefore:r.hashBefore,hashAfter:r.hashAfter,hashChanged:r.hashChanged,screen:r.snap});}
                else {cur=r.cur||cur;outcomes.push({filter:'status',status:r.stage,requested:'error',screen:r.snap});}
              }else outcomes.push({filter:'status',status:'SELECT_NOT_FOUND'});
            }
            ns=cur.root?scan(cur.root):[];
            const clearNow=exact(ns,'Limpiar filtros',{visible:true,clickable:true,enabled:true})||clear;
            let final=screen(cur);
            if(clearNow){
              cur=await clickWait(clearNow,'restore_all_audit_filters',timeline);await wait(400);final=screen(cur);
              const fns=cur.root?scan(cur.root):[];
              const c=controlCandidates(fns);
              const allTypes=c.some(x=>/todos los tipos/i.test(norm(x.text))&&x.visible);
              const allStates=c.some(x=>/todos los estados/i.test(norm(x.text))&&x.visible);
              restored=allTypes&&allStates;
              timeline.push({step:'verify_defaults_restored',status:restored?'succeeded':'unverified',allTypes,allStates});
            }else timeline.push({step:'restore_all_audit_filters',status:'NOT_FOUND'});
            const result={marker,ok:typeApplied&&statusApplied&&restored,build:{version_name:hp.version_name,version_code:hp.version_code,build_id:hp.build_id},
              timeline,initial:{hash:initial.hash,nodeCount:initial.nodeCount,controls:initial.controls},
              scrollHistory,outcomes,restoredToAll:restored,
              final:{hash:final.hash,nodeCount:final.nodeCount,controls:final.controls,states:final.states},
              safety:{onlyReadRpc:'listar_auditoria_admin',auditRecordsOpened:false,auditWrites:false,businessWrites:false,logoutClicked:false}};
            console.log(JSON.stringify(result));
            if(!result.ok)process.exitCode=3;
          })().catch(e=>{console.log(JSON.stringify({marker,ok:false,error:clean(String(e&&e.message||e))}));process.exitCode=1;});
          NODE"""
          metadata={'goal_source':'chat','source_application':'ChatGPT','project_name':'BattleCruiser','source':'battlecruiser_step4_mando_audit_filters_readonly_v2','verification_marker':marker,'device_id':device,'requested_device_id':device,'operation':'shell.execute','executor_type':'device','requested_capability':'shell.execute','command':command,'risk':'READ','timeout_ms':30000,'target_package':'com.android.chrome','allowed_hosts':['battlecruiser.robvg9.workers.dev'],'read_only':True,'business_data_mutated':False,'explicit_device_intent':True,'human_gate_required':False}
          def post(fn,payload,timeout=75):
              req=urllib.request.Request(base+'/'+fn,data=json.dumps(payload).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read().decode())
                  except:return e.code,{}
          code,body=post('aria-direct-v1',{'goal':'Ejecuta shell.execute en el dispositivo Android explicitado, usando el comando Node incluido en metadata para navegar con Accesibilidad Android autorizada en BattleCruiser LIVE al Centro de Mando. Cambia los filtros de auditoría a tipo venta y estado error, observa solo hashes y marcadores no personales, y pulsa Limpiar filtros para restaurar Todos. La fuente de filtros está comprobada: listar_auditoria_admin es RPC de lectura. No abras registros ni modifiques auditoría ni datos de negocio. Exige agente 1.1.23 exacto. Marcador BC_STEP4_MANDO_AUDIT_FILTERS_READONLY_V2.','mission_id':mission_id,'metadata':metadata})
          print('DISPATCH_HTTP='+str(code));print('MISSION_ID='+mission_id);print('DISPATCH_STATUS='+str(body.get('dispatch',{}).get('status','unknown')))
          if code>=300 or body.get('ok') is not True:print(json.dumps(body)[:1200]);raise SystemExit(2)
          terminal={'succeeded','failed','blocked','rejected','cancelled','human_required','paused'}
          last={}
          for i in range(1,61):
              c,last=post('aria-mission-runner-v22',{'mission_id':mission_id})
              s=str(last.get('status','unknown'));print('POLL='+json.dumps({'n':i,'http':c,'status':s,'error':last.get('error'),'next_action':last.get('next_action')}))
              if s in terminal or c in (401,403,404):break
              time.sleep(3)
          s=str(last.get('status','unknown'));print('FINAL_STATUS='+s);print('FINAL='+json.dumps({k:last.get(k) for k in ('ok','status','mission_id','error','next_action','executor_types','results') if k in last},ensure_ascii=False)[:6000])
          if s!='succeeded':raise SystemExit(1)
          PY
