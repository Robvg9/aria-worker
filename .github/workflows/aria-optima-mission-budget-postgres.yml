name: ARIA Optima — Mission Budget PostgreSQL Policy

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261126044200_aria_mission_budget_policy_v1.sql"
      - "tests/aria-mission-budget-policy-postgres.integration.test.mjs"
      - ".github/workflows/aria-optima-mission-budget-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aria-optima-mission-budget-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mission-budget-postgres:
    name: Apply mission budget migration and verify policy gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ARIA_OPTIMA_PG_INTEGRATION_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install PostgreSQL driver (ephemeral, no manifest change)
        run: npm install pg --no-save --no-fund --no-audit
      - name: Execute mission budget policy migration in isolated PostgreSQL
        run: node tests/aria-mission-budget-policy-postgres.integration.test.mjs
