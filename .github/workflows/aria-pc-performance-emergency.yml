name: ARIA PC Performance Emergency Recovery

on:
  push:
    branches: ["aria/self-improvement-v1-main"]
    paths:
      - '.github/workflows/aria-pc-performance-emergency.yml'
  workflow_dispatch:

concurrency:
  group: aria-meditation-final-certification-windows
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recover:
    name: recover-windows-performance
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      ARIA_ROOT: 'D:\ARIA-Windows-Agent'
    steps:
      - name: Checkout exact branch source
        shell: cmd
        run: |
          git config --global --add safe.directory "%CD%" 2>nul
          git fetch --no-tags --depth=1 origin aria/self-improvement-v1-main
          git checkout --detach --force FETCH_HEAD
          git rev-parse HEAD

      - name: Targeted physical performance recovery
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:ARIA_ROOT
          $runtime = Join-Path $root 'Runtime\windows'
          $statusPath = Join-Path $root 'Logs\status.json'
          $marker = Join-Path $root 'Data\pc-performance-recovery-last.json'

          function Read-Json($p) {
            if (Test-Path $p) {
              try { return (Get-Content -Raw $p | ConvertFrom-Json) } catch {}
            }
            return $null
          }

          Write-Host '=== ARIA PC PERFORMANCE EMERGENCY RECOVERY ==='
          $beforeOs = Get-CimInstance Win32_OperatingSystem
          Write-Host ("BEFORE_FREE_MB=" + [math]::Round($beforeOs.FreePhysicalMemory/1024))

          $before = @(Get-Process -Name node -ErrorAction SilentlyContinue | ForEach-Object {
            $p = $_
            $cmd = ''
            try { $cmd = (Get-CimInstance Win32_Process -Filter ("ProcessId=" + $p.Id)).CommandLine } catch {}
            [pscustomobject]@{ Id=$p.Id; Name='node'; RAM_MB=[math]::Round($p.WorkingSet64/1MB); CommandLine=$cmd }
          } | Sort-Object RAM_MB -Descending)
          $before | Select-Object -First 12 | Format-Table -AutoSize

          $watchdog = Read-Json $statusPath
          if ($watchdog -and $watchdog.agent_pid) {
            Write-Host ("ARIA_AGENT_PID_BEFORE=" + $watchdog.agent_pid)
          }

          $refresh = Join-Path $runtime 'refresh-agent-via-watchdog.ps1'
          if (Test-Path $refresh) {
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $refresh
            if ($LASTEXITCODE -ne 0) { throw ("Watchdog refresh failed: " + $LASTEXITCODE) }
            Write-Host 'WATCHDOG_REFRESH=PASS'
          }

          Start-Sleep -Seconds 3

          $ariaPids = @()
          $nodeWmi = @(Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue)
          foreach ($n in $nodeWmi) {
            if ($n.CommandLine -match 'aria-agent\.js|aria-worker[\\/]') { $ariaPids += [int]$n.ProcessId }
          }
          Write-Host ("ARIA_NODE_PIDS=" + (($ariaPids | Sort-Object -Unique) -join ','))

          $killed = @()
          foreach ($p in @(Get-Process -Name node -ErrorAction SilentlyContinue)) {
            if ($p.WorkingSet64 -lt 800MB) { continue }
            if ($ariaPids -contains $p.Id) { Write-Host ("KEEP_ARIA_NODE pid=" + $p.Id + " ram_mb=" + [math]::Round($p.WorkingSet64/1MB)); continue }
            Write-Host ("STOP_NON_ARIA_NODE pid=" + $p.Id + " ram_mb=" + [math]::Round($p.WorkingSet64/1MB))
            Stop-Process -Id $p.Id -Force -ErrorAction Stop
            $killed += $p.Id
          }

          foreach ($p in @(Get-Process -Name powershell,pwsh -ErrorAction SilentlyContinue)) {
            if ($p.Id -eq $PID) { continue }
            if ($p.WorkingSet64 -lt 1536MB) { continue }
            $cmd = ''
            try { $cmd = (Get-CimInstance Win32_Process -Filter ("ProcessId=" + $p.Id)).CommandLine } catch {}
            if ($cmd -match 'run-agent\.ps1|Runner\.Worker|Runner\.Listener|aria-agent\.js') { continue }
            Write-Host ("STOP_RUNAWAY_POWERSHELL pid=" + $p.Id + " ram_mb=" + [math]::Round($p.WorkingSet64/1MB))
            Stop-Process -Id $p.Id -Force -ErrorAction Stop
            $killed += $p.Id
          }

          $tempDirs = @($env:TEMP, $env:LOCALAPPDATA + '\Temp') | Select-Object -Unique
          foreach ($d in $tempDirs) {
            if (Test-Path $d) {
              Get-ChildItem -LiteralPath $d -Force -ErrorAction SilentlyContinue |
                Where-Object { $_.LastWriteTime -lt (Get-Date).AddHours(-6) } |
                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          $afterOs = Get-CimInstance Win32_OperatingSystem
          $after = @(Get-Process | Sort-Object WorkingSet64 -Descending | Select-Object -First 12 Id,ProcessName,@{N='RAM_MB';E={[math]::Round($_.WorkingSet64/1MB)}},CPU)
          Write-Host ("AFTER_FREE_MB=" + [math]::Round($afterOs.FreePhysicalMemory/1024))
          Write-Host ("KILLED_PIDS=" + (($killed | Sort-Object -Unique) -join ','))
          $after | Format-Table -AutoSize

          $record = [ordered]@{
            version='aria-pc-performance-recovery-v1'
            source_sha=(git rev-parse HEAD)
            timestamp=(Get-Date).ToUniversalTime().ToString('o')
            before_free_mb=[math]::Round($beforeOs.FreePhysicalMemory/1024)
            after_free_mb=[math]::Round($afterOs.FreePhysicalMemory/1024)
            killed_pids=@($killed | Sort-Object -Unique)
            aria_node_pids=@($ariaPids | Sort-Object -Unique)
            status='succeeded'
          }
          $record | ConvertTo-Json -Depth 6 | Set-Content -Path $marker -Encoding UTF8 -Force
          Write-Host 'PC_PERFORMANCE_RECOVERY=PASS'

      - name: Verify recovery marker and runtime ownership
        shell: powershell
        run: |
          $marker = Join-Path $env:ARIA_ROOT 'Data\pc-performance-recovery-last.json'
          if (-not (Test-Path $marker)) { throw 'Recovery marker missing' }
          $r = Get-Content -Raw $marker | ConvertFrom-Json
          if ($r.status -ne 'succeeded') { throw 'Recovery marker not succeeded' }
          Write-Host ("VERIFY_STATUS=" + $r.status)
          Write-Host ("VERIFY_BEFORE_FREE_MB=" + $r.before_free_mb)
          Write-Host ("VERIFY_AFTER_FREE_MB=" + $r.after_free_mb)
          Write-Host ("VERIFY_KILLED=" + (($r.killed_pids) -join ','))
          Write-Host 'PC_PERFORMANCE_VERIFICATION=PASS'
