name: ARIA Phase 7 Multimodal LIVE Provider E2E v10

on:
  push:
    branches:
      - fix/phase7-multimodal-live-e2e-20260930

permissions:
  contents: read

jobs:
  multimodal-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RWHT_EMAIL: ${{ secrets.RWHT_EMAIL }}
      RWHT_PASSWORD: ${{ secrets.RWHT_PASSWORD }}
      RWHT_PUBLISHABLE_KEY: ${{ vars.RWHT_PUBLISHABLE_KEY || 'sb_publishable_E2AmZNo2hAbOYlytkVbyBQ_X7JH0HPw' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify certified PWA LIVE build
        run: |
          expected="af9c816a013d83e08675ba4486edab5b7b1f38b1"
          version="$(curl --fail --silent --show-error --retry 3 --retry-delay 1 "https://aria.robvg9.workers.dev/pwa/version.json?persist-recovery=$expected")"
          live_build="$(printf '%s' "$version" | python -c 'import json,sys; print(json.load(sys.stdin)["build"])')"
          test "$live_build" = "$expected"
          echo "MULTIMODAL_LIVE_BUILD_OK build=$live_build"
      - name: Install Chromium
        working-directory: rwht/pc-browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
      - name: Execute real multimodal provider E2E
        working-directory: rwht/pc-browser
        env:
          RWHT_PWA_URL: https://aria.robvg9.workers.dev/pwa/
          RWHT_API_BASE: https://aria.robvg9.workers.dev
        run: node rwht-multimodal-live-provider-e2e-v7.cjs
