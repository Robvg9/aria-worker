name: Deploy ARIA autonomy coordinator (independent)

on:
  workflow_dispatch:
    inputs:
      confirm_public_deploy:
        description: "Deploy the isolated ARIA coordinator and verify auth plus the global freeze. Telegram test is a separate opt-in."
        type: boolean
        required: true
        default: false
      send_telegram_test:
        description: "Opt in to one real Telegram delivery test after deployment. Leave false for deploy-only."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: inputs.confirm_public_deploy == true
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate isolated coordinator
        run: |
          set -euo pipefail
          node --check cloudflare-autonomy/worker.mjs
          node tests/cloudflare-autonomy-worker.test.js
      - name: Validate deployment secrets without printing them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARIA_CONTROL_TOKEN: ${{ secrets.ARIA_AUTONOMY_CONTROL_TOKEN }}
          ARIA_WORKER_TOKEN: ${{ secrets.ARIA_AUTONOMY_WORKER_TOKEN }}
          ARIA_PLAN_PRODUCER_SHARED_SECRET: ${{ secrets.ARIA_PLAN_PRODUCER_SHARED_SECRET }}
          ARIA_NOTIFICATION_WEBHOOK_URL: ${{ secrets.ARIA_AUTONOMY_NOTIFICATION_WEBHOOK_URL }}
          ARIA_NOTIFICATION_TOKEN: ${{ secrets.ARIA_AUTONOMY_NOTIFICATION_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys

          control = os.environ.get("ARIA_CONTROL_TOKEN", "")
          worker = os.environ.get("ARIA_WORKER_TOKEN", "")
          bridge = os.environ.get("ARIA_PLAN_PRODUCER_SHARED_SECRET", "")
          webhook = os.environ.get("ARIA_NOTIFICATION_WEBHOOK_URL", "")

          checks = {
              "CLOUDFLARE_API_TOKEN_PRESENT": bool(os.environ.get("CLOUDFLARE_API_TOKEN", "")),
              "CLOUDFLARE_ACCOUNT_ID_PRESENT": bool(os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")),
              "ARIA_CONTROL_TOKEN_LENGTH_GE_32": len(control) >= 32,
              "ARIA_WORKER_TOKEN_LENGTH_GE_32": len(worker) >= 32,
              "ARIA_PLAN_PRODUCER_SHARED_SECRET_LENGTH_GE_32": len(bridge) >= 32,
              "ARIA_PLAN_SECRET_DISTINCT_FROM_CONTROL_AND_WORKER": bool(bridge and bridge != control and bridge != worker),
              "ARIA_CONTROL_WORKER_TOKENS_DISTINCT": bool(control and worker and control != worker),
              "OPTIONAL_NOTIFICATION_WEBHOOK_HTTPS": not webhook or webhook.startswith("https://"),
          }
          for name, passed in checks.items():
              print(f"{name}={'PASS' if passed else 'FAIL'}")
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              print("ARIA_AUTONOMY_DEPLOY_PREFLIGHT_FAILED=" + ",".join(failed))
              sys.exit(1)
          print("ARIA_AUTONOMY_DEPLOY_SECRETS_VALID=true")
          PY
      - name: Install Wrangler
        run: npm install --global wrangler@latest
      - name: Deploy isolated Worker and Durable Object
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARIA_CONTROL_TOKEN: ${{ secrets.ARIA_AUTONOMY_CONTROL_TOKEN }}
          ARIA_WORKER_TOKEN: ${{ secrets.ARIA_AUTONOMY_WORKER_TOKEN }}
          ARIA_PLAN_PRODUCER_SHARED_SECRET: ${{ secrets.ARIA_PLAN_PRODUCER_SHARED_SECRET }}
          ARIA_NOTIFICATION_WEBHOOK_URL: ${{ secrets.ARIA_AUTONOMY_NOTIFICATION_WEBHOOK_URL }}
          ARIA_NOTIFICATION_TOKEN: ${{ secrets.ARIA_AUTONOMY_NOTIFICATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .aria-autonomy-secrets.json' EXIT
          python - <<'PY'
          import hashlib, hmac, json, os
          bridge_secret = os.environ["ARIA_PLAN_PRODUCER_SHARED_SECRET"]
          if len(bridge_secret) < 32:
              raise SystemExit("ARIA_PLAN_PRODUCER_SHARED_SECRET_INVALID")
          derived = hmac.new(bridge_secret.encode("utf-8"), b"aria-cloudflare-plan-producer:v1", hashlib.sha256).hexdigest()
          payload = {
              "ARIA_CONTROL_TOKEN": os.environ["ARIA_CONTROL_TOKEN"],
              "ARIA_WORKER_TOKEN": os.environ["ARIA_WORKER_TOKEN"],
              "ARIA_PLAN_PRODUCER_TOKEN": derived,
          }
          for key in ("ARIA_NOTIFICATION_WEBHOOK_URL", "ARIA_NOTIFICATION_TOKEN"):
              if os.environ.get(key):
                  payload[key] = os.environ[key]
          with open(".aria-autonomy-secrets.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY
          wrangler deploy --config wrangler.aria-autonomy.toml --secrets-file .aria-autonomy-secrets.json
          echo "ARIA_AUTONOMY_CLOUDFLARE_DEPLOY_COMMAND_COMPLETED=true"
      - name: Verify live health, auth, frozen scope and canonical plan bridge
        env:
          ARIA_CONTROL_TOKEN: ${{ secrets.ARIA_AUTONOMY_CONTROL_TOKEN }}
          ARIA_WORKER_TOKEN: ${{ secrets.ARIA_AUTONOMY_WORKER_TOKEN }}
          ARIA_PLAN_PRODUCER_SHARED_SECRET: ${{ secrets.ARIA_PLAN_PRODUCER_SHARED_SECRET }}
        run: |
          set -euo pipefail
          base="https://aria-autonomy-coordinator.robvg9.workers.dev"
          PLAN_PRODUCER_TOKEN="$(python - <<'PY'
          import hashlib, hmac, os
          print(hmac.new(os.environ["ARIA_PLAN_PRODUCER_SHARED_SECRET"].encode("utf-8"), b"aria-cloudflare-plan-producer:v1", hashlib.sha256).hexdigest())
          PY
          )"
          health="$(curl --fail --silent --show-error --max-time 15 "$base/health")"
          HEALTH="$health" python - <<'PY'
          import json, os
          x=json.loads(os.environ["HEALTH"])
          assert x.get("ok") is True
          assert x.get("supabase_independent") is True
          PY
          code="$(curl --silent --show-error --max-time 15 -o /tmp/aria-autonomy-unauth.json -w '%{http_code}' "$base/api/missions")"
          test "$code" = "401"
          code="$(curl --silent --show-error --max-time 15 -o /tmp/aria-autonomy-auth.json -w '%{http_code}' "$base/api/missions" -H "Authorization: Bearer $ARIA_CONTROL_TOKEN")"
          test "$code" = "200"
          code="$(curl --silent --show-error --max-time 15 -o /tmp/aria-autonomy-create-paused.json -w '%{http_code}' -X POST "$base/api/missions" -H "Authorization: Bearer $ARIA_CONTROL_TOKEN" -H 'content-type: application/json' --data-binary '{')"
          test "$code" = "423"
          code="$(curl --silent --show-error --max-time 15 -o /tmp/aria-autonomy-resume-paused.json -w '%{http_code}' -X POST "$base/api/missions/freeze-probe/resume" -H "Authorization: Bearer $ARIA_CONTROL_TOKEN" -H 'content-type: application/json' --data-binary '{')"
          test "$code" = "423"
          code="$(curl --silent --show-error --max-time 15 -o /tmp/aria-autonomy-approval-paused.json -w '%{http_code}' -X POST "$base/api/approvals/freeze-probe" -H "Authorization: Bearer $ARIA_CONTROL_TOKEN" -H 'content-type: application/json' --data-binary '{')"
          test "$code" = "423"
          code="$(curl --silent --show-error --max-time 15 -o /tmp/aria-autonomy-claim-paused.json -w '%{http_code}' -X POST "$base/api/worker/claim" -H "Authorization: Bearer $ARIA_WORKER_TOKEN" -H 'content-type: application/json' --data-binary '{')"
          test "$code" = "423"
          echo "ARIA_AUTONOMY_LIVE_HEALTH_AUTH_AND_GLOBAL_FREEZE_PASS=true"
          preview_file="$RUNNER_TEMP/aria-workspace-plan-preview.json"
          preview_code="$(curl --silent --show-error --max-time 25 -o "$preview_file" -w '%{http_code}' \
            -X POST "$base/api/plan-preview" \
            -H "Authorization: Bearer $ARIA_CONTROL_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"goal":"Read-only verification of the canonical workspace plan bridge","cloudflare_workspace_request":{"version":"v1","allowed_operations":["git.status"],"workspace_context":{"root":"workspace"}}}')"
          test "$preview_code" = "200"
          PREVIEW_FILE="$preview_file" python - <<'PY'
          import json, os
          with open(os.environ["PREVIEW_FILE"], encoding="utf-8") as handle:
              data = json.load(handle)
          assert data.get("ok") is True
          assert data.get("source") == "supabase:aria-planner-v11"
          assert data.get("durable_state_mutated") is False
          model = data.get("model") or {}
          assert model.get("provider_id") == "openrouter"
          assert model.get("account_id") == "acct_openrouter_primary"
          assert model.get("model_id") == "nvidia/nemotron-3.5-lightning:free"
          assert model.get("executor") == "aria-execution-runtime-v1"
          tasks = data.get("tasks") or []
          assert len(tasks) == 1
          assert tasks[0].get("operation") == "git.status"
          print("ARIA_CANONICAL_REMOTE_PLAN_PREVIEW_PASS=true")
          PY
          control_plan_code="$(curl --silent --show-error --max-time 15 -o "$RUNNER_TEMP/aria-plan-control-denied.json" -w '%{http_code}' \
            -X POST "$base/api/missions/frozen-producer-auth-probe/plan" \
            -H "Authorization: Bearer $ARIA_CONTROL_TOKEN" \
            -H 'content-type: application/json' --data '{"tasks":[]}')"
          test "$control_plan_code" = "401"
          producer_plan_code="$(curl --silent --show-error --max-time 15 -o "$RUNNER_TEMP/aria-plan-freeze-probe.json" -w '%{http_code}' \
            -X POST "$base/api/missions/frozen-producer-auth-probe/plan" \
            -H "Authorization: Bearer $PLAN_PRODUCER_TOKEN" \
            -H 'content-type: application/json' --data '{"tasks":[]}')"
          test "$producer_plan_code" = "423"
          echo "ARIA_REMOTE_PLAN_PRODUCER_AUTH_AND_GLOBAL_FREEZE_PASS=true"
      - name: Send one explicitly confirmed Telegram delivery test
        if: inputs.send_telegram_test == true
        env:
          ARIA_CONTROL_TOKEN: ${{ secrets.ARIA_AUTONOMY_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          base="https://aria-autonomy-coordinator.robvg9.workers.dev"
          response_file="$RUNNER_TEMP/aria-telegram-delivery-test.json"
          code="$(curl --silent --show-error --max-time 20 -o "$response_file" -w '%{http_code}' \
            -X POST "$base/api/notifications/test" \
            -H "Authorization: Bearer $ARIA_CONTROL_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"confirm":"SEND_TELEGRAM_TEST_ONCE"}')"
          test "$code" = "200"
          RESULT_FILE="$response_file" python - <<'PY'
          import json, os
          with open(os.environ["RESULT_FILE"], encoding="utf-8") as handle:
              result = json.load(handle)
          notice = result.get("notification") or {}
          assert notice.get("status") == "delivered"
          assert notice.get("attempts") == 1
          assert notice.get("delivered_at")
          assert notice.get("last_error") is None
          print("ARIA_TELEGRAM_REAL_DELIVERY_PASS=true")
          print("ARIA_TELEGRAM_NOTIFICATION_STATUS=delivered")
          PY
