name: BattleCruiser Step 4 Android Movimientos Navigation and Scroll V1 (Read Only)
on:
  push:
    branches: [aria/bc-step4-android-e2e-20261021]
    paths: [.github/workflows/battlecruiser-step4-android-movimientos-scroll-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-step4-android-movimientos-scroll-v1-notification-probe-v2
  cancel-in-progress: true
jobs:
  android-movimientos-scroll-v1:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Open Movimientos, test body scroll forward/back, and capture hashes only
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.request, urllib.error
          project=os.environ.get('SUPABASE_PROJECT_REF','').strip()
          secret=os.environ.get('ARIA_RUNTIME_SHARED_SECRET','')
          if not project or not secret: raise SystemExit('BLOCKED: production secrets unavailable; values are not printed')
          base=f'https://{project}.supabase.co/functions/v1'
          headers={'Authorization':'Bearer '+secret,'content-type':'application/json','cache-control':'no-store'}
          mid=f"mission_bc_step4_android_movimientos_scroll_v1_{os.environ['RUN_ID']}_{os.environ['RUN_ATTEMPT']}"
          device='android-termux-a1ebcfc7-9287-4603-a0f9-c519d12fd092'
          marker='BC_STEP4_ANDROID_MOVIMIENTOS_SCROLL_V1'
          command=r"""node <<'NODE'
          const {executeAndroidAccessibilityJob,executeAndroidCommandReceiver,probeLocalIpcHealth}=require('./computer-use/android-accessibility-v1.js');
          const {spawnSync}=require('node:child_process');
          const marker='BC_STEP4_ANDROID_MOVIMIENTOS_SCROLL_V1',host='battlecruiser.robvg9.workers.dev';
          const base={target_package:'com.android.chrome',allow_any_app:false,allowed_hosts:[host]};
          const clean=s=>typeof s==='string'?s.replace(/\s+/g,' ').trim().replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig,'[redacted]').slice(0,120):'';
          const norm=s=>clean(s).toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n').replace(/[‐-‒–—]/g,'-').trim();
          const stateFromText=s=>{const m=norm(s).match(/estado de la opcion:\s*(activada|desactivada)\./);return m?m[1]:null;};
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          async function send(q,timeoutMs=5000){return await executeAndroidAccessibilityJob({command:JSON.stringify({...base,...q}),timeoutMs});}
          async function observe(){const r=await send({operation:'observe'},3500),p=r&&r.payload||{},root=p.root||(p.ui&&p.ui.root)||null;return {r,p,root};}
          async function action(a){return await send({operation:'action',action:a},6000);}
          function scan(root){
            const nodes=[],seen=new Set();let count=0;
            const walk=(n,path,d)=>{
              if(!n||typeof n!=='object'||Array.isArray(n)||seen.has(n)||d>28||count>=1200)return;
              seen.add(n);count++;
              const names=['name','label','contentDescription','text','hint'].map(k=>clean(n[k])).filter(Boolean);
              nodes.push({id:typeof n.id==='string'&&n.id?n.id:path,path,role:clean(n.role),className:clean(n.className||n.class),names,
                text:names.join(' | '),visible:n.visible!==false,clickable:!!n.clickable,enabled:n.enabled!==false,
                checkable:typeof n.checkable==='boolean'?n.checkable:null,checked:typeof n.checked==='boolean'?n.checked:null,nodeRefreshSucceeded:typeof n.nodeRefreshSucceeded==='boolean'?n.nodeRefreshSucceeded:null,
                scrollable:!!n.scrollable,bounds:n.bounds||null});
              if(Array.isArray(n.children))n.children.forEach((c,i)=>walk(c,path+'.'+i,d+1));
            };
            walk(root,'0',0);return {nodeCount:count,nodes};
          }
          const defs=[
            {key:'auto_refresh',re:/actualizacion automatica/},
            {key:'sync_auto',re:/sincronizacion automatica/},
            {key:'sync_on_open',re:/sincronizar al abrir app/},
            {key:'sync_wifi_only',re:/sincronizar solo en wi.?fi/},
            {key:'notifications',re:/notificaciones/},
            {key:'compact_mode',re:/modo compacto/}
          ];
          function centerY(x){return x&&x.bounds&&Number.isFinite(Number(x.bounds.top))&&Number.isFinite(Number(x.bounds.bottom))?(Number(x.bounds.top)+Number(x.bounds.bottom))/2:null;}
          function nearbyState(chosen, allNodes){
            const direct=chosen.map(x=>stateFromText(x.text)).find(Boolean);
            if(direct)return {state:direct,source:'control_description',delta_px:0};
            const anchor=chosen.find(x=>centerY(x)!==null&&['switch','checkbox'].includes(norm(x.role)))||chosen.find(x=>centerY(x)!==null);
            const y=centerY(anchor);
            if(y===null)return {state:null,source:'missing',delta_px:null};
            let best=null;
            for(const candidate of allNodes){
              const state=candidate.visible?stateFromText(candidate.text):null,cy=centerY(candidate);
              if(!state||cy===null)continue;
              const delta=Math.abs(cy-y);
              if(!best||delta<best.delta)best={state,delta};
            }
            if(best&&best.delta<=100)return {state:best.state,source:'adjacent_visible_state_label',delta_px:Math.round(best.delta)};
            return {state:null,source:'missing',delta_px:best?Math.round(best.delta):null};
          }
          function snapshot(obs){
            const sc=scan(obs.root),n=sc.nodes;
            const controls=defs.map(d=>{
              const matches=n.filter(x=>x.names.some(t=>d.re.test(norm(t)))||d.re.test(norm(x.text)));
              const switchNodes=matches.filter(x=>['switch','checkbox'].includes(norm(x.role))||/switch|checkbox/i.test(x.className)||x.checkable===true);
              const chosen=switchNodes.length?switchNodes:matches;
              const stateEvidence=nearbyState(chosen,n);
              return {key:d.key,match_count:matches.length,state_text:stateEvidence.state,state_source:stateEvidence.source,state_delta_px:stateEvidence.delta_px,nodes:chosen.slice(0,6).map(x=>({id:x.id,path:x.path,role:x.role,className:x.className,text:x.text,checkable:x.checkable,checked:x.checked,nodeRefreshSucceeded:x.nodeRefreshSucceeded,enabled:x.enabled,visible:x.visible}))};
            });
            const prefsTitleVisible=n.some(x=>x.visible&&x.names.some(t=>norm(t)==='preferencias personales'));
            const relevantMenu=n.filter(x=>x.visible&&x.names.some(t=>['abrir menu','cerrar menu','configuracion','conectividad','preferencias'].includes(norm(t))))
              .slice(0,12).map(x=>({id:x.id,text:x.text,visible:x.visible,clickable:x.clickable,enabled:x.enabled,scrollable:x.scrollable}));
            const visibleText=sc.nodes.filter(x=>x.visible&&x.text).slice(0,100).map(x=>({id:x.id,role:x.role,text:x.text,bounds:x.bounds}));
            const scrollables=sc.nodes.filter(x=>x.visible&&x.scrollable).map(x=>({id:x.id,path:x.path,role:x.role,text:x.text,bounds:x.bounds})).slice(0,12);
            const preferenceStates=sc.nodes.filter(x=>/estado de la opcion:\s*(activada|desactivada)\./.test(norm(x.text))).map(x=>({id:x.id,path:x.path,role:x.role,state:stateFromText(x.text),text:x.text,visible:x.visible,enabled:x.enabled,bounds:x.bounds})).slice(0,12);
            const appMarkers=sc.nodes.filter(x=>x.visible&&x.text&&/login|usuario|contrase[nñ]a|entrar|iniciar sesi[oó]n|battlecruiser|centro de control|abrir men[uú]|preferencias|actualizaci[oó]n autom[aá]tica|sincronizaci[oó]n autom[aá]tica/i.test(x.text)).slice(0,50).map(x=>({id:x.id,role:x.role,text:x.text,bounds:x.bounds}));
            return {packageName:clean(obs.p.packageName||(obs.p.ui&&obs.p.ui.packageName)),evidenceHash:obs.p.evidence_hash||null,uiEvidenceHash:obs.p.ui&&obs.p.ui.evidence_hash||null,nodeCount:sc.nodeCount,prefsTitleVisible,controls,relevantMenu,appMarkers,visibleText,scrollables,preferenceStates};
          }
          (async()=>{
            let health=await probeLocalIpcHealth({timeoutMs:2200});
            let bootstrap=null, termuxOpen=null, diagBefore=null, observeRecovery=null, recoveryNotification=null;
            const safeProbe=(bin,args,timeout=1800)=>{
              try {
                const r=spawnSync(bin,args,{encoding:'utf8',timeout,maxBuffer:250000});
                const raw=String(r.stdout||r.stderr||'').replace(/\\r/g,'');
                return {status:r.status,error:r.error?String(r.error.message||r.error):null,output:clean(raw).slice(0,650)};
              } catch(e) { return {status:null,error:clean(String(e&&e.message||e)),output:''}; }
            };
            const localHealthSummary=h=>({ok:h&&h.ok===true,status:h&&h.status||null,reason:clean(h&&h.reason||''),transport:h&&h.metadata&&h.metadata.transport||null,expected_protocol:h&&h.metadata&&h.metadata.expected_protocol||null,actual_protocol:h&&h.metadata&&h.metadata.actual_protocol||null,version_name:h&&h.metadata&&h.metadata.version_name||h&&h.payload&&h.payload.version_name||null,version_code:h&&h.metadata&&h.metadata.version_code||h&&h.payload&&h.payload.version_code||null,build_id:h&&h.metadata&&h.metadata.build_id||h&&h.payload&&h.payload.build_id||null});
            if(!health||health.ok!==true){
              // Diagnostic is read-only; it reports only installed package metadata and accessibility-service state.
              diagBefore={
                uid:safeProbe('id',[]),
                tools:safeProbe('sh',['-c','command -v termux-open-url; command -v pm; command -v settings; command -v dumpsys; command -v am']),
                installedAgentPackage:safeProbe('pm',['dump','com.robvg9.ariauiagent.debug']),
                accessibilityEnabled:safeProbe('settings',['get','secure','accessibility_enabled']),
                enabledAccessibilityServices:safeProbe('settings',['get','secure','enabled_accessibility_services']),
                accessibilityEnabledUser0:safeProbe('settings',['--user','0','get','secure','accessibility_enabled']),
                enabledAccessibilityServicesUser0:safeProbe('settings',['--user','0','get','secure','enabled_accessibility_services']),
                agentProcessVisibility:safeProbe('sh',['-c',"ps -A | grep -i 'ariauiagent\\|termux' | head -12"])
              };
              // Try the ordinary Android URL-intent route (no form submission or business write).
              termuxOpen=safeProbe('termux-open-url',['https://'+host+'/'],3500);
              await pause(1400);
              health=await probeLocalIpcHealth({timeoutMs:2200});
              if(!health||health.ok!==true){
                try{
                  bootstrap=await send({operation:'action',action:{action:'wait',ms:0}},4500);
                  await pause(450);
                  health=await probeLocalIpcHealth({timeoutMs:2200});
                }catch(e){bootstrap={status:'failed',reason:clean(String(e&&e.message||e))};}
              }
              if(!health||health.ok!==true){
                try{
                  observeRecovery=await send({operation:'observe'},4500);
                  await pause(300);
                  health=await probeLocalIpcHealth({timeoutMs:2200});
                }catch(e){observeRecovery={status:'failed',reason:clean(String(e&&e.message||e))};}
              }
              if(!health||health.ok!==true){
                // One local heads-up helps the owner restore the OS-protected service; this is not used as test evidence.
                recoveryNotification=safeProbe('termux-notification',[
                  '--id','bc-step4-accessibility-recovery-20261021',
                  '--title','BattleCruiser — Paso 4/15',
                  '--content','Acción manual puntual: abre ARIA Local Mission y confirma que su servicio de Accesibilidad esté activado. El control remoto no puede abrir Ajustes desde segundo plano.',
                  '--priority','high','--alert-once'
                ],3000);
                if(recoveryNotification.status===0){
                  await pause(15000);
                  health=await probeLocalIpcHealth({timeoutMs:2500});
                }
              }
            }
            const hp=health&&health.payload||{};
            const hm=health&&health.metadata||{};
            const agentBuild={ok:health&&health.ok===true,version_name:hp.version_name||hm.version_name||null,version_code:hp.version_code||hm.version_code||null,build_id:hp.build_id||hm.build_id||null};
            agentBuild.exact_build=agentBuild.ok===true&&String(agentBuild.version_name)==='1.1.23'&&Number(agentBuild.version_code)===29&&String(agentBuild.build_id)==='3708b31b319884f7d42082414a82cdd11450fe2d';
            if(!agentBuild.exact_build){
              console.log(JSON.stringify({marker,ok:false,stage:'android_accessibility_ipc_or_exact_build_unavailable',agentBuild,
                health:localHealthSummary(health),
                preflight:diagBefore,
                openBattleCruiserViaAndroid:termuxOpen,
                recoveryNotification,
                readOnlyWait:bootstrap?{status:bootstrap.status||null,reason:clean(bootstrap.reason||bootstrap.payload&&bootstrap.payload.reason||''),transport:bootstrap.metadata&&bootstrap.metadata.transport||null,attempt:bootstrap.metadata&&bootstrap.metadata.attempt||null,recovery_attempted:bootstrap.metadata&&bootstrap.metadata.recovery_attempted===true,fallback_reason:clean(bootstrap.metadata&&bootstrap.metadata.fallback_reason||''),payload_build:{version_name:bootstrap.payload&&bootstrap.payload.version_name||null,version_code:bootstrap.payload&&bootstrap.payload.version_code||null,build_id:bootstrap.payload&&bootstrap.payload.build_id||null}}:null,
                readOnlyObserve:observeRecovery?{status:observeRecovery.status||null,reason:clean(observeRecovery.reason||observeRecovery.payload&&observeRecovery.payload.reason||''),transport:observeRecovery.metadata&&observeRecovery.metadata.transport||null,attempt:observeRecovery.metadata&&observeRecovery.metadata.attempt||null,recovery_attempted:observeRecovery.metadata&&observeRecovery.metadata.recovery_attempted===true}:null
              }));process.exitCode=20;return;
            }
            const actions=[];
            let current=await observe();
            if(!current.root||current.p.ok!==true){
              actions.push({action:'initial_observe',status:'blocked',reason:clean(current.r&&current.r.reason||current.p.reason||'window_unavailable')});
              const nav=await action({action:'navigate',url:'https://'+host+'/'});
              actions.push({action:'recover_by_supported_navigation_before_launch',status:nav&&nav.status||'unknown',reason:clean(nav&&nav.reason||nav&&nav.payload&&nav.payload.reason||'')});
              for(let i=0;i<8&&(!current.root||current.p.ok!==true);i++){await pause(750);current=await observe();}
            }
            if(!current.root||current.p.ok!==true){
              const launch=await action({action:'launch_app'});
              actions.push({action:'supported_launch_app_fallback',status:launch&&launch.status||'unknown',reason:clean(launch&&launch.reason||launch&&launch.payload&&launch.payload.reason||''),recovery:launch&&launch.metadata&&launch.metadata.recovery_attempted===true});
              for(let i=0;i<8&&(!current.root||current.p.ok!==true);i++){await pause(750);current=await observe();}
            }
            if(!current.root||current.p.ok!==true){console.log(JSON.stringify({marker,ok:false,stage:'active_window_unavailable_after_supported_recovery',actions,reason:clean(current.r&&current.r.reason||current.p.reason)}));process.exitCode=1;return;}
            let sc=scan(current.root);
            const labelOf=n=>n.names.join(' | ');
            const exact=(re,opts={})=>sc.nodes.find(x=>x.names.some(t=>re.test(norm(t)))&&(!opts.visible||x.visible)&&(!opts.clickable||x.clickable)&&(!opts.enabled||x.enabled));
            const isBattleCruiserUI=n=>n.visible&&n.names.some(t=>/^abrir menu$|^cerrar menu$|^centro de control$|^productos$|^movimientos(?: de inventario)?$/i.test(norm(t)));
            let pageReady=sc.nodes.some(isBattleCruiserUI);
            let navigationSucceeded=pageReady;
            if(pageReady){
              actions.push({action:'reuse_current_battlecruiser_screen',status:'succeeded'});
            }else{
              const nav=await action({action:'navigate',url:'https://'+host+'/'});
              actions.push({action:'navigate_via_local_accessibility_ipc',status:nav&&nav.status||'unknown',reason:clean(nav&&nav.reason||nav&&nav.payload&&nav.payload.reason||''),recovery:nav&&nav.metadata&&nav.metadata.recovery_attempted===true});
              for(let i=0;i<10;i++){
                await pause(750);
                current=await observe();
                if(current.root&&current.p.ok===true){
                  sc=scan(current.root);
                  pageReady=sc.nodes.some(isBattleCruiserUI);
                  if(pageReady) break;
                }
              }
              if(!current.root||current.p.ok!==true){
                const launch=await action({action:'launch_app'});
                actions.push({action:'supported_launch_app_fallback',status:launch&&launch.status||'unknown',reason:clean(launch&&launch.reason||launch&&launch.payload&&launch.payload.reason||'')});
                for(let i=0;i<8&&(!current.root||current.p.ok!==true);i++){await pause(750);current=await observe();}
                if(current.root&&current.p.ok===true){sc=scan(current.root);pageReady=sc.nodes.some(isBattleCruiserUI);}
              }
              navigationSucceeded=!!(current.root&&current.p.ok===true&&pageReady);
              if(!navigationSucceeded){
                const visibleLabels=(current.root?sc.nodes:[]).filter(x=>x.visible&&x.text&&/abrir men[uú]|cerrar men[uú]|centro de control|productos|ventas|movimientos|iniciar sesi[oó]n|usuario|contrase[nñ]a|battlecruiser|inventario/i.test(x.text)).slice(0,30).map(x=>({role:x.role,text:x.text}));
                console.log(JSON.stringify({marker,ok:false,stage:'battlecruiser_ui_not_detected_after_supported_recovery',actions,screen:{hash:current.p&&current.p.evidence_hash||null,nodeCount:current.root?sc.nodeCount:0,visibleLabels}}));process.exitCode=2;return;
              }
            }
            let target=exact(/^movimientos$/,{visible:true,clickable:true,enabled:true})||exact(/^movimientos de inventario$/,{visible:true,clickable:true,enabled:true});
            let r=null;
            if(!target){
              const close=exact(/^cerrar menu$/,{visible:true,clickable:true,enabled:true});
              const open=exact(/^abrir menu$/,{visible:true,clickable:true,enabled:true}) || sc.nodes.find(x=>x.visible&&x.clickable&&x.enabled&&x.role==='button'&&/android\.widget\.(Button|ImageButton)/i.test(x.className)&&x.names.some(t=>/menu|menú|navigation|drawer/i.test(norm(t))));
              if(close){
                actions.push({action:'menu_already_open',target:close.id,status:'succeeded'});
              }else{
                if(!open){const visibleLabels=sc.nodes.filter(x=>x.visible&&x.text&&/abrir men[uú]|cerrar men[uú]|centro de control|productos|ventas|movimientos|inventario/i.test(x.text)).slice(0,30).map(x=>({role:x.role,text:x.text}));console.log(JSON.stringify({marker,ok:false,stage:'menu_button_missing',actions,screen:{hash:current.p.evidence_hash||null,nodeCount:sc.nodeCount,visibleLabels}}));process.exitCode=3;return;}
                r=await action({action:'click',nodeId:open.id});
                actions.push({action:'open_menu',target:open.id,status:r&&r.status,reason:clean(r&&r.reason||r&&r.payload&&r.payload.reason)});
              }
              await pause(900);current=await observe();
              if(!current.root||current.p.ok!==true){console.log(JSON.stringify({marker,ok:false,stage:'observe_after_menu',actions,reason:clean(current.r&&current.r.reason||current.p.reason)}));process.exitCode=4;return;}
              sc=scan(current.root);
              target=exact(/^movimientos$/,{visible:true,clickable:true,enabled:true})||exact(/^movimientos de inventario$/,{visible:true,clickable:true,enabled:true});
            }
            for(let i=0;i<4&&!target;i++){

              const drawer=sc.nodes.find(x=>x.visible&&x.scrollable&&x.path.startsWith('0.0.0.0.2'))||sc.nodes.find(x=>x.visible&&x.scrollable);
              if(!drawer)break;
              r=await action({action:'scroll',nodeId:drawer.id,direction:i<2?'backward':'forward'});
              actions.push({action:'scroll_menu',target:drawer.id,status:r&&r.status,reason:clean(r&&r.reason||r&&r.payload&&r.payload.reason)});
              await pause(350);current=await observe();if(!current.root||current.p.ok!==true)break;sc=scan(current.root);
              target=exact(/^movimientos$/,{visible:true,clickable:true,enabled:true})||exact(/^movimientos de inventario$/,{visible:true,clickable:true,enabled:true});
            }
            if(!target){console.log(JSON.stringify({marker,ok:false,stage:'movimientos_menu_item_missing',actions,screen:{hash:current.p.evidence_hash||null,nodeCount:sc.nodeCount,visibleScrollableCount:sc.nodes.filter(x=>x.visible&&x.scrollable).length}}));process.exitCode=4;return;}
            r=await action({action:'click',nodeId:target.id});
            actions.push({action:'open_movimientos',target:target.id,status:r&&r.status,reason:clean(r&&r.reason||r&&r.payload&&r.payload.reason)});
            await pause(900);current=await observe();
            for(let i=0;i<3&&(!current.root||current.p.ok!==true||scan(current.root).nodeCount<70);i++){await pause(500);current=await observe();}
            if(!current.root||current.p.ok!==true){console.log(JSON.stringify({marker,ok:false,stage:'observe_movimientos',actions,reason:clean(current.r&&current.r.reason||current.p.reason)}));process.exitCode=5;return;}
            sc=scan(current.root);
            const snapshot=()=>{
              const n=sc.nodes;
              return {hash:current.p.evidence_hash||current.p.ui&&current.p.ui.evidence_hash||null,nodeCount:sc.nodeCount,visibleNodeCount:n.filter(x=>x.visible).length,
                titleVisible:n.some(x=>x.visible&&x.names.some(t=>/^movimientos(?: de inventario)?$/i.test(norm(t)))),
                bodyScrollable:n.some(x=>x.id==='0.0.0'&&x.visible&&x.scrollable),
                visibleScrollables:n.filter(x=>x.visible&&x.scrollable).length};
            };
            const initial=snapshot();
            const body=sc.nodes.find(x=>x.id==='0.0.0'&&x.visible&&x.scrollable)||sc.nodes.find(x=>x.visible&&x.scrollable&&x.path.startsWith('0.0.0'))||sc.nodes.find(x=>x.visible&&x.scrollable);
            let forward=null,backward=null,restored=false;
            if(body){
              r=await action({action:'scroll',nodeId:body.id,direction:'forward'});
              actions.push({action:'scroll_body_forward',target:body.id,status:r&&r.status,reason:clean(r&&r.reason||r&&r.payload&&r.payload.reason)});
              await pause(350);current=await observe();
              if(current.root&&current.p.ok===true){sc=scan(current.root);forward=snapshot();}
              const bodyBack=sc.nodes.find(x=>x.id==='0.0.0'&&x.visible&&x.scrollable)||sc.nodes.find(x=>x.visible&&x.scrollable&&x.path.startsWith('0.0.0'))||sc.nodes.find(x=>x.visible&&x.scrollable);
              if(bodyBack){
                r=await action({action:'scroll',nodeId:bodyBack.id,direction:'backward'});
                actions.push({action:'scroll_body_backward',target:bodyBack.id,status:r&&r.status,reason:clean(r&&r.reason||r&&r.payload&&r.payload.reason)});
                await pause(350);current=await observe();
                if(current.root&&current.p.ok===true){sc=scan(current.root);backward=snapshot();}
              }
              restored=!!(initial.hash&&backward&&backward.hash===initial.hash);
            }else actions.push({action:'scroll_body',status:'blocked',reason:'visible_scrollable_not_found'});
            const result={marker,ok:navigationSucceeded&&!!initial.titleVisible&&!!forward&&!!backward,
              build:{version_name:agentBuild.version_name,version_code:agentBuild.version_code,build_id:agentBuild.build_id},
              actions,initial,forward,backward,restoredHash:restored,
              forwardHashChanged:!!(initial.hash&&forward&&initial.hash!==forward.hash),
              safety:{navigationAndScrollOnly:true,filtersChanged:false,recordsOpened:false,businessWrites:false,formsSubmitted:false}};
