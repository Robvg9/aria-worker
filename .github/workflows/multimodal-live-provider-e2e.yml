name: ARIA Multimodal LIVE Provider E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multimodal-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sanity
        run: node --version
