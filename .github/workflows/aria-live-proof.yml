name: ARIA LIVE proof - PR 839
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aria-live-proof.yml'
permissions:
  contents: write
jobs:
  proof:
    if: github.event.head_commit.message != 'chore: remove ARIA live proof probe'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 6db0fe3995c93e17b3485546e165430e9d5bdb40
      BASE: https://aria.robvg9.workers.dev/pwa/
    steps:
      - name: Probe LIVE command-center build
        shell: bash
        run: |
          set -euo pipefail
          html=''
          version=''
          found=0
          for attempt in $(seq 1 90); do
            html="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "${BASE}?live-proof=${TARGET_SHA}-${attempt}" 2>/dev/null || true)"
            version="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "${BASE}version.json?live-proof=${TARGET_SHA}-${attempt}" 2>/dev/null || true)"
            if VERSION="$version" TARGET_SHA="$TARGET_SHA" python - <<'PY'
import json, os, sys
try:
    ok = json.loads(os.environ["VERSION"]).get("build") == os.environ["TARGET_SHA"]
except Exception:
    ok = False
sys.exit(0 if ok else 1)
PY
            then
              found=1
              break
            fi
            sleep 2
          done
          test "$found" = "1"
          echo "$html" > /tmp/aria-live-index.html
          echo "$version" > /tmp/aria-live-version.json
          grep -q "$TARGET_SHA" /tmp/aria-live-index.html
          grep -q "sw-$TARGET_SHA.js" /tmp/aria-live-index.html
          js_asset="$(grep -oE 'assets/[^"]+\.js' /tmp/aria-live-index.html | head -n 1)"
          test -n "$js_asset"
          curl --fail --silent --show-error --retry 3 --retry-delay 1 "https://aria.robvg9.workers.dev/pwa/$js_asset?live-proof=$TARGET_SHA" -o /tmp/aria-live.js
          grep -q "CENTRO DE MANDO" /tmp/aria-live.js
          grep -q "Ver ideas y crear misión" /tmp/aria-live.js
          grep -q "nextQueuedMission" /tmp/aria-live.js
          grep -q "ideasOpen" /tmp/aria-live.js
          python - <<'PY'
import json
x=json.load(open("/tmp/aria-live-version.json"))
assert x["build"] == "6db0fe3995c93e17b3485546e165430e9d5bdb40"
print("ARIA_LIVE_BUILD="+x["build"])
print("ARIA_LIVE_PROOF=PASS")
PY
          mkdir -p .aria-proof
          cp /tmp/aria-live-version.json .aria-proof/pr-839-live-proof.json
          cat > .aria-proof/pr-839-live-proof.md <<'EOF'
# ARIA PR 839 LIVE proof
Target merge: 6db0fe3995c93e17b3485546e165430e9d5bdb40
Checks: version.json build match, PWA shell embeds target build + target service worker, deployed JS contains command-center UX markers.
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .aria-proof/pr-839-live-proof.json .aria-proof/pr-839-live-proof.md
          git commit -m "chore: record ARIA PR 839 live proof"
          git push
