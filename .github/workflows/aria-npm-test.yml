name: ARIA npm test

on:
  push:
    branches:
      - main
      - aria/10-12-governance-v1
      - aria/roadmap-v3-foundation-20260906
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
