name: ARIA npm test

on:
  push:
    branches:
      - main
      - aria/10-12-governance-v1
      - aria/roadmap-v3-foundation-20260906
      - aria/autonomy-expansion-v3-20260906
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  pwa-headless-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@latest
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify seven PWA routes with real browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pwa-headless
          cat > /tmp/pwa-headless.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const base='https://aria.robvg9.workers.dev/pwa/';
          const routes=['#home','#chat','#mission','#projects','#meditation','#capabilities','#settings'];
          const run_id='headless-'+Date.now();
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          const out={run_id,base,started_at:new Date().toISOString(),routes:[]};
          for(const route of routes){
            const started=Date.now();
            await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1200);
            const observed=await page.evaluate(()=>({href:location.href,hash:location.hash||'#home',title:document.title,controls:document.querySelectorAll('button,a,input,textarea,select,[role="button"],[role="link"],[role="tab"]').length,body:(document.body?.innerText||'').slice(0,800)}));
            const shot=await page.screenshot({fullPage:true});
            const file='artifacts/pwa-headless/'+route.slice(1)+'.png';
            fs.writeFileSync(file,shot);
            out.routes.push({route,verified:observed.hash===route,href:observed.href,title:observed.title,controls:observed.controls,screenshot_sha256:hash(shot),elapsed_ms:Date.now()-started});
          }
          out.finished_at=new Date().toISOString();
          out.required_routes_total=7;
          out.required_routes_visited=out.routes.filter(x=>x.verified).length;
          out.status=out.required_routes_visited===7?'succeeded':'partial';
          fs.writeFileSync('artifacts/pwa-headless/evidence.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          await browser.close();
          if(out.status!=='succeeded') process.exit(2);
          NODE
          node /tmp/pwa-headless.cjs
      - name: Upload PWA physical baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-pwa-headless-7-route-baseline
          path: artifacts/pwa-headless/
          if-no-files-found: error
          retention-days: 14
