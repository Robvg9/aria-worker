name: ARIA npm test

on:
  push:
    branches:
      - main
      - aria/10-12-governance-v1
      - aria/roadmap-v3-foundation-20260906
      - aria/autonomy-expansion-v3-20260906
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  pwa-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PWA dependencies
        working-directory: pwa
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build and verify exact PWA + catalogue SHA
        working-directory: pwa
        env:
          VITE_BUILD: ${{ github.sha }}
        run: |
          set -euo pipefail
          export VITE_BUILD="$GITHUB_SHA"
          npm run build
          grep -q "$GITHUB_SHA" dist/index.html
          grep -q "sw-$GITHUB_SHA.js" dist/index.html
          grep -R -q "$GITHUB_SHA" dist/assets
          cp dist/index.html "dist/index-$GITHUB_SHA.html"
          cp dist/manifest.json "dist/manifest-$GITHUB_SHA.json"
          sed "s/__BUILD__/$GITHUB_SHA/g" public/sw.js > "dist/sw-$GITHUB_SHA.js"
          grep -q "aria-pwa-$GITHUB_SHA" "dist/sw-$GITHUB_SHA.js"
          grep -q "2026-10-17-mission-job-authorization-fence-v1" "dist/index-$GITHUB_SHA.html"
          grep -q "content='326'" "dist/index-$GITHUB_SHA.html"
          rm -f dist/index.html
          echo "PWA_BUILD_EXACT_SHA=$GITHUB_SHA"
          echo "PWA_TEST_CATALOG_VERSION=2026-10-17-mission-job-authorization-fence-v1"
          echo "PWA_TEST_CATALOG_TOTAL=326"

  omniroute-final-live:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout ARIA
        uses: actions/checkout@v4
        with:
          path: aria-worker

      - name: Checkout exact OmniRoute source
        uses: actions/checkout@v4
        with:
          repository: diegosouzapw/OmniRoute
          ref: 3e66ff2e8cc94821b093fe57dad667b585230cd1
          fetch-depth: 1
          path: omniroute-source

      - name: Verify source lock
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location "$env:GITHUB_WORKSPACE\omniroute-source"
          $sha=(git rev-parse HEAD).Trim()
          if($sha -ne '3e66ff2e8cc94821b093fe57dad667b585230cd1'){throw "SOURCE_SHA_MISMATCH=$sha"}
          $pkg=Get-Content package.json -Raw | ConvertFrom-Json
          if($pkg.version -ne '3.8.52'){throw "OMNI_VERSION_MISMATCH=$($pkg.version)"}
          Write-Host "OMNIROUTE_SOURCE_LOCK_PASS=$sha"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: omniroute-source/package-lock.json

      - name: Install exact OmniRoute
        working-directory: omniroute-source
        shell: powershell
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Prepare required native runtime packages
        working-directory: omniroute-source
        shell: powershell
        run: npm rebuild @swc/core better-sqlite3 --prefer-offline --no-audit --no-fund

      - name: Install and start Ollama
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          irm https://ollama.com/install.ps1 | iex
          $ollama="$env:LOCALAPPDATA\Programs\Ollama\ollama.exe"
          if(-not (Test-Path $ollama)){throw "OLLAMA_BINARY_NOT_FOUND=$ollama"}
          $p=Start-Process -FilePath $ollama -ArgumentList 'serve' -PassThru -WindowStyle Hidden
          "OMNI_OLLAMA_PID=$($p.Id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $ok=$false
          for($i=0;$i-lt30;$i++){Start-Sleep -Seconds 2;try{$r=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:11434/api/tags' -TimeoutSec 5;if($r.StatusCode -eq 200){$ok=$true;break}}catch{}}
          if(-not $ok){throw 'OMNI_OLLAMA_HEALTH_FAILED'}
          & $ollama pull qwen3:4b
          if($LASTEXITCODE -ne 0){throw "OMNI_QWEN_PULL_FAILED=$LASTEXITCODE"}

      - name: Verify direct Qwen
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $body=@{model='qwen3:4b';messages=@(@{role='user';content='Return exactly OMNIROUTE_QWEN_LIVE_OK'});stream=$false;temperature=0;options=@{temperature=0;num_predict=16}} | ConvertTo-Json -Depth 8
          $r=Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:11434/v1/chat/completions' -ContentType 'application/json' -Body $body -TimeoutSec 180
          $c=[string]$r.choices[0].message.content
          Write-Host "QWEN_DIRECT=$c"
          if($c -notmatch 'OMNIROUTE_QWEN_LIVE_OK'){throw 'OMNI_QWEN_DIRECT_MARKER_FAILED'}

      - name: Run canonical OmniRoute LIVE E2E + persistence
        working-directory: aria-worker
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'aria-omniroute-final'
          $evidence=Join-Path $root 'omniroute-final-live-evidence.json'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:OMNIROUTE_API_KEY='aria-final-live-key'
          $env:OMNIROUTE_FINAL_ENDPOINT='http://127.0.0.1:20130/v1/chat/completions'
          $env:OMNIROUTE_FINAL_EVIDENCE_PATH=$evidence
          $env:OMNIROUTE_SOURCE_DIR="$env:GITHUB_WORKSPACE\omniroute-source"
          node scripts/omniroute-final-live.cjs
          if($LASTEXITCODE -ne 0){throw "OMNIROUTE_FINAL_LIVE_E2E_FAILED=$LASTEXITCODE"}

      - name: Upload OmniRoute final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-omniroute-final-live-evidence
          path: |
            ${{ runner.temp }}/aria-omniroute-final/omniroute-final-live-evidence.json
            ${{ runner.temp }}/aria-omniroute-final/data/mission.json
            ${{ runner.temp }}/aria-omniroute-final/data/events.ndjson
            ${{ runner.temp }}/aria-omniroute-final/omniroute.stdout.log
            ${{ runner.temp }}/aria-omniroute-final/omniroute.stderr.log
          if-no-files-found: warn

      - name: Cleanup OmniRoute and Ollama
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='SilentlyContinue'
          $cleanupFailed=$false
          foreach($rawPid in @($env:OMNI_OMNIROUTE_PID,$env:OMNI_OLLAMA_PID)){
            $targetPid=0
            if([int]::TryParse([string]$rawPid,[ref]$targetPid) -and $targetPid -gt 0){
              if(Get-Process -Id $targetPid -ErrorAction SilentlyContinue){
                taskkill.exe /PID $targetPid /T /F | Out-Null
                $killExit=$LASTEXITCODE
                Start-Sleep -Milliseconds 300
                if(Get-Process -Id $targetPid -ErrorAction SilentlyContinue){
                  Write-Warning "CLEANUP_PROCESS_STILL_RUNNING=$targetPid taskkill_exit=$killExit"
                  $cleanupFailed=$true
                } else {
                  Write-Host "CLEANUP_PROCESS_STOPPED=$targetPid"
                }
              } else {
                Write-Host "CLEANUP_PROCESS_ALREADY_EXITED=$targetPid"
              }
            }
          }
          # taskkill may return 1 when a process already exited; judge the post-condition, not that stale native code.
          $global:LASTEXITCODE=0
          if($cleanupFailed){ throw 'OMNIROUTE_CLEANUP_INCOMPLETE' }
          Write-Host 'OMNIROUTE_CLEANUP_PASS'
