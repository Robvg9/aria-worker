name: A3 LIVE Presence-Only Pilot

on:
  workflow_dispatch:
    inputs:
      confirm_live_presence_only_pilot:
        description: "Arm the bounded A3 presence-only pilot. Does not admit missions or jobs."
        type: boolean
        required: true
        default: false
      approve_coordinator_production:
        description: "First explicit production approval: deploy the isolated A3 coordinator."
        type: boolean
        required: true
        default: false
      approve_robvg_presence_recovery:
        description: "Second explicit production approval: run the bounded physical recovery probe on ROBVG."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: mission-wonder-2-step3-a3-live-presence
  cancel-in-progress: false

jobs:
  deploy-coordinator:
    if: inputs.confirm_live_presence_only_pilot == true && inputs.approve_coordinator_production == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate A3 and global-freeze contracts
        run: |
          set -euo pipefail
          node --check cloudflare-autonomy/worker.mjs
          node tests/mission-wonder-2-step3-a3-presence.test.mjs
          node tests/cloudflare-autonomy-worker.test.js
          node tests/worker-single-instance-lock-v1.test.js
      - name: Validate deployment credentials without printing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARIA_CONTROL_TOKEN: ${{ secrets.ARIA_AUTONOMY_CONTROL_TOKEN }}
          ARIA_WORKER_TOKEN: ${{ secrets.ARIA_AUTONOMY_WORKER_TOKEN }}
          ARIA_PLAN_PRODUCER_SHARED_SECRET: ${{ secrets.ARIA_PLAN_PRODUCER_SHARED_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          control = os.environ.get("ARIA_CONTROL_TOKEN", "")
          worker = os.environ.get("ARIA_WORKER_TOKEN", "")
          bridge = os.environ.get("ARIA_PLAN_PRODUCER_SHARED_SECRET", "")
          checks = {
              "CLOUDFLARE_API_TOKEN_PRESENT": bool(os.environ.get("CLOUDFLARE_API_TOKEN")),
              "CLOUDFLARE_ACCOUNT_ID_PRESENT": bool(os.environ.get("CLOUDFLARE_ACCOUNT_ID")),
              "CONTROL_TOKEN_VALID": len(control) >= 32,
              "WORKER_TOKEN_VALID": len(worker) >= 32,
              "CONTROL_AND_WORKER_DISTINCT": bool(control and worker and control != worker),
              "PLAN_BRIDGE_SECRET_VALID": len(bridge) >= 32,
              "PLAN_BRIDGE_SECRET_DISTINCT": bool(bridge and bridge != control and bridge != worker),
          }
          for name, passed in checks.items():
              print(f"{name}={'PASS' if passed else 'FAIL'}")
          if not all(checks.values()):
              sys.exit("A3_DEPLOY_PREFLIGHT_FAILED")
          PY
      - name: Install Wrangler
        run: npm install --global wrangler@latest
      - name: Deploy isolated coordinator only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARIA_CONTROL_TOKEN: ${{ secrets.ARIA_AUTONOMY_CONTROL_TOKEN }}
          ARIA_WORKER_TOKEN: ${{ secrets.ARIA_AUTONOMY_WORKER_TOKEN }}
          ARIA_PLAN_PRODUCER_SHARED_SECRET: ${{ secrets.ARIA_PLAN_PRODUCER_SHARED_SECRET }}
          ARIA_NOTIFICATION_WEBHOOK_URL: ${{ secrets.ARIA_AUTONOMY_NOTIFICATION_WEBHOOK_URL }}
          ARIA_NOTIFICATION_TOKEN: ${{ secrets.ARIA_AUTONOMY_NOTIFICATION_TOKEN }}
        shell: bash
        run: bash .github/scripts/mission-wonder-2-step3-a3-deploy-coordinator.sh
      - name: Verify LIVE health and that the global freeze still rejects claims
        env:
          ARIA_CONTROL_TOKEN: ${{ secrets.ARIA_AUTONOMY_CONTROL_TOKEN }}
          ARIA_WORKER_TOKEN: ${{ secrets.ARIA_AUTONOMY_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          base="https://aria-autonomy-coordinator.robvg9.workers.dev"
          curl --fail --silent --show-error --max-time 20 "$base/health" | python -c 'import json,sys; x=json.load(sys.stdin); assert x.get("ok") is True and x.get("supabase_independent") is True'
          code="$(curl --silent --show-error --max-time 20 -o /tmp/a3-claim.json -w '%{http_code}' -X POST "$base/api/worker/claim" -H "Authorization: Bearer $ARIA_WORKER_TOKEN" -H 'content-type: application/json' --data '{"worker_id":"a3-deploy-freeze-check"}')"
          test "$code" = "423"
          code="$(curl --silent --show-error --max-time 20 -o /tmp/a3-create.json -w '%{http_code}' -X POST "$base/api/missions" -H "Authorization: Bearer $ARIA_CONTROL_TOKEN" -H 'content-type: application/json' --data '{"goal":"must remain frozen"}')"
          test "$code" = "423"
          echo "ARIA_MW2_A3_LIVE_HEALTH_AND_GLOBAL_FREEZE=PASS"

  robvg-presence-recovery:
    needs: deploy-coordinator
    if: needs.deploy-coordinator.result == 'success' && inputs.confirm_live_presence_only_pilot == true && inputs.approve_robvg_presence_recovery == true
    runs-on: [self-hosted, Windows, X64]
    environment: production
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify and restore extracted A3 presence script from this commit
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $relativePath = '.github/scripts/mission-wonder-2-step3-a3-live-presence.ps1'
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE ($relativePath.Replace('/', [System.IO.Path]::DirectorySeparatorChar))
          $workspaceSha = (& git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $workspaceSha -ne $env:GITHUB_SHA) {
            throw "A3_WORKSPACE_COMMIT_MISMATCH: expected=$env:GITHUB_SHA actual=$workspaceSha"
          }
          $expectedBlob = (& git -C $env:GITHUB_WORKSPACE rev-parse "HEAD:$relativePath").Trim()
          if ($LASTEXITCODE -ne 0 -or $expectedBlob -notmatch '^[a-f0-9]{40,64}$') {
            throw "A3_PRESENCE_SCRIPT_NOT_IN_COMMIT_TREE: $relativePath"
          }
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            Write-Host "A3_PRESENCE_SCRIPT_RESTORE_FROM_OBJECT=$relativePath"
            $node = 'D:\Databank\node\node.exe'
            if (-not (Test-Path -LiteralPath $node -PathType Leaf)) {
              $nodeCommand = Get-Command node -ErrorAction Stop
              $node = $nodeCommand.Source
            }
            $restoreScript = "const cp=require('node:child_process');const fs=require('node:fs');const path=require('node:path');const [workspace,relativePath]=process.argv.slice(1);const blobSha=cp.execFileSync('git',['-C',workspace,'rev-parse','HEAD:'+relativePath],{encoding:'utf8'}).trim();if(!/^[a-f0-9]{40,64}$/.test(blobSha))throw new Error('invalid_git_blob_sha');const content=cp.execFileSync('git',['-C',workspace,'cat-file','blob',blobSha]);const target=path.join(workspace,...relativePath.split('/'));fs.mkdirSync(path.dirname(target),{recursive:true});fs.writeFileSync(target,content);const restored=cp.execFileSync('git',['-C',workspace,'hash-object',target],{encoding:'utf8'}).trim();if(restored!==blobSha)throw new Error('restored_blob_sha_mismatch');console.log('blob='+blobSha+' bytes='+content.length+' path='+target);"
            $restoreOutput = & $node -e $restoreScript $env:GITHUB_WORKSPACE $relativePath 2>&1
            $restoreExit = $LASTEXITCODE
            $restoreOutput | ForEach-Object { Write-Host "A3_SCRIPT_RESTORE_DETAIL=$_"}
            if ($restoreExit -ne 0) { throw "A3_PRESENCE_SCRIPT_RESTORE_FAILED: exit=$restoreExit" }
          }
          $actualBlob = (& git -C $env:GITHUB_WORKSPACE hash-object $scriptPath).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualBlob -ne $expectedBlob) {
            throw "A3_PRESENCE_SCRIPT_BLOB_MISMATCH: expected=$expectedBlob actual=$actualBlob"
          }
          Write-Host 'A3_PRESENCE_SCRIPT_WORKTREE_VERIFIED=PASS'
      - name: Run one bounded presence-only worker recovery pilot on ROBVG
        env:
          ARIA_CONTROL_TOKEN: ${{ secrets.ARIA_AUTONOMY_CONTROL_TOKEN }}
          ARIA_WORKER_TOKEN: ${{ secrets.ARIA_AUTONOMY_WORKER_TOKEN }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\mission-wonder-2-step3-a3-live-presence.ps1')
