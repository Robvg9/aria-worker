name: ARIA private vault LIVE security probes

on:
  pull_request:
    paths:
      - 'scripts/verify-private-vault-live.mjs'
      - '.github/workflows/aria-private-vault-live-probe.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify-private-vault-live.mjs'
      - '.github/workflows/aria-private-vault-live-probe.yml'
      - '.github/workflows/aria-private-vault-contract.yml'
      - 'supabase/functions/aria-app-api-v3/index.ts'
      - 'supabase/functions/aria-app-api-v3/private-vault.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-probe-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check live probe
        run: node --check scripts/verify-private-vault-live.mjs

  live-vault-probe:
    needs: validate-probe-script
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: https://icuqsstxfdbvjytkhlog.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_E2AmZNo2hAbOYlytkVbyBQ_X7JH0HPw
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe live auth and CORS boundaries
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          node scripts/verify-private-vault-live.mjs > live-vault-probe.json
          exit_code=$?
          report="$(cat live-vault-probe.json)"
          printf 'report=%s\n' "$report" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then exit "$exit_code"; fi
      - name: Publish LIVE probe report to workflow summary
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          PROBE_REPORT: ${{ steps.probe.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          report="${PROBE_REPORT:-No JSON report emitted; inspect the workflow logs.}"
          {
            printf '## LIVE private-vault security probe\n\n**Result:** %s\n**Workflow:** %s\n\n' "$PROBE_OUTCOME" "$RUN_URL"
            printf '\x60\x60\x60json\n%s\n\x60\x60\x60\n' "$report"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-private-vault-live-probe-${{ github.run_id }}
          path: live-vault-probe.json
          if-no-files-found: warn
