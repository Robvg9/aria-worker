name: ARIA ABSORB Contract and LIVE E2E

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/absorb-engine.mjs'
      - 'supabase/functions/aria-app-api-v3/index.ts'
      - 'supabase/migrations/*_aria_absorb_v1.sql'
      - 'pwa/**'
      - 'absorb/tests/**'
      - 'rwht/pc-browser/absorb-rwht.mjs'
      - '.github/workflows/aria-absorb.yml'
      - '.github/workflows/omniroute-final-live-promotion.yml'
      - 'execution/adapters/omniroute.js'
      - 'execution/omniroute-canonical-e2e.js'
      - 'router/omniroute.js'
      - 'router/omniroute-auto.js'
      - 'router/omniroute-resilience.js'
      - 'execution/omniroute-recovery.js'
      - 'security/omniroute-security.js'
      - 'absorb/omniroute/**'
      - 'scripts/omniroute-final-live.mjs'
  push:
    branches: [main, 'feat/absorb-live-e2e-check-20261002']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: aria-absorb-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Node contracts
        run: |
          node absorb/tests/absorb-engine.test.js
          node absorb/tests/absorb-app-api-contract.test.js
          node absorb/tests/pwa-absorb-ui-contract.test.js
      - name: PWA build
        working-directory: pwa
        run: |
          npm install --no-audit --no-fund
          npm run build

  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RWHT_URL: ${{ vars.RWHT_URL || 'https://aria.robvg9.workers.dev/pwa/' }}
      RWHT_EMAIL: ${{ secrets.RWHT_EMAIL }}
      RWHT_PASSWORD: ${{ secrets.RWHT_PASSWORD }}
      RWHT_STORAGE_STATE_B64: ${{ secrets.RWHT_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve LIVE E2E target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            slug="${GITHUB_HEAD_REF//\//-}"
            echo "RWHT_URL=https://${slug}-aria.robvg9.workers.dev/pwa/" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_NAME" == "feat/absorb-live-e2e-check-20261002" ]]; then
            echo "RWHT_URL=https://feat-absorb-live-e2e-check-20261002-aria.robvg9.workers.dev/pwa/" >> "$GITHUB_ENV"
          else
            echo "RWHT_URL=${RWHT_URL}" >> "$GITHUB_ENV"
          fi
      - name: Require authenticated session source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RWHT_EMAIL}" || -z "${RWHT_PASSWORD}" ]] && [[ -z "${RWHT_STORAGE_STATE_B64}" ]]; then
            echo "::error title=ABSORB LIVE E2E blocked::Configure RWHT_EMAIL + RWHT_PASSWORD or RWHT_STORAGE_STATE_B64."
            exit 1
          fi
          if [[ -n "${RWHT_STORAGE_STATE_B64}" ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_B64}" | base64 --decode > "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            chmod 600 "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            echo "RWHT_STORAGE_STATE=${RUNNER_TEMP}/aria-rwht-auth-state.json" >> "${GITHUB_ENV}"
          fi
      - name: Install Playwright
        working-directory: rwht/pc-browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run ABSORB LIVE E2E
        working-directory: rwht/pc-browser
        run: node absorb-rwht.mjs
      - name: Upload ABSORB evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-absorb-live-evidence
          path: rwht/pc-browser/absorb-artifacts
          if-no-files-found: warn
      - name: Persist production E2E result
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: "818"
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ -f rwht/pc-browser/absorb-artifacts/absorb-live-e2e.json ]]; then
            evidence_line="$(jq -r '"url=" + (.url // "") + " timestamp=" + (.timestamp // "")' rwht/pc-browser/absorb-artifacts/absorb-live-e2e.json)"
          else
            evidence_line="rwht/pc-browser/absorb-artifacts/absorb-live-e2e.json not produced"
          fi
          body="$(jq -n --arg status "$JOB_STATUS" --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg evidence "$evidence_line" '{body:("## ARIA ABSORB production E2E\n\nStatus: **"+$status+"**\nCommit: `"+$commit+"`\nRun: "+$workflow+"\nEvidence: "+$evidence)}')"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -d "$body"
          echo "ABSORB_E2E_EVIDENCE_PERSISTED"



  omniroute-final-live:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout ARIA
        uses: actions/checkout@v4
        with:
          path: aria-worker

      - name: Checkout exact OmniRoute source
        uses: actions/checkout@v4
        with:
          repository: diegosouzapw/OmniRoute
          ref: 3e66ff2e8cc94821b093fe57dad667b585230cd1
          fetch-depth: 1
          path: omniroute-source

      - name: Verify source lock
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location "$env:GITHUB_WORKSPACE\omniroute-source"
          $sha=(git rev-parse HEAD).Trim()
          if($sha -ne '3e66ff2e8cc94821b093fe57dad667b585230cd1'){throw "SOURCE_SHA_MISMATCH=$sha"}
          $pkg=Get-Content package.json -Raw | ConvertFrom-Json
          if($pkg.version -ne '3.8.52'){throw "OMNI_VERSION_MISMATCH=$($pkg.version)"}
          Write-Host "OMNIROUTE_SOURCE_LOCK_PASS=$sha"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: omniroute-source/package-lock.json

      - name: Install exact OmniRoute
        working-directory: omniroute-source
        shell: powershell
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build exact OmniRoute
        working-directory: omniroute-source
        shell: powershell
        env:
          OMNIROUTE_USE_TURBOPACK: '0'
          OMNIROUTE_BUILD_WORKERS: '1'
          OMNIROUTE_BUILD_MEMORY_MB: '12000'
        run: npm run build:fast

      - name: Install and start Ollama
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          irm https://ollama.com/install.ps1 | iex
          $ollama="$env:LOCALAPPDATA\Programs\Ollama\ollama.exe"
          if(-not (Test-Path $ollama)){throw "OLLAMA_BINARY_NOT_FOUND=$ollama"}
          $p=Start-Process -FilePath $ollama -ArgumentList 'serve' -PassThru -WindowStyle Hidden
          "OMNI_OLLAMA_PID=$($p.Id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $ok=$false
          for($i=0;$i-lt30;$i++){Start-Sleep -Seconds 2;try{$r=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:11434/api/tags' -TimeoutSec 5;if($r.StatusCode -eq 200){$ok=$true;break}}catch{}}
          if(-not $ok){throw 'OMNI_OLLAMA_HEALTH_FAILED'}
          & $ollama pull qwen3:4b
          if($LASTEXITCODE -ne 0){throw "OMNI_QWEN_PULL_FAILED=$LASTEXITCODE"}

      - name: Verify direct Qwen
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $body=@{model='qwen3:4b';messages=@(@{role='user';content='Return exactly OMNIROUTE_QWEN_LIVE_OK'});stream=$false;temperature=0;options=@{temperature=0;num_predict=16}} | ConvertTo-Json -Depth 8
          $r=Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:11434/v1/chat/completions' -ContentType 'application/json' -Body $body -TimeoutSec 180
          $c=[string]$r.choices[0].message.content
          Write-Host "QWEN_DIRECT=$c"
          if($c -notmatch 'OMNIROUTE_QWEN_LIVE_OK'){throw 'OMNI_QWEN_DIRECT_MARKER_FAILED'}

      - name: Start OmniRoute
        working-directory: omniroute-source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'aria-omniroute-final'
          $data=Join-Path $root 'data'
          New-Item -ItemType Directory -Force -Path $root,$data | Out-Null
          $env:HOST='127.0.0.1'
          $env:HOSTNAME='127.0.0.1'
          $env:PORT='20130'
          $env:DATA_DIR=$data
          $env:OMNIROUTE_SELF_HOSTED_API_KEY='aria-final-live-key'
          $env:OMNIROUTE_SELF_HOSTED_PROVIDERS=@'
providers:
  - id: ollama
    kind: openai
    baseUrl: http://127.0.0.1:11434/v1
    model: qwen3:4b
'@
          $stdout=Join-Path $root 'omniroute.stdout.log'
          $stderr=Join-Path $root 'omniroute.stderr.log'
          $p=Start-Process -FilePath node -ArgumentList "$env:GITHUB_WORKSPACE\omniroute-source\scripts\dev\run-next.mjs",'start' -WorkingDirectory "$env:GITHUB_WORKSPACE\omniroute-source" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -WindowStyle Hidden
          "OMNI_OMNIROUTE_PID=$($p.Id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "OMNIROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $ok=$false
          for($i=0;$i-lt45;$i++){Start-Sleep -Seconds 2;try{$r=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:20130/api/health' -TimeoutSec 5;if($r.StatusCode -eq 200){$ok=$true;break}}catch{}}
          if(-not $ok){Get-Content $stderr -Tail 200;Get-Content $stdout -Tail 200;throw 'OMNIROUTE_HEALTH_FAILED'}
          if(-not (Get-Process -Id $p.Id -ErrorAction SilentlyContinue)){Get-Content $stderr -Tail 200;Get-Content $stdout -Tail 200;throw 'OMNIROUTE_DIED_AFTER_HEALTH'}
          Write-Host 'OMNIROUTE_HEALTH_PASS'

      - name: Run canonical ARIA LIVE E2E + persistence
        working-directory: aria-worker
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:RUNNER_TEMP 'aria-omniroute-final\omniroute-final-live-evidence.json'
          $env:OMNIROUTE_API_KEY='aria-final-live-key'
          $env:OMNIROUTE_FINAL_ENDPOINT='http://127.0.0.1:20130/v1/chat/completions'
          $env:OMNIROUTE_FINAL_EVIDENCE_PATH=$evidence
          node scripts/omniroute-final-live.mjs
          if($LASTEXITCODE -ne 0){throw "OMNIROUTE_FINAL_LIVE_E2E_FAILED=$LASTEXITCODE"}

      - name: Upload OmniRoute final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-omniroute-final-live-evidence
          path: |
            ${{ runner.temp }}/aria-omniroute-final/omniroute-final-live-evidence.json
            ${{ runner.temp }}/aria-omniroute-final/data/mission.json
            ${{ runner.temp }}/aria-omniroute-final/data/events.ndjson
            ${{ runner.temp }}/aria-omniroute-final/omniroute.stdout.log
            ${{ runner.temp }}/aria-omniroute-final/omniroute.stderr.log
          if-no-files-found: warn

      - name: Cleanup OmniRoute and Ollama
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='SilentlyContinue'
          if($env:OMNI_OMNIROUTE_PID){taskkill.exe /PID ([int]$env:OMNI_OMNIROUTE_PID) /T /F | Out-Null}
          if($env:OMNI_OLLAMA_PID){taskkill.exe /PID ([int]$env:OMNI_OLLAMA_PID) /T /F | Out-Null}
