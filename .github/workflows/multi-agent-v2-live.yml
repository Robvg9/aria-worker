name: Multi-Agent 2.0 CONTRACT
# Contract certification: manager + runtime + catalog adapter + verifier.
on:
  workflow_dispatch:
  push:
    paths:
      - 'agents/**'
      - 'tests/multi-agent-v2**'
      - 'tests/multi-agent-runtime-v2.test.js'
      - '.github/workflows/multi-agent-v2-live.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full regression suite
        run: npm test
      - name: Multi-Agent contract test
        run: node tests/multi-agent-v2-live.js
