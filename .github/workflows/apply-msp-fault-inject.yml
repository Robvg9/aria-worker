name: Apply MSP fault inject runner

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-msp-fault-inject.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runner from 32daeeb + fault inject
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/Robvg9/aria-worker/32daeeb011fdc2429bb5d32e980f15441da50422/supabase/functions/aria-mission-runner-v22/index.ts" \
            -o supabase/functions/aria-mission-runner-v22/index.ts
          python3 << 'PY'
          from pathlib import Path
          p = Path("supabase/functions/aria-mission-runner-v22/index.ts")
          src = p.read_text()
          assert len(src) > 50000 and "V_LOGICAL" in src
          # Build without raw ${} in the workflow YAML surface via python concatenation
          req = "`" + "${missionId}:${step.id}:${crypto.randomUUID()}" + "`"
          inj = "`" + "live-resilience-inject:${missionId}:${step.id}" + "`"
          old = (
            "  for (const route of routes) {\n"
            "    const response = await fetch(EXEC, {\n"
            "      method: \"POST\",\n"
            "      headers: downstreamHeaders(auth),\n"
            "      body: JSON.stringify({\n"
            "        execution_version: \"1\",\n"
            "        request_id: " + req + ",\n"
            "        task_id: step.id,\n"
            "        capability: String(step.operation),\n"
            "        selected_route: route,\n"
            "        authorization,\n"
            "        input: step.input || {},\n"
            "        policy: step.policy || {},\n"
            "        metadata: { mission_id: missionId, step_id: step.id, executor_type: \"model\", runner: V, fallback_route: route.model_id !== primary.model_id },\n"
            "      }),\n"
            "    });"
          )
          # Reconstruct old from file content using unique anchors
          start = src.find("  for (const route of routes) {")
          # Find the specific modelExecute loop (first for routes after verifiedModelFallbackRoutes)
          marker = "const failures:any[] = [];"
          mi = src.find(marker)
          if mi < 0:
              raise SystemExit("failures marker missing")
          start = src.find("  for (const route of routes) {", mi)
          end = src.find("    const body = await response.json()", start)
          if start < 0 or end < 0:
              raise SystemExit("loop bounds missing")
          # include through the fetch closing
          end2 = src.find(");", end)
          # simpler: replace from for loop through first }); of fetch
          chunk = src[start:end]
          if "live-resilience-inject" in src:
              print("already_patched")
          else:
              new_chunk = (
                "  const injectFault = typeof step?.input?.fault_injection === \"string\" ? String(step.input.fault_injection) : \"\";\n"
                "  const injectAll = step?.input?.fault_all_routes === true;\n"
                "  for (const route of routes) {\n"
                "    const isPrimary = route.provider_id === primary.provider_id && route.account_id === primary.account_id && route.model_id === primary.model_id;\n"
                "    const doInject = injectFault && (injectAll || isPrimary);\n"
                "    const authForRoute = doInject\n"
                "      ? { ...authorization, evidence_ref: " + inj + " }\n"
                "      : authorization;\n"
                "    const response = await fetch(EXEC, {\n"
                "      method: \"POST\",\n"
                "      headers: downstreamHeaders(auth),\n"
                "      body: JSON.stringify({\n"
                "        execution_version: \"1\",\n"
                "        request_id: " + req + ",\n"
                "        task_id: step.id,\n"
                "        capability: String(step.operation),\n"
                "        selected_route: route,\n"
                "        authorization: authForRoute,\n"
                "        input: step.input || {},\n"
                "        policy: step.policy || {},\n"
                "        metadata: {\n"
                "          mission_id: missionId,\n"
                "          step_id: step.id,\n"
                "          executor_type: \"model\",\n"
                "          runner: V,\n"
                "          fallback_route: route.model_id !== primary.model_id,\n"
                "          ...(doInject ? { fault_injection: injectFault } : {}),\n"
                "        },\n"
                "      }),\n"
                "    });\n"
              )
              src = src[:start] + new_chunk + src[end:]
              p.write_text(src)
              print("patched_ok", len(src))
          text = p.read_text()
          assert "live-resilience-inject" in text
          assert "FILE_TOO_LARGE" not in text and "PLACEHOLDER" not in text
          print("final", len(text))
          PY
          git config user.name aria-supervisor
          git config user.email aria@local
          git add supabase/functions/aria-mission-runner-v22/index.ts
          git commit -m "fix(runner-v22): gated primary-only fault injection for MSP E2E" || echo no_commit
          git push origin HEAD:main
