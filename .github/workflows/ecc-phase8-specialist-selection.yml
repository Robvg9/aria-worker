name: ECC Phase 8 Specialist Selection

on:
  pull_request:
    branches:
      - aria/ecc-phase-07-agent-adapter
    paths:
      - 'scripts/ecc-specialist-selection.js'
      - 'tests/ecc-specialist-selection.test.js'
      - '.github/workflows/ecc-phase8-specialist-selection.yml'
  push:
    branches:
      - 'aria/ecc-phase-08-specialist-selection'
    paths:
      - 'scripts/ecc-specialist-selection.js'
      - 'tests/ecc-specialist-selection.test.js'
      - '.github/workflows/ecc-phase8-specialist-selection.yml'

permissions:
  contents: read

jobs:
  selection:
    name: ECC Phase 8 / specialist selection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract test
        run: node tests/ecc-specialist-selection.test.js
