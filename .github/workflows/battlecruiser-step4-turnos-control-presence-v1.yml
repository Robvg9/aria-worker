name: BattleCruiser Step 4 Turnos Control Presence V1 (Read Only)
# Android device reconnected; re-run safe filter selection and restoration test.
on:
  push:
    branches:
      - aria/bc-step4-android-e2e-20261021
    paths:
      - .github/workflows/battlecruiser-step4-turnos-control-presence-v1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-step4-turnos-control-presence-v1-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  android-turnos-control-presence-v1:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Observe read-only Mando audit type/status filters and restore defaults
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.request, urllib.error
          project=os.environ.get('SUPABASE_PROJECT_REF','').strip()
          secret=os.environ.get('ARIA_RUNTIME_SHARED_SECRET','')
          if not project or not secret: raise SystemExit('BLOCKED: production secrets unavailable')
          base=f'https://{project}.supabase.co/functions/v1'
          headers={'Authorization':'Bearer '+secret,'content-type':'application/json','cache-control':'no-store'}
          mission_id=f"mission_bc_step4_turnos_control_presence_v1_{os.environ['RUN_ID']}_{os.environ['RUN_ATTEMPT']}"
          device='android-termux-a1ebcfc7-9287-4603-a0f9-c519d12fd092'
          marker='BC_STEP4_TURNOS_FILTER_CONTROL_PRESENCE_V1'
          command=r"""node <<'NODE'
          const {executeAndroidAccessibilityJob,probeLocalIpcHealth}=require('./computer-use/android-accessibility-v1.js');
          const marker='BC_STEP4_TURNOS_FILTER_CONTROL_PRESENCE_V1',host='battlecruiser.robvg9.workers.dev';
          const expectedBuild='3708b31b319884f7d42082414a82cdd11450fe2d';
          const base={target_package:'com.android.chrome',allow_any_app:false,allowed_hosts:[host]};
          const clean=s=>typeof s==='string'?s.replace(/\s+/g,' ').trim().replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig,'[redacted]').slice(0,140):'';
          const norm=s=>clean(s).toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n').trim();
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function send(q,timeoutMs=12000){return await executeAndroidAccessibilityJob({command:JSON.stringify({...base,...q}),timeoutMs});}
          async function observe(){const r=await send({operation:'observe'},6000),p=r&&r.payload||{},root=p.root||(p.ui&&p.ui.root)||null;return {r,p,root};}
          async function action(a){return await send({operation:'action',action:a},10000);}
          function scan(root){const nodes=[],seen=new Set();let count=0;const walk=(n,path,d)=>{if(!n||typeof n!=='object'||Array.isArray(n)||seen.has(n)||d>28||count>=1200)return;seen.add(n);count++;const names=['name','label','contentDescription','text','hint'].map(k=>clean(n[k])).filter(Boolean);nodes.push({id:typeof n.id==='string'&&n.id?n.id:path,path,role:clean(n.role),className:clean(n.className||n.class),names,text:names.join(' | '),visible:n.visible!==false,clickable:!!n.clickable,enabled:n.enabled!==false,scrollable:!!n.scrollable,bounds:n.bounds||null});if(Array.isArray(n.children))n.children.forEach((c,i)=>walk(c,path+'.'+i,d+1));};walk(root,'0',0);return nodes;}
          const exact=(ns,label)=>ns.find(n=>n.names.some(t=>norm(t)===norm(label))&&n.visible&&n.clickable&&n.enabled);
          async function fresh(){let cur=await observe();for(let k=0;k<4&&(!cur.root||cur.p.ok!==true);k++){await wait(350);cur=await observe();}return cur;}
          async function clickWait(n,label,timeline){const r=await action({action:'click',nodeId:n.id});timeline.push({step:label,status:r&&r.status,reason:clean(r&&r.reason||r&&r.payload&&r.payload.reason)});await wait(450);return fresh();}
          const wanted=[
            {key:'turno-almacen-abrir',label:'Selecciona un almacén',re:/selecciona un almacen/},
            {key:'turno-filtro-estado',label:'Todos los estados',re:/todos los estados/},
            {key:'turno-filtro-almacen',label:'Todos los almacenes',re:/todos los almacenes/},
            {key:'turnos-refrescar-btn',label:'Refrescar',re:/^refrescar$/}
          ];
          function collect(cur){const ns=cur.root?scan(cur.root):[];return wanted.map(w=>{
            const matches=ns.filter(n=>w.re.test(norm(n.text))||n.names.some(t=>w.re.test(norm(t))));
            const actionable=matches.find(n=>n.visible&&n.enabled&&n.clickable);
            const first=actionable||matches[0]||null;
            return {key:w.key,label:w.label,matchCount:matches.length,found:!!first,node:first?{id:first.id,path:first.path,role:first.role,className:first.className,text:clean(first.text),visible:first.visible,clickable:first.clickable,enabled:first.enabled,bounds:first.bounds}:null};
          });}
          (async()=>{
            const h=await probeLocalIpcHealth({timeoutMs:2500}),hp=h&&h.payload||{};
            const exactBuild=h&&h.ok===true&&String(hp.version_name)==='1.1.23'&&Number(hp.version_code)===29&&String(hp.build_id)===expectedBuild;
            if(!exactBuild){console.log(JSON.stringify({marker,ok:false,stage:'exact_agent_build_mismatch',build:{ok:!!h?.ok,version_name:hp.version_name||null,version_code:hp.version_code||null,build_id:hp.build_id||null}}));process.exitCode=20;return;}
            const timeline=[];
            let r=await action({action:'navigate',url:'https://'+host+'/'});timeline.push({step:'navigate_live',status:r&&r.status});await wait(1400);
            let cur=await fresh(),ns=cur.root?scan(cur.root):[],menu=exact(ns,'Abrir menú')||exact(ns,'Abrir menu');
            for(let k=0;k<6&&!menu;k++){await wait(400);cur=await fresh();ns=cur.root?scan(cur.root):[];menu=exact(ns,'Abrir menú')||exact(ns,'Abrir menu');}
            if(!menu){console.log(JSON.stringify({marker,ok:false,stage:'menu_not_found',timeline,nodeCount:ns.length,hash:cur.p?.evidence_hash||null}));process.exitCode=1;return;}
            cur=await clickWait(menu,'open_menu',timeline);
            let dest=exact(cur.root?scan(cur.root):[],'Turnos');
            for(let k=0;k<5&&!dest;k++){
              ns=cur.root?scan(cur.root):[];
              const drawer=ns.find(n=>n.visible&&n.scrollable&&n.path.startsWith('0.0.0.0.2'))||ns.find(n=>n.visible&&n.scrollable);
              if(!drawer)break;
              r=await action({action:'scroll',nodeId:drawer.id,direction:k<2?'backward':'forward'});
              timeline.push({step:'scroll_menu_'+(k+1),status:r&&r.status});
              await wait(250);cur=await fresh();dest=exact(cur.root?scan(cur.root):[],'Turnos');
            }
            if(!dest){console.log(JSON.stringify({marker,ok:false,stage:'turnos_nav_not_found',timeline,nodeCount:cur.root?scan(cur.root).length:0}));process.exitCode=2;return;}
            cur=await clickWait(dest,'open_turnos',timeline);await wait(800);cur=await fresh();
            const snapshots=[{label:'initial',hash:cur.p?.evidence_hash||null,nodeCount:cur.root?scan(cur.root).length:0,controls:collect(cur)}];
            // Observe after real finger gestures only. Do not activate any field or refresh button.
            for(let k=0;k<3;k++){
              const v=await action({action:'swipe',x1:540,y1:1900,x2:540,y2:900,durationMs:420});
              timeline.push({step:'swipe_turnos_controls_'+(k+1),status:v&&v.status,reason:clean(v&&v.reason||v&&v.payload&&v.payload.reason)});
              await wait(350);cur=await fresh();
              snapshots.push({label:'swipe_'+(k+1),hash:cur.p?.evidence_hash||null,nodeCount:cur.root?scan(cur.root).length:0,controls:collect(cur)});
              const all=collect(cur);
              if(all.filter(x=>x.node&&x.node.visible&&x.node.clickable&&x.node.enabled).length>=3)break;
            }
            const final=collect(cur);
            const proven=final.filter(x=>x.node&&x.node.visible&&x.node.clickable&&x.node.enabled).map(x=>({key:x.key,label:x.label,id:x.node.id,bounds:x.node.bounds}));
            const result={marker,ok:proven.length>=3,build:{version_name:hp.version_name,version_code:hp.version_code,build_id:hp.build_id},timeline,snapshots,finalControls:final,provenCount:proven.length,proven,safety:{presenceAndAccessibilityOnly:true,controlsActivated:false,turnOpened:false,turnClosed:false,filtersChanged:false,businessWrites:false,stockMutated:false,logoutClicked:false}};
            console.log(JSON.stringify(result));if(!result.ok)process.exitCode=3;
          })().catch(e=>{console.log(JSON.stringify({marker,ok:false,error:clean(String(e&&e.message||e))}));process.exitCode=1;});
          NODE"""
          metadata={'goal_source':'chat','source_application':'ChatGPT','project_name':'BattleCruiser','source':'battlecruiser_step4_turnos_control_presence_v1','verification_marker':marker,'device_id':device,'requested_device_id':device,'operation':'shell.execute','executor_type':'device','requested_capability':'shell.execute','command':command,'risk':'READ','timeout_ms':45000,'target_package':'com.android.chrome','allowed_hosts':['battlecruiser.robvg9.workers.dev'],'read_only':True,'business_data_mutated':False,'explicit_device_intent':True,'human_gate_required':False}
          def post(fn,payload,timeout=75):
              req=urllib.request.Request(base+'/'+fn,data=json.dumps(payload).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read().decode())
                  except:return e.code,{}
          code,body=post('aria-direct-v1',{'goal':'En Android, abre Turnos y verifica solo presencia, visibilidad y accesibilidad de cuatro controles permitidos: selector de almacén, filtro de estado, filtro de almacén y botón Refrescar. Usa solo navegación y gestos de pantalla; no selecciones filtros, no abras ni cierres turnos y no modifiques datos. Agente 1.1.23 exacto. Marcador BC_STEP4_TURNOS_FILTER_CONTROL_PRESENCE_V1.','mission_id':mission_id,'metadata':metadata})
          print('DISPATCH_HTTP='+str(code));print('MISSION_ID='+mission_id);print('DISPATCH_STATUS='+str(body.get('dispatch',{}).get('status','unknown')))
          if code>=300 or body.get('ok') is not True:print(json.dumps(body)[:1200]);raise SystemExit(2)
          terminal={'succeeded','failed','blocked','rejected','cancelled','human_required','paused'}
          last={}
          for i in range(1,61):
              c,last=post('aria-mission-runner-v22',{'mission_id':mission_id})
              s=str(last.get('status','unknown'));print('POLL='+json.dumps({'n':i,'http':c,'status':s,'error':last.get('error'),'next_action':last.get('next_action')}))
              if s in terminal or c in (401,403,404):break
              time.sleep(3)
          s=str(last.get('status','unknown'));print('FINAL_STATUS='+s);print('FINAL='+json.dumps({k:last.get(k) for k in ('ok','status','mission_id','error','next_action','executor_types','results') if k in last},ensure_ascii=False)[:6000])
          if s!='succeeded':raise SystemExit(1)
          PY
