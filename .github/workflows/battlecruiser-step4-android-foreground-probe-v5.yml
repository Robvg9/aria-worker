name: BattleCruiser Step 4 Android Foreground Probe V5 (Read Only)
on:
  push:
    branches: [aria/bc-step4-android-e2e-20261021]
    paths: [.github/workflows/battlecruiser-step4-android-foreground-probe-v5.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-step4-android-foreground-probe-v5
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: Navigate and capture fresh Android tree
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.request, urllib.error
          project=os.environ.get('SUPABASE_PROJECT_REF','').strip()
          secret=os.environ.get('ARIA_RUNTIME_SHARED_SECRET','')
          if not project or not secret: raise SystemExit('BLOCKED: production secrets unavailable')
          base=f'https://{project}.supabase.co/functions/v1'
          headers={'Authorization':'Bearer '+secret,'content-type':'application/json','cache-control':'no-store'}
          mid=f"mission_bc_step4_android_foreground_probe_v5_{os.environ['RUN_ID']}_{os.environ['RUN_ATTEMPT']}"
          device='android-termux-a1ebcfc7-9287-4603-a0f9-c519d12fd092'
          marker='BC_STEP4_ANDROID_FOREGROUND_TREE_V5'
          command=r"""node <<'NODE'
          const {executeAndroidAccessibilityJob}=require('./computer-use/android-accessibility-v1.js');
          const marker='BC_STEP4_ANDROID_FOREGROUND_TREE_V5', host='battlecruiser.robvg9.workers.dev';
          const base={target_package:'com.android.chrome',allow_any_app:false,allowed_hosts:[host]};
          const send=q=>executeAndroidAccessibilityJob({command:JSON.stringify({...base,...q}),timeoutMs:18000});
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const nav=await send({operation:'action',action:{action:'navigate',url:'https://'+host}});
            await wait(5000);
            const r=await send({operation:'observe'}),p=r&&r.payload||{},root=p.root||(p.ui&&p.ui.root)||null,nodes=[],seen=new Set();
            const clean=s=>typeof s==='string'?s.replace(/\s+/g,' ').trim().slice(0,100):'';
            const walk=(n,path,d)=>{if(!n||typeof n!=='object'||Array.isArray(n)||seen.has(n)||d>25||nodes.length>900)return;seen.add(n);const names=['name','label','contentDescription','text','hint'].map(k=>clean(n[k])).filter(Boolean);nodes.push({id:typeof n.id==='string'&&n.id?n.id:path,path,role:clean(n.role),className:clean(n.className||n.class),text:names.join(' | '),visible:n.visible!==false,clickable:!!n.clickable,enabled:n.enabled!==false,checkable:typeof n.checkable==='boolean'?n.checkable:null,checked:typeof n.checked==='boolean'?n.checked:null,scrollable:!!n.scrollable,bounds:n.bounds||null});if(Array.isArray(n.children))n.children.forEach((c,i)=>walk(c,path+'.'+i,d+1));};
            walk(root,'0',0);
            console.log(JSON.stringify({marker,navStatus:nav&&nav.status,navReason:clean(nav&&nav.reason),observeStatus:r&&r.status,ok:p.ok===true,reason:clean(r&&r.reason||p.reason),packageName:clean(p.packageName||(p.ui&&p.ui.packageName)),hash:p.evidence_hash||null,uiHash:p.ui&&p.ui.evidence_hash||null,nodeCount:nodes.length,nodes:nodes.slice(0,100)}));
            if(!root||p.ok!==true||nodes.length===0)process.exitCode=1;
          })().catch(e=>{console.log(JSON.stringify({marker,ok:false,error:String(e&&e.message||e).slice(0,200)}));process.exitCode=1;});
          NODE"""
          metadata={'goal_source':'chat','source_application':'ChatGPT','project_name':'BattleCruiser','source':'battlecruiser_step4_android_foreground_probe_v5','verification_marker':marker,'device_id':device,'requested_device_id':device,'operation':'shell.execute','executor_type':'device','requested_capability':'shell.execute','command':command,'risk':'READ','timeout_ms':30000,'target_package':'com.android.chrome','allowed_hosts':['battlecruiser.robvg9.workers.dev'],'read_only':True,'business_data_mutated':False,'explicit_device_intent':True,'human_gate_required':False}
          def post(fn,payload,timeout=75):
              req=urllib.request.Request(base+'/'+fn,data=json.dumps(payload).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read().decode())
                  except:return e.code,{}
          code,body=post('aria-direct-v1',{'goal':'BattleCruiser Paso 4/15: captura el árbol accesible físico real de Chrome Android luego de abrir la URL autorizada. Solo observar, no pulsar interruptores ni acciones de negocio. Marcador BC_STEP4_ANDROID_FOREGROUND_TREE_V5.','mission_id':mid,'metadata':metadata})
          print('DISPATCH_HTTP='+str(code));print('MISSION_ID='+mid);print('DISPATCH_STATUS='+str(body.get('dispatch',{}).get('status','unknown')))
          if code>=300 or body.get('ok') is not True: print(json.dumps(body)[:1200]);raise SystemExit(2)
          terminal={'succeeded','failed','blocked','rejected','cancelled','human_required','paused'}
          last={}
          for i in range(1,61):
              c,last=post('aria-mission-runner-v22',{'mission_id':mid})
              s=str(last.get('status','unknown'));print('POLL='+json.dumps({'n':i,'http':c,'status':s,'error':last.get('error'),'next_action':last.get('next_action')}))
              if s in terminal or c in (401,403,404):break
              time.sleep(3)
          s=str(last.get('status','unknown'));print('FINAL_STATUS='+s);print('FINAL='+json.dumps({k:last.get(k) for k in ('ok','status','mission_id','error','next_action','executor_types','results') if k in last},ensure_ascii=False)[:4000])
          if s!='succeeded':raise SystemExit(1)
          PY
