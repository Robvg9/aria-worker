name: A6 dispatcher subtransaction PostgreSQL integration

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261110213000_aria_m22_a6_edge_outage_resilient_heartbeat_v1.sql'
      - 'supabase/functions/_tests/mission-wonder-2-a6-dispatch-subtransaction.integration.sh'
      - '.github/workflows/mission-wonder-2-a6-dispatch-subtransaction-postgres.yml'

permissions:
  contents: read

jobs:
  postgres-integration:
    name: A6 heartbeat survives Vault and enqueue failures
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aria_a6_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aria_a6_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify heartbeat persistence under dispatcher failures
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/aria_a6_test
        run: bash supabase/functions/_tests/mission-wonder-2-a6-dispatch-subtransaction.integration.sh
