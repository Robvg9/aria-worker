name: PWA LIVE Runtime Probe

on:
  pull_request:
    paths:
      - '.github/workflows/pwa-live-runtime-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Probe live PWA
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();

            const consoleErrors = [];
            const pageErrors = [];
            const failedRequests = [];

            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('pageerror', error => pageErrors.push(String(error.stack || error.message || error)));
            page.on('requestfailed', request => failedRequests.push({
              url: request.url(),
              error: request.failure()?.errorText || 'unknown'
            }));

            await page.goto('https://aria.robvg9.workers.dev/pwa/?runtime_probe=' + Date.now(), {
              waitUntil: 'networkidle',
              timeout: 30000
            });

            await page.waitForTimeout(2500);

            const result = {
              title: await page.title(),
              url: page.url(),
              bodyText: (await page.locator('body').innerText()).slice(0, 3000),
              rootHtmlLength: await page.locator('#root').innerHTML().then(x => x.length),
              consoleErrors,
              pageErrors,
              failedRequests
            };

            console.log(JSON.stringify(result, null, 2));

            if (result.pageErrors.length || result.failedRequests.length) process.exit(2);
            if (result.rootHtmlLength < 50) process.exit(3);

            await browser.close();
          })().catch(error => {
            console.error(error.stack || error);
            process.exit(4);
          });
          NODE
