name: Computer Use v1 CONTRACT

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  computer-use-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full regression suite
        run: npm test
      - name: Computer Use contract test
        run: node tests/computer-use-runtime-v1.test.js
