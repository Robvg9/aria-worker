# E2E change-detection trigger: controlled Notion edit test 2026-09-16
name: ARIA Vision → Notion Sync

on:
  push:
    branches: [aria/self-improvement-v1-main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync-vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
          ARIA_VISION_SYNC_URL: ${{ secrets.ARIA_VISION_SYNC_URL }}
        with:
          script: |
            const required = ['NOTION_TOKEN','ARIA_RUNTIME_SHARED_SECRET'];
            for (const key of required) if (!process.env[key]) throw new Error(`Missing required secret: ${key}`);

            const notionPageId = '3cdfeb35-5ec1-818d-976c-c1287bfa048a';
            if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(notionPageId)) {
              throw new Error('Canonical NOTION_VISION_PAGE_ID is invalid.');
            }

            const syncUrl = process.env.ARIA_VISION_SYNC_URL || 'https://icuqsstxfdbvjytkhlog.supabase.co/functions/v1/aria-runtime-gateway-v1';
            const notion = async (path, opts={}) => {
              const r = await fetch(`https://api.notion.com/v1${path}`, {
                ...opts,
                headers: {
                  'Authorization': `Bearer ${process.env.NOTION_TOKEN}`,
                  'Notion-Version': '2022-06-28',
                  'Content-Type': 'application/json',
                  ...(opts.headers||{})
                }
              });
              const body = await r.json().catch(()=>null);
              if (!r.ok) throw new Error(`Notion ${r.status}: ${JSON.stringify(body).slice(0,1000)}`);
              return body;
            };
            const pageMeta = await notion(`/pages/${notionPageId}`);
            const sourceUpdatedAt = pageMeta.last_edited_time || new Date().toISOString();
            const blocks = [];
            let cursor = null;
            do {
              const q = cursor ? `?page_size=100&start_cursor=${encodeURIComponent(cursor)}` : '?page_size=100';
              const page = await notion(`/blocks/${notionPageId}/children${q}`);
              blocks.push(...(page.results||[]));
              cursor = page.has_more ? page.next_cursor : null;
            } while (cursor);
            const textOf = b => (b?.type && Array.isArray(b[b.type]?.rich_text) ? b[b.type].rich_text : []).map(x=>x.plain_text||'').join('');
            const lines = blocks.map(textOf).filter(Boolean);
            const whole = lines.join('\n');
            const machineLines = lines.filter(line => line.startsWith('OBJECTIVE|'));
            if (!machineLines.length) throw new Error('No machine-readable OBJECTIVE| lines found in canonical Master Vision.');
            const objectives = machineLines.map(line => {
              const parts = line.split('|');
              if (parts.length < 5) throw new Error(`Malformed objective line: ${line}`);
              const [, objective_id, priorityRaw, statusRaw, objectiveRaw, acceptanceRaw=''] = parts;
              const priority = Number(priorityRaw);
              if (!objective_id?.trim() || !Number.isFinite(priority) || !objectiveRaw?.trim()) throw new Error(`Invalid objective line: ${line}`);
              return {
                objective_id: objective_id.trim(),
                vision_id: 'aria-master-vision-v1',
                objective: objectiveRaw.trim(),
                priority: Math.max(0, Math.min(100, priority)),
                status: ['queued','paused','blocked','completed','archived'].includes(statusRaw.trim()) ? statusRaw.trim() : 'queued',
                source_section: 'Master Vision — machine-readable objective manifest',
                acceptance: acceptanceRaw.trim() || 'Must be demonstrated with reproducible evidence; never infer completion from code presence alone.',
                metadata: { autonomous:true, parser:'OBJECTIVE_PIPE_V1' },
                verifier: undefined,
                dependencies: undefined
              };
            });
            const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(whole));
            const content_hash = Array.from(new Uint8Array(hashBuffer)).map(x=>x.toString(16).padStart(2,'0')).join('');
            const payload = {
              vision_id:'aria-master-vision-v1',
              source_ref:notionPageId,
              source_version:`notion-${sourceUpdatedAt}`,
              source_updated_at:sourceUpdatedAt,
              source_content:whole,
              content_hash,
              objectives
            };
            const r = await fetch(syncUrl, {
              method:'POST',
              headers:{'content-type':'application/json','authorization':`Bearer ${process.env.ARIA_RUNTIME_SHARED_SECRET}`},
              body:JSON.stringify({action:'vision_sync',payload})
            });
            const body = await r.text();
            if (!r.ok) throw new Error(`Vision sync ${r.status}: ${body.slice(0,1200)}`);
            core.info(body);
            core.summary.addHeading('ARIA Vision → Notion Sync');
            core.summary.addRaw(`source_updated_at=${sourceUpdatedAt}`);
            core.summary.addRaw(`objective_count=${objectives.length}`);
            core.summary.addRaw(`content_hash=${content_hash}`);
            core.summary.addRaw(body);
