name: RWHT Android UI Agent v1 Targeted

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rwht-android-ui-agent-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rwht-android-ui-agent-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Android accessibility transport contract
        run: node tests/android-accessibility-v1.test.js
      - name: Computer-use runtime contract
        run: node tests/computer-use-runtime-v1.test.js
      - name: Device job contract
        run: node tests/device-job-contract.test.js
      - name: Android RWHT planner syntax
        run: node -e "require('./computer-use/android-rwht-v1')"
