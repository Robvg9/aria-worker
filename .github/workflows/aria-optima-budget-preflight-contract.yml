name: ARIA Optima Full Contract Suite

on:
  pull_request:
    branches:
      - main
      - fix/aria-optima-budget-block-checkpoint-resume-guard-20261127
      - feat/aria-optima-bounded-token-preflight-20261127
    paths:
      - 'supabase/functions/aria-execution-runtime-v1/**'
      - 'supabase/functions/aria-device-gateway/**'
      - 'router/intelligent-v2.js'
      - 'intelligence/cost-optimizer.js'
      - 'tests/cost-optimizer-pricing-evidence-v1.test.js'
      - 'pwa/src/testCatalog.ts'
      - 'tests/aria-quota-accounting-v1.test.mjs'
      - 'tests/intelligent-router-v2.test.js'
      - 'tests/mission6-router-v2-gateway-contract.test.js'
      - 'package.json'
      - '.github/workflows/aria-optima-budget-preflight-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete ARIA contract suite
        run: npm test
