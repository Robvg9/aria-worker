name: ARIA Optima Budget Preflight Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/functions/aria-execution-runtime-v1/**'
      - 'tests/aria-quota-accounting-v1.test.mjs'
      - 'package.json'
      - '.github/workflows/aria-optima-budget-preflight-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete ARIA contract suite
        run: npm test
