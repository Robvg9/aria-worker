name: ARIA PWA Headless Physical Baseline

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@latest

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run independent 7-route baseline v2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/screens
          cat > /tmp/pwa-baseline.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const base = 'https://aria.robvg9.workers.dev/pwa/';
          const routes = ['#home','#chat','#mission','#projects','#meditation','#capabilities','#settings'];
          const runId = 'headless-' + Date.now();
          const out = { run_id: runId, base, started_at: new Date().toISOString(), routes: [] };

          const hash = (b) => crypto.createHash('sha256').update(b).digest('hex');
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });

          for (const route of routes) {
            const started = Date.now();
            await page.goto(base + route, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(1200);
            const observed = await page.evaluate(() => ({
              href: location.href,
              hash: location.hash || '#home',
              title: document.title,
              body_text: (document.body?.innerText || '').slice(0, 1000),
              controls: document.querySelectorAll('button,a,input,textarea,select,[role="button"],[role="link"],[role="tab"]').length
            }));
            const shot = await page.screenshot({ fullPage: true });
            const filename = 'artifacts/screens/' + route.slice(1) + '.png';
            fs.writeFileSync(filename, shot);
            out.routes.push({
              route,
              verified: observed.hash === route,
              final_url: observed.href,
              title: observed.title,
              controls: observed.controls,
              screenshot: filename,
              screenshot_sha256: hash(shot),
              elapsed_ms: Date.now() - started
            });
          }

          out.finished_at = new Date().toISOString();
          out.required_routes_total = 7;
          out.required_routes_visited = out.routes.filter(x => x.verified).length;
          out.status = out.required_routes_visited === 7 ? 'succeeded' : 'partial';
          fs.writeFileSync('artifacts/pwa-headless-evidence.json', JSON.stringify(out, null, 2));
          console.log(JSON.stringify(out, null, 2));

          await browser.close();
          if (out.status !== 'succeeded') process.exit(2);
          NODE
          node /tmp/pwa-baseline.cjs

      - name: Upload independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-pwa-headless-baseline
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
