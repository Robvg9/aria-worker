name: Deploy ARIA Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run full test suite
        run: npm test
      - name: Verify Grok consent compatibility patch
        run: |
          grep -q 'x-aria-grok-consent":"direct-link-v2' worker.js
          grep -q 'class="btn" href="${allow}"' worker.js
          grep -q 'class="btn secondary" href="${deny}"' worker.js
      - name: Verify required Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install PWA dependencies
        working-directory: pwa
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build PWA from main
        working-directory: pwa
        env:
          VITE_BUILD: ${{ github.sha }}
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA}/g" public/sw.js
          npm run build
          cp dist/index.html "dist/index-${GITHUB_SHA}.html"
          cp dist/manifest.json "dist/manifest-${GITHUB_SHA}.json"
          cp public/sw.js "dist/sw-${GITHUB_SHA}.js"
          sed -i "s/__BUILD__/${GITHUB_SHA}/g" "dist/sw-${GITHUB_SHA}.js"
          rm -f public/sw.js dist/index.html dist/manifest.json

      - name: Install Wrangler
        run: npm install --global wrangler@latest
      - name: Deploy ARIA Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sed -i "s/__PWA_BUILD__/${GITHUB_SHA}/g" worker.js
          wrangler deploy worker.js --name aria
      - name: Sync Cloudflare runtime secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: printf '%s' "$CLOUDFLARE_API_TOKEN" | wrangler secret put CLOUDFLARE_API_TOKEN --name aria
      - name: Smoke test PWA main auto-deploy
        run: |
          set -euo pipefail
          base="https://aria.robvg9.workers.dev/pwa/"
          html="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$base")"
          echo "$html"
          grep -q 'ARIA — Centro de Mando' <<<"$html"
          grep -q "${GITHUB_SHA}" <<<"$html"
          versioned_html="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "${base}index-${GITHUB_SHA}.html")"
          grep -q "${GITHUB_SHA}" <<<"$versioned_html"
          sw="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "${base}sw-${GITHUB_SHA}.js")"
          echo "$sw"
          grep -q "aria-pwa-${GITHUB_SHA}" <<<"$sw"
          manifest="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "${base}manifest-${GITHUB_SHA}.json")"
          grep -q 'ARIA — Centro de Mando Cognitivo' <<<"$manifest"

      - name: Smoke test PWA login auth boundary
        run: |
          set -euo pipefail
          body='{"email":"aria-ci-invalid@example.invalid","password":"invalid-password-for-smoke-test"}'
          set +e
          direct_code="$(curl --silent --show-error --max-time 8 --retry 0 -o /tmp/auth-direct-body -w '%{http_code}' \
            'https://icuqsstxfdbvjytkhlog.supabase.co/auth/v1/token?grant_type=password' \
            -X POST -H 'Content-Type: application/json' \
            -H 'apikey: sb_publishable_E2AmZNo2hAbOYlytkVbyBQ_X7JH0HPw' \
            -d "$body")"
          direct_curl_status=$?
          set -e
          if test "$direct_curl_status" -ne 0; then direct_code="000"; fi
          echo "direct auth status=$direct_code"
          cat /tmp/auth-direct-body || true
          if test "$direct_code" -ge 400 && test "$direct_code" -lt 500; then
            echo AUTH_DIRECT_REACHABLE
          elif test "$direct_code" = "000"; then
            echo AUTH_DIRECT_NETWORK_BLOCKED
          else
            echo AUTH_DIRECT_UNEXPECTED_STATUS
            exit 1
          fi
          base="https://aria.robvg9.workers.dev/auth/token?grant_type=password"
          proxy_code="$(curl --silent --show-error --max-time 10 --retry 0 -o /tmp/auth-proxy-body -w '%{http_code}' "$base" \
            -X POST -H 'Content-Type: application/json' \
            -H 'apikey: sb_publishable_E2AmZNo2hAbOYlytkVbyBQ_X7JH0HPw' \
            -d "$body")"
          echo "proxy auth status=$proxy_code"
          cat /tmp/auth-proxy-body || true
          if test "$proxy_code" -ge 400 && test "$proxy_code" -lt 500; then
            echo AUTH_PROXY_REACHABLE
          elif test "$proxy_code" = "504"; then
            echo AUTH_PROXY_UPSTREAM_BLOCKED
          else
            echo AUTH_PROXY_UNEXPECTED_STATUS
            exit 1
          fi
      - name: Smoke test PWA API network boundary
        run: |
          set -euo pipefail
          base="https://aria.robvg9.workers.dev/api/session"
          code="$(curl --silent --show-error --max-time 12 --retry 1 --retry-delay 1 -o /tmp/app-api-body -w '%{http_code}' "$base" -H 'Authorization: Bearer invalid-smoke-token')"
          cat /tmp/app-api-body
          test "$code" = "401"
          echo PWA_API_BOUNDARY_OK

      - name: Smoke test PWA version recovery
        run: |
          set -euo pipefail
          base="https://aria.robvg9.workers.dev/pwa/"
          version="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "${base}version.json")"
          VERSION="$version" GITHUB_SHA="$GITHUB_SHA" python - <<'PY'
          import json, os
          assert json.loads(os.environ['VERSION'])['build'] == os.environ['GITHUB_SHA']
          PY
          stale="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "${base}index-stale-test.html")"
          grep -q "${GITHUB_SHA}" <<<"$stale"
          stale_sw="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "${base}sw-stale-test.js")"
          grep -q "aria-pwa-${GITHUB_SHA}" <<<"$stale_sw"
      - name: Smoke test direct ARIA interface
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 https://aria.robvg9.workers.dev/aria)"
          echo "$body"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.ok!==true || x.service!=="aria-direct-interface" || x.version!=="aria-direct-v1" || x.execution_authority!=="aria-canonical-runtime-v1") process.exit(1)' "$body"
      - name: Smoke test MCP OAuth discovery
        run: |
          set -euo pipefail
          base="https://aria.robvg9.workers.dev"
          meta="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$base/.well-known/oauth-protected-resource/mcp")"
          META="$meta" python - <<'PY'
          import json, os
          x=json.loads(os.environ['META'])
          assert x['resource']=='https://aria.robvg9.workers.dev/mcp'
          assert x['authorization_servers']==['https://aria.robvg9.workers.dev']
          assert x['bearer_methods_supported']==['header']
          assert x['scopes_supported']==['aria.mcp.inbound']
          PY
          oauth="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$base/.well-known/oauth-authorization-server")"
          OAUTH="$oauth" python - <<'PY'
          import json, os
          x=json.loads(os.environ['OAUTH'])
          assert x['issuer']=='https://aria.robvg9.workers.dev'
          assert x['authorization_endpoint']=='https://aria.robvg9.workers.dev/authorize'
          assert x['token_endpoint']=='https://aria.robvg9.workers.dev/token'
          assert x['registration_endpoint']=='https://aria.robvg9.workers.dev/register'
          assert x['code_challenge_methods_supported']==['S256']
          assert x['token_endpoint_auth_methods_supported']==['none']
          assert x['response_types_supported']==['code']
          assert 'authorization_code' in x['grant_types_supported']
          assert x['scopes_supported']==['aria.mcp.inbound']
          PY
          headers="$(mktemp)"
          code="$(curl --silent --show-error --retry 3 --retry-delay 2 -D "$headers" -o /tmp/mcp-body -w '%{http_code}' "$base/mcp" -H 'Accept: application/json, text/event-stream')"
          test "$code" = "401"
          grep -qi 'resource_metadata="https://aria.robvg9.workers.dev/.well-known/oauth-protected-resource/mcp"' "$headers"
          init_headers="$(mktemp)"
          init_code="$(curl --silent --show-error --retry 3 --retry-delay 2 -D "$init_headers" -o /tmp/mcp-init-body -w '%{http_code}' "$base/mcp" -X POST -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"aria-ci","version":"1.0.0"}}}')"
          test "$init_code" = "401"
          grep -qi 'resource_metadata="https://aria.robvg9.workers.dev/.well-known/oauth-protected-resource/mcp"' "$init_headers"
      - name: Smoke test Grok OAuth DCR and authorization bootstrap
        run: |
          set -euo pipefail
          base="https://aria.robvg9.workers.dev"
          register_payload='{"client_name":"aria-grok-ci","redirect_uris":["https://grok.com/connectors-oauth-exchange-code/"],"grant_types":["authorization_code","refresh_token"],"response_types":["code"],"token_endpoint_auth_method":"none"}'
          registration="$(curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 2 -X POST "$base/register" -H 'Content-Type: application/json' -d "$register_payload")"
          echo "$registration"
          REG="$registration" python - <<'PY'
          import json, os
          x=json.loads(os.environ['REG'])
          assert x.get('client_id','').startswith('aria_')
          assert x['token_endpoint_auth_method']=='none'
          assert 'authorization_code' in x.get('grant_types', [])
          assert x['response_types']==['code']
          assert x['redirect_uris']==['https://grok.com/connectors-oauth-exchange-code/']
          PY
          client_id="$(REG="$registration" python -c 'import json,os; print(json.loads(os.environ["REG"])["client_id"])')"
          challenge="E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM"
          auth_url="$base/authorize?client_id=$client_id&redirect_uri=$(python -c 'import urllib.parse; print(urllib.parse.quote("https://grok.com/connectors-oauth-exchange-code/",safe=""))')&response_type=code&state=aria-ci-state&code_challenge=$challenge&code_challenge_method=S256&resource=$(python -c 'import urllib.parse; print(urllib.parse.quote("https://aria.robvg9.workers.dev/mcp",safe=""))')&scope=aria.mcp.inbound"
          auth_code="$(curl --silent --show-error --max-time 20 --retry 3 --retry-delay 2 -o /tmp/authorize-body -w '%{http_code}' "$auth_url")"
          echo "authorize status=$auth_code"
          test "$auth_code" = "200"
          grep -qi 'authorize' /tmp/authorize-body
          grep -qi 'href=' /tmp/authorize-body
          grep -q 'pending_id=' /tmp/authorize-body
          grep -q 'decision=allow' /tmp/authorize-body
          grep -q 'decision=deny' /tmp/authorize-body
          echo GROK_CONSENT_LINKS_OK
