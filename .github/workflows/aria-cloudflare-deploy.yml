name: Deploy ARIA Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'integrations/**'
      - 'credentials/**'
      - 'activation/**'
      - 'autonomy/**'
      - 'package.json'
      - '.github/workflows/aria-cloudflare-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run full test suite
        run: npm test

      - name: Verify required Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Deploy ARIA Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy worker.js --name aria

      - name: Sync Cloudflare runtime secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          printf '%s' "$CLOUDFLARE_API_TOKEN" | wrangler secret put CLOUDFLARE_API_TOKEN --name aria

      - name: Smoke test direct ARIA interface
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 https://aria.robvg9.workers.dev/aria)"
          echo "$body"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.ok!==true || x.service!=="aria-direct-interface" || x.version!=="aria-direct-v1" || x.execution_authority!=="aria-canonical-runtime-v1") process.exit(1)' "$body"

      - name: Smoke test MCP OAuth discovery
        run: |
          set -euo pipefail
          base="https://aria.robvg9.workers.dev"
          meta="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$base/.well-known/oauth-protected-resource/mcp")"
          echo "$meta"
          META="$meta" python - <<'PY'
          import json, os
          x=json.loads(os.environ['META'])
          assert x['resource']== 'https://aria.robvg9.workers.dev/mcp'
          assert x['authorization_servers'] == ['https://aria.robvg9.workers.dev']
          assert x['bearer_methods_supported'] == ['header']
          assert x['scopes_supported'] == ['openid','profile','email']
          PY

          oauth="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$base/.well-known/oauth-authorization-server")"
          echo "$oauth"
          OAUTH="$oauth" python - <<'PY'
          import json, os
          x=json.loads(os.environ['OAUTH'])
          assert x['issuer']== 'https://aria.robvg9.workers.dev'
          assert x['authorization_endpoint']== 'https://aria.robvg9.workers.dev/authorize'
          assert x['token_endpoint']== 'https://aria.robvg9.workers.dev/token'
          assert x['registration_endpoint']== 'https://aria.robvg9.workers.dev/register'
          assert x['code_challenge_methods_supported']== ['S256']
          assert x['token_endpoint_auth_methods_supported']== ['none']
          assert x['response_types_supported']== ['code']
          assert x['grant_types_supported']== ['authorization_code']
          PY

          headers="$(mktemp)"
          code="$(curl --silent --show-error --retry 3 --retry-delay 2 -D "$headers" -o /tmp/mcp-body -w '%{http_code}' "$base/mcp" -H 'Accept: application/json, text/event-stream')"
          echo "mcp_get_status=$code"
          cat /tmp/mcp-body
          test "$code" = "401"
          grep -qi 'resource_metadata="https://aria.robvg9.workers.dev/.well-known/oauth-protected-resource/mcp"' "$headers"

          init_headers="$(mktemp)"
          init_code="$(curl --silent --show-error --retry 3 --retry-delay 2 -D "$init_headers" -o /tmp/mcp-init-body -w '%{http_code}' "$base/mcp" \
            -X POST -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"aria-ci","version":"1.0.0"}}}')"
          echo "mcp_initialize_unauth_status=$init_code"
          cat /tmp/mcp-init-body
          test "$init_code" = "401"
          grep -qi 'resource_metadata="https://aria.robvg9.workers.dev/.well-known/oauth-protected-resource/mcp"' "$init_headers"

      - name: Smoke test Grok OAuth DCR and authorization bootstrap
        run: |
          set -euo pipefail
          base="https://aria.robvg9.workers.dev"
          callback="https://grok.com/connectors-oauth-exchange-code/"
          register_payload='{"client_name":"aria-grok-ci","redirect_uris":["https://grok.com/connectors-oauth-exchange-code/"],"grant_types":["authorization_code"],"response_types":["code"],"token_endpoint_auth_method":"none"}'
          registration="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 -X POST "$base/register" -H 'Content-Type: application/json' -d "$register_payload")"
          echo "$registration"
          REG="$registration" python - <<'PY'
          import json, os
          x=json.loads(os.environ['REG'])
          assert x.get('client_id','').startswith('aria_')
          assert x['token_endpoint_auth_method']=='none'
          assert x['grant_types']==['authorization_code']
          assert x['response_types']==['code']
          assert x['redirect_uris']==['https://grok.com/connectors-oauth-exchange-code/']
          assert x['authorization_endpoint']=='https://aria.robvg9.workers.dev/authorize'
          assert x['token_endpoint']=='https://aria.robvg9.workers.dev/token'
          assert x['issuer']=='https://aria.robvg9.workers.dev'
          assert x['resource']=='https://aria.robvg9.workers.dev/mcp'
          PY

          minimal="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 -X POST "$base/register" -H 'Content-Type: application/json' -d '{"redirect_uris":["https://grok.com/connectors-oauth-exchange-code/"]}')"
          echo "$minimal"
          MINIMAL="$minimal" python - <<'PY'
          import json, os
          x=json.loads(os.environ['MINIMAL'])
          assert x.get('client_id','').startswith('aria_')
          assert x['client_name']
          assert x['redirect_uris']==['https://grok.com/connectors-oauth-exchange-code/']
          assert x['token_endpoint_auth_method']=='none'
          PY

          client_id="$(REG="$registration" python -c 'import json,os; print(json.loads(os.environ["REG"])["client_id"])')"
          challenge="E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM"
          auth_url="$base/authorize?client_id=$client_id&redirect_uri=$(python -c 'import urllib.parse; print(urllib.parse.quote("https://grok.com/connectors-oauth-exchange-code/",safe=""))')&response_type=code&state=aria-ci-state&code_challenge=$challenge&code_challenge_method=S256&resource=$(python -c 'import urllib.parse; print(urllib.parse.quote("https://aria.robvg9.workers.dev/mcp",safe=""))')"
          auth_headers="$(mktemp)"
          auth_code="$(curl --silent --show-error --retry 3 --retry-delay 2 -D "$auth_headers" -o /tmp/authorize-body -w '%{http_code}' "$auth_url")"
          echo "authorize_status=$auth_code"
          test "$auth_code" = "200"
          grep -q 'Authorize ARIA' /tmp/authorize-body
          grep -q 'method="get"' /tmp/authorize-body
          grep -q 'action="https://aria.robvg9.workers.dev/authorize/go"' /tmp/authorize-body

          pending_id="$(python - <<'PY'
          import re
          html=open('/tmp/authorize-body',encoding='utf-8').read()
          m=re.search(r'name="pending_id" value="([^"]+)"',html)
          assert m, 'pending_id input missing'
          print(m.group(1))
          PY
          )"
          go_headers="$(mktemp)"
          go_code="$(curl --silent --show-error --retry 3 --retry-delay 2 -D "$go_headers" -o /tmp/authorize-go-body -w '%{http_code}' "$base/authorize/go?pending_id=$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$pending_id")&email=not-an-email")"
          echo "authorize_go_invalid_email_status=$go_code"
          test "$go_code" = "400"
          grep -qi 'Authorization could not continue' /tmp/authorize-go-body
          grep -qi 'text/html' "$go_headers"
