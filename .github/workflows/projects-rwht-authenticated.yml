name: ARIA Projects Browser RWHT Authenticated

on:
  push:
    branches:
      - main
    paths:
      - 'pwa/**'
      - 'supabase/functions/aria-app-api-v3/**'
      - 'rwht/pc-browser/rwht-pc-browser.mjs'
      - 'rwht/pc-browser/rwht-projects-e2e.mjs'
      - 'tests/**project-workspace.test.js'
      - 'tests/pc-rwht-browser.test.js'
      - 'supabase/migrations/**'
      - '.github/workflows/projects-rwht-authenticated.yml'
  workflow_dispatch:

concurrency:
  group: aria-projects-rwht-authenticated-${{ github.sha }}
  cancel-in-progress: false

jobs:
  projects-rwht:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RWHT_URL: ${{ vars.RWHT_URL || 'https://aria.robvg9.workers.dev/pwa/' }}
      RWHT_HEADLESS: 'true'
      RWHT_NO_SCREENSHOTS: 'false'
      RWHT_ALLOW_MUTATIONS: 'false'
      RWHT_REQUIRE_AUTH: 'true'
      RWHT_ROUTES: '#projects'
      RWHT_RELOAD_AUTH: 'true'
      RWHT_LOGIN_WAIT_MS: '40000'
      RWHT_AUTH_ATTEMPTS: '3'
      RWHT_EXPECTED_AUTH_TEXT: 'COLA COMPARTIDA'
      RWHT_EMAIL: ${{ secrets.RWHT_EMAIL }}
      RWHT_PASSWORD: ${{ secrets.RWHT_PASSWORD }}
      RWHT_STORAGE_STATE_B64: ${{ secrets.RWHT_STORAGE_STATE_B64 }}
      RWHT_STORAGE_STATE_GZIP_B64: ${{ secrets.RWHT_STORAGE_STATE_GZIP_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require an authenticated session source
        shell: bash
        run: |
          set -euo pipefail
          has_password_auth=false
          has_storage_auth=false
          has_storage_gzip_auth=false
          if [[ -n "${RWHT_EMAIL}" && -n "${RWHT_PASSWORD}" ]]; then has_password_auth=true; fi
          if [[ -n "${RWHT_STORAGE_STATE_B64}" ]]; then has_storage_auth=true; fi
          if [[ -n "${RWHT_STORAGE_STATE_GZIP_B64}" ]]; then has_storage_gzip_auth=true; fi
          if [[ "${has_password_auth}" != true && "${has_storage_auth}" != true && "${has_storage_gzip_auth}" != true ]]; then
            echo "::error title=Authenticated Projects RWHT blocked::Configure RWHT_EMAIL + RWHT_PASSWORD or RWHT_STORAGE_STATE_B64 as repository secrets."
            exit 1
          fi
          if [[ "${has_storage_auth}" == true ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_B64}" | base64 --decode > "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            chmod 600 "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            echo "RWHT_STORAGE_STATE=${RUNNER_TEMP}/aria-rwht-auth-state.json" >> "${GITHUB_ENV}"
          elif [[ "${has_storage_gzip_auth}" == true ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_GZIP_B64}" | base64 --decode | gzip -dc > "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            chmod 600 "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            echo "RWHT_STORAGE_STATE=${RUNNER_TEMP}/aria-rwht-auth-state.json" >> "${GITHUB_ENV}"
          fi

      - name: Install PC RWHT dependencies
        working-directory: rwht/pc-browser
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: rwht/pc-browser
        run: npx playwright install --with-deps chromium

      - name: Verify canonical test catalog on LIVE PWA
        run: |
          set -euo pipefail
          base="${RWHT_URL%/}"
          html=""
          for attempt in $(seq 1 60); do
            html="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "${base}/?probe=${GITHUB_SHA}-projects-catalog-${attempt}" 2>/dev/null || true)"
            if (grep -q "name='aria-test-catalog-version' content='2026-10-02-canonical'" <<<"$html" || grep -q 'name="aria-test-catalog-version" content="2026-10-02-canonical"' <<<"$html") &&
               (grep -q "name='aria-test-catalog-total' content='293'" <<<"$html" || grep -q 'name="aria-test-catalog-total" content="293"' <<<"$html"); then break; fi
            test "$attempt" -lt 60 && sleep 2
          done
          test -n "$html"
          echo PROJECTS_CANONICAL_TEST_CATALOG_LIVE_OK

      - name: Execute authenticated Projects + ARTIA E2E
        working-directory: rwht/pc-browser
        env:
          RWHT_ARTIFACT_DIR: projects-e2e-artifacts
          RWHT_TIMEOUT_MS: '180000'
        run: node rwht-projects-e2e.mjs

      - name: Upload Projects RWHT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-projects-rwht-evidence
          path: |
            rwht/pc-browser/projects-e2e-artifacts
          if-no-files-found: warn

      - name: Remove temporary authentication state
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/aria-rwht-auth-state.json"

# Final certification trigger 2026-10-01.
