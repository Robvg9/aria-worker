name: ARIA Projects Browser RWHT Authenticated

on:
  push:
    branches:
      - main
    paths:
      - 'pwa/**'
      - 'supabase/functions/aria-app-api-v3/**'
      - 'rwht/pc-browser/rwht-pc-browser.mjs'
      - 'rwht/pc-browser/rwht-projects-e2e.mjs'
      - 'tests/**project-workspace.test.js'
      - 'tests/pc-rwht-browser.test.js'
      - 'supabase/migrations/**'
      - '.github/workflows/projects-rwht-authenticated.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: aria-authenticated-pwa-rwht
  cancel-in-progress: false

jobs:
  projects-rwht:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RWHT_URL: ${{ vars.RWHT_URL || 'https://aria.robvg9.workers.dev/pwa/' }}
      RWHT_HEADLESS: 'true'
      RWHT_NO_SCREENSHOTS: 'false'
      RWHT_ALLOW_MUTATIONS: 'false'
      RWHT_REQUIRE_AUTH: 'true'
      RWHT_ROUTES: '#projects'
      RWHT_RELOAD_AUTH: 'true'
      RWHT_LOGIN_WAIT_MS: '40000'
      RWHT_AUTH_ATTEMPTS: '1'
      RWHT_EXPECTED_AUTH_TEXT: 'COLA COMPARTIDA'
      RWHT_EMAIL: ${{ secrets.RWHT_EMAIL }}
      RWHT_PASSWORD: ${{ secrets.RWHT_PASSWORD }}
      RWHT_STORAGE_STATE_B64: ${{ secrets.RWHT_STORAGE_STATE_B64 }}
      RWHT_STORAGE_STATE_GZIP_B64: ${{ secrets.RWHT_STORAGE_STATE_GZIP_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require an authenticated session source
        shell: bash
        run: |
          set -euo pipefail
          has_password_auth=false
          has_storage_auth=false
          has_storage_gzip_auth=false
          if [[ -n "${RWHT_EMAIL}" && -n "${RWHT_PASSWORD}" ]]; then has_password_auth=true; fi
          if [[ -n "${RWHT_STORAGE_STATE_B64}" ]]; then has_storage_auth=true; fi
          if [[ -n "${RWHT_STORAGE_STATE_GZIP_B64}" ]]; then has_storage_gzip_auth=true; fi
          if [[ "${has_password_auth}" != true && "${has_storage_auth}" != true && "${has_storage_gzip_auth}" != true ]]; then
            echo "::error title=Authenticated Projects RWHT blocked::Configure RWHT_EMAIL + RWHT_PASSWORD or RWHT_STORAGE_STATE_B64 as repository secrets."
            exit 1
          fi
          if [[ "${has_storage_auth}" == true ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_B64}" | base64 --decode > "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            chmod 600 "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            echo "RWHT_STORAGE_STATE=${RUNNER_TEMP}/aria-rwht-auth-state.json" >> "${GITHUB_ENV}"
          elif [[ "${has_storage_gzip_auth}" == true ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_GZIP_B64}" | base64 --decode | gzip -dc > "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            chmod 600 "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            echo "RWHT_STORAGE_STATE=${RUNNER_TEMP}/aria-rwht-auth-state.json" >> "${GITHUB_ENV}"
          fi

      - name: Bootstrap fresh authenticated PWA session
        shell: bash
        env:
          BOOTSTRAP_SESSION_PATH: ${{ runner.temp }}/aria-rwht-bootstrap-session.json
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = process.env.BOOTSTRAP_SESSION_PATH;
          const apiKey = 'sb_publishable_E2AmZNo2hAbOYlytkVbyBQ_X7JH0HPw';
          async function request(url, body) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 45000);
            try {
              return await fetch(url, {
                method: 'POST',
                headers: { 'content-type': 'application/json', apikey: apiKey, accept: 'application/json' },
                body: JSON.stringify(body),
                signal: controller.signal,
                cache: 'no-store'
              });
            } finally {
              clearTimeout(timer);
            }
          }
          async function persist(response, label, fallbackEmail = null) {
            const body = await response.json().catch(() => null);
            const hasSession = Boolean(body?.access_token && body?.refresh_token && body?.user?.id);
            console.log(JSON.stringify({ label, status: response.status, ok: response.ok, has_session: hasSession, error: body?.error_code || body?.error || null }));
            if (!hasSession) return false;
            fs.writeFileSync(path, JSON.stringify({
              accessToken: body.access_token,
              refreshToken: body.refresh_token,
              userId: body.user.id,
              expiresAt: Date.now() + Math.max(60, Number(body.expires_in || 3600)) * 1000,
              email: body.user.email || fallbackEmail
            }));
            fs.chmodSync(path, 0o600);
            console.log(label + '_OK');
            return true;
          }

          let ok = false;
          const email = String(process.env.RWHT_EMAIL || '').trim();
          const password = String(process.env.RWHT_PASSWORD || '');
          if (email && password) {
            try {
              ok = await persist(
                await request('https://icuqsstxfdbvjytkhlog.supabase.co/auth/v1/token?grant_type=password', { email, password }),
                'RWHT_PASSWORD_BOOTSTRAP',
                email
              );
            } catch (error) {
              console.log(JSON.stringify({ label: 'RWHT_PASSWORD_BOOTSTRAP', status: 0, ok: false, has_session: false, error: error?.name || 'fetch_failed' }));
            }
          }

          if (!ok) {
            try {
              ok = await persist(
                await request('https://icuqsstxfdbvjytkhlog.supabase.co/auth/v1/signup', { data: { rwht_ci: true } }),
                'RWHT_ANONYMOUS_BOOTSTRAP'
              );
            } catch (error) {
              console.log(JSON.stringify({ label: 'RWHT_ANONYMOUS_BOOTSTRAP', status: 0, ok: false, has_session: false, error: error?.name || 'fetch_failed' }));
            }
          }

          if (!ok) console.log('RWHT_AUTH_BOOTSTRAP_UNAVAILABLE');
          NODE
          if [[ -s "$BOOTSTRAP_SESSION_PATH" ]]; then
            echo "RWHT_BOOTSTRAP_SESSION_PATH=$BOOTSTRAP_SESSION_PATH" >> "$GITHUB_ENV"
          fi

      - name: Install PC RWHT dependencies
        working-directory: rwht/pc-browser
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: rwht/pc-browser
        run: npx playwright install --with-deps chromium

      - name: Verify canonical test catalog on LIVE PWA
        run: |
          set -euo pipefail
          base="${RWHT_URL%/}"
          expected_version="$(sed -n "s/.*aria-test-catalog-version' content='\([^']*\)'.*/\1/p" pwa/index.html)"
          expected_total="$(sed -n "s/.*aria-test-catalog-total' content='\([^']*\)'.*/\1/p" pwa/index.html)"
          test -n "$expected_version"
          test -n "$expected_total"
          html=""
          for attempt in $(seq 1 60); do
            html="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "${base}/?probe=${GITHUB_SHA}-projects-catalog-${attempt}" 2>/dev/null || true)"
            if grep -Fq "aria-test-catalog-version' content='${expected_version}'" <<<"$html" &&
               grep -Fq "aria-test-catalog-total' content='${expected_total}'" <<<"$html"; then break; fi
            test "$attempt" -lt 60 && sleep 2
          done
          test -n "$html"
          echo "PROJECTS_CANONICAL_TEST_CATALOG_LIVE_OK version=${expected_version} total=${expected_total}"

      - name: Execute authenticated Projects + ARTIA E2E
        working-directory: rwht/pc-browser
        env:
          RWHT_ARTIFACT_DIR: projects-e2e-artifacts
          RWHT_TIMEOUT_MS: '180000'
        run: node rwht-projects-e2e.mjs

      - name: Upload Projects RWHT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-projects-rwht-evidence
          path: |
            rwht/pc-browser/projects-e2e-artifacts
          if-no-files-found: warn

      - name: Persist Projects + ARTIA certification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_ISSUE: "1011"
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reportPath = 'rwht/pc-browser/projects-e2e-artifacts/projects-rwht-report.json';
          let report = null;
          try { report = JSON.parse(fs.readFileSync(reportPath, 'utf8')); } catch {}
          const status = report?.verified === true ? 'PASS' : 'FAIL';
          const body = [
            '## Projects + ARTIA RWHT — ' + status,
            '',
            '- **Commit ejecutado:** `' + process.env.GITHUB_SHA + '`',
            '- **Workflow run:** ' + process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID,
            '- **Resultado reportado:** `' + status + '`',
            '- **Proyectos:** `' + (report?.project_count ?? '—') + '`',
            '- **Previews overview:** `' + JSON.stringify(report?.overview_preview_results ?? []) + '`',
            '- **Previews ARTIA:** `' + JSON.stringify(report?.preview_results ?? []) + '`',
            '- **Misiones visuales:** `' + JSON.stringify(report?.visual_missions ?? []) + '`',
            '- **Errores de página:** `' + (report?.page_errors?.length ?? '—') + '`',
            '- **Errores de consola:** `' + (report?.console_errors?.length ?? '—') + '`',
            '- **Failed responses:** `' + (report?.failed_responses?.length ?? '—') + '`',
            '',
            'Fuente: artifact `aria-projects-rwht-evidence` del mismo run.'
          ].join('\n');
          const res = await fetch('https://api.github.com/repos/Robvg9/aria-worker/issues/' + process.env.CERT_ISSUE + '/comments', {
            method: 'POST',
            headers: {
              authorization: 'Bearer ' + process.env.GH_TOKEN,
              accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'content-type': 'application/json'
            },
            body: JSON.stringify({ body })
          });
          if (!res.ok) {
            const responseText = await res.text();
            throw new Error('GitHub issue comment failed: ' + res.status + ' ' + responseText.slice(0, 500));
          }
          console.log('PROJECTS_ARTIA_CERTIFICATION_EVIDENCE_PERSISTED');
          NODE

      - name: Remove temporary authentication state
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/aria-rwht-auth-state.json"

# Final certification trigger 2026-10-01.
