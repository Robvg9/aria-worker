name: Continuous Evolution v2

on:
  workflow_dispatch:
  push:
    branches: [aria/continuous-evolution-v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  evolution-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: node --check autonomy/continuous-evolution-v2.js && node --check tests/continuous-evolution-v2.test.js
      - name: Contract
        run: node tests/continuous-evolution-v2.test.js
