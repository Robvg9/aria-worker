name: ARIA PR Windows Queue Guard

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel known zombie Windows run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          zombie_runs=(34783524746)
          for run_id in "${zombie_runs[@]}"; do
            echo "CANCEL_EXACT_RUN=$run_id"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/actions/runs/$run_id/cancel" >/dev/null || true
          done
          echo 'ARIA_EXACT_ZOMBIE_CANCEL=REQUESTED'
