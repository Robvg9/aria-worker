name: ARIA Voice V4 Heed Spanish KWS training benchmark

on:
  push:
    branches:
      - feat/aria-voice-v4-diagnostics-20261102
    paths:
      - voice-v4/heed-kws/**
      - .github/workflows/aria-voice-v4-heed-kws.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heed-spanish-train:
    name: Train ARIA / Oye ARIA with synthetic Spanish TTS and held-out evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Spanish TTS and audio utilities
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends espeak-ng ffmpeg

      - name: Install pinned Heed training and export runtime
        run: python -m pip install --disable-pip-version-check "heed-wakeword[export]==0.1.4"

      - name: Train and evaluate both Spanish activation phrases
        run: |
          python voice-v4/heed-kws/heed_spanish_training_smoke.py \
            --workdir "$RUNNER_TEMP/aria-heed" \
            --report "$RUNNER_TEMP/aria-heed-report.json"

      - name: Upload aggregate model evaluation only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-heed-spanish-kws-aggregate
          path: |
            ${{ runner.temp }}/aria-heed-report.json
            ${{ runner.temp }}/aria-heed/shortlisted-models/*.onnx
          if-no-files-found: ignore
          retention-days: 7
