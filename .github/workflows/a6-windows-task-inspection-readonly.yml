name: A6 Windows task owner read-only inspection

on:
  push:
    branches:
      - ops/a6-windows-agent-v2-heartbeat-preflight-v1
    paths:
      - '.github/workflows/a6-windows-task-inspection-readonly.yml'

permissions:
  contents: read

concurrency:
  group: a6-windows-task-owner-readonly
  cancel-in-progress: false

jobs:
  inspect:
    name: Identify exact ARIA watchdog task and process owner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Read task XML and PID ancestry without modifying anything
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ine 'ROBVG') { throw "A6_HOST_MISMATCH=$env:COMPUTERNAME" }
          $root = 'D:\ARIA-Windows-Agent'
          $logs = Join-Path $root 'Logs'
          function Read-Pid([string]$path) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { return $null }
            $id = 0
            if ([int]::TryParse((Get-Content -Raw -LiteralPath $path).Trim(),[ref]$id)) { return $id }
            return $null
          }
          $agentPid = Read-Pid (Join-Path $logs 'agent.pid')
          $watchdogPid = Read-Pid (Join-Path $logs 'watchdog.pid')
          $result = [ordered]@{
            host = $env:COMPUTERNAME
            captured_at_utc = [DateTimeOffset]::UtcNow.ToString('o')
            agent_pid_file = $agentPid
            watchdog_pid_file = $watchdogPid
            exact_task_queries = @()
            task_list_matches = @()
            process_ancestry = @()
            services_for_pid = @()
            mutations = 'NONE_READ_ONLY'
          }
          foreach ($taskName in @('SpaceAgentTask','ARIA-Windows-Local-Agent','ARIA Persistent Windows Worker')) {
            $xmlLines = @(& schtasks.exe /Query /TN $taskName /XML 2>&1)
            $exit = $LASTEXITCODE
            $entry = [ordered]@{ task_name=$taskName; exit_code=$exit; xml_read=false; command=$null; arguments=$null; user=$null; logon_type=$null; run_level=$null }
            if ($exit -eq 0) {
              try {
                [xml]$xml = ($xmlLines -join [Environment]::NewLine)
                $entry.command = [string]$xml.SelectSingleNode("//*[local-name()='Actions']/*[local-name()='Exec']/*[local-name()='Command']").InnerText
                $entry.arguments = [string]$xml.SelectSingleNode("//*[local-name()='Actions']/*[local-name()='Exec']/*[local-name()='Arguments']").InnerText
                $entry.user = [string]$xml.SelectSingleNode("//*[local-name()='Principals']/*[local-name()='Principal']/*[local-name()='UserId']").InnerText
                $entry.logon_type = [string]$xml.SelectSingleNode("//*[local-name()='Principals']/*[local-name()='Principal']/*[local-name()='LogonType']").InnerText
                $entry.run_level = [string]$xml.SelectSingleNode("//*[local-name()='Principals']/*[local-name()='Principal']/*[local-name()='RunLevel']").InnerText
                $entry.xml_read = $true
                $entry.arguments = $entry.arguments -replace '(?i)(token|secret|password|authorization)(\s*[:=]\s*|\s+)[^\s;]+','$1$2[REDACTED]'
              } catch { $entry.parse_error = $_.Exception.GetType().Name }
            } else {
              $entry.error = (($xmlLines | ForEach-Object { [string]$_ }) -join ' ').Substring(0,[Math]::Min(300,(($xmlLines | ForEach-Object { [string]$_ }) -join ' ').Length))
            }
            $result.exact_task_queries += $entry
          }
          try {
            $csv = @(& schtasks.exe /Query /FO CSV /V 2>&1)
            $csvExit = $LASTEXITCODE
            if ($csvExit -eq 0) {
              $result.task_list_matches = @($csv | Where-Object { $_ -match '(?i)SpaceAgent|ARIA|Windows.*Agent|agent.*windows' } | Select-Object -First 30)
            } else {
              $result.task_list_error = "SCHTASKS_QUERY_EXIT=$csvExit"
            }
          } catch { $result.task_list_error = $_.Exception.GetType().Name }
          $all = @(Get-CimInstance Win32_Process -ErrorAction Stop)
          $byId = @{}
          foreach ($p in $all) { $byId[[int]$p.ProcessId] = $p }
          foreach ($id in @($agentPid,$watchdogPid) | Where-Object { $_ -is [int] -and $_ -gt 0 }) {
            $p = $byId[[int]$id]
            if ($p) {
              $parent = $byId[[int]$p.ParentProcessId]
              $result.process_ancestry += @{
                pid=[int]$p.ProcessId; name=[string]$p.Name; session_id=[int]$p.SessionId
                parent_pid=[int]$p.ParentProcessId; parent_name=if($parent){[string]$parent.Name}else{$null}
                executable_path=[string]$p.ExecutablePath
              }
            } else {
              $result.process_ancestry += @{ pid=[int]$id; state='NOT_RUNNING' }
            }
          }
          try {
            $ids = @($agentPid,$watchdogPid) | Where-Object { $_ -is [int] -and $_ -gt 0 }
            $result.services_for_pid = @(Get-CimInstance Win32_Service -ErrorAction Stop |
              Where-Object { $ids -contains [int]$_.ProcessId } |
              Select-Object Name,DisplayName,State,StartMode,StartName,ProcessId)
          } catch {
            $result.services_query_error = $_.Exception.GetType().Name
          }
          $out = Join-Path $env:GITHUB_WORKSPACE 'a6-windows-task-inspection.json'
          $result | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $out -Encoding UTF8
          Write-Host "A6_TASK_INSPECTION=PASS"
          Write-Host "A6_AGENT_PID=$agentPid"
          Write-Host "A6_WATCHDOG_PID=$watchdogPid"
          Write-Host "A6_TASK_XML_SUCCESS=$(@($result.exact_task_queries | Where-Object { $_.xml_read }).Count)"
      - name: Upload read-only task identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-windows-task-inspection-${{ github.sha }}
          path: a6-windows-task-inspection.json
          if-no-files-found: warn
          retention-days: 14
