name: ECC Phase 17 Hook Event Adapter

on:
  pull_request:
    branches:
      - aria/ecc-phase-16-mcp-bridge
    paths:
      - 'scripts/ecc-hook-events.js'
      - 'tests/ecc-hook-events.test.js'
      - '.github/workflows/ecc-phase17-hook-events.yml'
  push:
    branches:
      - 'aria/ecc-phase-17-hook-events'
    paths:
      - 'scripts/ecc-hook-events.js'
      - 'tests/ecc-hook-events.test.js'
      - '.github/workflows/ecc-phase17-hook-events.yml'

permissions:
  contents: read

jobs:
  hooks:
    name: ECC Phase 17 / hook event adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract test
        run: node tests/ecc-hook-events.test.js
