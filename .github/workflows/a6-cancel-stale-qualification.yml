name: A6 Stale Qualification Queue Cleanup

on:
  push:
    branches:
      - ops/a6-windows-agent-v2-heartbeat-preflight-v1
    paths:
      - '.github/workflows/a6-cancel-stale-qualification.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    name: Cancel one superseded queued A6 qualification
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only the verified stale queued run
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_RUN_ID: '43331993105'
          STALE_HEAD_SHA: 'ecf32dbbb692fe41b59d2cbe5a057d218200b903'
          EXPECTED_BRANCH: 'ops/a6-windows-agent-v2-heartbeat-preflight-v1'
          EXPECTED_NAME: 'A6 Windows Agent v2 Install + 15-minute ACK Qualification'
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          run_json="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$repo/actions/runs/$STALE_RUN_ID")"
          status="$(jq -r '.status' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          head_branch="$(jq -r '.head_branch' <<<"$run_json")"
          name="$(jq -r '.name' <<<"$run_json")"
          if [[ "$status" == "queued" && "$head_sha" == "$STALE_HEAD_SHA" && "$head_branch" == "$EXPECTED_BRANCH" && "$name" == "$EXPECTED_NAME" ]]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/actions/runs/$STALE_RUN_ID/cancel" >/dev/null
            echo "A6_STALE_QUEUED_RUN_CANCEL_REQUESTED=$STALE_RUN_ID"
          else
            echo "A6_STALE_QUEUED_RUN_NOT_CANCELLED status=$status sha=$head_sha branch=$head_branch name=$name"
            if [[ "$status" == "queued" && "$head_sha" == "$STALE_HEAD_SHA" && "$head_branch" == "$EXPECTED_BRANCH" && "$name" == "$EXPECTED_NAME" ]]; then exit 1; fi
          fi
