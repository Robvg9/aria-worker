name: ECC Phase 13 Unified Memory

on:
  pull_request:
    branches:
      - aria/ecc-phase-12-failure-memory
    paths:
      - 'scripts/ecc-unified-memory.js'
      - 'tests/ecc-unified-memory.test.js'
      - '.github/workflows/ecc-phase13-unified-memory.yml'
  push:
    branches:
      - 'aria/ecc-phase-13-unified-memory'
    paths:
      - 'scripts/ecc-unified-memory.js'
      - 'tests/ecc-unified-memory.test.js'
      - '.github/workflows/ecc-phase13-unified-memory.yml'

permissions:
  contents: read

jobs:
  memory:
    name: ECC Phase 13 / unified memory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract test
        run: node tests/ecc-unified-memory.test.js
