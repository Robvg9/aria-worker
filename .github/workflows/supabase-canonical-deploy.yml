name: Deploy ARIA Supabase Runtime
# Phase 4 migration reconciliation LIVE certification trigger; behavior unchanged.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'autonomy/**'
      - 'scripts/patch-eas-into-mission-runner-v22.js'
      - '.github/workflows/supabase-canonical-deploy.yml'
      - 'tests/mission-runner-v22-executor-inference.test.js'
      - 'tests/phase3-canonical-runtime-contract.test.js'
      - 'tests/supabase-canonical-deploy-contract.test.js'
      - 'runtime/**'
      - 'health/effective-status.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aria-supabase-runtime-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Validate EAS contracts
        run: |
          node tests/aria-eas-mcp-contract.test.js
          node tests/eas-universal-executor.test.js
          node tests/eas-runner-patch.test.js
          node tests/mission-runner-v22-executor-inference.test.js
          node tests/aria-app-api-v3-contract.test.js
          node tests/phase3-canonical-runtime-contract.test.js
          node tests/phase4-jobs-recovery-contract.test.js
          node tests/operational-diagnostics.test.js
          node tests/aria-app-api-v3-diagnostics-contract.test.js
          node tests/phase5-diagnostics-db-contract.test.js
          node tests/supabase-canonical-deploy-contract.test.js
      - name: Detect migration changes
        id: migration_changes
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-list --parents -n 1 "$GITHUB_SHA" | cut -d' ' -f2)"
          if [[ -z "$BASE_SHA" ]]; then
            echo "ERROR: unable to determine first parent for $GITHUB_SHA"
            exit 1
          fi
          echo "MIGRATION_DIFF_BASE_SHA=$BASE_SHA"
          if git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -q '^supabase/migrations/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply Supabase migrations
        if: steps.migration_changes.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

          rm -rf .ci/supabase-migrations-source
          mkdir -p .ci/supabase-migrations-source
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 | while IFS= read -r -d '' file; do
            mv "$file" ".ci/supabase-migrations-source/$(basename "$file")"
          done

          supabase migration fetch --linked --yes

          declare -A remote_hashes=()
          declare -A remote_versions=()
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [[ ! "$name" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              continue
            fi
            hash="$(sha256sum "$file" | awk '{print $1}')"
            version="${name%%_*}"
            remote_hashes["$hash"]=1
            remote_versions["$version"]="$hash"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0)

          remote_max_version=""
          for version in "${!remote_versions[@]}"; do
            if [[ -z "$remote_max_version" || "$version" > "$remote_max_version" ]]; then
              remote_max_version="$version"
            fi
          done
          echo "REMOTE_MAX_MIGRATION_VERSION=$remote_max_version"

          pending=0
          for file in .ci/supabase-migrations-source/*.sql; do
            [[ -e "$file" ]] || continue
            name="$(basename "$file")"
            if [[ ! "$name" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              echo "LEGACY_MIGRATION_IGNORED=$name"
              continue
            fi
            hash="$(sha256sum "$file" | awk '{print $1}')"
            version="${name%%_*}"

            if [[ -n "$remote_max_version" ]] && [[ "$(printf '%s\n' "$version" "$remote_max_version" | sort -n | head -n1)" == "$version" ]]; then
              if [[ -n "${remote_versions[$version]+x}" ]]; then
                if [[ "${remote_versions[$version]}" = "$hash" ]]; then
                  echo "MIGRATION_ALREADY_APPLIED=$name"
                else
                  echo "MIGRATION_VERSION_CONTENT_DRIFT=$name"
                  echo "HISTORICAL_MIGRATION_VERSION_CONTENT_DRIFT_IGNORED=$name"
                fi
              elif [[ -n "${remote_hashes[$hash]+x}" ]]; then
                echo "MIGRATION_ALREADY_APPLIED=$name"
              else
                echo "HISTORICAL_LOCAL_DRIFT_IGNORED=$name"
              fi
              continue
            fi

            if [[ -n "${remote_hashes[$hash]+x}" ]]; then
              echo "MIGRATION_ALREADY_APPLIED=$name"
              continue
            fi
            cp "$file" "supabase/migrations/$name"
            echo "MIGRATION_PENDING=$name"
            pending=$((pending + 1))
          done

          duplicate_versions="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]{14})_.*/\1/' | sort | uniq -d)"
          if [[ -n "$duplicate_versions" ]]; then
            echo "ERROR: duplicate pending migration versions:"
            echo "$duplicate_versions"
            exit 1
          fi

          echo "MIGRATIONS_PENDING_COUNT=$pending"
          if (( pending > 0 )); then
            echo "APPLYING_PENDING_MIGRATIONS=true"
            supabase db push --include-all --yes
          else
            echo "APPLYING_PENDING_MIGRATIONS=false"
            echo "SUPABASE_MIGRATION_NOOP=true"
          fi
      - name: Deploy canonical ARIA functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          node scripts/patch-eas-into-mission-runner-v22.js supabase/functions/aria-mission-runner-v22/index.ts
          # Phase 3: only the canonical execution chain is release-bearing.
          # Legacy planner/runner/supervisor slots remain compatibility-only and are not re-deployed.
          supabase functions deploy aria-planner-v11 --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy aria-canonical-runtime-v1 --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy aria-mission-runner-v22 --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy aria-runtime-gateway-v1 --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy aria-execution-runtime-v1 --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy aria-device-gateway --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy aria-smart-verifier-v1 --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy aria-agent-runtime-v1 --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy aria-gemini-direct-live-check-v1 --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy aria-direct-v1 --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy aria-app-api-v3 --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy aria-github-app-runtime-v1 --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy aria-memory-v2 --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy aria-mcp-inbound-grok-v1 --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
# Final 3/7 notification cutover verification trigger: keep production workflows exercising the exact main state.

