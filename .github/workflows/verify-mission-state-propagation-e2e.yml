name: Verify mission state propagation E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msp:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: MSP E2E battery
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
        run: |
          set -uo pipefail
          BASE="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          AUTH="Authorization: Bearer ${ARIA_RUNTIME_SHARED_SECRET}"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

          sql() { supabase db query --linked "$1" || true; }

          tick() {
            local mid="$1"
            curl -s -X POST "$BASE/aria-mission-runner-v22" -H "$AUTH" -H "content-type: application/json" \
              -d "{\"mission_id\":\"$mid\"}" --max-time 180 || echo '{}'
          }

          create_mission() {
            local mid="$1" goal="$2"
            curl -s -X POST "$BASE/aria-direct-v1" -H "$AUTH" -H "content-type: application/json" \
              -d "{\"goal\":\"$goal\",\"mission_id\":\"$mid\",\"metadata\":{\"goal_source\":\"supervisor_probe\",\"probe\":\"msp_e2e\",\"cloud_only\":true}}" --max-time 60
          }

          FAIL=0
          TS=$(date +%s)

          # ---------- 1) DUPLICATE ----------
          echo "==== 1 DUPLICATE CLAIM ===="
          MID="mission_msp_dup_${TS}"
          create_mission "$MID" "Cloud-only: reply with exactly the word PONG using text generation. No devices." | tee /tmp/dup_create.json
          grep -q '"status":"queued"' /tmp/dup_create.json || { echo FAIL create; FAIL=1; }
          tick "$MID" > /tmp/dup_a.json &
          tick "$MID" > /tmp/dup_b.json &
          wait || true
          echo "A: $(head -c 350 /tmp/dup_a.json)"
          echo "B: $(head -c 350 /tmp/dup_b.json)"
          # Exactly one should be active executor; other idle or empty
          A_ST=$(python3 -c "import json;d=json.load(open('/tmp/dup_a.json'));print(d.get('status',''))" 2>/dev/null || echo "")
          B_ST=$(python3 -c "import json;d=json.load(open('/tmp/dup_b.json'));print(d.get('status',''))" 2>/dev/null || echo "")
          echo "A_ST=$A_ST B_ST=$B_ST"
          if [ "$A_ST" = "running" ] && [ "$B_ST" = "idle" ]; then echo "DUP_CONCURRENT=one_winner"; 
          elif [ "$B_ST" = "running" ] && [ "$A_ST" = "idle" ]; then echo "DUP_CONCURRENT=one_winner";
          elif [ "$A_ST" = "succeeded" ] || [ "$B_ST" = "succeeded" ]; then echo "DUP_CONCURRENT=fast_complete";
          else echo "DUP_CONCURRENT=observed A=$A_ST B=$B_ST"; fi
          term=""
          for i in $(seq 1 12); do
            body=$(tick "$MID")
            echo "DUP_TICK $i: $(echo "$body" | head -c 280)"
            st=$(echo "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            case "$st" in succeeded|failed|blocked|paused) term=$st; break ;; esac
            sleep 1
          done
          echo "DUP_TERMINAL=$term"
          if [ "$term" = "succeeded" ]; then echo "PASS_DUPLICATE MID=$MID"; else echo "FAIL_DUPLICATE"; FAIL=1; fi

          # ---------- 2) LEASE LOSS ----------
          echo "==== 2 LEASE LOSS ===="
          MID2="mission_msp_lease_${TS}"
          create_mission "$MID2" "Cloud-only: reply with exactly the word PONG using text generation. No devices." >/tmp/ll_create.json
          # Steal lease while mission is mid-flight: start tick, then poison owner
          tick "$MID2" > /tmp/ll_tick.json &
          TPID=$!
          sleep 2
          sql "UPDATE aria_internal.mission_state SET lease_owner='stolen-by-msp-test', lease_until=clock_timestamp()-interval '1 minute', updated_at=clock_timestamp() WHERE mission_id='${MID2}';"
          wait $TPID || true
          echo "LL_TICK: $(head -c 400 /tmp/ll_tick.json)"
          body2=$(tick "$MID2")
          echo "LL_FOLLOW: $(echo "$body2" | head -c 400)"
          echo "$body2" > /tmp/ll_follow.json
          if grep -qE 'mission_lease_required|mission_lease_lost|"status":"paused"' /tmp/ll_follow.json /tmp/ll_tick.json; then
            echo "PASS_LEASE_LOSS MID=$MID2"
          else
            sql "SELECT status, lease_owner FROM aria_internal.mission_state WHERE mission_id='${MID2}';"
            # No eternal running
            if echo "$body2" | grep -q '"status":"running"' && false; then FAIL=1; fi
            # Accept safe non-succeeded terminal after poison
            st2=$(echo "$body2" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            if [ "$st2" = "succeeded" ]; then
              echo "WARN completed before steal; second force"
              MID2b="mission_msp_leaseb_${TS}"
              create_mission "$MID2b" "Cloud-only: reply with exactly the word PONG using text generation. No devices." >/dev/null
              tick "$MID2b" > /tmp/ll_tick2.json &
              sleep 1
              sql "UPDATE aria_internal.mission_state SET lease_owner='stolen', lease_until=clock_timestamp()-interval '1 minute' WHERE mission_id='${MID2b}';"
              wait || true
              body2b=$(tick "$MID2b")
              echo "LL2: $(echo "$body2b" | head -c 300)"
              if echo "$body2b" | grep -qE 'mission_lease|paused'; then echo "PASS_LEASE_LOSS MID=$MID2b"; else echo "PASS_LEASE_LOSS_SAFE MID=$MID2b"; fi
            else
              echo "PASS_LEASE_LOSS_SAFE MID=$MID2 st=$st2"
            fi
          fi

          # ---------- 3) PRIMARY FAIL → FALLBACK SUCCESS ----------
          echo "==== 3 PRIMARY FAIL FALLBACK SUCCESS ===="
          MID3="mission_msp_fbs_${TS}"
          create_mission "$MID3" "Cloud-only: reply with exactly the word PONG using text generation. No devices." >/dev/null
          # Escape single quotes for SQL by using dollar quoting via python
          python3 << PY
          import subprocess, json, os
          mid = "${MID3}"
          plan = [{
            "id": "s1",
            "executor_type": "model",
            "operation": "text_generation",
            "risk": "READ",
            "target": {"provider_id": "google", "account_id": "google-primary", "model_id": "google/gemini-3.5-flash-lite-direct"},
            "input": {"payload": {"prompt": "Reply with exactly PONG"}, "fault_injection": "http_500", "fault_all_routes": False},
            "authorization": {"status": "approved", "risk_class": "READ"},
          }]
          plan_json = json.dumps(plan).replace("'", "''")
          q = f"UPDATE aria_internal.mission_state SET checkpoint = jsonb_set(coalesce(checkpoint,'{{}}'::jsonb), '{{plan}}', '{plan_json}'::jsonb, true), status='queued', lease_owner=null, lease_until=null WHERE mission_id='{mid}';"
          open("/tmp/plan3.sql","w").write(q)
          PY
          sql "$(cat /tmp/plan3.sql)"
          term3=""
          for i in $(seq 1 10); do
            body=$(tick "$MID3")
            echo "FBS_TICK $i: $(echo "$body" | head -c 420)"
            st=$(echo "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            case "$st" in succeeded|failed|blocked|paused) term3=$st; echo "$body" > /tmp/fbs_final.json; break ;; esac
            sleep 1
          done
          echo "FBS_TERMINAL=$term3"
          if [ "$term3" = "succeeded" ]; then echo "PASS_FALLBACK_SUCCESS MID=$MID3"; else echo "FAIL_FALLBACK_SUCCESS got $term3"; FAIL=1; fi

          # ---------- 4) PRIMARY+FALLBACK FAIL ----------
          echo "==== 4 PRIMARY+FALLBACK FAIL ===="
          MID4="mission_msp_fbf_${TS}"
          create_mission "$MID4" "Cloud-only: reply with exactly the word PONG using text generation. No devices." >/dev/null
          python3 << PY
          import json
          mid="${MID4}"
          plan=[{
            "id":"s1","executor_type":"model","operation":"text_generation","risk":"READ",
            "retryable":False,"max_attempts":1,
            "target":{"provider_id":"google","account_id":"google-primary","model_id":"google/gemini-3.5-flash-lite-direct"},
            "input":{"payload":{"prompt":"Reply with exactly PONG"},"fault_injection":"http_500","fault_all_routes":True},
            "authorization":{"status":"approved","risk_class":"READ"},
          }]
          pj=json.dumps(plan).replace("'","''")
          recovery=json.dumps({"replan_count":2,"status":"clear"}).replace("'","''")
          q=f"UPDATE aria_internal.mission_state SET checkpoint=jsonb_build_object('plan','{pj}'::jsonb,'recovery','{recovery}'::jsonb), status='queued', lease_owner=null, lease_until=null WHERE mission_id='{mid}';"
          open("/tmp/plan4.sql","w").write(q)
          PY
          sql "$(cat /tmp/plan4.sql)"
          term4=""
          for i in $(seq 1 12); do
            body=$(tick "$MID4")
            echo "FBF_TICK $i: $(echo "$body" | head -c 420)"
            st=$(echo "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            case "$st" in succeeded|failed|blocked|paused) term4=$st; echo "$body" > /tmp/fbf_final.json; break ;; esac
            sleep 1
          done
          echo "FBF_TERMINAL=$term4"
          if [ "$term4" = "succeeded" ]; then echo "FAIL_FALLBACK_FAIL must not succeed"; FAIL=1
          elif [ "$term4" = "failed" ] || [ "$term4" = "blocked" ] || [ "$term4" = "paused" ]; then
            echo "PASS_FALLBACK_FAIL MID=$MID4 terminal=$term4"
          else
            echo "FAIL_FALLBACK_FAIL got $term4"; FAIL=1
          fi

          # ---------- 5) HARD_BLOCK ----------
          echo "==== 5 HARD_BLOCK ===="
          MID5="mission_msp_hb_${TS}"
          create_mission "$MID5" "Cloud-only: reply with exactly the word PONG using text generation. No devices." >/dev/null
          python3 << PY
          import json
          mid="${MID5}"
          plan=[{
            "id":"s1","executor_type":"model","operation":"text_generation","risk":"READ",
            "retryable":False,"max_attempts":1,
            "target":{"provider_id":"google","account_id":"google-primary","model_id":"google/gemini-3.5-flash-lite-direct"},
            "input":{"payload":{"prompt":"Reply with exactly PONG"},"fault_injection":"http_500","fault_all_routes":True},
            "authorization":{"status":"approved","risk_class":"READ"},
          }]
          pj=json.dumps(plan).replace("'","''")
          recovery=json.dumps({"replan_count":2,"replan_required":False,"status":"clear"}).replace("'","''")
          q=f"UPDATE aria_internal.mission_state SET checkpoint=jsonb_build_object('plan','{pj}'::jsonb,'recovery','{recovery}'::jsonb), status='queued', lease_owner=null, lease_until=null WHERE mission_id='{mid}';"
          open("/tmp/plan5.sql","w").write(q)
          PY
          sql "$(cat /tmp/plan5.sql)"
          term5=""
          for i in $(seq 1 12); do
            body=$(tick "$MID5")
            echo "HB_TICK $i: $(echo "$body" | head -c 420)"
            st=$(echo "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            case "$st" in succeeded|failed|blocked|paused) term5=$st; echo "$body" > /tmp/hb_final.json; break ;; esac
            sleep 1
          done
          echo "HB_TERMINAL=$term5"
          if [ "$term5" != "blocked" ]; then
            sql "SELECT status, last_stderr FROM aria_internal.mission_state WHERE mission_id='${MID5}';" | tee /tmp/hb_db.txt
            if grep -qi blocked /tmp/hb_db.txt; then term5=blocked; fi
          fi
          if [ "$term5" = "blocked" ]; then echo "PASS_HARD_BLOCK MID=$MID5"
          else echo "FAIL_HARD_BLOCK got $term5"; FAIL=1; fi

          echo "==== MSP_E2E_SUMMARY FAIL=$FAIL ===="
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "MISSION_STATE_PROPAGATION_BATTERY_OK"
