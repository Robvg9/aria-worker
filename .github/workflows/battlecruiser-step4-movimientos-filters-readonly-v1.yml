name: BattleCruiser Step 4 Movimientos Type Filter Restore V1 (Read Only)
# Android device reconnected; re-run safe filter selection and restoration test.
on:
  push:
    branches:
      - aria/bc-step4-android-e2e-20261021
    paths:
      - .github/workflows/battlecruiser-step4-movimientos-filters-readonly-v1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-step4-movimientos-filters-readonly-v1-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  android-movimientos-filters-readonly-v1:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Observe read-only Mando audit type/status filters and restore defaults
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.request, urllib.error
          project=os.environ.get('SUPABASE_PROJECT_REF','').strip()
          secret=os.environ.get('ARIA_RUNTIME_SHARED_SECRET','')
          if not project or not secret: raise SystemExit('BLOCKED: production secrets unavailable')
          base=f'https://{project}.supabase.co/functions/v1'
          headers={'Authorization':'Bearer '+secret,'content-type':'application/json','cache-control':'no-store'}
          mission_id=f"mission_bc_step4_movimientos_filters_readonly_v1_{os.environ['RUN_ID']}_{os.environ['RUN_ATTEMPT']}"
          device='android-termux-a1ebcfc7-9287-4603-a0f9-c519d12fd092'
          marker='BC_STEP4_MOVIMIENTOS_FILTERS_READONLY_V1'
          command=r"""node <<'NODE'
          const {executeAndroidAccessibilityJob,probeLocalIpcHealth}=require('./computer-use/android-accessibility-v1.js');
          const marker='BC_STEP4_MOVIMIENTOS_FILTERS_READONLY_V1',host='battlecruiser.robvg9.workers.dev';
          const expectedBuild='3708b31b319884f7d42082414a82cdd11450fe2d';
          const base={target_package:'com.android.chrome',allow_any_app:false,allowed_hosts:[host]};
          const clean=s=>typeof s==='string'?s.replace(/\s+/g,' ').trim().replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig,'[redacted]').slice(0,120):'';
          const norm=s=>clean(s).toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n').trim();
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function send(q){return await executeAndroidAccessibilityJob({command:JSON.stringify({...base,...q}),timeoutMs:16000});}
          async function observe(){const r=await send({operation:'observe'}),p=r&&r.payload||{},root=p.root||(p.ui&&p.ui.root)||null;return {r,p,root};}
          async function action(a){return await send({operation:'action',action:a});}
          function scan(root){const nodes=[],seen=new Set();let count=0;const walk=(n,path,d)=>{if(!n||typeof n!=='object'||Array.isArray(n)||seen.has(n)||d>28||count>=1200)return;seen.add(n);count++;const names=['name','label','contentDescription','text','hint'].map(k=>clean(n[k])).filter(Boolean);nodes.push({id:typeof n.id==='string'&&n.id?n.id:path,path,role:clean(n.role),className:clean(n.className||n.class),names,text:names.join(' | '),visible:n.visible!==false,clickable:!!n.clickable,enabled:n.enabled!==false,scrollable:!!n.scrollable,bounds:n.bounds||null});if(Array.isArray(n.children))n.children.forEach((c,i)=>walk(c,path+'.'+i,d+1));};walk(root,'0',0);return nodes;}
          const exact=(nodes,label,opts={})=>nodes.find(n=>n.names.some(t=>norm(t)===norm(label))&&(!opts.visible||n.visible)&&(!opts.clickable||n.clickable)&&(!opts.enabled||n.enabled));
          const control=(ns,label)=>ns.find(n=>n.visible&&n.enabled&&n.clickable&&norm(n.text)===norm(label));
          function snapshot(cur){
            const ns=cur.root?scan(cur.root):[];
            return {hash:cur.p&&cur.p.evidence_hash||null,nodeCount:ns.length,
              controls:ns.filter(n=>n.visible&&n.text&&/movimientos|todos los almacenes|todos los tipos|aplicar|compra|venta|transf|vale|sin movimientos|no hay movimientos|no se encontraron/i.test(norm(n.text))).slice(0,30).map(n=>({id:n.id,text:clean(n.text),role:n.role,visible:n.visible,clickable:n.clickable,enabled:n.enabled,bounds:n.bounds})),
              scrollables:ns.filter(n=>n.visible&&n.scrollable).map(n=>({id:n.id,path:n.path,bounds:n.bounds})).slice(0,8),
              emptyMarker:ns.some(n=>n.visible&&/sin movimientos|no hay movimientos|no se encontraron movimientos/i.test(norm(n.text)))};
          }
          async function fresh(){let c=await observe();for(let k=0;k<4&&(!c.root||c.p.ok!==true);k++){await wait(450);c=await observe();}return c;}
          async function clickWait(node,label,timeline){const r=await action({action:'click',nodeId:node.id});timeline.push({step:label,status:r&&r.status,reason:clean(r&&r.reason||r&&r.payload&&r.payload.reason)});await wait(450);return fresh();}
          async function scrollBodyUntil(cur,predicate,timeline){
            for(let k=0;k<5;k++){
              let ns=cur.root?scan(cur.root):[];
              if(predicate(ns))return cur;
              const r=await action({action:'swipe',x1:540,y1:1900,x2:540,y2:900,durationMs:450});
              timeline.push({step:'swipe_movimientos_to_filters_'+(k+1),status:r&&r.status,reason:clean(r&&r.reason||r&&r.payload&&r.payload.reason)});
              await wait(450);cur=await fresh();
            }
            return cur;
          }
          async function chooseOption(cur,option,timeline,step){
            let ns=cur.root?scan(cur.root):[],opt=exact(ns,option,{visible:true,clickable:true,enabled:true})||ns.find(n=>n.visible&&n.enabled&&n.clickable&&norm(n.text)===norm(option));
            if(!opt)return {ok:false,stage:'option_not_found',option,cur};
            const before=cur.p&&cur.p.evidence_hash||null;
            cur=await clickWait(opt,step,timeline);
            const after=cur.p&&cur.p.evidence_hash||null;
            return {ok:true,option,hashBefore:before,hashAfter:after,hashChanged:!!before&&!!after&&before!==after,cur};
          }
          (async()=>{
            const h=await probeLocalIpcHealth({timeoutMs:2500}),hp=h&&h.payload||{};
            const exactBuild=h&&h.ok===true&&String(hp.version_name)==='1.1.23'&&Number(hp.version_code)===29&&String(hp.build_id)===expectedBuild;
            if(!exactBuild){console.log(JSON.stringify({marker,ok:false,stage:'exact_agent_build_mismatch',build:{ok:!!h?.ok,version_name:hp.version_name||null,version_code:hp.version_code||null,build_id:hp.build_id||null}}));process.exitCode=20;return;}
            const timeline=[],outcomes=[];
            const nav=await action({action:'navigate',url:'https://'+host+'/'});timeline.push({step:'navigate_live',status:nav&&nav.status,reason:clean(nav&&nav.reason||nav&&nav.payload&&nav.payload.reason)});await wait(1200);
            let cur=await fresh(),ns=cur.root?scan(cur.root):[],open=exact(ns,'Abrir menú',{visible:true,clickable:true,enabled:true});
            for(let k=0;k<8&&!open;k++){await wait(400);cur=await fresh();ns=cur.root?scan(cur.root):[];open=exact(ns,'Abrir menú',{visible:true,clickable:true,enabled:true});}
            if(!open){console.log(JSON.stringify({marker,ok:false,stage:'menu_not_found',timeline,screen:snapshot(cur)}));process.exitCode=1;return;}
            cur=await clickWait(open,'open_menu',timeline);
            let dest=exact(cur.root?scan(cur.root):[],'Movimientos',{visible:true,clickable:true,enabled:true});
            for(let k=0;k<6&&!dest;k++){
              ns=cur.root?scan(cur.root):[];
              const drawer=ns.find(n=>n.visible&&n.scrollable&&n.path.startsWith('0.0.0.0.2'))||ns.find(n=>n.visible&&n.scrollable);
              if(!drawer)break;
              const r=await action({action:'scroll',nodeId:drawer.id,direction:k<3?'backward':'forward'});
              timeline.push({step:'scroll_menu_'+(k+1),status:r&&r.status});await wait(300);cur=await fresh();
              dest=exact(cur.root?scan(cur.root):[],'Movimientos',{visible:true,clickable:true,enabled:true});
            }
            if(!dest){console.log(JSON.stringify({marker,ok:false,stage:'movimientos_button_not_found',timeline,screen:snapshot(cur)}));process.exitCode=2;return;}
            cur=await clickWait(dest,'open_movimientos',timeline);await wait(700);cur=await fresh();
            const hasFilterSet=n=>!!control(n,'Todos los almacenes')&&!!control(n,'Todos los tipos');
            cur=await scrollBodyUntil(cur,hasFilterSet,timeline);
            const baseline=snapshot(cur);ns=cur.root?scan(cur.root):[];
            const typeSel=control(ns,'Todos los tipos');
            if(!typeSel){console.log(JSON.stringify({marker,ok:false,stage:'movement_type_filter_not_visible',build:{version_name:hp.version_name,version_code:hp.version_code,build_id:hp.build_id},timeline,baseline,safety:{businessWrites:false,recordsOpened:false}}));process.exitCode=3;return;}
            cur=await clickWait(typeSel,'open_type_filter',timeline);
            let chosen=await chooseOption(cur,'Venta',timeline,'choose_type_venta');
            if(chosen.ok){
              cur=chosen.cur;ns=cur.root?scan(cur.root):[];
              const labels=ns.filter(n=>n.visible&&n.text&&/todos los tipos|venta|compra|transf|vale/i.test(norm(n.text))).map(n=>clean(n.text)).slice(0,20);
              outcomes.push({filter:'type',status:'selected_and_observed',selected:'Venta',hashBefore:chosen.hashBefore,hashAfter:chosen.hashAfter,hashChanged:chosen.hashChanged,labels});
              ns=cur.root?scan(cur.root):[];let apply=control(ns,'Aplicar');
              for(let k=0;k<3&&!apply;k++){
                const swipe=await action({action:'swipe',x1:540,y1:1900,x2:540,y2:900,durationMs:450});
                timeline.push({step:'swipe_movimientos_apply_after_venta_'+(k+1),status:swipe&&swipe.status,reason:clean(swipe&&swipe.reason||swipe&&swipe.payload&&swipe.payload.reason)});
                await wait(450);cur=await fresh();ns=cur.root?scan(cur.root):[];apply=control(ns,'Aplicar');
              }
              if(apply){cur=await clickWait(apply,'apply_type_filter',timeline);await wait(450);outcomes.push({filter:'apply_after_venta',status:'clicked',hash:cur.p&&cur.p.evidence_hash||null,screen:snapshot(cur)});}
              else outcomes.push({filter:'apply_after_venta',status:'not_found'});
            }else outcomes.push({filter:'type',status:chosen.stage,requested:'Venta'});
            ns=cur.root?scan(cur.root):[];
            let currentType=control(ns,'Venta')||control(ns,'Todos los tipos');
            let restoredSelection=false;
            if(currentType){
              cur=await clickWait(currentType,'open_type_filter_for_restore',timeline);
              const back=await chooseOption(cur,'Todos los tipos',timeline,'restore_type_all');
              if(back.ok){
                cur=back.cur;ns=cur.root?scan(cur.root):[];
                let apply=control(ns,'Aplicar');
                for(let k=0;k<3&&!apply;k++){
                  const swipe=await action({action:'swipe',x1:540,y1:1900,x2:540,y2:900,durationMs:450});
                  timeline.push({step:'swipe_movimientos_apply_after_restore_'+(k+1),status:swipe&&swipe.status,reason:clean(swipe&&swipe.reason||swipe&&swipe.payload&&swipe.payload.reason)});
                  await wait(450);cur=await fresh();ns=cur.root?scan(cur.root):[];apply=control(ns,'Aplicar');
                }
                if(apply){cur=await clickWait(apply,'apply_restored_type_all',timeline);await wait(400);}
                cur=await scrollBodyUntil(cur,hasFilterSet,timeline);ns=cur.root?scan(cur.root):[];
                restoredSelection=!!control(ns,'Todos los tipos');
              }
            }else timeline.push({step:'restore_type_all',status:'not_found'});
            const final=snapshot(cur);ns=cur.root?scan(cur.root):[];
            const finalType=control(ns,'Todos los tipos'),finalWarehouse=control(ns,'Todos los almacenes'),applyBtn=control(ns,'Aplicar');
            const ok=outcomes.some(x=>x.filter==='type'&&x.status==='selected_and_observed')&&restoredSelection&&!!finalType&&!!finalWarehouse&&!!applyBtn;
            const result={marker,ok,build:{version_name:hp.version_name,version_code:hp.version_code,build_id:hp.build_id},timeline,baseline,outcomes,restoredSelection,final:{...final,defaultTypeVisible:!!finalType,defaultWarehouseVisible:!!finalWarehouse,applyVisible:!!applyBtn},safety:{filtersOnly:true,readOnlyListQuery:true,recordsOpened:false,businessWrites:false,stockMutated:false,formsSubmitted:false}};
            console.log(JSON.stringify(result));if(!result.ok)process.exitCode=4;
          })().catch(e=>{console.log(JSON.stringify({marker,ok:false,error:clean(String(e&&e.message||e))}));process.exitCode=1;});
          NODE"""
          metadata={'goal_source':'chat','source_application':'ChatGPT','project_name':'BattleCruiser','source':'battlecruiser_step4_movimientos_filters_readonly_v1','verification_marker':marker,'device_id':device,'requested_device_id':device,'operation':'shell.execute','executor_type':'device','requested_capability':'shell.execute','command':command,'risk':'READ','timeout_ms':45000,'target_package':'com.android.chrome','allowed_hosts':['battlecruiser.robvg9.workers.dev'],'read_only':True,'business_data_mutated':False,'explicit_device_intent':True,'human_gate_required':False}
          def post(fn,payload,timeout=75):
              req=urllib.request.Request(base+'/'+fn,data=json.dumps(payload).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read().decode())
                  except:return e.code,{}
          code,body=post('aria-direct-v1',{'goal':'Ejecuta shell.execute en el dispositivo Android explicitado para abrir Movimientos en BattleCruiser LIVE, seleccionar el filtro local de tipo Venta, pulsar Aplicar y restaurar Todos los tipos. Lee solo estados, hashes y marcadores sanitizados. La lista es de lectura; no abras detalles, no hagas compras, transferencias, vales ni cambios de stock. Exige agente 1.1.23 exacto. Marcador BC_STEP4_MOVIMIENTOS_FILTERS_READONLY_V1.','mission_id':mission_id,'metadata':metadata})
          print('DISPATCH_HTTP='+str(code));print('MISSION_ID='+mission_id);print('DISPATCH_STATUS='+str(body.get('dispatch',{}).get('status','unknown')))
          if code>=300 or body.get('ok') is not True:print(json.dumps(body)[:1200]);raise SystemExit(2)
          terminal={'succeeded','failed','blocked','rejected','cancelled','human_required','paused'}
          last={}
          for i in range(1,61):
              c,last=post('aria-mission-runner-v22',{'mission_id':mission_id})
              s=str(last.get('status','unknown'));print('POLL='+json.dumps({'n':i,'http':c,'status':s,'error':last.get('error'),'next_action':last.get('next_action')}))
              if s in terminal or c in (401,403,404):break
              time.sleep(3)
          s=str(last.get('status','unknown'));print('FINAL_STATUS='+s);print('FINAL='+json.dumps({k:last.get(k) for k in ('ok','status','mission_id','error','next_action','executor_types','results') if k in last},ensure_ascii=False)[:6000])
          if s!='succeeded':raise SystemExit(1)
          PY
