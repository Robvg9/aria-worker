name: ECC Phase 5 Context Resolver

on:
  pull_request:
    branches:
      - aria/ecc-phase-04-capability-compiler
    paths:
      - 'scripts/ecc-context-resolver.js'
      - 'tests/ecc-context-resolver.test.js'
      - '.github/workflows/ecc-phase5-context-resolver.yml'
  push:
    branches:
      - 'aria/ecc-phase-05-context-resolver'
    paths:
      - 'scripts/ecc-context-resolver.js'
      - 'tests/ecc-context-resolver.test.js'
      - '.github/workflows/ecc-phase5-context-resolver.yml'

permissions:
  contents: read

jobs:
  context:
    name: ECC Phase 5 / context resolver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract test
        run: node tests/ecc-context-resolver.test.js
