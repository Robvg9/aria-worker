name: BattleCruiser Step 4 Android Preferences State Capture V6 (Read Only)
on:
  push:
    branches: [aria/bc-step4-android-e2e-20261021]
    paths: [.github/workflows/battlecruiser-step4-android-preferences-snapshot-v6.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-step4-android-preferences-snapshot-v6-postdeploy
  cancel-in-progress: false
jobs:
  android-preferences:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Navigate to Preferences and capture only six allowlisted switch states
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.request, urllib.error
          project=os.environ.get('SUPABASE_PROJECT_REF','').strip()
          secret=os.environ.get('ARIA_RUNTIME_SHARED_SECRET','')
          if not project or not secret: raise SystemExit('BLOCKED: production secrets unavailable; values are not printed')
          base=f'https://{project}.supabase.co/functions/v1'
          headers={'Authorization':'Bearer '+secret,'content-type':'application/json','cache-control':'no-store'}
          mid=f"mission_bc_step4_android_preferences_snapshot_v6_{os.environ['RUN_ID']}_{os.environ['RUN_ATTEMPT']}"
          device='android-termux-a1ebcfc7-9287-4603-a0f9-c519d12fd092'
          marker='BC_STEP4_ANDROID_PREF_SWITCHES_READONLY_V6'
          command=r"""node <<'NODE'
          const {executeAndroidAccessibilityJob}=require('./computer-use/android-accessibility-v1.js');
          const marker='BC_STEP4_ANDROID_PREF_SWITCHES_READONLY_V6',host='battlecruiser.robvg9.workers.dev';
          const base={target_package:'com.android.chrome',allow_any_app:false,allowed_hosts:[host]};
          const clean=s=>typeof s==='string'?s.replace(/\s+/g,' ').trim().replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig,'[redacted]').slice(0,120):'';
          const norm=s=>clean(s).toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n').replace(/[‐-‒–—]/g,'-').trim();
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          async function send(q){return await executeAndroidAccessibilityJob({command:JSON.stringify({...base,...q}),timeoutMs:18000});}
          async function observe(){const r=await send({operation:'observe'}),p=r&&r.payload||{},root=p.root||(p.ui&&p.ui.root)||null;return {r,p,root};}
          async function action(a){return await send({operation:'action',action:a});}
          function scan(root){
            const nodes=[],seen=new Set();let count=0;
            const walk=(n,path,d)=>{
              if(!n||typeof n!=='object'||Array.isArray(n)||seen.has(n)||d>28||count>=1200)return;
              seen.add(n);count++;
              const names=['name','label','contentDescription','text','hint'].map(k=>clean(n[k])).filter(Boolean);
              nodes.push({id:typeof n.id==='string'&&n.id?n.id:path,path,role:clean(n.role),className:clean(n.className||n.class),names,
                text:names.join(' | '),visible:n.visible!==false,clickable:!!n.clickable,enabled:n.enabled!==false,
                checkable:typeof n.checkable==='boolean'?n.checkable:null,checked:typeof n.checked==='boolean'?n.checked:null,
                scrollable:!!n.scrollable,bounds:n.bounds||null});
              if(Array.isArray(n.children))n.children.forEach((c,i)=>walk(c,path+'.'+i,d+1));
            };
            walk(root,'0',0);return {nodeCount:count,nodes};
          }
          const defs=[
            {key:'auto_refresh',re:/actualizacion automatica/},
            {key:'sync_auto',re:/sincronizacion automatica/},
            {key:'sync_on_open',re:/sincronizar al abrir app/},
            {key:'sync_wifi_only',re:/sincronizar solo en wi.?fi/},
            {key:'notifications',re:/notificaciones/},
            {key:'compact_mode',re:/modo compacto/}
          ];
          function snapshot(obs){
            const sc=scan(obs.root),n=sc.nodes;
            const controls=defs.map(d=>{
              const matches=n.filter(x=>x.names.some(t=>d.re.test(norm(t)))||d.re.test(norm(x.text)));
              const switchNodes=matches.filter(x=>['switch','checkbox'].includes(norm(x.role))||/switch|checkbox/i.test(x.className)||x.checkable===true);
              return {key:d.key,match_count:matches.length,nodes:(switchNodes.length?switchNodes:matches).slice(0,6).map(x=>({id:x.id,path:x.path,role:x.role,className:x.className,text:x.text,checkable:x.checkable,checked:x.checked,enabled:x.enabled,visible:x.visible}))};
            });
            const prefsTitleVisible=n.some(x=>x.visible&&x.names.some(t=>norm(t)==='preferencias personales'));
            const relevantMenu=n.filter(x=>x.visible&&x.names.some(t=>['abrir menu','cerrar menu','configuracion','conectividad','preferencias'].includes(norm(t))))
              .slice(0,12).map(x=>({id:x.id,text:x.text,visible:x.visible,clickable:x.clickable,enabled:x.enabled,scrollable:x.scrollable}));
            return {packageName:clean(obs.p.packageName||(obs.p.ui&&obs.p.ui.packageName)),evidenceHash:obs.p.evidence_hash||null,uiEvidenceHash:obs.p.ui&&obs.p.ui.evidence_hash||null,nodeCount:sc.nodeCount,prefsTitleVisible,controls,relevantMenu};
          }
          (async()=>{
            const actions=[];
            const nav=await action({action:'navigate',url:'https://'+host});
            actions.push({action:'navigate',status:nav&&nav.status,reason:clean(nav&&nav.reason||nav&&nav.payload&&nav.payload.reason)});
            await pause(5000);
            let current=await observe();
            for(let i=0;i<8&&(!current.root||current.p.ok!==true||scan(current.root).nodeCount<70);i++){await pause(1000);current=await observe();}
            if(!current.root||current.p.ok!==true){console.log(JSON.stringify({marker,ok:false,stage:'initial_observe',actions,reason:clean(current.r&&current.r.reason||current.p.reason)}));process.exitCode=1;return;}
            let sc=scan(current.root);
            const find=(re,opts={})=>sc.nodes.find(x=>x.names.some(t=>re.test(norm(t)))&&(!opts.visible||x.visible)&&(!opts.clickable||x.clickable)&&(!opts.enabled||x.enabled));
            const isPrefs=()=>sc.nodes.some(x=>x.visible&&x.names.some(t=>norm(t)==='preferencias personales'||defs.some(d=>d.re.test(norm(t)))));
            let prefsButton=find(/^preferencias$/,{visible:true,clickable:true,enabled:true});
            if(!isPrefs()){
              let opened=sc.nodes.some(x=>x.visible&&x.names.some(t=>norm(t)==='cerrar menu'));
              if(!opened){
                const open=find(/^abrir menu$/,{visible:true,clickable:true,enabled:true});
                if(!open){console.log(JSON.stringify({marker,ok:false,stage:'menu_button_missing',actions,screen:snapshot(current)}));process.exitCode=2;return;}
                const r=await action({action:'click',nodeId:open.id});
                actions.push({action:'open_menu',target:open.id,status:r&&r.status,reason:clean(r&&r.reason||r&&r.payload&&r.payload.reason)});
                await pause(300);current=await observe();if(!current.root||current.p.ok!==true){console.log(JSON.stringify({marker,ok:false,stage:'observe_after_menu',actions,reason:clean(current.r&&current.r.reason||current.p.reason)}));process.exitCode=3;return;}sc=scan(current.root);
              }
              prefsButton=find(/^preferencias$/,{visible:true,clickable:true,enabled:true});
              for(let i=0;i<3&&!prefsButton;i++){
                const drawer=sc.nodes.find(x=>x.id==='0.0.0.0.2.1'&&x.visible&&x.scrollable);
                if(!drawer){actions.push({action:'scroll_menu',status:'blocked',reason:'visible_scrollable_drawer_not_found'});break;}
                const r=await action({action:'scroll',nodeId:drawer.id,direction:'forward'});
                actions.push({action:'scroll_menu',target:drawer.id,status:r&&r.status,reason:clean(r&&r.reason||r&&r.payload&&r.payload.reason)});
                await pause(300);current=await observe();if(!current.root||current.p.ok!==true)break;sc=scan(current.root);
                prefsButton=find(/^preferencias$/,{visible:true,clickable:true,enabled:true});
              }
              if(!prefsButton){console.log(JSON.stringify({marker,ok:false,stage:'preferences_menu_item_not_found',actions,screen:snapshot(current)}));process.exitCode=4;return;}
              const r=await action({action:'click',nodeId:prefsButton.id});
              actions.push({action:'open_preferences',target:prefsButton.id,status:r&&r.status,reason:clean(r&&r.reason||r&&r.payload&&r.payload.reason)});
              await pause(900);current=await observe();if(!current.root||current.p.ok!==true){console.log(JSON.stringify({marker,ok:false,stage:'observe_preferences',actions,reason:clean(current.r&&current.r.reason||current.p.reason)}));process.exitCode=5;return;}sc=scan(current.root);
            }
            const top=snapshot(current);
            const onPrefs=isPrefs();
            let lower=null;
            if(onPrefs){
              const main=sc.nodes.find(x=>x.id==='0.0.0'&&x.visible&&x.scrollable);
              if(main){
                const r=await action({action:'scroll',nodeId:main.id,direction:'forward'});
                actions.push({action:'scroll_preferences',target:main.id,status:r&&r.status,reason:clean(r&&r.reason||r&&r.payload&&r.payload.reason)});
                await pause(300);current=await observe();
                if(current.root&&current.p.ok===true){sc=scan(current.root);lower=snapshot(current);}
              }else actions.push({action:'scroll_preferences',status:'skipped',reason:'main_scrollable_node_not_found'});
            }
            const result={marker,ok:true,preferences_reached:onPrefs,actions,top,lower};
            console.log(JSON.stringify(result));
            if(!onPrefs)process.exitCode=6;
          })().catch(e=>{console.log(JSON.stringify({marker,ok:false,error:clean(String(e&&e.message||e))}));process.exitCode=1;});
          NODE"""
          metadata={'goal_source':'chat','source_application':'ChatGPT','project_name':'BattleCruiser','source':'battlecruiser_step4_android_preferences_snapshot_v6','verification_marker':marker,'device_id':device,'requested_device_id':device,'operation':'shell.execute','executor_type':'device','requested_capability':'shell.execute','command':command,'risk':'READ','timeout_ms':30000,'target_package':'com.android.chrome','allowed_hosts':['battlecruiser.robvg9.workers.dev'],'read_only':True,'business_data_mutated':False,'explicit_device_intent':True,'human_gate_required':False}
          def post(fn,payload,timeout=75):
              req=urllib.request.Request(base+'/'+fn,data=json.dumps(payload).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read().decode())
                  except:return e.code,{}
          code,body=post('aria-direct-v1',{'goal':'BattleCruiser Paso 4/15: abrir menú y Preferencias mediante navegación UI permitida, capturar únicamente los seis estados de interruptores en Chrome Android. READ ONLY: no cambiar opciones ni ejecutar acciones de negocio. Marcador BC_STEP4_ANDROID_PREF_SWITCHES_READONLY_V6.','mission_id':mid,'metadata':metadata})
          print('DISPATCH_HTTP='+str(code));print('MISSION_ID='+mid);print('DISPATCH_STATUS='+str(body.get('dispatch',{}).get('status','unknown')))
          if code>=300 or body.get('ok') is not True:print(json.dumps(body)[:1200]);raise SystemExit(2)
          terminal={'succeeded','failed','blocked','rejected','cancelled','human_required','paused'}
          last={}
          for i in range(1,61):
              c,last=post('aria-mission-runner-v22',{'mission_id':mid})
              s=str(last.get('status','unknown'));print('POLL='+json.dumps({'n':i,'http':c,'status':s,'error':last.get('error'),'next_action':last.get('next_action')}))
              if s in terminal or c in (401,403,404):break
              time.sleep(3)
          s=str(last.get('status','unknown'));print('FINAL_STATUS='+s);print('FINAL='+json.dumps({k:last.get(k) for k in ('ok','status','mission_id','error','next_action','executor_types','results') if k in last},ensure_ascii=False)[:6000])
          if s!='succeeded':raise SystemExit(1)
          PY
