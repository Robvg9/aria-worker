name: ARIA ARTIA Mission Closure Observer

on:
  push:
    paths:
      - '.github/workflows/aria-artia-mission-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe-and-advance:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Query mission state
        id: before
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          q=$(cat <<'SQL'
select mission_id,status,current_step,total_steps,completed_steps,next_action,last_stderr,updated_at,lease_owner,lease_until,finished_at
from aria_internal.mission_state
where mission_id='mission_d0bb5430-bbe7-423a-aecf-e985eb1dcf5d';
SQL
          )
          curl --silent --show-error --fail-with-body --max-time 30 \
            -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg q "$q" '{query:$q,read_only:true}')" | tee before.json
          echo "BEFORE_STATE_SAVED"
      - name: Advance exact mission
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          q=$(cat <<'SQL'
select aria_internal.runner_tick_for_mission('mission_d0bb5430-bbe7-423a-aecf-e985eb1dcf5d') as request_id;
SQL
          )
          curl --silent --show-error --fail-with-body --max-time 30 \
            -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg q "$q" '{query:$q,read_only:false}')" | tee advance.json
          echo "EXACT_MISSION_ADVANCE_REQUESTED"
      - name: Wait for execution handoff
        run: sleep 20
      - name: Query mission state after advance
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          q='select mission_id,status,current_step,total_steps,completed_steps,next_action,last_stderr,updated_at,lease_owner,lease_until,finished_at from aria_internal.mission_state where mission_id='''mission_d0bb5430-bbe7-423a-aecf-e985eb1dcf5d''';'
          curl --silent --show-error --fail-with-body --max-time 30 \
            -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg q "$q" '{query:$q,read_only:true}')" | tee after.json
          echo "AFTER_STATE_SAVED"
      - name: Upload closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: aria-artia-mission-closure
          path: |
            before.json
            advance.json
            after.json
