name: A6 Ethernet stability diagnostics (read-only, physical Realtek only)

on:
  push:
    branches:
      - ops/a6-ethernet-readonly-diagnostics-v1
    paths:
      - '.github/workflows/a6-ethernet-readonly-diagnostics.yml'

permissions:
  contents: read

concurrency:
  group: a6-ethernet-readonly-diagnostics
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect physical Realtek Ethernet and link events on ROBVG
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 6
    steps:
      - name: Read physical Ethernet health and event history
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]$env:COMPUTERNAME -ine 'ROBVG') {
            throw "A6_HOST_MISMATCH expected=ROBVG actual=$env:COMPUTERNAME"
          }

          $started = [DateTimeOffset]::UtcNow
          $operatingSystem = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop | Select-Object Caption,Version,BuildNumber,OSArchitecture
          $computerSystem = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop | Select-Object Manufacturer,Model,SystemSKUNumber
          $bios = Get-CimInstance Win32_BIOS -ErrorAction Stop | Select-Object SMBIOSBIOSVersion,ReleaseDate
          $allAdapters = @(Get-NetAdapter -IncludeHidden -ErrorAction Stop)
          $nic = $allAdapters |
            Where-Object { $_.InterfaceDescription -match '^Realtek PCIe FE Family Controller$' } |
            Select-Object -First 1
          if (-not $nic) { throw 'A6_PHYSICAL_REALTEK_ADAPTER_NOT_FOUND' }

          $statistics = $null
          $statisticsError = $null
          try {
            $statistics = Get-NetAdapterStatistics -Name $nic.Name -ErrorAction Stop |
              Select-Object ReceivedPacketErrors,OutboundPacketErrors,ReceivedDiscardedPackets,OutboundDiscardedPackets,ReceivedBytes,SentBytes
          } catch {
            $statisticsError = $_.Exception.GetType().Name
          }

          $driver = $null
          $driverError = $null
          try {
            $driver = Get-CimInstance Win32_PnPSignedDriver -ErrorAction Stop |
              Where-Object { $_.DeviceName -match '^Realtek PCIe FE Family Controller$' } |
              Select-Object -First 1 DeviceName,DriverVersion,DriverDate,Manufacturer,InfName
          } catch {
            $driverError = $_.Exception.GetType().Name
          }

          $pnp = $null
          $pnpError = $null
          try {
            $pnp = Get-CimInstance Win32_NetworkAdapter -ErrorAction Stop |
              Where-Object { $_.Name -match '^Realtek PCIe FE Family Controller$' } |
              Select-Object -First 1 Name,NetEnabled,NetConnectionStatus,Speed,ConfigManagerErrorCode,PNPDeviceID
          } catch {
            $pnpError = $_.Exception.GetType().Name
          }

          $advanced = @()
          $advancedError = $null
          try {
            $advanced = @(Get-NetAdapterAdvancedProperty -Name $nic.Name -ErrorAction Stop |
              Where-Object {
                $_.DisplayName -match 'EEE|Energy|Energ|Power|Ahorro|Green|Speed|Velocidad|Duplex|Dúplex' -or
                $_.RegistryKeyword -match 'EEE|Power|Green|Speed|Duplex'
              } |
              Select-Object DisplayName,DisplayValue,RegistryKeyword)
          } catch {
            $advancedError = $_.Exception.GetType().Name
          }

          $routes = @()
          $routeError = $null
          try {
            $routes = @(Get-NetRoute -DestinationPrefix '0.0.0.0/0' -ErrorAction Stop |
              Where-Object { $_.InterfaceIndex -eq $nic.InterfaceIndex } |
              Select-Object InterfaceIndex,RouteMetric,State)
          } catch {
            $routeError = $_.Exception.GetType().Name
          }

          $events = @()
          $eventsError = $null
          try {
            $since = (Get-Date).AddHours(-48)
            $systemEvents = @(Get-WinEvent -FilterHashtable @{ LogName='System'; StartTime=$since } -MaxEvents 3000 -ErrorAction Stop)
            $events = @($systemEvents |
              Where-Object {
                $_.ProviderName -match 'Realtek|rt640|NDIS|Tcpip|NetworkProfile|Kernel-PnP|Dhcp-Client|WLAN-AutoConfig' -or
                $_.Message -match '(?i)Realtek PCIe FE|Ethernet.{0,40}(disconnect|connect)|network link|media disconnected|enlace de red|medio desconectado'
              } |
              Select-Object -First 100 |
              ForEach-Object {
                $message = [string]$_.Message
                $message = [regex]::Replace($message,'(?i)\b(?:[0-9a-f]{2}-){5}[0-9a-f]{2}\b','[MAC]')
                $message = [regex]::Replace($message,'\b(?:\d{1,3}\.){3}\d{1,3}\b','[IP]')
                if ($message.Length -gt 260) { $message = $message.Substring(0,260) }
                [ordered]@{
                  time_utc = $_.TimeCreated.ToUniversalTime().ToString('o')
                  provider = $_.ProviderName
                  event_id = $_.Id
                  level = $_.LevelDisplayName
                  message = $message
                }
              })
          } catch {
            $eventsError = $_.Exception.GetType().Name
          }

          $powerSourceEvents = @()
          $powerSourceError = $null
          try {
            $rawPowerEvents = @($systemEvents |
              Where-Object { $_.ProviderName -match 'Microsoft-Windows-Kernel-Power' -and $_.Id -eq 105 } |
              Select-Object -First 100)
            foreach ($powerEvent in $rawPowerEvents) {
              $powerData = @{}
              try {
                [xml]$powerXml = $powerEvent.ToXml()
                foreach ($field in $powerXml.Event.EventData.Data) {
                  $fieldName = [string]$field.GetAttribute('Name')
                  if ($fieldName) { $powerData[$fieldName] = [string]$field.InnerText }
                }
              } catch {}
              $powerSourceEvents += [pscustomobject]@{
                time_utc = $powerEvent.TimeCreated.ToUniversalTime().ToString('o')
                ac_online = $powerData['AcOnline']
                remaining_capacity_mwh = $powerData['RemainingCapacity']
                full_charge_capacity_mwh = $powerData['FullChargeCapacity']
              }
            }
          } catch {
            $powerSourceError = $_.Exception.GetType().Name
          }

          $batteryState = @()
          $batteryReadError = $null
          try {
            $batteryState = @(Get-CimInstance Win32_Battery -ErrorAction Stop |
              Select-Object Name,BatteryStatus,EstimatedChargeRemaining,Status,DesignCapacity,FullChargeCapacity)
          } catch {
            $batteryReadError = $_.Exception.GetType().Name
          }

          $batteryWmi = [ordered]@{
            battery_status = @()
            battery_static_data = @()
            full_charged_capacity = @()
            read_errors = @()
          }
          foreach ($entry in @(
            @{ Class='BatteryStatus'; Key='battery_status'; Fields=@('PowerOnline','Charging','Discharging','Voltage','Current','DischargeRate','ChargeRate','Critical','Tag') },
            @{ Class='BatteryStaticData'; Key='battery_static_data'; Fields=@('DesignedCapacity','DeviceName','Chemistry','DesignedVoltage','CycleCount','ManufactureDate','Tag') },
            @{ Class='BatteryFullChargedCapacity'; Key='full_charged_capacity'; Fields=@('FullChargedCapacity','Tag') }
          )) {
            try {
              $instances = @(Get-CimInstance -Namespace 'root/wmi' -ClassName $entry.Class -ErrorAction Stop)
              $batteryWmi[$entry.Key] = @($instances | ForEach-Object {
                $row = [ordered]@{}
                foreach ($field in $entry.Fields) {
                  if ($_.PSObject.Properties.Name -contains $field) { $row[$field] = $_.$field }
                }
                [pscustomobject]$row
              })
            } catch {
              $batteryWmi.read_errors += [pscustomobject]@{ class=$entry.Class; error=$_.Exception.GetType().Name }
            }
          }

          $correlatedLinkEvents = @()
          $correlationError = $null
          try {
            $realtekEvents = @($systemEvents | Where-Object { $_.ProviderName -match 'rt640x64' -and $_.Id -eq 1 } | Select-Object -First 30)
            foreach ($rtEvent in $realtekEvents) {
              $nearby = @($systemEvents |
                Where-Object {
                  $_.ProviderName -notmatch 'rt640x64' -and
                  [math]::Abs(($_.TimeCreated - $rtEvent.TimeCreated).TotalSeconds) -le 15
                } |
                Select-Object -First 8 |
                ForEach-Object {
                  $nearMessage = [string]$_.Message
                  $nearMessage = [regex]::Replace($nearMessage,'(?i)\b(?:[0-9a-f]{2}-){5}[0-9a-f]{2}\b','[MAC]')
                  $nearMessage = [regex]::Replace($nearMessage,'\b(?:\d{1,3}\.){3}\d{1,3}\b','[IP]')
                  if ($nearMessage.Length -gt 220) { $nearMessage = $nearMessage.Substring(0,220) }
                  [ordered]@{
                    time_utc = $_.TimeCreated.ToUniversalTime().ToString('o')
                    provider = $_.ProviderName
                    event_id = $_.Id
                    level = $_.LevelDisplayName
                    message = $nearMessage
                  }
                })
              $correlatedLinkEvents += [pscustomobject]@{
                realtek_event_time_utc = $rtEvent.TimeCreated.ToUniversalTime().ToString('o')
                nearby_non_realtek_events = $nearby
              }
            }
          } catch {
            $correlationError = $_.Exception.GetType().Name
          }

          $ndisLogs = @()
          $ndisLogError = $null
          try {
            $ndisLogs = @(Get-WinEvent -ListLog '*NDIS*' -ErrorAction SilentlyContinue |
              Select-Object LogName,IsEnabled,RecordCount)
          } catch {
            $ndisLogError = $_.Exception.GetType().Name
          }

          $wheaEvents = @()
          $wheaError = $null
          try {
            $wheaSince = (Get-Date).AddDays(-7)
            $wheaEvents = @(Get-WinEvent -FilterHashtable @{ LogName='System'; Id=17; StartTime=$wheaSince } -MaxEvents 1000 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match 'WHEA' } |
              Select-Object -First 100 |
              ForEach-Object {
                $message = [string]$_.Message
                if ($message.Length -gt 1200) { $message = $message.Substring(0,1200) }
                [ordered]@{
                  time_utc = $_.TimeCreated.ToUniversalTime().ToString('o')
                  provider = $_.ProviderName
                  event_id = $_.Id
                  level = $_.LevelDisplayName
                  pcie_root_port_1c4_match = [bool]($message -match '(?i)0x0:0x1C:0x4|PCI Express Root Port')
                  message = $message
                }
              })
          } catch {
            $wheaError = $_.Exception.GetType().Name
          }

          $connectionProfiles = @()
          try {
            $connectionProfiles = @(Get-NetConnectionProfile -ErrorAction Stop |
              Select-Object Name,InterfaceAlias,NetworkCategory,IPv4Connectivity,IPv6Connectivity)
          } catch {
            $connectionProfiles = @()
          }

          $gatewayProbe = [pscustomobject]@{
            gateway = $null
            method = 'GET'
            http_status = $null
            server_header = $null
            page_title = $null
            model_hints = @()
            error = $null
            authentication_used = $false
          }
          try {
            $ipcfg = Get-NetIPConfiguration -InterfaceIndex $nic.InterfaceIndex -ErrorAction Stop
            if ($ipcfg.IPv4DefaultGateway) {
              $gatewayProbe.gateway = [string]$ipcfg.IPv4DefaultGateway.NextHop
              $response = Invoke-WebRequest -Uri ("http://" + $gatewayProbe.gateway + "/") -Method Get -MaximumRedirection 0 -TimeoutSec 5 -UseBasicParsing
              $gatewayProbe.http_status = [int]$response.StatusCode
              if ($response.Headers['Server']) { $gatewayProbe.server_header = [string]$response.Headers['Server'] }
              $html = [string]$response.Content
              if ($html -match '(?is)<title[^>]*>(.*?)</title>') {
                $gatewayProbe.page_title = [System.Net.WebUtility]::HtmlDecode(([string]$Matches[1]).Trim())
              }
              $hints = @()
              foreach ($token in @('OLAX','Scorpio','MTN','ZTE','Huawei','Sercomm','Fiberhome','firmware','model')) {
                if ($html -match [regex]::Escape($token)) { $hints += $token }
              }
              $gatewayProbe.model_hints = @($hints | Select-Object -Unique)
            }
          } catch {
            if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
              $gatewayProbe.http_status = [int]$_.Exception.Response.StatusCode
            } else {
              $gatewayProbe.error = $_.Exception.GetType().Name
            }
          }

          $result = [ordered]@{
            status = 'READ_ONLY_PHYSICAL_REALTEK_DIAGNOSTIC_COMPLETE'
            host = [string]$env:COMPUTERNAME
            captured_at_utc = [DateTimeOffset]::UtcNow.ToString('o')
            operating_system = $operatingSystem
            computer_system = $computerSystem
            bios = $bios
            duration_seconds = [math]::Round(([DateTimeOffset]::UtcNow - $started).TotalSeconds,1)
            ethernet_adapter = $nic | Select-Object Name,InterfaceDescription,Status,LinkSpeed,MediaConnectionState,InterfaceIndex,DriverInformation
            ethernet_statistics = $statistics
            statistics_read_error = $statisticsError
            ethernet_driver = $driver
            driver_read_error = $driverError
            pnp_adapter_state = $pnp
            pnp_read_error = $pnpError
            relevant_advanced_properties = @($advanced)
            advanced_properties_read_error = $advancedError
            default_routes_on_ethernet = @($routes)
            routes_read_error = $routeError
            network_profiles = @($connectionProfiles)
            gateway_http_metadata = $gatewayProbe
            recent_link_and_network_events_48h = @($events)
            kernel_power_source_events_105 = @($powerSourceEvents)
            kernel_power_source_read_error = $powerSourceError
            current_battery_state = @($batteryState)
            battery_wmi_read_only = $batteryWmi
            battery_read_error = $batteryReadError
            correlated_non_realtek_events_around_rt640x64 = @($correlatedLinkEvents)
            event_correlation_read_error = $correlationError
            ndis_operational_logs = @($ndisLogs)
            ndis_log_read_error = $ndisLogError
            whea_corrected_pcie_event17_last_7d = @($wheaEvents)
            whea_read_error = $wheaError
            event_log_read_error = $eventsError
            other_adapter_summaries = @($allAdapters | Where-Object { $_.InterfaceDescription -notmatch '^Realtek PCIe FE Family Controller$' } | Select-Object Name,InterfaceDescription,Status,LinkSpeed)
            restrictions = @('READ_ONLY','NO_NIC_OR_DRIVER_CHANGES','NO_EEE_OR_POWER_CHANGES','NO_ROUTE_DNS_OR_WIFI_CHANGES','NO_MISSION_OR_CRON_CHANGES')
          }

          Write-Output 'A6_ETHERNET_EVIDENCE_BEGIN'
          Write-Output ($result | ConvertTo-Json -Depth 8 -Compress)
          Write-Output 'A6_ETHERNET_EVIDENCE_END'
