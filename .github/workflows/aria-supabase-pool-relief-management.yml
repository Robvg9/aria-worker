name: ARIA Supabase pool relief via Management API

on:
  push:
    paths:
      - '.github/workflows/aria-supabase-pool-relief-management.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relieve:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Alter canonical cron schedules through Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          body='{"query":"select cron.alter_job(42, schedule := '''2-59/15 * * * *'''); select cron.alter_job(43, schedule := '''4-59/15 * * * *'''); select jobid, jobname, schedule, active from cron.job where jobid in (42,43) order by jobid;"}'
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$body"
