name: ARIA Supabase free restore upgrade

on:
  push:
    paths:
      - '.github/workflows/aria-supabase-pool-relief-management.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Restart Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          echo "PROJECT_RESTART_REQUEST"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/restart" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Accept: application/json"
          echo

      - name: Wait for ACTIVE_HEALTHY
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            payload="$(curl --fail-with-body --silent --show-error \
              --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header "Accept: application/json")" || payload='{}'
            printf '%s\n' "$payload"
            status="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("status",""))' "$payload" 2>/dev/null || true)"
            echo "PROJECT_STATUS=$status"
            if [ "$status" = "ACTIVE_HEALTHY" ]; then exit 0; fi
            sleep 10
          done
          echo "RESTART_HEALTH_TIMEOUT"
          exit 2

      - name: Check backup state
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/backups" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Accept: application/json" \
            | tee /tmp/backups.json

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/backups.json'))
          backups=d.get('backups') or []
          active=[b for b in backups if str(b.get('status','')).upper() not in {'COMPLETED','FAILED','CANCELLED','ERROR'}]
          print('BACKUPS_TOTAL=',len(backups))
          print('ACTIVE_BACKUPS=',active)
          if active:
              raise SystemExit('BACKUP_STILL_ACTIVE')
          PY

      - name: Pause Free project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          echo "PAUSE_REQUEST"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/pause" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Accept: application/json"
          echo

      - name: Wait for paused state
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            payload="$(curl --fail-with-body --silent --show-error \
              --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header "Accept: application/json")" || payload='{}'
            printf '%s\n' "$payload"
            status="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("status",""))' "$payload" 2>/dev/null || true)"
            echo "PROJECT_STATUS=$status"
            if [ "$status" = "INACTIVE" ] || [ "$status" = "PAUSED" ]; then exit 0; fi
            sleep 10
          done
          echo "PAUSE_STATUS_TIMEOUT"
          exit 2

      - name: Restore Free project to latest available platform version
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          echo "RESTORE_REQUEST"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/restore" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Accept: application/json"
          echo

      - name: Verify restored project and Postgres version
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            payload="$(curl --fail-with-body --silent --show-error \
              --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header "Accept: application/json")" || payload='{}'
            printf '%s\n' "$payload"
            status="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("status",""))' "$payload" 2>/dev/null || true)"
            version="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("database",{}).get("version",""))' "$payload" 2>/dev/null || true)"
            echo "PROJECT_STATUS=$status POSTGRES_VERSION=$version"
            if [ "$status" = "ACTIVE_HEALTHY" ] && [ "$version" != "" ]; then
              echo "RESTORE_ACTIVE_HEALTHY"
              echo "POSTGRES_VERSION=$version"
              exit 0
            fi
            sleep 10
          done
          echo "RESTORE_STATUS_TIMEOUT"
          exit 2
