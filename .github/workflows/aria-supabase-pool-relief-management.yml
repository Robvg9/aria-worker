name: ARIA Supabase pool relief via Management API

on:
  push:
    paths:
      - '.github/workflows/aria-supabase-pool-relief-management.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relieve:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Restart database and reduce canonical cron pressure
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          echo "REQUEST_DATABASE_RESTART"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/postgres" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"restart_database":true}'

          echo
          echo "WAIT_FOR_HEALTH"
          for i in $(seq 1 30); do
            health="$(curl --fail-with-body --silent --show-error \
              --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/health" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")" || health=""
            printf '%s\n' "$health"

            if printf '%s' "$health" | grep -q 'ACTIVE_HEALTHY'; then
              break
            fi
            sleep 10
          done

          python3 - <<'PY' > /tmp/body.json
          import json
          sql = """
          select cron.alter_job(42, schedule := '2-59/15 * * * *');
          select cron.alter_job(43, schedule := '4-59/15 * * * *');
          select jobid, jobname, schedule, active
          from cron.job
          where jobid in (42,43)
          order by jobid;
          """
          print(json.dumps({"query": sql}))
          PY

          echo "ALTER_CANONICAL_CRONS"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/body.json

          echo
          echo "POOL_RELIEF_COMPLETE"
