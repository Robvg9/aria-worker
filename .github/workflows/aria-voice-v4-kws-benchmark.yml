name: ARIA Voice V4 Spanish KWS feasibility benchmark

on:
  push:
    branches:
      - feat/aria-voice-v4-diagnostics-20261102
    paths:
      - voice-v4/benchmark/**
      - .github/workflows/aria-voice-v4-kws-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vosk-spanish-kws:
    name: Vosk Spanish constrained-vocabulary smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install synthetic speech and audio utilities
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends espeak-ng ffmpeg unzip

      - name: Install Vosk runtime
        run: python -m pip install --disable-pip-version-check "vosk==0.3.45"

      - name: Download Spanish small model
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip \
            --output "$RUNNER_TEMP/vosk-model-small-es-0.42.zip"
          unzip -q "$RUNNER_TEMP/vosk-model-small-es-0.42.zip" -d "$RUNNER_TEMP"

      - name: Test exact Oye ARIA phrase and confusables
        run: |
          python voice-v4/benchmark/vosk_spanish_keyword.py \
            --model "$RUNNER_TEMP/vosk-model-small-es-0.42" \
            --report "$RUNNER_TEMP/aria-vosk-es-report.json"

      - name: Upload metadata-only benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-vosk-spanish-kws-metadata
          path: \${{ runner.temp }}/aria-vosk-es-report.json
          if-no-files-found: ignore
          retention-days: 7
