name: ARIA Chat Browser RWHT Authenticated

on:
  push:
    branches:
      - main
    paths:
      - 'pwa/**'
      # Worker-only releases still change the versioned PWA shell and must participate in same-SHA certification.
      - 'worker.js'
      - 'wrangler.toml'
      - '.github/workflows/aria-cloudflare-deploy.yml'
      - '.github/workflows/aria-pwa-fast-deploy.yml'
      - '.github/workflows/aria-scheduler-transport-deploy.yml'
      - 'supabase/functions/aria-app-api-v3/**'
      - 'rwht/pc-browser/rwht-chat-e2e.mjs'
      - 'tests/pc-rwht-browser.test.js'
      - '.github/workflows/chat-rwht-authenticated.yml'
      - '.github/workflows/aria-pwa-steps-7-8-live.yml'
      - '.github/workflows/pc-rwht.yml'
  pull_request:
    paths:
      - 'pwa/**'
      - 'supabase/functions/aria-app-api-v3/**'
      - 'rwht/pc-browser/rwht-chat-e2e.mjs'
      - 'tests/pc-rwht-browser.test.js'
      - '.github/workflows/chat-rwht-authenticated.yml'
      - '.github/workflows/aria-pwa-steps-7-8-live.yml'
      - '.github/workflows/pc-rwht.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Chat, Capabilities and Persistence must not evict one another from a shared pending queue.
  group: aria-chat-rwht-${{ github.sha }}
  cancel-in-progress: false

jobs:
  chat-rwht:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RWHT_URL: ${{ vars.RWHT_URL || 'https://aria.robvg9.workers.dev/pwa/' }}
      RWHT_HEADLESS: 'true'
      RWHT_ARTIFACT_DIR: chat-rwht-artifacts
      RWHT_EXPECTED_AUTH_TEXT: 'Núcleo conectado'
      RWHT_EMAIL: ${{ secrets.RWHT_EMAIL }}
      RWHT_PASSWORD: ${{ secrets.RWHT_PASSWORD }}
      RWHT_STORAGE_STATE_B64: ${{ secrets.RWHT_STORAGE_STATE_B64 }}
      RWHT_STORAGE_STATE_GZIP_B64: ${{ secrets.RWHT_STORAGE_STATE_GZIP_B64 }}
      RWHT_TIMEOUT_MS: '150000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require an authenticated session source
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          has_password_auth=false
          has_storage_auth=false
          has_storage_gzip_auth=false
          if [[ -n "${RWHT_EMAIL}" && -n "${RWHT_PASSWORD}" ]]; then has_password_auth=true; fi
          if [[ -n "${RWHT_STORAGE_STATE_B64}" ]]; then has_storage_auth=true; fi
          if [[ -n "${RWHT_STORAGE_STATE_GZIP_B64}" ]]; then has_storage_gzip_auth=true; fi
          if [[ "${has_password_auth}" != true && "${has_storage_auth}" != true && "${has_storage_gzip_auth}" != true ]]; then
            echo "::error title=Authenticated Chat RWHT blocked::Configure RWHT_EMAIL + RWHT_PASSWORD or RWHT_STORAGE_STATE_B64 as repository secrets."
            exit 1
          fi
          # Prefer fresh password credentials whenever both are available. Saved browser
          # state is a fallback only; it may contain an expired rotating refresh token.
          if [[ "${has_password_auth}" != true && "${has_storage_auth}" == true ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_B64}" | base64 --decode > "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            chmod 600 "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            echo "RWHT_STORAGE_STATE=${RUNNER_TEMP}/aria-rwht-auth-state.json" >> "${GITHUB_ENV}"
          elif [[ "${has_password_auth}" != true && "${has_storage_gzip_auth}" == true ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_GZIP_B64}" | base64 --decode | gzip -dc > "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            chmod 600 "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            echo "RWHT_STORAGE_STATE=${RUNNER_TEMP}/aria-rwht-auth-state.json" >> "${GITHUB_ENV}"
          fi
      - name: Install Chat RWHT dependencies
        working-directory: rwht/pc-browser
        run: npm install --no-audit --no-fund
      - name: Install PWA build dependencies
        working-directory: pwa
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build PWA and verify canonical catalog metadata
        working-directory: pwa
        env:
          VITE_BUILD: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run build
          expected_version="$(grep '^export const TEST_CATALOG_VERSION' src/testCatalog.ts | cut -d "'" -f 2)"
          expected_total="$(grep -c '"file": "tests/' src/testCatalog.ts)"
          test -n "$expected_version"
          test "$expected_total" -gt 0
          grep -Fq "aria-test-catalog-version' content='$expected_version'" dist/index.html
          grep -Fq "aria-test-catalog-total' content='$expected_total'" dist/index.html
          ! grep -q '__ARIA_TEST_CATALOG_' dist/index.html
          echo "PWA_CANONICAL_TEST_CATALOG_BUILD_OK version=$expected_version total=$expected_total"
      - name: Install Chromium
        if: github.event_name != 'pull_request'
        working-directory: rwht/pc-browser
        run: npx playwright install --with-deps chromium
      - name: Wait for exact-SHA production deploys before authenticated Chat
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/ci/wait-for-aria-exact-sha-deploys.sh "${GITHUB_SHA}"
      - name: Verify canonical test catalog on LIVE PWA
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          base="${RWHT_URL%/}"
          html=""
          expected_version="$(grep '^export const TEST_CATALOG_VERSION' pwa/src/testCatalog.ts | cut -d "'" -f 2)"
          expected_total="$(grep -c '"file": "tests/' pwa/src/testCatalog.ts)"
          test -n "$expected_version"
          test "$expected_total" -gt 0
          for attempt in $(seq 1 60); do
            html="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "$base/?probe=$GITHUB_SHA-chat-catalog-$attempt" 2>/dev/null || true)"
            if (grep -q "name='aria-test-catalog-version' content='$expected_version'" <<<"$html" || grep -q "name=\"aria-test-catalog-version\" content=\"$expected_version\"" <<<"$html") &&
               (grep -q "name='aria-test-catalog-total' content='$expected_total'" <<<"$html" || grep -q "name=\"aria-test-catalog-total\" content=\"$expected_total\"" <<<"$html"); then
              break
            fi
            test "$attempt" -lt 60 && sleep 2
          done
          test -n "$html"
          (grep -q "name='aria-test-catalog-version' content='$expected_version'" <<<"$html" || grep -q "name=\"aria-test-catalog-version\" content=\"$expected_version\"" <<<"$html")
          (grep -q "name='aria-test-catalog-total' content='$expected_total'" <<<"$html" || grep -q "name=\"aria-test-catalog-total\" content=\"$expected_total\"" <<<"$html")
          echo "CHAT_CANONICAL_TEST_CATALOG_LIVE_OK version=$expected_version total=$expected_total"
      - name: Execute authenticated Chat E2E
        if: github.event_name != 'pull_request'
        working-directory: rwht/pc-browser
        run: node rwht-chat-e2e.mjs
      - name: Upload Chat RWHT evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aria-chat-rwht-evidence
          path: rwht/pc-browser/chat-rwht-artifacts
          if-no-files-found: warn
      - name: Remove temporary authentication state
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: rm -f "${RUNNER_TEMP}/aria-rwht-auth-state.json"

# Final certification trigger 2026-10-01.

# 2026-10-02: rerun Chat RWHT after live Windows local-Qwen route recovery; no runtime behavior change.
