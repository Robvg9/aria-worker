name: ARIA Supabase Auth Recovery Restart

on:
  # A production restart is permitted only from main or an explicit manual dispatch.
  # Feature-branch pushes must never restart the shared production database.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aria-supabase-auth-recovery-restart.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart-and-health:
    # Do not restart production just because this workflow's code was merged.
    # Use manual dispatch, or an intentional main commit tagged [supabase-restart].
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[supabase-restart]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Restart Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/restart" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Accept: application/json"
          echo
          echo SUPABASE_RESTART_REQUESTED

      - name: Wait for observed restart transition and stable ACTIVE_HEALTHY
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          saw_transition=false
          stable_healthy=0
          for i in $(seq 1 90); do
            payload="$(curl --fail-with-body --silent --show-error \
              --max-time 10 \
              --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header "Accept: application/json")" || payload='{}'
            status="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("status",""))' "$payload" 2>/dev/null || true)"
            echo "PROJECT_STATUS=$status"
            if [[ -n "$status" && "$status" != "ACTIVE_HEALTHY" ]]; then
              saw_transition=true
              stable_healthy=0
            elif [[ "$status" == "ACTIVE_HEALTHY" && "$saw_transition" == true ]]; then
              stable_healthy=$((stable_healthy + 1))
              echo "STABLE_HEALTHY_CHECKS=$stable_healthy"
            else
              # Ignore an immediate/cached ACTIVE_HEALTHY response after the restart
              # request. It is not proof that the restart completed.
              echo "PRE_TRANSITION_HEALTH_IGNORED"
            fi
            if [[ "$stable_healthy" -ge 3 ]]; then
              echo SUPABASE_ACTIVE_HEALTHY_STABLE
              break
            fi
            sleep 10
          done
          if [[ "$saw_transition" != true ]]; then
            echo SUPABASE_RESTART_TRANSITION_NOT_OBSERVED
            exit 3
          fi
          if [[ "$stable_healthy" -lt 3 ]]; then
            echo SUPABASE_HEALTH_TIMEOUT
            exit 2
          fi

      - name: Verify direct Auth and Worker refresh-token paths are responsive
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          # Deliberately invalid token: a healthy Auth service returns a client
          # error (normally 400), not 502/504. This probe creates no session and
          # never uses or logs a real user's credentials.
          api_key='sb_publishable_E2AmZNo2hAbOYlytkVbyBQ_X7JH0HPw'
          body='{"refresh_token":"rwht-health-probe-invalid-refresh-token"}'
          direct_url="https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/token?grant_type=refresh_token"
          worker_url="https://aria.robvg9.workers.dev/auth/token?grant_type=refresh_token"
          healthy=false
          for attempt in $(seq 1 18); do
            direct_code="$(curl --silent --show-error --max-time 12 -o "$RUNNER_TEMP/auth-direct-probe.json" -w '%{http_code}' \
              -X POST "$direct_url" -H "apikey: $api_key" -H 'content-type: application/json' \
              --data "$body" 2>/dev/null || true)"
            worker_code="$(curl --silent --show-error --max-time 12 -o "$RUNNER_TEMP/auth-worker-probe.json" -w '%{http_code}' \
              -X POST "$worker_url" -H "apikey: $api_key" -H 'content-type: application/json' \
              --data "$body" 2>/dev/null || true)"
            echo "AUTH_PROBE attempt=$attempt direct=$direct_code worker=$worker_code"
            if [[ "$direct_code" =~ ^(400|401)$ && "$worker_code" =~ ^(400|401)$ ]]; then
              healthy=true
              break
            fi
            sleep 10
          done
          if [[ "$healthy" != true ]]; then
            echo SUPABASE_AUTH_PATHS_UNHEALTHY
            exit 4
          fi
          echo SUPABASE_AUTH_PATHS_RESPONSIVE
