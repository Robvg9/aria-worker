name: A6 Windows heartbeat live read-only diagnostic

on:
  push:
    branches:
      - ops/a6-windows-agent-v2-heartbeat-preflight-v1
    paths:
      - '.github/workflows/a6-windows-heartbeat-live-readonly-diagnostic.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a6-windows-heartbeat-live-readonly-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    name: Read heartbeat and process identity on ROBVG
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Capture live state without modifying runtime
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]$env:COMPUTERNAME -ine 'ROBVG') { throw "A6_RUNNER_HOST_MISMATCH expected=ROBVG actual=$env:COMPUTERNAME" }
          $root = 'D:\ARIA-Windows-Agent'
          $logs = Join-Path $root 'Logs'
          $heartbeat = Join-Path $logs 'agent-heartbeat.json'
          $agentPidFile = Join-Path $logs 'agent.pid'
          $watchdogPidFile = Join-Path $logs 'watchdog.pid'
          $out = Join-Path $env:GITHUB_WORKSPACE 'a6-heartbeat-live-readonly.json'
          $samples = [System.Collections.Generic.List[object]]::new()
          $started = [DateTimeOffset]::UtcNow

          function Read-PidFile([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { return $null }
            $v = 0
            if ([int]::TryParse((Get-Content -Raw -LiteralPath $Path).Trim(),[ref]$v)) { return $v }
            return $null
          }

          function Get-HeartbeatSnapshot {
            if (-not (Test-Path -LiteralPath $heartbeat -PathType Leaf)) { return @{ exists=$false } }
            $item = Get-Item -LiteralPath $heartbeat
            $raw = Get-Content -Raw -LiteralPath $heartbeat
            $hash = (Get-FileHash -LiteralPath $heartbeat -Algorithm SHA256).Hash
            $state = $null
            $parseError = $null
            try { $state = $raw | ConvertFrom-Json -ErrorAction Stop } catch { $parseError = 'JSON_PARSE_FAILED' }
            $keys = @()
            if ($state) { $keys = @($state.PSObject.Properties.Name | Sort-Object) }
            $gatewayError = if ($state) { $state.last_gateway_heartbeat_error } else { $null }
            $gatewayErrorMessage = if ($gatewayError) { [string]$gatewayError.message } else { $null }
            if ($gatewayErrorMessage) {
              $gatewayErrorMessage = $gatewayErrorMessage -replace '(?i)Bearer\\s+[^\\s]+','Bearer [REDACTED]'
              $gatewayErrorMessage = $gatewayErrorMessage -replace '(?i)(api[_-]?key|token|secret|password|authorization)(\\s*[:=]\\s*|\\s+)[^\\s;]+','$1$2[REDACTED]'
              $gatewayErrorMessage = $gatewayErrorMessage.Substring(0,[Math]::Min(180,$gatewayErrorMessage.Length))
            }
            return @{
              exists=$true
              length=$item.Length
              last_write_utc=$item.LastWriteTimeUtc.ToString('o')
              sha256=$hash
              json_valid=($null -ne $state)
              parse_error=$parseError
              version=if($state){[string]$state.version}else{$null}
              device_id=if($state){[string]$state.device_id}else{$null}
              timestamp=if($state){[string]$state.timestamp}else{$null}
              network=if($state){[string]$state.network}else{$null}
              last_gateway_heartbeat_at=if($state){[string]$state.last_gateway_heartbeat_at}else{$null}
              gateway_error_at=if($gatewayError){[string]$gatewayError.at}else{$null}
              gateway_error_status=if($gatewayError){$gatewayError.status}else{$null}
              gateway_error_code=if($gatewayError){[string]$gatewayError.code}else{$null}
              gateway_error_message_sanitized=$gatewayErrorMessage
              has_gateway_error=($null -ne $gatewayError)
              property_names=$keys
            }
          }

          $agentPid = Read-PidFile $agentPidFile
          $watchdogPid = Read-PidFile $watchdogPidFile
          $all = @(Get-CimInstance Win32_Process -ErrorAction Stop)
          $byId = @{}
          foreach ($p in $all) { $byId[[int]$p.ProcessId] = $p }

          $processes = @()
          foreach ($p in $all | Where-Object { $_.Name -match '^(node|node.exe|powershell|powershell.exe|pwsh|pwsh.exe)$' }) {
            $parent = $byId[[int]$p.ParentProcessId]
            $owner = $null
            try {
              $o = Invoke-CimMethod -InputObject $p -MethodName GetOwner -ErrorAction Stop
              if ($o.ReturnValue -eq 0) { $owner = "$($o.Domain)\$($o.User)" }
            } catch {}
            $cmd = [string]$p.CommandLine
            $processes += @{
              pid=[int]$p.ProcessId
              parent_pid=[int]$p.ParentProcessId
              parent_name=if($parent){[string]$parent.Name}else{$null}
              name=[string]$p.Name
              session_id=[int]$p.SessionId
              owner=$owner
              executable_path=[string]$p.ExecutablePath
              command_mentions_runtime_agent=($cmd -match 'ARIA-Windows-Agent|aria-agent\.js')
              command_mentions_watchdog=($cmd -match 'run-agent\.ps1')
              command_mentions_heartbeat=($cmd -match 'agent-heartbeat\.json')
              commandline_redacted=($cmd -replace '(?i)(token|secret|password|authorization)(\s*[:=]\s*|\s+)[^\s;]+','$1$2[REDACTED]')
            }
          }

          $initial = Get-HeartbeatSnapshot

          # Read-only incident window: capture the latest six hours so the
          # A6 watchdog-mediated restart and rollback at ~20:43 UTC are included.
          $incidentEnd = [DateTimeOffset]::UtcNow
          $incidentStart = $incidentEnd.AddHours(-6)
          $killRequestPath = Join-Path $logs 'kill-request'
          $killRequest = @{
            exists = (Test-Path -LiteralPath $killRequestPath -PathType Leaf)
            content = $null
            last_write_utc = $null
          }
          if ($killRequest.exists) {
            try {
              $killItem = Get-Item -LiteralPath $killRequestPath
              $killRequest.content = (Get-Content -Raw -LiteralPath $killRequestPath).Trim()
              $killRequest.last_write_utc = $killItem.LastWriteTimeUtc.ToString('o')
            } catch {
              $killRequest.read_error_type = $_.Exception.GetType().Name
            }
          }
          $incidentEvents = @()
          foreach ($logName in @('System','Microsoft-Windows-NetworkProfile/Operational','Microsoft-Windows-NDIS/Operational','Microsoft-Windows-TaskScheduler/Operational')) {
            try {
              $events = @(Get-WinEvent -FilterHashtable @{
                LogName=$logName
                StartTime=$incidentStart.LocalDateTime
                EndTime=$incidentEnd.LocalDateTime
              } -ErrorAction Stop | Select-Object -First 300)
              foreach ($event in $events) {
                $message = [string]$event.Message
                $isNetworkRelevant = $logName -ne 'System' -or
                  $event.ProviderName -match 'rt640x64|NDIS|Tcpip|Network|Kernel-PnP|Kernel-Power' -or
                  $event.Id -in @(27,32,41,10400,10401,4201,4202,5002,5005,5007,6008)
                if (-not $isNetworkRelevant) { continue }
                $message = $message -replace '(?i)Bearer\s+[^\s]+','Bearer [REDACTED]'
                $message = $message -replace '(?i)(token|secret|password|authorization)(\s*[:=]\s*|\s+)[^\s;]+','$1$2[REDACTED]'
                $incidentEvents += @{
                  log=$logName
                  time_utc=$event.TimeCreated.ToUniversalTime().ToString('o')
                  provider=[string]$event.ProviderName
                  event_id=[int]$event.Id
                  level=[string]$event.LevelDisplayName
                  message=$message.Substring(0,[Math]::Min(1000,$message.Length))
                }
              }
            } catch {
              $queryError = [string]$_.Exception.Message
              $queryError = $queryError -replace '(?i)(token|secret|password|authorization)(\s*[:=]\s*|\s+)[^\s;]+','$1$2[REDACTED]'
              $incidentEvents += @{ log=$logName; query_error_type=$_.Exception.GetType().Name; query_error=$queryError.Substring(0,[Math]::Min(500,$queryError.Length)) }
            }
          }

          $netAdaptersDetailed = @()
          try {
            $netAdaptersDetailed = @(Get-NetAdapter -IncludeHidden -ErrorAction Stop | Select-Object Name,InterfaceDescription,Status,LinkSpeed,InterfaceIndex,DriverInformation,DriverFileName,DriverVersion)
          } catch {
            $netAdaptersDetailed = @(@{ query_error=$_.Exception.GetType().Name; message=$_.Exception.Message })
          }
          $connectionProfiles = @()
          try {
            $connectionProfiles = @(Get-NetConnectionProfile -ErrorAction Stop | Select-Object Name,InterfaceAlias,InterfaceIndex,NetworkCategory,IPv4Connectivity,IPv6Connectivity)
          } catch {
            $connectionProfiles = @(@{ query_error=$_.Exception.GetType().Name; message=$_.Exception.Message })
          }
          $defaultRoutes = @()
          try {
            $defaultRoutes = @(Get-NetRoute -DestinationPrefix '0.0.0.0/0' -ErrorAction Stop | Select-Object InterfaceAlias,InterfaceIndex,NextHop,RouteMetric,State)
          } catch {
            $defaultRoutes = @(@{ query_error=$_.Exception.GetType().Name; message=$_.Exception.Message })
          }
          $networkAdapters = @()
          try {
            $networkAdapters = @(Get-CimInstance Win32_NetworkAdapter -ErrorAction Stop |
              Where-Object { $_.Name -match 'Realtek|PCIe FE' } |
              Select-Object Name,Manufacturer,NetEnabled,NetConnectionStatus,Speed,PNPDeviceID,ConfigManagerErrorCode)
          } catch {
            $networkAdapters = @(@{ query_error=$_.Exception.GetType().Name; message=$_.Exception.Message })
          }
          $networkDrivers = @()
          try {
            $networkDrivers = @(Get-CimInstance Win32_PnPSignedDriver -ErrorAction Stop |
              Where-Object { $_.DeviceName -match 'Realtek|PCIe FE' } |
              Select-Object DeviceName,DriverVersion,DriverDate,DriverProviderName,InfName,IsSigned)
          } catch {
            $networkDrivers = @(@{ query_error=$_.Exception.GetType().Name; message=$_.Exception.Message })
          }
          $computerSystem = $null
          try {
            $cs = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
            $computerSystem = @{ manufacturer=[string]$cs.Manufacturer; model=[string]$cs.Model; system_type=[string]$cs.SystemType }
          } catch {
            $computerSystem = @{ query_error=$_.Exception.GetType().Name }
          }
          $networkPowerManagement = @()
          try {
            if (Get-Command Get-NetAdapterPowerManagement -ErrorAction SilentlyContinue) {
              $networkPowerManagement = @(Get-NetAdapterPowerManagement -Name '*' -ErrorAction Stop |
                Where-Object { $_.Name -match 'Realtek|Ethernet' } |
                Select-Object Name,AllowComputerToTurnOffDevice,SelectiveSuspend,DeviceSleepOnDisconnect,WakeOnMagicPacket,WakeOnPattern)
            } else {
              $networkPowerManagement = @(@{ unavailable='Get-NetAdapterPowerManagement cmdlet not present' })
            }
          } catch {
            $networkPowerManagement = @(@{ query_error=$_.Exception.GetType().Name; message=$_.Exception.Message })
          }
          $ethernetPowerManagement = @()
          try {
            if (Get-Command Get-NetAdapterPowerManagement -ErrorAction SilentlyContinue) {
              $ethernetPowerManagement = @(Get-NetAdapterPowerManagement -Name 'Ethernet' -ErrorAction Stop |
                Select-Object Name,AllowComputerToTurnOffDevice,SelectiveSuspend,DeviceSleepOnDisconnect,WakeOnMagicPacket,WakeOnPattern)
            } else {
              $ethernetPowerManagement = @(@{ unavailable='Get-NetAdapterPowerManagement cmdlet not present' })
            }
          } catch {
            $ethernetPowerManagement = @(@{ query_error=$_.Exception.GetType().Name; message=$_.Exception.Message })
          }
          $networkAdvancedProperties = @()
          try {
            if (Get-Command Get-NetAdapterAdvancedProperty -ErrorAction SilentlyContinue) {
              $networkAdvancedProperties = @(Get-NetAdapterAdvancedProperty -Name 'Ethernet' -AllProperties -ErrorAction Stop |
                Select-Object Name,DisplayName,DisplayValue,RegistryKeyword,RegistryValue,ValidDisplayValues,ValidRegistryValues,DefaultDisplayValue,DefaultRegistryValue)
            }
          } catch {
            $networkAdvancedProperties = @(@{ query_error=$_.Exception.GetType().Name; message=$_.Exception.Message })
          }
          $ethernetPnpPowerProperties = @()
          try {
            if (Get-Command Get-PnpDeviceProperty -ErrorAction SilentlyContinue) {
              $ethernetPnpPowerProperties = @(Get-PnpDeviceProperty -InstanceId 'PCI\VEN_10EC&DEV_8136&SUBSYS_078B1028&REV_07\01000000364CE00000' -ErrorAction Stop |
                Where-Object { $_.KeyName -match 'Power|DeviceSleep|SelectiveSuspend' } |
                Select-Object KeyName,Type,Data)
            }
          } catch {
            $ethernetPnpPowerProperties = @(@{ query_error=$_.Exception.GetType().Name; message=$_.Exception.Message })
          }

          # Read-only DNS and local gateway probes. Never modifies resolver, route, or adapter settings.
          $dnsResolverState = @()
          try {
            $dnsResolverState = @(Get-DnsClientServerAddress -InterfaceAlias 'Ethernet' -AddressFamily IPv4 -ErrorAction Stop |
              Select-Object InterfaceAlias,InterfaceIndex,AddressFamily,ServerAddresses)
          } catch {
            $dnsResolverState = @(@{ query_error=$_.Exception.GetType().Name; message=$_.Exception.Message })
          }
          $dnsTests = @()
          foreach ($target in @(
            @{ label='system_default'; server=$null },
            @{ label='cloudflare_1_1_1_1'; server='1.1.1.1' },
            @{ label='google_8_8_8_8'; server='8.8.8.8' }
          )) {
            $entry = @{ label=$target.label; server=$target.server; status='BLOCKED'; addresses=@(); error=$null; elapsed_ms=$null }
            $dnsStarted = [DateTimeOffset]::UtcNow
            try {
              $dnsArgs = @{ Name='icuqsstxfdbvjytkhlog.supabase.co'; Type='A'; DnsOnly=$true; QuickTimeout=$true; ErrorAction='Stop' }
              if ($target.server) { $dnsArgs.Server = $target.server }
              $answer = @(Resolve-DnsName @dnsArgs)
              $entry.addresses = @($answer | Where-Object { $_.Type -eq 'A' } | ForEach-Object { [string]$_.IPAddress })
              $entry.status = if ($entry.addresses.Count) { 'PASS' } else { 'NO_A_RECORD' }
            } catch {
              $entry.error = [string]$_.Exception.Message
              $entry.status = 'ERROR'
            }
            $entry.elapsed_ms = [long]([DateTimeOffset]::UtcNow - $dnsStarted).TotalMilliseconds
            $dnsTests += $entry
          }
          $gatewayProbe = @()
          try {
            $gatewayProbe = @(Test-Connection -ComputerName '192.168.1.1' -Count 2 -Quiet -ErrorAction SilentlyContinue)
          } catch {
            $gatewayProbe = @(@{ query_error=$_.Exception.GetType().Name; message=$_.Exception.Message })
          }
          $httpsNameProbe = @{ status='BLOCKED'; error=$null; elapsed_ms=$null }
          $tcpProbe = $null
          $tcpAsync = $null
          $tcpStarted = [DateTimeOffset]::UtcNow
          try {
            $tcpProbe = [System.Net.Sockets.TcpClient]::new()
            $tcpAsync = $tcpProbe.BeginConnect('icuqsstxfdbvjytkhlog.supabase.co',443,$null,$null)
            if ($tcpAsync.AsyncWaitHandle.WaitOne(4000)) {
              $tcpProbe.EndConnect($tcpAsync)
              $httpsNameProbe.status = 'PASS'
            } else {
              $httpsNameProbe.status = 'TIMEOUT_4000MS'
              $httpsNameProbe.error = 'DNS_OR_TCP_CONNECT_DEADLINE_EXCEEDED'
            }
          } catch {
            $httpsNameProbe.status = 'ERROR'
            $httpsNameProbe.error = [string]$_.Exception.Message
          } finally {
            $httpsNameProbe.elapsed_ms = [long]([DateTimeOffset]::UtcNow - $tcpStarted).TotalMilliseconds
            if ($tcpProbe) { $tcpProbe.Dispose() }
          }

          $watchdogIncidentLines = @()
          $watchdogLog = Join-Path $logs 'watchdog.log'
          $watchdogLogInfo = @{ exists=(Test-Path -LiteralPath $watchdogLog -PathType Leaf) }
          if ($watchdogLogInfo.exists) {
            try {
              $watchdogItem = Get-Item -LiteralPath $watchdogLog
              $watchdogLogInfo.size_bytes=[long]$watchdogItem.Length
              $watchdogLogInfo.last_write_utc=$watchdogItem.LastWriteTimeUtc.ToString('o')
              $watchdogIncidentLines = @(Get-Content -LiteralPath $watchdogLog -Tail 12000 |
                ForEach-Object {
                  $line = [string]$_
                  if ($line -match '^\[ARIA-WATCHDOG\]\s+(?<stamp>\S+)\s+(?<message>.*)$') {
                    try {
                      $stamp = [DateTimeOffset]::Parse($Matches.stamp).ToUniversalTime()
                      if ($stamp -ge $incidentStart -and $stamp -le $incidentEnd) {
                        $message = [string]$Matches.message
                        $message = $message -replace '(?i)(token|secret|password|authorization)(\s*[:=]\s*|\s+)[^\s;]+','$1$2[REDACTED]'
                        [pscustomobject]@{ time_utc=$stamp.ToString('o'); message=$message.Substring(0,[Math]::Min(600,$message.Length)) }
                      }
                    } catch {}
                  }
                } | Where-Object { $null -ne $_ } | Select-Object -Last 160)
            } catch {
              $watchdogIncidentLines = @(@{ read_error_type=$_.Exception.GetType().Name; read_error=$_.Exception.Message })
            }
          }

          $powerSettings = @()
          try {
            $powerSettings += '--- POWER PLAN / SLEEP ---'
            $powerSettings += @(& powercfg.exe /query SCHEME_CURRENT SUB_SLEEP 2>&1 | Select-Object -First 100 | ForEach-Object { [string]$_ })
          } catch {
            $powerSettings += 'POWERCFG_READ_FAILED:' + $_.Exception.GetType().Name
          }
          $osBoot = $null
          try {
            $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
            $osBoot = @{ last_boot_utc=$os.LastBootUpTime.ToUniversalTime().ToString('o'); local_datetime=[string]$os.LocalDateTime }
          } catch {
            $osBoot = @{ query_error=$_.Exception.GetType().Name }
          }
          for ($i=0; $i -lt 31; $i++) {
            $snap = Get-HeartbeatSnapshot
            $samples.Add(@{ captured_at_utc=[DateTimeOffset]::UtcNow.ToString('o'); heartbeat=$snap })
            if ($i -lt 30) { Start-Sleep -Seconds 2 }
          }

          $finalProcesses = @()
          $allAfter = @(Get-CimInstance Win32_Process -ErrorAction Stop)
          $byIdAfter = @{}
          foreach ($p in $allAfter) { $byIdAfter[[int]$p.ProcessId] = $p }
          foreach ($p in $allAfter | Where-Object { $_.Name -match '^(node|node.exe|powershell|powershell.exe|pwsh|pwsh.exe)$' }) {
            $parent = $byIdAfter[[int]$p.ParentProcessId]
            $cmd = [string]$p.CommandLine
            $owner = $null
            try { $o=Invoke-CimMethod -InputObject $p -MethodName GetOwner -ErrorAction Stop; if($o.ReturnValue -eq 0){$owner="$($o.Domain)\$($o.User)"} } catch {}
            $finalProcesses += @{
              pid=[int]$p.ProcessId; parent_pid=[int]$p.ParentProcessId
              parent_name=if($parent){[string]$parent.Name}else{$null}
              name=[string]$p.Name; session_id=[int]$p.SessionId; owner=$owner
              executable_path=[string]$p.ExecutablePath
              command_mentions_runtime_agent=($cmd -match 'ARIA-Windows-Agent|aria-agent\.js')
              command_mentions_watchdog=($cmd -match 'run-agent\.ps1')
              command_mentions_heartbeat=($cmd -match 'agent-heartbeat\.json')
              commandline_redacted=($cmd -replace '(?i)(token|secret|password|authorization)(\s*[:=]\s*|\s+)[^\s;]+','$1$2[REDACTED]')
            }
          }

          $result = @{
            status='READ_ONLY_CAPTURE_COMPLETE'
            host=[string]$env:COMPUTERNAME
            captured_at_utc=[DateTimeOffset]::UtcNow.ToString('o')
            duration_seconds=[math]::Round(([DateTimeOffset]::UtcNow-$started).TotalSeconds,1)
            source_sha=[string]$env:GITHUB_SHA
            heartbeat_path=$heartbeat
            agent_pid_file=$agentPid
            watchdog_pid_file=$watchdogPid
            initial_heartbeat=$initial
            kill_request=$killRequest
            samples=@($samples.ToArray())
            processes_before=$processes
            processes_after=$finalProcesses
            incident_events=@($incidentEvents)
            watchdog_incident_lines=@($watchdogIncidentLines)
            incident_window_utc=@($incidentStart.ToString('o'),$incidentEnd.ToString('o'))
            power_settings=@($powerSettings)
            operating_system=$osBoot
            computer_system=$computerSystem
            active_network_adapters=@($netAdaptersDetailed)
            connection_profiles=@($connectionProfiles)
            default_routes=@($defaultRoutes)
            network_adapters=@($networkAdapters)
            network_drivers=@($networkDrivers)
            network_power_management=@($networkPowerManagement)
            ethernet_power_management=@($ethernetPowerManagement)
            ethernet_pnp_power_properties=@($ethernetPnpPowerProperties)
            network_advanced_properties=@($networkAdvancedProperties)
            dns_resolvers=@($dnsResolverState)
            dns_tests=@($dnsTests)
            default_gateway_probe=@($gatewayProbe)
            supabase_https_name_probe=$httpsNameProbe
            watchdog_log_info=$watchdogLogInfo
            restrictions=@('NO_RUNTIME_WRITES','NO_CONFIG_CHANGES','NO_PROCESS_RESTARTS','NO_TASK_CHANGES','NO_GATEWAY_CALLS','NO_MISSIONS_OR_JOBS')
          }
          $result | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath $out -Encoding UTF8
          Write-Host "A6_READ_ONLY_HOST=$env:COMPUTERNAME"
          Write-Host "A6_READ_ONLY_SAMPLES=$($samples.Count)"
          Write-Host "A6_AGENT_PID_FILE=$agentPid"
          Write-Host "A6_WATCHDOG_PID_FILE=$watchdogPid"
          Write-Host 'A6_READ_ONLY_CAPTURE=PASS'
          $global:LASTEXITCODE = 0
          exit 0

      - name: Upload sanitized read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-heartbeat-live-readonly-${{ github.sha }}
          path: a6-heartbeat-live-readonly.json
          if-no-files-found: warn
          retention-days: 14

# Post-user-change verification checkpoint: Ethernet power-saving state and default route.

# Read-only correlation refresh for the 2026-11-12 16:03 UTC A6 heartbeat continuity block.

# Narrow read-only query for Ethernet power management and all Realtek advanced properties.

# Read-only DNS resolver comparison for the A6 ENOTFOUND incident.

# Bound the HTTPS hostname probe to 4 seconds so diagnostics cannot hang on DNS.
