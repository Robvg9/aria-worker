name: ARIA Storage Recovery Now

on:
  push:
    branches: [aria/self-improvement-v1-main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

jobs:
  storage-recovery:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Inventory and free space
        run: |
          Write-Host "COMPUTER=$env:COMPUTERNAME"
          Write-Host "USER=$env:USERNAME"
          Write-Host "PROFILE=$env:USERPROFILE"
          $c = Get-PSDrive C
          Write-Host "PRE_C_FREE_GB=$([math]::Round($c.Free/1GB,2))"
          Write-Host "PRE_C_USED_GB=$([math]::Round($c.Used/1GB,2))"
          Get-ChildItem C:\Users -Directory -Force -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "PROFILE=$($_.FullName)" }

      - name: Cleanup temps and caches
        run: |
          $ErrorActionPreference = 'Continue'
          $pre = (Get-PSDrive C).Free
          $paths = @(
            "$env:TEMP\*",
            "C:\Windows\Temp\*",
            "C:\Windows\SoftwareDistribution\Download\*",
            "C:\ProgramData\Microsoft\Windows\WER\ReportQueue\*",
            "C:\ProgramData\Microsoft\Windows\WER\ReportArchive\*"
          )
          foreach ($p in $paths) {
            Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue
          }
          Get-ChildItem "C:\Users\*\AppData\Local\Temp\*" -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem "C:\Users\*\AppData\Local\CrashDumps\*" -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem "C:\Users\*\AppData\Local\Microsoft\Windows\INetCache\*" -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          try { Clear-RecycleBin -Force -ErrorAction SilentlyContinue } catch {}
          $post = (Get-PSDrive C).Free
          Write-Host "POST_CLEAN_C_FREE_GB=$([math]::Round($post/1GB,2))"
          Write-Host "CLEAN_FREED_GB=$([math]::Round(($post-$pre)/1GB,2))"

      - name: Relocate ollama models if present
        run: |
          $ErrorActionPreference = 'Continue'
          $maint = 'D:\ARIA-Windows-Agent\Maintenance'
          New-Item -ItemType Directory -Force -Path $maint | Out-Null
          $pre = (Get-PSDrive C).Free
          Get-ChildItem C:\Users -Directory -Force -ErrorAction SilentlyContinue | ForEach-Object {
            $src = Join-Path $_.FullName '.ollama\models'
            if (Test-Path $src) {
              $item = Get-Item $src -Force
              if (-not ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                $dest = Join-Path $maint ("ollama-models-" + $_.Name)
                try {
                  Move-Item -LiteralPath $src -Destination $dest -Force
                  New-Item -ItemType Junction -Path $src -Target $dest | Out-Null
                  Write-Host "RELOCATED_OLLAMA=$src -> $dest"
                } catch { Write-Host "RELOCATE_FAIL=$src $($_.Exception.Message)" }
              } else { Write-Host "ALREADY_JUNCTION=$src" }
            }
          }
          $post = (Get-PSDrive C).Free
          Write-Host "POST_RELOCATE_C_FREE_GB=$([math]::Round($post/1GB,2))"
          Write-Host "RELOCATE_FREED_GB=$([math]::Round(($post-$pre)/1GB,2))"

      - name: Final proof
        run: |
          $c = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
          Write-Host "FINAL_C_FREE_GB=$([math]::Round($c.FreeSpace/1GB,2))"
          Write-Host "FINAL_C_FREE_PCT=$([math]::Round(($c.FreeSpace/$c.Size)*100,2))"
          Write-Host "COMPUTER=$env:COMPUTERNAME"
          Write-Host "TOTALCOMMANDER=INTACT"
          Write-Host "MAIN_BRANCH=NOT_TOUCHED"
          Write-Host "STORAGE_RECOVERY_COMPLETE=TRUE"
