name: All For One Forensic Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/all-for-one-forensic-audit-v1"]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/all-for-one-forensic-audit.test.js
