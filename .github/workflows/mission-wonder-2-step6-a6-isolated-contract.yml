name: Mission Wonder 2 Step 6 A6 — Isolated Scope Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/mission-wonder-2-a6-scope-v1.mjs'
      - 'tests/mission-wonder-2-step6-a6-isolated-scope.test.mjs'
      - 'tests/mission-wonder-2-step6-a6-soak.test.mjs'
      - '.github/workflows/mission-wonder-2-step6-a6-isolated-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-wonder-2-step6-a6-isolated-contract-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-scope-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check A6 scope helper syntax
        run: node --check supabase/functions/_shared/mission-wonder-2-a6-scope-v1.mjs
      - name: Verify bounded multi-mission scope and local marker plan
        run: node tests/mission-wonder-2-step6-a6-isolated-scope.test.mjs
      - name: Verify A6 soak evidence evaluator and frozen baseline
        run: node tests/mission-wonder-2-step6-a6-soak.test.mjs
