name: Mission Wonder 2 Step 6 A6 — Isolated Scope Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/mission-wonder-2-a6-scope-v1.mjs'
      - 'tests/mission-wonder-2-step6-a6-isolated-scope.test.mjs'
      - 'tests/mission-wonder-2-step6-a6-runtime-wiring.test.mjs'
      - 'supabase/functions/aria-cron-auth-v1/index.ts'
      - 'supabase/migrations/20261107100000_aria_m22_a6_cron_auth_slot_reuse_v1.sql'
      - 'supabase/migrations/20261107133800_aria_m22_a6_stdout_verification_marker_alignment_v1.sql'
      - '.github/scripts/mission-wonder-2-step6-a6-cron-auth-slot-reuse-v1.sql'
      - 'supabase/functions/aria-canonical-runtime-v1/index.ts'
      - 'supabase/functions/aria-mission-runner-v22/index.ts'
      - 'supabase/functions/aria-device-gateway/index.ts'
      - '.github/scripts/mission-wonder-2-step6-a6-isolated-scope-v1.sql'
      - 'supabase/migrations/*_aria_mission_wonder_2_a6_isolated_scope_v1.sql'
      - 'supabase/migrations/*_aria_m22_a6_frozen_job_marker_authorization_alignment_v1.sql'
      - '.github/workflows/supabase-canonical-deploy.yml'
      - '.github/workflows/aria-cloudflare-deploy.yml'
      - '.github/workflows/aria-pwa-fast-deploy.yml'
      - 'tests/mission-wonder-2-step6-a6-soak.test.mjs'
      - 'tests/mission-wonder-2-step6-a6-fault-matrix.test.mjs'
      - '.github/scripts/mission-wonder-2-a6-frozen-claim-postgres-v1.sql'
      - '.github/workflows/mission-wonder-2-step6-a6-isolated-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-wonder-2-step6-a6-isolated-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-scope-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: a6-test-only-password
          POSTGRES_USER: postgres
          POSTGRES_DB: a6_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d a6_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: a6-test-only-password
      PGDATABASE: a6_migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare disposable PostgreSQL A6 migration fixture
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $roles$
          begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role; end if;
          end;
          $roles$;
          create schema aria_internal;
          create schema cron;
          create schema extensions;
          create extension if not exists pgcrypto with schema extensions;
          create schema vault;
          create table cron.job (
            jobid bigint generated by default as identity primary key,
            jobname text, schedule text, command text, active boolean not null default true
          );
          insert into cron.job(jobid,jobname,schedule,command,active) values
            (48,'aria-autonomy-supervisor-v5-every-10-minutes','*/10 * * * *','select 1',false),
            (49,'aria-execution-jobs-watchdog-every-10-minutes','*/10 * * * *','select 1',false),
            (50,'aria-autonomy-supervisor-v5-http-every-10-minutes','*/10 * * * *','select 1',false);
          create function cron.schedule(text,text,text) returns bigint language plpgsql as $cron$
          declare id bigint;
          begin
            insert into cron.job(jobname,schedule,command,active) values ($1,$2,$3,true) returning jobid into id;
            return id;
          end;
          $cron$;
          create function cron.alter_job(
            job_id bigint,
            schedule text default null,
            command text default null,
            database text default null,
            username text default null,
            active boolean default null
          ) returns void language plpgsql as $cron$
          begin
            update cron.job j
               set schedule=coalesce($2,j.schedule),
                   command=coalesce($3,j.command),
                   active=coalesce($6,j.active)
             where j.jobid=$1;
          end;
          $cron$;
          create table vault.decrypted_secrets(name text,decrypted_secret text);
          create table aria_internal.mission_state (
            mission_id text primary key, goal text, status text, checkpoint jsonb default '{}'::jsonb,
            current_step integer default 0, completed_steps integer default 0, total_steps integer,
            lease_owner text, lease_until timestamptz, metadata jsonb default '{}'::jsonb,
            updated_at timestamptz default clock_timestamp(), finished_at timestamptz, next_action text
          );
          create table aria_internal.execution_jobs (
            job_id text primary key, mission_id text, device_id text, operation text, command text, cwd text,
            timeout_ms integer, policy jsonb default '{}'::jsonb, metadata jsonb default '{}'::jsonb,
            status text, requested_at timestamptz default clock_timestamp(), claimed_at timestamptz, started_at timestamptz, completed_at timestamptz, recovery_count integer default 0,
            lease_owner text, lease_until timestamptz, updated_at timestamptz default clock_timestamp(),
            exit_code integer, stdout text
          );
          create table aria_internal.execution_job_events (job_id text,device_id text,event_type text,payload jsonb default '{}'::jsonb);
          create table aria_internal.mission_events (mission_id text,event_type text,payload jsonb default '{}'::jsonb);
          create table aria_internal.device_registry (device_id text,agent_type text,status text,token_hash text,capabilities jsonb,last_seen_at timestamptz);
          create function aria_internal.aria_m22_a4_frozen_job_authorized_v1(text,text,text) returns boolean language sql as 'select false';
          create function aria_internal.aria_m22_a5_frozen_job_authorized_v1(text,text,text) returns boolean language sql as 'select false';
          SQL

      - name: Apply A6 migration to disposable PostgreSQL and verify inactive scheduler
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106154808_aria_mission_wonder_2_a6_isolated_scope_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261107100000_aria_m22_a6_cron_auth_slot_reuse_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261107133800_aria_m22_a6_stdout_verification_marker_alignment_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261110120000_aria_mission_wonder_2_a6_isolated_scope_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261110135000_aria_m22_a6_frozen_job_marker_authorization_alignment_v1.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $verify$
          declare snap jsonb; a6_total integer; a6_active integer; legacy_active integer; function_source text; auth_source text;
          begin
            snap := aria_internal.aria_m22_a6_ambient_snapshot_v1();
            if (snap->>'missionExecutionPaused')::boolean is distinct from true then raise exception 'A6_FREEZE_FALSE'; end if;
            if (snap->>'cron48Active')::boolean or (snap->>'cron49Active')::boolean or (snap->>'cron50Active')::boolean then raise exception 'LEGACY_CRON_ACTIVE'; end if;
            select count(*) into legacy_active from cron.job where jobid in (48,49,50) and active;
            if legacy_active<>0 then raise exception 'LEGACY_CRON_CHANGED'; end if;
            select count(*) into a6_total from cron.job where jobname='aria-mission-wonder-2-a6-dispatcher-every-minute';
            if a6_total<>1 then raise exception 'A6_CRON_CREATE_COUNT_INVALID'; end if;
            select count(*) into a6_active from cron.job where jobname='aria-mission-wonder-2-a6-dispatcher-every-minute' and active;
            if a6_active<>0 then raise exception 'A6_CRON_MUST_BE_INACTIVE'; end if;
            if (select count(*) from cron.job where jobname='aria-mission-wonder-2-a6-dispatcher-every-minute'
                 and command like '%/functions/v1/aria-cron-auth-v1%'
                 and command like '%x-aria-dispatcher%'
                 and command like '%dispatch_due%')<>1 then
              raise exception 'A6_CRON_MUST_ROUTE_THROUGH_EXISTING_CRON_AUTH_FUNCTION';
            end if;
            if (select count(*) from cron.job where jobid in (48,49,50) and not active)<>3 then
              raise exception 'LEGACY_CRON_ACTIVATION_STATE_CHANGED';
            end if;
            select pg_get_functiondef('aria_internal.aria_m22_a6_materialize_due_mission_v1(text,text)'::regprocedure) into function_source;
            if position('A6_ARTIFACT_VERIFIED;mode=' in function_source)=0
               or position('A6_ARTIFACT_VERIFIED;sequence=' in function_source)>0 then
              raise exception 'A6_STDOUT_VERIFY_MARKER_ALIGNMENT_FAILED';
            end if;
            select pg_get_functiondef('aria_internal.aria_m22_a6_frozen_job_authorized_v1(text,text,text)'::regprocedure) into auth_source;
            if position('A6_ARTIFACT_VERIFIED;mode=' in auth_source)=0
               or position('A6_ARTIFACT_VERIFIED;sequence=' in auth_source)>0 then
              raise exception 'A6_DEVICE_AUTH_MARKER_ALIGNMENT_FAILED';
            end if;
            if exists(select 1 from aria_internal.mission_wonder_2_a6_runs) then raise exception 'RUN_CREATED_BY_MIGRATION'; end if;
            if exists(select 1 from aria_internal.mission_wonder_2_a6_scopes) then raise exception 'SCOPE_CREATED_BY_MIGRATION'; end if;
            if exists(select 1 from aria_internal.mission_state) then raise exception 'MISSION_CREATED_BY_MIGRATION'; end if;
            if exists(select 1 from aria_internal.execution_jobs) then raise exception 'JOB_CREATED_BY_MIGRATION'; end if;
          end;
          $verify$;
          SQL
          echo "A6_CRON_API_MIGRATION_POSTGRES_PASS=true"
          echo "A6_CRON_CREATED_INACTIVE=true"
          echo "A6_LEGACY_CRONS_48_49_50_STAY_DISABLED=true"
          echo "A6_NO_RUN_SCOPE_MISSION_JOB_OR_LEASE=true"

      - name: Exercise frozen A6 claim through PostgreSQL with the global freeze active
        run: psql -v ON_ERROR_STOP=1 -f .github/scripts/mission-wonder-2-a6-frozen-claim-postgres-v1.sql

      - name: Check A6 scope helper syntax
        run: node --check supabase/functions/_shared/mission-wonder-2-a6-scope-v1.mjs
      - name: Verify bounded multi-mission scope and local marker plan
        run: node tests/mission-wonder-2-step6-a6-isolated-scope.test.mjs
      - name: Verify A6 soak evidence evaluator and frozen baseline
        run: node tests/mission-wonder-2-step6-a6-soak.test.mjs
      - name: Verify A6 runtime wiring and deployment isolation
        run: node tests/mission-wonder-2-step6-a6-runtime-wiring.test.mjs
      - name: Run deterministic five-scenario pre-soak fault matrix
        run: node tests/mission-wonder-2-step6-a6-fault-matrix.test.mjs
      - name: Upload deterministic fault-matrix evidence
        uses: actions/upload-artifact@v4
        with:
          name: mission-wonder-2-a6-fault-matrix-${{ github.sha }}
          path: artifacts/a6-fault-matrix-evidence.json
          if-no-files-found: error
          retention-days: 30
