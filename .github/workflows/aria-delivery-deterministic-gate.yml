name: ARIA Delivery Deterministic Gate V1

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows: ["Deploy ARIA Cloudflare Worker"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Run delivery determinism contract
        run: node tests/delivery-deterministic-v1.test.js

  delivery-gate:
    if: github.event_name == 'push' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Canonical deploy result
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          event=json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          if event["workflow_run"]["conclusion"] != "success":
              print("CANONICAL_DEPLOY_FAILED=" + str(event["workflow_run"]["conclusion"]))
              sys.exit(1)
          print("CANONICAL_DEPLOY_SUCCESS")
          PY

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select exact target commit
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            SHA="$(python -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["workflow_run"]["head_sha"])')"
            git fetch origin "$SHA"
            git checkout --detach "$SHA"
          else
            SHA="$GITHUB_SHA"
          fi
          echo "HEAD_SHA=$SHA" >> "$GITHUB_ENV"
          echo "DELIVERY_TARGET_SHA=$SHA"

      - name: Verify release-bearing change
        run: |
          set -euo pipefail
          PARENT="$(git rev-list --parents -n 1 "$HEAD_SHA" | cut -d' ' -f2)"
          RESULT="$(node scripts/release-bearing.js "$PARENT" "$HEAD_SHA")"
          echo "$RESULT"
          RELEASE_BEARING="$(printf '%s' "$RESULT" | python -c 'import json,sys; print(str(json.load(sys.stdin)["release_bearing"]).lower())')"
          echo "RELEASE_BEARING=$RELEASE_BEARING" >> "$GITHUB_ENV"
          if [ "$RELEASE_BEARING" != "true" ]; then
            echo "NON_RELEASE_PUSH_NO_LIVE_REQUIRED"
          fi

      - name: Prepare independent release artifact identity
        if: env.RELEASE_BEARING == 'true'
        run: |
          set -euo pipefail
          npm --prefix pwa ci --ignore-scripts --no-audit --no-fund
          export VITE_BUILD="$HEAD_SHA"
          npm --prefix pwa run build
          node scripts/delivery-artifact.js prepare "$HEAD_SHA"

      - name: Wait for exact SHA to appear LIVE
        if: env.RELEASE_BEARING == 'true'
        run: |
          set -euo pipefail
          live=""
          for attempt in $(seq 1 60); do
            live="$(curl --fail --silent --show-error --max-time 20               "https://aria.robvg9.workers.dev/pwa/version.json?gate=$HEAD_SHA-$attempt" 2>/dev/null || true)"
            if VERSION="$live" EXPECTED="$HEAD_SHA" python - <<'PY'
          import json, os
          try:
              assert json.loads(os.environ["VERSION"])["build"] == os.environ["EXPECTED"]
              raise SystemExit(0)
          except Exception:
              raise SystemExit(1)
          PY
            then
              echo "LIVE_SHA_CONFIRMED=$HEAD_SHA"
              break
            fi
            test "$attempt" -lt 60 && sleep 5
          done
          test -n "$live"
          VERSION="$live" EXPECTED="$HEAD_SHA" python - <<'PY'
          import json, os
          assert json.loads(os.environ["VERSION"])["build"] == os.environ["EXPECTED"]
          PY

      - name: Verify release identity against LIVE
        if: env.RELEASE_BEARING == 'true'
        run: |
          set -euo pipefail
          node scripts/delivery-artifact.js verify-live "$HEAD_SHA" "https://aria.robvg9.workers.dev"

      - name: Publish immutable delivery evidence
        if: env.RELEASE_BEARING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aria-delivery-determinism
          path: .delivery-release-*.json
          if-no-files-found: error

      - name: Final marker
        run: |
          if [ "${RELEASE_BEARING:-false}" = "true" ]; then
            echo ARIA_DELIVERY_DETERMINISM_GATE_PASS
          else
            echo ARIA_DELIVERY_DETERMINISM_NON_RELEASE_PASS
          fi
