name: ARIA Runtime Secret Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aria-runtime-secret-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install OpenSSL
        run: openssl version

      - name: Generate and synchronize runtime secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          RUNTIME_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$RUNTIME_SECRET"

          printf '%s' "$RUNTIME_SECRET" | npx --yes wrangler@latest secret put ARIA_RUNTIME_SHARED_SECRET --name aria
          npx --yes supabase@latest secrets set "ARIA_RUNTIME_SHARED_SECRET=$RUNTIME_SECRET" --project-ref "$SUPABASE_PROJECT_REF"

          echo "ARIA runtime secret bootstrap completed without printing the secret value."
