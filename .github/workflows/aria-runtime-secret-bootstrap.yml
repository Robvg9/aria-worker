name: ARIA Runtime Secret Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aria-runtime-secret-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install OpenSSL
        run: openssl version

      - name: Synchronize canonical runtime secret across providers
        env:
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARIA_RUNTIME_SHARED_SECRET"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$ARIA_RUNTIME_SHARED_SECRET"

          printf '%s' "$ARIA_RUNTIME_SHARED_SECRET" | npx --yes wrangler@latest secret put ARIA_RUNTIME_SHARED_SECRET --name aria
          npx --yes supabase@latest secrets set "ARIA_RUNTIME_SHARED_SECRET=$ARIA_RUNTIME_SHARED_SECRET" --project-ref "$SUPABASE_PROJECT_REF"

          echo "ARIA runtime secret synchronized from the canonical GitHub Actions secret without printing its value."
