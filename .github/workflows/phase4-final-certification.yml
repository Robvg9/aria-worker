name: ARIA Phase 4 PC Final Certification

on:
  push:
    branches:
      - aria/phase4-pc-regression-20260930
  workflow_dispatch:

concurrency:
  group: aria-phase4-final-cert-${{ github.sha }}
  cancel-in-progress: false

jobs:
  phase4-final:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RWHT_URL: ${{ vars.RWHT_URL || 'https://aria.robvg9.workers.dev/pwa/' }}
      RWHT_HEADLESS: 'true'
      RWHT_NO_SCREENSHOTS: 'true'
      RWHT_ALLOW_MUTATIONS: 'false'
      RWHT_REQUIRE_AUTH: 'true'
      RWHT_ROUTES: '#home,#chat,#projects,#meditation,#capabilities,#settings,#mission'
      RWHT_MAX_CONTROLS_PER_ROUTE: '40'
      RWHT_RELOAD_AUTH: 'true'
      RWHT_LOGIN_WAIT_MS: '40000'
      RWHT_EXPECTED_AUTH_TEXT: 'Lista para actuar'
      RWHT_EMAIL: ${{ secrets.RWHT_EMAIL }}
      RWHT_PASSWORD: ${{ secrets.RWHT_PASSWORD }}
      RWHT_STORAGE_STATE_B64: ${{ secrets.RWHT_STORAGE_STATE_B64 }}
      RWHT_STORAGE_STATE_GZIP_B64: ${{ secrets.RWHT_STORAGE_STATE_GZIP_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare authenticated source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${RWHT_EMAIL}" && -n "${RWHT_PASSWORD}" ]]; then
            echo "RWHT_AUTH_STATE_SOURCE=password" >> "${GITHUB_ENV}"
          elif [[ -n "${RWHT_STORAGE_STATE_B64}" ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_B64}" | base64 --decode > "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            chmod 600 "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            echo "RWHT_STORAGE_STATE=${RUNNER_TEMP}/aria-rwht-auth-state.json" >> "${GITHUB_ENV}"
          elif [[ -n "${RWHT_STORAGE_STATE_GZIP_B64}" ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_GZIP_B64}" | base64 --decode | gzip -dc > "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            chmod 600 "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            echo "RWHT_STORAGE_STATE=${RUNNER_TEMP}/aria-rwht-auth-state.json" >> "${GITHUB_ENV}"
          else
            echo "::error::No authenticated session source configured."
            exit 1
          fi
      - name: Install dependencies
        working-directory: rwht/pc-browser
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: rwht/pc-browser
        run: npx playwright install --with-deps chromium
      - name: Execute Phase 4 final PC RWHT
        id: rwht
        continue-on-error: true
        working-directory: rwht/pc-browser
        run: node rwht-pc-browser.mjs
      - name: Validate Phase 4 final gate
        working-directory: rwht/pc-browser
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('rwht-artifacts/rwht-pc-report.json', 'utf8'));
          const knownDynamic = (name) =>
            /^Misión \d+ · /i.test(name) ||
            /^(Cancelar misión|Activadas|Desactivadas|Activar avisos|Desactivar avisos)$/i.test(name);
          const unexpected = [];
          for (const route of report.routes || []) {
            for (const action of route.actions || []) {
              if (action.outcome !== 'failed') continue;
              const name = String(action.control?.name || '');
              if (!knownDynamic(name)) unexpected.push({route: route.route, name, reason: action.reason || null, error: action.error || null});
            }
          }
          const unexpectedServerFailures = (report.failed_responses || []).filter((item) =>
            !(item.status === 504 &&
              /^https:\/\/aria\.robvg9\.workers\.dev\/auth\/token\?grant_type=password$/i.test(String(item.url || '')) &&
              report.auth_verified === true)
          );
          const nonAuthConsoleErrors = (report.console_errors || []).filter((item) =>
            !/Failed to load resource: the server responded with a status of 504/i.test(String(item.text || ''))
          );
          if (report.routes_completed !== report.routes_requested) throw new Error('routes_not_complete');
          if (!report.auth_verified) throw new Error('authenticated_surface_not_verified');
          if (unexpected.length) throw new Error('unexpected_control_failures=' + JSON.stringify(unexpected));
          if (unexpectedServerFailures.length) throw new Error('failed_responses=' + JSON.stringify(unexpectedServerFailures));
          if (nonAuthConsoleErrors.length) throw new Error('console_errors=' + JSON.stringify(nonAuthConsoleErrors));
          if ((report.page_errors || []).length) throw new Error('page_errors=' + report.page_errors.length);
          if ((report.ux_issues || []).length) throw new Error('ux_issues=' + report.ux_issues.length);
          if ((report.controls_verified || 0) < 24) throw new Error('verified_controls_below_floor=' + report.controls_verified);
          console.log(JSON.stringify({
            phase: '4/9',
            certification: 'PASS',
            routes: report.routes_completed + '/' + report.routes_requested,
            controls_verified: report.controls_verified,
            tolerated_auth_504: (report.failed_responses || []).filter(x => x.status === 504).length
          }, null, 2));
          NODE
      - name: Upload Phase 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-phase4-final-cert-evidence
          path: rwht/pc-browser/rwht-artifacts
          if-no-files-found: warn
      - name: Remove auth state
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/aria-rwht-auth-state.json"
