name: BattleCruiser Step 4 Product Search Filter and Restore V2 (Read Only)
on:
  push:
    branches:
      - aria/bc-step4-android-e2e-20261021
    paths:
      - .github/workflows/battlecruiser-step4-products-search-readonly-v2.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-step4-products-search-readonly-v2
  cancel-in-progress: false
jobs:
  android-products-search-readonly-v2:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Observe read-only Mando audit type/status filters and restore defaults
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.request, urllib.error
          project=os.environ.get('SUPABASE_PROJECT_REF','').strip()
          secret=os.environ.get('ARIA_RUNTIME_SHARED_SECRET','')
          if not project or not secret: raise SystemExit('BLOCKED: production secrets unavailable')
          base=f'https://{project}.supabase.co/functions/v1'
          headers={'Authorization':'Bearer '+secret,'content-type':'application/json','cache-control':'no-store'}
          mission_id=f"mission_bc_step4_products_search_readonly_v2_{os.environ['RUN_ID']}_{os.environ['RUN_ATTEMPT']}"
          device='android-termux-a1ebcfc7-9287-4603-a0f9-c519d12fd092'
          marker='BC_STEP4_PRODUCTS_SEARCH_READONLY_V2'
          command=r"""node <<'NODE'
          const {executeAndroidAccessibilityJob,probeLocalIpcHealth}=require('./computer-use/android-accessibility-v1.js');
          const marker='BC_STEP4_PRODUCTS_SEARCH_READONLY_V2',host='battlecruiser.robvg9.workers.dev',deviceBuild='3708b31b319884f7d42082414a82cdd11450fe2d';
          const base={target_package:'com.android.chrome',allow_any_app:false,allowed_hosts:[host]};
          const needle='rwht-no-match-20261021';
          const clean=s=>typeof s==='string'?s.replace(/\s+/g,' ').trim().replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig,'[redacted]').slice(0,180):'';
          const norm=s=>clean(s).toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n').trim();
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function send(q){return await executeAndroidAccessibilityJob({command:JSON.stringify({...base,...q}),timeoutMs:18000});}
          async function observe(){const r=await send({operation:'observe'}),p=r&&r.payload||{},root=p.root||(p.ui&&p.ui.root)||null;return {r,p,root};}
          async function action(a){return await send({operation:'action',action:a});}
          function scan(root){
            const nodes=[],seen=new Set();let count=0;
            const walk=(n,path,d)=>{
              if(!n||typeof n!=='object'||Array.isArray(n)||seen.has(n)||d>28||count>=1200)return;
              seen.add(n);count++;
              const names=['name','label','contentDescription','text','hint'].map(k=>clean(n[k])).filter(Boolean);
              nodes.push({id:typeof n.id==='string'&&n.id?n.id:path,path,role:clean(n.role),className:clean(n.className||n.class),names,text:names.join(' | '),
                visible:n.visible!==false,clickable:!!n.clickable,enabled:n.enabled!==false,scrollable:!!n.scrollable,bounds:n.bounds||null});
              if(Array.isArray(n.children))n.children.forEach((c,i)=>walk(c,path+'.'+i,d+1));
            };
            walk(root,'0',0);return nodes;
          }
          const exact=(nodes,label,opts={})=>nodes.find(n=>n.names.some(t=>norm(t)===norm(label))&&(!opts.visible||n.visible)&&(!opts.clickable||n.clickable)&&(!opts.enabled||n.enabled));
          const findSearch=nodes=>nodes.find(n=>n.enabled&&n.names.some(t=>norm(t).includes('buscar por nombre, categoria o unidad')))
            ||nodes.find(n=>n.visible&&n.enabled&&n.names.some(t=>norm(t).includes('buscar por nombre')&&norm(t).includes('unidad')));
          function snapshot(obs){
            const nodes=obs.root?scan(obs.root):[];
            const empty=nodes.some(n=>n.visible&&/no encontramos productos con esos criterios/i.test(n.text));
            const noProducts=nodes.some(n=>n.visible&&/todavia no hay productos cargados/i.test(n.text));
            const headings=nodes.some(n=>n.visible&&norm(n.text)==='productos');
            const search=findSearch(nodes);
            const productRowHints=nodes.filter(n=>/normal\s*\$/.test(norm(n.text))&&/mayorista\s*\$/.test(norm(n.text))&&/stock/.test(norm(n.text))).length;
            const countNode=nodes.find(n=>n.visible&&n.names.some(t=>norm(t).includes('productos-contador')));
            const countDigits=countNode?(countNode.text.match(/\d+/g)||[]).slice(0,2).map(Number):[];
            return {hash:obs.p.evidence_hash||null,nodeCount:nodes.length,headingVisible:headings,searchVisible:!!search,searchId:search&&search.id||null,
              noResultsMarker:empty,noProductsMarker:noProducts,productRowHints,countDigits,
              scrollables:nodes.filter(n=>n.visible&&n.scrollable).map(n=>({id:n.id,path:n.path,bounds:n.bounds})).slice(0,8),editors:nodes.filter(n=>n.role==='textbox'||/edittext/i.test(n.className)).map(n=>({id:n.id,role:n.role,className:n.className,visible:n.visible,enabled:n.enabled,bounds:n.bounds})).slice(0,12),
              safeLabels:nodes.filter(n=>n.visible&&(/productos|buscar por nombre|no encontramos productos|todavia no hay productos cargados|ver todos/i.test(norm(n.text)))).map(n=>clean(n.text)).slice(0,12)};
          }
          async function fresh(){let cur=await observe();for(let k=0;k<5&&(!cur.root||cur.p.ok!==true);k++){await wait(500);cur=await observe();}return cur;}
          async function clickWait(n,label,timeline){const r=await action({action:'click',nodeId:n.id});timeline.push({step:label,status:r&&r.status,reason:clean(r&&r.reason||r&&r.payload&&r.payload.reason)});await wait(500);return fresh();}
          async function typeWait(n,text,label,timeline){const r=await action({action:'type',nodeId:n.id,text});timeline.push({step:label,status:r&&r.status,reason:clean(r&&r.reason||r&&r.payload&&r.payload.reason)});await wait(800);return fresh();}
          (async()=>{
            const h=await probeLocalIpcHealth({timeoutMs:2500}),hp=h&&h.payload||{},exactBuild=h&&h.ok===true&&String(hp.version_name)==='1.1.23'&&Number(hp.version_code)===29&&String(hp.build_id)===deviceBuild;
            if(!exactBuild){console.log(JSON.stringify({marker,ok:false,stage:'exact_agent_build_mismatch',build:{ok:!!h?.ok,version_name:hp.version_name||null,version_code:hp.version_code||null,build_id:hp.build_id||null}}));process.exitCode=20;return;}
            const timeline=[];
            const nav=await action({action:'navigate',url:'https://'+host});timeline.push({step:'navigate_live',status:nav&&nav.status});await wait(1800);
            let cur=await fresh(),ns=cur.root?scan(cur.root):[],open=exact(ns,'Abrir menú',{visible:true,clickable:true,enabled:true});
            for(let k=0;k<8&&!open;k++){await wait(500);cur=await fresh();ns=cur.root?scan(cur.root):[];open=exact(ns,'Abrir menú',{visible:true,clickable:true,enabled:true});}
            if(!open){console.log(JSON.stringify({marker,ok:false,stage:'menu_not_found',timeline,screen:snapshot(cur)}));process.exitCode=1;return;}
            cur=await clickWait(open,'open_menu',timeline);
            let products=exact(cur.root?scan(cur.root):[],'Productos',{visible:true,clickable:true,enabled:true});
            for(let k=0;k<6&&!products;k++){
              const nodes=cur.root?scan(cur.root):[],drawer=nodes.find(n=>n.visible&&n.scrollable&&n.path.startsWith('0.0.0.0.2'))||nodes.find(n=>n.visible&&n.scrollable);
              if(!drawer)break;
              const sr=await action({action:'scroll',nodeId:drawer.id,direction:k<3?'backward':'forward'});
              timeline.push({step:'scroll_menu_'+(k+1),status:sr&&sr.status});await wait(300);cur=await fresh();
              products=exact(cur.root?scan(cur.root):[],'Productos',{visible:true,clickable:true,enabled:true});
            }
            if(!products){console.log(JSON.stringify({marker,ok:false,stage:'products_button_not_found',timeline,screen:snapshot(cur)}));process.exitCode=2;return;}
            cur=await clickWait(products,'open_products',timeline);await wait(900);cur=await fresh();
            let s=snapshot(cur),nodes=cur.root?scan(cur.root):[],prevHash=null;
            for(let k=0;k<6;k++){
              const scroll=nodes.find(n=>n.visible&&n.scrollable&&n.path.startsWith('0.0.0.0'))||nodes.find(n=>n.visible&&n.scrollable);if(!scroll)break;
              const before=s.hash;if(k>0&&before===prevHash)break;prevHash=before;
              const up=await action({action:'scroll',nodeId:scroll.id,direction:'backward'});timeline.push({step:'scroll_products_top_'+(k+1),status:up&&up.status});await wait(280);cur=await fresh();s=snapshot(cur);nodes=cur.root?scan(cur.root):[];
            }
            for(let k=0;k<7&&(!findSearch(nodes)||!findSearch(nodes).visible);k++){
              const scroll=nodes.find(n=>n.visible&&n.scrollable&&n.path.startsWith('0.0.0.0'))||nodes.find(n=>n.visible&&n.scrollable);
              if(!scroll)break;
              const sr=await action({action:'scroll',nodeId:scroll.id,direction:'forward'});
              timeline.push({step:'scroll_products_to_search_'+(k+1),status:sr&&sr.status});await wait(300);cur=await fresh();s=snapshot(cur);nodes=cur.root?scan(cur.root):[];
            }
            const search=findSearch(nodes);
            if(!search){console.log(JSON.stringify({marker,ok:false,stage:'product_search_input_not_found',timeline,screen:snapshot(cur)}));process.exitCode=3;return;}
            const baseline=snapshot(cur);
            if(baseline.noProductsMarker||baseline.productRowHints===0&&baseline.countDigits.length===0){
              console.log(JSON.stringify({marker,ok:false,stage:'baseline_product_list_unverified',timeline,baseline,safety:{businessWrites:false,productWrites:false,logoutClicked:false}}));process.exitCode=4;return;
            }
            cur=await typeWait(search,needle,'type_no_match_query',timeline);s=snapshot(cur);nodes=cur.root?scan(cur.root):[];
            const filtered={hash:s.hash,nodeCount:s.nodeCount,noResultsMarker:s.noResultsMarker,noProductsMarker:s.noProductsMarker,productRowHints:s.productRowHints,countDigits:s.countDigits};
            let restore= findSearch(nodes);
            if(!restore){
              for(let k=0;k<4&&!restore;k++){const scroll=nodes.find(n=>n.visible&&n.scrollable&&n.path.startsWith('0.0.0.0'))||nodes.find(n=>n.visible&&n.scrollable);if(!scroll)break;await action({action:'scroll',nodeId:scroll.id,direction:'backward'});await wait(300);cur=await fresh();nodes=cur.root?scan(cur.root):[];restore=findSearch(nodes);}
            }
            if(restore){cur=await typeWait(restore,'','clear_search_query',timeline);s=snapshot(cur);nodes=cur.root?scan(cur.root):[];}
            else timeline.push({step:'clear_search_query',status:'input_not_found'});
            const restored=snapshot(cur);
            const result={marker,ok:filtered.noResultsMarker===true&&restored.noResultsMarker===false&&restored.noProductsMarker===false&&restored.searchVisible===true&&!!baseline.hash&&!!filtered.hash&&!!restored.hash,
              build:{version_name:hp.version_name,version_code:hp.version_code,build_id:hp.build_id},
              timeline,baseline:{hash:baseline.hash,nodeCount:baseline.nodeCount,searchVisible:baseline.searchVisible,noResultsMarker:baseline.noResultsMarker,noProductsMarker:baseline.noProductsMarker,productRowHints:baseline.productRowHints,countDigits:baseline.countDigits},
              filtered,restored:{hash:restored.hash,nodeCount:restored.nodeCount,searchVisible:restored.searchVisible,noResultsMarker:restored.noResultsMarker,noProductsMarker:restored.noProductsMarker,productRowHints:restored.productRowHints,countDigits:restored.countDigits},
              safety:{searchIsClientSideOnly:true,businessWrites:false,productWrites:false,purchaseWrites:false,stockMutated:false,logoutClicked:false}};
            console.log(JSON.stringify(result));if(!result.ok)process.exitCode=5;
          })().catch(e=>{console.log(JSON.stringify({marker,ok:false,error:clean(String(e&&e.message||e))}));process.exitCode=1;});
          NODE"""
          metadata={'goal_source':'chat','source_application':'ChatGPT','project_name':'BattleCruiser','source':'battlecruiser_step4_products_search_readonly_v2','verification_marker':marker,'device_id':device,'requested_device_id':device,'operation':'shell.execute','executor_type':'device','requested_capability':'shell.execute','command':command,'risk':'READ','timeout_ms':30000,'target_package':'com.android.chrome','allowed_hosts':['battlecruiser.robvg9.workers.dev'],'read_only':True,'business_data_mutated':False,'explicit_device_intent':True,'human_gate_required':False}
          def post(fn,payload,timeout=75):
              req=urllib.request.Request(base+'/'+fn,data=json.dumps(payload).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read().decode())
                  except:return e.code,{}
          code,body=post('aria-direct-v1',{'goal':'Ejecuta shell.execute en el dispositivo Android explicitado para navegar a BattleCruiser LIVE, abrir Productos, probar únicamente el campo de búsqueda local con un término inventado sin coincidencias y luego vaciarlo. Confirma el marcador de no resultados y restauración del listado. El handler modifica solo el filtro local y no toca Supabase. No enviar formularios ni registrar compras ni alterar stock. Exige agente 1.1.23 exacto. Marcador BC_STEP4_PRODUCTS_SEARCH_READONLY_V2.','mission_id':mission_id,'metadata':metadata})
          print('DISPATCH_HTTP='+str(code));print('MISSION_ID='+mission_id);print('DISPATCH_STATUS='+str(body.get('dispatch',{}).get('status','unknown')))
          if code>=300 or body.get('ok') is not True:print(json.dumps(body)[:1200]);raise SystemExit(2)
          terminal={'succeeded','failed','blocked','rejected','cancelled','human_required','paused'}
          last={}
          for i in range(1,61):
              c,last=post('aria-mission-runner-v22',{'mission_id':mission_id})
              s=str(last.get('status','unknown'));print('POLL='+json.dumps({'n':i,'http':c,'status':s,'error':last.get('error'),'next_action':last.get('next_action')}))
              if s in terminal or c in (401,403,404):break
              time.sleep(3)
          s=str(last.get('status','unknown'));print('FINAL_STATUS='+s);print('FINAL='+json.dumps({k:last.get(k) for k in ('ok','status','mission_id','error','next_action','executor_types','results') if k in last},ensure_ascii=False)[:6000])
          if s!='succeeded':raise SystemExit(1)
          PY
