name: ARIA Windows Runtime Repair

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Checkout ARIA runtime
        uses: actions/checkout@v4

      - name: Sync scripts to official D: runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'agents\windows'
          $runtimeRoot = 'D:\ARIA-Windows-Agent'
          $target = Join-Path $runtimeRoot 'Runtime\windows'
          $logDir = Join-Path $runtimeRoot 'Logs'
          if (-not (Test-Path (Join-Path $source 'run-agent.ps1'))) { throw 'ARIA runtime source missing' }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $target -Recurse -Force
          Write-Host 'ARIA_RUNTIME_SYNC=PASS'
          Write-Host "ARIA_RUNTIME_PATH=$target"
          Write-Host 'NOTE: Task principal remains ROBVG\robvg (required for DPAPI). Config/token stay in D:\ARIA-Windows-Agent\Data.'
          Write-Host 'NOTE: Runner does not retarget Task Scheduler (access denied under NetworkService). Re-run install-v2.ps1 as interactive user if TR must change.'
