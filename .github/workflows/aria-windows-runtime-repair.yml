name: ARIA Windows Runtime Repair

on:
  push:
    branches: [main]
    paths:
      - 'agents/windows/**'
      - 'autonomy/meditation-ia-controller.js'
      - 'autonomy/windows-shell-executor.js'
      - 'computer-use/**'
      - '.github/workflows/aria-windows-runtime-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

jobs:
  repair:
    # Physical maintenance must never execute from an arbitrary PR on a shared Windows runner.
    # It runs only after merge to main or explicit manual dispatch; identity guard still gates the machine.
    if: github.event_name != 'pull_request'
    runs-on: [aria-lacueva-runtime]
    timeout-minutes: 20
    steps:
      - name: Checkout ARIA runtime
        uses: actions/checkout@v4

      - name: Guard physical runner identity before maintenance
        run: |
          $ErrorActionPreference='Stop'
          $configPath='D:\ARIA-Windows-Agent\Data\config.json'
          if(-not(Test-Path $configPath)){throw "LaCueva runner identity guard failed: missing $configPath"}
          $config=Get-Content -Raw -Path $configPath | ConvertFrom-Json
          $expected='windows-lacueva-780886'
          $actual=[string]$config.device_id
          if($actual -ne $expected){throw "WRONG_RUNNER_IDENTITY: expected=$expected actual=$actual. No maintenance will run on this runner."}
          if(-not (Get-CimInstance Win32_ComputerSystem)){throw 'LaCueva runner identity guard failed: hardware probe unavailable'}
          Write-Host "RUNNER_IDENTITY_GUARD=PASS DEVICE_ID=$actual COMPUTERNAME=$env:COMPUTERNAME"

      - name: Safe C cleanup and relocate ARIA caches to D
        run: |
          $ErrorActionPreference = 'Continue'
          $dRoot='D:\ARIA-Windows-Agent\Maintenance'
          New-Item -ItemType Directory -Force -Path $dRoot | Out-Null
          $before=(Get-PSDrive C).Free
          Write-Host "C_FREE_BEFORE_GB=$([math]::Round($before/1GB,2))"
          foreach($p in @("$env:TEMP\*","$env:LOCALAPPDATA\Temp\*","$env:WINDIR\Temp\*","$env:LOCALAPPDATA\Microsoft\Windows\INetCache\*","$env:LOCALAPPDATA\CrashDumps\*","$env:LOCALAPPDATA\D3DSCache\*","C:\Windows\SoftwareDistribution\Download\*","C:\ProgramData\Microsoft\Windows\WER\ReportQueue\*","C:\ProgramData\Microsoft\Windows\WER\ReportArchive\*")){try{Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue}catch{}}
          if(Get-Command Delete-DeliveryOptimizationCache -ErrorAction SilentlyContinue){try{Delete-DeliveryOptimizationCache -Force -ErrorAction SilentlyContinue}catch{}}
          if(Get-Command Clear-RecycleBin -ErrorAction SilentlyContinue){try{Clear-RecycleBin -Force -ErrorAction SilentlyContinue}catch{}}
          if(Get-Command npm.cmd -ErrorAction SilentlyContinue){try{npm.cmd cache clean --force | Out-Host}catch{}}
          if(Get-Command pip.exe -ErrorAction SilentlyContinue){try{pip.exe cache purge | Out-Host}catch{}}
          $ollama=Join-Path $env:USERPROFILE '.ollama\models';$ollamaD=Join-Path $dRoot 'ollama-models'
          if(Test-Path $ollama -PathType Container){try{$it=Get-Item $ollama -Force;if(-not($it.Attributes -band [IO.FileAttributes]::ReparsePoint)){if(Test-Path $ollamaD){Remove-Item $ollamaD -Recurse -Force -ErrorAction SilentlyContinue};New-Item -ItemType Directory -Force -Path (Split-Path $ollamaD)|Out-Null;Get-Process -Name ollama -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue;Move-Item -LiteralPath $ollama -Destination $ollamaD -Force;New-Item -ItemType Junction -Path $ollama -Target $ollamaD|Out-Null;Write-Host "OLLAMA_MODELS_RELOCATED=True TARGET=$ollamaD"}else{Write-Host 'OLLAMA_MODELS_ALREADY_RELOCATED=True'}}catch{Write-Warning "OLLAMA_RELOCATE_FAILED=$($_.Exception.Message)"}}
          if(Get-Command dism.exe -ErrorAction SilentlyContinue){try{dism.exe /Online /Cleanup-Image /StartComponentCleanup /Quiet|Out-Host;if($LASTEXITCODE -ne 0){Write-Warning "DISM_OPTIONAL_CLEANUP_SKIPPED_EXIT=$LASTEXITCODE";$global:LASTEXITCODE=0}}catch{Write-Warning "DISM_OPTIONAL_CLEANUP_SKIPPED=$($_.Exception.Message)";$global:LASTEXITCODE=0}}
          $after=(Get-PSDrive C).Free
          Write-Host "C_FREE_AFTER_GB=$([math]::Round($after/1GB,2))"
          Write-Host "C_FREED_GB=$([math]::Round(($after-$before)/1GB,2))"
          Write-Host 'ARIA_CLEANUP=PASS'

      - name: Sync Meditation IA runtime surface and reload Agent when changed
        run: |
          $ErrorActionPreference='Stop'
          $srcCore=Join-Path $env:GITHUB_WORKSPACE 'autonomy\meditation-ia-controller.js'
          $srcController=Join-Path $env:GITHUB_WORKSPACE 'agents\windows\aria-meditation-controller.js'
          $srcUi=Join-Path $env:GITHUB_WORKSPACE 'agents\windows\aria-meditation-ui.ps1'
          $dstCore='D:\ARIA-Windows-Agent\autonomy\meditation-ia-controller.js'
          $dstController='D:\ARIA-Windows-Agent\Runtime\windows\aria-meditation-controller.js'
          $dstUi='D:\ARIA-Windows-Agent\Runtime\windows\aria-meditation-ui.ps1'
          if(-not(Test-Path $srcCore)){throw 'Meditation core source missing'}
          if(-not(Test-Path $srcController)){throw 'Meditation controller source missing'}
          if(-not(Test-Path $srcUi)){throw 'Meditation UI source missing'}
          New-Item -ItemType Directory -Force -Path (Split-Path $dstCore),(Split-Path $dstController),(Split-Path $dstUi)|Out-Null
          $coreChanged=$true;$controllerChanged=$true;$uiChanged=$true
          if(Test-Path $dstCore){$coreChanged=((Get-FileHash $srcCore -Algorithm SHA256).Hash -ne (Get-FileHash $dstCore -Algorithm SHA256).Hash)}
          if(Test-Path $dstController){$controllerChanged=((Get-FileHash $srcController -Algorithm SHA256).Hash -ne (Get-FileHash $dstController -Algorithm SHA256).Hash)}
          if(Test-Path $dstUi){$uiChanged=((Get-FileHash $srcUi -Algorithm SHA256).Hash -ne (Get-FileHash $dstUi -Algorithm SHA256).Hash)}
          Write-Host "MEDITATION_CORE_CHANGED=$coreChanged"
          Write-Host "MEDITATION_CONTROLLER_CHANGED=$controllerChanged"
          Write-Host "MEDITATION_UI_CHANGED=$uiChanged"
          if($coreChanged){Copy-Item -LiteralPath $srcCore -Destination $dstCore -Force}
          if($controllerChanged){Copy-Item -LiteralPath $srcController -Destination $dstController -Force}
          if($uiChanged){Copy-Item -LiteralPath $srcUi -Destination $dstUi -Force}
          if(-not($coreChanged -or $controllerChanged -or $uiChanged)){Write-Host 'MEDITATION_RUNTIME_SYNC=UNCHANGED'; exit 0}
          $ap='D:\ARIA-Windows-Agent\Logs\agent.pid';$agentPid=0
          if(Test-Path $ap){[void][int]::TryParse((Get-Content -Raw $ap).Trim(),[ref]$agentPid)}
          if($agentPid -gt 0){$proc=Get-Process -Id $agentPid -ErrorAction SilentlyContinue;if($null -ne $proc){Write-Host "MEDITATION_AGENT_RELOAD_PID=$agentPid";Stop-Process -Id $agentPid -Force}}
          Start-Sleep -Seconds 2
          $launcher='D:\ARIA-Windows-Agent\Runtime\windows\run-agent.ps1'
          if(-not(Test-Path $launcher)){throw 'Agent launcher missing after runtime sync'}
          Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',$launcher -WindowStyle Hidden
          $ok=$false
          for($i=0;$i-lt30;$i++){
            Start-Sleep -Seconds 1
            try{
              $h=Invoke-RestMethod -Method Get -Uri 'http://127.0.0.1:45873/health' -TimeoutSec 2
              if($h.service -eq 'aria-meditation-control' -and [string]$h.version -eq 'aria-windows-meditation-controller-v3'){$ok=$true;break}
            }catch{}
          }
          if(-not$ok){throw 'Meditation controller did not reload with v2 surface'}
          Write-Host 'MEDITATION_RUNTIME_SYNC=PASS'
          Write-Host 'MEDITATION_CONTROLLER_RELOAD=PASS'

      - name: Sync Windows agent and autonomous RWHT runtime
        run: |
          $ErrorActionPreference='Stop'
          $srcAgent=Join-Path $env:GITHUB_WORKSPACE 'agents\windows\aria-agent.js'
          $srcRwht=Join-Path $env:GITHUB_WORKSPACE 'agents\windows\autonomous-rwht-controller.js'
          $srcShell=Join-Path $env:GITHUB_WORKSPACE 'autonomy\windows-shell-executor.js'
          $srcProfile=Join-Path $env:GITHUB_WORKSPACE 'agents\windows\resource-profile.js'
          $dstAgent='D:\ARIA-Windows-Agent\Runtime\windows\aria-agent.js'
          $dstRwht='D:\ARIA-Windows-Agent\Runtime\windows\autonomous-rwht-controller.js'
          $dstShell='D:\ARIA-Windows-Agent\Runtime\windows\windows-shell-executor.js'
          $dstProfile='D:\ARIA-Windows-Agent\Runtime\windows\resource-profile.js'
          foreach($p in @($srcAgent,$srcRwht,$srcShell,$srcProfile)){if(-not(Test-Path $p)){throw "Windows runtime source missing: $p"}}
          New-Item -ItemType Directory -Force -Path (Split-Path $dstAgent),(Split-Path $dstRwht)|Out-Null
          $agentChanged=$true;$rwhtChanged=$true;$shellChanged=$true;$profileChanged=$true
          if(Test-Path $dstAgent){$agentChanged=((Get-FileHash $srcAgent -Algorithm SHA256).Hash -ne (Get-FileHash $dstAgent -Algorithm SHA256).Hash)}
          if(Test-Path $dstRwht){$rwhtChanged=((Get-FileHash $srcRwht -Algorithm SHA256).Hash -ne (Get-FileHash $dstRwht -Algorithm SHA256).Hash)}
          if(Test-Path $dstShell){$shellChanged=((Get-FileHash $srcShell -Algorithm SHA256).Hash -ne (Get-FileHash $dstShell -Algorithm SHA256).Hash)}
          if(Test-Path $dstProfile){$profileChanged=((Get-FileHash $srcProfile -Algorithm SHA256).Hash -ne (Get-FileHash $dstProfile -Algorithm SHA256).Hash)}
          Write-Host "WINDOWS_AGENT_CHANGED=$agentChanged"
          Write-Host "WINDOWS_RWHT_CONTROLLER_CHANGED=$rwhtChanged"
          Write-Host "WINDOWS_SHELL_EXECUTOR_CHANGED=$shellChanged"
          Write-Host "WINDOWS_RESOURCE_PROFILE_CHANGED=$profileChanged"
          if($agentChanged){Copy-Item -LiteralPath $srcAgent -Destination $dstAgent -Force}
          if($rwhtChanged){Copy-Item -LiteralPath $srcRwht -Destination $dstRwht -Force}
          if($shellChanged){Copy-Item -LiteralPath $srcShell -Destination $dstShell -Force}
          if($profileChanged){Copy-Item -LiteralPath $srcProfile -Destination $dstProfile -Force}
          & node --check $dstAgent
          if($LASTEXITCODE -ne 0){throw 'Windows agent syntax check failed'}
          & node --check $dstRwht
          if($LASTEXITCODE -ne 0){throw 'Autonomous RWHT controller syntax check failed'}
          & node --check $dstShell
          if($LASTEXITCODE -ne 0){throw 'Windows shell executor syntax check failed'}
          & node --check $dstProfile
          if($LASTEXITCODE -ne 0){throw 'Windows resource profile syntax check failed'}
          $needsReload=$agentChanged -or $rwhtChanged -or $shellChanged -or $profileChanged
          if(-not $needsReload){Write-Host 'WINDOWS_AUTONOMOUS_RWHT_RUNTIME_SYNC=UNCHANGED';exit 0}
          $ap='D:\ARIA-Windows-Agent\Logs\agent.pid';$agentPidReload=0
          if(Test-Path $ap){[void][int]::TryParse((Get-Content -Raw $ap).Trim(),[ref]$agentPidReload)}
          if($agentPidReload -gt 0){$proc=Get-Process -Id $agentPidReload -ErrorAction SilentlyContinue;if($null -ne $proc){Write-Host "WINDOWS_AGENT_RELOAD_PID=$agentPidReload";try{Stop-Process -Id $agentPidReload -Force -ErrorAction Stop;Start-Sleep -Seconds 2}catch{Write-Warning "WINDOWS_AGENT_STOP_PROCESS_FAILED=$($_.Exception.Message)"}}}
$still=if($agentPidReload -gt 0){Get-Process -Id $agentPidReload -ErrorAction SilentlyContinue}else{$null}
if($null -ne $still){
  Write-Host "WINDOWS_AGENT_PROCESS_STILL_RUNNING=$agentPidReload"
  try{& sc.exe stop 'ARIA-WINDOWS' | Out-Host;Start-Sleep -Seconds 3}catch{Write-Warning "ARIA_WINDOWS_SERVICE_STOP_FAILED=$($_.Exception.Message)"}
}

          Start-Sleep -Seconds 2
          $launcher='D:\ARIA-Windows-Agent\Runtime\windows\run-agent.ps1'
          if(-not(Test-Path $launcher)){throw 'Agent launcher missing after autonomous RWHT sync'}
          Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',$launcher -WindowStyle Hidden
          $ok=$false
          for($i=0;$i-lt30;$i++){
            Start-Sleep -Seconds 1
            $pidNow=0
            if(Test-Path $ap){[void][int]::TryParse((Get-Content -Raw $ap).Trim(),[ref]$pidNow)}
            if($pidNow -gt 0){
              $procNow=Get-Process -Id $pidNow -ErrorAction SilentlyContinue
              if($null -ne $procNow){$ok=$true;break}
            }
          }
          if(-not $ok){throw 'Windows agent did not reload after autonomous RWHT sync'}
          $agentSource=Get-Content -Raw $dstAgent
          $rwhtSource=Get-Content -Raw $dstRwht
          if($agentSource -notmatch 'computer\.use\.autonomous'){throw 'Reloaded Windows agent missing autonomous computer-use operation'}
          if($rwhtSource -notmatch 'aria-windows-autonomous-rwht-v1\.2\.3'){throw 'Reloaded RWHT controller v1.2.2 marker missing'}
          Write-Host 'WINDOWS_AUTONOMOUS_RWHT_RUNTIME_SYNC=PASS'
          Write-Host "WINDOWS_AGENT_PID=$pidNow"

      - name: Sync Computer Use runtime to D and reload Agent when changed
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'computer-use'
          $dst='D:\ARIA-Windows-Agent\Runtime\windows'
          if(-not(Test-Path $src)){throw 'computer-use source missing'}
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $changedAny=$false
          foreach($f in (Get-ChildItem -LiteralPath $src -File)){
            $target=Join-Path $dst $f.Name
            $changed=$true
            if(Test-Path $target){
              $changed=((Get-FileHash $f.FullName -Algorithm SHA256).Hash -ne (Get-FileHash $target -Algorithm SHA256).Hash)
            }
            if($changed){
              Copy-Item -LiteralPath $f.FullName -Destination $target -Force
              Write-Host "COMPUTER_USE_SYNC=$($f.Name)"
              $changedAny=$true
            }
          }
          foreach($f in (Get-ChildItem -LiteralPath $src -Filter '*.js' -File)){
            & node --check $f.FullName
            if($LASTEXITCODE -ne 0){throw "computer-use syntax failed: $($f.Name)"}
          }
          Write-Host "COMPUTER_USE_RUNTIME_CHANGED=$changedAny"
          if(-not $changedAny){
            Write-Host 'COMPUTER_USE_RUNTIME_SYNC=UNCHANGED'
            exit 0
          }

          $ap='D:\ARIA-Windows-Agent\Logs\agent.pid'
          $agentPid=0
          if(Test-Path $ap){[void][int]::TryParse((Get-Content -Raw $ap).Trim(),[ref]$agentPid)}
          if($agentPid -gt 0){
            $proc=Get-Process -Id $agentPid -ErrorAction SilentlyContinue
            if($null -ne $proc){
              Write-Host "COMPUTER_USE_AGENT_RELOAD_PID=$agentPid"
              Stop-Process -Id $agentPid -Force -ErrorAction SilentlyContinue
            }
          }

          $ok=$false
          for($i=0;$i-lt30;$i++){
            Start-Sleep -Seconds 1
            $pidNow=0
            if(Test-Path $ap){[void][int]::TryParse((Get-Content -Raw $ap).Trim(),[ref]$pidNow)}
            if($pidNow -gt 0 -and $pidNow -ne $agentPid){
              $procNow=Get-Process -Id $pidNow -ErrorAction SilentlyContinue
              if($null -ne $procNow){$ok=$true;break}
            }
          }
          if(-not $ok){throw 'Windows agent did not reload after computer-use runtime sync'}
          Write-Host 'COMPUTER_USE_RUNTIME_SYNC=PASS'
          Write-Host "COMPUTER_USE_AGENT_RELOAD_NEW_PID=$pidNow"

      - name: Ensure interactive GitHub runner autostart
        run: |
          $ErrorActionPreference='Stop'
          $runnerRoot='C:\actions-runner-lacueva'
          $runCmd=Join-Path $runnerRoot 'run.cmd'
          if(-not(Test-Path $runCmd)){throw "LaCueva runner executable missing: $runCmd"}
          $startup=[Environment]::GetFolderPath('Startup')
          $shortcutPath=Join-Path $startup 'ARIA-LACUEVA-Runner.lnk'
          $shell=New-Object -ComObject WScript.Shell
          $shortcut=$shell.CreateShortcut($shortcutPath)
          $shortcut.TargetPath=$runCmd
          $shortcut.WorkingDirectory=$runnerRoot
          $shortcut.WindowStyle=1
          $shortcut.Description='ARIA LaCueva interactive GitHub Actions runner autostart'
          $shortcut.Save()
          Write-Host "ARIA_LACUEVA_RUNNER_AUTOSTART=PASS"
          Write-Host "ARIA_LACUEVA_RUNNER_STARTUP=$shortcutPath"

      - name: Enforce singleton Agent and singleton watchdog without restart
        run: |
          $ErrorActionPreference='Continue'
          $wp='D:\ARIA-Windows-Agent\Logs\watchdog.pid';$ap='D:\ARIA-Windows-Agent\Logs\agent.pid';$keepW=0;$keepA=0
          if(Test-Path $wp){[void][int]::TryParse((Get-Content -Raw $wp).Trim(),[ref]$keepW)}
          if(Test-Path $ap){[void][int]::TryParse((Get-Content -Raw $ap).Trim(),[ref]$keepA)}
          $watchdogs=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue|Where-Object{$_.Name-match'^powershell(\.exe)?$'-and[string]$_.CommandLine-match'(?i)run-agent\.ps1'})
          $agents=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue|Where-Object{$_.Name-match'^node(\.exe)?$'-and[string]$_.CommandLine-match'(?i)aria-agent\.js'})
          Write-Host "WATCHDOGS_BEFORE=$($watchdogs.Count) KEEP_W=$keepW AGENTS_BEFORE=$($agents.Count) KEEP_A=$keepA"
          foreach($p in $watchdogs){if([int]$p.ProcessId-ne$keepW){Write-Host "STOP_DUPLICATE_WATCHDOG=$($p.ProcessId)";Stop-Process -Id ([int]$p.ProcessId)-Force-ErrorAction SilentlyContinue}}
          foreach($p in $agents){if([int]$p.ProcessId-ne$keepA){Write-Host "STOP_DUPLICATE_AGENT=$($p.ProcessId)";Stop-Process -Id ([int]$p.ProcessId)-Force-ErrorAction SilentlyContinue}}
          Start-Sleep -Seconds 2
          $lock='D:\ARIA-Windows-Agent\Runtime\meditation\controller.lock'
          if(Test-Path $lock){$lp=0;try{$j=Get-Content -Raw $lock|ConvertFrom-Json;$lp=[int]$j.pid}catch{};$q=$null;if($lp-gt0){$q=Get-CimInstance Win32_Process -Filter "ProcessId = $lp" -ErrorAction SilentlyContinue};if($null-eq$q -or $lp-eq$keepA){Remove-Item -LiteralPath $lock -Force -ErrorAction SilentlyContinue;Write-Host "MEDITATION_LOCK_CLEARED_PID=$lp"}else{Write-Host "MEDITATION_LOCK_OWNER_PID=$lp"}}
          Write-Host 'ARIA_SINGLETON_REPAIR=PASS'

      - name: Ensure Meditation IA endpoint online and activate
        run: |
          $ErrorActionPreference='Stop'
          $u='http://127.0.0.1:45873/status';$start='http://127.0.0.1:45873/start';$s=$null
          try{$s=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5}catch{}
          if($null-eq$s){$agent='D:\ARIA-Windows-Agent\Runtime\windows\run-agent.ps1';if(-not(Test-Path $agent)){throw 'Agent launcher missing'};Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',$agent -WindowStyle Hidden;for($i=0;$i-lt30;$i++){Start-Sleep 1;try{$s=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 2;if($null-ne$s){break}}catch{}}}
          if($null-eq$s){throw 'Meditation endpoint offline'}
          if($s.mode-ne'active'){$r=Invoke-RestMethod -Method Post -Uri $start -TimeoutSec 10;Start-Sleep 3;$s=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5;Write-Host ("MEDITATION_ACTIVATE status={0} mode={1} session={2} tick={3}"-f$r.status,$s.mode,$s.session_id,$s.tick_count)}else{Write-Host "MEDITATION_ALREADY_ACTIVE session=$($s.session_id)"}
          if($s.mode-ne'active'){throw "Meditation IA activation failed mode=$($s.mode)"}
          Write-Host 'MEDITATION_ACTIVATION=PASS'

      - name: Verify continuity heartbeat and C space
        run: |
          $ErrorActionPreference='Stop'
          $u='http://127.0.0.1:45873/status';$a=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5
          if($a.mode-ne'active'){throw "Mode not active: $($a.mode)"}
          $t=[int]$a.tick_count;Start-Sleep -Seconds 12;$b=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5
          $c=(Get-PSDrive C).Free
          Write-Host "MEDITATION_TICKS_INITIAL=$t MEDITATION_TICKS_FINAL=$($b.tick_count) MODE=$($b.mode)"
          Write-Host "C_FREE_FINAL_GB=$([math]::Round($c/1GB,2))"
          if($b.mode-ne'active'){throw "Meditation stopped: $($b.mode)"}
          if([int]$b.tick_count-lt$t){throw 'Tick counter regressed'}
          Write-Host 'MEDITATION_HEARTBEAT=PASS'
          Write-Host 'ARIA_WINDOWS_REPAIR=PASS'


// Windows runtime repair post-merge certification marker 2026-10-05.
