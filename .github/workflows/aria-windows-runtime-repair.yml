name: ARIA Windows Runtime Repair

on:
  push:
    branches: [main]
    paths:
      - 'agents/windows/**'
      - 'autonomy/windows-shell-executor.js'
      - 'computer-use/**'
      - '.github/workflows/aria-windows-runtime-repair.yml'
  pull_request:
    paths:
      - 'agents/windows/**'
      - 'autonomy/windows-shell-executor.js'
      - 'computer-use/**'
      - '.github/workflows/aria-windows-runtime-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout ARIA runtime
        uses: actions/checkout@v4

      - name: Free C drive safely and relocate ARIA/npm cache to D drive
        run: |
          $ErrorActionPreference = 'Continue'
          $dRoot = 'D:\ARIA-Windows-Agent\Maintenance'
          New-Item -ItemType Directory -Force -Path $dRoot | Out-Null
          $before = Get-PSDrive -Name C
          Write-Host "C_FREE_BEFORE_GB=$([math]::Round($before.Free/1GB,2))"
          $cleanupRoots = @($env:TEMP, "$env:LOCALAPPDATA\Temp", "$env:WINDIR\Temp") | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($root in $cleanupRoots) { try { Get-ChildItem -LiteralPath $root -Force -ErrorAction SilentlyContinue | ForEach-Object { try { Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction SilentlyContinue } catch {} } } catch {} }
          foreach ($p in @("$env:LOCALAPPDATA\Microsoft\Windows\INetCache\*","$env:LOCALAPPDATA\CrashDumps\*","$env:LOCALAPPDATA\D3DSCache\*","$env:LOCALAPPDATA\NVIDIA\DXCache\*","$env:LOCALAPPDATA\NVIDIA\GLCache\*")) { try { Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue } catch {} }
          if (Get-Command Clear-RecycleBin -ErrorAction SilentlyContinue) { try { Clear-RecycleBin -Force -ErrorAction SilentlyContinue } catch {} }
          if (Get-Command npm.cmd -ErrorAction SilentlyContinue) { try { npm.cmd cache verify | Out-Host; npm.cmd cache clean --force | Out-Host } catch {} }
          if (Get-Command pip.exe -ErrorAction SilentlyContinue) { try { pip.exe cache purge | Out-Host } catch {} }
          $npmCache = "$env:LOCALAPPDATA\npm-cache"
          $npmCacheD = 'D:\ARIA-Windows-Agent\Maintenance\npm-cache'
          if (Test-Path $npmCache -PathType Container) { try { $item = Get-Item $npmCache -Force; if (-not ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { if (Test-Path $npmCacheD) { Remove-Item $npmCacheD -Recurse -Force -ErrorAction SilentlyContinue }; New-Item -ItemType Directory -Force -Path (Split-Path $npmCacheD) | Out-Null; Move-Item -LiteralPath $npmCache -Destination $npmCacheD -Force; New-Item -ItemType Junction -Path $npmCache -Target $npmCacheD | Out-Null; Write-Host "NPM_CACHE_RELOCATED=True TARGET=$npmCacheD" } else { Write-Host 'NPM_CACHE_ALREADY_RELOCATED=True' } } catch { Write-Warning "NPM_CACHE_RELOCATION_FAILED $($_.Exception.Message)" } }
          $after = Get-PSDrive -Name C
          Write-Host "C_FREE_AFTER_GB=$([math]::Round($after.Free/1GB,2))"
          Write-Host "C_FREED_GB=$([math]::Round(($after.Free-$before.Free)/1GB,2))"
          Write-Host 'ARIA_CLEANUP=PASS'

      - name: Sync complete runtime to official D drive
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'agents\windows'
          $repoRoot = $env:GITHUB_WORKSPACE
          $runtimeRoot = 'D:\ARIA-Windows-Agent'
          $target = Join-Path $runtimeRoot 'Runtime\windows'
          $logDir = Join-Path $runtimeRoot 'Logs'
          $computerUse = Join-Path $repoRoot 'computer-use'
          $canonical = Join-Path $repoRoot 'autonomy\windows-shell-executor.js'
          foreach ($path in @($source,$canonical,$computerUse)) { if (-not (Test-Path $path)) { throw "Required source missing: $path" } }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          Copy-Item -Path (Join-Path $source 'aria-agent.js') -Destination $target -Force
          Copy-Item -Path (Join-Path $source 'run-agent.ps1') -Destination $target -Force
          Copy-Item -Path $canonical -Destination (Join-Path $target 'windows-shell-executor.js') -Force
          foreach ($file in @('windows-desktop-adapter.js','windows-desktop-runner.ps1','windows-ui-automation.ps1','windows-hotkey-runner.ps1')) { Copy-Item -Path (Join-Path $computerUse $file) -Destination $target -Force }
          Write-Host 'ARIA_RUNTIME_SYNC=PASS'

      - name: Verify runtime syntax
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'D:\ARIA-Windows-Agent\Runtime\windows'
          node --check (Join-Path $target 'aria-agent.js')
          node --check (Join-Path $target 'windows-shell-executor.js')
          node --check (Join-Path $target 'windows-desktop-adapter.js')
          $agent = Get-Content -Raw (Join-Path $target 'aria-agent.js')
          if (-not ($agent -like "*'shell.execute'*")) { throw 'shell.execute missing from runtime agent' }
          if (-not ($agent -like "*'computer.use'*")) { throw 'computer.use missing from runtime agent' }
          $desktop = Get-Content -Raw (Join-Path $target 'windows-desktop-adapter.js')
          if (-not ($desktop -like '*aria-windows-desktop-v1.9*')) { throw 'desktop adapter v1.9 missing from runtime' }
          if (-not (Test-Path (Join-Path $target 'windows-hotkey-runner.ps1'))) { throw 'hotkey runner missing from runtime' }
          Write-Host 'ARIA_RUNTIME_SYNTAX=PASS'

      - name: Request watchdog reload through public signal
        run: |
          $ErrorActionPreference = 'Stop'
          $logDir = 'D:\ARIA-Windows-Agent\Logs'
          $pidPath = Join-Path $logDir 'agent.pid'
          $killRequest = Join-Path $logDir 'kill-request'
          $logPath = Join-Path $logDir 'watchdog.log'
          if (-not (Test-Path $pidPath)) { throw 'agent.pid missing; local agent must be installed first' }
          $oldPid = 0
          if (-not [int]::TryParse((Get-Content -Raw $pidPath).Trim(), [ref]$oldPid) -or $oldPid -le 0) { throw 'Invalid agent.pid' }
          Set-Content -Path $killRequest -Value "pid=$oldPid from=runtime-repair ts=$(Get-Date -Format o)" -Encoding ASCII -Force
          $newPid = $null
          for ($i = 0; $i -lt 45; $i++) { Start-Sleep -Seconds 2; if (-not (Test-Path $pidPath)) { continue }; $cand = 0; if (-not [int]::TryParse((Get-Content -Raw $pidPath).Trim(), [ref]$cand)) { continue }; if ($cand -le 0 -or $cand -eq $oldPid) { continue }; $p = Get-Process -Id $cand -ErrorAction SilentlyContinue; if ($p -and $p.ProcessName -match 'node') { $newPid = $cand; break } }
          if (-not $newPid) { if (Test-Path $logPath) { Get-Content $logPath -Tail 50 }; throw 'Watchdog did not restart agent after public signal' }
          Write-Host "ARIA_AGENT_RESTART=PASS NEW_PID=$newPid"

      - name: Ensure Meditation IA control endpoint is online and activate
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'http://127.0.0.1:45873/status'
          $startUri = 'http://127.0.0.1:45873/start'
          $online = $false
          try { $s = Invoke-RestMethod -Method Get -Uri $uri -TimeoutSec 3; if ($s) { $online = $true } } catch {}
          if (-not $online) {
            $scripts = @('D:\ARIA-Windows-Agent\Runtime\scripts\start-meditation-ia.ps1','D:\ARIA-Windows-Agent\Runtime\start-meditation-ia.ps1','D:\ARIA-Windows-Agent\start-meditation-ia.ps1') | Where-Object { Test-Path $_ }
            if ($scripts.Count -gt 0) { $script = $scripts[0]; Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',$script -WorkingDirectory (Split-Path $script) -WindowStyle Hidden; Start-Sleep -Seconds 5 }
          }
          try { $s = Invoke-RestMethod -Method Get -Uri $uri -TimeoutSec 5 } catch { throw 'Meditation IA control endpoint offline after repair attempt' }
          $start = Invoke-RestMethod -Method Post -Uri $startUri -TimeoutSec 10
          Start-Sleep -Seconds 2
          $final = Invoke-RestMethod -Method Get -Uri $uri -TimeoutSec 5
          Write-Host ("MEDITATION_ACTIVATE status={0} mode={1} session={2}" -f $start.status,$final.mode,$final.session_id)
          if ($final.mode -ne 'active') { throw "Meditation IA activation failed: mode=$($final.mode)" }
          Write-Host 'MEDITATION_ENDPOINT=PASS'

      - name: Physical desktop autonomy E2E
        id: physical_e2e
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          node (Join-Path $env:GITHUB_WORKSPACE 'tests\windows-desktop-physical-e2e.js')
          if ($LASTEXITCODE -ne 0) { throw "Physical desktop E2E failed with exit code $LASTEXITCODE" }
          Write-Host 'ARIA_DESKTOP_PHYSICAL_E2E=PASS'

      - name: Publish physical E2E proof
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.physical_e2e.outcome }}
        run: |
          $ErrorActionPreference = 'Continue'
          $proofDir = Join-Path $env:GITHUB_WORKSPACE 'reports'
          $proofPath = Join-Path $proofDir 'windows-desktop-physical-e2e-status.json'
          New-Item -ItemType Directory -Force -Path $proofDir | Out-Null
          [ordered]@{ commit=$env:GITHUB_SHA; workflow='ARIA Windows Runtime Repair'; outcome=$env:E2E_OUTCOME; timestamp=(Get-Date -Format o); adapter='aria-windows-desktop-v1.9'; physical_agent='windows-fe722cc6681e4f9c9cc35f5ebbb0a089' } | ConvertTo-Json -Depth 6 | Set-Content -Path $proofPath -Encoding UTF8
          Write-Host "ARIA_PHYSICAL_E2E_PROOF=$proofPath outcome=$env:E2E_OUTCOME"

      - name: Fail when physical desktop E2E is not green
        if: steps.physical_e2e.outcome != 'success'
        run: throw 'ARIA_DESKTOP_PHYSICAL_E2E was not GREEN'

      - name: Verify runtime publication
        run: |
          $ErrorActionPreference = 'Stop'
          $status = 'D:\ARIA-Windows-Agent\Logs\status.json'
          $log = 'D:\ARIA-Windows-Agent\Logs\watchdog.log'
          if (Test-Path $status) { Get-Content -Raw $status }
          if (Test-Path $log) { $tail = Get-Content $log -Tail 30 | Out-String; if ($tail -match 'NoNewWindow') { throw 'Old watchdog failure still present' } }
          Write-Host 'ARIA_RUNTIME_REPAIR=PASS'
