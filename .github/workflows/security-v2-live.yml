name: ARIA Security 2.0 CONTRACT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full regression suite
        run: npm test
      - name: Security 2.0 contract certification
        run: node tests/security-v2.test.js
      - name: Emit contract marker
        run: echo ARIA_SECURITY_2_CONTRACT_OK
