name: A6 apply Realtek Ethernet power-saving correction

on:
  push:
    branches:
      - ops/a6-windows-agent-v2-heartbeat-preflight-v1
    paths:
      - '.github/workflows/a6-apply-realtek-power-saving-fix.yml'

permissions:
  contents: read

concurrency:
  group: a6-apply-realtek-power-saving-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.head_commit.message == 'ops(A6): disable Realtek Ethernet PowerSavingMode'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Apply only the evidence-backed NIC correction
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ine 'ROBVG') { throw "HOST_MISMATCH=$env:COMPUTERNAME" }

          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "RUN_ACCOUNT=$($identity.Name)"
          Write-Host "RUN_AS_ADMIN=$isAdmin"

          $adapter = Get-NetAdapter -Name 'Ethernet' -ErrorAction Stop
          if ($adapter.InterfaceDescription -ne 'Realtek PCIe FE Family Controller') {
            throw "ADAPTER_MISMATCH=$($adapter.InterfaceDescription)"
          }
          $property = Get-NetAdapterAdvancedProperty -Name 'Ethernet' -RegistryKeyword 'PowerSavingMode' -AllProperties -ErrorAction Stop
          $before = [string]$property.RegistryValue[0]
          if ($before -notin @('0','1')) { throw "UNEXPECTED_POWER_SAVING_VALUE=$before" }
          if ($property.ValidRegistryValues -notcontains '0') { throw 'DISABLED_VALUE_NOT_SUPPORTED' }

          $logDir = 'D:\ARIA-Windows-Agent\Logs'
          $evidencePath = Join-Path $logDir 'a6-realtek-power-saving-fix.json'
          $result = [ordered]@{
            host = [string]$env:COMPUTERNAME
            adapter = [string]$adapter.InterfaceDescription
            interface_alias = [string]$adapter.Name
            interface_index = [int]$adapter.ifIndex
            driver_version = [string]$adapter.DriverVersion
            registry_keyword = 'PowerSavingMode'
            before_registry_value = $before
            before_display_value = [string]$property.DisplayValue
            after_registry_value = $null
            status = 'BLOCKED'
            reason = $null
            changed_at_utc = [DateTimeOffset]::UtcNow.ToString('o')
          }

          if (-not $isAdmin) {
            $result.reason = 'RUNNER_NOT_ELEVATED; no NIC settings changed'
            $result | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $env:TEMP 'a6-realtek-power-saving-fix.json') -Encoding UTF8
            Write-Host 'A6_NIC_FIX=HUMAN_GATE_REQUIRED'
            exit 0
          }

          if ($before -eq '1') {
            Set-NetAdapterAdvancedProperty -Name 'Ethernet' -RegistryKeyword 'PowerSavingMode' -RegistryValue '0' -NoRestart -Confirm:$false -ErrorAction Stop
          }

          $afterProperty = Get-NetAdapterAdvancedProperty -Name 'Ethernet' -RegistryKeyword 'PowerSavingMode' -AllProperties -ErrorAction Stop
          $after = [string]$afterProperty.RegistryValue[0]
          if ($after -ne '0') { throw "POWER_SAVING_NOT_DISABLED=$after" }

          if ($before -eq '1') {
            Restart-NetAdapter -Name 'Ethernet' -Confirm:$false -ErrorAction Stop
            Start-Sleep -Seconds 8
          }

          $adapterAfter = Get-NetAdapter -Name 'Ethernet' -ErrorAction Stop
          $routeAfter = @(Get-NetRoute -DestinationPrefix '0.0.0.0/0' -ErrorAction Stop | Where-Object { $_.InterfaceAlias -eq 'Ethernet' })
          if ($adapterAfter.Status -ne 'Up') { throw "ETHERNET_NOT_UP=$($adapterAfter.Status)" }
          if ($routeAfter.Count -eq 0) { throw 'DEFAULT_ROUTE_NOT_RESTORED_ON_ETHERNET' }

          $result.after_registry_value = $after
          $result.after_display_value = [string]$afterProperty.DisplayValue
          $result.after_status = [string]$adapterAfter.Status
          $result.default_route_restored = $true
          $result.status = 'PASS'
          $result.reason = if ($before -eq '1') { 'PowerSavingMode disabled and Ethernet restarted successfully' } else { 'PowerSavingMode was already disabled; verified only' }
          $result.completed_at_utc = [DateTimeOffset]::UtcNow.ToString('o')

          $result | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $evidencePath -Encoding UTF8
          Write-Host "A6_NIC_POWER_SAVING_BEFORE=$before"
          Write-Host "A6_NIC_POWER_SAVING_AFTER=$after"
          Write-Host "A6_NIC_STATUS=$($adapterAfter.Status)"
          Write-Host 'A6_NIC_FIX=PASS'
