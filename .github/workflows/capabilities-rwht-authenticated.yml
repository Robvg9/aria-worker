name: ARIA Capabilities Browser RWHT Authenticated

on:
  push:
    branches:
      - main
    paths:
      - 'pwa/**'
      # Worker-only releases still change the versioned PWA shell and must have a same-SHA capability predecessor.
      - 'worker.js'
      - 'wrangler.toml'
      - '.github/workflows/aria-cloudflare-deploy.yml'
      - '.github/workflows/aria-pwa-fast-deploy.yml'
      - '.github/workflows/aria-scheduler-transport-deploy.yml'
      # Keep the authenticated capability E2E in the exact-SHA release gate for API fixes.
      - 'supabase/functions/aria-app-api-v3/**'
      - 'supabase/functions/aria-planner-v11/**'
      - 'supabase/functions/aria-mission-runner-v22/**'
      - 'supabase/functions/_shared/physical-execution-contract.mjs'
      - 'rwht/pc-browser/rwht-pc-browser.mjs'
      - 'tests/pc-rwht-browser.test.js'
      - 'rwht/pc-browser/rwht-meditation-pwa-e2e.mjs'
      - 'tests/meditation-web-push.test.js'
      - '.github/workflows/capabilities-rwht-authenticated.yml'
      - '.github/workflows/chat-rwht-authenticated.yml'
      - '.github/workflows/aria-pwa-steps-7-8-live.yml'
      - '.github/workflows/pc-rwht.yml'
      # Every path that starts PC RWHT must also create its same-SHA capability predecessor.
      - '.github/workflows/e2e-human-gate-safe-autonomy.yml'
      - '.github/workflows/supabase-canonical-deploy.yml'
      - '.github/workflows/responsive-ux-rwht-authenticated.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Isolate the authenticated capabilities run from Chat and Persistence on the same release.
  group: aria-capabilities-rwht-${{ github.sha }}
  cancel-in-progress: false

jobs:
  capabilities-rwht:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RWHT_URL: ${{ vars.RWHT_URL || 'https://aria.robvg9.workers.dev/pwa/' }}
      RWHT_HEADLESS: 'true'
      RWHT_NO_SCREENSHOTS: 'false'
      RWHT_ALLOW_MUTATIONS: 'false'
      RWHT_REQUIRE_AUTH: 'true'
      RWHT_ROUTES: '#capabilities'
      RWHT_RELOAD_AUTH: 'true'
      RWHT_LOGIN_WAIT_MS: '40000'
      RWHT_AUTH_ATTEMPTS: '1'
      RWHT_EXPECTED_AUTH_TEXT: 'Centro de capacidades'
      RWHT_EMAIL: ${{ secrets.RWHT_EMAIL }}
      RWHT_PASSWORD: ${{ secrets.RWHT_PASSWORD }}
      RWHT_STORAGE_STATE_B64: ${{ secrets.RWHT_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require an authenticated session source
        shell: bash
        run: |
          set -euo pipefail
          has_password_auth=false
          has_storage_auth=false
          if [[ -n "${RWHT_EMAIL}" && -n "${RWHT_PASSWORD}" ]]; then has_password_auth=true; fi
          if [[ -n "${RWHT_STORAGE_STATE_B64}" ]]; then has_storage_auth=true; fi
          if [[ "${has_password_auth}" != true && "${has_storage_auth}" != true ]]; then
            echo "::error title=Authenticated Capabilities RWHT blocked::Configure RWHT_EMAIL + RWHT_PASSWORD or RWHT_STORAGE_STATE_B64 as repository secrets."
            exit 1
          fi
          if [[ "${has_storage_auth}" == true ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_B64}" | base64 --decode > "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            chmod 600 "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            echo "RWHT_STORAGE_STATE=${RUNNER_TEMP}/aria-rwht-auth-state.json" >> "${GITHUB_ENV}"
          fi
      - name: Install PC RWHT dependencies
        working-directory: rwht/pc-browser
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: rwht/pc-browser
        run: npx playwright install --with-deps chromium
      - name: Wait for exact-SHA production deploys before Capabilities E2E
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_GATE_PREDECESSORS: "ARIA Chat Browser RWHT Authenticated"
        run: |
          set -euo pipefail
          bash scripts/ci/wait-for-aria-exact-sha-deploys.sh "${GITHUB_SHA}"

      - name: Verify canonical test catalog on LIVE PWA
        run: |
          set -euo pipefail
          expected_version="$(grep '^export const TEST_CATALOG_VERSION' pwa/src/testCatalog.ts | cut -d "'" -f 2)"
          expected_total="$(grep -c '"file": "tests/' pwa/src/testCatalog.ts)"
          test -n "$expected_version"
          test "$expected_total" -gt 0
          base="${RWHT_URL%/}"
          html=""
          catalog_match=false
          for attempt in $(seq 1 60); do
            html="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "${base}/?probe=${GITHUB_SHA}-capabilities-catalog-${attempt}" 2>/dev/null || true)"
            if (grep -q "name='aria-test-catalog-version' content='${expected_version}'" <<<"$html" || grep -q "name=\"aria-test-catalog-version\" content=\"${expected_version}\"" <<<"$html") &&
               (grep -q "name='aria-test-catalog-total' content='${expected_total}'" <<<"$html" || grep -q "name=\"aria-test-catalog-total\" content=\"${expected_total}\"" <<<"$html"); then catalog_match=true; break; fi
            test "$attempt" -lt 60 && sleep 2
          done
          test "$catalog_match" = true
          echo "CAPABILITIES_CANONICAL_TEST_CATALOG_LIVE_OK version=${expected_version} total=${expected_total}"
      - name: Execute authenticated Capabilities RWHT
        working-directory: rwht/pc-browser
        run: node rwht-pc-browser.mjs
      - name: Upload Capabilities RWHT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-capabilities-rwht-evidence
          path: rwht/pc-browser/rwht-artifacts
          if-no-files-found: warn
      - name: Remove temporary authentication state
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/aria-rwht-auth-state.json"
