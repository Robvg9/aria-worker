name: A6 router identity probe (read-only GET only)

on:
  push:
    branches:
      - ops/a6-ethernet-readonly-diagnostics-v1
    paths:
      - '.github/workflows/a6-router-identity-readonly.yml'

permissions:
  contents: read

concurrency:
  group: a6-router-identity-readonly
  cancel-in-progress: false

jobs:
  inspect:
    name: Read gateway landing page metadata on ROBVG
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 2
    steps:
      - name: HTTP GET gateway landing page without authentication
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]$env:COMPUTERNAME -ine 'ROBVG') { throw 'A6_HOST_MISMATCH' }

          $gateway = '192.168.1.1'
          $result = [pscustomobject]@{
            status = 'READ_ONLY_GATEWAY_HTTP_PROBE'
            host = [string]$env:COMPUTERNAME
            gateway = $gateway
            method = 'GET'
            authentication_used = $false
            cookies_or_credentials_saved = $false
            http_status = $null
            final_uri = $null
            server_header = $null
            content_type = $null
            page_title = $null
            model_or_firmware_hints = @()
            request_error = $null
          }

          try {
            $response = Invoke-WebRequest -Uri ("http://" + $gateway + "/") -Method Get -MaximumRedirection 2 -TimeoutSec 5 -UseBasicParsing
            $result.http_status = [int]$response.StatusCode
            $result.final_uri = [string]$response.BaseResponse.ResponseUri.AbsoluteUri
            if ($response.Headers['Server']) { $result.server_header = [string]$response.Headers['Server'] }
            if ($response.Headers['Content-Type']) { $result.content_type = [string]$response.Headers['Content-Type'] }
            $html = [string]$response.Content
            if ($html -match '(?is)<title[^>]*>(.*?)</title>') {
              $result.page_title = [System.Net.WebUtility]::HtmlDecode(([string]$Matches[1]).Trim())
            }
            $hints = @()
            foreach ($pattern in @('(?i)OLAX','(?i)Scorpio','(?i)MTN','(?i)firmware','(?i)model','(?i)build','(?i)version')) {
              if ($html -match $pattern) { $hints += $pattern.Trim('(?i)') }
            }
            $result.model_or_firmware_hints = @($hints | Select-Object -Unique)

            $metaTags = @([regex]::Matches($html,'(?is)<meta[^>]+>') | ForEach-Object { $_.Value.Substring(0,[Math]::Min(240,$_.Value.Length)) } | Select-Object -First 20)
            $scriptRefs = @([regex]::Matches($html,'(?is)<script[^>]+src=["''](?<src>[^"'']+)["'']') | ForEach-Object { $_.Groups['src'].Value } | Select-Object -Unique | Select-Object -First 8)
            $publicAssets = @()
            $publicVersionHints = @()
            foreach ($ref in $scriptRefs) {
              try {
                $assetUri = [Uri]::new($response.BaseResponse.ResponseUri,$ref)
                if ($assetUri.Host -ne $gateway) { continue }
                $asset = Invoke-WebRequest -Uri $assetUri.AbsoluteUri -Method Get -TimeoutSec 3 -UseBasicParsing
                $publicAssets += [pscustomobject]@{ path=$assetUri.AbsolutePath; status=[int]$asset.StatusCode; bytes=([string]$asset.Content).Length }
                $assetText = [string]$asset.Content
                $snippets = @([regex]::Matches($assetText,'(?i).{0,60}(firmware|softwareversion|sw_version|hardwareversion|buildversion|productmodel|device_model|version).{0,100}') | ForEach-Object { $_.Value -replace '[\r\n]+',' ' } | Select-Object -First 6)
                foreach ($snippet in $snippets) {
                  $publicVersionHints += [pscustomobject]@{ path=$assetUri.AbsolutePath; snippet=$snippet }
                }
              } catch {}
            }
            $result.public_meta_tags = @($metaTags)
            $result.public_script_assets = @($publicAssets)
            $result.public_version_hints = @($publicVersionHints | Select-Object -First 20)
          } catch {
            $result.request_error = $_.Exception.GetType().Name
          }

          Write-Output 'A6_ROUTER_IDENTITY_BEGIN'
          Write-Output ($result | ConvertTo-Json -Depth 5 -Compress)
          Write-Output 'A6_ROUTER_IDENTITY_END'
