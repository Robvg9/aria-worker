name: Persistent Autonomy v1 Contract Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile.aria-coordinator'
      - 'autonomy/persistent-control-plane-v1.js'
      - 'autonomy/ollama-persistent-adapter-v1.js'
      - 'cloudflare-autonomy/worker.mjs'
      - 'cloudflare-autonomy/assets/index.html'
      - 'wrangler.aria-autonomy.toml'
      - 'tests/cloudflare-autonomy-worker.test.js'
      - 'tests/cloudflare-autonomy-restart-recovery-v1.test.cjs'
      - '.github/workflows/aria-autonomy-coordinator-deploy.yml'
      - '.github/workflows/aria-cloudflare-deploy.yml'
      - 'tests/aria-autonomy-supabase-boundary.test.js'
      - 'autonomy/persistent-worker-coordinator-adapter-v1.js'
      - 'autonomy/persistent-http-server-v1.js'
      - 'autonomy/persistent-worker-bridge-v1.js'
      - 'autonomy/persistent-worker-error-policy-v1.js'
      - 'autonomy/persistent-notifications-v1.js'
      - 'autonomy/persistent-dashboard-v1.html'
      - 'autonomy/persistent-autonomy-v1.env.example'
      - 'autonomy/PERSISTENT_AUTONOMY_V1.md'
      - 'scripts/aria-persistent-autonomy-v1.js'
      - 'scripts/aria-persistent-coordinator-v1.js'
      - 'scripts/aria-persistent-windows-worker-v1.js'
      - 'scripts/aria-persistent-windows-worker-preflight-v1.js'
      - 'scripts/aria-persistent-windows-worker-preflight-v1.test.js'
      - 'scripts/Start-ARIA-Persistent-Worker.ps1'
      - 'scripts/Protect-ARIA-Persistent-Worker-Config.ps1'
      - 'tests/persistent-control-plane-v1.test.js'
      - 'tests/persistent-http-server-v1.test.js'
      - 'tests/persistent-worker-bridge-v1.test.js'
      - 'tests/persistent-recovery-e2e-v1.test.cjs'
      - 'tests/persistent-notifications-v1.test.js'
      - 'tests/persistent-hybrid-e2e-v1.test.js'
      - 'tests/ollama-persistent-adapter-v1.test.js'
      - '.github/workflows/persistent-autonomy-v1-tests.yml'

concurrency:
  group: persistent-autonomy-v1-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/aria-persistent-coordinator-v1.js
      - run: node --check scripts/aria-persistent-windows-worker-v1.js
      - run: node --check scripts/aria-persistent-windows-worker-preflight-v1.js
      - run: node scripts/aria-persistent-windows-worker-preflight-v1.test.js
      - run: node --check autonomy/ollama-persistent-adapter-v1.js
      - run: node --check cloudflare-autonomy/worker.mjs
      - run: node tests/cloudflare-autonomy-worker.test.js
      - run: node tests/cloudflare-autonomy-restart-recovery-v1.test.cjs
      - run: node tests/aria-autonomy-supabase-boundary.test.js
      - name: Validate Cloudflare build without publishing
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.aria-autonomy.toml
      - run: node tests/persistent-control-plane-v1.test.js
      - run: node tests/persistent-http-server-v1.test.js
      - run: node tests/persistent-worker-bridge-v1.test.js
      - run: node --check autonomy/persistent-worker-error-policy-v1.js
      - run: node tests/persistent-recovery-e2e-v1.test.cjs
      - run: node tests/persistent-notifications-v1.test.js
      - run: node tests/persistent-hybrid-e2e-v1.test.js
      - run: node tests/ollama-persistent-adapter-v1.test.js

  windows-supervisor-syntax:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows worker supervisor without executing it
        shell: pwsh
        run: |
          $paths = @(
            'scripts/Start-ARIA-Persistent-Worker.ps1',
            'scripts/Protect-ARIA-Persistent-Worker-Config.ps1'
          )
          foreach ($relativePath in $paths) {
            $tokens = $null
            $errors = $null
            $path = Join-Path $PWD $relativePath
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Output "POWERSHELL_PARSE_FAILED=$relativePath"
              $errors | Format-List *
              exit 1
            }
          }
          Write-Output 'WINDOWS_WORKER_SUPERVISOR_AND_CONFIG_PARSE=PASS'

      - name: Exercise DPAPI config creation and ACLs with a disposable test token
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $originalLocalAppData = $env:LOCALAPPDATA
          $testRoot = Join-Path $env:RUNNER_TEMP ('aria-dpapi-config-test-' + [guid]::NewGuid().ToString('N'))
          $env:LOCALAPPDATA = Join-Path $testRoot 'profile'
          $workspace = Join-Path $testRoot 'workspace'
          $testToken = 'package4-ci-test-' + [guid]::NewGuid().ToString('N') + '-token'
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null

          function global:Read-Host {
            param([string]$Prompt, [switch]$AsSecureString)
            if (-not $AsSecureString) { throw 'Unexpected interactive input request during DPAPI test.' }
            ConvertTo-SecureString -String $global:Package4CiTestToken -AsPlainText -Force
          }
          $global:Package4CiTestToken = $testToken

          try {
            $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts/Protect-ARIA-Persistent-Worker-Config.ps1'
            & $scriptPath -InstallDir $env:GITHUB_WORKSPACE -WorkspaceRoot $workspace -OllamaModel 'ci-test-model:latest'
            $configPath = Join-Path $env:LOCALAPPDATA 'ARIA/worker/worker.config.json'
            if (-not (Test-Path -LiteralPath $configPath -PathType Leaf)) {
              throw 'DPAPI config file was not created.'
            }

            $document = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json -ErrorAction Stop
            $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
            $sid = $identity.User.Value
            if ($document.format -ne 'aria-worker-config-dpapi-v1' -or $document.protectedForSid -ne $sid) {
              throw 'DPAPI config metadata or owner SID does not match the current user.'
            }

            $secureToken = ConvertTo-SecureString -String ([string]$document.workerTokenDpapi) -ErrorAction Stop
            $pointer = [IntPtr]::Zero
            try {
              $pointer = [Runtime.InteropServices.Marshal]::SecureStringToBSTR($secureToken)
              $decodedToken = [Runtime.InteropServices.Marshal]::PtrToStringBSTR($pointer)
              if ($decodedToken -cne $testToken) { throw 'DPAPI round-trip did not preserve the test token.' }
            }
            finally {
              if ($pointer -ne [IntPtr]::Zero) {
                [Runtime.InteropServices.Marshal]::ZeroFreeBSTR($pointer)
              }
              $decodedToken = $null
              $secureToken.Dispose()
            }

            foreach ($protectedPath in @((Split-Path -Parent $configPath), $configPath)) {
              $acl = Get-Acl -LiteralPath $protectedPath
              $ownerSid = $acl.GetOwner([System.Security.Principal.SecurityIdentifier]).Value
              if ($ownerSid -ne $sid) {
                throw "Protected path owner does not match current SID: $protectedPath"
              }
              $rules = $acl.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier])
              if ($rules.Count -ne 1 -or $rules[0].IdentityReference.Value -ne $sid -or
                  $rules[0].AccessControlType -ne [System.Security.AccessControl.AccessControlType]::Allow -or
                  ($rules[0].FileSystemRights -band [System.Security.AccessControl.FileSystemRights]::FullControl) -ne [System.Security.AccessControl.FileSystemRights]::FullControl) {
                throw "Protected path ACL is not restricted to current-user FullControl: $protectedPath"
              }
            }

            Write-Output 'WINDOWS_DPAPI_CONFIG_CREATE=PASS'
            Write-Output 'WINDOWS_DPAPI_TOKEN_ROUNDTRIP=PASS'
            Write-Output 'WINDOWS_DPAPI_CURRENT_USER_ACL=PASS'
          }
          finally {
            Remove-Item Function:\Read-Host -ErrorAction SilentlyContinue
            $global:Package4CiTestToken = $null
            $env:LOCALAPPDATA = $originalLocalAppData
            Remove-Item -LiteralPath $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

  windows-physical-readonly-preflight:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/package5-live-hybrid-20261031'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/Start-ARIA-Persistent-Worker.ps1
            scripts/aria-persistent-windows-worker-v1.js
            scripts/aria-persistent-windows-worker-preflight-v1.js
            autonomy/ollama-persistent-adapter-v1.js
          sparse-checkout-cone-mode: false
      - name: Run the actual Windows supervisor in read-only preflight mode
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          ARIA_WORKER_TOKEN: ${{ secrets.ARIA_AUTONOMY_WORKER_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $node = 'D:\Databank\node\node.exe'
          if (-not (Test-Path -LiteralPath $node -PathType Leaf)) {
            $node = (Get-Command node -ErrorAction Stop).Source
          }
          $nodeVersion = (& $node --version).Trim()
          if ([version]($nodeVersion.TrimStart('v')) -lt [version]'20.0.0') {
            throw "Node 20+ required; found $nodeVersion"
          }
          if ([string]::IsNullOrWhiteSpace($env:ARIA_WORKER_TOKEN) -or $env:ARIA_WORKER_TOKEN.Length -lt 32) {
            throw 'ARIA_AUTONOMY_WORKER_TOKEN repository secret is missing or invalid'
          }

          Write-Host "PACKAGE5_PHYSICAL_HOST=$env:COMPUTERNAME"
          Write-Host "PACKAGE5_RUNNER_IDENTITY=$([System.Security.Principal.WindowsIdentity]::GetCurrent().Name)"
          Write-Host 'PACKAGE5_USER_SCHEDULED_TASK=NOT_TOUCHED'
          Write-Host 'PACKAGE5_USER_SCHEDULED_TASK_LAST_CONFIRMED_STATE=Disabled'

          $scratch = Join-Path $env:RUNNER_TEMP 'aria-windows-worker-preflight'
          $workspace = Join-Path $scratch 'workspace'
          $config = Join-Path $scratch 'worker.env'
          $supervisor = Join-Path $env:GITHUB_WORKSPACE 'scripts\Start-ARIA-Persistent-Worker.ps1'
          $powershell = (Get-Process -Id $PID).Path
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null

          try {
            $values = @(
              'ARIA_CONTROL_URL=https://aria-autonomy-coordinator.robvg9.workers.dev'
              "ARIA_WORKER_TOKEN=$env:ARIA_WORKER_TOKEN"
              "ARIA_AUTONOMY_ADAPTER=$(Join-Path $env:GITHUB_WORKSPACE 'autonomy\ollama-persistent-adapter-v1.js')"
              "ARIA_WORKSPACE_ROOT=$workspace"
              'ARIA_OLLAMA_URL=http://127.0.0.1:11434'
              'ARIA_OLLAMA_MODEL=qwen3:4b'
            )
            [System.IO.File]::WriteAllLines($config, $values, [System.Text.Encoding]::ASCII)
            Write-Host "WINDOWS_NODE_VERSION=$nodeVersion"
            & $powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $supervisor -ConfigPath $config -InstallDir $env:GITHUB_WORKSPACE -NodePath $node -PreflightOnly
            if ($LASTEXITCODE -ne 0) { throw "WINDOWS_SUPERVISOR_PREFLIGHT_EXIT=$LASTEXITCODE" }
            Write-Host 'WINDOWS_SUPERVISOR_PREFLIGHT=PASS'
          }
          finally {
            Remove-Item -LiteralPath $config -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $workspace -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $scratch -Force -ErrorAction SilentlyContinue
          }

  package5-live-deploy:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/package5-live-hybrid-20261031'
    needs: [contract-tests, windows-supervisor-syntax, windows-physical-readonly-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate temporary unpaused coordinator and safe-probe guard
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('cloudflare-autonomy/worker.mjs', 'utf8');
          if (!/MISSION_EXECUTION_PAUSED\s*=\s*false/.test(source)) throw new Error('temporary_unpaused_branch_not_found');
          if (!source.includes('package5_workspace_list')) throw new Error('safe_probe_guard_missing');
          NODE
      - name: Refuse to run while unrelated missions are active
        env:
          ARIA_CONTROL_TOKEN: ${{ secrets.ARIA_AUTONOMY_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $ARIA_CONTROL_TOKEN" \
            "https://aria-autonomy-coordinator.robvg9.workers.dev/api/missions" \
            -o "$RUNNER_TEMP/package5-before-missions.json"
          python - <<'PY'
          import json, os
          data=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "package5-before-missions.json"), encoding="utf-8"))
          terminal={"succeeded","failed","cancelled"}
          active=[m for m in data.get("missions",[]) if m.get("status") not in terminal]
          if active:
              raise SystemExit("PACKAGE5_BLOCKED_UNRELATED_ACTIVE_MISSIONS=" + str(len(active)))
          print("PACKAGE5_NO_UNRELATED_ACTIVE_MISSIONS=true")
          PY
      - name: Deploy temporary coordinator branch (separate Worker; no Supabase)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARIA_CONTROL_TOKEN: ${{ secrets.ARIA_AUTONOMY_CONTROL_TOKEN }}
          ARIA_WORKER_TOKEN: ${{ secrets.ARIA_AUTONOMY_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          npm install --global wrangler@latest
          python - <<'PY'
          import json, os
          with open(".aria-package5-secrets.json", "w", encoding="utf-8") as f:
              json.dump({
                  "ARIA_CONTROL_TOKEN": os.environ["ARIA_CONTROL_TOKEN"],
                  "ARIA_WORKER_TOKEN": os.environ["ARIA_WORKER_TOKEN"],
              }, f)
          PY
          trap 'rm -f .aria-package5-secrets.json' EXIT
          wrangler deploy --config wrangler.aria-autonomy.toml --secrets-file .aria-package5-secrets.json
      - name: Verify temporary coordinator health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            "https://aria-autonomy-coordinator.robvg9.workers.dev/health" \
            | python -c 'import json,sys; x=json.load(sys.stdin); assert x.get("ok") is True and x.get("supabase_independent") is True; print("PACKAGE5_TEMP_COORDINATOR_HEALTH=PASS")'

  windows-package5-live-e2e:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/package5-live-hybrid-20261031'
    needs: [package5-live-deploy, windows-physical-readonly-preflight]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Execute controlled LIVE missions through the physical Windows worker process
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          ARIA_CONTROL_TOKEN: ${{ secrets.ARIA_AUTONOMY_CONTROL_TOKEN }}
          ARIA_WORKER_TOKEN: ${{ secrets.ARIA_AUTONOMY_WORKER_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://aria-autonomy-coordinator.robvg9.workers.dev'
          $controlHeaders = @{ Authorization = "Bearer $env:ARIA_CONTROL_TOKEN" }
          $workerToken = [string]$env:ARIA_WORKER_TOKEN
          $workerScript = Join-Path $env:GITHUB_WORKSPACE 'scripts\aria-persistent-windows-worker-v1.js'
          $adapterPath = Join-Path $env:GITHUB_WORKSPACE 'autonomy\ollama-persistent-adapter-v1.js'
          $node = 'D:\Databank\node\node.exe'
          if (-not (Test-Path -LiteralPath $node -PathType Leaf)) { $node = (Get-Command node -ErrorAction Stop).Source }
          if (-not (Test-Path -LiteralPath $workerScript -PathType Leaf)) { throw 'PACKAGE5_PHYSICAL_WORKER_SCRIPT_MISSING' }
          if (-not (Test-Path -LiteralPath $adapterPath -PathType Leaf)) { throw 'PACKAGE5_PHYSICAL_ADAPTER_MISSING' }
          Write-Host "PACKAGE5_PHYSICAL_HOST=$env:COMPUTERNAME"
          Write-Host "PACKAGE5_WORKER_RUNTIME_IDENTITY=$([System.Security.Principal.WindowsIdentity]::GetCurrent().Name)"
          Write-Host "PACKAGE5_NODE_VERSION=$((& $node --version).Trim())"
          Write-Host 'PACKAGE5_USER_SCHEDULED_TASK=NOT_TOUCHED'
          Write-Host 'PACKAGE5_USER_SCHEDULED_TASK_LAST_CONFIRMED_STATE=Disabled'

          $root = Join-Path $env:RUNNER_TEMP ('aria-package5-live-' + $env:GITHUB_RUN_ID)
          $workspace = Join-Path $root 'workspace'
          $logs = Join-Path $root 'logs'
          $manifest = Join-Path $env:RUNNER_TEMP ('aria-package5-worker-' + $env:GITHUB_RUN_ID + '.json')
          New-Item -ItemType Directory -Force -Path $workspace,$logs | Out-Null

          function Assert-NoUnrelatedActiveMissions {
            $response = Invoke-RestMethod -Method Get -Uri "$base/api/missions" -Headers $controlHeaders -TimeoutSec 20
            $active = @($response.missions | Where-Object { $_.status -notin @('succeeded','failed','cancelled') })
            if ($active.Count -gt 0) { throw "PACKAGE5_BLOCKED_UNRELATED_ACTIVE_MISSIONS=$($active.Count)" }
            Write-Host 'PACKAGE5_NO_UNRELATED_ACTIVE_MISSIONS=true'
          }
          function New-SafeProbeMission([string]$phase) {
            $body = @{
              goal = 'Package 5 controlled test: execute one read-only workspace listing of only the isolated workspace root at depth one. No file reads, searches, writes, edits, test execution, deployments, or other operations.'
              metadata = @{
                package5_safe_probe = $true
                package5_run_id = $env:GITHUB_RUN_ID
                package5_phase = $phase
              }
              policy = @{ max_risk = 'low'; require_human_approval = $true; max_steps = 1 }
            } | ConvertTo-Json -Depth 8
            $created = Invoke-RestMethod -Method Post -Uri "$base/api/missions" -Headers $controlHeaders -ContentType 'application/json' -Body $body -TimeoutSec 20
            if (-not $created.mission.mission_id) { throw 'PACKAGE5_MISSION_CREATE_NO_ID' }
            Write-Host "PACKAGE5_MISSION_CREATED_PHASE=$phase"
            Write-Host "PACKAGE5_MISSION_ID=$($created.mission.mission_id)"
            return [string]$created.mission.mission_id
          }
          function Start-Package5Worker([string]$phase) {
            $workerId = "package5-robvg-$phase-$env:GITHUB_RUN_ID"
            $stdout = Join-Path $logs "$phase.stdout.log"
            $stderr = Join-Path $logs "$phase.stderr.log"
            $env:ARIA_CONTROL_URL = $base
            $env:ARIA_AUTONOMY_ADAPTER = $adapterPath
            $env:ARIA_WORKSPACE_ROOT = $workspace
            $env:ARIA_OLLAMA_URL = 'http://127.0.0.1:11434'
            $env:ARIA_OLLAMA_MODEL = 'qwen3:4b'
            $env:ARIA_WORKER_ID = $workerId
            $env:ARIA_WORKER_POLL_MS = '1000'
            $env:ARIA_WORKER_HEARTBEAT_MS = '5000'
            $process = Start-Process -FilePath $node -ArgumentList ('"' + $workerScript + '"') -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $records = @()
            if (Test-Path -LiteralPath $manifest) {
              $existing = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
              if ($existing) { $records = @($existing) }
            }
            $records += [pscustomobject]@{ pid = $process.Id; worker_id = $workerId; stdout = $stdout; stderr = $stderr; phase = $phase }
            ConvertTo-Json -InputObject $records -Depth 5 | Set-Content -LiteralPath $manifest -Encoding UTF8
            $deadline = (Get-Date).AddMinutes(2)
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if ($process.HasExited) {
                $errorText = if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr -Raw } else { '' }
                throw "PACKAGE5_WORKER_EXITED_DURING_START:${phase}:$($process.ExitCode):$errorText"
              }
              $output = if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout -Raw } else { '' }
              if ($output -match 'ARIA Windows worker started:' -and $output -match 'Local model ready:') {
                Write-Host "PACKAGE5_PHYSICAL_WORKER_START=${phase}:PASS"
                return $process
              }
              Start-Sleep -Seconds 2
            }
            throw "PACKAGE5_WORKER_START_TIMEOUT=$phase"
          }
          function Stop-Package5Worker($process,[string]$phase) {
            if ($process) {
              $process.Refresh()
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force -ErrorAction Stop
                $process.WaitForExit(15000) | Out-Null
                $process.Refresh()
              }
              if (-not $process.HasExited) { throw "PACKAGE5_WORKER_PROCESS_STILL_RUNNING=$phase" }
            }
            Write-Host "PACKAGE5_PHYSICAL_WORKER_STOP=${phase}:PASS"
          }
          function Wait-SafeProbeMission([string]$missionId,[int]$timeoutMinutes=12) {
            $deadline = (Get-Date).AddMinutes($timeoutMinutes)
            while ((Get-Date) -lt $deadline) {
              $response = Invoke-RestMethod -Method Get -Uri "$base/api/missions/$missionId" -Headers $controlHeaders -TimeoutSec 20
              $mission = $response.mission
              if (-not $mission) { throw "PACKAGE5_MISSION_DISAPPEARED=$missionId" }
              if ($mission.status -in @('failed','waiting_human','cancelled')) { throw "PACKAGE5_MISSION_NONPASS=$($mission.status):$($mission.last_error)" }
              if ($mission.status -eq 'succeeded') {
                if (@($mission.tasks).Count -ne 1 -or $mission.tasks[0].operation -ne 'workspace.list' -or $mission.tasks[0].status -ne 'succeeded') {
                  throw 'PACKAGE5_SAFE_MISSION_OPERATION_MISMATCH'
                }
                $evidence = $mission.tasks[0].evidence[0]
                if (-not $mission.verification.passed -or $evidence.operation -ne 'workspace.list' -or $evidence.path -ne '.' -or [int]$evidence.count -ne @($evidence.entries).Count) {
                  throw 'PACKAGE5_SAFE_MISSION_EVIDENCE_OR_VERIFICATION_MISSING'
                }
                Write-Host "PACKAGE5_MISSION_SUCCEEDED=$missionId"
                Write-Host 'PACKAGE5_MISSION_TASK=workspace.list'
                Write-Host "PACKAGE5_MISSION_ENTRY_COUNT=$($evidence.count)"
                Write-Host 'PACKAGE5_MISSION_VERIFICATION=PASS'
                return $mission
              }
              Start-Sleep -Seconds 3
            }
            throw "PACKAGE5_MISSION_TIMEOUT=$missionId"
          }

          $workerProcess = $null
          $missionIds = @()
          try {
            Assert-NoUnrelatedActiveMissions
            $workerProcess = Start-Package5Worker 'cold-start'
            $mission1 = New-SafeProbeMission 'cold-start'
            $missionIds += $mission1
            [void](Wait-SafeProbeMission $mission1)
            Stop-Package5Worker $workerProcess 'cold-start'
            $workerProcess = $null

            Assert-NoUnrelatedActiveMissions
            $mission2 = New-SafeProbeMission 'expired-lease-recovery'
            $missionIds += $mission2
            $abandoned = Invoke-RestMethod -Method Post -Uri "$base/api/worker/claim" -Headers @{ Authorization = "Bearer $workerToken" } -ContentType 'application/json' -Body (@{ worker_id = 'package5-interrupted-worker'; capabilities = @('ollama','workspace') } | ConvertTo-Json -Depth 5) -TimeoutSec 20
            if (-not $abandoned.job -or $abandoned.job.mission_id -ne $mission2) { throw 'PACKAGE5_INTERRUPTED_LEASE_NOT_CREATED' }
            $abandonedJobId = [string]$abandoned.job.job_id
            $abandonedLeaseToken = [string]$abandoned.job.lease_token
            if ($abandonedLeaseToken.Length -lt 20) { throw 'PACKAGE5_INTERRUPTED_LEASE_TOKEN_MISSING' }
            Write-Host "PACKAGE5_INTERRUPTED_JOB_ID=$abandonedJobId"
            Write-Host 'PACKAGE5_INTERRUPTED_LEASE_CREATED=true'
            Write-Host 'PACKAGE5_INTERRUPTED_LEASE_TOKEN=NOT_LOGGED'
            Start-Sleep -Seconds 65
            Write-Host 'PACKAGE5_INTERRUPTED_LEASE_EXPIRY_WAIT=PASS'

            $workerProcess = Start-Package5Worker 'expired-lease-recovery'
            $recoveredLog = Join-Path $logs 'expired-lease-recovery.stdout.log'
            $claimDeadline = (Get-Date).AddMinutes(2)
            $reclaimed = $false
            while ((Get-Date) -lt $claimDeadline) {
              $output = if (Test-Path -LiteralPath $recoveredLog) { Get-Content -LiteralPath $recoveredLog -Raw } else { '' }
              if ($output -match "Claimed .* for mission $([regex]::Escape($mission2))") { $reclaimed = $true; break }
              $workerProcess.Refresh()
              if ($workerProcess.HasExited) { throw "PACKAGE5_RECOVERY_WORKER_EXITED=$($workerProcess.ExitCode)" }
              Start-Sleep -Seconds 2
            }
            if (-not $reclaimed) { throw 'PACKAGE5_EXPIRED_LEASE_NOT_RECLAIMED_BY_PHYSICAL_WORKER' }
            Write-Host 'PACKAGE5_EXPIRED_LEASE_RECLAIMED_BY_ROBVG_WORKER=PASS'
            [void](Wait-SafeProbeMission $mission2)

            $staleBody = @{ worker_id='package5-interrupted-worker'; lease_token=$abandonedLeaseToken; result=@{passed=$true;evidence=@{stale=$true}} } | ConvertTo-Json -Depth 6
            $staleStatus = 0
            try {
              $staleResponse = Invoke-WebRequest -Method Post -Uri "$base/api/worker/jobs/$abandonedJobId/complete" -Headers @{ Authorization = "Bearer $workerToken" } -ContentType 'application/json' -Body $staleBody -TimeoutSec 20
              $staleStatus = [int]$staleResponse.StatusCode
            } catch {
              if ($_.Exception.Response) { $staleStatus = [int]$_.Exception.Response.StatusCode } else { throw }
            }
            if ($staleStatus -ne 409) { throw "PACKAGE5_STALE_LEASE_NOT_FENCED=$staleStatus" }
            Write-Host 'PACKAGE5_STALE_LEASE_FENCING=PASS'
            Write-Host "PACKAGE5_TEST_MISSIONS=$($missionIds -join ',')"
            Write-Host 'PACKAGE5_HYBRID_LIVE_E2E=PASS'
          } finally {
            Stop-Package5Worker $workerProcess 'final-cleanup'
          }
      - name: Stop any surviving Package 5 worker process
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Join-Path $env:RUNNER_TEMP ('aria-package5-worker-' + $env:GITHUB_RUN_ID + '.json')
          if (Test-Path -LiteralPath $manifest) {
            $records = @(Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json)
            foreach ($record in $records) {
              $process = Get-Process -Id ([int]$record.pid) -ErrorAction SilentlyContinue
              if ($process) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            }
            foreach ($record in $records) {
              if (Get-Process -Id ([int]$record.pid) -ErrorAction SilentlyContinue) { throw "PACKAGE5_ORPHAN_WORKER_PID=$($record.pid)" }
            }
            Remove-Item -LiteralPath $manifest -Force
          }
          Write-Host 'PACKAGE5_PHYSICAL_WORKER_CLEANUP=PASS'
  package5-live-restore-freeze:
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/package5-live-hybrid-20261031'
    needs: [package5-live-deploy, windows-package5-live-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assert canonical main remains frozen
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('cloudflare-autonomy/worker.mjs', 'utf8');
          if (!/MISSION_EXECUTION_PAUSED\s*=\s*true/.test(source)) throw new Error('MAIN_FREEZE_NOT_TRUE');
          console.log('PACKAGE5_MAIN_FREEZE_SOURCE=TRUE');
          NODE
      - name: Restore frozen coordinator from main (no Supabase)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARIA_CONTROL_TOKEN: ${{ secrets.ARIA_AUTONOMY_CONTROL_TOKEN }}
          ARIA_WORKER_TOKEN: ${{ secrets.ARIA_AUTONOMY_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          npm install --global wrangler@latest
          python - <<'PY'
          import json, os
          with open(".aria-package5-restore-secrets.json", "w", encoding="utf-8") as f:
              json.dump({
                  "ARIA_CONTROL_TOKEN": os.environ["ARIA_CONTROL_TOKEN"],
                  "ARIA_WORKER_TOKEN": os.environ["ARIA_WORKER_TOKEN"],
              }, f)
          PY
          trap 'rm -f .aria-package5-restore-secrets.json' EXIT
          wrangler deploy --config wrangler.aria-autonomy.toml --secrets-file .aria-package5-restore-secrets.json
      - name: Verify live freeze blocks mission creation and worker claim
        env:
          ARIA_CONTROL_TOKEN: ${{ secrets.ARIA_AUTONOMY_CONTROL_TOKEN }}
          ARIA_WORKER_TOKEN: ${{ secrets.ARIA_AUTONOMY_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          base="https://aria-autonomy-coordinator.robvg9.workers.dev"
          curl --fail --silent --show-error --max-time 20 "$base/health" \
            | python -c 'import json,sys; assert json.load(sys.stdin).get("ok") is True; print("PACKAGE5_RESTORED_COORDINATOR_HEALTH=PASS")'
          code="$(curl --silent --show-error --max-time 20 -o "$RUNNER_TEMP/freeze-mission.json" -w '%{http_code}' \
            -X POST "$base/api/missions" -H "Authorization: Bearer $ARIA_CONTROL_TOKEN" \
            -H 'content-type: application/json' --data '{"goal":"Package 5 freeze verification probe"}')"
          test "$code" = "423"
          python - "$RUNNER_TEMP/freeze-mission.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          assert x.get("error")=="mission_execution_paused"
          PY
          code="$(curl --silent --show-error --max-time 20 -o "$RUNNER_TEMP/freeze-claim.json" -w '%{http_code}' \
            -X POST "$base/api/worker/claim" -H "Authorization: Bearer $ARIA_WORKER_TOKEN" \
            -H 'content-type: application/json' --data '{"worker_id":"package5-freeze-probe","capabilities":[]}')"
          test "$code" = "423"
          python - "$RUNNER_TEMP/freeze-claim.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          assert x.get("error")=="mission_execution_paused"
          PY
          echo PACKAGE5_LIVE_FREEZE_RESTORED_AND_VERIFIED=true

  windows-package5-final-check:
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/package5-live-hybrid-20261031'
    needs: [windows-physical-readonly-preflight, windows-package5-live-e2e, package5-live-restore-freeze]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Independently verify the controlled test worker process is stopped
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Join-Path $env:RUNNER_TEMP ('aria-package5-worker-' + $env:GITHUB_RUN_ID + '.json')
          if (Test-Path -LiteralPath $manifest) {
            $records = @(Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json)
            foreach ($record in $records) {
              $process = Get-Process -Id ([int]$record.pid) -ErrorAction SilentlyContinue
              if ($process) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            }
            foreach ($record in $records) {
              if (Get-Process -Id ([int]$record.pid) -ErrorAction SilentlyContinue) { throw "PACKAGE5_ORPHAN_WORKER_PID=$($record.pid)" }
            }
            Remove-Item -LiteralPath $manifest -Force
          }
          Write-Host 'PACKAGE5_PHYSICAL_TEST_WORKER=STOPPED'
          Write-Host 'PACKAGE5_USER_SCHEDULED_TASK=NOT_TOUCHED'
          Write-Host 'PACKAGE5_USER_SCHEDULED_TASK_LAST_CONFIRMED_STATE=Disabled'

