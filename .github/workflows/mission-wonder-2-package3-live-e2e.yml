name: Mission Wonder 2 Package 3 — LIVE Durable Object recovery

on:
  workflow_dispatch:
    inputs:
      confirm_package3_live_probe:
        description: "Run exactly one allowlisted synthetic mission against the production Durable Object. Global freeze and all general routes must remain closed."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: mission-wonder-2-package3-live-production
  cancel-in-progress: false

jobs:
  contract:
    if: inputs.confirm_package3_live_probe == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate coordinator syntax and frozen-scope contracts
        run: |
          set -euo pipefail
          node --check cloudflare-autonomy/worker.mjs
          node --check scripts/aria-persistent-windows-worker-v1.js
          node --check scripts/mission-wonder-2-package3-live-e2e.cjs
          node tests/cloudflare-autonomy-package3-scope.test.cjs
          node tests/cloudflare-autonomy-worker-process-e2e-v1.test.cjs
          node tests/cloudflare-autonomy-restart-recovery-v1.test.cjs
          node tests/cloudflare-autonomy-worker.test.js

  live-production:
    needs: contract
    if: inputs.confirm_package3_live_probe == true && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate existing production deployment credentials (values are never printed)
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARIA_CONTROL_TOKEN: ${{ secrets.ARIA_AUTONOMY_CONTROL_TOKEN }}
          ARIA_WORKER_TOKEN: ${{ secrets.ARIA_AUTONOMY_WORKER_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)){throw 'CLOUDFLARE_API_TOKEN_MISSING'}
          if([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)){throw 'CLOUDFLARE_ACCOUNT_ID_MISSING'}
          if($env:ARIA_CONTROL_TOKEN.Length -lt 32){throw 'ARIA_CONTROL_TOKEN_INVALID'}
          if($env:ARIA_WORKER_TOKEN.Length -lt 32){throw 'ARIA_WORKER_TOKEN_INVALID'}
          if($env:ARIA_CONTROL_TOKEN -ceq $env:ARIA_WORKER_TOKEN){throw 'CONTROL_AND_WORKER_TOKENS_MUST_DIFFER'}
          Write-Host 'PACKAGE3_PRODUCTION_CREDENTIALS_PREFLIGHT=PASS'

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Deploy the exact reviewed frozen-scope coordinator
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARIA_CONTROL_TOKEN: ${{ secrets.ARIA_AUTONOMY_CONTROL_TOKEN }}
          ARIA_WORKER_TOKEN: ${{ secrets.ARIA_AUTONOMY_WORKER_TOKEN }}
          ARIA_NOTIFICATION_WEBHOOK_URL: ${{ secrets.ARIA_AUTONOMY_NOTIFICATION_WEBHOOK_URL }}
          ARIA_NOTIFICATION_TOKEN: ${{ secrets.ARIA_AUTONOMY_NOTIFICATION_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $payload=[ordered]@{
            ARIA_CONTROL_TOKEN=$env:ARIA_CONTROL_TOKEN
            ARIA_WORKER_TOKEN=$env:ARIA_WORKER_TOKEN
          }
          if(-not [string]::IsNullOrWhiteSpace($env:ARIA_NOTIFICATION_WEBHOOK_URL)){
            if($env:ARIA_NOTIFICATION_WEBHOOK_URL -notmatch '^https://'){throw 'NOTIFICATION_WEBHOOK_MUST_USE_HTTPS'}
            $payload.ARIA_NOTIFICATION_WEBHOOK_URL=$env:ARIA_NOTIFICATION_WEBHOOK_URL
          }
          if(-not [string]::IsNullOrWhiteSpace($env:ARIA_NOTIFICATION_TOKEN)){
            $payload.ARIA_NOTIFICATION_TOKEN=$env:ARIA_NOTIFICATION_TOKEN
          }
          $secretPath=Join-Path $PWD ('.aria-package3-secrets-' + $env:GITHUB_RUN_ID + '.json')
          try {
            $utf8=New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText($secretPath,($payload | ConvertTo-Json -Compress),$utf8)
            wrangler deploy --config wrangler.aria-autonomy.toml --secrets-file $secretPath
            if($LASTEXITCODE -ne 0){throw "WRANGLER_DEPLOY_FAILED=$LASTEXITCODE"}
            Write-Host 'PACKAGE3_SCOPED_COORDINATOR_DEPLOY=PASS'
          } finally {
            Remove-Item -LiteralPath $secretPath -Force -ErrorAction SilentlyContinue
          }

      - name: Run exactly one live Durable Object process-recovery probe
        shell: powershell
        env:
          ARIA_CONTROL_URL: https://aria-autonomy-coordinator.robvg9.workers.dev
          ARIA_CONTROL_TOKEN: ${{ secrets.ARIA_AUTONOMY_CONTROL_TOKEN }}
          ARIA_WORKER_TOKEN: ${{ secrets.ARIA_AUTONOMY_WORKER_TOKEN }}
          ARIA_PACKAGE3_PROBE_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
          ARIA_PACKAGE3_EVIDENCE_PATH: "${{ runner.temp }}\aria-package3-live\evidence.json"
        run: |
          $ErrorActionPreference='Stop'
          node scripts/mission-wonder-2-package3-live-e2e.cjs
          if($LASTEXITCODE -ne 0){throw "PACKAGE3_LIVE_E2E_FAILED=$LASTEXITCODE"}

      - name: Upload sanitized Package 3 evidence (no tokens or lease secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-wonder-2-package3-live-evidence
          path: ${{ runner.temp }}/aria-package3-live/evidence.json
          if-no-files-found: ignore
          retention-days: 7
