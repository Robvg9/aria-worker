name: Cloudflare Workers inventory and guarded obsolete-preview cleanup

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose read-only inventory or the separately guarded cleanup"
        type: choice
        required: true
        default: inventory
        options:
          - inventory
          - cleanup_obsolete_previews
      confirm_cleanup:
        description: "Required only for cleanup: DELETE_144_OBSOLETE_BC_PREVIEWS"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect account inventory without changing Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python - <<'PY'
          import concurrent.futures
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          import time

          BASE = "https://api.cloudflare.com/client/v4"
          ACCOUNT = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          HEADERS = {"Authorization": f"Bearer {TOKEN}", "Accept": "application/json"}
          OUT = "cloudflare-workers-inventory.json"

          def request(path, token=TOKEN, method="GET", payload=None):
              headers = {"Authorization": f"Bearer {token}", "Accept": "application/json"}
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode()
              last_status, last_body = 0, {"success": False, "error": "Request not attempted"}
              # Retry transient Cloudflare rate-limit and server errors. A read-only
              # inventory may encounter brief edge/API 429/5xx responses; never
              # convert those into "empty" metadata.
              for attempt in range(3):
                  req = urllib.request.Request(BASE + path, headers=headers, data=data, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=25) as response:
                          return response.status, json.loads(response.read().decode())
                  except urllib.error.HTTPError as exc:
                      try:
                          body = json.loads(exc.read().decode())
                      except Exception:
                          body = {}
                      msg = "; ".join(x.get("message", "") for x in body.get("errors", []) if isinstance(x, dict))
                      codes = [x.get("code") for x in body.get("errors", []) if isinstance(x, dict)]
                      last_status = exc.code
                      last_body = {"success": False, "error": msg[:400], "error_codes": codes}
                      if exc.code not in (429, 500, 502, 503, 504) or attempt == 2:
                          return last_status, last_body
                      retry_after = exc.headers.get("Retry-After")
                      try:
                          pause = min(8, max(1, int(retry_after))) if retry_after else (attempt + 1) * 2
                      except Exception:
                          pause = (attempt + 1) * 2
                      time.sleep(pause)
                  except Exception as exc:
                      return 0, {"success": False, "error": type(exc).__name__ + ": " + str(exc)[:250]}
              return last_status, last_body

          def pages(path):
              all_items, status, error = [], 200, None
              for page in range(1, 21):
                  sep = "&" if "?" in path else "?"
                  st, body = request(f"{path}{sep}per_page=100&page={page}")
                  if st != 200 or not body.get("success", False):
                      status, error = st, body.get("error") or body.get("errors") or "API request failed"
                      break
                  items = body.get("result") or []
                  if not isinstance(items, list):
                      status, error = st, "Unexpected result format"
                      break
                  all_items.extend(items)
                  info = body.get("result_info") or {}
                  total_pages = info.get("total_pages")
                  if (total_pages and page >= total_pages) or len(items) < 100:
                      break
              return all_items, status, error

          def compact_binding(binding):
              keep = ("name", "type", "service", "environment", "namespace", "class_name",
                      "namespace_id", "queue_name", "bucket_name", "database_name",
                      "script_name", "workflow_name", "dataset", "instance_name",
                      "id", "migrations")
              return {k: binding[k] for k in keep if k in binding and isinstance(binding[k], (str, int, bool, list))}

          def list_scripts_search():
              # /workers/scripts is a single-page listing. Supplying page=... to
              # that endpoint repeats the same page. Use the dedicated
              # /workers/scripts-search endpoint for true page/per_page paging.
              collected, status, error = [], 200, None
              for page in range(1, 101):
                  st, body = request(
                      f"/accounts/{ACCOUNT}/workers/scripts-search?per_page=100&page={page}"
                  )
                  if st != 200 or not body.get("success", False):
                      status, error = st, body.get("error") or body.get("errors") or "Worker search failed"
                      break
                  batch = body.get("result") or []
                  if not isinstance(batch, list):
                      status, error = st, "Unexpected Worker search result format"
                      break
                  collected.extend(batch)
                  info = body.get("result_info") or {}
                  total_pages = info.get("total_pages")
                  if total_pages is not None and page >= total_pages:
                      break
                  if not batch or len(batch) < 100:
                      break
              # Defensive de-duplication by script name before fanning out requests.
              unique = {}
              for item in collected:
                  if not isinstance(item, dict):
                      continue
                  name = item.get("script_name") or item.get("id") or item.get("name")
                  if name:
                      item["id"] = name
                      unique[name] = item
              return list(unique.values()), status, error

          scripts, scripts_status, scripts_error = list_scripts_search()
          domains, domains_status, domains_error = pages(f"/accounts/{ACCOUNT}/workers/domains")
          zones, zones_status, zones_error = pages(f"/zones?account.id={urllib.parse.quote(ACCOUNT)}")
          zone_routes = []
          routes_statuses = {}
          if zones_status == 200:
              for zone in zones:
                  zid = zone.get("id")
                  if not zid:
                      continue
                  routes, st, err = pages(f"/zones/{zid}/workers/routes")
                  routes_statuses[zone.get("name", zid)] = {"status": st, "error": err}
                  if st == 200:
                      for route in routes:
                          route["zone_name"] = zone.get("name")
                          route["zone_id"] = zid
                          zone_routes.append(route)

          root_subdomain_status, root_subdomain_body = request(f"/accounts/{ACCOUNT}/workers/subdomain")
          root_subdomain = root_subdomain_body.get("result") if isinstance(root_subdomain_body, dict) else None

          script_rows = []
          now = dt.datetime.now(dt.timezone.utc)
          start = (now - dt.timedelta(days=30)).isoformat(timespec="milliseconds").replace("+00:00", "Z")
          end = now.isoformat(timespec="milliseconds").replace("+00:00", "Z")

          def metrics_for(name):
              query = """query GetWorkersAnalytics($accountTag: string, $datetimeStart: string, $datetimeEnd: string, $scriptName: string) {
                viewer { accounts(filter: {accountTag: $accountTag}) {
                  workersInvocationsAdaptive(limit: 100, filter: {
                    scriptName: $scriptName, datetime_geq: $datetimeStart, datetime_leq: $datetimeEnd
                  }) { sum { requests errors subrequests } }
                } }
              }"""
              st, body = request("/graphql", method="POST", payload={
                  "query": query,
                  "variables": {"accountTag": ACCOUNT, "datetimeStart": start,
                                "datetimeEnd": end, "scriptName": name}
              })
              if st != 200:
                  return {"status": st, "requests": None, "errors": None,
                          "note": body.get("error", "Analytics not available")}
              if body.get("errors"):
                  return {"status": "graphql_error", "requests": None, "errors": None,
                          "note": str(body["errors"])[:300]}
              try:
                  rows = body["data"]["viewer"]["accounts"][0]["workersInvocationsAdaptive"]
                  return {"status": 200,
                          "requests": sum((r.get("sum") or {}).get("requests", 0) or 0 for r in rows),
                          "errors": sum((r.get("sum") or {}).get("errors", 0) or 0 for r in rows),
                          "note": "last 30 days"}
              except Exception:
                  return {"status": "unknown", "requests": None, "errors": None,
                          "note": "No analytics rows or unexpected response"}

          def inspect_script(script):
              name = script.get("id") or script.get("script_name") or script.get("name")
              if not name:
                  return None
              enc = urllib.parse.quote(name, safe="")
              base = f"/accounts/{ACCOUNT}/workers/scripts/{enc}"
              settings_status, settings = request(base + "/settings")
              sub_status, sub = request(base + "/subdomain")
              schedule_status, schedule = request(base + "/schedules")
              tail_status, tail = request(base + "/script-settings")
              deployment_status, deployment_body = request(base + "/deployments?per_page=10&page=1")
              deployment_result = deployment_body.get("result") if isinstance(deployment_body, dict) else {}
              deployments = (deployment_result or {}).get("deployments", []) if isinstance(deployment_result, dict) else []
              settings_result = settings.get("result") if isinstance(settings, dict) else {}
              schedule_result = schedule.get("result") if isinstance(schedule, dict) else {}
              tail_result = tail.get("result") if isinstance(tail, dict) else {}
              # Cloudflare may return {"result": null} when a Worker has no
              # workers.dev subdomain configuration. Treat this as unavailable
              # metadata rather than aborting the entire account inventory.
              sub_result = sub.get("result") if isinstance(sub, dict) else {}
              sub_result = sub_result if isinstance(sub_result, dict) else {}
              bind_list = (settings_result or {}).get("bindings") or []
              latest = sorted(deployments, key=lambda x: x.get("created_on", ""), reverse=True)[:5]
              return {
                  "name": name,
                  "created_on": script.get("created_on"),
                  "modified_on": script.get("modified_on"),
                  "last_deployed_from": script.get("last_deployed_from"),
                  "compatibility_date": script.get("compatibility_date"),
                  "usage_model": script.get("usage_model"),
                  "handlers": script.get("handlers"),
                  "has_assets": script.get("has_assets"),
                  "has_modules": script.get("has_modules"),
                  "migration_tag": script.get("migration_tag"),
                  "workers_dev": {"status": sub_status, "enabled": sub_result.get("enabled"),
                                  "previews_enabled": sub_result.get("previews_enabled")},
                  "settings_status": settings_status,
                  "bindings": [compact_binding(x) for x in bind_list if isinstance(x, dict)],
                  "schedules_status": schedule_status,
                  "crons": (schedule_result or {}).get("crons"),
                  "tail_consumers_status": tail_status,
                  "tail_consumers": (tail_result or {}).get("tail_consumers"),
                  "deployments_status": deployment_status,
                  "recent_deployments": [{"id": x.get("id"), "created_on": x.get("created_on"),
                                          "strategy": x.get("strategy")} for x in latest],
                  "custom_domains": [{"hostname": d.get("hostname"), "enabled": d.get("enabled"),
                                      "zone_name": d.get("zone_name"), "zone_id": d.get("zone_id")}
                                     for d in domains if d.get("service") == name],
                  "zone_routes": [{"pattern": r.get("pattern"), "zone_name": r.get("zone_name")}
                                  for r in zone_routes if r.get("script") == name],
                  "metrics_30d": metrics_for(name)
              }

          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              script_rows = [x for x in pool.map(inspect_script, scripts) if x]

          report = {
              "generated_at": now.isoformat(),
              "account_id_suffix": ACCOUNT[-6:],
              "workers_dev_account": {"status": root_subdomain_status, "result": root_subdomain},
              "scripts_inventory": {"status": scripts_status, "error": scripts_error, "count": len(scripts)},
              "domains_inventory": {"status": domains_status, "error": domains_error,
                                    "count": len(domains), "items": [
                  {"hostname": d.get("hostname"), "service": d.get("service"),
                   "enabled": d.get("enabled"), "zone_id": d.get("zone_id"),
                   "zone_name": d.get("zone_name")} for d in domains]},
              "zones_inventory": {"status": zones_status, "error": zones_error, "count": len(zones)},
              "routes_inventory": {"status_by_zone": routes_statuses, "count": len(zone_routes),
                                   "items": zone_routes},
              "workers": script_rows,
              "safety": {
                  "cloudflare_mutations_performed": False,
                  "http_methods_used": ["GET", "POST (read-only GraphQL query)"],
                  "secrets_printed": False,
                  "deletion_performed": False,
                  "note": "This report is an inventory only. Zero traffic alone does not prove a Worker is disposable."
              }
          }
          with open(OUT, "w", encoding="utf-8") as f:
              json.dump(report, f, indent=2)
          print("CLOUDFLARE_WORKERS_READ_ONLY_INVENTORY")
          print(f"WORKER_SCRIPT_COUNT={len(scripts)} (unique names from workers/scripts-search)")
          print(f"DOMAINS_STATUS={domains_status}; DOMAINS_COUNT={len(domains)}")
          print(f"ZONES_STATUS={zones_status}; ZONES_COUNT={len(zones)}")
          print(f"ROUTES_COUNT={len(zone_routes)}; ROUTE_ZONES={len(routes_statuses)}")
          for w in script_rows:
              m = w["metrics_30d"]
              print("WORKER=" + json.dumps({
                  "name": w["name"], "modified_on": w["modified_on"],
                  "last_deployed_from": w["last_deployed_from"],
                  "workers_dev": w["workers_dev"], "crons": w["crons"],
                  "bindings": w["bindings"], "tail_consumers": w["tail_consumers"],
                  "custom_domains": w["custom_domains"], "zone_routes": w["zone_routes"],
                  "requests_30d": m.get("requests"), "metrics_status": m.get("status"),
                  "deployments": w["recent_deployments"]
              }, ensure_ascii=False))
          print("NO_CLOUDFLARE_MUTATIONS=true")
          print("NO_WORKER_DELETIONS=true")
          if scripts_status != 200:
              print("INVENTORY_BLOCKED: cannot list account Workers; inspect the reported API permission error.")
              raise SystemExit(2)
          PY
      - name: Persist inventory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-workers-inventory
          path: cloudflare-workers-inventory.json
          if-no-files-found: warn
          retention-days: 7

  cleanup-obsolete-previews:
    if: ${{ inputs.action == 'cleanup_obsolete_previews' }}
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the fresh inventory from this same run
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-workers-inventory
          path: audit

      - name: Revalidate, delete only audited orphaned previews, and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM_CLEANUP: ${{ inputs.confirm_cleanup }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = "https://api.cloudflare.com/client/v4"
          ACCOUNT = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          REQUIRED_CONFIRMATION = "DELETE_144_OBSOLETE_BC_PREVIEWS"
          AUDIT_PATH = "audit/cloudflare-workers-inventory.json"
          REPORT_PATH = "cloudflare-workers-cleanup-report.json"
          PROTECTED = {
              "aria",
              "cuevacoin",
              "battlecruiser",
              "actualizaciondeaplicaciones",
              "aria-rwht-android-bridge",
              "bc-pr-224-battlecruiser",
          }
          PREVIEW_RE = re.compile(r"^bc-pr-[0-9]+-battlecruiser$")

          def abort(message):
              print("CLEANUP_ABORTED=" + message)
              raise SystemExit(2)

          if os.environ.get("CONFIRM_CLEANUP", "") != REQUIRED_CONFIRMATION:
              abort("Explicit confirmation string did not match; no deletion was attempted.")

          with open(AUDIT_PATH, "r", encoding="utf-8") as f:
              audit = json.load(f)

          generated = dt.datetime.fromisoformat(audit["generated_at"].replace("Z", "+00:00"))
          age = (dt.datetime.now(dt.timezone.utc) - generated).total_seconds()
          if age < 0 or age > 1800:
              abort("Inventory artifact is older than 30 minutes or has an invalid timestamp.")
          if audit.get("account_id_suffix") != ACCOUNT[-6:]:
              abort("Audit account suffix does not match the configured Cloudflare account.")
          if audit.get("safety", {}).get("cloudflare_mutations_performed") is not False:
              abort("Inventory artifact does not certify read-only collection.")
          if audit.get("safety", {}).get("deletion_performed") is not False:
              abort("Inventory artifact unexpectedly reports a prior deletion.")
          for section in ("scripts_inventory", "domains_inventory", "zones_inventory"):
              if audit.get(section, {}).get("status") != 200:
                  abort("Account-wide " + section + " is incomplete.")
          if audit.get("domains_inventory", {}).get("items") != []:
              abort("Account has custom domains; aborting bulk preview cleanup.")
          if audit.get("zones_inventory", {}).get("count") != 0:
              abort("Account reports zones; route coverage must be reviewed before cleanup.")
          if audit.get("routes_inventory", {}).get("count") != 0:
              abort("Account reports Worker routes; aborting bulk preview cleanup.")

          workers = audit.get("workers", [])
          if not workers or audit.get("scripts_inventory", {}).get("count") != len(workers):
              abort("Worker inventory count is inconsistent.")
          by_name = {w.get("name"): w for w in workers}
          if len(by_name) != len(workers):
              abort("Duplicate worker names found in fresh inventory.")
          missing_protected = sorted(PROTECTED - set(by_name))
          if missing_protected:
              abort("Protected Workers missing from inventory: " + ", ".join(missing_protected))

          # Require every script's dependency, schedule, tail, deployment, and
          # analytics metadata to be readable before any destructive operation.
          for w in workers:
              for field in ("settings_status", "schedules_status",
                            "tail_consumers_status", "deployments_status"):
                  if w.get(field) != 200:
                      abort("Incomplete " + field + " for " + str(w.get("name")))
              if (w.get("metrics_30d") or {}).get("status") != 200:
                  abort("Analytics unavailable for " + str(w.get("name")))

          approved_numbers = (
              list(range(63, 95)) + [96, 97, 98] + list(range(100, 108)) +
              list(range(109, 179)) + [183, 184, 185, 186, 188, 190, 191, 192, 193] +
              list(range(196, 207)) + [209, 211, 212, 213, 215, 216, 217, 218, 219, 220, 227]
          )
          expected_candidates = {f"bc-pr-{n}-battlecruiser" for n in approved_numbers}
          if len(expected_candidates) != 144:
              abort("Internal audited candidate allowlist is malformed.")
          present_previews = {name for name in by_name if PREVIEW_RE.fullmatch(name)}
          unexpected_previews = present_previews - expected_candidates - {"bc-pr-224-battlecruiser"}
          if unexpected_previews:
              abort("Unreviewed preview names appeared after the audit: " + ", ".join(sorted(unexpected_previews)))
          candidates = sorted(expected_candidates & set(by_name))

          # Every candidate must match the audit's zero-dependency / zero-traffic
          # contract. Any anomaly aborts the entire batch rather than broadening it.
          for name in candidates:
              w = by_name[name]
              m = w["metrics_30d"]
              if m.get("requests") != 0 or m.get("errors") != 0:
                  abort("Candidate has traffic or errors in the 30-day window: " + name)
              if w.get("bindings") != []:
                  abort("Candidate has bindings: " + name)
              if w.get("crons") not in (None, []):
                  abort("Candidate has scheduled events: " + name)
              if w.get("tail_consumers") not in (None, []):
                  abort("Candidate has Tail consumers: " + name)
              if w.get("custom_domains") != [] or w.get("zone_routes") != []:
                  abort("Candidate has a domain or route: " + name)
              if (w.get("workers_dev") or {}).get("status") != 200:
                  abort("Candidate workers.dev metadata is incomplete: " + name)

          # Check every script for service/DO references to candidate names.
          candidate_set = set(candidates)
          for owner in workers:
              for binding in owner.get("bindings") or []:
                  btype = str(binding.get("type", "")).lower()
                  targets = {
                      str(binding.get(k, ""))
                      for k in ("service", "script_name", "namespace", "name")
                      if binding.get(k) is not None
                  }
                  if btype in ("service", "durable_object_namespace", "durable_object") and targets & candidate_set:
                      abort("A Worker binding references a cleanup candidate from " + str(owner.get("name")))

          # Verify the live BattleCruiser CI has exactly one shared PR preview,
          # and that it is the protected worker. Do not assume a closed PR is unused
          # unless the current workflow confirms the single-preview architecture.
          quality_url = "https://raw.githubusercontent.com/Robvg9/battlecruiser/main/.github/workflows/quality.yml"
          req = urllib.request.Request(quality_url, headers={"User-Agent": "RobVG-Cloudflare-Inventory-Cleanup"})
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  quality_text = response.read().decode("utf-8")
          except Exception as exc:
              abort("Could not verify current BattleCruiser preview workflow: " + type(exc).__name__)
          preview_refs = set(re.findall(r"bc-pr-[0-9]+-battlecruiser", quality_text))
          if preview_refs != {"bc-pr-224-battlecruiser"}:
              abort("BattleCruiser quality workflow no longer confirms the single shared bc-pr-224 preview.")

          print("AUDIT_WORKERS=" + str(len(workers)))
          print("VERIFIED_ORPHAN_PREVIEWS=" + str(len(candidates)))
          print("PROTECTED_WORKER_COUNT=" + str(len(PROTECTED)))
          print("ACTIVE_SHARED_PREVIEW=bc-pr-224-battlecruiser")
          print("DELETE_FORCE_PARAMETER=OMITTED")

          headers = {
              "Authorization": "Bearer " + TOKEN,
              "Accept": "application/json",
              "User-Agent": "RobVG-Cloudflare-Inventory-Cleanup"
          }

          def cf_request(path, method="GET"):
              for attempt in range(3):
                  req = urllib.request.Request(BASE + path, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=25) as response:
                          raw = response.read()
                          body = json.loads(raw.decode()) if raw else {}
                          return response.status, body
                  except urllib.error.HTTPError as exc:
                      try:
                          raw = exc.read()
                          body = json.loads(raw.decode()) if raw else {}
                      except Exception:
                          body = {}
                      if exc.code != 429 or attempt == 2:
                          return exc.code, body
                      retry_after = exc.headers.get("Retry-After")
                      try:
                          pause = min(15, max(2, int(retry_after))) if retry_after else (attempt + 1) * 3
                      except Exception:
                          pause = (attempt + 1) * 3
                      time.sleep(pause)
                  except Exception as exc:
                      return 0, {"success": False, "error": type(exc).__name__ + ": " + str(exc)[:200]}
              return 429, {"success": False, "error": "Rate limit retries exhausted"}

          def search_exact(name):
              q = urllib.parse.urlencode({"name": name, "per_page": 100, "page": 1})
              st, body = cf_request(f"/accounts/{ACCOUNT}/workers/scripts-search?{q}")
              if st != 200 or not body.get("success", False):
                  return None, st
              found = body.get("result") or []
              return any((x.get("script_name") == name or x.get("id") == name) for x in found), st

          deleted, skipped, failed = [], [], []
          for index, name in enumerate(candidates, 1):
              exists, st = search_exact(name)
              if exists is None:
                  skipped.append({"name": name, "reason": "fresh existence check failed", "http_status": st})
                  print(f"SKIPPED {index}/{len(candidates)} {name}: existence check HTTP {st}")
                  continue
              if not exists:
                  skipped.append({"name": name, "reason": "already absent"})
                  print(f"ALREADY_ABSENT {index}/{len(candidates)} {name}")
                  continue

              # Critical safety rule: DELETE request has no force=true parameter.
              path = f"/accounts/{ACCOUNT}/workers/scripts/{urllib.parse.quote(name, safe='')}"
              delete_status, delete_body = cf_request(path, method="DELETE")
              if delete_status in (200, 202, 204) and delete_body.get("success", True) is not False:
                  deleted.append(name)
                  print(f"DELETED {index}/{len(candidates)} {name} HTTP {delete_status}")
              elif delete_status == 404:
                  skipped.append({"name": name, "reason": "became absent before delete"})
                  print(f"ALREADY_ABSENT {index}/{len(candidates)} {name}")
              else:
                  failed.append({
                      "name": name,
                      "http_status": delete_status,
                      "error": str(delete_body.get("errors") or delete_body.get("error") or "Delete rejected")[:400]
                  })
                  print(f"NOT_DELETED {index}/{len(candidates)} {name} HTTP {delete_status}")
              time.sleep(0.2)

          # Read-after-write verification of the entire account's Worker inventory.
          all_after, status, error = [], 200, None
          for page in range(1, 101):
              q = urllib.parse.urlencode({"per_page": 100, "page": page})
              st, body = cf_request(f"/accounts/{ACCOUNT}/workers/scripts-search?{q}")
              if st != 200 or not body.get("success", False):
                  status, error = st, body.get("errors") or body.get("error") or "final inventory failed"
                  break
              batch = body.get("result") or []
              all_after.extend(batch)
              info = body.get("result_info") or {}
              if (info.get("total_pages") is not None and page >= info["total_pages"]) or len(batch) < 100:
                  break
          if status != 200:
              abort("Deletion calls completed but final verification could not list Workers: " + str(error))
          remaining_names = {
              x.get("script_name") or x.get("id")
              for x in all_after if isinstance(x, dict)
          }
          confirmed_absent = sorted(expected_candidates - remaining_names)
          still_present = sorted(expected_candidates & remaining_names)
          protected_still_present = sorted(PROTECTED & remaining_names)
          report = {
              "generated_at": dt.datetime.now(dt.timezone.utc).isoformat(),
              "source_inventory_generated_at": audit["generated_at"],
              "account_id_suffix": ACCOUNT[-6:],
              "source_inventory_run": os.environ.get("GITHUB_RUN_ID"),
              "approved_candidate_count": len(expected_candidates),
              "candidate_present_count_before_delete": len(candidates),
              "candidate_names_approved": sorted(expected_candidates),
              "deleted_api_success": deleted,
              "already_absent_or_skipped": skipped,
              "delete_rejections": failed,
              "confirmed_absent_after_delete": confirmed_absent,
              "still_present_after_delete": still_present,
              "protected_workers_still_present": protected_still_present,
              "delete_force_parameter_used": False,
              "supabase_accessed": False,
              "mission_state_mutated": False
          }
          with open(REPORT_PATH, "w", encoding="utf-8") as f:
              json.dump(report, f, indent=2)
          print("CLEANUP_SUMMARY=" + json.dumps({
              "approved_candidates": len(expected_candidates),
              "present_at_start": len(candidates),
              "deleted_api_success": len(deleted),
              "confirmed_absent_after_delete": len(confirmed_absent),
              "already_absent_or_skipped": len(skipped),
              "delete_rejections": len(failed),
              "still_present_after_delete": len(still_present),
              "protected_present": protected_still_present,
              "force": False
          }))
          if still_present or len(confirmed_absent) != len(expected_candidates) or len(protected_still_present) != len(PROTECTED):
              raise SystemExit(1)
          PY

      - name: Persist cleanup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-workers-cleanup-report
          path: cloudflare-workers-cleanup-report.json
          if-no-files-found: warn
          retention-days: 90
