# ARIA Windows 101 certification without action-download dependency
name: ARIA Windows 101 Force Certification

on:
  push:
    branches: [main]
    paths:
      - 'computer-use/**'
      - 'tests/windows-desktop-physical-e2e.js'
      - 'agents/windows/**'
      - '.github/workflows/aria-windows-101-force-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Prepare physical-101 source without checkout
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'D:\ARIA-Windows-Agent\Runtime\windows\101-src'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$root\tests","$root\computer-use" | Out-Null
          $base = "https://raw.githubusercontent.com/Robvg9/aria-worker/$env:GITHUB_SHA"
          $files = @(
            @{ remote='tests/windows-desktop-physical-e2e.js'; local="$root\tests\windows-desktop-physical-e2e.js" },
            @{ remote='computer-use/windows-desktop-adapter.js'; local="$root\computer-use\windows-desktop-adapter.js" },
            @{ remote='computer-use/windows-desktop-runner.ps1'; local="$root\computer-use\windows-desktop-runner.ps1" },
            @{ remote='computer-use/windows-ui-automation.ps1'; local="$root\computer-use\windows-ui-automation.ps1" },
            @{ remote='computer-use/windows-hotkey-runner.ps1'; local="$root\computer-use\windows-hotkey-runner.ps1" }
          )
          foreach ($f in $files) {
            Invoke-WebRequest -UseBasicParsing -Uri "$base/$($f.remote)" -OutFile $f.local -TimeoutSec 45
            if (-not (Test-Path $f.local)) { throw "DOWNLOAD_FAILED $($f.remote)" }
          }
          node --check "$root\tests\windows-desktop-physical-e2e.js"
          node --check "$root\computer-use\windows-desktop-adapter.js"
          Write-Host 'ARIA_101_SOURCE=PASS'

      - name: Verify interactive watchdog and agent
        run: |
          $ErrorActionPreference = 'Stop'
          $wd = Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.SessionId -ne 0 -and $_.CommandLine -and $_.CommandLine -match 'run-agent\.ps1' } |
            Select-Object -First 1
          if (-not $wd) { throw 'INTERACTIVE_WATCHDOG_NOT_FOUND' }
          $ag = Get-Process -Name node -ErrorAction SilentlyContinue |
            Where-Object { $_.SessionId -ne 0 } |
            Select-Object -First 1
          if (-not $ag) { throw 'INTERACTIVE_NODE_AGENT_NOT_FOUND' }
          Write-Host "ARIA_WATCHDOG_SESSION=$($wd.SessionId)"
          Write-Host "ARIA_NODE_SESSION=$($ag.SessionId)"
          Write-Host 'ARIA_INTERACTIVE_RUNTIME=PASS'

      - name: Run physical 101
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'D:\ARIA-Windows-Agent\Runtime\windows\101-src'
          $request = 'D:\ARIA-Windows-Agent\Logs\desktop-101-request.json'
          $result = 'D:\ARIA-Windows-Agent\Logs\desktop-101-result.json'
          $log = 'D:\ARIA-Windows-Agent\Logs\desktop-101-child.log'
          $err = 'D:\ARIA-Windows-Agent\Logs\desktop-101-child.err'
          Remove-Item $request,$result,$log,$err -Force -ErrorAction SilentlyContinue
          $node = (Get-Command node -ErrorAction Stop).Source
          [ordered]@{
            node = $node
            script = "$root\tests\windows-desktop-physical-e2e.js"
            working_directory = $root
            log = $log
            error_log = $err
            requested_at = (Get-Date -Format o)
          } | ConvertTo-Json -Depth 10 | Set-Content -Path $request -Encoding UTF8 -Force
          Write-Host 'ARIA_DESKTOP_101_REQUEST=WRITTEN'
          $finished = $false
          for ($i=0; $i -lt 210; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path $result) { $finished=$true; break }
          }
          if (Test-Path $log) { Get-Content $log -Tail 300 }
          if (Test-Path $err) { Get-Content $err -Tail 150 }
          if (-not $finished) {
            if (Test-Path 'D:\ARIA-Windows-Agent\Logs\watchdog.log') { Get-Content 'D:\ARIA-Windows-Agent\Logs\watchdog.log' -Tail 150 }
            throw 'PHYSICAL_101_TIMEOUT'
          }
          $proof = Get-Content -Raw $result | ConvertFrom-Json
          Write-Host ("ARIA_DESKTOP_101_CHILD_SESSION=" + $proof.child_session_id)
          Write-Host ("ARIA_DESKTOP_101_EXIT=" + $proof.exit_code)
          Write-Host ("ARIA_DESKTOP_101_STATUS=" + $proof.status)
          if ($proof.status -ne 'succeeded' -or [int]$proof.exit_code -ne 0) {
            throw ("PHYSICAL_101_FAILED: " + $proof.error)
          }
          Write-Host 'ARIA_DESKTOP_101=PASS'

      - name: Verify heartbeat
        env:
          ARIA_DEVICE_TOKEN: ${{ secrets.ARIA_DEVICE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:ARIA_DEVICE_TOKEN)) { throw 'ARIA_DEVICE_TOKEN_MISSING' }
          $deviceId = 'windows-fe722cc6681e4f9c9cc35f5ebbb0a089'
          $url = 'https://icuqsstxfdbvjytkhlog.supabase.co/functions/v1/aria-device-gateway'
          $headers = @{ Authorization = "Bearer $env:ARIA_DEVICE_TOKEN"; 'x-aria-device-id' = $deviceId; 'content-type' = 'application/json' }
          $body = @{ device_id=$deviceId; agent_type='windows-local'; capabilities=@('ollama.qwen3','shell.execute','computer.use','computer.use.autonomous') } | ConvertTo-Json
          $h = Invoke-RestMethod -Uri "$url/v1/devices/heartbeat" -Headers $headers -Method Post -Body $body -TimeoutSec 20
          if ($null -eq $h) { throw 'HEARTBEAT_EMPTY' }
          Write-Host 'GATEWAY_HEARTBEAT=PASS'

      - name: Emit authoritative proof
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $result = 'D:\ARIA-Windows-Agent\Logs\desktop-101-result.json'
          $dir='D:\ARIA-Windows-Agent\Logs'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $status='failed'; $exit=$null; $childSession=$null
          if (Test-Path $result) {
            try {
              $p=Get-Content -Raw $result | ConvertFrom-Json
              $status=[string]$p.status
              if ($null -ne $p.exit_code) { $exit=[int]$p.exit_code }
              if ($null -ne $p.child_session_id) { $childSession=[int]$p.child_session_id }
            } catch {}
          }
          $proof=[ordered]@{
            commit=$env:GITHUB_SHA
            workflow='ARIA Windows 101 Force Certification'
            outcome=if($status -eq 'succeeded' -and $exit -eq 0){'success'}else{'failed'}
            result_status=$status
            exit_code=$exit
            child_session_id=$childSession
            timestamp=(Get-Date -Format o)
            adapter='aria-windows-desktop-v1.9'
          }
          $proofPath=Join-Path $dir 'windows-desktop-101-authoritative-proof.json'
          $proof | ConvertTo-Json -Depth 8 | Set-Content -Path $proofPath -Encoding UTF8
          Write-Host ("ARIA_101_PROOF=" + ($proof | ConvertTo-Json -Compress))
