name: ARIA Windows 101 Force Certification

on:
  push:
    branches: [main]
    paths:
      - 'computer-use/**'
      - 'agents/windows/**'
      - '.github/workflows/aria-windows-101-force-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stop stale ARIA processes
        run: |
          $ErrorActionPreference = 'Continue'
          Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -and $_.CommandLine -match 'aria-agent\.js' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          $watchdogPidFile = 'D:\ARIA-Windows-Agent\Logs\watchdog.pid'
          if (Test-Path $watchdogPidFile) {
            $watchdogPid = 0
            $raw = (Get-Content -Raw $watchdogPidFile).Trim()
            if ([int]::TryParse($raw, [ref]$watchdogPid) -and $watchdogPid -gt 0) {
              Stop-Process -Id $watchdogPid -Force -ErrorAction SilentlyContinue
            }
          }
          Start-Sleep -Seconds 2
          Write-Host 'ARIA_STALE_PROCESSES_STOPPED=PASS'

      - name: Sync canonical runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'D:\ARIA-Windows-Agent\Runtime\windows'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item 'agents\windows\aria-agent.js' (Join-Path $root 'aria-agent.js') -Force
          Copy-Item 'agents\windows\run-agent.ps1' (Join-Path $root 'run-agent.ps1') -Force
          Copy-Item 'autonomy\windows-shell-executor.js' (Join-Path $root 'windows-shell-executor.js') -Force
          foreach ($name in @('windows-desktop-adapter.js','windows-desktop-runner.ps1','windows-ui-automation.ps1','windows-hotkey-runner.ps1')) {
            Copy-Item (Join-Path 'computer-use' $name) (Join-Path $root $name) -Force
          }
          node --check (Join-Path $root 'aria-agent.js')
          node --check (Join-Path $root 'windows-shell-executor.js')
          node --check (Join-Path $root 'windows-desktop-adapter.js')
          Write-Host 'ARIA_D_RUNTIME_SYNC=PASS'

      - name: Ensure machine-scope token is present
        env:
          ARIA_DEVICE_TOKEN: ${{ secrets.ARIA_DEVICE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tokenPath = 'D:\ARIA-Windows-Agent\Data\device-token.dpapi'
          if ([string]::IsNullOrWhiteSpace($env:ARIA_DEVICE_TOKEN) -or $env:ARIA_DEVICE_TOKEN.Length -lt 32) { throw 'ARIA_DEVICE_TOKEN repository secret is missing or invalid' }
          if (-not (Test-Path $tokenPath)) {
            Add-Type -AssemblyName System.Security
            $bytes = [Text.Encoding]::UTF8.GetBytes($env:ARIA_DEVICE_TOKEN)
            $protected = [Security.Cryptography.ProtectedData]::Protect($bytes,$null,[Security.Cryptography.DataProtectionScope]::LocalMachine)
            $payload = 'ARIA-DPAPI-MACHINE-V1:' + [Convert]::ToBase64String($protected)
            Set-Content -Path $tokenPath -Value $payload -Encoding ASCII -Force
          }
          $raw = (Get-Content -Raw $tokenPath).Trim()
          if (-not $raw.StartsWith('ARIA-DPAPI-MACHINE-V1:')) { throw 'TOKEN_STORE_NOT_MACHINE_SCOPE' }
          Write-Host 'TOKEN_MACHINE_SCOPE=PASS'

      - name: Start watchdog in interactive user session
        run: |
          $ErrorActionPreference = 'Stop'
          $launcher = Join-Path $env:GITHUB_WORKSPACE 'agents\windows\start-interactive-process.ps1'
          $runtime = 'D:\ARIA-Windows-Agent\Runtime\windows\run-agent.ps1'
          $logPath = 'D:\ARIA-Windows-Agent\Logs\watchdog.log'
          $pidPath = 'D:\ARIA-Windows-Agent\Logs\agent.pid'
          $args = '-NoProfile -ExecutionPolicy Bypass -File "{0}"' -f $runtime
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher -FilePath 'powershell.exe' -Arguments $args -WorkingDirectory 'D:\ARIA-Windows-Agent\Runtime\windows'
          if ($LASTEXITCODE -ne 0) { throw "interactive watchdog launcher failed with exit code $LASTEXITCODE" }
          $live = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path $pidPath) {
              $agentPid = 0
              $rawPid = (Get-Content -Raw $pidPath).Trim()
              if ([int]::TryParse($rawPid, [ref]$agentPid) -and $agentPid -gt 0) {
                $proc = Get-Process -Id $agentPid -ErrorAction SilentlyContinue
                if ($proc -and $proc.SessionId -ne 0) { $live = $true; break }
              }
            }
          }
          if (-not $live) { if (Test-Path $logPath) { Get-Content $logPath -Tail 80 }; throw 'ARIA interactive agent did not start' }
          Write-Host 'ARIA_INTERACTIVE_AGENT=PASS'

      - name: Physical 101 desktop E2E in interactive session
        run: |
          $ErrorActionPreference = 'Stop'
          $launcher = Join-Path $env:GITHUB_WORKSPACE 'agents\windows\start-interactive-process.ps1'
          $work = $env:GITHUB_WORKSPACE
          $test = Join-Path $work 'tests\windows-desktop-physical-e2e.js'
          $runnerScript = Join-Path $env:RUNNER_TEMP 'aria-windows-101-user-run.ps1'
          $log = 'D:\ARIA-Windows-Agent\Logs\windows-101-interactive.log'
          $exitFile = 'D:\ARIA-Windows-Agent\Logs\windows-101-interactive.exit'
          Remove-Item $log, $exitFile -Force -ErrorAction SilentlyContinue
          $runnerContent = @(
            '$ErrorActionPreference = "Continue"',
            ('& node "{0}" *> "{1}"' -f $test,$log),
            '$code = $LASTEXITCODE',
            ('Set-Content -Path "{0}" -Value $code -Encoding ASCII -Force' -f $exitFile)
          ) -join [Environment]::NewLine
          Set-Content -Path $runnerScript -Value $runnerContent -Encoding UTF8
          $runnerArgs = '-NoProfile -ExecutionPolicy Bypass -File "{0}"' -f $runnerScript
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher -FilePath 'powershell.exe' -Arguments $runnerArgs -WorkingDirectory $work
          if ($LASTEXITCODE -ne 0) { throw "interactive physical-test launcher failed with exit code $LASTEXITCODE" }
          $finished = $false
          for ($i = 0; $i -lt 100; $i++) { Start-Sleep -Seconds 2; if (Test-Path $exitFile) { $finished = $true; break } }
          if (-not $finished) { if (Test-Path $log) { Get-Content $log -Tail 160 }; throw 'Physical 101 interactive test timed out' }
          if (Test-Path $log) { Get-Content $log -Tail 200 }
          $code = [int](Get-Content -Raw $exitFile).Trim()
          if ($code -ne 0) { throw "Physical 101 E2E failed with exit code $code" }
          Write-Host 'ARIA_DESKTOP_101=PASS'

      - name: Verify fresh Windows heartbeat
        env:
          ARIA_DEVICE_TOKEN: ${{ secrets.ARIA_DEVICE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $deviceId = 'windows-fe722cc6681e4f9c9cc35f5ebbb0a089'
          $url = 'https://icuqsstxfdbvjytkhlog.supabase.co/functions/v1/aria-device-gateway'
          $headers = @{ Authorization = "Bearer $env:ARIA_DEVICE_TOKEN"; 'x-aria-device-id' = $deviceId; 'content-type' = 'application/json' }
          $body = @{ device_id = $deviceId; agent_type = 'windows-local'; capabilities = @('ollama.qwen3','shell.execute','computer.use','computer.use.autonomous') } | ConvertTo-Json
          $heartbeat = Invoke-RestMethod -Uri "$url/v1/devices/heartbeat" -Headers $headers -Method Post -Body $body -TimeoutSec 15
          if ($null -eq $heartbeat) { throw 'Gateway heartbeat returned empty response' }
          Write-Host 'GATEWAY_HEARTBEAT=PASS'

      - name: Create 101 proof
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:GITHUB_WORKSPACE 'reports'
          $file = Join-Path $dir 'windows-desktop-101-proof.json'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $outcome = 'failed'
          if (Test-Path 'D:\ARIA-Windows-Agent\Logs\windows-101-interactive.exit') {
            $code = [int](Get-Content -Raw 'D:\ARIA-Windows-Agent\Logs\windows-101-interactive.exit').Trim()
            if ($code -eq 0) { $outcome = 'success' }
          }
          [ordered]@{ commit=$env:GITHUB_SHA; workflow='ARIA Windows 101 Force Certification'; outcome=$outcome; timestamp=(Get-Date -Format o); adapter='aria-windows-desktop-v1.9'; physical_agent='windows-fe722cc6681e4f9c9cc35f5ebbb0a089' } | ConvertTo-Json -Depth 6 | Set-Content -Path $file -Encoding UTF8

      - name: Upload 101 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-windows-101-proof
          path: reports/windows-desktop-101-proof.json
          if-no-files-found: error