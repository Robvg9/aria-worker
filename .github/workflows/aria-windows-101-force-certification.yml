name: ARIA Windows 101 Force Certification

# Scheduler wake-up after runner session recovery 2026-09-26

on:
  push:
    branches: [main]
    paths:
      - 'computer-use/**'
      - 'agents/windows/**'
      - '.github/workflows/aria-windows-101-force-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync canonical runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'D:\ARIA-Windows-Agent\Runtime\windows'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item 'agents\windows\aria-agent.js' (Join-Path $root 'aria-agent.js') -Force
          Copy-Item 'agents\windows\run-agent.ps1' (Join-Path $root 'run-agent.ps1') -Force
          Copy-Item 'autonomy\windows-shell-executor.js' (Join-Path $root 'windows-shell-executor.js') -Force
          foreach ($name in @('windows-desktop-adapter.js','windows-desktop-runner.ps1','windows-ui-automation.ps1','windows-hotkey-runner.ps1')) {
            Copy-Item (Join-Path 'computer-use' $name) (Join-Path $root $name) -Force
          }
          node --check (Join-Path $root 'aria-agent.js')
          node --check (Join-Path $root 'windows-shell-executor.js')
          node --check (Join-Path $root 'windows-desktop-adapter.js')
          Write-Host 'ARIA_D_RUNTIME_SYNC=PASS'

      - name: Ensure machine-scope token is present
        env:
          ARIA_DEVICE_TOKEN: ${{ secrets.ARIA_DEVICE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tokenPath = 'D:\ARIA-Windows-Agent\Data\device-token.dpapi'
          if ([string]::IsNullOrWhiteSpace($env:ARIA_DEVICE_TOKEN) -or $env:ARIA_DEVICE_TOKEN.Length -lt 32) { throw 'ARIA_DEVICE_TOKEN repository secret is missing or invalid' }
          if (-not (Test-Path $tokenPath)) {
            Add-Type -AssemblyName System.Security
            $bytes = [Text.Encoding]::UTF8.GetBytes($env:ARIA_DEVICE_TOKEN)
            $protected = [Security.Cryptography.ProtectedData]::Protect($bytes,$null,[Security.Cryptography.DataProtectionScope]::LocalMachine)
            $payload = 'ARIA-DPAPI-MACHINE-V1:' + [Convert]::ToBase64String($protected)
            Set-Content -Path $tokenPath -Value $payload -Encoding ASCII -Force
          }
          $raw = (Get-Content -Raw $tokenPath).Trim()
          if (-not $raw.StartsWith('ARIA-DPAPI-MACHINE-V1:')) { throw 'TOKEN_STORE_NOT_MACHINE_SCOPE' }
          Write-Host 'TOKEN_MACHINE_SCOPE=PASS'

      - name: Ensure interactive watchdog and agent are active
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = 'D:\ARIA-Windows-Agent\Logs\watchdog.log'
          $watchdogPidPath = 'D:\ARIA-Windows-Agent\Logs\watchdog.pid'
          $agentPidPath = 'D:\ARIA-Windows-Agent\Logs\agent.pid'
          $watchdogLive = $false
          $agentLive = $false

          for ($i = 0; $i -lt 45; $i++) {
            if (Test-Path $watchdogPidPath) {
              $watchdogPid = 0
              $raw = (Get-Content -Raw $watchdogPidPath).Trim()
              if ([int]::TryParse($raw, [ref]$watchdogPid) -and $watchdogPid -gt 0) {
                $proc = Get-Process -Id $watchdogPid -ErrorAction SilentlyContinue
                if ($proc -and $proc.SessionId -ne 0) {
                  $watchdogLive = $true
                  Write-Host "ARIA_WATCHDOG_PID=$watchdogPid"
                  Write-Host "ARIA_WATCHDOG_SESSION_ID=$($proc.SessionId)"
                }
              }
            }

            if (-not $watchdogLive) {
              $wd = Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.SessionId -ne 0 -and
                  $_.CommandLine -and
                  $_.CommandLine -match 'run-agent\.ps1'
                } |
                Select-Object -First 1
              if ($wd) {
                Set-Content -Path $watchdogPidPath -Value $wd.ProcessId -Encoding ASCII -Force
                $watchdogLive = $true
                Write-Host "ARIA_WATCHDOG_PID=$($wd.ProcessId)"
                Write-Host "ARIA_WATCHDOG_SESSION_ID=$($wd.SessionId)"
              }
            }

            if (Test-Path $agentPidPath) {
              $agentPid = 0
              $rawAgent = (Get-Content -Raw $agentPidPath).Trim()
              if ([int]::TryParse($rawAgent, [ref]$agentPid) -and $agentPid -gt 0) {
                $proc = Get-Process -Id $agentPid -ErrorAction SilentlyContinue
                if ($proc -and $proc.SessionId -ne 0) {
                  $agentLive = $true
                  Write-Host "ARIA_AGENT_PID=$agentPid"
                  Write-Host "ARIA_AGENT_SESSION_ID=$($proc.SessionId)"
                }
              }
            }

            if ($watchdogLive -and $agentLive) { break }
            Start-Sleep -Seconds 2
          }

          if (-not $watchdogLive) {
            if (Test-Path $logPath) { Get-Content $logPath -Tail 160 }
            throw 'Interactive watchdog process is not alive in a user session'
          }

          if (-not $agentLive) {
            if (Test-Path $logPath) { Get-Content $logPath -Tail 160 }
            throw 'Interactive ARIA agent process is not alive in a user session'
          }

          Write-Host 'ARIA_INTERACTIVE_WATCHDOG=PASS'
          Write-Host 'ARIA_INTERACTIVE_AGENT=PASS'

      - name: Physical 101 desktop E2E in interactive session
        run: |
          $ErrorActionPreference = 'Stop'
          $work = $env:GITHUB_WORKSPACE
          $test = Join-Path $work 'tests\windows-desktop-physical-e2e.js'
          $request = 'D:\ARIA-Windows-Agent\Logs\desktop-101-request.json'
          $result = 'D:\ARIA-Windows-Agent\Logs\desktop-101-result.json'
          $log = 'D:\ARIA-Windows-Agent\Logs\desktop-101-child.log'
          $err = 'D:\ARIA-Windows-Agent\Logs\desktop-101-child.err'
          Remove-Item $request, $result, $log, $err -Force -ErrorAction SilentlyContinue

          $node = (Get-Command node -ErrorAction Stop).Source
          $payload = [ordered]@{
            node = $node
            script = $test
            working_directory = $work
            log = $log
            error_log = $err
            requested_at = (Get-Date -Format o)
          } | ConvertTo-Json -Depth 10

          Set-Content -Path $request -Value $payload -Encoding UTF8 -Force
          Write-Host 'ARIA_DESKTOP_101_REQUEST=WRITTEN'

          $finished = $false
          for ($i = 0; $i -lt 210; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path $result) { $finished = $true; break }
          }

          if (Test-Path $log) { Get-Content $log -Tail 240 }
          if (Test-Path $err) { Get-Content $err -Tail 120 }

          if (-not $finished) {
            if (Test-Path 'D:\ARIA-Windows-Agent\Logs\watchdog.log') { Get-Content 'D:\ARIA-Windows-Agent\Logs\watchdog.log' -Tail 120 }
            throw 'Physical 101 interactive request timed out'
          }

          $proof = Get-Content -Raw $result | ConvertFrom-Json
          Write-Host "ARIA_DESKTOP_101_CHILD_SESSION=$($proof.child_session_id)"
          Write-Host "ARIA_DESKTOP_101_EXIT=$($proof.exit_code)"
          if ($proof.status -ne 'succeeded' -or [int]$proof.exit_code -ne 0) {
            throw "Physical 101 E2E failed in interactive agent session: $($proof.error)"
          }

          Write-Host 'ARIA_DESKTOP_101=PASS'
      - name: Verify fresh Windows heartbeat
        env:
          ARIA_DEVICE_TOKEN: ${{ secrets.ARIA_DEVICE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $deviceId = 'windows-fe722cc6681e4f9c9cc35f5ebbb0a089'
          $url = 'https://icuqsstxfdbvjytkhlog.supabase.co/functions/v1/aria-device-gateway'
          $headers = @{ Authorization = "Bearer $env:ARIA_DEVICE_TOKEN"; 'x-aria-device-id' = $deviceId; 'content-type' = 'application/json' }
          $body = @{ device_id = $deviceId; agent_type = 'windows-local'; capabilities = @('ollama.qwen3','shell.execute','computer.use','computer.use.autonomous') } | ConvertTo-Json
          $heartbeat = Invoke-RestMethod -Uri "$url/v1/devices/heartbeat" -Headers $headers -Method Post -Body $body -TimeoutSec 15
          if ($null -eq $heartbeat) { throw 'Gateway heartbeat returned empty response' }
          Write-Host 'GATEWAY_HEARTBEAT=PASS'

      - name: Create 101 proof
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:GITHUB_WORKSPACE 'reports'
          $file = Join-Path $dir 'windows-desktop-101-proof.json'
          $result = 'D:\ARIA-Windows-Agent\Logs\desktop-101-result.json'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $outcome = 'failed'
          $exitCode = $null
          $resultStatus = $null
          if (Test-Path $result) {
            try {
              $proof = Get-Content -Raw $result | ConvertFrom-Json
              $resultStatus = [string]$proof.status
              $exitCode = [int]$proof.exit_code
              if ($resultStatus -eq 'succeeded' -and $exitCode -eq 0) {
                $outcome = 'success'
              }
            } catch {}
          }

          [ordered]@{
            commit = $env:GITHUB_SHA
            workflow = 'ARIA Windows 101 Force Certification'
            outcome = $outcome
            result_status = $resultStatus
            exit_code = $exitCode
            timestamp = (Get-Date -Format o)
            adapter = 'aria-windows-desktop-v1.9'
            physical_agent = 'windows-fe722cc6681e4f9c9cc35f5ebbb0a089'
          } | ConvertTo-Json -Depth 8 | Set-Content -Path $file -Encoding UTF8
          
      - name: Upload 101 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-windows-101-proof
          path: reports/windows-desktop-101-proof.json
          if-no-files-found: error