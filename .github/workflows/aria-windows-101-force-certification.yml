name: ARIA Windows 101 Force Certification

on:
  push:
    branches: [main]
    paths:
      - 'computer-use/**'
      - 'agents/windows/**'
      - '.github/workflows/aria-windows-101-force-certification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stop stale service-session ARIA agent only
        run: |
          $ErrorActionPreference = 'Stop'
          $procs = Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -and $_.CommandLine -match 'aria-agent\.js' }
          $stopped = 0
          foreach ($p in $procs) {
            $proc = Get-Process -Id $p.ProcessId -ErrorAction SilentlyContinue
            if ($proc -and $proc.SessionId -eq 0) {
              Write-Host "STOP_SERVICE_SESSION_ARIA_PID=$($p.ProcessId)"
              Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
              $stopped++
            } else {
              Write-Host "KEEP_INTERACTIVE_ARIA_PID=$($p.ProcessId) SESSION=$($proc.SessionId)"
            }
          }
          Start-Sleep -Seconds 2
          Write-Host "ARIA_SERVICE_SESSION_STOP_COUNT=$stopped"
          Write-Host 'ARIA_INTERACTIVE_PROCESS_PRESERVED=True'

      - name: Sync canonical runtime to D
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'D:\ARIA-Windows-Agent\Runtime\windows'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item 'agents\windows\aria-agent.js' (Join-Path $root 'aria-agent.js') -Force
          Copy-Item 'agents\windows\run-agent.ps1' (Join-Path $root 'run-agent.ps1') -Force
          Copy-Item 'autonomy\windows-shell-executor.js' (Join-Path $root 'windows-shell-executor.js') -Force
          foreach ($f in @('windows-desktop-adapter.js','windows-desktop-runner.ps1','windows-ui-automation.ps1','windows-hotkey-runner.ps1')) {
            Copy-Item (Join-Path 'computer-use' $f) (Join-Path $root $f) -Force
          }
          node --check (Join-Path $root 'aria-agent.js')
          node --check (Join-Path $root 'windows-shell-executor.js')
          node --check (Join-Path $root 'windows-desktop-adapter.js')
          if (-not (Test-Path (Join-Path $root 'windows-hotkey-runner.ps1'))) { throw 'hotkey runner missing after sync' }
          Write-Host 'ARIA_D_RUNTIME_SYNC=PASS'

      - name: Inspect ARIA interactive agent signal
        run: |
          $ErrorActionPreference = 'Continue'
          $logDir = 'D:\ARIA-Windows-Agent\Logs'
          $pidPath = Join-Path $logDir 'agent.pid'
          $found = $false

          if (Test-Path $pidPath) {
            $rawPid = (Get-Content -Raw $pidPath).Trim()
            $pid = 0
            if ([int]::TryParse($rawPid, [ref]$pid) -and $pid -gt 0) {
              $proc = Get-Process -Id $pid -ErrorAction SilentlyContinue
              if ($proc) {
                $found = $true
                Write-Host 'ARIA_INTERACTIVE_AGENT_SIGNAL=FOUND'
                Write-Host "ARIA_AGENT_PID=$($proc.Id)"
                Write-Host "ARIA_AGENT_SESSION_ID=$($proc.SessionId)"
              }
            }
          }

          if (-not $found) {
            $cim = Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine -match 'aria-agent\.js' } |
              Select-Object -First 1
            if ($cim) {
              Write-Host 'ARIA_AGENT_PROCESS_SIGNAL=FOUND'
              Write-Host "ARIA_AGENT_PID=$($cim.ProcessId)"
            } else {
              Write-Host 'ARIA_INTERACTIVE_AGENT_SIGNAL=NOT_DETECTED'
            }
          }

          # Do not fail here. The actual Physical 101 E2E below is the
          # authoritative test of desktop control and recovery.
          exit 0

      - name: Physical 101 certification
        run: |
          $ErrorActionPreference = 'Stop'
          node (Join-Path $env:GITHUB_WORKSPACE 'tests\windows-desktop-physical-e2e.js')
          if ($LASTEXITCODE -ne 0) { throw "Physical 101 E2E failed with exit code $LASTEXITCODE" }
          Write-Host 'ARIA_DESKTOP_101=PASS'

      - name: Publish 101 proof
        if: always()
        env:
          GITHUB_JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:GITHUB_WORKSPACE 'reports'
          $file = Join-Path $dir 'windows-desktop-101-proof.json'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $payload = [ordered]@{
            commit = $env:GITHUB_SHA
            workflow = 'ARIA Windows 101 Force Certification'
            outcome = [string]$env:GITHUB_JOB_STATUS
            timestamp = (Get-Date -Format o)
            adapter = 'aria-windows-desktop-v1.9'
            physical_agent = 'windows-fe722cc6681e4f9c9cc35f5ebbb0a089'
          }
          $payload | ConvertTo-Json -Depth 6 | Set-Content -Path $file -Encoding UTF8
          git config user.name 'aria-runtime-proof'
          git config user.email 'aria-runtime-proof@users.noreply.github.com'
          git add reports/windows-desktop-101-proof.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No proof changes to commit'
          } else {
            git commit -m "ci: publish Windows 101 certification proof"
            if ($LASTEXITCODE -ne 0) { throw 'proof git commit failed' }
          }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'proof git push failed' }
