name: ARIA Autonomous Windows Qwen3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full regression suite
        run: npm test
      - name: Autonomous Windows Qwen3 mission contract
        run: node tests/autonomous-windows-qwen3.test.js
