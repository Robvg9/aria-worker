name: Deploy ARIA MCP Inbound Grok

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/aria-mcp-inbound-grok-v1/**'
      - '.github/workflows/deploy-aria-mcp-inbound-grok.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full inbound source and separate ISSUER
        run: |
          set -euo pipefail
          # Recover from accidental PLACEHOLDER commits
          git show 4f52636dd50222b49ad3cb6041ddcf83046d3983:supabase/functions/aria-mcp-inbound-grok-v1/index.ts \
            > supabase/functions/aria-mcp-inbound-grok-v1/index.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/aria-mcp-inbound-grok-v1/index.ts')
          s = p.read_text()
          assert 'issueAccessToken' in s and 'tools/call' in s
          old = '''const RESOURCE =
  Deno.env.get("ARIA_MCP_INBOUND_RESOURCE") ??
  "https://icuqsstxfdbvjytkhlog.supabase.co/functions/v1/aria-mcp-inbound-grok-v1";

const ISSUER = RESOURCE;'''
          new = '''const RESOURCE =
  Deno.env.get("ARIA_MCP_INBOUND_RESOURCE") ??
  "https://icuqsstxfdbvjytkhlog.supabase.co/functions/v1/aria-mcp-inbound-grok-v1";

// Worker facade: RESOURCE=.../mcp (aud), ISSUER=Worker origin (iss / AS id).
const ISSUER =
  Deno.env.get("ARIA_MCP_INBOUND_ISSUER") ??
  RESOURCE;'''
          if old not in s:
              raise SystemExit('RESOURCE/ISSUER block missing')
          s = s.replace(old, new, 1)
          old2 = '''function wwwAuthenticate(): string {
  const meta = `${RESOURCE}/.well-known/oauth-protected-resource`;
  return `Bearer realm="aria-mcp-inbound", resource="${RESOURCE}", resource_metadata="${meta}"`;
}'''
          new2 = '''function wwwAuthenticate(): string {
  const meta =
    ISSUER !== RESOURCE
      ? `${ISSUER}/.well-known/oauth-protected-resource/mcp`
      : `${RESOURCE}/.well-known/oauth-protected-resource`;
  return `Bearer realm="aria-mcp-inbound", resource="${RESOURCE}", resource_metadata="${meta}"`;
}'''
          if old2 not in s:
              raise SystemExit('wwwAuthenticate missing')
          s = s.replace(old2, new2, 1)
          # Ensure OAuth guard on all MCP methods
          marker = '''  if (req.method === "OPTIONS") {\n'''
          guard = '''  // Grok Web requires the OAuth challenge during the initial MCP handshake.\n  const publicOAuthPath =\n    path.includes("/.well-known/oauth-protected-resource") ||\n    path.includes("/.well-known/oauth-authorization-server") ||\n    path.endsWith("/register") ||\n    path.endsWith("/authorize") ||\n    path.endsWith("/authorize/consent") ||\n    path.endsWith("/token");\n\n  if (!publicOAuthPath && req.method !== "OPTIONS") {\n    const access = await verifyAccessToken(bearer(req));\n    if (!access) {\n      return json(401, { error: "unauthorized" }, {\n        "WWW-Authenticate": wwwAuthenticate(),\n      });\n    }\n  }\n\n'''
          if guard.strip() not in s and marker in s:
              s = s.replace(marker, guard + marker, 1)
          p.write_text(s)
          print('source ready', len(s))
          PY
          test "$(wc -c < supabase/functions/aria-mcp-inbound-grok-v1/index.ts)" -gt 20000
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Offline OAuth crypto tests
        run: node tests/oauth-crypto.test.js
      - name: Set RESOURCE and ISSUER secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          supabase secrets set \
            ARIA_MCP_INBOUND_RESOURCE=https://aria.robvg9.workers.dev/mcp \
            ARIA_MCP_INBOUND_ISSUER=https://aria.robvg9.workers.dev \
            --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy aria-mcp-inbound-grok-v1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy aria-mcp-inbound-grok-v1 \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt
      - name: Live validation
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          BASE="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/aria-mcp-inbound-grok-v1"
          RESOURCE="https://aria.robvg9.workers.dev/mcp"
          ISSUER="https://aria.robvg9.workers.dev"

          prm=$(curl --fail --silent --show-error --retry 3 "$BASE/.well-known/oauth-protected-resource")
          echo "PRM=$prm"
          echo "$prm" | python3 -c "import sys,json; x=json.load(sys.stdin); assert x['resource']=='$RESOURCE'; assert x['authorization_servers']==['$ISSUER']"

          asm=$(curl --fail --silent --show-error --retry 3 "$BASE/.well-known/oauth-authorization-server")
          echo "ASM=$asm"
          echo "$asm" | python3 -c "import sys,json; x=json.load(sys.stdin); assert x['issuer']=='$ISSUER'; assert x['authorization_endpoint']=='$ISSUER/authorize'; assert 'S256' in x['code_challenge_methods_supported']"

          hdr=$(mktemp)
          code=$(curl -s -D "$hdr" -o /dev/null -w '%{http_code}' -X POST "$BASE" -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          test "$code" = "401"
          grep -qi 'resource_metadata' "$hdr"

          reg=$(curl --fail --silent -X POST "$BASE/register" -H 'Content-Type: application/json' \
            -d '{"client_name":"aria-ci","redirect_uris":["https://grok.com/connectors-oauth-exchange-code/"],"token_endpoint_auth_method":"none"}')
          echo "$reg" | python3 -c 'import sys,json; x=json.load(sys.stdin); assert x["client_id"].startswith("aria_")'

          wh=$(mktemp)
          wcode=$(curl -s -D "$wh" -o /dev/null -w '%{http_code}' -X POST "https://aria.robvg9.workers.dev/mcp" -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          test "$wcode" = "401"
          grep -qi 'resource_metadata="https://aria.robvg9.workers.dev/.well-known/oauth-protected-resource/mcp"' "$wh"
          echo LIVE_OK
      - name: Commit restored source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/aria-mcp-inbound-grok-v1/index.ts
          git diff --cached --quiet && echo "no source change" && exit 0
          git commit -m "fix(oauth): separate ISSUER from RESOURCE for Worker facade"
          git push origin HEAD:main
