name: Deploy ARIA MCP Inbound Grok

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/aria-mcp-inbound-grok-v1/**'
      - '.github/workflows/deploy-aria-mcp-inbound-grok.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full inbound source and separate ISSUER
        run: |
          set -euo pipefail
          git show 4f52636dd50222b49ad3cb6041ddcf83046d3983:supabase/functions/aria-mcp-inbound-grok-v1/index.ts > supabase/functions/aria-mcp-inbound-grok-v1/index.ts
          python3 scripts/patch-inbound-issuer.py
          test "$(wc -c < supabase/functions/aria-mcp-inbound-grok-v1/index.ts)" -gt 20000

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Offline OAuth crypto tests
        run: node tests/oauth-crypto.test.js

      - name: Set RESOURCE and ISSUER secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          supabase secrets set \
            ARIA_MCP_INBOUND_RESOURCE=https://aria.robvg9.workers.dev/mcp \
            ARIA_MCP_INBOUND_ISSUER=https://aria.robvg9.workers.dev \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy aria-mcp-inbound-grok-v1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy aria-mcp-inbound-grok-v1 \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Live validation
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          BASE="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/aria-mcp-inbound-grok-v1"
          RESOURCE="https://aria.robvg9.workers.dev/mcp"
          ISSUER="https://aria.robvg9.workers.dev"
          prm=$(curl --fail --silent --show-error --retry 3 "$BASE/.well-known/oauth-protected-resource")
          echo "PRM=$prm"
          echo "$prm" | python3 -c "import sys,json; x=json.load(sys.stdin); assert x['resource']=='$RESOURCE'; assert x['authorization_servers']==['$ISSUER']"
          asm=$(curl --fail --silent --show-error --retry 3 "$BASE/.well-known/oauth-authorization-server")
          echo "ASM=$asm"
          echo "$asm" | python3 -c "import sys,json; x=json.load(sys.stdin); assert x['issuer']=='$ISSUER'; assert x['authorization_endpoint']=='$ISSUER/authorize'"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE" -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          test "$code" = "401"
          wcode=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://aria.robvg9.workers.dev/mcp" -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          test "$wcode" = "401"
          echo LIVE_OK

      - name: Commit restored source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/aria-mcp-inbound-grok-v1/index.ts
          git diff --cached --quiet && echo "no source change" && exit 0
          git commit -m "fix(oauth): restore full inbound + separate issuer resource"
          git push origin HEAD:main
