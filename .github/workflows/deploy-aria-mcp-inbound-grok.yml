name: Deploy ARIA MCP Inbound Grok

on:
  # Manual fallback only. The canonical Supabase deployment owns migrations and
  # all production Edge Function deploys to avoid racing two deploy workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate checked-out OAuth source (never overwrite it with historical source)
        run: |
          set -euo pipefail
          source="supabase/functions/aria-mcp-inbound-grok-v1/index.ts"
          test -f "$source"
          test "$(wc -c < "$source")" -gt 20000
          test "$(grep -c 'Deno.serve(async (req)' "$source")" -eq 1
          test "$(grep -c 'function issueAccessToken' "$source")" -eq 1
          test "$(grep -c 'function verifyAccessToken' "$source")" -eq 1
          grep -q 'CUEVACOIN_CONTROL_SCOPE = "aria.project.cuevacoin.control"' "$source"
          grep -q 'ARIA_MCP_INBOUND_ISSUER' "$source"
          grep -q 'SUPABASE_ACCESS_TOKEN' .github/workflows/deploy-aria-mcp-inbound-grok.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Offline OAuth crypto tests
        run: node tests/oauth-crypto.test.js

      - name: Set public RESOURCE and ISSUER
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          supabase secrets set \
            ARIA_MCP_INBOUND_RESOURCE=https://aria.robvg9.workers.dev/mcp \
            ARIA_MCP_INBOUND_ISSUER=https://aria.robvg9.workers.dev \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy aria-mcp-inbound-grok-v1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy aria-mcp-inbound-grok-v1 \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Live validation
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          BASE="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/aria-mcp-inbound-grok-v1"
          WORKER="https://aria.robvg9.workers.dev/mcp"
          WORKER_ORIGIN="https://aria.robvg9.workers.dev"
          ISSUER="https://aria.robvg9.workers.dev"
          prm=$(curl --fail --silent --show-error --retry 8 "$BASE/.well-known/oauth-protected-resource")
          echo "$prm"
          PRM="$prm" WORKER="$WORKER" ISSUER="$ISSUER" python3 - <<'PY'
          import json, os
          x=json.loads(os.environ['PRM'])
          assert x['resource']==os.environ['WORKER']
          assert x['authorization_servers']==[os.environ['ISSUER']]
          assert 'aria.mcp.inbound' in x.get('scopes_supported',[])
          assert 'aria.project.cuevacoin.control' in x.get('scopes_supported',[])
          print('PRM_OK')
          PY
          asm=$(curl --fail --silent --show-error --retry 8 "$BASE/.well-known/oauth-authorization-server")
          echo "$asm"
          ASM="$asm" ISSUER="$ISSUER" python3 - <<'PY'
          import json, os
          x=json.loads(os.environ['ASM'])
          issuer=os.environ['ISSUER']
          assert x['issuer']==issuer
          assert x['authorization_endpoint']==issuer+'/authorize'
          assert x['token_endpoint']==issuer+'/token'
          assert 'S256' in x.get('code_challenge_methods_supported',[])
          assert 'aria.project.cuevacoin.control' in x.get('scopes_supported',[])
          print('ASM_OK')
          PY
          worker_prm=$(curl --fail --silent --show-error --retry 8 "$WORKER_ORIGIN/.well-known/oauth-protected-resource/mcp")
          echo "$worker_prm"
          WORKER_PRM="$worker_prm" python3 - <<'PY'
          import json, os
          x=json.loads(os.environ['WORKER_PRM'])
          assert 'aria.mcp.inbound' in x.get('scopes_supported',[])
          assert 'aria.project.cuevacoin.control' in x.get('scopes_supported',[])
          print('WORKER_PRM_OK')
          PY
          hdr=$(mktemp)
          code=$(curl -s -D "$hdr" -o /tmp/init -w '%{http_code}' -X POST "$BASE" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          test "$code" = "401"
          grep -qi 'WWW-Authenticate' "$hdr"
          grep -qi 'resource_metadata' "$hdr"
          wh=$(mktemp)
          wcode=$(curl -s -D "$wh" -o /dev/null -w '%{http_code}' -X POST "$WORKER" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          test "$wcode" = "401"
          grep -qi 'resource_metadata="https://aria.robvg9.workers.dev/.well-known/oauth-protected-resource/mcp"' "$wh"
          echo LIVE_OK

