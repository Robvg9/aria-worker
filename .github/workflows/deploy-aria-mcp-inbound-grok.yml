name: Deploy ARIA MCP Inbound Grok

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/aria-mcp-inbound-grok-v1/**'
      - '.github/workflows/deploy-aria-mcp-inbound-grok.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore canonical full OAuth source
        run: |
          set -euo pipefail
          git show 3162e4aa18cb046e08b83c6ec09f9e1a1a580444:supabase/functions/aria-mcp-inbound-grok-v1/index.ts > supabase/functions/aria-mcp-inbound-grok-v1/index.ts
          python3 scripts/patch-inbound-issuer.py
          test "$(wc -c < supabase/functions/aria-mcp-inbound-grok-v1/index.ts)" -gt 20000
          test "$(grep -c 'Deno.serve(async (req)' supabase/functions/aria-mcp-inbound-grok-v1/index.ts)" -eq 1
          test "$(grep -c 'function issueAccessToken' supabase/functions/aria-mcp-inbound-grok-v1/index.ts)" -eq 1
          test "$(grep -c 'function verifyAccessToken' supabase/functions/aria-mcp-inbound-grok-v1/index.ts)" -eq 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Offline OAuth crypto tests
        run: node tests/oauth-crypto.test.js

      - name: Set public RESOURCE and ISSUER
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          supabase secrets set \
            ARIA_MCP_INBOUND_RESOURCE=https://aria.robvg9.workers.dev/mcp \
            ARIA_MCP_INBOUND_ISSUER=https://aria.robvg9.workers.dev \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy aria-mcp-inbound-grok-v1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy aria-mcp-inbound-grok-v1 \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Live validation
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          BASE="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/aria-mcp-inbound-grok-v1"
          WORKER="https://aria.robvg9.workers.dev/mcp"
          ISSUER="https://aria.robvg9.workers.dev"

          echo "=== protected resource metadata ==="
          prm=$(curl --fail --silent --show-error --retry 5 "$BASE/.well-known/oauth-protected-resource")
          echo "$prm"
          PRM="$prm" WORKER="$WORKER" ISSUER="$ISSUER" python3 - <<'PY'
          import json, os
          x = json.loads(os.environ['PRM'])
          assert x['resource'] == os.environ['WORKER']
          assert x['authorization_servers'] == [os.environ['ISSUER']]
          assert 'aria.mcp.inbound' in x.get('scopes_supported', [])
          print('PRM_OK')
          PY

          echo "=== authorization server metadata ==="
          asm=$(curl --fail --silent --show-error --retry 5 "$BASE/.well-known/oauth-authorization-server")
          echo "$asm"
          ASM="$asm" ISSUER="$ISSUER" python3 - <<'PY'
          import json, os
          x = json.loads(os.environ['ASM'])
          issuer = os.environ['ISSUER']
          assert x['issuer'] == issuer
          assert x['authorization_endpoint'] == issuer + '/authorize'
          assert x['token_endpoint'] == issuer + '/token'
          assert 'S256' in x.get('code_challenge_methods_supported', [])
          print('ASM_OK')
          PY

          echo "=== initial MCP handshake must challenge OAuth ==="
          hdr=$(mktemp)
          code=$(curl -s -D "$hdr" -o /tmp/inbound-init -w '%{http_code}' -X POST "$BASE" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          test "$code" = "401"
          grep -qi 'WWW-Authenticate' "$hdr"
          grep -qi 'resource_metadata' "$hdr"

          echo "=== Worker facade must challenge OAuth ==="
          wh=$(mktemp)
          wcode=$(curl -s -D "$wh" -o /dev/null -w '%{http_code}' -X POST "$WORKER" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          test "$wcode" = "401"
          grep -qi 'resource_metadata="https://aria.robvg9.workers.dev/.well-known/oauth-protected-resource/mcp"' "$wh"

          echo LIVE_OK

      - name: Commit restored canonical source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/aria-mcp-inbound-grok-v1/index.ts
          if git diff --cached --quiet; then
            echo "no source change"
            exit 0
          fi
          git commit -m "fix(oauth): restore canonical inbound source"
          git push origin HEAD:main
