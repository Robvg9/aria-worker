name: Cloudflare Worker Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "worker.js"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - "integrations/**"
      - "scripts/cloudflare-workers-build.js"
      - "pwa/**"
      - ".github/workflows/cloudflare-worker-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run native Workers build
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Wrangler version
        run: wrangler --version

      - name: Verify Cloudflare API access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          wrangler whoami
          wrangler deployments list --name aria --json
          wrangler versions list --name aria --json

      - name: Bundle Worker without deploy
        run: wrangler deploy worker.js --name aria --dry-run

      - name: Upload Cloudflare version without promotion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler versions upload worker.js --name aria --message "ARIA CI upload probe $GITHUB_SHA"
