name: ARIA EAS Log Format Debug

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ARIA_WORKFLOW_RUN_ID: 01a082b3-b13b-71fc-997e-7dc0624c4b53

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Fetch EAS workflow logs through official CLI
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas --version
          eas workflow:logs "$ARIA_WORKFLOW_RUN_ID" --non-interactive --all-steps 2>&1 | tee eas-workflow-logs.txt

      - name: Extract dependency/build errors
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          text=open('eas-workflow-logs.txt',encoding='utf-8',errors='replace').read()
          patterns=re.compile(r'(install dependencies|npm (ERR|error)|yarn error|pnpm (ERR|error)|EAI_|ETIMEDOUT|ECONN|401|403|404|ENOSPC|no matching|unable to resolve|failed|fatal|error|ERR!)',re.I)
          lines=text.splitlines()
          hits=[x for x in lines if patterns.search(x)]
          print('TOTAL_LINES',len(lines))
          print('ERROR_RELATED_LINES',len(hits))
          for x in hits[-200:]:
              print(x[:4000])
          PY
