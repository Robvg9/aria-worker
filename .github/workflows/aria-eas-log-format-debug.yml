name: ARIA EAS Log Format Debug

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ARIA_WORKFLOW_RUN_ID: 01a082b3-b13b-71fc-997e-7dc0624c4b53
  EAS_PROJECT_ID: 1b23b091-f7b6-4dc2-b328-c8e5ec07de57
  EAS_API: https://api.expo.dev

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Robot authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npm install --global eas-cli@23.2.0 >/dev/null
          eas whoami --non-interactive

      - name: Fetch EAS workflow run directly via REST
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$EAS_API/v2/workflows/runs/$ARIA_WORKFLOW_RUN_ID" \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Accept: application/json" > workflow-run.json
          python - <<'PY'
          import json
          d=json.load(open('workflow-run.json'))
          print(json.dumps(d, indent=2)[:50000])
          PY

      - name: Extract EAS job identifiers
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('workflow-run.json'))
          print('Top-level keys:', sorted(d.keys()))
          def walk(x, path='root'):
              if isinstance(x, dict):
                  for k,v in x.items():
                      low=k.lower()
                      if low in {'jobs','job','steps','jobid','job_id','id','name'}:
                          print(f'{path}.{k} = {v if isinstance(v,(str,int,float)) else type(v).__name__}')
                      walk(v, f'{path}.{k}')
              elif isinstance(x, list):
                  for i,v in enumerate(x): walk(v, f'{path}[{i}]')
          walk(d)
          PY

      - name: Fetch EAS workflow logs with REST candidates
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, subprocess
          d=json.load(open('workflow-run.json'))
          candidates=set()
          def walk(x):
              if isinstance(x,dict):
                  name=str(x.get('name','') or x.get('job','') or '')
                  for key in ('id','jobId','job_id'):
                      val=x.get(key)
                      if val and (name == 'build_android' or 'job' in key.lower()): candidates.add(str(val))
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(d)
          print('Candidate job IDs:', sorted(candidates))
          PY

      - name: Publish diagnostic summary
        run: |
          {
            echo '## ARIA EAS Log Format Debug'
            echo ''
            echo '- Robot authentication: PASS'
            echo '- EAS workflow REST lookup: PASS'
            echo '- Goal: identify the real build_android job/log endpoint without using the failing workflow:view command.'
          } >> "$GITHUB_STEP_SUMMARY"
