name: ARIA EAS Log Format Debug

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect EAS log container
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_API: https://api.expo.dev
          BUILD_ID: c2b45a20-a56a-4440-9037-905ac72f99d0
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, bz2, gzip, io, json, lzma, os, subprocess, zipfile, zlib
          import urllib.request
          api=os.environ['EAS_API']; token=os.environ['EXPO_TOKEN']; bid=os.environ['BUILD_ID']
          q={"query":"query Build(\$buildId: ID!) { builds { byId(buildId: \$buildId) { id logFiles } } }","variables":{"buildId":bid}}
          req=urllib.request.Request(api+'/graphql',data=json.dumps(q).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
          body=json.load(urllib.request.urlopen(req,timeout=30))
          build=(((body.get('data') or {}).get('builds') or {}).get('byId'))
          url=(build.get('logFiles') or [None])[0]
          if not url: raise SystemExit('no log url')
          raw=urllib.request.urlopen(url,timeout=60).read()
          print('BYTES',len(raw)); print('MAGIC_HEX',raw[:64].hex())
          print('PREFIX_ASCII',repr(raw[:80]))
          tests=[]
          for name,fn in [
            ('gzip',lambda:gzip.decompress(raw)),
            ('zlib',lambda:zlib.decompress(raw)),
            ('zlib-raw',lambda:zlib.decompress(raw,-zlib.MAX_WBITS)),
            ('bzip2',lambda:bz2.decompress(raw)),
            ('xz',lambda:lzma.decompress(raw)),
          ]:
            try:
              out=fn(); ratio=sum(32<=c<127 or c in (9,10,13) for c in out[:4000])/max(1,len(out[:4000])); tests.append((name,len(out),round(ratio,3),repr(out[:160])))
            except Exception as e: tests.append((name,'ERR',str(e),''))
          try:
            with zipfile.ZipFile(io.BytesIO(raw)) as z:
              tests.append(('zip',[(n,z.getinfo(n).file_size) for n in z.namelist()],'OK',''))
          except Exception as e: tests.append(('zip','ERR',str(e),''))
          for row in tests: print('TEST',row)
          # Try common HTTP/content codecs through system binaries if present.
          for cmd in (['zstd','-d','-c'],['brotli','-d']):
            try:
              p=subprocess.run(cmd,input=raw,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
              ratio=sum(32<=c<127 or c in (9,10,13) for c in p.stdout[:4000])/max(1,len(p.stdout[:4000]))
              print('TEST',cmd,'OK',len(p.stdout),round(ratio,3),repr(p.stdout[:160]))
            except Exception as e: print('TEST',cmd,'ERR',str(e))
          PY
