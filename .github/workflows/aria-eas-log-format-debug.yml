name: ARIA EAS Log Format Debug

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ARIA_WORKFLOW_RUN_ID: 01a082b3-b13b-71fc-997e-7dc0624c4b53
  ARIA_BUILD_JOB_ID: 01a082b3-b221-71e9-9b1f-5a49271cee80
  ARIA_BUILD_ID: c2b45a20-a56a-4440-9037-905ac72f99d0
  EAS_PROJECT_ID: 1b23b091-f7b6-4dc2-b328-c8e5ec07de57
  EAS_API: https://api.expo.dev

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Robot authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npm install --global eas-cli@23.2.0 >/dev/null
          eas whoami --non-interactive

      - name: Verify workflow run and exact build job
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$EAS_API/v2/workflows/runs/$ARIA_WORKFLOW_RUN_ID" \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Accept: application/json" > workflow-run.json
          python - <<'PY'
          import json, os
          d=json.load(open('workflow-run.json'))['data']
          print('Workflow status:', d.get('status'))
          jobs=d.get('jobs') or []
          hit=next((j for j in jobs if j.get('id')==os.environ['ARIA_BUILD_JOB_ID']),None)
          if not hit:
              raise SystemExit('Known build_android job id not present in workflow run')
          print('Exact build job key:', hit.get('key'))
          print('Exact build job status:', hit.get('status'))
          print('Exact EAS build id:', hit.get('buildId'))
          if hit.get('buildId') != os.environ['ARIA_BUILD_ID']:
              raise SystemExit('Known build id mismatch')
          PY

      - name: Fetch official EAS build job logs
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas workflow:logs "$ARIA_BUILD_JOB_ID" --non-interactive --all-steps 2>&1 | tee eas-build-job-logs.txt

      - name: Extract real Android build failure
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          text=open('eas-build-job-logs.txt',encoding='utf-8',errors='replace').read()
          lines=text.splitlines()
          patterns=re.compile(r'(npm ERR|yarn error|pnpm ERR|EAI_|ETIMEDOUT|ECONN|401|403|404|ENOSPC|no matching|unable to resolve|failed|fatal|error|ERR!|gradle|android|credential|keystore)',re.I)
          hits=[x for x in lines if patterns.search(x)]
          print('TOTAL_LINES',len(lines))
          print('ERROR_RELATED_LINES',len(hits))
          for x in hits[-250:]:
              x=re.sub(r'(?i)(authorization\s*[:=]\s*bearer\s+)[^\s]+',r'\1[REDACTED]',x)
              print(x[:6000])
          if not hits:
              print('--- LAST 250 LINES ---')
              for x in lines[-250:]: print(x[:6000])
          PY

      - name: Publish diagnostic summary
        run: |
          {
            echo '## ARIA EAS Build Diagnostic'
            echo ''
            echo '- Robot authentication: PASS'
            echo '- Workflow run lookup: PASS'
            echo '- Exact build_android job identified: PASS'
            echo '- Build ID matched: PASS'
            echo '- Official EAS workflow log retrieval attempted: PASS'
            echo '- New build created: NO'
            echo '- Secrets printed: NO'
          } >> "$GITHUB_STEP_SUMMARY"
