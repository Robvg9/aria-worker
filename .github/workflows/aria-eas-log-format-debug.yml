name: ARIA EAS Log Format Debug

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ARIA_WORKFLOW_RUN_ID: 01a082b3-b13b-71fc-997e-7dc0624c4b53
  ARIA_BUILD_JOB_ID: 01a082b3-b221-71e9-9b1f-5a49271cee80
  ARIA_BUILD_ID: c2b45a20-a56a-4440-9037-905ac72f99d0
  EAS_PROJECT_ID: 1b23b091-f7b6-4dc2-b328-c8e5ec07de57
  EAS_API: https://api.expo.dev

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Robot authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npm install --global eas-cli@23.2.0 >/dev/null
          eas whoami --non-interactive

      - name: Create minimal Expo project context
        run: |
          set -euo pipefail
          mkdir -p /tmp/aria-eas-project
          cat > /tmp/aria-eas-project/package.json <<'JSON'
          {
            "name": "aria-app",
            "private": true,
            "version": "1.0.0",
            "dependencies": {
              "expo": "57.0.21"
            }
          }
          JSON
          cat > /tmp/aria-eas-project/eas.json <<'JSON'
          {
            "cli": { "version": ">= 23.2.0" },
            "build": {
              "development": {
                "developmentClient": true,
                "distribution": "internal"
              }
            }
          }
          JSON
          cat > /tmp/aria-eas-project/app.json <<'JSON'
          {
            "expo": {
              "name": "aria-app",
              "slug": "aria-app",
              "version": "1.0.0",
              "runtimeVersion": "1.0.0",
              "extra": { "eas": { "projectId": "1b23b091-f7b6-4dc2-b328-c8e5ec07de57" } }
            }
          }
          JSON

      - name: Verify workflow run and exact build job
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$EAS_API/v2/workflows/runs/$ARIA_WORKFLOW_RUN_ID" \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Accept: application/json" > /tmp/aria-eas-project/workflow-run.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/aria-eas-project/workflow-run.json'))['data']
          jobs=d.get('jobs') or []
          hit=next((j for j in jobs if j.get('id')==os.environ['ARIA_BUILD_JOB_ID']),None)
          if not hit: raise SystemExit('Known build_android job id not present')
          if hit.get('buildId') != os.environ['ARIA_BUILD_ID']: raise SystemExit('Known build id mismatch')
          print('Workflow status:', d.get('status'))
          print('Build job key:', hit.get('key'))
          print('Build job status:', hit.get('status'))
          print('Build ID:', hit.get('buildId'))
          PY

      - name: Fetch build log URL metadata directly from EAS GraphQL
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$EAS_API/graphql" \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Content-Type: application/json" \
            --data-raw "$(cat <<JSON
          {"query":"query Build(\$buildId: ID!) { builds { byId(buildId: \$buildId) { id status platform logFiles error { errorCode message } } } }","variables":{"buildId":"$ARIA_BUILD_ID"}}
          JSON
          )" > /tmp/aria-eas-project/build-detail.json
          python - <<'PY'
          import json
          body=json.load(open('/tmp/aria-eas-project/build-detail.json'))
          if body.get('errors'): raise SystemExit(body['errors'])
          b=((body.get('data') or {}).get('builds') or {}).get('byId')
          if not b: raise SystemExit('build detail not found')
          urls=b.get('logFiles') or []
          if not urls: raise SystemExit('No EAS build log URL returned')
          print('Build detail: PASS')
          print('Status:', b.get('status'))
          print('Platform:', b.get('platform'))
          print('Log URL count:', len(urls))
          PY

      - name: Download and decode EAS build log
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: /tmp/aria-eas-project
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, os
          b=((json.load(open('build-detail.json')).get('data') or {}).get('builds') or {}).get('byId')
          url=(b.get('logFiles') or [None])[0]
          if not url: raise SystemExit('Missing log URL')
          subprocess.check_call(['curl','-fsSL','--compressed','--max-time','60','-D','eas-log.headers','-o','eas-build.log',url])
          print('Downloaded decoded bytes:', os.path.getsize('eas-build.log'))
          PY
          echo '== RESPONSE HEADERS ==' 
          sed -n '1,80p' eas-log.headers
          echo '== FILE TYPE =='
          file eas-build.log || true
          echo '== LOG PREVIEW =='
          sed -n '1,40p' eas-build.log || true

      - name: Extract real Android build failure
        working-directory: /tmp/aria-eas-project
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          raw=open('eas-build.log','rb').read()
          text=raw.decode('utf-8','replace')
          lines=text.splitlines()
          patterns=re.compile(r'(npm ERR|yarn error|pnpm ERR|EAI_|ETIMEDOUT|ECONN|401|403|404|ENOSPC|no matching|unable to resolve|failed|fatal|error|ERR!|gradle|android|credential|keystore|install dependencies)',re.I)
          hits=[x for x in lines if patterns.search(x)]
          print('TOTAL_LINES',len(lines))
          print('ERROR_RELATED_LINES',len(hits))
          for x in hits[-250:]: print(x[:6000])
          if not hits:
              print('--- LAST 120 LINES ---')
              for x in lines[-120:]: print(x[:6000])
          PY

      - name: Publish diagnostic summary
        run: |
          {
            echo '## ARIA EAS Build Diagnostic'
            echo ''
            echo '- Robot authentication: PASS'
            echo '- Workflow run lookup: PASS'
            echo '- Exact build_android job identified: PASS'
            echo '- Build ID matched: PASS'
            echo '- Build log URL metadata: PASS'
            echo '- EAS log downloaded with Content-Encoding handling: PASS'
            echo '- New build created: NO'
            echo '- Secrets printed: NO'
          } >> "$GITHUB_STEP_SUMMARY"
