name: ARIA Windows Direct CDP Route Probe

on:
  pull_request:
    paths:
      - '.github/workflows/aria-windows-direct-cdp-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Direct Windows/CDP diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host '=== WINDOWS ==='
          Write-Host ('OS=' + (Get-CimInstance Win32_OperatingSystem).Caption)
          Write-Host ('NODE=' + (& node --version))
          Write-Host '=== EDGE PROCESSES ==='
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^msedge(\.exe)?$' } | Select-Object ProcessId, CommandLine | Format-List
          Write-Host '=== CDP VERSION ==='
          try { $v=Invoke-RestMethod -Uri 'http://127.0.0.1:9222/json/version' -TimeoutSec 5; $v | ConvertTo-Json -Compress } catch { Write-Host ('CDP_VERSION_ERROR=' + $_.Exception.Message) }
          Write-Host '=== CDP TABS ==='
          $tabs=Invoke-RestMethod -Uri 'http://127.0.0.1:9222/json' -TimeoutSec 5
          $tabs | Where-Object { $_.type -eq 'page' } | Select-Object id,url,title,webSocketDebuggerUrl | ConvertTo-Json -Compress
          Write-Host '=== PWA HTTP ==='
          $h=Invoke-WebRequest -UseBasicParsing -Uri 'https://aria.robvg9.workers.dev/pwa/' -TimeoutSec 20
          Write-Host ('PWA_HTTP_STATUS=' + [int]$h.StatusCode)
          Write-Host ('PWA_HTTP_LENGTH=' + $h.RawContentLength)
          Write-Host '=== DETERMINISTIC ROUTES ==='
          $nodeScript = @'
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fetchJson = async url => { const r = await fetch(url); if (!r.ok) throw new Error('HTTP_'+r.status); return r.json(); };
const tabs = await fetchJson('http://127.0.0.1:9222/json');
const pages = tabs.filter(t => t && t.type === 'page');
const targetBase = 'https://aria.robvg9.workers.dev/pwa/';
const page = pages.find(t => String(t.url || '').includes('/pwa/')) || pages.find(t => String(t.url || '').includes('aria.robvg9.workers.dev'));
console.log('PAGES=' + JSON.stringify(pages.map(t => ({url:t.url,title:t.title,hasWs:Boolean(t.webSocketDebuggerUrl)}))));
if (!page) throw new Error('PWA_PAGE_NOT_FOUND');
const cdp = async (method, params={}) => {
  const ws = new WebSocket(page.webSocketDebuggerUrl);
  return new Promise((resolve,reject) => {
    let done=false;
    const finish=(fn,v)=>{if(done)return;done=true;clearTimeout(timer);try{ws.close()}catch{}fn(v)};
    const timer=setTimeout(()=>finish(reject,new Error('CDP_TIMEOUT')),10000);
    ws.onopen=()=>ws.send(JSON.stringify({id:1,method,params}));
    ws.onmessage=e=>{try{const m=JSON.parse(String(e.data||''));if(m.id!==1)return;m.error?finish(reject,new Error(String(m.error.message||'CDP_ERROR'))):finish(resolve,m.result||{})}catch(err){finish(reject,err)}};
    ws.onerror=()=>finish(reject,new Error('CDP_SOCKET_ERROR'));
  });
};
const expr = '(function(){const vis=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.visibility!==\'hidden\'&&s.display!==\'none\'};const els=Array.from(document.querySelectorAll(\'button,a,input,textarea,select,[role=button],[role=link],[role=tab]\')).filter(vis);return {href:location.href,hash:location.hash||\'#home\',title:document.title,controls:els.length,labels:els.slice(0,12).map(e=>(e.getAttribute(\'aria-label\')||e.innerText||e.textContent||e.value||\'\').trim().replace(/\\s+/g,\' \').slice(0,100)).filter(Boolean)}})()';
const routes=['#home','#chat','#mission','#projects','#meditation','#capabilities','#settings'];
const out=[];
for (const route of routes) {
  await cdp('Page.navigate',{url:targetBase+route});
  await sleep(1200);
  const ev=await cdp('Runtime.evaluate',{returnByValue:true,expression:expr});
  const v=ev?.result?.value;
  out.push({route,verified:Boolean(v&&v.hash===route),observed:v||null});
}
const result={status:out.every(x=>x.verified)?'succeeded':'partial',required_routes_total:7,required_routes_visited:out.filter(x=>x.verified).length,routes:out};
console.log('DIRECT_CDP_RWHT_RESULT='+JSON.stringify(result));
if(!out.every(x=>x.verified)) process.exit(1);
'@
          $tmp=Join-Path $env:TEMP 'aria-direct-cdp-probe.mjs'
          Set-Content -LiteralPath $tmp -Value $nodeScript -Encoding UTF8
          & node $tmp
          if($LASTEXITCODE -ne 0){throw "DIRECT_CDP_RWHT_FAILED_EXIT=$LASTEXITCODE"}
          Write-Host 'DIRECT_CDP_RWHT=PASS'