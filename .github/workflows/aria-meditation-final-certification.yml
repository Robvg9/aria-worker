name: ARIA Meditation IA Final Physical Certification

on:
  push:
    branches: ["aria/self-improvement-v1-main"]
    paths:
      - 'agents/windows/**'
      - 'autonomy/**'
      - 'self-development/**'
      - 'self-model/**'
      - 'tests/**'
      - '.github/workflows/aria-meditation-final-certification.yml'
  pull_request:
    branches: ["aria/meditation-ia-v1-main"]
    paths:
      - 'agents/windows/**'
      - 'autonomy/**'
      - 'self-development/**'
      - 'self-model/**'
      - 'tests/**'
      - '.github/workflows/aria-meditation-final-certification.yml'
  workflow_dispatch:

# Physical certification is exclusive per device, but new runs must queue instead
# of cancelling the previous run. This prevents the repeated cancellation loop.
concurrency:
  group: aria-meditation-final-certification-windows
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  certify:
    name: certify-physical-meditation-and-self-improvement
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    env:
      ARIA_TARGET_DEVICE_ID: windows-fe722cc6681e4f9c9cc35f5ebbb0a089
      ARIA_CERT_ROOT: 'D:\ARIA-Windows-Agent\Runtime\meditation-cert'
      ARIA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact source
        shell: cmd
        run: |
          git config --global --add safe.directory "%CD%" 2>nul
          git reset --hard HEAD
          git clean -ffdx
          set SHA=%ARIA_EXPECTED_SHA%
          if "%SHA%"=="" exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$b=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('x-access-token:'+$env:GITHUB_TOKEN)); git config --local http.https://github.com/.extraheader ('AUTHORIZATION: basic '+$b)"
          git checkout --detach HEAD
          git branch -D %SHA% 2>nul
          git fetch --no-tags --depth=1 origin %SHA%
          if errorlevel 1 exit /b 1
          git checkout --detach --force %SHA%
          for /f %%H in ('git rev-parse HEAD') do set HEADSHA=%%H
          if not "%HEADSHA%"=="%SHA%" exit /b 1
          echo SOURCE_CHECKOUT_VERIFIED=PASS commit=%HEADSHA%

      - name: Phone Link uninstall and compact metrics
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\agents\windows\robvg-phone-link-cleanup.ps1"
          if errorlevel 1 exit /b 1

      - name: Assert single-owner runtime boundary
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$runtime='D:\ARIA-Windows-Agent\Runtime\windows'; $watchdog=Join-Path $runtime 'run-agent.ps1'; $agent=Join-Path $runtime 'aria-agent.js'; if(-not(Test-Path $watchdog)){throw 'Watchdog runtime missing'}; if(-not(Test-Path $agent)){throw 'Agent runtime missing'}; $text=Get-Content -Raw $watchdog; if($text -notmatch 'Global\\ARIA-Windows-Agent-Watchdog-v1'){throw 'Global watchdog mutex missing'}; Write-Host 'SINGLE_OWNER_BOUNDARY=PASS'"
          if errorlevel 1 exit /b 1

      - name: Synchronize physical runtime source
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$runtime='D:\ARIA-Windows-Agent\Runtime\windows'; $repo=Join-Path $env:GITHUB_WORKSPACE 'agents\windows'; foreach($file in @('aria-agent.js','aria-meditation-controller.js','self-improvement-runtime.js','run-agent.ps1')){Copy-Item -Path (Join-Path $repo $file) -Destination (Join-Path $runtime $file) -Force}; Set-Content -Path 'D:\ARIA-Windows-Agent\Logs\runtime-source-sha' -Value $env:ARIA_EXPECTED_SHA -Encoding ASCII -Force; Write-Host 'PHYSICAL_RUNTIME_SYNC=PASS'"
          if errorlevel 1 exit /b 1

      - name: Repair persistent state and reclaim safe disk space
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $root='D:\ARIA-Windows-Agent'
          $state=Join-Path $root 'Runtime\meditation\state.json'
          $med=Join-Path $root 'Runtime\meditation'
          New-Item -ItemType Directory -Force $med | Out-Null
          if(Test-Path $state){
            $len=(Get-Item $state).Length
            Write-Host ("MEDITATION_STATE_BYTES="+$len)
            $bad=$false
            try { if($len -gt 25MB){$bad=$true}else{Get-Content -Raw $state | ConvertFrom-Json | Out-Null} } catch {$bad=$true}
            if($bad){
              $backup=Join-Path $med ('state.quarantine-' + (Get-Date -Format 'yyyyMMdd-HHmmss') + '.json')
              Move-Item $state $backup -Force -ErrorAction SilentlyContinue
              '{"mode":"standby","version":1,"events":[]}' | Set-Content $state -Encoding UTF8 -Force
              Write-Host 'MEDITATION_STATE_REPAIRED=PASS'
            } else { Write-Host 'MEDITATION_STATE_HEALTHY=PASS' }
          } else {
            '{"mode":"standby","version":1,"events":[]}' | Set-Content $state -Encoding UTF8 -Force
            Write-Host 'MEDITATION_STATE_CREATED=PASS'
          }
          foreach($d in @($env:TEMP,($env:LOCALAPPDATA+'\Temp'),$env:windir+'\Temp',$env:windir+'\SoftwareDistribution\Download',$env:ProgramData+'\Microsoft\Windows\WER\ReportArchive',$env:ProgramData+'\Microsoft\Windows\WER\ReportQueue')){
            if(Test-Path $d){ Get-ChildItem -LiteralPath $d -Force -ErrorAction SilentlyContinue | Where-Object {$_.LastWriteTime -lt (Get-Date).AddHours(-6)} | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue }
          }
          try { Clear-RecycleBin -Force -ErrorAction SilentlyContinue } catch {}
          $os=Get-CimInstance Win32_OperatingSystem
          Write-Host ("FREE_RAM_MB="+[math]::Round($os.FreePhysicalMemory/1024))
          Write-Host ("FREE_C_GB="+[math]::Round((Get-PSDrive C).Free/1GB,2))
          Write-Host 'STATE_AND_DISK_REPAIR=PASS'

      - name: Refresh Agent through watchdog owner
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\agents\windows\refresh-agent-via-watchdog.ps1"
          if errorlevel 1 exit /b 1

      - name: Run complete four-stage physical certification
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\agents\windows\meditation-final-certification.ps1"
          if errorlevel 1 exit /b 1
