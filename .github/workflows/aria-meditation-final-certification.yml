name: ARIA Meditation IA Final Physical Certification

on:
  push:
    branches:
      - aria/self-improvement-v1-main
    paths:
      - 'agents/windows/**'
      - 'autonomy/**'
      - 'self-development/**'
      - 'self-model/**'
      - 'tests/**'
      - '.github/workflows/aria-meditation-final-certification.yml'
  pull_request:
    branches:
      - aria/meditation-ia-v1-main
    paths:
      - 'agents/windows/**'
      - 'autonomy/**'
      - 'self-development/**'
      - 'self-model/**'
      - 'tests/**'
      - '.github/workflows/aria-meditation-final-certification.yml'

concurrency:
  group: aria-meditation-final-certification-windows
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify:
    name: certify-physical-meditation-and-self-improvement
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      ARIA_TARGET_DEVICE_ID: windows-fe722cc6681e4f9c9cc35f5ebbb0a089
      ARIA_CERT_PORT: '45874'
      ARIA_CERT_ROOT: 'D:\ARIA-Windows-Agent\Runtime\meditation-cert'
      ARIA_CERT_LOG: 'D:\ARIA-Windows-Agent\Runtime\meditation-cert\ARIA-Meditation-IA.txt'
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout exact pushed source
        run: |
          $ErrorActionPreference='Stop'
          $env:GIT_TERMINAL_PROMPT='0'
          git config --global --add safe.directory "$PWD" 2>$null
          git reset --hard HEAD
          git clean -ffdx
          git update-ref -d refs/remotes/aria-target 2>$null
          $fetchSha = $env:GITHUB_SHA
          $fetchSpec = "+${fetchSha}:refs/remotes/aria-target"
          $basic=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GITHUB_TOKEN"))
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $basic"
          git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=30 fetch --no-tags --depth=1 origin $fetchSpec
          if($LASTEXITCODE -ne 0){throw "git fetch failed: $LASTEXITCODE"}
          git checkout --force refs/remotes/aria-target
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){throw "Unexpected checkout: $head expected $env:GITHUB_SHA"}
          Write-Host "CHECKED_OUT_COMMIT=$head"
          Write-Host 'SOURCE_CHECKOUT_VERIFIED=PASS'

      - name: Install ARIA Windows runtime
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\agents\windows\install-v2.ps1'
          if($LASTEXITCODE -ne 0){throw "ARIA installer failed with exit code $LASTEXITCODE"}
          Write-Host 'ARIA_INSTALL=PASS'

      - name: Verify persistent startup and watchdog state
        run: |
          $ErrorActionPreference='Stop'
          $runKey='HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $runValue=(Get-ItemProperty -Path $runKey -Name 'ARIA-Windows-Local-Agent' -ErrorAction SilentlyContinue).'ARIA-Windows-Local-Agent'
          if([string]::IsNullOrWhiteSpace($runValue) -or $runValue -notmatch 'run-agent\.ps1'){throw 'ARIA user autostart entry missing'}
          if(-not(Test-Path 'D:\ARIA-Windows-Agent\Logs\watchdog.pid')){throw 'ARIA watchdog pid marker missing'}
          $watchdogPid=[int](Get-Content -Raw 'D:\ARIA-Windows-Agent\Logs\watchdog.pid').Trim()
          Get-Process -Id $watchdogPid -ErrorAction Stop | Out-Null
          $statusPath='D:\ARIA-Windows-Agent\Logs\status.json'
          if(-not(Test-Path $statusPath)){throw 'ARIA watchdog status missing'}
          $status=Get-Content -Raw $statusPath | ConvertFrom-Json
          if($status.state -notin @('agent_running','agent_restarting')){throw "Unexpected watchdog state: $($status.state)"}
          Write-Host 'ARIA_USER_AUTOSTART=PASS'
          Write-Host "ARIA_WATCHDOG_PID=$watchdogPid"
          Write-Host "ARIA_WATCHDOG_STATE=$($status.state)"
          Write-Host 'PERSISTENCE_STAGE=PASS'

      - name: Validate installed Meditation controller load path
        run: |
          $ErrorActionPreference='Stop'
          $runtime='D:\ARIA-Windows-Agent\Runtime\windows\aria-meditation-controller.js'
          if(-not(Test-Path $runtime)){throw 'Meditation controller missing'}
          & node -e "const x=require('D:\\ARIA-Windows-Agent\\Runtime\\windows\\aria-meditation-controller.js'); if(typeof x.createWindowsMeditationController!=='function') process.exit(1); console.log('MEDITATION_CONTROLLER_LOAD=PASS')"
          if($LASTEXITCODE -ne 0){throw 'Meditation controller require failed'}

      - name: Verify live Meditation IA and gateway integration
        run: |
          $ErrorActionPreference='Stop'
          $u='http://127.0.0.1:45873/status'
          $s=$null
          for($i=0;$i-lt90;$i++){
            try{$s=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 2;if($s -and $s.version){break}}catch{}
            Start-Sleep -Seconds 1
          }
          if(-not$s){throw 'Live Meditation IA endpoint unavailable'}
          if($s.version -ne 'aria-meditation-ia-v1'){throw "Unexpected live Meditation IA version: $($s.version)"}
          if($s.mode -ne 'active'){throw "Live Meditation IA not active: $($s.mode)"}
          $t0=[int]$s.tick_count
          $advanced=$false
          for($i=0;$i-lt45;$i++){
            Start-Sleep -Seconds 1
            $s2=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5
            if([int]$s2.tick_count -gt $t0){$advanced=$true;break}
          }
          if(-not$advanced){throw "Live Meditation tick did not advance from $t0 within 45s"}
          if($s2.mode -ne 'active'){throw "Live Meditation IA lost active mode: $($s2.mode)"}
          if($null -eq $s2.last_result){throw 'Live Meditation produced no result'}
          $lr=$s2.last_result
          if($lr.error -eq 'meditation_gateway_config_missing'){throw 'Live Meditation gateway configuration missing'}
          $gatewayEvidence=($lr.PSObject.Properties.Name | Where-Object {$_ -in @('recovered','learning','goalSync','mission_created','active_mission_id','runtime')})
          if(-not$gatewayEvidence){throw 'Live Meditation result lacks gateway evidence fields'}
          $medProcesses=@(Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue | Where-Object {$_.CommandLine -and $_.CommandLine -match 'aria-agent\.js'})
          if($medProcesses.Count -ne 1){throw "Expected exactly one ARIA agent process, found $($medProcesses.Count)"}
          Write-Host 'MEDITATION_LIVE_VERSION=PASS'
          Write-Host "MEDITATION_TICK_ADVANCE=$t0->$($s2.tick_count)"
          Write-Host ('MEDITATION_GATEWAY_RESULT=' + ($lr | ConvertTo-Json -Compress -Depth 12))
          Write-Host 'MEDITATION_GATEWAY_INTEGRATION=PASS'
          Write-Host 'SINGLE_AGENT_INSTANCE=PASS'
          Write-Host 'INTEGRATION_STAGE=PASS'

      - name: Verify watchdog recovery of Meditation IA
        run: |
          $ErrorActionPreference='Stop'
          $statusPath='D:\ARIA-Windows-Agent\Logs\status.json'
          $killPath='D:\ARIA-Windows-Agent\Logs\kill-request'
          $before=Get-Content -Raw $statusPath | ConvertFrom-Json
          if([string]::IsNullOrWhiteSpace([string]$before.agent_pid)){throw 'No current ARIA agent pid before recovery test'}
          Set-Content -Path $killPath -Value 'final-cert-recovery' -Encoding UTF8 -Force
          $newStatus=$null
          for($i=0;$i-lt90;$i++){
            try{$newStatus=Get-Content -Raw $statusPath | ConvertFrom-Json}catch{}
            if($newStatus -and $newStatus.state -eq 'agent_running' -and [string]$newStatus.agent_pid -ne [string]$before.agent_pid){break}
            Start-Sleep -Seconds 1
          }
          if(-not$newStatus -or $newStatus.state -ne 'agent_running'){throw 'ARIA watchdog did not recover the agent'}
          if([string]$newStatus.agent_pid -eq [string]$before.agent_pid){throw 'ARIA agent pid did not change during recovery'}
          $u='http://127.0.0.1:45873/status'
          $s=$null
          for($i=0;$i-lt90;$i++){
            try{$s=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 2;if($s.version -eq 'aria-meditation-ia-v1' -and $s.mode -eq 'active'){break}}catch{}
            Start-Sleep -Seconds 1
          }
          if(-not$s -or $s.version -ne 'aria-meditation-ia-v1' -or $s.mode -ne 'active'){throw 'Meditation IA did not recover to active state'}
          $t0=[int]$s.tick_count
          $advanced=$false
          for($i=0;$i-lt45;$i++){
            Start-Sleep -Seconds 1
            $s2=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5
            if([int]$s2.tick_count -gt $t0){$advanced=$true;break}
          }
          if(-not$advanced){throw "Recovered Meditation tick did not advance from $t0 within 45s"}
          if($s2.version -ne 'aria-meditation-ia-v1' -or $s2.mode -ne 'active'){throw 'Recovered Meditation state invalid'}
          Write-Host "ARIA_AGENT_RECOVERY=$($before.agent_pid)->$($newStatus.agent_pid)"
          Write-Host "MEDITATION_RECOVERY_TICK=$t0->$($s2.tick_count)"
          Write-Host 'WATCHDOG_MEDITATION_RECOVERY=PASS'
          Write-Host 'RECOVERY_STAGE=PASS'

      - name: Start isolated Meditation IA certification controller
        run: |
          $ErrorActionPreference='Stop'
          $node=(Get-Command node.exe -ErrorAction Stop).Source
          $controller='D:\ARIA-Windows-Agent\Runtime\windows\aria-meditation-controller.js'
          $root=$env:ARIA_CERT_ROOT
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Remove-Item -LiteralPath (Join-Path $root 'controller.lock') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $root 'state.json') -Force -ErrorAction SilentlyContinue
          $env:ARIA_WINDOWS_AGENT_ROOT='D:\ARIA-Windows-Agent\Runtime\windows'
          $env:ARIA_MEDITATION_ROOT=$root
          $env:ARIA_MEDITATION_LOG=$env:ARIA_CERT_LOG
          $env:ARIA_MEDITATION_PORT=$env:ARIA_CERT_PORT
          $env:ARIA_MEDITATION_HEARTBEAT_MS='10000'
          $env:ARIA_MEDITATION_MIN_IDLE_SECONDS='0'
          $env:ARIA_DEVICE_ID=$env:ARIA_TARGET_DEVICE_ID
          $env:ARIA_DEVICE_GATEWAY_URL=''
          $env:ARIA_DEVICE_TOKEN=''
          $proc=Start-Process -FilePath $node -ArgumentList @($controller) -WorkingDirectory 'D:\ARIA-Windows-Agent\Runtime\windows' -PassThru -WindowStyle Hidden
          Set-Content -Path (Join-Path $root 'controller.pid') -Value $proc.Id -Encoding ASCII
          Write-Host "MEDITATION_CERT_CONTROLLER_PID=$($proc.Id)"
          Write-Host 'MEDITATION_CERT_CONTROLLER_STARTED=PASS'
          Start-Sleep -Seconds 2
          if($proc.HasExited){throw "Meditation controller exited immediately code=$($proc.ExitCode)"}

      - name: Verify isolated Meditation IA lifecycle
        run: |
          $ErrorActionPreference='Stop'
          $u="http://127.0.0.1:$($env:ARIA_CERT_PORT)/status"
          $s=$null
          for($i=0;$i-lt30;$i++){
            try{$s=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 2;if($s){break}}catch{}
            Start-Sleep -Seconds 1
          }
          if(-not$s){throw 'Meditation certification endpoint unavailable'}
          if($s.version -ne 'aria-meditation-ia-v1'){throw "Unexpected Meditation IA version: $($s.version)"}
          if($s.mode -ne 'active'){throw "Meditation IA not active: $($s.mode)"}
          $t0=[int]$s.tick_count
          $advanced=$false
          for($i=0;$i-lt15;$i++){
            Start-Sleep -Seconds 1
            $s2=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5
            if([int]$s2.tick_count -gt $t0){$advanced=$true;break}
          }
          if(-not$advanced){throw "Meditation certification tick did not advance from $t0 within 15s"}
          if($s2.mode -ne 'active'){throw "Meditation IA lost active mode: $($s2.mode)"}
          if($null -eq $s2.last_result){throw 'Meditation IA produced no tick result'}
          Write-Host 'MEDITATION_IA_LIFECYCLE=PASS'
          Write-Host "MEDITATION_CERT_TICK_ADVANCE=$t0->$($s2.tick_count)"

      - name: Physical self-improvement execution proof
        env:
          ARIA_CERT_DEVICE_ID: windows-fe722cc6681e4f9c9cc35f5ebbb0a089
        run: |
          $ErrorActionPreference='Stop'
          $runtime='D:\ARIA-Windows-Agent\Runtime\windows\self-improvement-runtime.js'
          if(-not(Test-Path $runtime)){throw 'Self-improvement runtime missing'}
          $job=@{
            device_id=$env:ARIA_CERT_DEVICE_ID
            operation='self.improve'
            command=(@{
              goal='Final physical Windows self-improvement certification smoke proof'
              category='reliability'
              risk='LOW'
              scope=@('physical-certification.js')
              proposed_changes=@(@{path='physical-certification.js';content="module.exports = { status: 'ok' };";risk_level='LOW'})
              mission_id='aria-meditation-final-certification'
              step_id='physical-self-improvement'
            } | ConvertTo-Json -Compress -Depth 10)
          } | ConvertTo-Json -Compress -Depth 10
          $env:ARIA_SELF_IMPROVEMENT_JOB=$job
          $out=& node -e "const {executeSelfImprovementJob}=require('D:\\ARIA-Windows-Agent\\Runtime\\windows\\self-improvement-runtime.js'); const job=JSON.parse(process.env.ARIA_SELF_IMPROVEMENT_JOB); executeSelfImprovementJob(job, process.env.ARIA_CERT_DEVICE_ID).then(r=>{console.log(JSON.stringify(r)); if(r.status!=='succeeded'||r.coordinator_status!=='completed'||r.stop_reason!=='verified') process.exit(1)}).catch(e=>{console.error(e.stack||e);process.exit(1)})" 2>&1
          if($LASTEXITCODE -ne 0){$out | Write-Host; throw 'Physical self-improvement execution failed'}
          $out | Write-Host
          $evidence='D:\ARIA-Windows-Agent\Data\self-improvement-last.json'
          if(-not(Test-Path $evidence)){throw 'Self-improvement evidence file missing'}
          $ev=Get-Content -Raw $evidence | ConvertFrom-Json
          if([string]::IsNullOrWhiteSpace($ev.objective)){throw 'Self-improvement evidence objective missing'}
          Write-Host 'PHYSICAL_SELF_IMPROVEMENT=PASS'
          Write-Host 'PHYSICAL_SELF_IMPROVEMENT_EVIDENCE=PASS'
          Write-Host 'CERTIFICATION_STAGE=PASS'

      - name: Final physical proof marker
        run: |
          Write-Host 'ARIA_SELF_IMPROVEMENT_WINDOWS_PHYSICAL_E2E=PASS'
          Write-Host 'STATUS=PHYSICAL_RUNTIME_MEDITATION_AND_SELF_IMPROVEMENT_VERIFIED'
          Write-Host 'MEDITATION_IA_PHASE=100_PERCENT_CERTIFIED'

      - name: Cleanup certification controller
        if: always()
        run: |
          $pidFile=Join-Path $env:ARIA_CERT_ROOT 'controller.pid'
          if(Test-Path $pidFile){try{$p=[int](Get-Content -Raw $pidFile).Trim();Stop-Process -Id $p -Force -ErrorAction SilentlyContinue}catch{}}
