name: ARIA Meditation IA Final Physical Certification

on:
  push:
    branches: ["aria/self-improvement-v1-main"]
    paths:
      - 'agents/windows/**'
      - 'autonomy/**'
      - 'self-development/**'
      - 'self-model/**'
      - 'tests/**'
      - '.github/workflows/aria-meditation-final-certification.yml'
  pull_request:
    branches: ["aria/meditation-ia-v1-main"]
    paths:
      - 'agents/windows/**'
      - 'autonomy/**'
      - 'self-development/**'
      - 'self-model/**'
      - 'tests/**'
      - '.github/workflows/aria-meditation-final-certification.yml'
  workflow_dispatch:

concurrency:
  group: aria-meditation-final-certification-windows
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify:
    name: certify-physical-meditation-and-self-improvement
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      ARIA_TARGET_DEVICE_ID: windows-fe722cc6681e4f9c9cc35f5ebbb0a089
      ARIA_CERT_ROOT: 'D:\ARIA-Windows-Agent\Runtime\meditation-cert'
      ARIA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact source
        shell: cmd
        run: |
          git config --global --add safe.directory "%CD%" 2>nul
          git reset --hard HEAD
          git clean -ffdx
          set SHA=%ARIA_EXPECTED_SHA%
          if "%SHA%"=="" exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$b=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('x-access-token:'+$env:GITHUB_TOKEN)); git config --local http.https://github.com/.extraheader ('AUTHORIZATION: basic '+$b)"
          git checkout --detach HEAD
          git branch -D %SHA% 2>nul
          git fetch --no-tags --depth=1 origin %SHA%
          if errorlevel 1 exit /b 1
          git checkout --detach --force %SHA%
          for /f %%H in ('git rev-parse HEAD') do set HEADSHA=%%H
          if not "%HEADSHA%"=="%SHA%" exit /b 1
          echo SOURCE_CHECKOUT_VERIFIED=PASS commit=%HEADSHA%

      - name: Assert single-owner runtime boundary
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$runtime='D:\ARIA-Windows-Agent\Runtime\windows'; $watchdog=Join-Path $runtime 'run-agent.ps1'; $agent=Join-Path $runtime 'aria-agent.js'; $meditation=Join-Path $runtime 'aria-meditation-controller.js'; $selfImprovement=Join-Path $runtime 'self-improvement-runtime.js'; if(-not(Test-Path $watchdog)){throw 'Watchdog runtime missing'}; if(-not(Test-Path $agent)){throw 'Agent runtime missing'}; if(-not(Test-Path $meditation)){throw 'Meditation runtime missing'}; if(-not(Test-Path $selfImprovement)){throw 'Self-improvement runtime missing'}; $text=Get-Content -Raw $watchdog; if($text -notmatch 'Global\\ARIA-Windows-Agent-Watchdog-v1'){throw 'Global watchdog mutex missing'}; Write-Host 'SINGLE_OWNER_BOUNDARY=PASS'; Write-Host 'RUNNER_DOES_NOT_OWN_AGENT_LIFECYCLE=PASS'"
          if errorlevel 1 exit /b 1

      - name: Synchronize physical runtime source
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$runtime='D:\ARIA-Windows-Agent\Runtime\windows'; $repo=Join-Path $env:GITHUB_WORKSPACE 'agents\windows'; foreach($file in @('aria-agent.js','aria-meditation-controller.js','self-improvement-runtime.js','run-agent.ps1')){Copy-Item -Path (Join-Path $repo $file) -Destination (Join-Path $runtime $file) -Force}; foreach($dirName in @('autonomy','self-development','self-model')){$source=Join-Path $env:GITHUB_WORKSPACE $dirName;$dest=Join-Path 'D:\ARIA-Windows-Agent\Runtime' $dirName;New-Item -ItemType Directory -Force -Path $dest|Out-Null;Copy-Item -Path (Join-Path $source '*') -Destination $dest -Recurse -Force}; Set-Content -Path 'D:\ARIA-Windows-Agent\Logs\runtime-source-sha' -Value $env:ARIA_EXPECTED_SHA -Encoding ASCII -Force; Write-Host 'PHYSICAL_RUNTIME_SYNC=PASS'; Write-Host ('RUNTIME_SOURCE_SHA='+$env:ARIA_EXPECTED_SHA)"
          if errorlevel 1 exit /b 1

      - name: Refresh Agent through watchdog owner
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$log='D:\ARIA-Windows-Agent\Logs'; $runtime='D:\ARIA-Windows-Agent\Runtime\windows'; $statusPath=Join-Path $log 'status.json'; $watchdogPidPath=Join-Path $log 'watchdog.pid'; $requestPath=Join-Path $log 'kill-request.json'; function ReadStatus { try { if(Test-Path $statusPath){return (Get-Content -Raw $statusPath|ConvertFrom-Json)} } catch {}; return $null }; function ProcessExists([int]$pid){try{Get-Process -Id $pid -ErrorAction Stop|Out-Null;return $true}catch{return $false}}; $s=ReadStatus; $before=if($s){[string]$s.agent_pid}else{''}; $watchdogPid=0; try{if(Test-Path $watchdogPidPath){$watchdogPid=[int](Get-Content -Raw $watchdogPidPath).Trim()}}catch{}; if($watchdogPid -le 0 -or -not(ProcessExists $watchdogPid)){Write-Host 'WATCHDOG_BOOTSTRAP=START'; Start-Process powershell.exe -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',(Join-Path $runtime 'run-agent.ps1')) -WindowStyle Hidden | Out-Null; Start-Sleep -Seconds 3; $watchdogPid=0; try{if(Test-Path $watchdogPidPath){$watchdogPid=[int](Get-Content -Raw $watchdogPidPath).Trim()}}catch{}; Write-Host ('WATCHDOG_BOOTSTRAP_PID='+$watchdogPid)} else {Write-Host ('WATCHDOG_ALREADY_RUNNING_PID='+$watchdogPid)}; $request=('{"reason":"certification-source-refresh","source_sha":"'+$env:ARIA_EXPECTED_SHA+'"}'); Set-Content -Path $requestPath -Value $request -Encoding UTF8 -Force; Write-Host ('WATCHDOG_REFRESH_REQUEST=json source_sha='+$env:ARIA_EXPECTED_SHA); for($i=0;$i-lt 180;$i++){Start-Sleep -Seconds 1; $s=ReadStatus; if($s -and $s.state -eq 'agent_running' -and -not [string]::IsNullOrWhiteSpace([string]$s.agent_pid) -and [string]$s.agent_pid -ne $before){Write-Host ('AGENT_REFRESHED=PASS old='+$before+' new='+$s.agent_pid); exit 0}}; try{Write-Host ('WATCHDOG_STATUS_FINAL='+(Get-Content -Raw $statusPath))}catch{}; throw 'Watchdog did not recover Agent after runtime synchronization'"
          if errorlevel 1 exit /b 1

      - name: Run complete four-stage physical certification
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\agents\windows\meditation-final-certification.ps1"
          if errorlevel 1 exit /b 1