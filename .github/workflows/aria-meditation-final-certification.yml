name: ARIA Meditation IA Final Physical Certification

on:
  pull_request:
    branches: ["aria/meditation-ia-v1-main"]
    paths:
      - 'agents/windows/**'
      - 'autonomy/**'
      - 'self-development/**'
      - 'self-model/**'
      - 'tests/**'
      - '.github/workflows/aria-meditation-final-certification.yml'
  workflow_dispatch:

concurrency:
  group: aria-meditation-final-certification-windows
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify:
    name: certify-physical-meditation-and-self-improvement
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      ARIA_TARGET_DEVICE_ID: windows-fe722cc6681e4f9c9cc35f5ebbb0a089
      ARIA_CERT_ROOT: 'D:\ARIA-Windows-Agent\Runtime\meditation-cert'
    defaults:
      run:
        shell: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "& { . ''{0}'' }"'
    steps:
      - name: Checkout exact source
        run: |
          $ErrorActionPreference='Stop'
          git config --global --add safe.directory "$PWD" 2>$null
          git reset --hard HEAD
          git clean -ffdx
          $sha=$env:GITHUB_SHA
          $basic=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GITHUB_TOKEN"))
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $basic"
          git fetch --no-tags --depth=1 origin "+$sha`:$sha"
          git checkout --force $sha
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $sha){throw "Checkout mismatch: $head expected $sha"}
          Write-Host "SOURCE_CHECKOUT_VERIFIED=PASS commit=$head"

      - name: Stage 1 - persistence and auto-start
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\agents\windows\install-v2.ps1'
          if($LASTEXITCODE -ne 0){throw "Installer exit=$LASTEXITCODE"}
          $run=(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'ARIA-Windows-Local-Agent' -ErrorAction SilentlyContinue).'ARIA-Windows-Local-Agent'
          if([string]::IsNullOrWhiteSpace($run) -or $run -notmatch 'run-agent\.ps1'){throw 'ARIA user auto-start missing'}
          $statusPath='D:\ARIA-Windows-Agent\Logs\status.json'
          $ready=$false
          for($i=0;$i-lt45;$i++){
            if(Test-Path $statusPath){try{$s=Get-Content -Raw $statusPath|ConvertFrom-Json;if($s.state -eq 'agent_running'){$ready=$true;break}}catch{}}
            Start-Sleep 1
          }
          if(-not$ready){throw 'ARIA watchdog/agent not running'}
          $m=Invoke-RestMethod 'http://127.0.0.1:45873/status' -TimeoutSec 5
          if($m.version -ne 'aria-meditation-ia-v1' -or $m.mode -ne 'active'){throw "Meditation state invalid: $($m.version)/$($m.mode)"}
          Write-Host 'PERSISTENCE_STAGE=PASS'
          Write-Host "MEDITATION_TICK=$($m.tick_count)"

      - name: Stage 2 - recovery and single instance
        run: |
          $ErrorActionPreference='Stop'
          $statusPath='D:\ARIA-Windows-Agent\Logs\status.json'
          $before=Get-Content -Raw $statusPath|ConvertFrom-Json
          $beforePid=[string]$before.agent_pid
          if([string]::IsNullOrWhiteSpace($beforePid)){throw 'Missing current agent pid'}
          Set-Content -Path 'D:\ARIA-Windows-Agent\Logs\kill-request' -Value 'final-cert-recovery' -Encoding UTF8 -Force
          $new=$null
          for($i=0;$i-lt60;$i++){
            try{$new=Get-Content -Raw $statusPath|ConvertFrom-Json}catch{}
            if($new -and $new.state -eq 'agent_running' -and [string]$new.agent_pid -ne $beforePid){break}
            Start-Sleep 1
          }
          if(-not$new -or $new.state -ne 'agent_running'){throw 'Watchdog did not recover agent'}
          if([string]$new.agent_pid -eq $beforePid){throw 'Agent PID did not change'}
          $m=$null
          for($i=0;$i-lt60;$i++){
            try{$m=Invoke-RestMethod 'http://127.0.0.1:45873/status' -TimeoutSec 3;if($m.version -eq 'aria-meditation-ia-v1' -and $m.mode -eq 'active'){break}}catch{}
            Start-Sleep 1
          }
          if(-not$m -or $m.version -ne 'aria-meditation-ia-v1' -or $m.mode -ne 'active'){throw 'Meditation did not recover'}
          $agents=@(Get-CimInstance Win32_Process -Filter "Name='node.exe'"|Where-Object{$_.CommandLine -and $_.CommandLine -match 'aria-agent\.js'})
          if($agents.Count -ne 1){throw "Expected one ARIA agent, found $($agents.Count)"}
          Write-Host "ARIA_AGENT_RECOVERY=$beforePid->$($new.agent_pid)"
          Write-Host 'SINGLE_AGENT_INSTANCE=PASS'
          Write-Host 'WATCHDOG_MEDITATION_RECOVERY=PASS'
          Write-Host 'RECOVERY_STAGE=PASS'

      - name: Stage 3 - live Meditation to ARIA gateway
        run: |
          $ErrorActionPreference='Stop'
          $m=Invoke-RestMethod 'http://127.0.0.1:45873/status' -TimeoutSec 5
          $start=[int]$m.tick_count
          $advanced=$false
          for($i=0;$i-lt45;$i++){
            Start-Sleep 1
            $m2=Invoke-RestMethod 'http://127.0.0.1:45873/status' -TimeoutSec 5
            if([int]$m2.tick_count -gt $start){$advanced=$true;break}
          }
          if(-not$advanced){throw "Meditation tick did not advance from $start"}
          if($m2.mode -ne 'active'){throw 'Meditation lost active mode'}
          if($null -eq $m2.last_result){throw 'No Meditation gateway result'}
          if($m2.last_result.error -eq 'meditation_gateway_config_missing'){throw 'Gateway configuration missing'}
          $p=Get-Content -Path 'D:\ARIA-Windows-Agent\Runtime\meditation\ARIA-Meditation-IA.txt' -Tail 80 -ErrorAction Stop
          if(-not(($p -join "`n") -match 'JOB RESULT|IDLE tick=')){throw 'No recent autonomous Meditation activity in log'}
          Write-Host "MEDITATION_TICK_ADVANCE=$start->$($m2.tick_count)"
          Write-Host ('MEDITATION_GATEWAY_RESULT=' + ($m2.last_result|ConvertTo-Json -Compress -Depth 12))
          Write-Host 'INTEGRATION_STAGE=PASS'

      - name: Stage 4 - physical self-improvement proof
        run: |
          $ErrorActionPreference='Stop'
          $runtime='D:\ARIA-Windows-Agent\Runtime\windows\self-improvement-runtime.js'
          if(-not(Test-Path $runtime)){throw 'Self-improvement runtime missing'}
          $job=@{device_id=$env:ARIA_TARGET_DEVICE_ID;operation='self.improve';command=(@{goal='Meditation IA final physical reliability certification';category='reliability';risk='LOW';scope=@('physical-certification.js');proposed_changes=@(@{path='physical-certification.js';content="module.exports = { status: 'ok' };";risk_level='LOW'});mission_id='aria-meditation-final-certification';step_id='physical-self-improvement'}|ConvertTo-Json -Compress -Depth 10}|ConvertTo-Json -Compress -Depth 10
          $env:ARIA_SELF_IMPROVEMENT_JOB=$job
          $out=& node -e "const {executeSelfImprovementJob}=require('D:\\ARIA-Windows-Agent\\Runtime\\windows\\self-improvement-runtime.js'); const job=JSON.parse(process.env.ARIA_SELF_IMPROVEMENT_JOB); executeSelfImprovementJob(job, process.env.ARIA_TARGET_DEVICE_ID).then(r=>{console.log(JSON.stringify(r)); if(r.status!=='succeeded'||r.coordinator_status!=='completed'||r.stop_reason!=='verified') process.exit(1)}).catch(e=>{console.error(e.stack||e);process.exit(1)})" 2>&1
          $out|Write-Host
          if($LASTEXITCODE -ne 0){throw 'Physical self-improvement proof failed'}
          if(-not(Test-Path 'D:\ARIA-Windows-Agent\Data\self-improvement-last.json')){throw 'Evidence file missing'}
          Write-Host 'PHYSICAL_SELF_IMPROVEMENT=PASS'
          Write-Host 'CERTIFICATION_STAGE=PASS'
          Write-Host 'ARIA_SELF_IMPROVEMENT_WINDOWS_PHYSICAL_E2E=PASS'
          Write-Host 'STATUS=PHYSICAL_RUNTIME_MEDITATION_AND_SELF_IMPROVEMENT_VERIFIED'
          Write-Host 'MEDITATION_IA_PHASE=100_PERCENT_CERTIFIED'
