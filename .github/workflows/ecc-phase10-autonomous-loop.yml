name: ECC Phase 10 Autonomous Loop

on:
  pull_request:
    branches:
      - aria/ecc-phase-09-workflow-translator
    paths:
      - 'scripts/ecc-autonomous-loop.js'
      - 'tests/ecc-autonomous-loop.test.js'
      - '.github/workflows/ecc-phase10-autonomous-loop.yml'
  push:
    branches:
      - 'aria/ecc-phase-10-autonomous-loop'
    paths:
      - 'scripts/ecc-autonomous-loop.js'
      - 'tests/ecc-autonomous-loop.test.js'
      - '.github/workflows/ecc-phase10-autonomous-loop.yml'

permissions:
  contents: read

jobs:
  loop:
    name: ECC Phase 10 / autonomous loop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract test
        run: node tests/ecc-autonomous-loop.test.js
