            if ($statusExit -ne 0) { Write-Warning "W32TIME_STATUS_FAILED_EXIT=$statusExit" }
          } catch {
            Write-Warning "W32TIME_STATUS_EXCEPTION=$($_.Exception.Message)"
          }

          Write-Host 'W32TIME_RECOVERY=BEST_EFFORT'
      - name: Restart the disconnected Desktop Commander task and recover stopped ARIA tasks
        run: |
