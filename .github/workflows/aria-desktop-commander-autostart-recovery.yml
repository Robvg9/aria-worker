name: ARIA Desktop Commander Autostart Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aria-desktop-commander-autostart-recovery.yml'
  pull_request:
    paths:
      - '.github/workflows/aria-desktop-commander-autostart-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify recovery guards and canonical task names
        shell: bash
        run: |
          set -euo pipefail
          f=.github/workflows/aria-desktop-commander-autostart-recovery.yml
          grep -Fq "expected='windows-lacueva-780886'" "$f"
          grep -Fq "\$env:COMPUTERNAME -ine 'RobVG'" "$f"
          grep -Fq "ARIA-Desktop-Commander-Remote" "$f"
          grep -Fq "ARIA-Windows-Agent-Guardian" "$f"
          grep -Fq "ARIA-Windows-Local-Agent" "$f"
          test "$(grep -Fc '& schtasks.exe /End /TN $name' "$f")" -ge 3
          test "$(grep -Fc '& schtasks.exe /Run /TN $name' "$f")" -ge 3
          grep -Fq 'TASK_END_REQUESTED=$name' "$f"
          grep -Fq 'SCOPED_PROCESS_RESTART' "$f"
          grep -Fq "W32TIME_RECOVERY=BEST_EFFORT" "$f"
          grep -Fq "if: github.event_name != 'pull_request'" "$f"
          echo 'AUTOSTART_RECOVERY_GUARDS=PASS'

  recover-lacueva:
    if: github.event_name != 'pull_request'
    concurrency:
      group: aria-desktop-commander-recovery-lacueva
      cancel-in-progress: false
    runs-on: [aria-lacueva-runtime]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Guard LaCueva physical identity
        run: |
          $ErrorActionPreference = 'Stop'
          $configPath = 'D:\ARIA-Windows-Agent\Data\config.json'
          if (-not (Test-Path $configPath)) { throw "Missing device config: $configPath" }
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          $expected = 'windows-lacueva-780886'
          $actual = [string]$config.device_id
          if ($actual -ne $expected) { throw "WRONG_RUNNER_IDENTITY: expected=$expected actual=$actual. No task changes made." }
          Write-Host "RUNNER_IDENTITY_GUARD=PASS DEVICE_ID=$actual COMPUTERNAME=$env:COMPUTERNAME"

      - name: Attempt Windows Time recovery without blocking Desktop Commander recovery
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            $svc = Get-Service -Name 'W32Time' -ErrorAction Stop
            $svcInfo = Get-CimInstance Win32_Service -Filter "Name='W32Time'" -ErrorAction Stop
            Write-Host "W32TIME_STATE_BEFORE=$($svc.Status)"
            Write-Host "W32TIME_STARTMODE_BEFORE=$($svcInfo.StartMode)"
          } catch {
            Write-Warning "W32TIME_INSPECTION_FAILED=$($_.Exception.Message)"
          }

          try {
            Set-Service -Name 'W32Time' -StartupType Automatic -ErrorAction Stop
            Write-Host 'W32TIME_STARTUPTYPE=PASS'
          } catch {
            Write-Warning "W32TIME_STARTUPTYPE_FAILED=$($_.Exception.Message)"
          }

          try {
            $svc = Get-Service -Name 'W32Time' -ErrorAction Stop
            if ($svc.Status -ne 'Running') {
              Start-Service -Name 'W32Time' -ErrorAction Stop
              Start-Sleep -Seconds 2
            }
            Write-Host "W32TIME_STATE_AFTER=$((Get-Service -Name 'W32Time').Status)"
          } catch {
            Write-Warning "W32TIME_START_FAILED=$($_.Exception.Message)"
          }

          try {
            $syncOutput = & w32tm.exe /resync /force 2>&1
            $syncExit = $LASTEXITCODE
            foreach ($line in $syncOutput) { Write-Host "W32TIME_RESYNC_OUTPUT=$([string]$line)" }
            Write-Host "W32TIME_RESYNC_EXIT=$syncExit"
            $global:LASTEXITCODE = 0
            if ($syncExit -ne 0) { Write-Warning "W32TIME_RESYNC_FAILED_EXIT=$syncExit" }
          } catch {
            Write-Warning "W32TIME_RESYNC_EXCEPTION=$($_.Exception.Message)"
          }

          try {
            $statusOutput = & w32tm.exe /query /status 2>&1
            $statusExit = $LASTEXITCODE
            foreach ($line in $statusOutput) {
              if ([string]$line -match '(?i)Source:|Last Successful Sync Time:|Stratum:|Leap Indicator:') {
                Write-Host "W32TIME_STATUS=$([string]$line)"
              }
            }
            $global:LASTEXITCODE = 0
            if ($statusExit -ne 0) { Write-Warning "W32TIME_STATUS_FAILED_EXIT=$statusExit" }
          } catch {
            Write-Warning "W32TIME_STATUS_EXCEPTION=$($_.Exception.Message)"
          }

          Write-Host 'W32TIME_RECOVERY=BEST_EFFORT'
      - name: Record Windows time synchronization status
        run: |
          $ErrorActionPreference = 'Continue'
          $nodePkg = 'D:\ARIA-Windows-Agent\Tools\DesktopCommanderRemote\node_modules\@wonderwhy-er\desktop-commander\package.json'
          if (Test-Path $nodePkg) {
            $pkg = Get-Content -Raw -LiteralPath $nodePkg | ConvertFrom-Json
            Write-Host "DC_INSTALLED_VERSION=$($pkg.version)"
          } else { Write-Host 'DC_INSTALLED_VERSION=UNKNOWN' }
          & w32tm.exe /query /status 2>&1 | ForEach-Object {
            if ([string]$_ -match '(?i)Source:|Last Successful Sync Time:|Stratum:|Leap Indicator:') { Write-Host "DC_TIME_SERVICE=$([string]$_)" }
          }

      - name: Restart the disconnected Desktop Commander task and recover stopped ARIA tasks
        run: |
          $ErrorActionPreference = 'Continue'
          $required = 'ARIA-Desktop-Commander-Remote'
          $names = @($required, 'ARIA-Windows-Agent-Guardian', 'ARIA-Windows-Local-Agent')
          $requiredTask = Get-ScheduledTask -TaskName $required -ErrorAction SilentlyContinue
          if ($null -eq $requiredTask) { throw "REQUIRED_TASK_MISSING=$required; refusing to fabricate a task action." }

          # End a stale Scheduled Task instance before asking Task Scheduler to start it again.
          foreach ($name in $names) {
            $task = Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue
            if ($null -eq $task) {
              if ($name -eq $required) { throw "REQUIRED_TASK_MISSING=$name" }
              Write-Host "OPTIONAL_TASK_MISSING=$name"
              continue
            }
            if ($task.State -eq 'Running') {
              Write-Host "TASK_END_REQUESTED=$name"
              & schtasks.exe /End /TN $name 2>&1 | Out-Host
              $endExit = $LASTEXITCODE
              $global:LASTEXITCODE = 0
              Write-Host "TASK_END_EXIT=$name EXIT=$endExit"
              if ($endExit -ne 0) { Write-Warning "TASK_END_NONZERO=$name EXIT=$endExit" }
            }
          }

          # Remove only confirmed ARIA/Desktop Commander child processes that can survive an ended task.
          Start-Sleep -Seconds 3
          $processRules = @(
            @{ label = 'DC_SUPERVISOR'; pattern = '(?i)desktop-commander-supervisor\.ps1' },
            @{ label = 'DC_NODE'; pattern = '(?i)D:\\ARIA-Windows-Agent\\Tools\\DesktopCommanderRemote\\' },
            @{ label = 'ARIA_WATCHDOG'; pattern = '(?i)D:\\ARIA-Windows-Agent\\Runtime\\windows\\run-agent\.ps1' },
            @{ label = 'ARIA_AGENT'; pattern = '(?i)D:\\ARIA-Windows-Agent\\Runtime\\windows\\aria-agent\.js' }
          )
          foreach ($rule in $processRules) {
            $found = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
              [string]$_.CommandLine -match $rule.pattern
            })
            foreach ($proc in $found) {
              Write-Host ("SCOPED_PROCESS_RESTART label={0} name={1} pid={2}" -f $rule.label,$proc.Name,$proc.ProcessId)
              try {
                Stop-Process -Id ([int]$proc.ProcessId) -Force -ErrorAction Stop
                Write-Host "SCOPED_PROCESS_STOP=PASS PID=$($proc.ProcessId)"
              } catch {
                Write-Warning "SCOPED_PROCESS_STOP_FAILED label=$($rule.label) PID=$($proc.ProcessId) error=$($_.Exception.Message)"
              }
            }
          }

          Start-Sleep -Seconds 2
          $dcTaskRunRequested = $false
          foreach ($name in $names) {
            $task = Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue
            if ($null -eq $task) {
              if ($name -eq $required) { throw "REQUIRED_TASK_MISSING=$name" }
              Write-Host "OPTIONAL_TASK_MISSING=$name"
              continue
            }

            Write-Host "TASK_RUN_REQUESTED=$name"
            & schtasks.exe /Run /TN $name 2>&1 | Out-Host
            $runExit = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            Write-Host "TASK_RUN_EXIT=$name EXIT=$runExit"
            if ($runExit -ne 0) { Write-Warning "TASK_RUN_NONZERO=$name EXIT=$runExit" }
            if ($name -eq $required -and $runExit -eq 0) { $dcTaskRunRequested = $true }
          }

          Start-Sleep -Seconds 8
          $info = Get-ScheduledTaskInfo -TaskName $required -ErrorAction Stop
          Write-Host "DC_TASK_LAST_RUN=$($info.LastRunTime.ToString('o'))"
          Write-Host "DC_TASK_LAST_RESULT=$($info.LastTaskResult)"
          Write-Host ("DC_TASK_LAST_RESULT_HEX=0x{0:X8}" -f [uint32]$info.LastTaskResult)
          $task = Get-ScheduledTask -TaskName $required -ErrorAction Stop
          Write-Host "DC_TASK_STATE=$($task.State)"
          Write-Host "DC_TASK_ENABLED=$($task.Settings.Enabled)"
          Write-Host "DC_TASK_PRINCIPAL=$($task.Principal.UserId)"
          Write-Host "DC_TASK_LOGON_TYPE=$($task.Principal.LogonType)"
          foreach ($action in $task.Actions) {
            $exe = [string]$action.Execute
            $args = [string]$action.Arguments
            $working = [string]$action.WorkingDirectory
            $scriptPath = ''
            $m = [regex]::Match($args, '(?i)(?:-File|--script|/c)\s+(?:"([^"]+)"|([^\s"]+))')
            if ($m.Success) {
              if ($m.Groups[1].Success) { $scriptPath = $m.Groups[1].Value } else { $scriptPath = $m.Groups[2].Value }
            }
            Write-Host "DC_TASK_ACTION_EXE=$exe"
            Write-Host "DC_TASK_ACTION_WORKDIR=$working"
            Write-Host "DC_TASK_ACTION_SCRIPT=$scriptPath"
            Write-Host "DC_TASK_ACTION_ARGS_LENGTH=$($args.Length)"
          }

          $logsRoot = 'D:\ARIA-Windows-Agent\Logs'
          foreach ($file in @('status.json','agent-heartbeat.json','desktop-commander-supervisor.json')) {
            $filePath = Join-Path $logsRoot $file
            if (-not (Test-Path $filePath)) { Write-Host "STATUS_FILE_MISSING=$file"; continue }
            try {
              $obj = Get-Content -Raw -LiteralPath $filePath | ConvertFrom-Json
              $age = [math]::Round(((Get-Date).ToUniversalTime() - (Get-Item -LiteralPath $filePath).LastWriteTimeUtc).TotalSeconds)
              Write-Host "STATUS_FILE=$file AGE_SECONDS=$age"
              foreach ($key in @('state','status','connected','online','pid','agent_pid','node_pid','supervisor_pid','updated_at','last_error','error','reason')) {
                $property = $obj.PSObject.Properties[$key]
                if ($null -ne $property) {
                  $value = [string]$property.Value
                  $value = $value -replace '(?i)Bearer\s+[A-Za-z0-9._~+/-]+', 'Bearer [REDACTED]'
                  $value = $value -replace '(?i)(token|secret|password|authorization|api[_-]?key)[^:=]{0,10}[:=]\s*[^,\s;]+', '$1=[REDACTED]'
                  $value = $value -replace 'https?://[^?\s]+\?[^\s]+', '[URL_QUERY_REDACTED]'
                  if ($value.Length -gt 220) { $value = $value.Substring(0,220) }
                  Write-Host ("STATUS_VALUE {0}.{1}={2}" -f $file,$key,$value)
                }
              }
            } catch { Write-Host "STATUS_FILE_READ_ERROR=$file TYPE=$($_.Exception.GetType().Name)" }
          }

          $supervisorLog = Join-Path $logsRoot 'desktop-commander-supervisor.log'
          if (Test-Path $supervisorLog) {
            $logLines = Get-Content -LiteralPath $supervisorLog -Tail 300 -ErrorAction SilentlyContinue
            $selected = @($logLines | Where-Object { $_ -match '(?i)error|exception|failed|disconnect|websocket|connect|401|403|unauthor|econn|timeout|closed|restart|spawn|online|register|heartbeat|refused|socket' } | Select-Object -Last 25)
            foreach ($line in $selected) {
              $safe = [string]$line
              $safe = $safe -replace '(?i)Bearer\s+[A-Za-z0-9._~+/-]+', 'Bearer [REDACTED]'
              $safe = $safe -replace '(?i)(token|secret|password|authorization|api[_-]?key)[^:=]{0,10}[:=]\s*[^,\s;]+', '$1=[REDACTED]'
              $safe = $safe -replace 'https?://[^?\s]+\?[^\s]+', '[URL_QUERY_REDACTED]'
              if ($safe.Length -gt 360) { $safe = $safe.Substring(0,360) }
              Write-Host "SUPERVISOR_LOG=$safe"
            }
          } else { Write-Host 'SUPERVISOR_LOG=MISSING' }

          Write-Host 'DC_TASK_DIAGNOSTICS=COMPLETE'
          Write-Host 'DC_TASK_ACTION=END_SCOPED_PROCESSES_AND_RUN_REQUESTED'
  recover-robvg:
    if: github.event_name != 'pull_request'
    concurrency:
      group: aria-desktop-commander-recovery-robvg
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Guard RobVG physical identity before touching tasks
