name: BattleCruiser Step 4 Android Preference Observe V7 (Read Only)
on:
  push:
    branches: [aria/bc-step4-android-e2e-20261021]
    paths: [.github/workflows/battlecruiser-step4-android-pref-observe-v7.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-step4-android-pref-observe-v7
  cancel-in-progress: false
jobs:
  android-observe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 4
    steps:
      - name: Read current Android accessibility tree once (no navigation or clicks)
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          project=os.environ.get('SUPABASE_PROJECT_REF','').strip()
          secret=os.environ.get('ARIA_RUNTIME_SHARED_SECRET','')
          if not project or not secret: raise SystemExit('BLOCKED: production secrets unavailable; values are not printed')
          base=f'https://{project}.supabase.co/functions/v1'
          headers={'Authorization':'Bearer '+secret,'content-type':'application/json','cache-control':'no-store'}
          mid=f"mission_bc_step4_android_pref_observe_v7_{os.environ['RUN_ID']}_{os.environ['RUN_ATTEMPT']}"
          device='android-termux-a1ebcfc7-9287-4603-a0f9-c519d12fd092'
          marker='BC_STEP4_ANDROID_PREF_OBSERVE_V7'
          command=r"""node <<'NODE'
          const {executeAndroidAccessibilityJob}=require('./computer-use/android-accessibility-v1.js');
          const marker='BC_STEP4_ANDROID_PREF_OBSERVE_V7';
          const q={operation:'observe',target_package:'com.android.chrome',allow_any_app:false,allowed_hosts:['battlecruiser.robvg9.workers.dev']};
          const clean=s=>typeof s==='string'?s.replace(/\\s+/g,' ').trim().replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}/ig,'[redacted]').slice(0,150):'';
          const norm=s=>clean(s).toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n').replace(/[‐-‒–—]/g,'-').trim();
          const defs=[
            {key:'auto_refresh',re:/actualizacion automatica/},
            {key:'sync_auto',re:/sincronizacion automatica/},
            {key:'sync_on_open',re:/sincronizar al abrir app/},
            {key:'sync_wifi_only',re:/sincronizar solo en wi.?fi/},
            {key:'notifications',re:/notificaciones/},
            {key:'compact_mode',re:/modo compacto/}
          ];
          function tree(root){
            const out=[],seen=new Set();let count=0;
            const walk=(n,path,d)=>{
              if(!n||typeof n!=='object'||Array.isArray(n)||seen.has(n)||d>28||count>=1200)return;
              seen.add(n);count++;
              const names=['name','label','contentDescription','text','hint'].map(k=>clean(n[k])).filter(Boolean);
              out.push({id:typeof n.id==='string'&&n.id?n.id:path,path,role:clean(n.role),className:clean(n.className||n.class),
                names,text:names.join(' | '),visible:n.visible!==false,clickable:!!n.clickable,enabled:n.enabled!==false,
                checkable:typeof n.checkable==='boolean'?n.checkable:null,checked:typeof n.checked==='boolean'?n.checked:null,
                scrollable:!!n.scrollable,bounds:n.bounds||null});
              if(Array.isArray(n.children))n.children.forEach((c,i)=>walk(c,path+'.'+i,d+1));
            };
            walk(root,'0',0);return {count,nodes:out};
          }
          (async()=>{
            const r=await executeAndroidAccessibilityJob({command:JSON.stringify(q),timeoutMs:10000});
            const p=r&&r.payload||{},root=p.root||(p.ui&&p.ui.root)||null,sc=root?tree(root):{count:0,nodes:[]};
            const controls=defs.map(d=>{
              const labelMatches=sc.nodes.filter(n=>n.names.some(v=>d.re.test(norm(v)))||d.re.test(norm(n.text)));
              const actual=labelMatches.filter(n=>norm(n.role)==='switch'||/android\\.widget\\.switch/i.test(n.className)||n.checkable===true);
              return {key:d.key,match_count:actual.length,nodes:actual.slice(0,3).map(n=>({id:n.id,role:n.role,className:n.className,text:n.text,checkable:n.checkable,checked:n.checked,enabled:n.enabled,visible:n.visible,bounds:n.bounds}))};
            });
            const result={marker,status:r&&r.status,ok:p.ok===true,reason:clean(r&&r.reason||p.reason),packageName:clean(p.packageName||(p.ui&&p.ui.packageName)),evidenceHash:p.evidence_hash||null,uiEvidenceHash:p.ui&&p.ui.evidence_hash||null,nodeCount:sc.count,controls};
            console.log(JSON.stringify(result));
            if(!root||p.ok!==true||r.status!=='succeeded')process.exitCode=1;
          })().catch(e=>{console.log(JSON.stringify({marker,ok:false,error:clean(String(e&&e.message||e))}));process.exitCode=1;});
          NODE"""
          metadata={'goal_source':'chat','source_application':'ChatGPT','project_name':'BattleCruiser','source':'battlecruiser_step4_android_pref_observe_v7','verification_marker':marker,'device_id':device,'requested_device_id':device,'operation':'shell.execute','executor_type':'device','requested_capability':'shell.execute','command':command,'risk':'READ','timeout_ms':14000,'target_package':'com.android.chrome','allowed_hosts':['battlecruiser.robvg9.workers.dev'],'read_only':True,'business_data_mutated':False,'explicit_device_intent':True,'human_gate_required':False}
          def post(fn,payload,timeout=40):
              req=urllib.request.Request(base+'/'+fn,data=json.dumps(payload).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read().decode())
                  except:return e.code,{}
          code,body=post('aria-direct-v1',{'goal':'BattleCruiser Paso 4/15: única lectura del árbol de accesibilidad Android actual para los seis interruptores allowlisted si ya están en pantalla. No navegar, no tocar controles, no cambiar preferencias. Marcador BC_STEP4_ANDROID_PREF_OBSERVE_V7.','mission_id':mid,'metadata':metadata})
          print('DISPATCH_HTTP='+str(code));print('MISSION_ID='+mid);print('DISPATCH_STATUS='+str(body.get('dispatch',{}).get('status','unknown')))
          if code>=300 or body.get('ok') is not True:print('DISPATCH_ERROR='+json.dumps(body,ensure_ascii=False)[:1200]);raise SystemExit(2)
          terminal={'succeeded','failed','blocked','rejected','cancelled','human_required','paused'}
          last={}
          for i in range(1,21):
              c,last=post('aria-mission-runner-v22',{'mission_id':mid},40)
              st=str(last.get('status','unknown'));print('POLL='+json.dumps({'n':i,'http':c,'status':st,'error':last.get('error'),'next_action':last.get('next_action')}))
              if st in terminal or c in (401,403,404):break
              time.sleep(2)
          st=str(last.get('status','unknown'));print('FINAL_STATUS='+st);print('FINAL='+json.dumps({k:last.get(k) for k in ('ok','status','mission_id','error','next_action','executor_types','results') if k in last},ensure_ascii=False)[:4000])
          if st!='succeeded':raise SystemExit(1)
          PY
