name: A6 Wi-Fi failover inventory (no checkout, read-only)

on:
  push:
    branches:
      - ops/a6-wifi-inventory-no-checkout-v1
    paths:
      - '.github/workflows/a6-wifi-inventory-no-checkout.yml'

permissions:
  contents: read

concurrency:
  group: a6-wifi-inventory-no-checkout-readonly
  cancel-in-progress: false

jobs:
  inspect:
    name: Read Wi-Fi failover inventory on ROBVG (no checkout)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Capture Wi-Fi state only (no network changes)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]$env:COMPUTERNAME -ine 'ROBVG') {
            throw "A6_RUNNER_HOST_MISMATCH expected=ROBVG actual=$env:COMPUTERNAME"
          }

          $started = [DateTimeOffset]::UtcNow
          Write-Output 'A6_WIFI_STAGE=begin'
          $adapters = @()
          $adapterError = $null
          try {
            $adapters = @(Get-NetAdapter -IncludeHidden -ErrorAction Stop |
              Where-Object {
                $_.InterfaceDescription -match 'Qualcomm|Wireless|Wi-Fi|802.11' -or
                $_.Name -match 'Wi-Fi|WLAN'
              } |
              Select-Object Name,InterfaceDescription,Status,LinkSpeed,InterfaceIndex)
          } catch {
            $adapterError = $_.Exception.GetType().Name
          }
          Write-Output "A6_WIFI_STAGE=adapters count=$($adapters.Count)"

          $wlanLines = @()
          try {
            $wlanLines = @(& netsh.exe wlan show interfaces 2>&1 | ForEach-Object { [string]$_ })
          } catch {
            $wlanLines = @('READ_ERROR:' + $_.Exception.GetType().Name)
          }
          $stateLine = $wlanLines |
            Where-Object { $_ -match '^\s*(State|Estado)\s*:' } |
            Select-Object -First 1
          $ssidLine = $wlanLines |
            Where-Object { $_ -match '^\s*SSID\s*:' -and $_ -notmatch 'BSSID' } |
            Select-Object -First 1
          Write-Output 'A6_WIFI_STAGE=interfaces'

          $profileLines = @()
          try {
            $profileLines = @(& netsh.exe wlan show profiles 2>&1 | ForEach-Object { [string]$_ })
          } catch {
            $profileLines = @('READ_ERROR:' + $_.Exception.GetType().Name)
          }
          $profiles = @()
          foreach ($line in $profileLines) {
            if ($line -match '(?i)(All User Profile|Perfil de todos los usuarios|Perfil de usuario)\s*:\s*(?<name>.+)$') {
              $profiles += [string]$Matches.name.Trim()
            }
          }
          Write-Output "A6_WIFI_STAGE=profiles count=$($profiles.Count)"

          $networkLines = @()
          try {
            $networkLines = @(& netsh.exe wlan show networks mode=bssid 2>&1 | ForEach-Object { [string]$_ })
          } catch {
            $networkLines = @('READ_ERROR:' + $_.Exception.GetType().Name)
          }
          $visible = @()
          foreach ($line in $networkLines) {
            if ($line -match '^\s*SSID\s+\d+\s*:\s*(?<name>.+)$') {
              $name = [string]$Matches.name.Trim()
              if ($name) { $visible += $name }
            }
          }
          $visible = @($visible | Select-Object -Unique | Select-Object -First 20)
          Write-Output "A6_WIFI_STAGE=visible_networks count=$($visible.Count)"

          $connectionProfiles = @()
          $connectionError = $null
          try {
            $connectionProfiles = @(Get-NetConnectionProfile -ErrorAction Stop |
              Select-Object Name,InterfaceAlias,NetworkCategory,IPv4Connectivity,IPv6Connectivity)
          } catch {
            $connectionError = $_.Exception.GetType().Name
          }

          $result = [ordered]@{
            status = 'READ_ONLY_WIFI_INVENTORY_COMPLETE'
            host = [string]$env:COMPUTERNAME
            captured_at_utc = [DateTimeOffset]::UtcNow.ToString('o')
            duration_seconds = [math]::Round(([DateTimeOffset]::UtcNow - $started).TotalSeconds,1)
            source_sha = [string]$env:GITHUB_SHA
            wifi_adapters = @($adapters)
            adapter_read_error = $adapterError
            wlan_interface_state = [string]$stateLine
            wlan_current_ssid = [string]$ssidLine
            wlan_saved_profiles = @($profiles)
            wlan_visible_networks = @($visible)
            connection_profiles = @($connectionProfiles)
            connection_read_error = $connectionError
            restrictions = @(
              'NO_ADAPTER_ENABLE_DISABLE',
              'NO_WIFI_CONNECT_DISCONNECT',
              'NO_PROFILE_OR_CREDENTIAL_READ',
              'NO_ROUTE_DNS_OR_POWER_CHANGES',
              'NO_RUNTIME_OR_MISSION_CHANGES'
            )
          }

          $json = $result | ConvertTo-Json -Depth 8 -Compress
          Write-Output 'A6_WIFI_EVIDENCE_BEGIN'
          Write-Output $json
          Write-Output 'A6_WIFI_EVIDENCE_END'
