name: Verify post-MSP regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Post-MSP regression battery
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
        run: |
          set -euo pipefail
          BASE="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          AUTH="Authorization: Bearer ${ARIA_RUNTIME_SHARED_SECRET}"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          sql() { supabase db query --linked "$1" || true; }
          tick() {
            curl -s -X POST "$BASE/aria-mission-runner-v22" -H "$AUTH" -H "content-type: application/json" \
              -d "{\"mission_id\":\"$1\"}" --max-time 180
          }
          FAIL=0
          TS=$(date +%s)

          echo "==== 1 NORMAL SUCCESS ===="
          MID1="mission_reg_ok_${TS}"
          curl -s -X POST "$BASE/aria-direct-v1" -H "$AUTH" -H "content-type: application/json" \
            -d "{\"goal\":\"Cloud-only: reply with exactly the word PONG using text generation. No devices.\",\"mission_id\":\"$MID1\",\"metadata\":{\"goal_source\":\"supervisor_probe\",\"probe\":\"regression_normal\",\"cloud_only\":true}}" \
            --max-time 60 | grep -q '"status":"queued"'
          term1=""
          for i in $(seq 1 14); do
            body=$(tick "$MID1")
            echo "R1_TICK $i: $(echo "$body" | head -c 350)"
            st=$(echo "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            case "$st" in succeeded|failed|blocked|paused) term1=$st; break ;; esac
            sleep 1
          done
          DB1=$(sql "SELECT status, lease_owner FROM aria_internal.mission_state WHERE mission_id='${MID1}';")
          echo "R1_DB=$DB1 TERMINAL=$term1"
          if [ "$term1" = "succeeded" ]; then echo "PASS_NORMAL_SUCCESS MID=$MID1"; else echo "FAIL normal"; FAIL=1; fi

          echo "==== 2 BYPASS ISOLATION ===="
          MID2a="mission_reg_iso_a_${TS}"
          curl -s -X POST "$BASE/aria-direct-v1" -H "$AUTH" -H "content-type: application/json" \
            -d "{\"goal\":\"Cloud-only: reply with exactly the word PONG using text generation. No devices.\",\"mission_id\":\"$MID2a\",\"metadata\":{\"goal_source\":\"supervisor_probe\",\"probe\":\"msp_isolation_no_fault\",\"cloud_only\":true}}" --max-time 60 >/dev/null
          python3 -c "import json; mid='$MID2a'; plan=[{\"id\":\"s1\",\"executor_type\":\"model\",\"operation\":\"text_generation\",\"risk\":\"READ\",\"target\":{\"provider_id\":\"google\",\"account_id\":\"google-primary\",\"model_id\":\"google/gemini-3.5-flash-lite-direct\"},\"input\":{\"payload\":{\"prompt\":\"PONG\"}},\"authorization\":{\"status\":\"approved\",\"risk_class\":\"READ\"}}]; pj=json.dumps(plan).replace(\"'\",\"''\"); open('/tmp/s2a.sql','w').write(f\"UPDATE aria_internal.mission_state SET checkpoint=jsonb_build_object('plan','{pj}'::jsonb), status='queued', lease_owner=null, lease_until=null WHERE mission_id='{mid}';\")"
          sql "$(cat /tmp/s2a.sql)"
          body2a=$(tick "$MID2a")
          echo "R2A: $(echo "$body2a" | head -c 400)"
          if echo "$body2a" | grep -q 'skipped_for_msp_probe'; then echo "FAIL isolation"; FAIL=1; else echo "PASS_ISOLATION_MSP_WITHOUT_FAULT"; fi
          if echo "$body2a" | grep -q 'replanned_learning\|learned_preflight'; then echo "PASS_LEARNING_GATE_ACTIVE_ON_MSP_NO_FAULT"; fi

          MID2b="mission_reg_iso_b_${TS}"
          curl -s -X POST "$BASE/aria-direct-v1" -H "$AUTH" -H "content-type: application/json" \
            -d "{\"goal\":\"Cloud-only: reply with exactly the word PONG using text generation. No devices.\",\"mission_id\":\"$MID2b\",\"metadata\":{\"goal_source\":\"supervisor_probe\",\"probe\":\"regression_iso\",\"cloud_only\":true}}" --max-time 60 >/dev/null
          body2b=$(tick "$MID2b")
          echo "R2B: $(echo "$body2b" | head -c 300)"
          if echo "$body2b" | grep -q 'skipped_for_msp_probe'; then echo "FAIL iso normal"; FAIL=1; else echo "PASS_ISOLATION_NORMAL"; fi

          echo "==== 3 FAILED TERMINALIZATION ===="
          MID3="mission_reg_fail_${TS}"
          curl -s -X POST "$BASE/aria-direct-v1" -H "$AUTH" -H "content-type: application/json" \
            -d "{\"goal\":\"REG-FAIL-${TS}: emit ZX9Q. Cloud only.\",\"mission_id\":\"$MID3\",\"metadata\":{\"goal_source\":\"supervisor_probe\",\"probe\":\"msp_reg_fail\",\"cloud_only\":true}}" --max-time 60 >/dev/null
          python3 -c "import json; mid='$MID3'; plan=[{\"id\":\"s1\",\"executor_type\":\"model\",\"operation\":\"text_generation\",\"risk\":\"READ\",\"retryable\":False,\"max_attempts\":1,\"target\":{\"provider_id\":\"google\",\"account_id\":\"google-primary\",\"model_id\":\"google/gemini-3.5-flash-lite-direct\"},\"input\":{\"payload\":{\"prompt\":\"ZX9Q\"},\"fault_injection\":\"http_500\",\"fault_all_routes\":True},\"authorization\":{\"status\":\"approved\",\"risk_class\":\"READ\"}}]; pj=json.dumps(plan).replace(\"'\",\"''\"); open('/tmp/s3.sql','w').write(f\"UPDATE aria_internal.mission_state SET checkpoint=jsonb_build_object('plan','{pj}'::jsonb), status='queued', lease_owner=null, lease_until=null WHERE mission_id='{mid}';\")"
          sql "$(cat /tmp/s3.sql)"
          body3=$(tick "$MID3")
          echo "R3: $(echo "$body3" | head -c 450)"
          DB3=$(sql "SELECT status, last_stderr, lease_owner FROM aria_internal.mission_state WHERE mission_id='${MID3}';")
          echo "R3_DB=$DB3"
          if echo "$body3" | grep -q 'mission_lease_required'; then echo "FAIL lease_required"; FAIL=1
          elif echo "$DB3" | grep -qw failed; then echo "PASS_FAILED_TERMINAL MID=$MID3"
          else echo "FAIL not failed"; FAIL=1; fi

          echo "==== 4 CLAIM_NEXT + STALE ===="
          MID4="mission_reg_stale_${TS}"
          curl -s -X POST "$BASE/aria-direct-v1" -H "$AUTH" -H "content-type: application/json" \
            -d "{\"goal\":\"Cloud-only: reply with exactly the word PONG using text generation. No devices.\",\"mission_id\":\"$MID4\",\"metadata\":{\"goal_source\":\"supervisor_probe\",\"probe\":\"regression_stale\",\"cloud_only\":true}}" --max-time 60 >/dev/null
          body4=$(tick "$MID4")
          echo "R4_T1: $(echo "$body4" | head -c 300)"
          sql "UPDATE aria_internal.mission_state SET status='running', next_action='next_ready_batch', lease_owner=null, lease_until=null, updated_at=clock_timestamp() WHERE mission_id='${MID4}';"
          body_cn=$(curl -s -X POST "$BASE/aria-mission-runner-v22" -H "$AUTH" -H "content-type: application/json" -d '{}' --max-time 90)
          cn_mid=$(echo "$body_cn" | python3 -c "import sys,json;print(json.load(sys.stdin).get('mission_id') or '')" 2>/dev/null || true)
          echo "R4_CLAIM_NEXT_MID=$cn_mid"
          if [ "$cn_mid" = "$MID4" ]; then echo "FAIL claim_next stole fresh"; FAIL=1; else echo "PASS_CLAIM_NEXT_SKIPS_FRESH"; fi
          sql "UPDATE aria_internal.mission_state SET status='running', next_action='next_ready_batch', lease_owner=null, lease_until=null, updated_at=clock_timestamp() - interval '11 minutes' WHERE mission_id='${MID4}';"
          BOOL=$(sql "SELECT (m.status='running' AND m.lease_owner IS NULL AND NOT (coalesce(m.next_action,'')='next_ready_batch' AND m.updated_at > clock_timestamp() - interval '10 minutes')) AS eligible FROM aria_internal.mission_state m WHERE m.mission_id='${MID4}';")
          echo "R4_STALE_BOOL=$BOOL"
          if echo "$BOOL" | grep -qiE 't|true'; then echo "PASS_STALE_RECOVERABLE MID=$MID4"; else echo "FAIL stale"; FAIL=1; fi
          body_id=$(tick "$MID4")
          echo "R4_BY_ID: $(echo "$body_id" | head -c 300)"
          sql "UPDATE aria_internal.mission_state SET status='paused', next_action='regression_cleanup', lease_owner=null WHERE mission_id='${MID4}';" || true

          echo "==== SUMMARY FAIL=$FAIL ===="
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "MISSION_RUNNER_POST_MSP_REGRESSION = PASS"
