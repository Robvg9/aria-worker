name: BattleCruiser Step 4 Safe Sales Category Filters V1 (Read Only)
on:
  push:
    branches:
      - aria/bc-step4-android-e2e-20261021
    paths:
      - .github/workflows/battlecruiser-step4-sales-category-filters-v1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-step4-sales-category-filters-v1
  cancel-in-progress: false
jobs:
  android-sales-filters:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Observe Sales category filters with no business writes
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.request, urllib.error
          project=os.environ.get('SUPABASE_PROJECT_REF','').strip()
          secret=os.environ.get('ARIA_RUNTIME_SHARED_SECRET','')
          if not project or not secret: raise SystemExit('BLOCKED: production secrets unavailable')
          base=f'https://{project}.supabase.co/functions/v1'
          headers={'Authorization':'Bearer '+secret,'content-type':'application/json','cache-control':'no-store'}
          mission_id=f"mission_bc_step4_sales_category_filters_readonly_v1_{os.environ['RUN_ID']}_{os.environ['RUN_ATTEMPT']}"
          device='android-termux-a1ebcfc7-9287-4603-a0f9-c519d12fd092'
          marker='BC_STEP4_SALES_CATEGORY_FILTERS_READONLY_V1'
          command=r"""node <<'NODE'
          const {executeAndroidAccessibilityJob}=require('./computer-use/android-accessibility-v1.js');
          const marker='BC_STEP4_SALES_CATEGORY_FILTERS_READONLY_V1',host='battlecruiser.robvg9.workers.dev';
          const base={target_package:'com.android.chrome',allow_any_app:false,allowed_hosts:[host]};
          const clean=s=>typeof s==='string'?s.replace(/\s+/g,' ').trim().slice(0,100):'';
          const norm=s=>clean(s).toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n').trim();
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function send(q){return await executeAndroidAccessibilityJob({command:JSON.stringify({...base,...q}),timeoutMs:18000});}
          async function observe(){const r=await send({operation:'observe'}),p=r&&r.payload||{},root=p.root||(p.ui&&p.ui.root)||null;return {r,p,root};}
          async function action(a){return await send({operation:'action',action:a});}
          function scan(root){
            const nodes=[],seen=new Set();let count=0;
            const walk=(n,path,d)=>{
              if(!n||typeof n!=='object'||Array.isArray(n)||seen.has(n)||d>28||count>=1200)return;
              seen.add(n);count++;
              const names=['name','label','contentDescription','text','hint'].map(k=>clean(n[k])).filter(Boolean);
              nodes.push({id:typeof n.id==='string'&&n.id?n.id:path,path,role:clean(n.role),className:clean(n.className||n.class),names,text:names.join(' | '),
                visible:n.visible!==false,clickable:!!n.clickable,enabled:n.enabled!==false,scrollable:!!n.scrollable,
                bounds:n.bounds||null,checked:typeof n.checked==='boolean'?n.checked:null});
              if(Array.isArray(n.children))n.children.forEach((c,i)=>walk(c,path+'.'+i,d+1));
            };
            walk(root,'0',0);return nodes;
          }
          const exactNode=(nodes,label,opts={})=>nodes.find(n=>n.names.some(t=>norm(t)===norm(label))&&(!opts.visible||n.visible)&&(!opts.clickable||n.clickable)&&(!opts.enabled||n.enabled));
          function evidence(obs){
            const nodes=obs.root?scan(obs.root):[];
            const visible=nodes.filter(n=>n.visible&&n.text);
            const emptyMarkers=visible.filter(n=>/sin resultados|no hay productos|no se encontraron productos|catalogo vacio|catálogo vacío/i.test(n.text)).length;
            const likelyProductRows=nodes.filter(n=>n.visible&&(/product-card|producto-card|catalogo-item|venta-producto|producto-item/i.test(n.id+' '+n.className)||/agregar al carrito|añadir al carrito/i.test(n.text))).length;
            const filterLabels=nodes.filter(n=>n.visible&&n.clickable&&['todos','bebidas','confituras','dulces artesanales'].includes(norm(n.text))).map(n=>({text:n.text,enabled:n.enabled,bounds:n.bounds}));
            return {hash:obs.p.evidence_hash||null,nodeCount:nodes.length,visibleTextCount:visible.length,emptyMarkers,likelyProductRows,filterLabels,appMarkerVisible:visible.some(n=>/ventas|punto de venta/i.test(n.text))};
          }
          (async()=>{
            const timeline=[],baseline={};
            let nav=await action({action:'navigate',url:'https://'+host});
            timeline.push({step:'navigate_live',status:nav&&nav.status,reason:clean(nav&&nav.reason||nav&&nav.payload&&nav.payload.reason)});
            await wait(2200);
            let current=await observe(),nodes=current.root?scan(current.root):[];
            for(let i=0;i<8&&(!current.root||nodes.length<60||!exactNode(nodes,'Abrir menú',{visible:true,clickable:true,enabled:true}));i++){
              await wait(800);current=await observe();nodes=current.root?scan(current.root):[];
            }
            if(!current.root||!exactNode(nodes,'Abrir menú',{visible:true,clickable:true,enabled:true})){
              console.log(JSON.stringify({marker,ok:false,stage:'dashboard_or_menu_not_ready',timeline,screen:evidence(current)}));process.exitCode=1;return;
            }
            const open=exactNode(nodes,'Abrir menú',{visible:true,clickable:true,enabled:true});
            const openResult=await action({action:'click',nodeId:open.id});
            timeline.push({step:'open_menu',status:openResult&&openResult.status});
            await wait(350);current=await observe();nodes=current.root?scan(current.root):[];
            let sales=exactNode(nodes,'Ventas',{visible:true,clickable:true,enabled:true});
            for(let i=0;i<3&&!sales;i++){
              const drawer=nodes.find(n=>n.visible&&n.scrollable&&/sidebar|navigationview|menu/i.test(n.id+' '+n.className))||nodes.find(n=>n.visible&&n.scrollable);
              if(!drawer)break;
              const sr=await action({action:'scroll',nodeId:drawer.id,direction:'backward'});
              timeline.push({step:'scroll_menu',status:sr&&sr.status});
              await wait(250);current=await observe();nodes=current.root?scan(current.root):[];
              sales=exactNode(nodes,'Ventas',{visible:true,clickable:true,enabled:true});
            }
            if(!sales){console.log(JSON.stringify({marker,ok:false,stage:'sales_button_not_found',timeline,screen:evidence(current)}));process.exitCode=2;return;}
            const salesClick=await action({action:'click',nodeId:sales.id});
            timeline.push({step:'open_sales',status:salesClick&&salesClick.status});
            await wait(800);current=await observe();nodes=current.root?scan(current.root):[];
            const beforeSales=evidence(current);
            const categories=['Todos','Bebidas','Confituras','Dulces artesanales'];
            const outcomes=[];
            for(const category of categories){
              const button=exactNode(nodes,category,{visible:true,clickable:true,enabled:true});
              if(!button){
                outcomes.push({category,status:'NOT_FOUND',hashBefore:current.p.evidence_hash||null});
                continue;
              }
              const beforeHash=current.p.evidence_hash||null;
              const click=await action({action:'click',nodeId:button.id});
              await wait(300);current=await observe();nodes=current.root?scan(current.root):[];
              const after=evidence(current);
              outcomes.push({category,status:click&&click.status==='succeeded'&&current.p.ok===true?'CLICK_AND_OBSERVE':'FAILED',reason:clean(click&&click.reason||click&&click.payload&&click.payload.reason),hashBefore:beforeHash,hashAfter:after.hash,hashChanged:!!beforeHash&&!!after.hash&&beforeHash!==after.hash,nodeCount:after.nodeCount,emptyMarkers:after.emptyMarkers,likelyProductRows:after.likelyProductRows,filterLabels:after.filterLabels});
            }
            let restored=false;
            const all=exactNode(nodes,'Todos',{visible:true,clickable:true,enabled:true});
            if(all){
              const rr=await action({action:'click',nodeId:all.id});
              await wait(300);current=await observe();
              restored=rr&&rr.status==='succeeded'&&current.p.ok===true;
              timeline.push({step:'restore_todos',status:rr&&rr.status,observed:restored});
            } else timeline.push({step:'restore_todos',status:'NOT_FOUND'});
            const result={marker,ok:true,timeline,beforeSales,outcomes,restoredToTodos:restored,final:evidence(current),
              safety:{businessWrites:false,cartMutated:false,saleConfirmed:false,logoutClicked:false}};
            console.log(JSON.stringify(result));
            if(outcomes.some(x=>x.status==='FAILED')||!restored)process.exitCode=3;
          })().catch(e=>{console.log(JSON.stringify({marker,ok:false,error:clean(String(e&&e.message||e))}));process.exitCode=1;});
          NODE"""
          metadata={'goal_source':'chat','source_application':'ChatGPT','project_name':'BattleCruiser','source':'battlecruiser_step4_sales_category_filters_readonly_v1','verification_marker':marker,'device_id':device,'requested_device_id':device,'operation':'shell.execute','executor_type':'device','requested_capability':'shell.execute','command':command,'risk':'READ','timeout_ms':30000,'target_package':'com.android.chrome','allowed_hosts':['battlecruiser.robvg9.workers.dev'],'read_only':True,'business_data_mutated':False,'explicit_device_intent':True,'human_gate_required':False}
          def post(fn,payload,timeout=75):
              req=urllib.request.Request(base+'/'+fn,data=json.dumps(payload).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read().decode())
                  except:return e.code,{}
          code,body=post('aria-direct-v1',{'goal':'BattleCruiser Paso 4/15: prueba física READ ONLY de filtros de categoría de Ventas: Todos, Bebidas, Confituras, Dulces artesanales y restaurar Todos. Captura hash/conteos/marcadores sanitizados; no añadir carrito, no confirmar venta, no cerrar turno, no escribir datos. Marcador BC_STEP4_SALES_CATEGORY_FILTERS_READONLY_V1.','mission_id':mission_id,'metadata':metadata})
          print('DISPATCH_HTTP='+str(code));print('MISSION_ID='+mission_id);print('DISPATCH_STATUS='+str(body.get('dispatch',{}).get('status','unknown')))
          if code>=300 or body.get('ok') is not True:print(json.dumps(body)[:1200]);raise SystemExit(2)
          terminal={'succeeded','failed','blocked','rejected','cancelled','human_required','paused'}
          last={}
          for i in range(1,61):
              c,last=post('aria-mission-runner-v22',{'mission_id':mission_id})
              s=str(last.get('status','unknown'));print('POLL='+json.dumps({'n':i,'http':c,'status':s,'error':last.get('error'),'next_action':last.get('next_action')}))
              if s in terminal or c in (401,403,404):break
              time.sleep(3)
          s=str(last.get('status','unknown'));print('FINAL_STATUS='+s);print('FINAL='+json.dumps({k:last.get(k) for k in ('ok','status','mission_id','error','next_action','executor_types','results') if k in last},ensure_ascii=False)[:6000])
          if s!='succeeded':raise SystemExit(1)
          PY
