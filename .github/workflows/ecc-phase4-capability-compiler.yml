name: ECC Phase 4 Capability Compiler

on:
  pull_request:
    branches:
      - aria/ecc-phase-03-drift-conflict
    paths:
      - 'scripts/ecc-capability-compiler.js'
      - 'tests/ecc-capability-compiler.test.js'
      - '.github/workflows/ecc-phase4-capability-compiler.yml'
  push:
    branches:
      - 'aria/ecc-phase-04-capability-compiler'
    paths:
      - 'scripts/ecc-capability-compiler.js'
      - 'tests/ecc-capability-compiler.test.js'
      - '.github/workflows/ecc-phase4-capability-compiler.yml'

permissions:
  contents: read

jobs:
  compiler:
    name: ECC Phase 4 / capability compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract test
        run: node tests/ecc-capability-compiler.test.js
