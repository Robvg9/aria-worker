name: Restore inbound ISSUER separation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore full source and apply ISSUER patch
        run: |
          set -euo pipefail
          # Restore last good full source (before PLACEHOLDER)
          git show 4f52636dd50222b49ad3cb6041ddcf83046d3983:supabase/functions/aria-mcp-inbound-grok-v1/index.ts > supabase/functions/aria-mcp-inbound-grok-v1/index.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/aria-mcp-inbound-grok-v1/index.ts')
          s = p.read_text()
          old = '''const RESOURCE =
  Deno.env.get("ARIA_MCP_INBOUND_RESOURCE") ??
  "https://icuqsstxfdbvjytkhlog.supabase.co/functions/v1/aria-mcp-inbound-grok-v1";

const ISSUER = RESOURCE;'''
          new = '''const RESOURCE =
  Deno.env.get("ARIA_MCP_INBOUND_RESOURCE") ??
  "https://icuqsstxfdbvjytkhlog.supabase.co/functions/v1/aria-mcp-inbound-grok-v1";

// When fronted by Worker: RESOURCE=.../mcp (audience), ISSUER=Worker origin (AS id).
const ISSUER =
  Deno.env.get("ARIA_MCP_INBOUND_ISSUER") ??
  RESOURCE;'''
          if old not in s:
              raise SystemExit('RESOURCE/ISSUER block not found')
          s = s.replace(old, new, 1)
          old2 = '''function wwwAuthenticate(): string {
  const meta = `${RESOURCE}/.well-known/oauth-protected-resource`;
  return `Bearer realm="aria-mcp-inbound", resource="${RESOURCE}", resource_metadata="${meta}"`;
}'''
          new2 = '''function wwwAuthenticate(): string {
  const meta =
    ISSUER !== RESOURCE
      ? `${ISSUER}/.well-known/oauth-protected-resource/mcp`
      : `${RESOURCE}/.well-known/oauth-protected-resource`;
  return `Bearer realm="aria-mcp-inbound", resource="${RESOURCE}", resource_metadata="${meta}"`;
}'''
          if old2 not in s:
              raise SystemExit('wwwAuthenticate not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          print('patched', len(s))
          PY
          grep -q ARIA_MCP_INBOUND_ISSUER supabase/functions/aria-mcp-inbound-grok-v1/index.ts
          grep -q issueAccessToken supabase/functions/aria-mcp-inbound-grok-v1/index.ts
          test "$(wc -c < supabase/functions/aria-mcp-inbound-grok-v1/index.ts)" -gt 20000
      - name: Commit restored source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/aria-mcp-inbound-grok-v1/index.ts
          git commit -m "fix(oauth): separate ISSUER from RESOURCE for Worker facade" || echo "no changes"
          git push origin HEAD:main
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Set RESOURCE and ISSUER secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          supabase secrets set \
            ARIA_MCP_INBOUND_RESOURCE=https://aria.robvg9.workers.dev/mcp \
            ARIA_MCP_INBOUND_ISSUER=https://aria.robvg9.workers.dev \
            --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy inbound
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy aria-mcp-inbound-grok-v1 \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt
      - name: Validate LIVE iss/aud metadata
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          BASE="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/aria-mcp-inbound-grok-v1"
          prm=$(curl --fail --silent --show-error --retry 3 "$BASE/.well-known/oauth-protected-resource")
          echo "$prm"
          echo "$prm" | python3 -c 'import sys,json; x=json.load(sys.stdin); assert x["resource"]=="https://aria.robvg9.workers.dev/mcp"; assert x["authorization_servers"]==["https://aria.robvg9.workers.dev"]'
          asm=$(curl --fail --silent --show-error --retry 3 "$BASE/.well-known/oauth-authorization-server")
          echo "$asm"
          echo "$asm" | python3 -c 'import sys,json; x=json.load(sys.stdin); assert x["issuer"]=="https://aria.robvg9.workers.dev"; assert x["authorization_endpoint"]=="https://aria.robvg9.workers.dev/authorize"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE" -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          test "$code" = "401"
          echo LIVE_OK
