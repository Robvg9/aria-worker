name: Forensic Remediation v1

on:
  push:
    branches: [audit/forensic-remediation-20260912]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: node --check autonomy/verification-recovery-v1.js && node --check supabase/functions/aria-planner-v11/index.ts && node --check supabase/functions/aria-planner-v12/index.ts
      - name: Verification recovery contract
        run: node tests/verification-recovery-v1.test.js
