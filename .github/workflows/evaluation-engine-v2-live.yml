name: Evaluation Engine 2.0 CONTRACT

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  evaluation-engine-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full test suite
        run: npm test
      - name: Evaluation Engine 2.0 contract test
        run: node tests/evaluation-engine-v2.test.js
