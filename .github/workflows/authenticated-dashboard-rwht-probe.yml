name: ARIA Authenticated Dashboard RWHT Probe

on:
  push:
    branches:
      - probe/authenticated-dashboard-rwht-20260929

permissions:
  contents: read

jobs:
  authenticated-rwht:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RWHT_URL: https://aria.robvg9.workers.dev/pwa/
      RWHT_HEADLESS: 'true'
      RWHT_NO_SCREENSHOTS: 'false'
      RWHT_ALLOW_MUTATIONS: 'false'
      RWHT_REQUIRE_AUTH: 'true'
      RWHT_EXPECTED_AUTH_TEXT: 'Lista para actuar'
      RWHT_EMAIL: ${{ secrets.RWHT_EMAIL }}
      RWHT_PASSWORD: ${{ secrets.RWHT_PASSWORD }}
      RWHT_STORAGE_STATE_B64: ${{ secrets.RWHT_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require authorized session source
        shell: bash
        run: |
          set -euo pipefail
          has_password_auth=false
          has_storage_auth=false
          if [[ -n "${RWHT_EMAIL}" && -n "${RWHT_PASSWORD}" ]]; then
            has_password_auth=true
          fi
          if [[ -n "${RWHT_STORAGE_STATE_B64}" ]]; then
            has_storage_auth=true
          fi
          if [[ "${has_password_auth}" != true && "${has_storage_auth}" != true ]]; then
            echo "::error title=Authenticated RWHT unavailable::No authorized RWHT session source is configured."
            exit 1
          fi
          if [[ "${has_storage_auth}" == true ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_B64}" | base64 --decode > "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            chmod 600 "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            echo "RWHT_STORAGE_STATE=${RUNNER_TEMP}/aria-rwht-auth-state.json" >> "${GITHUB_ENV}"
          fi

      - name: Install PC RWHT dependencies
        working-directory: rwht/pc-browser
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: rwht/pc-browser
        run: npx playwright install --with-deps chromium

      - name: Execute authenticated PC PWA RWHT
        working-directory: rwht/pc-browser
        run: node rwht-pc-browser.mjs

      - name: Upload authenticated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-authenticated-dashboard-rwht-probe
          path: rwht/pc-browser/rwht-artifacts
          if-no-files-found: warn

      - name: Remove temporary authentication state
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/aria-rwht-auth-state.json"
