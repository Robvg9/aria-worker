name: Diagnose Meditation IA on Windows

on:
  pull_request:
    branches: [aria/meditation-ia-v1-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Diagnose local Meditation IA
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== ARIA MEDITATION DIAGNOSTIC ==='
          Write-Host "COMPUTER=$env:COMPUTERNAME USER=$env:USERNAME"
          Write-Host '--- status endpoint ---'
          try {
            $s = Invoke-RestMethod -Method Get -Uri 'http://127.0.0.1:45873/status' -TimeoutSec 5
            $s | ConvertTo-Json -Compress -Depth 10 | Write-Host
          } catch { Write-Host "STATUS_ERROR=$($_.Exception.Message)" }
          Write-Host '--- port 45873 ---'
          Get-NetTCPConnection -LocalPort 45873 -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host '--- node processes ---'
          Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
            Select-Object ProcessId,CommandLine |
            Format-List | Out-String | Write-Host
          Write-Host '--- runtime files ---'
          foreach($p in @(
            'D:\ARIA-Windows-Agent\Runtime\windows\aria-agent.js',
            'D:\ARIA-Windows-Agent\Runtime\windows\aria-meditation-controller.js',
            'D:\ARIA-Windows-Agent\Runtime\meditation\state.json',
            'D:\ARIA-Windows-Agent\Runtime\meditation\controller.lock',
            'D:\ARIA-Windows-Agent\Runtime\meditation\ARIA-Meditation-IA.txt',
            'D:\ARIA-Windows-Agent\Logs\watchdog.log',
            'D:\ARIA-Windows-Agent\Logs\status.json'
          )) {
            Write-Host "PATH=$p EXISTS=$(Test-Path $p)"
          }
          Write-Host '--- meditation state ---'
          if(Test-Path 'D:\ARIA-Windows-Agent\Runtime\meditation\state.json'){
            Get-Content -Raw 'D:\ARIA-Windows-Agent\Runtime\meditation\state.json' | Write-Host
          }
          Write-Host '--- meditation log tail ---'
          if(Test-Path 'D:\ARIA-Windows-Agent\Runtime\meditation\ARIA-Meditation-IA.txt'){
            Get-Content -Tail 80 'D:\ARIA-Windows-Agent\Runtime\meditation\ARIA-Meditation-IA.txt' | Write-Host
          }
          Write-Host '--- watchdog tail ---'
          if(Test-Path 'D:\ARIA-Windows-Agent\Logs\watchdog.log'){
            Get-Content -Tail 80 'D:\ARIA-Windows-Agent\Logs\watchdog.log' | Write-Host
          }
          Write-Host '=== END DIAGNOSTIC ==='