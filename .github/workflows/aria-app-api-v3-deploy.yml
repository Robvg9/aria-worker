name: Deploy ARIA APP API v3

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/aria-app-api-v3/**'
      - 'supabase/migrations/**'
      - '.github/workflows/aria-app-api-v3-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Verify ARIA APP API v3 source contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('supabase/functions/aria-app-api-v3/index.ts', 'utf8');
          for (const fragment of ['executeConversationWithFallback','conversationRouteCache','path.endsWith("/conversation")']) {
            if (!source.includes(fragment)) throw new Error('missing contract: ' + fragment);
          }
          console.log('ARIA APP API v3 source contract: PASS');
          NODE
      - name: Deploy ARIA APP API v3
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          supabase functions deploy aria-app-api-v3 --project-ref "$SUPABASE_PROJECT_REF"
