name: ARIA activation reconciliation PostgreSQL integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261101070000_aria_activation_reconciliation_guards_v1.sql'
      - 'supabase/migrations/20261101161000_aria_no_goal_mission_admission_lane_guard_v1.sql'
      - 'tests/sql/aria-activation-reconciliation-fixture.sql'
      - 'tests/sql/aria-activation-reconciliation.integration.sql'
      - '.github/workflows/aria-activation-reconciliation-sql.yml'

permissions:
  contents: read

jobs:
  postgres-17-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Create isolated synthetic schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/aria-activation-reconciliation-fixture.sql

      - name: Apply the complete proposed migration to PostgreSQL 17
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261101070000_aria_activation_reconciliation_guards_v1.sql

      - name: Run migration behavior tests
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/aria-activation-reconciliation.integration.sql
