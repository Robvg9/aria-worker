name: ARIA Persistence + Recovery Browser RWHT Authenticated

on:
  push:
    branches: [main]
    paths:
      - 'pwa/src/App.tsx'
      - 'pwa/index.html'
      - 'pwa/src/testCatalog.ts'
      - 'pwa/src/index.css'
      - 'worker.js'
      - 'rwht/pc-browser/rwht-persistence-recovery-e2e.mjs'
      - 'tests/pwa-persistence-recovery-v1.test.js'
      - 'tests/pwa-auth-proxy-contract.test.js'
      - '.github/workflows/persistence-recovery-rwht-authenticated.yml'
      - 'pwa/src/.rwht-persistence-recovery-trigger.ts'
  workflow_dispatch:

concurrency:
  group: aria-persistence-recovery-rwht-${{ github.sha }}
  cancel-in-progress: false

jobs:
  persistence-recovery-rwht:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RWHT_URL: ${{ vars.RWHT_URL || 'https://aria.robvg9.workers.dev/pwa/' }}
      RWHT_EMAIL: ${{ secrets.RWHT_EMAIL }}
      RWHT_PASSWORD: ${{ secrets.RWHT_PASSWORD }}
      RWHT_STORAGE_STATE_B64: ${{ secrets.RWHT_STORAGE_STATE_B64 }}
      RWHT_STORAGE_STATE_GZIP_B64: ${{ secrets.RWHT_STORAGE_STATE_GZIP_B64 }}
      RWHT_HEADLESS: 'true'
      RWHT_ARTIFACT_DIR: persistence-recovery-rwht-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for PWA LIVE build
        shell: bash
        run: |
          set -euo pipefail
          base="${RWHT_URL%/}/"
          version=""
          for attempt in $(seq 1 60); do
            version="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "${base}version.json?persist-recovery=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            if VERSION="${version}" GITHUB_SHA="${GITHUB_SHA}" python - <<'PY'
          import json, os, subprocess
          try:
              live = json.loads(os.environ["VERSION"])["build"]
              head = os.environ["GITHUB_SHA"]
              if live == head:
                  raise SystemExit(0)
              subprocess.run(["git", "merge-base", "--is-ancestor", live, head], check=True)
              subprocess.run([
                  "git", "diff", "--quiet", live, head, "--",
                  "pwa/", "worker.js", "scripts/cloudflare-workers-build.js", "wrangler.toml"
              ], check=True)
              raise SystemExit(0)
          except Exception:
              raise SystemExit(1)
          PY
            then
              echo "PERSISTENCE_RECOVERY_LIVE_BUILD_OK build=${GITHUB_SHA} live_build=$(VERSION="${version}" python -c 'import json,os; print(json.loads(os.environ["VERSION"])["build"])')"
              break
            fi
            test "${attempt}" -lt 60 && sleep 2
          done
          VERSION="${version}" GITHUB_SHA="${GITHUB_SHA}" python - <<'PY'
          import json, os, subprocess
          live = json.loads(os.environ["VERSION"])["build"]
          head = os.environ["GITHUB_SHA"]
          if live != head:
              subprocess.run(["git", "merge-base", "--is-ancestor", live, head], check=True)
              subprocess.run([
                  "git", "diff", "--quiet", live, head, "--",
                  "pwa/", "worker.js", "scripts/cloudflare-workers-build.js", "wrangler.toml"
              ], check=True)
          PY

      - name: Require authenticated session source
        shell: bash
        run: |
          set -euo pipefail
          has_password_auth=false
          has_storage_auth=false
          has_storage_gzip_auth=false
          if [[ -n "${RWHT_EMAIL}" && -n "${RWHT_PASSWORD}" ]]; then has_password_auth=true; fi
          if [[ -n "${RWHT_STORAGE_STATE_B64}" ]]; then has_storage_auth=true; fi
          if [[ -n "${RWHT_STORAGE_STATE_GZIP_B64}" ]]; then has_storage_gzip_auth=true; fi
          if [[ "${has_password_auth}" != true && "${has_storage_auth}" != true && "${has_storage_gzip_auth}" != true ]]; then
            echo "::error title=Persistence + Recovery RWHT blocked::Configure RWHT_EMAIL + RWHT_PASSWORD, RWHT_STORAGE_STATE_B64, or RWHT_STORAGE_STATE_GZIP_B64."
            exit 1
          fi
          if [[ "${has_storage_auth}" == true ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_B64}" | base64 --decode > "${RUNNER_TEMP}/aria-persistence-recovery-auth-state.json"
            echo "RWHT_AUTH_STATE_SOURCE=raw-storage-state" >> "${GITHUB_ENV}"
          elif [[ "${has_storage_gzip_auth}" == true ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_GZIP_B64}" | base64 --decode | gzip -dc > "${RUNNER_TEMP}/aria-persistence-recovery-auth-state.json"
            echo "RWHT_AUTH_STATE_SOURCE=gzip-storage-state" >> "${GITHUB_ENV}"
          fi
          if [[ "${has_storage_auth}" == true || "${has_storage_gzip_auth}" == true ]]; then
            chmod 600 "${RUNNER_TEMP}/aria-persistence-recovery-auth-state.json"
            echo "RWHT_STORAGE_STATE=${RUNNER_TEMP}/aria-persistence-recovery-auth-state.json" >> "${GITHUB_ENV}"
          fi

      - name: Diagnose Auth connectivity (credentials not printed)
        shell: bash
        run: |
          set -euo pipefail
          payload=$(printf '{"email":"%s","password":"%s"}' "$RWHT_EMAIL" "$RWHT_PASSWORD")
          probe() {
            local name="$1"
            local url="$2"
            local result
            result=$(curl -sS --max-time 12 --connect-timeout 5 -o /dev/null -w '%{http_code} %{time_total}' \
              -X POST "$url" \
              -H 'content-type: application/json' \
              -H "apikey: $RWHT_PUBLISHABLE_KEY" \
              --data "$payload" || printf '000 12')
            echo "AUTH_PROBE_${name}=${result}"
          }
          probe DIRECT "https://icuqsstxfdbvjytkhlog.supabase.co/auth/v1/token?grant_type=password"
          probe PROXY "https://aria.robvg9.workers.dev/auth/token?grant_type=password"
        env:
          RWHT_EMAIL: ${{ secrets.RWHT_EMAIL }}
          RWHT_PASSWORD: ${{ secrets.RWHT_PASSWORD }}
          RWHT_PUBLISHABLE_KEY: ${{ vars.RWHT_PUBLISHABLE_KEY || 'sb_publishable_E2AmZNo2hAbOYlytkVbyBQ_X7JH0HPw' }}

      - name: Install PC RWHT dependencies
        working-directory: rwht/pc-browser
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: rwht/pc-browser
        run: npx playwright install chromium

      - name: Persistence + Recovery static contract
        run: node tests/pwa-persistence-recovery-v1.test.js

      - name: Execute authenticated Persistence + Recovery E2E
        working-directory: rwht/pc-browser
        run: node rwht-persistence-recovery-e2e.mjs

      - name: Upload Persistence + Recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-persistence-recovery-rwht-evidence
          path: rwht/pc-browser/persistence-recovery-rwht-artifacts
          if-no-files-found: warn

      - name: Remove temporary authentication state
        if: always()
        run: rm -f "${RUNNER_TEMP}/aria-persistence-recovery-auth-state.json"
# Operational certification trigger: fresh-user persistence/reload/continuity E2E 20261002
