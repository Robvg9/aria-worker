name: Verify ARIA Desktop Commander Autostart v2

on:
  pull_request:
    paths:
      - 'agents/windows/run-agent.ps1'
      - 'agents/windows/install-v2.ps1'
      - 'agents/windows/desktop-commander-supervisor.ps1'
      - 'agents/windows/DESKTOP_COMMANDER_AUTOSTART_V2.md'
      - 'tests/windows-desktop-commander-autostart-v2.test.js'
      - '.github/workflows/verify-desktop-commander-autostart-v2.yml'
  push:
    branches:
      - 'fix/windows-dc-autostart-v2'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/windows-desktop-commander-autostart-v2.test.js

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse run-agent.ps1
        shell: powershell
        run: |
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('agents/windows/run-agent.ps1',[ref]$null,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){$errors|%{Write-Error $_.Message}; exit 1}
      - name: Parse install-v2.ps1
        shell: powershell
        run: |
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('agents/windows/install-v2.ps1',[ref]$null,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){$errors|%{Write-Error $_.Message}; exit 1}
      - name: Parse desktop-commander-supervisor.ps1
        shell: powershell
        run: |
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('agents/windows/desktop-commander-supervisor.ps1',[ref]$null,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){$errors|%{Write-Error $_.Message}; exit 1}
