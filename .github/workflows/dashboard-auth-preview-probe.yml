name: ARIA Dashboard Auth Preview Probe

on:
  push:
    branches:
      - probe/dashboard-auth-preview-20260929

permissions:
  contents: read

jobs:
  dashboard-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RWHT_URL: https://fix-dashboard-rwht-root-causes-20260929-aria.robvg9.workers.dev/pwa/
      RWHT_HEADLESS: 'true'
      RWHT_NO_SCREENSHOTS: 'false'
      RWHT_ALLOW_MUTATIONS: 'false'
      RWHT_REQUIRE_AUTH: 'true'
      RWHT_ROUTES: '#home'
      RWHT_RELOAD_AUTH: 'true'
      RWHT_LOGIN_WAIT_MS: '25000'
      RWHT_EXPECTED_AUTH_TEXT: 'Lista para actuar'
      RWHT_EMAIL: ${{ secrets.RWHT_EMAIL }}
      RWHT_PASSWORD: ${{ secrets.RWHT_PASSWORD }}
      RWHT_STORAGE_STATE_B64: ${{ secrets.RWHT_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require authorized session source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RWHT_EMAIL}" || -z "${RWHT_PASSWORD}" ]] && [[ -z "${RWHT_STORAGE_STATE_B64}" ]]; then exit 1; fi
      - name: Install PC RWHT dependencies
        working-directory: rwht/pc-browser
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: rwht/pc-browser
        run: npx playwright install --with-deps chromium
      - name: Execute authenticated Dashboard RWHT on Preview
        working-directory: rwht/pc-browser
        run: node rwht-pc-browser.mjs
      - name: Assert Dashboard closure evidence
        working-directory: rwht/pc-browser
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('rwht-artifacts/rwht-pc-report.json','utf8'));
          const route=r.routes?.[0]??{};
          const failures=[];
          if(r.routes_requested!==1||r.routes_completed!==1) failures.push('route_count');
          if(!r.auth_verified) failures.push('initial_auth');
          if(!route.auth?.reload?.verified) failures.push('reload_auth');
          if(r.controls_failed!==0) failures.push('control_failures');
          if(r.page_errors?.length) failures.push('page_errors');
          if(r.failed_responses?.length) failures.push('failed_5xx_responses');
          if(r.ux_issues?.length) failures.push('ux_issues');
          if(failures.length){console.error(JSON.stringify({failures},null,2));process.exit(3);}
          console.log(JSON.stringify({dashboard_closed:true,controls_verified:r.controls_verified,coverage:r.coverage_ratio,auth_verified:r.auth_verified,reload_auth_verified:Boolean(route.auth.reload.verified),page_errors:r.page_errors.length,failed_responses:r.failed_responses.length,ux_issues:r.ux_issues.length},null,2));
          NODE
      - name: Remove temporary auth state
        if: always()
        run: true
