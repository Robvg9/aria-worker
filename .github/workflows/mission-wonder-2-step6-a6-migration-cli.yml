name: Mission Wonder 2 Step 6 A6 — Generate and Validate Migration

on:
  push:
    branches: [feat/mission-wonder-2-step6-a6-isolated-runtime-v1]
    paths:
      - '.github/scripts/mission-wonder-2-step6-a6-isolated-scope-v1.sql'
      - '.github/workflows/mission-wonder-2-step6-a6-migration-cli.yml'
      - 'tests/mission-wonder-2-step6-a6-runtime-wiring.test.mjs'
      - 'tests/mission-wonder-2-step6-a6-fault-matrix.test.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mission-wonder-2-step6-a6-migration-cli
  cancel-in-progress: true

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: a6-test-only-password
          POSTGRES_USER: postgres
          POSTGRES_DB: a6_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d a6_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: a6-test-only-password
      PGDATABASE: a6_migration_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install stable Supabase CLI v2
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Discover CLI migration commands
        run: |
          set -euo pipefail
          supabase --version
          supabase --help
          supabase migration --help
          supabase migration new --help

      - name: Generate timestamped migration with Supabase CLI
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a6-migration-workspace"
          cd "$RUNNER_TEMP/a6-migration-workspace"
          supabase migration new aria_mission_wonder_2_a6_isolated_scope_v1
          mapfile -t generated < <(find supabase/migrations -maxdepth 1 -type f -name '*_aria_mission_wonder_2_a6_isolated_scope_v1.sql' -print)
          test "${#generated[@]}" -eq 1

          mapfile -t existing < <(find "$GITHUB_WORKSPACE/supabase/migrations" -maxdepth 1 -type f -name '*_aria_mission_wonder_2_a6_isolated_scope_v1.sql' -print 2>/dev/null || true)
          if [[ "${#existing[@]}" -gt 1 ]]; then
            echo "More than one A6 migration file exists; refusing to create a duplicate."
            printf '%s\n' "${existing[@]}"
            exit 1
          elif [[ "${#existing[@]}" -eq 1 ]]; then
            target="${existing[0]}"
          else
            target="$GITHUB_WORKSPACE/supabase/migrations/$(basename "${generated[0]}")"
          fi
          mkdir -p "$GITHUB_WORKSPACE/supabase/migrations"
          cp "$GITHUB_WORKSPACE/.github/scripts/mission-wonder-2-step6-a6-isolated-scope-v1.sql" "$target"
          echo "MIGRATION_FILE=$target" >> "$GITHUB_OUTPUT"
          echo "MIGRATION_BASENAME=$(basename "$target")" >> "$GITHUB_OUTPUT"
          echo "MIGRATION_RELATIVE_PATH=supabase/migrations/$(basename "$target")" >> "$GITHUB_OUTPUT"
          sha256sum "$target"

      - name: Prepare isolated PostgreSQL migration test
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $roles$
          begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role; end if;
          end;
          $roles$;
          create schema aria_internal;
          create schema cron;
          create schema vault;
          create table cron.job (
            jobid bigint generated by default as identity primary key,
            jobname text, schedule text, command text, active boolean not null default true
          );
          insert into cron.job(jobid,jobname,schedule,command,active) values
            (48,'aria-autonomy-supervisor-v5-every-10-minutes','*/10 * * * *','select 1',false),
            (49,'aria-execution-jobs-watchdog-every-10-minutes','*/10 * * * *','select 1',false),
            (50,'aria-autonomy-supervisor-v5-http-every-10-minutes','*/10 * * * *','select 1',false);
          create function cron.schedule(text,text,text) returns bigint language plpgsql as $cron$
          declare id bigint;
          begin
            insert into cron.job(jobname,schedule,command,active) values ($1,$2,$3,true) returning jobid into id;
            return id;
          end;
          $cron$;
          create function cron.alter_job(
            job_id bigint,
            schedule text default null,
            command text default null,
            database text default null,
            username text default null,
            active boolean default null
          ) returns void language plpgsql as $cron$
          begin
            update cron.job j set active=coalesce($6,j.active)
             where j.jobid=$1;
          end;
          $cron$;
          create table vault.decrypted_secrets(name text,decrypted_secret text);
          create table aria_internal.mission_state (
            mission_id text primary key, goal text, status text, checkpoint jsonb default '{}'::jsonb,
            current_step integer default 0, completed_steps integer default 0, total_steps integer,
            lease_owner text, lease_until timestamptz, metadata jsonb default '{}'::jsonb,
            updated_at timestamptz default clock_timestamp(), finished_at timestamptz, next_action text
          );
          create table aria_internal.execution_jobs (
            job_id text primary key, mission_id text, device_id text, operation text, command text, cwd text,
            timeout_ms integer, policy jsonb default '{}'::jsonb, metadata jsonb default '{}'::jsonb,
            status text, requested_at timestamptz default clock_timestamp(), claimed_at timestamptz, started_at timestamptz, completed_at timestamptz, recovery_count integer default 0,
            lease_owner text, lease_until timestamptz, updated_at timestamptz default clock_timestamp(),
            exit_code integer, stdout text
          );
          create table aria_internal.execution_job_events (job_id text,device_id text,event_type text,payload jsonb default '{}'::jsonb);
          create table aria_internal.mission_events (mission_id text,event_type text,payload jsonb default '{}'::jsonb);
          create table aria_internal.device_registry (device_id text,agent_type text,status text,token_hash text,capabilities jsonb,last_seen_at timestamptz);
          create function aria_internal.aria_m22_a4_frozen_job_authorized_v1(text,text,text) returns boolean language sql as 'select false';
          create function aria_internal.aria_m22_a5_frozen_job_authorized_v1(text,text,text) returns boolean language sql as 'select false';
          SQL

      # This database is a disposable CI service only; no Supabase project link or credentials are configured.
      - name: Apply generated migration to isolated PostgreSQL only
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f "${{ steps.migration.outputs.MIGRATION_FILE }}"
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $verify$
          declare snap jsonb; cron_total integer; active_old integer; active_a6 integer;
          begin
            snap := aria_internal.aria_m22_a6_ambient_snapshot_v1();
            if (snap->>'missionExecutionPaused')::boolean is distinct from true then raise exception 'A6_FREEZE_FALSE'; end if;
            if (snap->>'cron48Active')::boolean or (snap->>'cron49Active')::boolean or (snap->>'cron50Active')::boolean then raise exception 'LEGACY_CRON_ACTIVE'; end if;
            select count(*) into active_old from cron.job where jobid in (48,49,50) and active;
            if active_old<>0 then raise exception 'LEGACY_CRON_CHANGED'; end if;
            select count(*) into active_a6 from cron.job where jobname='aria-mission-wonder-2-a6-dispatcher-every-minute' and active;
            if active_a6<>0 then raise exception 'A6_CRON_MUST_BE_INACTIVE'; end if;
            select count(*) into cron_total from cron.job where jobname='aria-mission-wonder-2-a6-dispatcher-every-minute';
            if cron_total<>1 then raise exception 'A6_CRON_CREATE_COUNT_INVALID'; end if;
            if exists(select 1 from aria_internal.mission_wonder_2_a6_runs) then raise exception 'RUN_CREATED_BY_MIGRATION'; end if;
            if exists(select 1 from aria_internal.mission_wonder_2_a6_scopes) then raise exception 'SCOPE_CREATED_BY_MIGRATION'; end if;
            if exists(select 1 from aria_internal.mission_state) then raise exception 'MISSION_CREATED_BY_MIGRATION'; end if;
            if exists(select 1 from aria_internal.execution_jobs) then raise exception 'JOB_CREATED_BY_MIGRATION'; end if;
          end;
          $verify$;
          select jobid,jobname,active from cron.job where jobid in (48,49,50) or jobname='aria-mission-wonder-2-a6-dispatcher-every-minute' order by jobid;
          SQL
          echo "A6_MIGRATION_LOCAL_POSTGRES_PASS=true"
          echo "A6_LEGACY_CRONS_48_49_50_PRESERVED_DISABLED=true"
          echo "A6_DEDICATED_CRON_CREATED_INACTIVE=true"
          echo "A6_NO_RUN_SCOPE_MISSION_JOB_LEASE_CREATED=true"

      - name: Verify A6 scope and soak contracts
        run: |
          node tests/mission-wonder-2-step6-a6-isolated-scope.test.mjs
          node tests/mission-wonder-2-step6-a6-soak.test.mjs
          node tests/mission-wonder-2-step6-a6-runtime-wiring.test.mjs
          node tests/mission-wonder-2-step6-a6-fault-matrix.test.mjs

      - name: Run repository test suite
        run: npm test

      - name: Commit CLI-generated migration to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.migration.outputs.MIGRATION_RELATIVE_PATH }}"
          if git diff --cached --quiet; then
            echo "No generated migration change to commit."
            exit 0
          fi
          git commit -m "A6: update CLI-generated isolated run migration"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          echo "A6_MIGRATION_COMMIT=$(git rev-parse HEAD)"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "A6_MIGRATION_PUSHED=true"
