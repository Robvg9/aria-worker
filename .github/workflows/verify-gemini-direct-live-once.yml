name: Verify Gemini Direct LIVE Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-gemini-direct-live-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify Gemini Direct LIVE
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PROJECT_REF"
          # One-shot nonce; endpoint consumes it before calling Google.
          curl --fail-with-body --silent --show-error \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/aria-gemini-direct-live-check-v1?nonce=w8ARLkNjrXg8GVjU19mqbl05kKdv_YIjhasaeAbcx40"
          echo
          # trigger
