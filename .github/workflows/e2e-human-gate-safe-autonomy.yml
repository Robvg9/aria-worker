name: E2E Human Gate Safe Autonomy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e-human-gate-safe-autonomy.yml'
      - '.github/workflows/supabase-canonical-deploy.yml'
      - 'supabase/functions/aria-mission-runner-v22/index.ts'
      - 'supabase/functions/aria-execution-runtime-v1/index.ts'
      - 'supabase/functions/aria-planner-v11/index.ts'
      - 'supabase/migrations/**'

permissions:
  actions: read
  contents: read

jobs:
  human_gate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g supabase
      - name: Wait for exact-SHA Supabase Runtime deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            runs="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100")"
            if printf '%s' "$runs" | jq -e --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha==$sha and .name=="Deploy ARIA Supabase Runtime" and .status=="completed" and .conclusion=="success")' >/dev/null; then
              echo "EXACT_SHA_SUPABASE_DEPLOY_PASS=$GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "EXACT_SHA_SUPABASE_DEPLOY_NOT_SUCCESS=$GITHUB_SHA"
          exit 1
      - name: Run Human Gate E2E
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, time, urllib.request, urllib.error, re
          
          project = os.environ["SUPABASE_PROJECT_REF"]
          secret = os.environ["ARIA_RUNTIME_SHARED_SECRET"]
          base = "https://" + project + ".supabase.co/functions/v1"
          headers = {"Authorization": "Bearer " + secret, "content-type": "application/json"}
          
          subprocess.run(["supabase","link","--project-ref",project], check=True)
          
          def call(fn, payload):
              req = urllib.request.Request(base + "/" + fn, data=json.dumps(payload).encode(), headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=180) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  raw=e.read().decode()
                  try: return e.code, json.loads(raw)
                  except Exception: return e.code, {"raw":raw}
          
          def sql(q):
              p=subprocess.run(["supabase","db","query","--linked",q],text=True,capture_output=True)
              return p.stdout + p.stderr
          
          def tick(mid):
              return call("aria-mission-runner-v22",{"mission_id":mid})

          def wait_terminal(mid):
              last=None
              for _ in range(20):
                  _,last=tick(mid)
                  if last.get("status") in {"succeeded","failed","blocked","rejected","cancelled"}:
                      return last
                  time.sleep(1)
              return last

          def wait_for_status(mid, expected, attempts=12):
              last=None
              for _ in range(attempts):
                  _,last=tick(mid)
                  if last.get("status")==expected:
                      return last
                  time.sleep(1)
              return last

          # Clean only stale missions created by this Human Gate test itself.
          # This prevents an earlier no-device run from leaving its harmless shell
          # marker queued for a future device heartbeat. The v2 fence cancels that
          # mission's jobs when the test-owned mission is marked cancelled.
          stale = sql("WITH stale AS (UPDATE aria_internal.mission_state SET status='cancelled',last_stderr='stale_test_cleanup_executor_unavailable',lease_owner=NULL,lease_until=NULL WHERE metadata->>'probe'='human_gate_safe_autonomy' AND status IN ('waiting','paused') AND updated_at < now() - interval '10 minutes' AND mission_id ~ '^mission_hg_(SAFE|POS|REJ|CAN)_[0-9]+' RETURNING mission_id) SELECT coalesce(string_agg(mission_id,','),'none') FROM stale;")
          print("STALE_TEST_MISSIONS_CLEANED",stale)

          # Planner contract is checked independently. The executable E2E deliberately
          # uses a harmless device shell route so Human Gate does not depend on a model
          # or provider being available in the current registry.
          code, p = call("aria-planner-v11", {"goal":"Implement a harmless controlled test action that explicitly requires human approval before the protected action. Human Gate is required."})
          assert code < 300, p
          plan=p.get("plan") or p
          gated=[s for s in plan.get("steps",[]) if (s.get("policy") or {}).get("human_gate_required") is True]
          assert gated and any(str(s.get("risk","")).upper()=="HIGH_RISK_WRITE" for s in gated), plan
          print("PLANNER_HUMAN_GATE_PASS",[(s.get("id"),s.get("risk")) for s in gated])

          DEVICE_ID="windows-lacueva-780886"
          safe_physical_execution_pass=False
          protected_physical_execution_pass=False

          safe_steps=[
           {"id":"safe_c1","operation":"health","executor_type":"connector","target":{"type":"connector","connector_id":"supabase"},"risk":"READ","input":{},"policy":{"runtime_probe":True},"verify":{}},
           {"id":"safe_d1","operation":"shell.execute","executor_type":"device","target":{"type":"device","device_id":DEVICE_ID},"risk":"READ","input":{"command":"Write-Output SAFE_AUTONOMY_OK","cwd":"D:\\ARIA-Windows-Agent"},"policy":{"runtime_probe":True},"verify":{"stdout_contains":"SAFE_AUTONOMY_OK"},"depends_on":["safe_c1"]}
          ]
          protected_steps=[
           {"id":"safe_c1","operation":"health","executor_type":"connector","target":{"type":"connector","connector_id":"supabase"},"risk":"READ","input":{},"policy":{"runtime_probe":True},"verify":{}},
           {"id":"protected_d1","operation":"shell.execute","executor_type":"device","target":{"type":"device","device_id":DEVICE_ID},"risk":"HIGH_RISK_WRITE","input":{"command":"Write-Output PROTECTED_ACTION_OK","cwd":"D:\\ARIA-Windows-Agent"},"policy":{"human_gate_required":True,"human_gate_reason":"Controlled E2E protected action","human_gate_instructions":"Approve the exact protected shell action."},"verify":{"stdout_contains":"PROTECTED_ACTION_OK"},"depends_on":["safe_c1"]}
          ]

          def insert_mission(mid, goal, steps, human_gate=False):
              checkpoint=json.dumps({"plan":steps,"completed_steps":[],"attempts":{},"results":{}}).replace("'","''")
              metadata=json.dumps({"goal_source":"human_gate_e2e","probe":"human_gate_safe_autonomy","device_id":DEVICE_ID,**({"human_gate":{"enabled":True,"method":"explicit_confirmation","instructions":"Approve the exact protected shell action.","reason":"Controlled E2E protected action."}} if human_gate else {})}).replace("'","''")
              sql("INSERT INTO aria_internal.mission_state (mission_id,goal,status,current_step,total_steps,completed_steps,checkpoint,metadata,lease_owner,lease_until) VALUES ('"+mid+"','"+goal.replace("'","''")+"','queued',0,"+str(len(steps))+",0,'"+checkpoint+"'::jsonb,'"+metadata+"'::jsonb,NULL,NULL);")

          safe="mission_hg_SAFE_"+str(int(time.time()*1000))
          insert_mission(safe,"Safe autonomy no gate",safe_steps)
          s=wait_terminal(safe)
          sdb=sql("select status,completed_steps,total_steps,last_stderr,checkpoint->'recovery'->>'status' from aria_internal.mission_state where mission_id='"+safe+"';")
          sj=sql("select job_id,status,coalesce(stderr,''),coalesce(stdout,'') from aria_internal.execution_jobs where mission_id='"+safe+"' order by requested_at desc limit 1;")
          exact=sql("select case when checkpoint->'pending_jobs'->'safe_d1'->>'job_id'=(select job_id from aria_internal.execution_jobs where mission_id='"+safe+"' order by requested_at desc limit 1) then 'EXACT_PENDING_JOB_BOUND' else 'PENDING_JOB_MISMATCH' end from aria_internal.mission_state where mission_id='"+safe+"';")
          print("SAFE_AUTHORIZATION",s,sdb,sj,exact)
          if "succeeded" in sdb and "2" in sdb and "SAFE_AUTONOMY_OK" in sj:
              assert "succeeded" in sdb and "2" in sdb and "SAFE_AUTONOMY_OK" in sj,(s,sdb,sj)
              safe_physical_execution_pass=True
              print("SAFE_PHYSICAL_EXECUTION_PASS")
          else:
              assert "waiting" in sdb,sdb
              assert "waiting" in sdb and "1" in sdb and "2" in sdb and "waiting_for_async_executor" in sdb,sdb
              assert "queued" in sj and "fail_closed" not in sj,sj
              assert "EXACT_PENDING_JOB_BOUND" in exact,exact
              print("SAFE_PHYSICAL_EXECUTION_PENDING_AGENT_UNAVAILABLE")
              sql("UPDATE aria_internal.mission_state SET status='cancelled',last_stderr='test_cleanup_executor_unavailable',lease_owner=NULL,lease_until=NULL WHERE mission_id='"+safe+"' AND status='waiting';")
              safeCleanup=sql("select status,stderr from aria_internal.execution_jobs where mission_id='"+safe+"' order by requested_at desc limit 1;")
              print("SAFE_CLEANUP",safeCleanup)
              assert ("cancelled" in safeCleanup or "blocked" in safeCleanup),safeCleanup

          pos="mission_hg_POS_"+str(int(time.time()*1000))
          insert_mission(pos,"Protected action Human Gate",protected_steps,True)
          p1=wait_for_status(pos,"human_required"); assert p1.get("status")=="human_required",p1
          gate_text=sql("select 'HG_HASH='||(checkpoint->'human_gate'->>'action_hash') as gate from aria_internal.mission_state where mission_id='"+pos+"';")
          m=re.search(r"HG_HASH=([0-9a-f]{64})",gate_text); assert m,gate_text
          action_hash=m.group(1)
          start0=sql("select count(*) from aria_internal.mission_events where mission_id='"+pos+"' and event_type='step_started' and payload->>'step_id'='protected_d1';")
          assert re.search(r"\b0\b",start0),start0

          bc,bad=call("aria-mission-runner-v22",{"action":"human_gate_decide","mission_id":pos,"decision":"approve","approver_id":"e2e","action_hash":"WRONG"})
          assert bc==409 and bad.get("status")=="human_gate_decision_rejected",bad

          direct={"execution_version":"1","request_id":"hg-bypass","task_id":"protected_d1","capability":"shell.execute","selected_route":{"provider_id":"local_windows","account_id":DEVICE_ID,"device_id":DEVICE_ID},"authorization":{"status":"approved","human_gate_verified":True,"human_gate_mission_id":pos,"human_gate_step_id":"protected_d1","human_gate_action_hash":"fake","human_gate_approval_token":"fake"},"input":{"command":"Write-Output SHOULD_NOT_RUN","cwd":"D:\\ARIA-Windows-Agent"},"policy":{"human_gate_required":True}}
          _,dr=call("aria-execution-runtime-v1",direct); assert dr.get("status")=="blocked",dr

          bc,ap=call("aria-mission-runner-v22",{"action":"human_gate_decide","mission_id":pos,"decision":"approve","approver_id":"e2e","action_hash":action_hash})
          assert bc<300 and ap.get("status")=="human_gate_approved",ap

          sql("UPDATE aria_internal.mission_state SET checkpoint=jsonb_set(checkpoint,'{plan,1,target,device_id}','\"tampered-device\"',true) WHERE mission_id='"+pos+"';")
          tam=wait_for_status(pos,"human_required"); assert tam.get("status")=="human_required",tam

          # Re-seed the approved plan and force a fresh gate hash after tampering.
          sql("UPDATE aria_internal.mission_state SET checkpoint=jsonb_build_object('plan',('"+json.dumps(protected_steps).replace("'","''")+"'::jsonb),'completed_steps','[]'::jsonb,'attempts','{}'::jsonb,'results','{}'::jsonb),status='queued',current_step=0,completed_steps=0,total_steps=2,lease_owner=null,lease_until=null WHERE mission_id='"+pos+"';")
          fresh=wait_for_status(pos,"human_required"); assert fresh.get("status")=="human_required",fresh
          ht=sql("select 'HG_HASH='||(checkpoint->'human_gate'->>'action_hash') as h from aria_internal.mission_state where mission_id='"+pos+"';")
          m=re.search(r"HG_HASH=([0-9a-f]{64})",ht); assert m,ht
          fresh_hash=m.group(1)
          bc,ap2=call("aria-mission-runner-v22",{"action":"human_gate_decide","mission_id":pos,"decision":"approve","approver_id":"e2e2","action_hash":fresh_hash})
          assert bc<300 and ap2.get("status")=="human_gate_approved",ap2
          pf=wait_terminal(pos)
          pdb=sql("select status,completed_steps,total_steps,last_stderr,checkpoint->'human_gate'->>'status',checkpoint->'recovery'->>'status' from aria_internal.mission_state where mission_id='"+pos+"';")
          started=sql("select count(*) from aria_internal.mission_events where mission_id='"+pos+"' and event_type='step_started' and payload->>'step_id'='protected_d1';")
          pj=sql("select job_id,status,coalesce(stderr,''),coalesce(stdout,'') from aria_internal.execution_jobs where mission_id='"+pos+"' order by requested_at desc limit 1;")
          exactPos=sql("select case when checkpoint->'pending_jobs'->'protected_d1'->>'job_id'=(select job_id from aria_internal.execution_jobs where mission_id='"+pos+"' order by requested_at desc limit 1) then 'EXACT_PROTECTED_JOB_BOUND' else 'PROTECTED_JOB_MISMATCH' end from aria_internal.mission_state where mission_id='"+pos+"';")
          print("POS_AUTHORIZATION",pf,pdb,started,pj,exactPos)
          if "succeeded" in pdb and "2" in pdb and "completed" in pdb:
              assert "succeeded" in pdb and "2" in pdb and "completed" in pdb and "PROTECTED_ACTION_OK" in pj and re.search(r"\b2\b",started),(pf,pdb,started,pj)
              protected_physical_execution_pass=True
              print("HG_PROTECTED_PHYSICAL_EXECUTION_PASS")
          else:
              assert "waiting" in pdb,pdb
              assert "waiting" in pdb and "1" in pdb and "2" in pdb and "approved" in pdb and "waiting_for_async_executor" in pdb,pdb
              assert "queued" in pj and "fail_closed" not in pj,pj
              assert "EXACT_PROTECTED_JOB_BOUND" in exactPos,exactPos
              print("HUMAN_GATE_AUTHORIZATION_PASS_PHYSICAL_EXECUTOR_PENDING")
              sql("UPDATE aria_internal.mission_state SET status='cancelled',last_stderr='test_cleanup_executor_unavailable_after_gate_approval',lease_owner=NULL,lease_until=NULL WHERE mission_id='"+pos+"' AND status='waiting';")
              posCleanup=sql("select status,stderr from aria_internal.execution_jobs where mission_id='"+pos+"' order by requested_at desc limit 1;")
              print("POS_CLEANUP",posCleanup)
              assert ("cancelled" in posCleanup or "blocked" in posCleanup),posCleanup

          rej="mission_hg_REJ_"+str(int(time.time()*1000))
          insert_mission(rej,"Reject protected Human Gate",protected_steps,True)
          r1=wait_for_status(rej,"human_required"); assert r1.get("status")=="human_required",r1
          rh=sql("select 'HG_HASH='||(checkpoint->'human_gate'->>'action_hash') as h from aria_internal.mission_state where mission_id='"+rej+"';")
          m=re.search(r"HG_HASH=([0-9a-f]{64})",rh); assert m
          bc,rr=call("aria-mission-runner-v22",{"action":"human_gate_decide","mission_id":rej,"decision":"reject","approver_id":"e2e-reject","action_hash":m.group(1)})
          assert bc<300 and rr.get("status")=="human_gate_rejected",rr
          rdb=sql("select status from aria_internal.mission_state where mission_id='"+rej+"';")
          rs=sql("select count(*) from aria_internal.mission_events where mission_id='"+rej+"' and event_type='step_started' and payload->>'step_id'='protected_d1';")
          assert ("blocked" in rdb or "cancelled" in rdb or "failed" in rdb) and re.search(r"\b0\b",rs),(rdb,rs)

          can="mission_hg_CAN_"+str(int(time.time()*1000))
          insert_mission(can,"Cancel protected Human Gate",protected_steps,True)
          c1=wait_for_status(can,"human_required"); assert c1.get("status")=="human_required",c1
          p1=sql("select status,checkpoint->'human_gate'->>'status' from aria_internal.mission_state where mission_id='"+can+"';")
          assert "paused" in p1 and "pending" in p1
          _,c2=tick(can)
          p2=sql("select status,checkpoint->'human_gate'->>'status' from aria_internal.mission_state where mission_id='"+can+"';")
          assert "paused" in p2 and "pending" in p2,(c2,p2)
          ch=sql("select 'HG_HASH='||(checkpoint->'human_gate'->>'action_hash') as h from aria_internal.mission_state where mission_id='"+can+"';")
          m=re.search(r"HG_HASH=([0-9a-f]{64})",ch); assert m
          bc,cc=call("aria-mission-runner-v22",{"action":"human_gate_decide","mission_id":can,"decision":"cancel","approver_id":"e2e-cancel","action_hash":m.group(1)})
          assert bc<300 and cc.get("status")=="human_gate_cancelled",cc
          cdb=sql("select status from aria_internal.mission_state where mission_id='"+can+"';")
          assert "cancelled" in cdb

          print("HG_E2E_PASS")
          print("HUMAN_GATE_AUTHORIZATION = VERIFIED E2E")
          print("PHYSICAL_EXECUTION = VERIFIED" if safe_physical_execution_pass and protected_physical_execution_pass else "PHYSICAL_EXECUTION_GATE_REMAINS_SEPARATE")
          print("ALL_PASS")
          PY

      - name: Authenticated owner-binding regression
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/hg-auth-owner-regression.sql <<'SQL'
          BEGIN;
          CREATE TEMP TABLE hg_auth_results(test text, passed boolean, detail text) ON COMMIT DROP;
          GRANT INSERT, SELECT ON hg_auth_results TO authenticated;

          INSERT INTO aria_internal.mission_state
          (mission_id,goal,status,current_step,total_steps,completed_steps,checkpoint,metadata)
          VALUES
          ('hg_auth_owner_workflow','auth owner binding workflow','paused',0,1,0,
           jsonb_build_object('human_gate',jsonb_build_object('required',true,'status','pending','verified',false,'step_id','protected_auth','executor_type','model','operation','text_generation','risk','HIGH_RISK_WRITE','action_hash',repeat('a',64))),
           jsonb_build_object('user_id','00000000-0000-0000-0000-000000000001')),
          ('hg_auth_wrong_owner_workflow','auth wrong owner workflow','paused',0,1,0,
           jsonb_build_object('human_gate',jsonb_build_object('required',true,'status','pending','verified',false,'step_id','protected_auth','executor_type','model','operation','text_generation','risk','HIGH_RISK_WRITE','action_hash',repeat('b',64))),
           jsonb_build_object('user_id','00000000-0000-0000-0000-000000000002'));

          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000001',true);

          DO $$
          DECLARE r jsonb;
          BEGIN
            r:=public.mission_human_gate_decide_authenticated('hg_auth_owner_workflow','approve',repeat('a',64),'owner-pass');
            INSERT INTO hg_auth_results VALUES ('correct_owner',r->>'status'='queued' AND r->>'approval_token_issued'='true',r::text);
          END $$;

          SELECT set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000003',true);
          DO $$
          BEGIN
            PERFORM public.mission_human_gate_decide_authenticated('hg_auth_wrong_owner_workflow','approve',repeat('b',64),'wrong-owner');
            INSERT INTO hg_auth_results VALUES ('wrong_owner_denied',false,'unexpected approval');
          EXCEPTION WHEN OTHERS THEN
            INSERT INTO hg_auth_results VALUES ('wrong_owner_denied',SQLERRM='mission_not_owned_by_user',SQLERRM);
          END $$;

          SET LOCAL ROLE postgres;
          INSERT INTO hg_auth_results
          SELECT 'authenticated_execute',has_function_privilege('authenticated','public.mission_human_gate_decide_authenticated(text,text,text,text)','EXECUTE'),'';
          INSERT INTO hg_auth_results
          SELECT 'anon_execute_denied',NOT has_function_privilege('anon','public.mission_human_gate_decide_authenticated(text,text,text,text)','EXECUTE'),'';

          SELECT string_agg('AUTH_TEST='||test||'='||passed, E'\n' ORDER BY test) AS result FROM hg_auth_results h;
          ROLLBACK;
          SQL

          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          result="$(supabase db query --linked "$(cat /tmp/hg-auth-owner-regression.sql)")"
          printf '%s\n' "$result"
          python3 - <<'PY' "$result"
          import sys
          raw = sys.argv[1]
          required = {
              "correct_owner": "true",
              "wrong_owner_denied": "true",
              "authenticated_execute": "true",
              "anon_execute_denied": "true",
          }
          for name, value in required.items():
              marker = f"AUTH_TEST={name}={value}"
              if marker not in raw:
                  raise SystemExit("AUTH_OWNER_REGRESSION_FAILED:" + marker)
          print("AUTH_OWNER_REGRESSION_PASS")
          PY
