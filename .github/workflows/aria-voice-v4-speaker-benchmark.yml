name: ARIA Voice V4 Speaker Verification Candidate

on:
  push:
    branches:
      - feat/aria-voice-v4-diagnostics-20261102
    paths:
      - voice-v4/speaker-verification/**
      - .github/workflows/aria-voice-v4-speaker-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cam-plus-speaker-smoke:
    name: CAM++ public-sample speaker embedding smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned inference dependencies
        run: python -m pip install --disable-pip-version-check "sherpa-onnx==1.13.8" "numpy==2.1.3" "soundfile==0.13.1"

      - name: Run public same-speaker versus different-speaker smoke
        run: |
          python voice-v4/speaker-verification/camplus_public_sample_smoke.py \
            --workdir "$RUNNER_TEMP/aria-speaker-smoke" \
            --report "$RUNNER_TEMP/aria-speaker-smoke-report.json"

      - name: Upload aggregate metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-camplus-speaker-metadata
          path: ${{ runner.temp }}/aria-speaker-smoke-report.json
          if-no-files-found: ignore
          retention-days: 7
