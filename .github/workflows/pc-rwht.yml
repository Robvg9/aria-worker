name: ARIA PC Browser RWHT

on:
  pull_request:
    paths:
      - 'rwht/pc-browser/**'
      - 'tests/pc-rwht-browser.test.js'
      - 'pwa/**'
      - '.github/workflows/pc-rwht.yml'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rwht/pc-browser/**'
      - 'tests/pc-rwht-browser.test.js'
      - 'pwa/**'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/pc-rwht-browser.test.js

  live-pwa:
    runs-on: ubuntu-latest
    needs: contract
    timeout-minutes: 20
    env:
      RWHT_URL: ${{ vars.RWHT_URL || 'https://aria.robvg9.workers.dev' }}
      RWHT_HEADLESS: 'true'
      RWHT_ARTIFACT_DIR: rwht-artifacts
      RWHT_NO_SCREENSHOTS: 'false'
      RWHT_EMAIL: ${{ secrets.RWHT_EMAIL }}
      RWHT_PASSWORD: ${{ secrets.RWHT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install PC RWHT dependencies
        working-directory: rwht/pc-browser
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: rwht/pc-browser
        run: npx playwright install --with-deps chromium
      - name: Execute full PC PWA RWHT
        working-directory: rwht/pc-browser
        run: node rwht-pc-browser.mjs
      - name: Upload PC RWHT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-pc-rwht-evidence
          path: rwht-artifacts
          if-no-files-found: warn
