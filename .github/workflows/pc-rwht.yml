name: ARIA PC Browser RWHT

on:
  pull_request:
    paths:
      - 'rwht/pc-browser/**'
      - 'tests/pc-rwht-browser.test.js'
      - 'pwa/**'
      - '.github/workflows/pc-rwht.yml'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rwht/pc-browser/**'
      - 'tests/pc-rwht-browser.test.js'
      - 'pwa/**'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/pc-rwht-browser.test.js

  live-pwa:
    runs-on: ubuntu-latest
    needs: contract
    timeout-minutes: 20
    env:
      RWHT_URL: ${{ vars.RWHT_URL || 'https://aria.robvg9.workers.dev/pwa/' }}
      RWHT_HEADLESS: 'true'
      RWHT_ARTIFACT_DIR: rwht-artifacts
      RWHT_NO_SCREENSHOTS: 'false'
      RWHT_REQUIRE_AUTH: ${{ secrets.RWHT_EMAIL != '' && secrets.RWHT_PASSWORD != '' }}
      RWHT_EXPECTED_AUTH_TEXT: 'Lista para actuar'
      RWHT_EMAIL: ${{ secrets.RWHT_EMAIL }}
      RWHT_PASSWORD: ${{ secrets.RWHT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install PC RWHT dependencies
        working-directory: rwht/pc-browser
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: rwht/pc-browser
        run: npx playwright install --with-deps chromium
      - name: Verify canonical test catalog on LIVE PWA
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          base="${RWHT_URL%/}"
          html=""
          for attempt in $(seq 1 60); do
            html="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "$base/?probe=$GITHUB_SHA-catalog-$attempt" 2>/dev/null || true)"
            if grep -q 'name="aria-test-catalog-version" content="2026-09-27-canonical"' <<<"$html" &&
               grep -q 'name="aria-test-catalog-total" content="245"' <<<"$html"; then
              break
            fi
            test "$attempt" -lt 60 && sleep 2
          done
          test -n "$html"
          grep -q 'name="aria-test-catalog-version" content="2026-09-27-canonical"' <<<"$html"
          grep -q 'name="aria-test-catalog-total" content="245"' <<<"$html"
          echo CANONICAL_TEST_CATALOG_LIVE_OK
      - name: Execute full PC PWA RWHT
        working-directory: rwht/pc-browser
        run: node rwht-pc-browser.mjs
      - name: Upload PC RWHT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-pc-rwht-evidence
          path: rwht/pc-browser/rwht-artifacts
          if-no-files-found: warn

  cloudflare-build-config:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inspect Workers Builds trigger configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/builds/triggers" > /tmp/triggers.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/triggers.json'))
          print("CF_API_SUCCESS=", data.get("success"))
          for item in data.get("result", []):
              print(json.dumps({k:item.get(k) for k in ("trigger_name","trigger_uuid","external_script_id","build_command","deploy_command","root_directory","branch_includes","branch_excludes","path_includes","path_excludes","environment_variables")}, ensure_ascii=False))
          PY
