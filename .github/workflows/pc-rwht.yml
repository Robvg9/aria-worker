name: ARIA PC Browser RWHT

on:
  pull_request:
    paths:
      - 'rwht/pc-browser/**'
      - 'tests/pc-rwht-browser.test.js'
      - 'pwa/**'
      - '.github/workflows/pc-rwht.yml'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rwht/pc-browser/**'
      - 'tests/pc-rwht-browser.test.js'
      - 'pwa/**'
      - '.github/workflows/pc-rwht.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/pc-rwht-browser.test.js

  live-pwa:
    runs-on: ubuntu-latest
    needs: contract
    timeout-minutes: 20
    env:
      RWHT_URL: ${{ vars.RWHT_URL || 'https://aria.robvg9.workers.dev/pwa/' }}
      RWHT_HEADLESS: 'true'
      RWHT_ARTIFACT_DIR: rwht-artifacts
      RWHT_NO_SCREENSHOTS: 'false'
      RWHT_REQUIRE_AUTH: ${{ (secrets.RWHT_EMAIL != '' && secrets.RWHT_PASSWORD != '') || secrets.RWHT_STORAGE_STATE_B64 != '' }}
      RWHT_EXPECTED_AUTH_TEXT: 'Lista para actuar'
      RWHT_EMAIL: ${{ secrets.RWHT_EMAIL }}
      RWHT_PASSWORD: ${{ secrets.RWHT_PASSWORD }}
      RWHT_STORAGE_STATE_B64: ${{ secrets.RWHT_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Load persistent authenticated browser state
        if: env.RWHT_STORAGE_STATE_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${RWHT_STORAGE_STATE_B64}" | base64 --decode > "${RUNNER_TEMP}/aria-rwht-auth-state.json"
          chmod 600 "${RUNNER_TEMP}/aria-rwht-auth-state.json"
          echo "RWHT_STORAGE_STATE=${RUNNER_TEMP}/aria-rwht-auth-state.json" >> "${GITHUB_ENV}"
      - name: Install PC RWHT dependencies
        working-directory: rwht/pc-browser
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: rwht/pc-browser
        run: npx playwright install --with-deps chromium
      - name: Verify canonical test catalog on LIVE PWA
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          base="${RWHT_URL%/}"
          html=""
          for attempt in $(seq 1 60); do
            html="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "$base/?probe=$GITHUB_SHA-catalog-$attempt" 2>/dev/null || true)"
            if (grep -q "name='aria-test-catalog-version' content='2026-09-28-canonical'" <<<"$html" || grep -q 'name="aria-test-catalog-version" content="2026-09-28-canonical"' <<<"$html") &&
               (grep -q "name='aria-test-catalog-total' content='254'" <<<"$html" || grep -q 'name="aria-test-catalog-total" content="254"' <<<"$html"); then
              break
            fi
            test "$attempt" -lt 60 && sleep 2
          done
          test -n "$html"
          (grep -q "name='aria-test-catalog-version' content='2026-09-28-canonical'" <<<"$html" || grep -q 'name="aria-test-catalog-version" content="2026-09-28-canonical"' <<<"$html")
          (grep -q "name='aria-test-catalog-total' content='254'" <<<"$html" || grep -q 'name="aria-test-catalog-total" content="254"' <<<"$html")
          echo CANONICAL_TEST_CATALOG_LIVE_OK
      - name: Execute full PC PWA RWHT
        working-directory: rwht/pc-browser
        run: node rwht-pc-browser.mjs
      - name: Upload PC RWHT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-pc-rwht-evidence
          path: rwht/pc-browser/rwht-artifacts
          if-no-files-found: warn
