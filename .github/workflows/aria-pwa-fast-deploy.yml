name: Deploy ARIA PWA Fast Lane
# Swipe RWHT deployment trigger

on:
  push:
    branches: [main]
    # Do not publish the existing production PWA for isolated autonomy changes.
    # The dedicated coordinator has its own explicit deployment gate.
    paths-ignore:
      - '.github/workflows/aria-pwa-fast-deploy.yml'
      - '.github/workflows/aria-cloudflare-deploy.yml'
      - '.github/workflows/aria-absorb.yml'
      - '.github/workflows/aria-autonomy-coordinator-deploy.yml'
      - '.github/workflows/aria-npm-test.yml'
      - '.github/workflows/persistent-autonomy-v1-tests.yml'
      - '.github/workflows/supabase-canonical-deploy.yml'
      - 'Dockerfile.aria-coordinator'
      - 'autonomy/PERSISTENT_AUTONOMY_V1.md'
      - 'autonomy/ollama-persistent-adapter-v1.js'
      - 'autonomy/persistent-autonomy-v1.env.example'
      - 'autonomy/persistent-control-plane-v1.js'
      - 'autonomy/persistent-dashboard-v1.html'
      - 'autonomy/persistent-http-server-v1.js'
      - 'autonomy/persistent-notifications-v1.js'
      - 'autonomy/persistent-worker-bridge-v1.js'
      - 'autonomy/persistent-worker-coordinator-adapter-v1.js'
      - 'cloudflare-autonomy/**'
      - 'pwa/src/testCatalog.ts'
      - 'scripts/Start-ARIA-Persistent-Worker.ps1'
      - 'scripts/aria-persistent-autonomy-v1.js'
      - 'scripts/aria-persistent-coordinator-v1.js'
      - 'scripts/aria-persistent-windows-worker-v1.js'
      - 'scripts/aria-persistent-windows-worker-preflight-v1.js'
      - 'scripts/aria-persistent-windows-worker-preflight-v1.test.js'
      - 'tests/aria-autonomy-supabase-boundary.test.js'
      - 'tests/cloudflare-autonomy-worker.test.js'
      - 'tests/ollama-persistent-adapter-v1.test.js'
      - 'tests/pc-rwht-browser.test.js'
      - 'tests/persistent-control-plane-v1.test.js'
      - 'tests/persistent-http-server-v1.test.js'
      - 'tests/persistent-hybrid-e2e-v1.test.js'
      - 'tests/persistent-notifications-v1.test.js'
      - 'tests/persistent-worker-bridge-v1.test.js'
      - 'tests/pwa-capabilities-test-center-v1.test.js'
      - 'wrangler.aria-autonomy.toml'
  workflow_dispatch:
concurrency:
  group: aria-cloudflare-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install PWA dependencies
        working-directory: pwa
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build PWA
        working-directory: pwa
        env:
          VITE_BUILD: ${{ github.sha }}
        run: |
          export VITE_BUILD="$GITHUB_SHA"
          npm run build
          grep -q "$GITHUB_SHA" dist/index.html
          grep -q "sw-$GITHUB_SHA.js" dist/index.html
          grep -R -q "$GITHUB_SHA" dist/assets
          cp dist/index.html "dist/index-$GITHUB_SHA.html"
          cp dist/manifest.json "dist/manifest-$GITHUB_SHA.json"
          sed "s/__BUILD__/$GITHUB_SHA/g" public/sw.js > "dist/sw-$GITHUB_SHA.js"
          grep -q "aria-pwa-$GITHUB_SHA" "dist/sw-$GITHUB_SHA.js"
          rm -f dist/index.html
      - name: Install Wrangler
        run: npm install --global wrangler@latest
      - name: Deploy ARIA Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sed -i "s/__PWA_BUILD__/$GITHUB_SHA/g" worker.js
          wrangler deploy worker.js --name aria
      - name: Smoke test PWA version and assets
        run: |
          set -euo pipefail
          base="https://aria.robvg9.workers.dev/pwa/"
          html=""
          for attempt in $(seq 1 30); do
            html="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "${base}?probe=$GITHUB_SHA-$attempt" 2>/dev/null || true)"
            if grep -q 'ARIA — Centro de Mando' <<<"$html" && grep -q "$GITHUB_SHA" <<<"$html" && grep -q "sw-$GITHUB_SHA.js" <<<"$html"; then
              break
            fi
            test "$attempt" -lt 30 && sleep 2
          done
          test -n "$html"
          grep -q 'ARIA — Centro de Mando' <<<"$html"
          grep -q "$GITHUB_SHA" <<<"$html"
          grep -q "sw-$GITHUB_SHA.js" <<<"$html"
          grep -q "__ariaBootReady" <<<"$html"
          version=""
          for attempt in $(seq 1 30); do
            version="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "${base}version.json?probe=$GITHUB_SHA-$attempt" 2>/dev/null || true)"
            if VERSION="$version" GITHUB_SHA="$GITHUB_SHA" python - <<'PY'
          import json, os
          try:
              assert json.loads(os.environ["VERSION"])["build"] == os.environ["GITHUB_SHA"]
              raise SystemExit(0)
          except Exception:
              raise SystemExit(1)
          PY
            then
              break
            fi
            test "$attempt" -lt 30 && sleep 2
          done
          VERSION="$version" GITHUB_SHA="$GITHUB_SHA" python - <<'PY'
          import json, os
          assert json.loads(os.environ["VERSION"])["build"] == os.environ["GITHUB_SHA"]
          PY
          manifest=""
          manifest_ok=false
          for attempt in $(seq 1 30); do
            manifest="$(curl --fail --silent --show-error --max-time 15 "https://aria.robvg9.workers.dev/manifest.json?probe=$GITHUB_SHA-$attempt" 2>/dev/null || true)"
            if grep -q "ARIA — Centro de Mando Cognitivo" <<<"$manifest"; then manifest_ok=true; break; fi
            test "$attempt" -lt 30 && sleep 2
          done
          test "$manifest_ok" = true
          js_asset="$(grep -oE 'assets/[^"]+\.js' <<<"$html" | head -n 1)"
          css_asset="$(grep -oE 'assets/[^"]+\.css' <<<"$html" | head -n 1)"
          test -n "$js_asset"
          test -n "$css_asset"
          js_ok=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 "https://aria.robvg9.workers.dev/pwa/$js_asset?probe=$GITHUB_SHA-$attempt" >/tmp/aria-pwa-js 2>/dev/null && test -s /tmp/aria-pwa-js; then js_ok=true; break; fi
            test "$attempt" -lt 30 && sleep 2
          done
          test "$js_ok" = true
          css_ok=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 "https://aria.robvg9.workers.dev/pwa/$css_asset?probe=$GITHUB_SHA-$attempt" >/tmp/aria-pwa-css 2>/dev/null && test -s /tmp/aria-pwa-css; then css_ok=true; break; fi
            test "$attempt" -lt 30 && sleep 2
          done
          test "$css_ok" = true
          echo "PWA_FAST_DEPLOY_OK build=$GITHUB_SHA js=$js_asset css=$css_asset"

      - name: Verify deployed versioned Service Worker JavaScript
        shell: bash
        run: |
          set -euo pipefail
          base="https://aria.robvg9.workers.dev/pwa/"
          worker_file="${RUNNER_TEMP}/aria-sw-${GITHUB_SHA}.js"
          headers_file="${RUNNER_TEMP}/aria-sw-${GITHUB_SHA}.headers"
          worker_ok=false
          for attempt in $(seq 1 15); do
            worker_url="${base}sw-${GITHUB_SHA}.js?probe=${GITHUB_SHA}-sw-${attempt}"
            rm -f "${worker_file}" "${headers_file}"
            if curl --fail --silent --show-error --max-time 10 \
              -D "${headers_file}" -o "${worker_file}" "${worker_url}" 2>/dev/null; then
              if grep -qiE '^content-type: *application/javascript' "${headers_file}" \
                && test -s "${worker_file}" \
                && grep -q "aria-pwa-${GITHUB_SHA}" "${worker_file}" \
                && grep -q "self.addEventListener('push'" "${worker_file}" \
                && grep -q "aria-push-receipts-v1" "${worker_file}" \
                && ! grep -qiE '<!doctype html|<html([ >])' "${worker_file}" \
                && node --check "${worker_file}"; then
                worker_ok=true
                break
              fi
            fi
            echo "PWA_SW_PROPAGATION_RETRY attempt=${attempt}/15 build=${GITHUB_SHA}"
            test "${attempt}" -lt 15 && sleep 3
          done
          if [[ "${worker_ok}" != true ]]; then
            echo "::error::Versioned Service Worker did not become valid JavaScript for build ${GITHUB_SHA} after 15 fresh requests"
            exit 1
          fi
          echo "PWA_LIVE_SERVICE_WORKER_SYNTAX_OK build=${GITHUB_SHA} url=${worker_url}"
