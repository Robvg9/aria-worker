name: Deploy ARIA PWA Fast Lane
# Swipe RWHT deployment trigger

on:
  push:
    branches: [main]
    paths:
      - "pwa/**"
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/aria-pwa-fast-deploy.yml"
      - ".github/workflows/aria-meditation-webpush-production-e2e.yml"
      - "rwht/pc-browser/rwht-meditation-pwa-e2e.mjs"
  workflow_dispatch:

concurrency:
  group: aria-cloudflare-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install PWA dependencies
        working-directory: pwa
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build PWA
        working-directory: pwa
        env:
          VITE_BUILD: ${{ github.sha }}
        run: |
          export VITE_BUILD="$GITHUB_SHA"
          npm run build
          grep -q "$GITHUB_SHA" dist/index.html
          grep -q "sw-$GITHUB_SHA.js" dist/index.html
          grep -R -q "$GITHUB_SHA" dist/assets
          cp dist/index.html "dist/index-$GITHUB_SHA.html"
          cp dist/manifest.json "dist/manifest-$GITHUB_SHA.json"
          sed "s/__BUILD__/$GITHUB_SHA/g" public/sw.js > "dist/sw-$GITHUB_SHA.js"
          grep -q "aria-pwa-$GITHUB_SHA" "dist/sw-$GITHUB_SHA.js"
          rm -f dist/index.html
      - name: Install Wrangler
        run: npm install --global wrangler@latest
      - name: Deploy ARIA Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sed -i "s/__PWA_BUILD__/$GITHUB_SHA/g" worker.js
          wrangler deploy worker.js --name aria
      - name: Smoke test PWA version and assets
        run: |
          set -euo pipefail
          base="https://aria.robvg9.workers.dev/pwa/"
          html=""
          for attempt in $(seq 1 30); do
            html="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "${base}?probe=$GITHUB_SHA-$attempt" 2>/dev/null || true)"
            if grep -q 'ARIA — Centro de Mando' <<<"$html" && grep -q "$GITHUB_SHA" <<<"$html" && grep -q "sw-$GITHUB_SHA.js" <<<"$html"; then
              break
            fi
            test "$attempt" -lt 30 && sleep 2
          done
          test -n "$html"
          grep -q 'ARIA — Centro de Mando' <<<"$html"
          grep -q "$GITHUB_SHA" <<<"$html"
          grep -q "sw-$GITHUB_SHA.js" <<<"$html"
          grep -q "__ariaBootReady" <<<"$html"
          version=""
          for attempt in $(seq 1 30); do
            version="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "${base}version.json?probe=$GITHUB_SHA-$attempt" 2>/dev/null || true)"
            if VERSION="$version" GITHUB_SHA="$GITHUB_SHA" python - <<'PY'
          import json, os
          try:
              assert json.loads(os.environ["VERSION"])["build"] == os.environ["GITHUB_SHA"]
              raise SystemExit(0)
          except Exception:
              raise SystemExit(1)
          PY
            then
              break
            fi
            test "$attempt" -lt 30 && sleep 2
          done
          VERSION="$version" GITHUB_SHA="$GITHUB_SHA" python - <<'PY'
          import json, os
          assert json.loads(os.environ["VERSION"])["build"] == os.environ["GITHUB_SHA"]
          PY
          manifest=""
          manifest_ok=false
          for attempt in $(seq 1 30); do
            manifest="$(curl --fail --silent --show-error --max-time 15 "https://aria.robvg9.workers.dev/manifest.json?probe=$GITHUB_SHA-$attempt" 2>/dev/null || true)"
            if grep -q "ARIA — Centro de Mando Cognitivo" <<<"$manifest"; then manifest_ok=true; break; fi
            test "$attempt" -lt 30 && sleep 2
          done
          test "$manifest_ok" = true
          js_asset="$(grep -oE 'assets/[^"]+\.js' <<<"$html" | head -n 1)"
          css_asset="$(grep -oE 'assets/[^"]+\.css' <<<"$html" | head -n 1)"
          test -n "$js_asset"
          test -n "$css_asset"
          js_ok=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 "https://aria.robvg9.workers.dev/pwa/$js_asset?probe=$GITHUB_SHA-$attempt" >/tmp/aria-pwa-js 2>/dev/null && test -s /tmp/aria-pwa-js; then js_ok=true; break; fi
            test "$attempt" -lt 30 && sleep 2
          done
          test "$js_ok" = true
          css_ok=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 "https://aria.robvg9.workers.dev/pwa/$css_asset?probe=$GITHUB_SHA-$attempt" >/tmp/aria-pwa-css 2>/dev/null && test -s /tmp/aria-pwa-css; then css_ok=true; break; fi
            test "$attempt" -lt 30 && sleep 2
          done
          test "$css_ok" = true
          echo "PWA_FAST_DEPLOY_OK build=$GITHUB_SHA js=$js_asset css=$css_asset"

      - name: Verify deployed versioned Service Worker JavaScript
        shell: bash
        run: |
          set -euo pipefail
          base="https://aria.robvg9.workers.dev/pwa/"
          worker_file="${RUNNER_TEMP}/aria-sw-${GITHUB_SHA}.js"
          headers_file="${RUNNER_TEMP}/aria-sw-${GITHUB_SHA}.headers"
          node_error_file="${RUNNER_TEMP}/aria-sw-${GITHUB_SHA}.node-check.txt"
          valid=false

          # Cloudflare can serve the new HTML/version before every edge has the
          # matching rewritten Service Worker. Retry the complete invariant set,
          # not just the download, and keep the gate strict on exact SHA and code.
          for attempt in $(seq 1 20); do
            worker_url="${base}sw-${GITHUB_SHA}.js?probe=${GITHUB_SHA}-sw-syntax-${attempt}-$(date +%s)"
            http_status="$(curl --silent --show-error --max-time 20 --retry 1 --retry-delay 1 \
              -D "${headers_file}" -o "${worker_file}" -w '%{http_code}' "${worker_url}" 2>"${RUNNER_TEMP}/aria-sw-curl.txt" || true)"
            content_type="$(awk 'BEGIN { IGNORECASE=1 } /^content-type:/ { sub(/^[^:]*:[[:space:]]*/, ""); gsub(/\r/, ""); value=$0 } END { print value }' "${headers_file}" 2>/dev/null || true)"
            sha_marker=false
            push_handler=false
            receipt_marker=false
            html_body=false
            syntax_ok=false
            if test -s "${worker_file}"; then
              grep -q "aria-pwa-${GITHUB_SHA}" "${worker_file}" && sha_marker=true || true
              grep -q "self.addEventListener('push'" "${worker_file}" && push_handler=true || true
              grep -q "aria-push-receipts-v1" "${worker_file}" && receipt_marker=true || true
              grep -qiE '<!doctype html|<html([ >])' "${worker_file}" && html_body=true || true
              if [ "${html_body}" = false ] && node --check "${worker_file}" >"${node_error_file}" 2>&1; then
                syntax_ok=true
              fi
            fi

            if [ "${http_status}" = "200" ] &&
               grep -qiE '^content-type:[[:space:]]*application/javascript([[:space:]]*;|[[:space:]]*$)' "${headers_file}" &&
               [ "${sha_marker}" = true ] &&
               [ "${push_handler}" = true ] &&
               [ "${receipt_marker}" = true ] &&
               [ "${html_body}" = false ] &&
               [ "${syntax_ok}" = true ]; then
              valid=true
              echo "PWA_SERVICE_WORKER_VALIDATION attempt=${attempt} http=${http_status} content_type=${content_type} sha_marker=${sha_marker} push_handler=${push_handler} receipt_marker=${receipt_marker} syntax=${syntax_ok}"
              echo "PWA_LIVE_SERVICE_WORKER_SYNTAX_OK build=${GITHUB_SHA} url=${worker_url}"
              break
            fi

            echo "PWA_SERVICE_WORKER_RETRY attempt=${attempt}/20 http=${http_status:-unknown} content_type=${content_type:-missing} sha_marker=${sha_marker} push_handler=${push_handler} receipt_marker=${receipt_marker} html_body=${html_body} syntax=${syntax_ok}"
            if [ -s "${RUNNER_TEMP}/aria-sw-curl.txt" ]; then
              sed -n '1,2p' "${RUNNER_TEMP}/aria-sw-curl.txt"
            fi
            if [ -s "${node_error_file}" ] && [ "${syntax_ok}" = false ] && [ "${html_body}" = false ]; then
              sed -n '1,3p' "${node_error_file}"
            fi
            sleep 2
          done

          if [ "${valid}" != true ]; then
            echo "::error::Versioned Service Worker did not satisfy exact-SHA JavaScript/push/persistence checks after 20 attempts for ${GITHUB_SHA}"
            exit 1
          fi
