name: ARIA Meditation IA PWA Authenticated E2E

on:
  push:
    branches: [main]
    paths:
      - 'rwht/pc-browser/rwht-meditation-pwa-e2e.mjs'
      - '.github/workflows/aria-meditation-pwa-e2e.yml'
      - 'pwa/**'
      - 'supabase/functions/aria-app-api-v3/**'
      - 'supabase/functions/aria-device-gateway/**'
      - 'supabase/migrations/*meditation*'
  pull_request:
    branches: [main]
    paths:
      - 'rwht/pc-browser/rwht-meditation-pwa-e2e.mjs'
      - '.github/workflows/aria-meditation-pwa-e2e.yml'
      - 'pwa/**'
      - 'supabase/functions/aria-app-api-v3/**'
      - 'supabase/functions/aria-device-gateway/**'
      - 'supabase/migrations/*meditation*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aria-authenticated-pwa-rwht
  cancel-in-progress: false

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RWHT_URL: https://aria.robvg9.workers.dev/pwa/
      RWHT_HEADLESS: 'true'
      RWHT_REQUIRE_AUTH: 'true'
      RWHT_EMAIL: ${{ secrets.RWHT_EMAIL }}
      RWHT_PASSWORD: ${{ secrets.RWHT_PASSWORD }}
      RWHT_STORAGE_STATE_B64: ${{ secrets.RWHT_STORAGE_STATE_B64 }}
      RWHT_STORAGE_STATE_GZIP_B64: ${{ secrets.RWHT_STORAGE_STATE_GZIP_B64 }}
      RWHT_LOGIN_WAIT_MS: '40000'
      RWHT_AUTH_ATTEMPTS: '1'
      RWHT_ARTIFACT_DIR: meditation-e2e-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare authenticated session fallback
        shell: bash
        run: |
          set -euo pipefail
          if [[ ( -z "${RWHT_EMAIL}" || -z "${RWHT_PASSWORD}" ) && -n "${RWHT_STORAGE_STATE_B64}" ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_B64}" | base64 --decode > "${RUNNER_TEMP}/aria-rwht-auth-state.json"
          elif [[ ( -z "${RWHT_EMAIL}" || -z "${RWHT_PASSWORD}" ) && -n "${RWHT_STORAGE_STATE_GZIP_B64}" ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_GZIP_B64}" | base64 --decode | gzip -dc > "${RUNNER_TEMP}/aria-rwht-auth-state.json"
          fi
          if [[ -f "${RUNNER_TEMP}/aria-rwht-auth-state.json" ]]; then
            chmod 600 "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            echo "RWHT_STORAGE_STATE=${RUNNER_TEMP}/aria-rwht-auth-state.json" >> "${GITHUB_ENV}"
          fi
      - name: Install dependencies
        working-directory: rwht/pc-browser
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: rwht/pc-browser
        run: npx playwright install chromium
      - name: Resolve PR PWA preview target
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: \${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          json="$(curl --fail --silent --show-error --retry 3 --retry-delay 1 \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA/check-runs?per_page=100")"
          preview="$(printf '%s' "$json" | python3 -c 'import json,re,sys; d=json.load(sys.stdin); s="\n".join(((x.get("output") or {}).get("summary") or "") for x in d.get("check_runs",[]) if x.get("name")=="Workers Builds: aria"); m=re.findall(r"Preview Alias URL:\\s*(https://\\S+)",s); print(m[-1] if m else "")')"
          test -n "$preview"
          case "$preview" in
            https://*-aria.robvg9.workers.dev/*) ;;
            *) echo "Unexpected Cloudflare preview URL: $preview" >&2; exit 1 ;;
          esac
          echo "RWHT_URL=$preview/pwa/" >> "$GITHUB_ENV"
          echo "Resolved PR PWA preview: $preview/pwa/"
      - name: Install Supabase CLI for background Web Push E2E
        run: npm install -g supabase
      - name: Link Supabase for background Web Push E2E
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Verify canonical PWA catalog on LIVE
        run: |
          set -euo pipefail
          html=""
          for attempt in $(seq 1 60); do
            html="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "https://aria.robvg9.workers.dev/pwa/?probe=$GITHUB_SHA-meditation-catalog-$attempt" 2>/dev/null || true)"
            if grep -q "aria-test-catalog-version" <<<"$html" && grep -q "2026-10-02-canonical" <<<"$html"; then break; fi
            test "$attempt" -lt 60 && sleep 2
          done
          test -n "$html"
          grep -q "2026-10-02-canonical" <<<"$html"
          echo MEDITATION_PWA_CANONICAL_CATALOG_LIVE_OK
      - name: Execute authenticated Meditation IA PWA E2E
        working-directory: rwht/pc-browser
        run: node rwht-meditation-pwa-e2e.mjs
      - name: Upload Meditation PWA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-meditation-pwa-evidence
          path: rwht/pc-browser/meditation-e2e-artifacts
          if-no-files-found: warn

# Final certification trigger 2026-10-01.
