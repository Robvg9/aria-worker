name: ARIA ABSORB OmniRoute Phase 4 Standalone Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/absorb/omniroute-phase4-standalone-smoke.mjs'
      - 'absorb/omniroute/**'
      - '.github/workflows/omniroute-phase4-standalone-hosted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omniroute-phase4-hosted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase4-standalone:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout ARIA
        uses: actions/checkout@v4
        with:
          path: aria-worker

      - name: Checkout exact OmniRoute source
        uses: actions/checkout@v4
        with:
          repository: diegosouzapw/OmniRoute
          ref: 3e66ff2e8cc94821b093fe57dad667b585230cd1
          fetch-depth: 1
          path: omniroute-source

      - name: Verify exact source commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location "$env:GITHUB_WORKSPACE\omniroute-source"
          $head=(git rev-parse HEAD).Trim()
          if($head -ne '3e66ff2e8cc94821b093fe57dad667b585230cd1'){throw "SOURCE_COMMIT_MISMATCH=$head"}
          Write-Host "SOURCE_COMMIT=PASS $head"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Install exact source
        shell: powershell
        working-directory: omniroute-source
        run: npm ci --no-audit --no-fund

      - name: Build exact source
        shell: powershell
        working-directory: omniroute-source
        env:
          OMNIROUTE_USE_TURBOPACK: '0'
          OMNIROUTE_BUILD_WORKERS: '1'
          OMNIROUTE_BUILD_MEMORY_MB: '12000'
        run: npm run build

      - name: Prepare local deterministic provider
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $mock = @'
          import http from 'node:http';

          const server = http.createServer(async (req, res) => {
            if (req.url === '/v1/models' && req.method === 'GET') {
              res.writeHead(200, {'content-type':'application/json'});
              res.end(JSON.stringify({
                object:'list',
                data:[{id:'omni-test',object:'model',owned_by:'aria-phase4'}]
              }));
              return;
            }

            if (req.url === '/v1/chat/completions' && req.method === 'POST') {
              let body = '';
              for await (const chunk of req) body += chunk;
              let payload = {};
              try { payload = JSON.parse(body || '{}'); } catch {}

              const requestedModel = String(payload.model || 'omni-test').replace(/^mock\//,'');
              const wantsStream = payload.stream === true;

              if (!wantsStream) {
                res.writeHead(200, {'content-type':'application/json'});
                res.end(JSON.stringify({
                  id:'phase4-mock-chat',
                  object:'chat.completion',
                  model:requestedModel,
                  choices:[{
                    index:0,
                    message:{role:'assistant',content:'OK'},
                    finish_reason:'stop'
                  }]
                }));
                return;
              }

              res.writeHead(200, {
                'content-type':'text/event-stream',
                'cache-control':'no-cache',
                'connection':'keep-alive'
              });
              res.write('data: {"id":"phase4-mock-stream","object":"chat.completion.chunk","model":"' + requestedModel + '","choices":[{"index":0,"delta":{"role":"assistant","content":"OK"},"finish_reason":null}]}\n\n');
              res.write('data: {"id":"phase4-mock-stream","object":"chat.completion.chunk","model":"' + requestedModel + '","choices":[{"index":0,"delta":{},"finish_reason":"stop"}]}\n\n');
              res.write('data: [DONE]\n\n');
              res.end();
              return;
            }

            res.writeHead(404, {'content-type':'application/json'});
            res.end(JSON.stringify({error:{message:'not found'}}));
          });

          server.listen(20129,'127.0.0.1');
          console.log('MOCK_PROVIDER=READY http://127.0.0.1:20129/v1');
          setInterval(()=>{}, 1000);
          '@
          $mockPath="$env:RUNNER_TEMP\aria-phase4-mock.mjs"
          Set-Content -Path $mockPath -Value $mock -Encoding utf8
          $mockProc=Start-Process -FilePath node -ArgumentList $mockPath -PassThru -WindowStyle Hidden
          "MOCK_PROVIDER_PID=$($mockProc.Id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Start-Sleep -Seconds 2
          $probe=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:20129/v1/models' -TimeoutSec 5
          if($probe.StatusCode -ne 200){throw 'MOCK_PROVIDER_HEALTH_FAILED'}

      - name: Start exact OmniRoute
        shell: powershell
        working-directory: omniroute-source
        run: |
          $ErrorActionPreference='Stop'
          $sandbox="$env:RUNNER_TEMP\aria-omniroute-phase4"
          $data="$sandbox\data"
          $capture="$sandbox\capture"
          New-Item -ItemType Directory -Force -Path $data,$capture | Out-Null
          $env:DATA_DIR=$data
          $env:PORT='20128'
          $env:HOST='127.0.0.1'
          $env:HOSTNAME='127.0.0.1'
          $env:NEXT_TELEMETRY_DISABLED='1'
          $env:JWT_SECRET=([guid]::NewGuid().ToString('N')+[guid]::NewGuid().ToString('N'))
          $env:API_KEY_SECRET=([guid]::NewGuid().ToString('N')+[guid]::NewGuid().ToString('N')).Substring(0,64)
          $env:INITIAL_PASSWORD=([guid]::NewGuid().ToString('N'))
          $env:OMNIROUTE_ALLOW_PRIVATE_PROVIDER_URLS='true'
          $env:OMNIROUTE_ALLOW_LOCAL_PROVIDER_URLS='true'
          $env:OMNIROUTE_SELF_HOSTED_API_KEY='aria-phase4-key'
          $env:OMNIROUTE_SELF_HOSTED_PROVIDERS=@'
          providers:
            - id: mock
              kind: openai
              baseUrl: http://127.0.0.1:20129/v1
              model: omni-test
          '@
          $proc=Start-Process -FilePath node -ArgumentList @('scripts/dev/run-next.mjs','start') -PassThru -WindowStyle Hidden
          "OMNIROUTE_PID=$($proc.Id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "OMNIROUTE_DATA_DIR=$data" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PHASE4_CAPTURE_DIR=$capture" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $ok=$false
          for($i=0;$i-lt45;$i++){
            Start-Sleep -Seconds 2
            try {
              $h=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:20128/api/health' -TimeoutSec 5
              if($h.StatusCode -eq 200){$ok=$true;break}
            } catch {}
          }
          if(-not $ok){throw 'OMNIROUTE_HEALTHCHECK_FAILED'}
          Write-Host 'OMNIROUTE_START=PASS'

      - name: Run standalone smoke
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location "$env:GITHUB_WORKSPACE\aria-worker"
          $env:OMNIROUTE_BASE_URL='http://127.0.0.1:20128'
          $env:OMNIROUTE_API_KEY='aria-phase4-key'
          $env:OMNIROUTE_SMOKE_MODEL='mock/omni-test'
          $env:OMNIROUTE_SMOKE_TIMEOUT_MS='15000'
          $env:OMNIROUTE_PHASE4_CAPTURE_ROOT=$env:PHASE4_CAPTURE_DIR
          & node scripts/absorb/omniroute-phase4-standalone-smoke.mjs
          if($LASTEXITCODE -ne 0){throw "PHASE4_SMOKE_FAILED=$LASTEXITCODE"}
          Get-Content -Raw (Join-Path $env:PHASE4_CAPTURE_DIR 'PHASE4_SMOKE_CAPTURE.json')

      - name: Stop first instance and verify data survives
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $before=(Get-ChildItem -LiteralPath $env:OMNIROUTE_DATA_DIR -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName,Length)
          if(-not $before){throw 'PERSISTENCE_NO_DATA_CREATED'}
          $before | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $env:PHASE4_CAPTURE_DIR 'PERSISTENCE_BEFORE.json') -Encoding utf8
          if($env:OMNIROUTE_PID){
            & taskkill.exe /PID ([int]$env:OMNIROUTE_PID) /T /F | Out-Null
          }
          Start-Sleep -Seconds 3
          if(Get-Process -Id ([int]$env:OMNIROUTE_PID) -ErrorAction SilentlyContinue){throw 'FIRST_INSTANCE_DID_NOT_STOP'}
          Write-Host 'STOP_1=PASS'
          Write-Host "PERSISTENCE_FILES_BEFORE=$($before.Count)"

      - name: Restart exact OmniRoute with same data
        shell: powershell
        working-directory: omniroute-source
        run: |
          $ErrorActionPreference='Stop'
          $env:DATA_DIR=$env:OMNIROUTE_DATA_DIR
          $env:PORT='20128'
          $env:HOST='127.0.0.1'
          $env:HOSTNAME='127.0.0.1'
          $env:NEXT_TELEMETRY_DISABLED='1'
          $env:JWT_SECRET=([guid]::NewGuid().ToString('N')+[guid]::NewGuid().ToString('N'))
          $env:API_KEY_SECRET=([guid]::NewGuid().ToString('N')+[guid]::NewGuid().ToString('N')).Substring(0,64)
          $env:INITIAL_PASSWORD='aria-phase4-restart'
          $env:OMNIROUTE_ALLOW_PRIVATE_PROVIDER_URLS='true'
          $env:OMNIROUTE_ALLOW_LOCAL_PROVIDER_URLS='true'
          $env:OMNIROUTE_SELF_HOSTED_API_KEY='aria-phase4-key'
          $env:OMNIROUTE_SELF_HOSTED_PROVIDERS=@'
          providers:
            - id: mock
              kind: openai
              baseUrl: http://127.0.0.1:20129/v1
              model: omni-test
          '@
          $proc=Start-Process -FilePath node -ArgumentList @('scripts/dev/run-next.mjs','start') -PassThru -WindowStyle Hidden
          "OMNIROUTE_PID_2=$($proc.Id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $ok=$false
          for($i=0;$i-lt45;$i++){
            Start-Sleep -Seconds 2
            try {
              $h=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:20128/api/health' -TimeoutSec 5
              if($h.StatusCode -eq 200){$ok=$true;break}
            } catch {}
          }
          if(-not $ok){throw 'OMNIROUTE_RESTART_HEALTH_FAILED'}
          Write-Host 'START_2=PASS'

      - name: Verify standalone smoke after restart
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location "$env:GITHUB_WORKSPACE\aria-worker"
          $env:OMNIROUTE_BASE_URL='http://127.0.0.1:20128'
          $env:OMNIROUTE_API_KEY='aria-phase4-key'
          $env:OMNIROUTE_SMOKE_MODEL='mock/omni-test'
          $env:OMNIROUTE_SMOKE_TIMEOUT_MS='15000'
          $env:OMNIROUTE_PHASE4_CAPTURE_ROOT=$env:PHASE4_CAPTURE_DIR
          & node scripts/absorb/omniroute-phase4-standalone-smoke.mjs
          if($LASTEXITCODE -ne 0){throw "PHASE4_RESTART_SMOKE_FAILED=$LASTEXITCODE"}

      - name: Persist final Phase 4 evidence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $after=(Get-ChildItem -LiteralPath $env:OMNIROUTE_DATA_DIR -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName,Length)
          if(-not $after){throw 'PERSISTENCE_NO_DATA_AFTER_RESTART'}
          $summary=[ordered]@{
            schema='aria.absorb.omniroute.phase4.capture.v2'
            status='PASS_STANDALONE_SMOKE'
            source_repository='diegosouzapw/OmniRoute'
            source_ref='release/v3.8.52'
            source_commit='3e66ff2e8cc94821b093fe57dad667b585230cd1'
            base_url='http://127.0.0.1:20128'
            smoke_model='mock/omni-test'
            provider='local deterministic OpenAI-compatible mock'
            checks='health; readiness; models; management auth negative; non-stream chat; streaming chat; status; stop; restart; persistence'
            persistence_before_files=$before
            persistence_after_files=$after
            restart_persistence_pass=$true
            aria_runtime_touched=$false
            captured_at_utc=(Get-Date).ToUniversalTime().ToString('o')
          }
          $path=Join-Path $env:PHASE4_CAPTURE_DIR 'PHASE4_FINAL_CAPTURE.json'
          $summary | ConvertTo-Json -Depth 8 | Set-Content -Path $path -Encoding utf8
          Get-Content -Raw $path

      - name: Cleanup processes
        if: always()
        shell: powershell
        run: |
          if($env:OMNIROUTE_PID_2){
            & taskkill.exe /PID ([int]$env:OMNIROUTE_PID_2) /T /F 2>$null | Out-Null
          }
          if($env:MOCK_PROVIDER_PID){
            & taskkill.exe /PID ([int]$env:MOCK_PROVIDER_PID) /T /F 2>$null | Out-Null
          }

      - name: Upload Phase 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-omniroute-phase4-evidence
          path: ${{ runner.temp }}/aria-omniroute-phase4/
          if-no-files-found: warn
