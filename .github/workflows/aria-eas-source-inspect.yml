name: ARIA EAS Source Archive Inspect

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/aria-eas-source-inspect.yml

permissions:
  contents: read
  actions: write

env:
  EAS_API: https://api.expo.dev
  EAS_PROJECT_ID: 1b23b091-f7b6-4dc2-b328-c8e5ec07de57
  EAS_BUILD_ID: c2b45a20-a56a-4440-9037-905ac72f99d0

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch EAS build artifact metadata
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$EAS_API/graphql" \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Content-Type: application/json" \
            --data-raw "$(cat <<JSON
          {"query":"query Build(\$buildId: ID!) { builds { byId(buildId: \$buildId) { id status platform gitCommitHash gitCommitMessage artifacts { buildUrl applicationArchiveUrl buildArtifactsUrl } } } }","variables":{"buildId":"$EAS_BUILD_ID"}}
          JSON
          )" > build.json
          python - <<'PY'
          import json
          b=((json.load(open('build.json')).get('data') or {}).get('builds') or {}).get('byId')
          if not b: raise SystemExit('Build not found')
          print('BUILD_ID', b.get('id'))
          print('STATUS', b.get('status'))
          print('PLATFORM', b.get('platform'))
          print('GIT_COMMIT', b.get('gitCommitHash'))
          print('GIT_MESSAGE', b.get('gitCommitMessage'))
          a=b.get('artifacts') or {}
          print('HAS_BUILD_URL', bool(a.get('buildUrl')))
          print('HAS_APPLICATION_ARCHIVE_URL', bool(a.get('applicationArchiveUrl')))
          print('HAS_BUILD_ARTIFACTS_URL', bool(a.get('buildArtifactsUrl')))
          open('artifact-urls.txt','w').write('\n'.join([str(a.get('buildUrl') or ''), str(a.get('applicationArchiveUrl') or ''), str(a.get('buildArtifactsUrl') or '')]))
          PY

      - name: Download source archive and inspect
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          URL=$(sed -n '2p' artifact-urls.txt)
          if [ -z "$URL" ] || [ "$URL" = "None" ]; then
            echo 'No application archive URL available.'
            exit 0
          fi
          curl -fsSL --max-time 120 -o source-archive.bin "$URL"
          file source-archive.bin
          echo '== ARCHIVE LIST =='
          unzip -l source-archive.bin | sed -n '1,160p' || true
          echo '== TARGET FILES =='
          unzip -l source-archive.bin | grep -E '(^|/)(package\.json|package-lock\.json|eas\.json)$' || true
          rm -rf source && mkdir source
          unzip -q source-archive.bin -d source
          find source -maxdepth 5 -type f \( -name package.json -o -name package-lock.json -o -name eas.json \) -print
          for f in $(find source -type f \( -name package.json -o -name package-lock.json \) | head -20); do
            echo "== $f =="
            if [[ "$f" == *package-lock.json ]]; then
              node -e 'const d=require(process.argv[1]); console.log(JSON.stringify({name:d.name,version:d.version,lockfileVersion:d.lockfileVersion,packages:d.packages?Object.keys(d.packages).length:0},null,2))' "$f" || true
            else
              node -e 'const d=require(process.argv[1]); console.log(JSON.stringify({name:d.name,version:d.version,dependencies:d.dependencies,devDependencies:d.devDependencies},null,2))' "$f" || true
            fi
          done
