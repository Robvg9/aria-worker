name: Apply terminal failed path

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-terminal-failed-path.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runner
        run: |
          set -euo pipefail
          # Base: current main tip with fault inject
          curl -fsSL "https://raw.githubusercontent.com/Robvg9/aria-worker/main/supabase/functions/aria-mission-runner-v22/index.ts" \
            -o supabase/functions/aria-mission-runner-v22/index.ts
          python3 << 'PY'
          from pathlib import Path
          p = Path("supabase/functions/aria-mission-runner-v22/index.ts")
          src = p.read_text()
          assert len(src) > 50000 and "V_LOGICAL" in src

          if "model_execution_failed_all_routes" not in src:
              anchor = '''        const replanCount = Number(mission?.checkpoint?.recovery?.replan_count || 0) + 1;
        const failedStepIds = failures.map((item) => String(item.step.id));
        const previousPlan = steps;
        const previousResults = results;
        const maxReplans = 2;
        if (replanCount <= maxReplans) {'''
              insert = '''        // Terminal failed: primary+fallback exhausted on non-retryable steps.
        // Write status=failed WHILE still holding the lease, then release.
        const failedStepIdsEarly = failures.map((item) => String(item.step.id));
        const allNonRetryable = failures.every((item) => item.step.retryable === false);
        const multiRouteExhausted = failures.some((item) => {
          const mfs = item.result?.model_execution_failures;
          const attempts = Number(item.result?.error?.attempts || 0);
          return attempts >= 2 || (Array.isArray(mfs) && mfs.length >= 2);
        });
        if (allNonRetryable && multiRouteExhausted) {
          const failEvidence = {
            status: "failed",
            reason: "all_model_routes_exhausted",
            failed_step_ids: failedStepIdsEarly,
            failures: failures.map((item: any) => ({
              step_id: String(item.step.id),
              status: item.result?.status ?? null,
              error: item.result?.error ?? null,
              model_execution_failures: item.result?.model_execution_failures ?? null,
              provider_id: item.result?.provider_id ?? item.step?.target?.provider_id ?? null,
              model_id: item.result?.model_id ?? item.step?.target?.model_id ?? null,
            })),
          };
          await emitEvent(missionId, "mission_failed", failEvidence);
          await updateMission(missionId, {
            status: "failed",
            current_step: completed.size,
            completed_steps: completed.size,
            next_action: "terminal: all model routes exhausted",
            last_stderr: "model_execution_failed_all_routes",
            checkpoint: {
              ...checkpoint,
              results,
              attempts,
              recovery: {
                status: "failed",
                failed_step_ids: failedStepIdsEarly,
                failure_reason: "all_model_routes_exhausted",
                evidence: failEvidence,
              },
              active_step: null,
            },
            lease_owner: null,
            lease_until: null,
          });
          return out({
            ok: false,
            status: "failed",
            mission_id: missionId,
            runtime: V_LOGICAL,
            invocation_id: V,
            completed_steps: completed.size,
            failed_steps: failedStepIdsEarly,
            failure: failEvidence,
          });
        }

        const replanCount = Number(mission?.checkpoint?.recovery?.replan_count || 0) + 1;
        const failedStepIds = failedStepIdsEarly;
        const previousPlan = steps;
        const previousResults = results;
        const maxReplans = 2;
        if (replanCount <= maxReplans) {'''
              if anchor not in src:
                  raise SystemExit("replan anchor missing")
              src = src.replace(anchor, insert, 1)

          old_hb = '''        await updateMission(missionId, {
          status: "blocked",
          current_step: completed.size,
          completed_steps: completed.size,
          next_action: hardBlock.next_action,
          last_stderr: "retry_exhausted_all_strategies",
          checkpoint: { ...checkpoint, recovery: { status: "hard_block", replan_count: replanCount, failed_step_ids: failedStepIds, block_details: hardBlock } },
          lease_owner: null,
          lease_until: null,
        });
        await emitEvent(missionId, "mission_hard_blocked", hardBlock);
        return out({ ok: false, status: "blocked", mission_id: missionId, runtime: V, completed_steps: completed.size, failed_steps: failedStepIds, block_details: hardBlock });'''
          new_hb = '''        await emitEvent(missionId, "mission_hard_blocked", hardBlock);
        await updateMission(missionId, {
          status: "blocked",
          current_step: completed.size,
          completed_steps: completed.size,
          next_action: hardBlock.next_action,
          last_stderr: "retry_exhausted_all_strategies",
          checkpoint: { ...checkpoint, recovery: { status: "hard_block", replan_count: replanCount, failed_step_ids: failedStepIds, block_details: hardBlock } },
          lease_owner: null,
          lease_until: null,
        });
        return out({ ok: false, status: "blocked", mission_id: missionId, runtime: V_LOGICAL, invocation_id: V, completed_steps: completed.size, failed_steps: failedStepIds, block_details: hardBlock });'''
          if "Emit while lease" not in src and old_hb in src:
              src = src.replace(old_hb, new_hb, 1)
          elif "await emitEvent(missionId, \"mission_hard_blocked\"" in src and old_hb in src:
              src = src.replace(old_hb, new_hb, 1)

          # Fix if still old order
          if "last_stderr: \"retry_exhausted_all_strategies\"" in src:
              # ensure emit before update for hard_block
              marker = 'last_stderr: "retry_exhausted_all_strategies"'
              idx = src.find(marker)
              if idx > 0:
                  window = src[idx-200:idx+400]
                  if 'await emitEvent(missionId, "mission_hard_blocked"' in window and window.find('await updateMission') < window.find('await emitEvent'):
                      pass  # already wrong order - need swap if not fixed

          old_replan = '''          await updateMission(missionId, {
            status: "queued",
            current_step: 0,
            completed_steps: 0,
            next_action: "replan: discard failed strategy and build an alternative",
            last_stderr: "retry_exhausted_replanned",
            checkpoint: {
              ...checkpoint,
              plan: undefined,
              completed_steps: [],
              attempts: {},
              results: {},
              pending_jobs: {},
              recovery,
            },
            lease_owner: null,
            lease_until: null,
          });
          await emitEvent(missionId, "mission_replanned", recovery);
          return out({
            ok: true,
            status: "replanned",
            mission_id: missionId,
            runtime: V,
            next_action: "replan: discard failed strategy and build an alternative",
            recovery,
          });'''
          new_replan = '''          await emitEvent(missionId, "mission_replanned", recovery);
          await updateMission(missionId, {
            status: "queued",
            current_step: 0,
            completed_steps: 0,
            next_action: "replan: discard failed strategy and build an alternative",
            last_stderr: "retry_exhausted_replanned",
            checkpoint: {
              ...checkpoint,
              plan: undefined,
              completed_steps: [],
              attempts: {},
              results: {},
              pending_jobs: {},
              recovery,
            },
            lease_owner: null,
            lease_until: null,
          });
          return out({
            ok: true,
            status: "replanned",
            mission_id: missionId,
            runtime: V_LOGICAL,
            invocation_id: V,
            next_action: "replan: discard failed strategy and build an alternative",
            recovery,
          });'''
          if old_replan in src:
              src = src.replace(old_replan, new_replan, 1)

          p.write_text(src)
          text = p.read_text()
          assert "model_execution_failed_all_routes" in text
          assert "all_model_routes_exhausted" in text
          assert "PLACEHOLDER" not in text and "FILE_TOO_LARGE" not in text
          print("ok", len(text))
          PY
          git config user.name aria-supervisor
          git config user.email aria@local
          git add supabase/functions/aria-mission-runner-v22/index.ts
          git commit -m "fix(runner-v22): terminal status=failed + emit before lease release" || echo no_commit
          git push origin HEAD:main
