name: ARIA ABSORB OmniRoute Phase 3 Windows Hosted

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase3-hosted-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ARIA
        uses: actions/checkout@v4
        with:
          path: aria-worker

      - name: Checkout exact OmniRoute commit
        uses: actions/checkout@v4
        with:
          repository: diegosouzapw/OmniRoute
          ref: 3e66ff2e8cc94821b093fe57dad667b585230cd1
          fetch-depth: 1
          path: omniroute-source

      - name: Verify exact source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location "$env:GITHUB_WORKSPACE\omniroute-source"
          $head=(git rev-parse HEAD).Trim()
          if($head -ne '3e66ff2e8cc94821b093fe57dad667b585230cd1'){throw "SOURCE_COMMIT_MISMATCH=$head"}
          Write-Host "SOURCE_COMMIT=PASS $head"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: omniroute-source/package-lock.json

      - name: Install exact source
        shell: powershell
        working-directory: omniroute-source
        run: |
          $ErrorActionPreference='Stop'
          npm ci --no-audit --no-fund

      - name: Build exact source
        shell: powershell
        working-directory: omniroute-source
        run: |
          $ErrorActionPreference='Stop'
          npm run build

      - name: Start isolated server and verify health
        shell: powershell
        working-directory: omniroute-source
        run: |
          $ErrorActionPreference='Stop'
          $sandbox="$env:RUNNER_TEMP\aria-omniroute-phase3"
          $data="$sandbox\data"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $env:DATA_DIR=$data
          $env:PORT='20128'
          $env:HOST='127.0.0.1'
          $env:HOSTNAME='127.0.0.1'
          $env:NEXT_TELEMETRY_DISABLED='1'
          $env:JWT_SECRET=([guid]::NewGuid().ToString('N')+[guid]::NewGuid().ToString('N'))
          $env:API_KEY_SECRET=([guid]::NewGuid().ToString('N')+[guid]::NewGuid().ToString('N')).Substring(0,64)
          $env:INITIAL_PASSWORD=[guid]::NewGuid().ToString('N')
          $p=Start-Process -FilePath node -ArgumentList @('scripts/dev/run-next.mjs','start') -PassThru -WindowStyle Hidden
          $ok=$false
          try{
            for($i=0;$i-lt45;$i++){
              Start-Sleep -Seconds 2
              try{
                $h=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:20128/api/health' -TimeoutSec 5
                if($h.StatusCode -eq 200){$ok=$true;break}
              }catch{}
            }
            if(-not $ok){throw 'HEALTHCHECK_FAILED'}
            Write-Host 'PHASE3_HEALTH=PASS HTTP=200'
          }finally{
            if($p -and -not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          }

      - name: Emit phase3 evidence
        shell: powershell
        run: |
          Write-Host 'PHASE3_STATUS=PASS_HOSTED_WINDOWS'
          Write-Host 'SOURCE_REPOSITORY=diegosouzapw/OmniRoute'
          Write-Host 'SOURCE_COMMIT=3e66ff2e8cc94821b093fe57dad667b585230cd1'
          Write-Host 'INSTALL=npm ci PASS'
          Write-Host 'BUILD=npm run build PASS'
          Write-Host 'HEALTH=HTTP 200 PASS'
          Write-Host 'STOP=PASS'