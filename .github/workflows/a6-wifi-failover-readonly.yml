name: A6 Wi-Fi failover inventory (read-only)

on:
  push:
    branches:
      - ops/a6-windows-agent-v2-heartbeat-preflight-v1
    paths:
      - '.github/workflows/a6-wifi-failover-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a6-wifi-failover-readonly
  cancel-in-progress: false

jobs:
  inspect:
    name: Read Wi-Fi failover inventory on ROBVG
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Capture Wi-Fi state only (no network changes)
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]$env:COMPUTERNAME -ine 'ROBVG') { throw "A6_RUNNER_HOST_MISMATCH expected=ROBVG actual=$env:COMPUTERNAME" }
          $started = [DateTimeOffset]::UtcNow
          Write-Host 'A6_WIFI_STAGE=begin'
          $adapters = @()
          try {
            $adapters = @(Get-NetAdapter -IncludeHidden -ErrorAction Stop |
              Where-Object { $_.InterfaceDescription -match 'Qualcomm|Wireless|Wi-Fi|802.11' -or $_.Name -match 'Wi-Fi|WLAN' } |
              Select-Object Name,InterfaceDescription,Status,LinkSpeed,InterfaceIndex)
          } catch {
            $adapters = @(@{ read_error=$_.Exception.GetType().Name })
          }
          Write-Host "A6_WIFI_STAGE=adapters count=$($adapters.Count)"

          $wlanLines = @()
          try { $wlanLines = @(& netsh.exe wlan show interfaces 2>&1 | ForEach-Object { [string]$_ }) }
          catch { $wlanLines = @('READ_ERROR:' + $_.Exception.GetType().Name) }
          $stateLine = $wlanLines | Where-Object { $_ -match '^\s*(State|Estado)\s*:' } | Select-Object -First 1
          $ssidLine = $wlanLines | Where-Object { $_ -match '^\s*SSID\s*:' -and $_ -notmatch 'BSSID' } | Select-Object -First 1
          Write-Host 'A6_WIFI_STAGE=interfaces'

          $profileLines = @()
          try { $profileLines = @(& netsh.exe wlan show profiles 2>&1 | ForEach-Object { [string]$_ }) }
          catch { $profileLines = @('READ_ERROR:' + $_.Exception.GetType().Name) }
          $profiles = @()
          foreach ($line in $profileLines) {
            if ($line -match '(?i)(All User Profile|Perfil de todos los usuarios|Perfil de usuario)\s*:\s*(?<name>.+)$') {
              $profiles += [string]$Matches.name.Trim()
            }
          }
          Write-Host "A6_WIFI_STAGE=profiles count=$($profiles.Count)"

          $networkLines = @()
          try { $networkLines = @(& netsh.exe wlan show networks mode=bssid 2>&1 | ForEach-Object { [string]$_ }) }
          catch { $networkLines = @('READ_ERROR:' + $_.Exception.GetType().Name) }
          $visible = @()
          foreach ($line in $networkLines) {
            if ($line -match '^\s*SSID\s+\d+\s*:\s*(?<name>.+)$') {
              $name = [string]$Matches.name.Trim()
              if ($name) { $visible += $name }
            }
          }
          $visible = @($visible | Select-Object -Unique | Select-Object -First 20)
          Write-Host "A6_WIFI_STAGE=visible_networks count=$($visible.Count)"

          $connectionProfiles = @()
          try {
            $connectionProfiles = @(Get-NetConnectionProfile -ErrorAction Stop |
              Select-Object Name,InterfaceAlias,NetworkCategory,IPv4Connectivity,IPv6Connectivity)
          } catch {
            $connectionProfiles = @(@{ read_error=$_.Exception.GetType().Name })
          }

          $result = @{
            status = 'READ_ONLY_WIFI_INVENTORY_COMPLETE'
            host = [string]$env:COMPUTERNAME
            captured_at_utc = [DateTimeOffset]::UtcNow.ToString('o')
            duration_seconds = [math]::Round(([DateTimeOffset]::UtcNow - $started).TotalSeconds,1)
            source_sha = [string]$env:GITHUB_SHA
            wifi_adapters = @($adapters)
            wlan_interface_state = [string]$stateLine
            wlan_current_ssid = [string]$ssidLine
            wlan_saved_profiles = @($profiles)
            wlan_visible_networks = @($visible)
            connection_profiles = @($connectionProfiles)
            restrictions = @('NO_ADAPTER_ENABLE_DISABLE','NO_WIFI_CONNECT_DISCONNECT','NO_PROFILE_OR_CREDENTIAL_READ','NO_ROUTE_DNS_OR_POWER_CHANGES','NO_RUNTIME_OR_MISSION_CHANGES')
          }
          $result | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'a6-wifi-failover-readonly.json') -Encoding UTF8
          Write-Host 'A6_WIFI_INVENTORY=PASS'

      - name: Upload read-only Wi-Fi evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-wifi-failover-readonly-${{ github.sha }}
          path: a6-wifi-failover-readonly.json
          if-no-files-found: warn
          retention-days: 14
