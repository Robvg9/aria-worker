name: ARIA Bitrise Runtime Contract

on:
  pull_request:
    paths:
      - 'supabase/functions/aria-mission-runner-v22/bitrise.ts'
      - 'tests/bitrise-runtime-contract.test.js'
      - '.github/workflows/bitrise-runtime-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/aria-mission-runner-v22/bitrise.ts'
      - 'tests/bitrise-runtime-contract.test.js'
      - '.github/workflows/bitrise-runtime-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/bitrise-runtime-contract.test.js
