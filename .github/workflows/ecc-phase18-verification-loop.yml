name: ECC Phase 18 Verification Loop

on:
  pull_request:
    branches:
      - aria/ecc-phase-17-hook-events
    paths:
      - 'scripts/ecc-verification-loop.js'
      - 'tests/ecc-verification-loop.test.js'
      - '.github/workflows/ecc-phase18-verification-loop.yml'
  push:
    branches:
      - 'aria/ecc-phase-18-verification-loop'
    paths:
      - 'scripts/ecc-verification-loop.js'
      - 'tests/ecc-verification-loop.test.js'
      - '.github/workflows/ecc-phase18-verification-loop.yml'

permissions:
  contents: read

jobs:
  verify:
    name: ECC Phase 18 / verification loop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract test
        run: node tests/ecc-verification-loop.test.js
