name: RWHT Android Bridge APK
# RWHT final verification trigger

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rwht-android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Detect preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          test -d "$SDK_ROOT/platforms"
          sdk_dir="$(find "$SDK_ROOT/platforms" -maxdepth 1 -mindepth 1 -type d -name 'android-*' | sed 's#.*/android-##' | sort -n | tail -1)"
          build_tools="$(find "$SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sed 's#.*/##' | sort -V | tail -1)"
          test -n "$sdk_dir"
          test -n "$build_tools"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_COMPILE_SDK=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$build_tools" >> "$GITHUB_ENV"
          echo "Detected Android compileSdk=$sdk_dir buildTools=$build_tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        working-directory: android-rwht-bridge
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: android-rwht-bridge
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/aria-rwht-android-bridge-v1.apk
          test -s app/build/outputs/apk/debug/aria-rwht-android-bridge-v1.apk
          sha256sum app/build/outputs/apk/debug/aria-rwht-android-bridge-v1.apk
          du -h app/build/outputs/apk/debug/aria-rwht-android-bridge-v1.apk


      - name: Publish temporary Android installer endpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: android-rwht-bridge
        run: |
          set -euo pipefail
          npm install --global wrangler@latest
          rm -rf rwht-download public
          mkdir -p rwht-download public
          cp app/build/outputs/apk/debug/aria-rwht-android-bridge-v1.apk public/aria-rwht-android-bridge-v1.apk
          cat > rwht-download/worker.js <<'EOF'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname !== '/aria-rwht-android-bridge-v1.apk') {
                return new Response('Not Found', { status: 404 });
              }
              const response = await env.ASSETS.fetch(new Request(new URL('/aria-rwht-android-bridge-v1.apk', url), request));
              const headers = new Headers(response.headers);
              headers.set('content-type', 'application/vnd.android.package-archive');
              headers.set('content-disposition', 'attachment; filename="aria-rwht-android-bridge-v1.apk"');
              headers.set('cache-control', 'no-store');
              return new Response(response.body, { status: response.status, headers });
            }
          };
          EOF
          cd rwht-download
          wrangler deploy worker.js --name aria-rwht-android-bridge --assets ../public

      - name: Upload RWHT APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-rwht-android-bridge-v1
          path: android-rwht-bridge/app/build/outputs/apk/debug/aria-rwht-android-bridge-v1.apk
          if-no-files-found: error
          retention-days: 14
