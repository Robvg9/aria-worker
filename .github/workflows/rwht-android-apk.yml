name: RWHT Android Bridge APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rwht-android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify preinstalled Android SDK
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin:$PATH"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        working-directory: android-rwht-bridge
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        working-directory: android-rwht-bridge
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
          du -h app/build/outputs/apk/release/app-release.apk

      - name: Upload RWHT APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-rwht-android-bridge-v1
          path: android-rwht-bridge/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
