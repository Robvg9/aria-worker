name: BattleCruiser Step 4 Android Worker Recovery Probe V1 (Read Only)
on:
  push:
    branches:
      - aria/bc-step4-android-e2e-20261021
    paths:
      - .github/workflows/battlecruiser-step4-android-worker-recovery-probe-v1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-step4-android-worker-recovery-probe-v1
  cancel-in-progress: false
jobs:
  android-worker-recovery-probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: Probe worker recovery with one bounded native IPC health read
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.request, urllib.error
          project=os.environ.get('SUPABASE_PROJECT_REF','').strip()
          secret=os.environ.get('ARIA_RUNTIME_SHARED_SECRET','')
          if not project or not secret: raise SystemExit('BLOCKED: production secrets unavailable')
          base=f'https://{project}.supabase.co/functions/v1'
          headers={'Authorization':'Bearer '+secret,'content-type':'application/json','cache-control':'no-store'}
          mission_id=f"mission_bc_step4_android_worker_recovery_probe_v1_{os.environ['RUN_ID']}_{os.environ['RUN_ATTEMPT']}"
          device='android-termux-a1ebcfc7-9287-4603-a0f9-c519d12fd092'
          marker='BC_STEP4_ANDROID_WORKER_RECOVERY_PROBE_V1'
          command=r"""node <<'NODE'
          const {probeLocalIpcHealth}=require('./computer-use/android-accessibility-v1.js');
          const marker='BC_STEP4_ANDROID_WORKER_RECOVERY_PROBE_V1';
          (async()=>{
            const h=await probeLocalIpcHealth({timeoutMs:2500});
            const p=h&&h.payload||{};
            const result={
              marker,
              ok:h&&h.ok===true,
              reason:h&&h.reason||null,
              transport:h&&h.metadata&&h.metadata.transport||null,
              version_name:p.version_name||h&&h.metadata&&h.metadata.version_name||null,
              version_code:p.version_code||h&&h.metadata&&h.metadata.version_code||null,
              build_id:p.build_id||h&&h.metadata&&h.metadata.build_id||null,
              protocol:p.protocol||null,
              service:p.service||null,
              port:p.port||null,
              expected:{version_name:'1.1.23',version_code:29,build_id:'3708b31b319884f7d42082414a82cdd11450fe2d'}
            };
            result.exact_build=result.ok===true&&String(result.version_name)==='1.1.23'&&Number(result.version_code)===29&&String(result.build_id)==='3708b31b319884f7d42082414a82cdd11450fe2d';
            console.log(JSON.stringify(result));
            if(!result.ok)process.exitCode=1;
          })().catch(e=>{console.log(JSON.stringify({marker,ok:false,error:String(e&&e.message||e).slice(0,180)}));process.exitCode=1;});
          NODE"""
          metadata={'goal_source':'chat','source_application':'ChatGPT','project_name':'BattleCruiser','source':'battlecruiser_step4_android_worker_recovery_probe_v1','verification_marker':marker,'device_id':device,'requested_device_id':device,'operation':'shell.execute','executor_type':'device','requested_capability':'shell.execute','command':command,'risk':'READ','timeout_ms':12000,'target_package':'com.android.chrome','allowed_hosts':['battlecruiser.robvg9.workers.dev'],'read_only':True,'business_data_mutated':False,'explicit_device_intent':True,'human_gate_required':False}
          def post(fn,payload,timeout=75):
              req=urllib.request.Request(base+'/'+fn,data=json.dumps(payload).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read().decode())
                  except:return e.code,{}
          code,body=post('aria-direct-v1',{'goal':'Ejecuta shell.execute en el Android explícito para hacer una única lectura del health endpoint local del agente UI, devolviendo la versión exacta y un marcador JSON. No navegues, no abras menús ni cambies ajustes. Esta prueba corta verifica si el worker pudo reclamar y completar una tarea nueva después del reinicio del supervisor. Marcador BC_STEP4_ANDROID_WORKER_RECOVERY_PROBE_V1.','mission_id':mission_id,'metadata':metadata})
          print('DISPATCH_HTTP='+str(code));print('MISSION_ID='+mission_id);print('DISPATCH_STATUS='+str(body.get('dispatch',{}).get('status','unknown')))
          if code>=300 or body.get('ok') is not True:print('DISPATCH_ERROR='+json.dumps(body,ensure_ascii=False)[:1200]);raise SystemExit(2)
          terminal={'succeeded','failed','blocked','rejected','cancelled','human_required','paused'}
          last={}
          for i in range(1,41):
              c,last=post('aria-mission-runner-v22',{'mission_id':mission_id})
              s=str(last.get('status','unknown'));print('POLL='+json.dumps({'n':i,'http':c,'status':s,'error':last.get('error'),'next_action':last.get('next_action')}))
              if s in terminal or c in (401,403,404):break
              time.sleep(2)
          s=str(last.get('status','unknown'));print('FINAL_STATUS='+s);print('FINAL='+json.dumps({k:last.get(k) for k in ('ok','status','mission_id','error','next_action','executor_types','results') if k in last},ensure_ascii=False)[:3500])
          if s!='succeeded':raise SystemExit(1)
          PY
