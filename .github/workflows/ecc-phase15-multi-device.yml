name: ECC Phase 15 Multi-device Ownership

on:
  pull_request:
    branches:
      - aria/ecc-phase-14-session-contract
    paths:
      - 'scripts/ecc-device-ownership.js'
      - 'tests/ecc-device-ownership.test.js'
      - '.github/workflows/ecc-phase15-multi-device.yml'
  push:
    branches:
      - 'aria/ecc-phase-15-multi-device-ownership'
    paths:
      - 'scripts/ecc-device-ownership.js'
      - 'tests/ecc-device-ownership.test.js'
      - '.github/workflows/ecc-phase15-multi-device.yml'

permissions:
  contents: read

jobs:
  ownership:
    name: ECC Phase 15 / multi-device ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract test
        run: node tests/ecc-device-ownership.test.js
