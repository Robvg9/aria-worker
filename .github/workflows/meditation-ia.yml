name: Meditation IA

on:
  push:
    branches: [main, 'aria/meditation-ia-v1']
  pull_request:
    branches: [main]

jobs:
  meditation-ia:
    name: Meditation IA Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate core
        run: node tests/meditation-ia.test.js
      - name: Validate gateway contract
        run: node - <<'NODE'
const fs = require('node:fs');
const s = fs.readFileSync('supabase/functions/aria-device-gateway/index.ts','utf8');
for (const needle of ['/v1/meditation/tick','claim_execution_job_gateway','aria_mission_create']) {
  if (!s.includes(needle)) throw new Error(`missing:${needle}`);
}
console.log('MEDITATION_GATEWAY_CONTRACT=PASS');
NODE
