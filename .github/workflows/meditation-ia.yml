name: Meditation IA

on:
  push:
    branches: [main, 'aria/meditation-ia-v1-main']
  pull_request:
    branches: [main]

jobs:
  contract:
    name: Meditation IA Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Core tests
        run: node tests/meditation-ia.test.js
      - name: Static contracts
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const agent=fs.readFileSync('agents/windows/aria-agent.js','utf8');
          const gateway=fs.readFileSync('supabase/functions/aria-device-gateway/index.ts','utf8');
          for(const s of [
            ['agent','aria-meditation-controller'],
            ['agent','computer.use'],
            ['gateway','/v1/meditation/tick'],
            ['gateway','aria_mission_create']
          ]) if(!(s[0]==='agent'?agent:gateway).includes(s[1])) throw new Error(`missing:${s[0]}:${s[1]}`);
          console.log('MEDITATION_IA_STATIC_CONTRACT=PASS');
          NODE
