name: ARIA Meditation IA — Production Web Push E2E

on:
  push:
    branches: [main]
    paths:
      - 'rwht/pc-browser/rwht-meditation-pwa-e2e.mjs'
      - 'rwht/pc-browser/cloudflare-live-webpush-physical-e2e.mjs'
      - 'pwa/src/notifications.ts'
      - 'pwa/public/sw.js'
      - 'pwa/**'
      - 'supabase/functions/aria-app-api-v3/**'
      - 'supabase/migrations/*meditation*'
      - '.github/workflows/aria-meditation-webpush-production-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aria-production-webpush-e2e-v3
  cancel-in-progress: true

jobs:
  webpush_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      RWHT_URL: https://aria.robvg9.workers.dev/pwa/
      RWHT_HEADLESS: 'false'
      RWHT_REQUIRE_AUTH: 'true'
      RWHT_EMAIL: ${{ secrets.RWHT_EMAIL }}
      RWHT_PASSWORD: ${{ secrets.RWHT_PASSWORD }}
      RWHT_STORAGE_STATE_B64: ${{ secrets.RWHT_STORAGE_STATE_B64 }}
      RWHT_STORAGE_STATE_GZIP_B64: ${{ secrets.RWHT_STORAGE_STATE_GZIP_B64 }}
      RWHT_LOGIN_WAIT_MS: '40000'
      RWHT_AUTH_ATTEMPTS: '1'
      RWHT_BACKGROUND_PUSH_E2E: 'true'
      RWHT_BACKGROUND_PUSH_ONLY: 'true'
      RWHT_ARTIFACT_DIR: meditation-e2e-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare authenticated session fallback
        shell: bash
        run: |
          set -euo pipefail
          if [[ ( -z "${RWHT_EMAIL}" || -z "${RWHT_PASSWORD}" ) && -n "${RWHT_STORAGE_STATE_B64}" ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_B64}" | base64 --decode > "${RUNNER_TEMP}/aria-rwht-auth-state.json"
          elif [[ ( -z "${RWHT_EMAIL}" || -z "${RWHT_PASSWORD}" ) && -n "${RWHT_STORAGE_STATE_GZIP_B64}" ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_GZIP_B64}" | base64 --decode | gzip -dc > "${RUNNER_TEMP}/aria-rwht-auth-state.json"
          fi
          if [[ -f "${RUNNER_TEMP}/aria-rwht-auth-state.json" ]]; then
            chmod 600 "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            echo "RWHT_STORAGE_STATE=${RUNNER_TEMP}/aria-rwht-auth-state.json" >> "${GITHUB_ENV}"
          fi

      - name: Install E2E dependencies
        working-directory: rwht/pc-browser
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: rwht/pc-browser
        run: npx playwright install chromium

      - name: Wait for LIVE PWA exact build SHA
        shell: bash
        run: |
          set -euo pipefail
          base="${RWHT_URL%/}/"
          html=""
          version=""
          for attempt in $(seq 1 90); do
            html="$(curl --fail --silent --show-error --retry 1 --retry-delay 1 "${base}?probe=$GITHUB_SHA-webpush-$attempt" 2>/dev/null || true)"
            version="$(curl --fail --silent --show-error --retry 1 --retry-delay 1 "${base}version.json?probe=$GITHUB_SHA-webpush-$attempt" 2>/dev/null || true)"
            if grep -q "aria-test-catalog-version" <<<"$html" &&
               grep -q "$GITHUB_SHA" <<<"$html" &&
               VERSION="$version" GITHUB_SHA="$GITHUB_SHA" python - <<'PY'
          import json, os
          try:
              raise SystemExit(0 if json.loads(os.environ["VERSION"]).get("build") == os.environ["GITHUB_SHA"] else 1)
          except Exception:
              raise SystemExit(1)
          PY
            then
              echo "PWA_LIVE_EXACT_SHA_OK build=$GITHUB_SHA"
              break
            fi
            test "$attempt" -lt 90 && sleep 2
          done
          grep -q "$GITHUB_SHA" <<<"$html"
          VERSION="$version" GITHUB_SHA="$GITHUB_SHA" python - <<'PY'
          import json, os
          assert json.loads(os.environ["VERSION"]).get("build") == os.environ["GITHUB_SHA"]
          PY

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Execute production Web Push and authenticated click-through E2E
        working-directory: rwht/pc-browser
        shell: bash
        run: |
          set -uo pipefail
          echo "WEBPUSH_PHYSICAL_E2E_START sha=$GITHUB_SHA"
          timeout --foreground --signal=TERM --kill-after=15s 240s xvfb-run -a --server-args='-screen 0 1920x1080x24' node cloudflare-live-webpush-physical-e2e.mjs
          physical_status=$?
          echo "WEBPUSH_PHYSICAL_E2E_EXIT=$physical_status"
          echo "WEBPUSH_AUTHENTICATED_CLICKTHROUGH_START sha=$GITHUB_SHA"
          timeout --foreground --signal=TERM --kill-after=15s 240s xvfb-run -a --server-args='-screen 0 1920x1080x24' node rwht-meditation-pwa-e2e.mjs
          clickthrough_status=$?
          echo "WEBPUSH_AUTHENTICATED_CLICKTHROUGH_EXIT=$clickthrough_status"
          if [[ "$physical_status" -ne 0 || "$clickthrough_status" -ne 0 ]]; then
            echo "WEBPUSH_E2E_FAILED physical=$physical_status clickthrough=$clickthrough_status"
            exit 1
          fi
          echo "WEBPUSH_E2E_ALL_PASS"

      - name: Upload Web Push evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-production-webpush-evidence
          path: rwht/pc-browser/meditation-e2e-artifacts
          if-no-files-found: warn
