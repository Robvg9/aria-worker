name: Verify lease multi-tick LIVE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multitick:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Isolated multi-tick x5
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
        run: |
          set -euo pipefail
          BASE="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          AUTH="Authorization: Bearer ${ARIA_RUNTIME_SHARED_SECRET}"

          run_one() {
            local attempt="$1"
            local TS MID create body status terminal inv cs
            TS=$(date +%s)
            MID="mission_lease_mt5_${TS}_${attempt}"
            echo "==== ATTEMPT $attempt MID=$MID ===="
            create=$(curl -s -X POST "$BASE/aria-direct-v1" -H "$AUTH" -H "content-type: application/json" \
              -d "{\"goal\":\"Cloud-only: reply with exactly the word PONG using text generation. No devices.\",\"mission_id\":\"$MID\",\"metadata\":{\"goal_source\":\"supervisor_probe\",\"probe\":\"lease_multitick_x5\",\"cloud_only\":true}}" --max-time 60)
            echo "$create" | grep -q '"status":"queued"'
            echo "CREATE ok"

            terminal=""
            for i in $(seq 1 14); do
              body=$(curl -s -X POST "$BASE/aria-mission-runner-v22" -H "$AUTH" -H "content-type: application/json" \
                -d "{\"mission_id\":\"$MID\"}" --max-time 180)
              inv=$(echo "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('invocation_id') or '')" 2>/dev/null || true)
              cs=$(echo "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('claim_source') or '')" 2>/dev/null || true)
              status=$(echo "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo unknown)
              echo "TICK $i status=$status claim_source=$cs inv=$inv"
              echo "BODY $i: $(echo "$body" | head -c 400)"
              if echo "$body" | grep -q 'mission_lease_required\|mission_lease_lost'; then
                echo "FAIL attempt $attempt: lease error"
                return 1
              fi
              case "$status" in
                succeeded) terminal=succeeded; break ;;
                failed|blocked) terminal=$status; break ;;
                paused) terminal=paused; break ;;
              esac
              sleep 1
            done
            if [ "$terminal" != "succeeded" ]; then
              echo "FAIL attempt $attempt: expected succeeded got ${terminal:-timeout}"
              return 1
            fi
            echo "PASS attempt $attempt MID=$MID"
            return 0
          }

          pass=0
          for a in 1 2 3 4 5; do
            if run_one "$a"; then pass=$((pass+1)); else echo "attempt $a failed"; fi
            sleep 2
          done
          echo "STABILITY pass=$pass/5"
          if [ "$pass" -lt 5 ]; then exit 1; fi
          echo "MULTI_TICK_STABLE_5_5_OK"
