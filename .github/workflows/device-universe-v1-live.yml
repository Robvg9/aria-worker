name: Device Universe v1 CONTRACT
# Phase 8 contract: abstract device resources -> capabilities -> health -> security -> cognition/executor boundary.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full regression suite
        run: npm test
      - name: Device Universe contract test
        run: node tests/device-universe-v1-live.js
