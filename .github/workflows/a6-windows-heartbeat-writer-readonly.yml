name: A6 Windows Heartbeat Writer Read-Only Diagnostic

on:
  push:
    branches:
      - ops/a6-windows-agent-v2-heartbeat-preflight-v1
    paths:
      - '.github/workflows/a6-windows-heartbeat-writer-readonly.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect heartbeat writers without touching runtime
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Enumerate process identities, script copies and heartbeat schema (read-only)
        run: |
          $ErrorActionPreference = 'Continue'
          $runtime = 'D:\ARIA-Windows-Agent'
          $logs = Join-Path $runtime 'Logs'
          $heartbeat = Join-Path $logs 'agent-heartbeat.json'
          $runtimeAgent = Join-Path $runtime 'Runtime\windows\aria-agent.js'
          $runtimeWatchdog = Join-Path $runtime 'Runtime\windows\run-agent.ps1'
          $resultPath = Join-Path $env:GITHUB_WORKSPACE 'a6-windows-heartbeat-writer-diagnostic.json'
          $samples = [System.Collections.Generic.List[object]]::new()
          $processSnapshots = [System.Collections.Generic.List[object]]::new()
          $scriptCandidates = [System.Collections.Generic.List[object]]::new()
          $started = [DateTimeOffset]::UtcNow

          function Get-ProcessSnapshot {
            $all = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)
            $byId = @{}
            foreach ($p in $all) { $byId[[int]$p.ProcessId] = $p }
            foreach ($p in $all | Where-Object { $_.Name -match '^(node|powershell|pwsh|cmd)(\.exe)?$' }) {
              $proc = Get-Process -Id ([int]$p.ProcessId) -ErrorAction SilentlyContinue
              $path = [string]$p.ExecutablePath
              $start = ''
              if ($proc) {
                if ([string]::IsNullOrWhiteSpace($path)) { try { $path = [string]$proc.Path } catch {} }
                try { $start = $proc.StartTime.ToUniversalTime().ToString('o') } catch {}
              }
              $cmd = [string]$p.CommandLine
              $tags = @()
              if ($cmd -match '(?i)aria-agent\.js') { $tags += 'ARIA_AGENT' }
              if ($cmd -match '(?i)run-agent\.ps1') { $tags += 'ARIA_WATCHDOG' }
              if ($cmd -match '(?i)aria-persistent-windows-worker-v1\.js') { $tags += 'PERSISTENT_WORKER_V1' }
              if ($cmd -match '(?i)update-runtime-v3\.ps1') { $tags += 'RUNTIME_UPDATER_V3' }
              if ($cmd -match '(?i)install-v2\.ps1') { $tags += 'INSTALLER_V2' }
              $ownerName = 'unavailable'
              try {
                $owner = Invoke-CimMethod -InputObject $p -MethodName GetOwner -ErrorAction Stop
                if ($owner.ReturnValue -eq 0) { $ownerName = "$($owner.Domain)\$($owner.User)" }
              } catch {}
              $parent = $byId[[int]$p.ParentProcessId]
              [pscustomobject]@{
                pid = [int]$p.ProcessId
                name = [string]$p.Name
                session_id = [int]$p.SessionId
                parent_pid = [int]$p.ParentProcessId
                parent_name = if ($parent) { [string]$parent.Name } else { 'not_running_or_unavailable' }
                owner = $ownerName
                executable_path = $path
                start_utc = $start
                command_line_available = -not [string]::IsNullOrWhiteSpace($cmd)
                command_tags = @($tags)
              }
            }
          }

          Write-Host "HOST=$env:COMPUTERNAME"
          Write-Host "RUNNER_IDENTITY=$([Security.Principal.WindowsIdentity]::GetCurrent().Name)"
          Write-Host "WINDOW_START_UTC=$($started.ToString('o'))"

          foreach ($path in @($runtimeAgent,$runtimeWatchdog,(Join-Path $runtime 'run-agent.ps1'),(Join-Path $runtime 'Data\config.json'))) {
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              $item = Get-Item -LiteralPath $path
              $hash = if ($path.EndsWith('.js') -or $path.EndsWith('.ps1')) { (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash } else { $null }
              $scriptCandidates.Add([pscustomobject]@{ path=$path; size=$item.Length; modified_utc=$item.LastWriteTimeUtc.ToString('o'); sha256=$hash })
              Write-Host "RUNTIME_FILE path=$path size=$($item.Length) modified_utc=$($item.LastWriteTimeUtc.ToString('o')) sha256=$hash"
            } else { Write-Host "RUNTIME_FILE_MISSING=$path" }
          }

          # Search only the ARIA runtime directory for script references. Print paths and
          # match categories, never source lines, credentials, or token contents.
          try {
            $candidateFiles = @(Get-ChildItem -LiteralPath $runtime -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in @('.js','.ps1','.cmd','.bat') })
            foreach ($file in $candidateFiles) {
              $matches = @(Select-String -LiteralPath $file.FullName -Pattern 'agent-heartbeat\.json|ARIA_AGENT_HEARTBEAT_PATH|aria-windows-agent-heartbeat-v1|aria-windows-agent-heartbeat-v2' -ErrorAction SilentlyContinue)
              if ($matches.Count -gt 0) {
                $categories = @()
                foreach ($m in $matches) {
                  if ($m.Line -match 'agent-heartbeat\.json') { $categories += 'HEARTBEAT_FILE_PATH' }
                  if ($m.Line -match 'ARIA_AGENT_HEARTBEAT_PATH') { $categories += 'HEARTBEAT_ENV_PATH' }
                  if ($m.Line -match 'aria-windows-agent-heartbeat-v1') { $categories += 'SCHEMA_V1' }
                  if ($m.Line -match 'aria-windows-agent-heartbeat-v2') { $categories += 'SCHEMA_V2' }
                }
                $scriptCandidates.Add([pscustomobject]@{ path=$file.FullName; size=$file.Length; modified_utc=$file.LastWriteTimeUtc.ToString('o'); sha256=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash; reference_categories=@($categories | Sort-Object -Unique); reference_line_count=$matches.Count })
                Write-Host "SCRIPT_REFERENCE path=$($file.FullName) categories=$(@($categories | Sort-Object -Unique) -join ',') lines=$($matches.Count)"
              }
            }
            Write-Host "RUNTIME_SCRIPT_FILES_SCANNED=$($candidateFiles.Count)"
          } catch { Write-Host "RUNTIME_SCRIPT_SCAN_ERROR=$($_.Exception.GetType().Name)" }

          # Read-only scheduled task inventory. Arguments are deliberately omitted.
          try {
            $tasks = @(Get-ScheduledTask -ErrorAction Stop | Where-Object {
              $_.TaskName -match '(?i)ARIA|Windows-Local-Agent' -or $_.TaskPath -match '(?i)ARIA'
            })
            Write-Host "ARIA_TASK_COUNT=$($tasks.Count)"
            foreach ($task in $tasks) {
              $executables = @($task.Actions | ForEach-Object { [string]$_.Execute }) -join ','
              Write-Host "ARIA_TASK name=$($task.TaskName) path=$($task.TaskPath) state=$($task.State) user=$($task.Principal.UserId) executables=$executables"
            }
          } catch { Write-Host "ARIA_TASK_ENUMERATION_ERROR=$($_.Exception.GetType().Name)" }

          $before = @(Get-ProcessSnapshot)
          foreach ($p in $before) {
            $processSnapshots.Add($p)
            Write-Host "PROCESS pid=$($p.pid) name=$($p.name) session=$($p.session_id) parent=$($p.parent_pid)/$($p.parent_name) owner=$($p.owner) path=$($p.executable_path) start=$($p.start_utc) cmd_available=$($p.command_line_available) tags=$($p.command_tags -join ',')"
          }

          if (Test-Path -LiteralPath $heartbeat -PathType Leaf) {
            $hbFile = Get-Item -LiteralPath $heartbeat
            $hb = Get-Content -Raw -LiteralPath $heartbeat | ConvertFrom-Json
            Write-Host "HEARTBEAT_INITIAL version=$($hb.version) timestamp=$($hb.timestamp) ack=$($hb.last_gateway_heartbeat_at) modified_utc=$($hbFile.LastWriteTimeUtc.ToString('o'))"
          } else { Write-Host 'HEARTBEAT_INITIAL=MISSING' }

          # Observe for 180 seconds without creating, deleting, or changing any runtime file.
          $end = [DateTimeOffset]::UtcNow.AddSeconds(180)
          $lastSignature = ''
          while ([DateTimeOffset]::UtcNow -lt $end) {
            $now = [DateTimeOffset]::UtcNow
            $entry = [ordered]@{ sampled_at_utc=$now.ToString('o'); exists=$false; version=$null; timestamp=$null; ack=$null; last_write_utc=$null; read_error=$null }
            try {
              if (Test-Path -LiteralPath $heartbeat -PathType Leaf) {
                $hbFile = Get-Item -LiteralPath $heartbeat
                $hb = Get-Content -Raw -LiteralPath $heartbeat | ConvertFrom-Json
                $entry.exists = $true
                $entry.version = [string]$hb.version
                $entry.timestamp = [string]$hb.timestamp
                $entry.ack = [string]$hb.last_gateway_heartbeat_at
                $entry.last_write_utc = $hbFile.LastWriteTimeUtc.ToString('o')
              }
            } catch { $entry.read_error = $_.Exception.GetType().Name }
            $signature = "$($entry.version)|$($entry.read_error)|$($entry.exists)"
            if ($signature -ne $lastSignature) {
              Write-Host "HEARTBEAT_SCHEMA_EVENT time=$($entry.sampled_at_utc) exists=$($entry.exists) version=$($entry.version) read_error=$($entry.read_error)"
              $lastSignature = $signature
            }
            $samples.Add([pscustomobject]$entry)
            Start-Sleep -Seconds 5
          }

          $after = @(Get-ProcessSnapshot)
          foreach ($p in $after) {
            Write-Host "PROCESS_END pid=$($p.pid) name=$($p.name) session=$($p.session_id) parent=$($p.parent_pid)/$($p.parent_name) owner=$($p.owner) path=$($p.executable_path) start=$($p.start_utc) cmd_available=$($p.command_line_available) tags=$($p.command_tags -join ',')"
          }

          $result = [ordered]@{
            status='OBSERVED_READ_ONLY'
            host=$env:COMPUTERNAME
            runner_identity=[Security.Principal.WindowsIdentity]::GetCurrent().Name
            started_at_utc=$started.ToString('o')
            captured_at_utc=[DateTimeOffset]::UtcNow.ToString('o')
            samples=@($samples.ToArray())
            runtime_files=@($scriptCandidates.ToArray())
            processes_start=@($before)
            processes_end=@($after)
          }
          $result | ConvertTo-Json -Depth 9 | Set-Content -LiteralPath $resultPath -Encoding UTF8
          Write-Host "A6_READONLY_WRITER_DIAGNOSTIC=PASS samples=$($samples.Count) processes_start=$($before.Count) processes_end=$($after.Count)"

      - name: Upload sanitized read-only diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-windows-heartbeat-writer-diagnostic-${{ github.sha }}
          path: a6-windows-heartbeat-writer-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
