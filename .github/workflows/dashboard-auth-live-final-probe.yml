name: ARIA Dashboard Auth LIVE Final Probe

on:
  push:
    branches:
      - probe/dashboard-auth-preview-20260929

permissions:
  contents: read

jobs:
  dashboard-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RWHT_URL: https://aria.robvg9.workers.dev/pwa/
      RWHT_HEADLESS: 'true'
      RWHT_NO_SCREENSHOTS: 'false'
      RWHT_ALLOW_MUTATIONS: 'false'
      RWHT_REQUIRE_AUTH: 'true'
      RWHT_ROUTES: '#home'
      RWHT_RELOAD_AUTH: 'true'
      RWHT_LOGIN_WAIT_MS: '40000'
      RWHT_EXPECTED_AUTH_TEXT: 'Lista para actuar'
      RWHT_EMAIL: ${{ secrets.RWHT_EMAIL }}
      RWHT_PASSWORD: ${{ secrets.RWHT_PASSWORD }}
      RWHT_STORAGE_STATE_B64: ${{ secrets.RWHT_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require authorized session source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RWHT_EMAIL}" || -z "${RWHT_PASSWORD}" ]] && [[ -z "${RWHT_STORAGE_STATE_B64}" ]]; then
            echo "::error::No authorized RWHT session source is configured."
            exit 1
          fi
          if [[ -n "${RWHT_STORAGE_STATE_B64}" ]]; then
            printf '%s' "${RWHT_STORAGE_STATE_B64}" | base64 --decode > "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            chmod 600 "${RUNNER_TEMP}/aria-rwht-auth-state.json"
            echo "RWHT_STORAGE_STATE=${RUNNER_TEMP}/aria-rwht-auth-state.json" >> "${GITHUB_ENV}"
          fi
      - name: Install PC RWHT dependencies
        working-directory: rwht/pc-browser
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: rwht/pc-browser
        run: npx playwright install --with-deps chromium
      - name: Execute authenticated Dashboard RWHT on LIVE
        working-directory: rwht/pc-browser
        run: node rwht-pc-browser.mjs
      - name: Assert final Dashboard closure evidence
        working-directory: rwht/pc-browser
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('rwht-artifacts/rwht-pc-report.json', 'utf8'));
          const route = r.routes?.[0] ?? {};
          const failures = [];
          if (r.routes_requested !== 1 || r.routes_completed !== 1) failures.push('route_count');
          if (!r.auth_verified) failures.push('initial_auth');
          if (!route.auth?.reload?.verified) failures.push('reload_auth');
          if (r.controls_failed !== 0 || r.controls_testable !== r.controls_verified) failures.push('controls');
          if (r.page_errors?.length) failures.push('page_errors');
          if (r.failed_responses?.length) failures.push('failed_5xx_responses');
          if (r.ux_issues?.length) failures.push('ux_issues');
          if (r.coverage_ratio < 0.98) failures.push('coverage');
          if (failures.length) {
            console.error(JSON.stringify({failures, summary:r}, null, 2));
            process.exit(3);
          }
          console.log(JSON.stringify({
            DASHBOARD_CLOSED_100:true,
            routes:r.routes_completed,
            controls_verified:r.controls_verified,
            controls_testable:r.controls_testable,
            coverage_ratio:r.coverage_ratio,
            initial_auth:r.auth_verified,
            reload_auth:Boolean(route.auth?.reload?.verified),
            page_errors:r.page_errors.length,
            failed_responses:r.failed_responses.length,
            ux_issues:r.ux_issues.length
          }, null, 2));
          NODE
      - name: Upload final Dashboard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-dashboard-auth-live-final-evidence
          path: rwht/pc-browser/rwht-artifacts
          if-no-files-found: warn
      - name: Remove temporary auth state
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/aria-rwht-auth-state.json"
