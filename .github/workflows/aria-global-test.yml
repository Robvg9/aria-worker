name: ARIA Global Test

on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.json'
      - '**/*.ts'
      - '**/*.sql'
      - '**/*.md'
      - 'package.json'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full test suite
        run: npm test
      - name: Verify BattleCruiser autonomous gates
        run: |
          node tests/battlecruiser-sandbox-controller.test.js
          node tests/battlecruiser-regression-gate.test.js
          node tests/battlecruiser-promotion-gate.test.js
          node tests/battlecruiser-runtime-bridge.test.js
          node tests/battlecruiser-autonomous-mission.test.js
