name: Mission Wonder 2 A6 Windows Power Diagnostics

on:
  pull_request:
    paths:
      - 'agents/windows/aria-agent.js'
      - 'agents/windows/run-agent.ps1'
      - 'agents/windows/install-v2.ps1'
      - '.github/workflows/mission-wonder-2-a6-windows-power-diagnostics.yml'
      - '.github/workflows/mission-wonder-2-a6-windows-diagnostics-queue-guard.yml'

permissions:
  contents: read

concurrency:
  group: mission-wonder-2-a6-windows-power-diagnostics-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnostics:
    name: Read-only Windows power and heartbeat evidence
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Capture heartbeat, task, process and power plan
        run: |
          $ErrorActionPreference = 'Continue'
          $root = 'D:\ARIA-Windows-Agent'
          $logs = Join-Path $root 'Logs'
          $outDir = Join-Path $env:RUNNER_TEMP 'a6-windows-power-diagnostics'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          function Invoke-BoundedNativeCommand([string]$FilePath,[string[]]$Arguments,[int]$TimeoutMs=5000) {
            $base = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N'))
            $stdoutPath = $base + '.out'
            $stderrPath = $base + '.err'
            try {
              $proc = Start-Process -FilePath $FilePath -ArgumentList ($Arguments -join ' ') -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
              if (-not $proc.WaitForExit($TimeoutMs)) {
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                return ('TIMED_OUT_AFTER_MS=' + $TimeoutMs)
              }
              $stdout = if (Test-Path -LiteralPath $stdoutPath) { Get-Content -Raw -LiteralPath $stdoutPath } else { '' }
              $stderr = if (Test-Path -LiteralPath $stderrPath) { Get-Content -Raw -LiteralPath $stderrPath } else { '' }
              return ('EXIT_CODE=' + $proc.ExitCode + "`nSTDOUT=" + $stdout + "`nSTDERR=" + $stderr)
            } catch {
              return ('COMMAND_ERROR=' + $_.Exception.Message)
            } finally {
              Remove-Item -LiteralPath $stdoutPath,$stderrPath -Force -ErrorAction SilentlyContinue
            }
          }
          $heartbeatPath = Join-Path $logs 'agent-heartbeat.json'
          $statusPath = Join-Path $logs 'status.json'
          $watchdogPath = Join-Path $logs 'watchdog.log'
          $heartbeat = $null
          if (Test-Path -LiteralPath $heartbeatPath) {
            try { $heartbeat = Get-Content -Raw -LiteralPath $heartbeatPath | ConvertFrom-Json } catch { $heartbeat = @{ read_error=$_.Exception.Message } }
          }
          $watchdogStatus = $null
          if (Test-Path -LiteralPath $statusPath) {
            try { $watchdogStatus = Get-Content -Raw -LiteralPath $statusPath | ConvertFrom-Json } catch { $watchdogStatus = @{ read_error=$_.Exception.Message } }
          }
          $watchdogBytes = if (Test-Path -LiteralPath $watchdogPath) { (Get-Item -LiteralPath $watchdogPath).Length } else { 0 }
          $taskInfo = Invoke-BoundedNativeCommand -FilePath (Join-Path $env:WINDIR 'System32\schtasks.exe') -Arguments @('/query','/TN','\ARIA-Windows-Local-Agent','/FO','LIST') -TimeoutMs 5000
          $powerRequests = Invoke-BoundedNativeCommand -FilePath (Join-Path $env:WINDIR 'System32\powercfg.exe') -Arguments @('/requests') -TimeoutMs 5000
          $sleepPlan = Invoke-BoundedNativeCommand -FilePath (Join-Path $env:WINDIR 'System32\powercfg.exe') -Arguments @('/query','SCHEME_CURRENT','SUB_SLEEP') -TimeoutMs 5000
          $lastWake = Invoke-BoundedNativeCommand -FilePath (Join-Path $env:WINDIR 'System32\powercfg.exe') -Arguments @('/lastwake') -TimeoutMs 5000
          $processes = @(Get-Process -Name node,powershell -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,SessionId)
          $report = [ordered]@{
            classification = 'READ_ONLY_DIAGNOSTICS'
            captured_at_utc = (Get-Date).ToUniversalTime().ToString('o')
            computer_name = $env:COMPUTERNAME
            runner_name = $env:RUNNER_NAME
            runner_os = $env:RUNNER_OS
            device_heartbeat = $heartbeat
            watchdog_status = $watchdogStatus
            watchdog_log_bytes = $watchdogBytes
            scheduled_task_query = $taskInfo
            active_processes = $processes
            powercfg_requests = $powerRequests
            active_sleep_plan = $sleepPlan
            last_wake = $lastWake
          }
          $report | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $outDir 'a6-windows-runtime-snapshot.json') -Encoding UTF8
          Write-Host "COMPUTER=$env:COMPUTERNAME"
          Write-Host "RUNNER=$env:RUNNER_NAME"
          Write-Host "HEARTBEAT_FILE_PRESENT=$(Test-Path -LiteralPath $heartbeatPath)"
          Write-Host "WATCHDOG_LOG_BYTES=$watchdogBytes"
          Write-Host "AGENT_PROCESS_COUNT=$($processes.Count)"
          Write-Host 'A6DIAG_RUNTIME_SNAPSHOT=PASS'

      - name: Collect bounded Windows power events
        run: |
          $ErrorActionPreference = 'Continue'
          $outDir = Join-Path $env:RUNNER_TEMP 'a6-windows-power-diagnostics'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $out = Join-Path $outDir 'a6-windows-power-events.txt'
          $err = Join-Path $outDir 'a6-windows-power-events.err.txt'
          $xpath = "*[System[(EventID=41 or EventID=42 or EventID=107 or EventID=506 or EventID=507 or (Provider[@Name='Microsoft-Windows-Power-Troubleshooter'] and EventID=1))]]"
          $eventArgs = 'qe System /q:"' + $xpath + '" /c:40 /rd:true /f:Text'
          try {
            $proc = Start-Process -FilePath (Join-Path $env:WINDIR 'System32\wevtutil.exe') -ArgumentList $eventArgs -PassThru -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $proc.WaitForExit(12000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              'WEVTUTIL_TIMED_OUT_AFTER_12000_MS' | Set-Content -LiteralPath $out -Encoding UTF8
            }
          } catch {
            ('WEVTUTIL_ERROR=' + $_.Exception.Message) | Set-Content -LiteralPath $out -Encoding UTF8
          }
          Write-Host "POWER_EVENT_FILE_BYTES=$((Get-Item -LiteralPath $out -ErrorAction SilentlyContinue).Length)"
          Write-Host 'A6DIAG_POWER_EVENTS_CAPTURE=FINISHED'

      - name: Upload direct Windows evidence
        uses: actions/upload-artifact@v4
        with:
          name: mission-wonder-2-a6-windows-power-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/a6-windows-power-diagnostics/**
            D:/ARIA-Windows-Agent/Logs/agent-heartbeat.json
            D:/ARIA-Windows-Agent/Logs/status.json
            D:/ARIA-Windows-Agent/Logs/watchdog.log
          if-no-files-found: error
          retention-days: 14
