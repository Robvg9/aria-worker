name: Cancel Stale Windows 101

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-windows-101.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Force cancel stale Windows 101 run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: "36273016587"
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/cancel" || true
          sleep 3
          gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/force-cancel" || true
          for i in {1..12}; do
            status="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.status')"
            conclusion="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.conclusion // ""')"
            echo "STALE_RUN_STATUS=$status|$conclusion"
            if [ "$status" = "completed" ]; then exit 0; fi
            sleep 5
          done
          exit 1
