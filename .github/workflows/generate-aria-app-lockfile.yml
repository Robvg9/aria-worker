name: Generate ARIA app lockfile

on:
  push:
    branches:
      - tmp/aria-app-lockfile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Write exact ARIA app package manifest
        run: |
          set -euo pipefail
          mkdir -p /tmp/aria-app-lockfile
          cat > /tmp/aria-app-lockfile/package.json <<'JSON'
          {
            "name": "aria-app",
            "version": "0.1.1",
            "private": true,
            "main": "expo/AppEntry.js",
            "scripts": {
              "start": "expo start",
              "android": "expo start --android",
              "typecheck": "tsc --noEmit"
            },
            "dependencies": {
              "expo": "57.0.21",
              "expo-router": "57.0.20",
              "expo-status-bar": "57.0.1",
              "expo-constants": "57.0.17",
              "expo-linking": "57.0.9",
              "expo-secure-store": "57.0.3",
              "react": "19.2.3",
              "react-native": "0.86.3",
              "react-native-safe-area-context": "5.7.0",
              "react-native-screens": "4.26.2",
              "typescript": "6.0.3",
              "expo-image-picker": "~57.0.16",
              "expo-document-picker": "~57.0.1",
              "expo-file-system": "~57.0.6",
              "expo-audio": "~57.0.4",
              "@supabase/supabase-js": "^2.57.0",
              "expo-asset": "~57.0.16",
              "expo-dev-client": "~57.0.18"
            },
            "devDependencies": {
              "@types/react": "19.2.18",
              "@types/node": "22.15.3"
            }
          }
          JSON
          printf 'legacy-peer-deps=true\n' > /tmp/aria-app-lockfile/.npmrc
      - name: Generate package lock
        working-directory: /tmp/aria-app-lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --include=dev
          npm ci --include=dev
      - name: Stage generated dependency files
        run: |
          set -euo pipefail
          mkdir -p generated/aria-app
          cp /tmp/aria-app-lockfile/package-lock.json generated/aria-app/package-lock.json
          cp /tmp/aria-app-lockfile/.npmrc generated/aria-app/.npmrc
      - name: Upload dependency files
        uses: actions/upload-artifact@v4
        with:
          name: aria-app-dependency-files
          path: |
            generated/aria-app/package-lock.json
            generated/aria-app/.npmrc
          if-no-files-found: error
