name: Diagnose Cloudflare Workers Builds

on:
  push:
    branches:
      - diagnose/cloudflare-builds-20260928

permissions:
  contents: read

jobs:
  diagnose:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Workers Builds configuration and failing build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          echo "=== BUILD LIMITS / TOKEN PERMISSION PROBE ==="
          curl --fail --silent --show-error "${api}/builds/account/limits" "${auth[@]}" | jq .

          echo "=== LATEST WORKERS BUILDS ==="
          latest=""
          for attempt in $(seq 1 30); do
            latest="$(curl --fail --silent --show-error "${api}/builds/builds/latest" "${auth[@]}")"
            match="$(jq -r --arg sha "$TARGET_SHA" '
              .result.builds
              | to_entries[]
              | .value
              | select(.build_trigger_metadata.commit_hash == $sha)
              | @json
            ' <<<"$latest" | head -n 1)"
            if test -n "$match"; then
              break
            fi
            sleep 2
          done

          test -n "$match" || {
            echo "NO_BUILD_FOR_TARGET_SHA"
            jq '.result.builds | to_entries[] | .value | {
              build_uuid,
              build_outcome,
              status,
              build_trigger_metadata: {
                branch,
                commit_hash,
                build_command,
                deploy_command,
                root_directory,
                repo_name,
                provider_type
              }
            }' <<<"$latest"
            exit 1
          }

          BUILD="$match" python - <<'PY'
          import json, os
          b=json.loads(os.environ["BUILD"])
          safe=b.get("build_trigger_metadata") or {}
          trigger=b.get("trigger") or {}
          print("=== MATCHING BUILD ===")
          print(json.dumps({
            "build_uuid": b.get("build_uuid"),
            "build_outcome": b.get("build_outcome"),
            "status": b.get("status"),
            "created_on": b.get("created_on"),
            "modified_on": b.get("modified_on"),
            "build_trigger_metadata": {
              "branch": safe.get("branch"),
              "commit_hash": safe.get("commit_hash"),
              "commit_message": safe.get("commit_message"),
              "build_command": safe.get("build_command"),
              "deploy_command": safe.get("deploy_command"),
              "root_directory": safe.get("root_directory"),
              "repo_name": safe.get("repo_name"),
              "provider_type": safe.get("provider_type"),
            },
            "trigger": {
              "trigger_uuid": trigger.get("trigger_uuid"),
              "trigger_name": trigger.get("trigger_name"),
              "external_script_id": trigger.get("external_script_id"),
              "build_command": trigger.get("build_command"),
              "deploy_command": trigger.get("deploy_command"),
              "root_directory": trigger.get("root_directory"),
              "branch_includes": trigger.get("branch_includes"),
              "branch_excludes": trigger.get("branch_excludes"),
              "path_includes": trigger.get("path_includes"),
              "path_excludes": trigger.get("path_excludes"),
              "build_caching_enabled": trigger.get("build_caching_enabled"),
              "repo_connection": trigger.get("repo_connection"),
            }
          }, indent=2))
          PY

          build_uuid="$(jq -r '.build_uuid' <<<"$match")"
          trigger_uuid="$(jq -r '.trigger.trigger_uuid' <<<"$match")"
          external_script_id="$(jq -r '.trigger.external_script_id' <<<"$match")"

          echo "=== BUILD LOG ==="
          curl --fail --silent --show-error "${api}/builds/builds/${build_uuid}/logs" "${auth[@]}" | jq .

          echo "=== TRIGGER FROM BUILDS API ==="
          curl --fail --silent --show-error "${api}/builds/triggers/${trigger_uuid}" "${auth[@]}" | jq .

          echo "=== DONE: DIAGNOSTIC ONLY; NO REPO OR ARIA RUNTIME MUTATION ==="
