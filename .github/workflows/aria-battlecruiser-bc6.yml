name: ARIA BattleCruiser BC-6

on:
  push:
    branches: [main]
    paths:
      - 'autonomy/battlecruiser/**'
      - 'tests/battlecruiser-promotion-gate.test.js'
      - 'tests/battlecruiser-runtime-bridge.test.js'
      - '.github/workflows/aria-battlecruiser-bc6.yml'
  workflow_dispatch:

jobs:
  bc6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify BC-5 regression gate
        run: node tests/battlecruiser-regression-gate.test.js
      - name: Verify BC-6 promotion gate
        run: node tests/battlecruiser-promotion-gate.test.js
      - name: Verify BC-6 runtime bridge
        run: node tests/battlecruiser-runtime-bridge.test.js
