name: ARIA Meditation Local Repair v6

on:
  push:
    branches: [aria/meditation-ia-v1-main]
    paths-ignore:
      - 'reports/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair actual control-port owner
        run: |
          $ErrorActionPreference='Stop'
          $statusUrl='http://127.0.0.1:45873/status'
          $startUrl='http://127.0.0.1:45873/start'
          $listener=Get-NetTCPConnection -LocalAddress '127.0.0.1' -LocalPort 45873 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
          if($listener){
            $ownerPid=[int]$listener.OwningProcess
            $owner=Get-CimInstance Win32_Process -Filter "ProcessId = $ownerPid" -ErrorAction SilentlyContinue
            Write-Host "CONTROL_PORT_OWNER_PID=$ownerPid"
            Write-Host "CONTROL_PORT_OWNER_CMD=$($owner.CommandLine)"
            $safeOwner=($owner.Name -match '^node(\.exe)?$' -and [string]$owner.CommandLine -match '(?i)aria-(agent|meditation-controller)\.js|Runtime\\windows\\aria-agent\.js')
            if(-not $safeOwner){throw "Unexpected owner of 45873; refusing to stop PID=$ownerPid CMD=$($owner.CommandLine)"}
            $s=Invoke-RestMethod $statusUrl -TimeoutSec 5
            Write-Host "BEFORE_MODE=$($s.mode) SESSION=$($s.session_id) TICK=$($s.tick_count)"
            if($s.mode -ne 'active'){
              Stop-Process -Id $ownerPid -Force -ErrorAction Stop
              Start-Sleep -Seconds 3
            }
          }
          $launcher='D:\ARIA-Windows-Agent\Runtime\scripts\start-meditation-ia.ps1'
          if(-not(Test-Path $launcher)){throw "Meditation launcher missing: $launcher"}
          $online=$false
          try{$s=Invoke-RestMethod $statusUrl -TimeoutSec 2;if($s){$online=$true}}catch{}
          if(-not $online){Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',$launcher -WindowStyle Hidden}
          for($i=0;$i -lt 20;$i++){Start-Sleep 1;try{$s=Invoke-RestMethod $statusUrl -TimeoutSec 2;if($s){break}}catch{}}
          if(-not $s){throw 'Meditation endpoint unavailable after controlled restart'}
          if($s.mode -ne 'active'){
            $r=Invoke-RestMethod -Method Post -Uri $startUrl -TimeoutSec 10
            Write-Host "START_RESPONSE=$($r.status)"
            Start-Sleep 3
          }
          $f=Invoke-RestMethod $statusUrl -TimeoutSec 5
          Write-Host "AFTER_MODE=$($f.mode) SESSION=$($f.session_id) TICK=$($f.tick_count)"
          if($f.mode -ne 'active'){throw "Meditation activation failed: $($f.mode)"}
          Write-Host 'MEDITATION_ACTIVATION=PASS'

      - name: Verify two heartbeats
        run: |
          $ErrorActionPreference='Stop'
          $u='http://127.0.0.1:45873/status'
          $a=Invoke-RestMethod $u -TimeoutSec 5
          if($a.mode -ne 'active'){throw "Not active: $($a.mode)"}
          $t1=[int]$a.tick_count
          Start-Sleep -Seconds 35
          $b=Invoke-RestMethod $u -TimeoutSec 5
          Write-Host "HEARTBEAT_1=$t1 HEARTBEAT_2=$($b.tick_count) MODE=$($b.mode)"
          if($b.mode -ne 'active'){throw "Stopped after heartbeat: $($b.mode)"}
          if([int]$b.tick_count -le $t1){throw 'Heartbeat did not advance'}
          Start-Sleep -Seconds 35
          $c=Invoke-RestMethod $u -TimeoutSec 5
          Write-Host "HEARTBEAT_2=$($b.tick_count) HEARTBEAT_3=$($c.tick_count) MODE=$($c.mode)"
          if($c.mode -ne 'active'){throw "Stopped after second heartbeat: $($c.mode)"}
          if([int]$c.tick_count -le [int]$b.tick_count){throw 'Second heartbeat did not advance'}
          Write-Host 'MEDITATION_HEARTBEAT_2X=PASS'

      - name: Final evidence
        run: |
          $ErrorActionPreference='Stop'
          $s=Invoke-RestMethod 'http://127.0.0.1:45873/status' -TimeoutSec 5
          $c=Get-PSDrive C
          Write-Host "COMPUTER=$env:COMPUTERNAME"
          Write-Host "C_FREE_GB=$([math]::Round($c.Free/1GB,2))"
          Write-Host "MODE=$($s.mode)"
          Write-Host "SESSION=$($s.session_id)"
          Write-Host "TICKS=$($s.tick_count)"
          if($s.mode -ne 'active'){throw 'Final proof not active'}
          Write-Host 'ARIA_MEDITATION_LOCAL_REPAIR_V6=PASS'
