name: BattleCruiser Step 4 Android Window Recovery Probe V2 (Read Only)
on:
  push:
    branches:
      - aria/bc-step4-android-e2e-20261021
    paths:
      - .github/workflows/battlecruiser-step4-android-window-recovery-v2.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-step4-android-window-recovery-v2-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  android-window-recovery-probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Launch one read-only Android probe and leave result in execution_jobs
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request, urllib.error
          project=os.environ.get('SUPABASE_PROJECT_REF','').strip()
          secret=os.environ.get('ARIA_RUNTIME_SHARED_SECRET','')
          if not project or not secret: raise SystemExit('BLOCKED: runtime secrets unavailable')
          base=f'https://{project}.supabase.co/functions/v1'
          headers={'Authorization':'Bearer '+secret,'content-type':'application/json','cache-control':'no-store'}
          mission_id=f"mission_bc_step4_android_window_recovery_v2_{os.environ['RUN_ID']}_{os.environ['RUN_ATTEMPT']}"
          device='android-termux-a1ebcfc7-9287-4603-a0f9-c519d12fd092'
          host='battlecruiser.robvg9.workers.dev'
          marker='BC_STEP4_ANDROID_WINDOW_RECOVERY_V2'
          command=r"""node <<'NODE'
          const {probeLocalIpcHealth,executeAndroidAccessibilityJob}=require('./computer-use/android-accessibility-v1.js');
          const host='battlecruiser.robvg9.workers.dev';
          const marker='BC_STEP4_ANDROID_WINDOW_RECOVERY_V2';
          const base={target_package:'com.android.chrome',allow_any_app:false,allowed_hosts:[host]};
          const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const clean=s=>typeof s==='string'?s.replace(/\s+/g,' ').trim().replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig,'[redacted]').slice(0,140):'';
          const norm=s=>clean(s).toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n');
          function scan(root){const nodes=[],seen=new Set();let count=0;const walk=(n,path,d)=>{if(!n||typeof n!=='object'||Array.isArray(n)||seen.has(n)||d>28||count>=1200)return;seen.add(n);count++;const names=['name','label','contentDescription','text','hint'].map(k=>clean(n[k])).filter(Boolean);nodes.push({id:typeof n.id==='string'&&n.id?n.id:path,path,role:clean(n.role),className:clean(n.className||n.class),names,text:names.join(' | '),visible:n.visible!==false,clickable:!!n.clickable,enabled:n.enabled!==false,bounds:n.bounds||null});if(Array.isArray(n.children))n.children.forEach((c,i)=>walk(c,path+'.'+i,d+1));};walk(root,'0',0);return nodes;}
          async function observe(){const r=await executeAndroidAccessibilityJob({command:JSON.stringify({...base,operation:'observe'}),timeoutMs:9000});const p=r&&r.payload||{},root=p.root||(p.ui&&p.ui.root)||null;return {r,p,root,nodes:root?scan(root):[]};}
          async function act(action){return executeAndroidAccessibilityJob({command:JSON.stringify({...base,operation:'action',action}),timeoutMs:12000});}
          function onScreen(n){const b=n&&n.bounds;if(!b)return true;const l=Number(b.left),t=Number(b.top),r=Number(b.right),bt=Number(b.bottom);return [l,t,r,bt].every(Number.isFinite)&&r>l&&bt>t&&r>0&&bt>258&&l<1080&&t<2205;}
          (async()=>{const h=await probeLocalIpcHealth({timeoutMs:3000}),hp=h&&h.payload||{},timeline=[];let cur=await observe();timeline.push({step:'initial_observe',status:cur.r?.status||null,reason:clean(cur.r?.reason),nodeCount:cur.nodes.length});
            if(!cur.root||!cur.nodes.length||String(cur.r?.reason||'').includes('no_active_application_window')){const url='https://'+host+'/';const navPayload={...base,operation:'action',action:{action:'navigate',url:url}};const nav=await executeAndroidAccessibilityJob({command:JSON.stringify(navPayload),timeoutMs:12000});timeline.push({step:'navigate_allowlisted_live_url',status:nav?.status||null,reason:clean(nav?.reason||nav?.payload?.reason)});await wait(1200);cur=await observe();timeline.push({step:'observe_after_navigate',status:cur.r?.status||null,reason:clean(cur.r?.reason),nodeCount:cur.nodes.length});}
            const hasApp=ns=>ns.some(n=>n.visible&&/reportes disponibles|abrir reporte ventas|centro de control/i.test(norm(n.text)));
            if(cur.nodes.length&&!hasApp(cur.nodes)){const addr=cur.nodes.find(n=>n.visible&&n.clickable&&n.enabled&&onScreen(n)&&(/buscar en google o escribir una url/i.test(norm(n.text))||norm(n.text).includes(norm(host))));if(addr){const click=await act({action:'click',nodeId:addr.id});timeline.push({step:'focus_visible_address_bar',status:click?.status||null,reason:clean(click?.reason||click?.payload?.reason),target:{text:clean(addr.text),bounds:addr.bounds}});await wait(250);const enter=await act({action:'press',keyCode:66});timeline.push({step:'submit_url_enter',status:enter?.status||null,reason:clean(enter?.reason||enter?.payload?.reason)});await wait(2400);cur=await observe();timeline.push({step:'observe_after_enter',status:cur.r?.status||null,reason:clean(cur.r?.reason),nodeCount:cur.nodes.length});}}
            const labels=cur.nodes.filter(n=>n.visible&&n.text).slice(0,100).map(n=>({text:clean(n.text),role:n.role,className:n.className,clickable:n.clickable,enabled:n.enabled,bounds:n.bounds}));
            const summary={marker,ok:!!(h?.ok===true&&cur.r?.status==='succeeded'&&cur.root&&cur.nodes.length>0),health:{ok:!!h?.ok,status:h?.status||null,version_name:hp.version_name||null,version_code:hp.version_code||null,build_id:hp.build_id||null,reason:h?.reason||null},timeline,screen:{status:cur.r?.status||null,reason:cur.r?.reason||null,nodeCount:cur.nodes.length,evidence_hash:cur.p?.evidence_hash||null,appLabels:labels.filter(n=>/reportes disponibles|abrir reporte|informacion detallada|centro de control|ventas|compras|buscar en google o escribir una url|pestanas/i.test(norm(n.text))),visibleLabels:labels},safety:{onlyAllowlistedUrl:true,noBusinessButtonsClicked:true,noFormsSubmitted:true,businessWrites:false,stockMutated:false,rolesOrUsersChanged:false}};
            console.log(JSON.stringify(summary));if(!summary.ok)process.exitCode=3;})().catch(e=>{console.log(JSON.stringify({marker,ok:false,error:clean(String(e&&e.stack||e)),safety:{businessWrites:false,stockMutated:false,formsSubmitted:false}}));process.exitCode=1});
          NODE"""
          metadata={'goal_source':'chat','source_application':'ChatGPT','project_name':'BattleCruiser','source':'battlecruiser_step4_android_window_recovery_v2','verification_marker':marker,'device_id':device,'requested_device_id':device,'operation':'shell.execute','executor_type':'device','requested_capability':'shell.execute','command':command,'risk':'READ','timeout_ms':40000,'target_package':'com.android.chrome','allowed_hosts':[host],'read_only':True,'business_data_mutated':False,'explicit_device_intent':True,'human_gate_required':False}
          def post(fn,payload,timeout=45):
              req=urllib.request.Request(base+'/'+fn,data=json.dumps(payload).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read().decode())
                  except:return e.code,{}
          code,body=post('aria-direct-v1',{'goal':'Run one read-only Android window-recovery probe: observe the accessibility tree; only if no active window exists, navigate Chrome to the allowlisted BattleCruiser LIVE URL and read the tree. Do not click business controls or submit forms. Marker BC_STEP4_ANDROID_WINDOW_RECOVERY_V2.','mission_id':mission_id,'metadata':metadata})
          print('DISPATCH_HTTP='+str(code));print('MISSION_ID='+mission_id);print('DISPATCH_STATUS='+str(body.get('dispatch',{}).get('status','unknown')))
          if code>=300 or body.get('ok') is not True: print(json.dumps(body)[:1500]);raise SystemExit(2)
          print('DISPATCH_ACCEPTED_FOR_ASYNC_EXECUTION=true')
          print('SOURCE_OF_FINAL_RESULT=aria_internal.execution_jobs exact mission id; runner idle is not the test result')
          PY