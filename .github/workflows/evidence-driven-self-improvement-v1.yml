name: Evidence Driven Self-Improvement v1
on:
  push:
    branches: ["aria/evidence-driven-self-improvement-v1"]
  pull_request:
    branches: ["main"]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/evidence-ledger-v1.test.js
      - run: node tests/evidence-driven-self-improvement-v1.test.js
