name: A6 Windows Process and Mutex Read-Only Discovery

on:
  push:
    branches:
      - ops/a6-windows-agent-v2-heartbeat-preflight-v1
    paths:
      - '.github/workflows/a6-windows-process-mutex-discovery.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: Enumerate runtime processes and mutex only
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Enumerate process owners, command lines and runtime files
        run: |
          $ErrorActionPreference = 'Continue'
          $runtime = 'D:\ARIA-Windows-Agent'
          $agentPath = Join-Path $runtime 'Runtime\windows\aria-agent.js'
          $watchdogPath = Join-Path $runtime 'Runtime\windows\run-agent.ps1'
          $logDir = Join-Path $runtime 'Logs'
          Write-Host "HOST=$env:COMPUTERNAME"
          Write-Host "IDENTITY=$([Security.Principal.WindowsIdentity]::GetCurrent().Name)"

          foreach ($p in @($runtime,$agentPath,$watchdogPath,(Join-Path $runtime 'run-agent.ps1'),(Join-Path $runtime 'Data\config.json'))) {
            if (Test-Path -LiteralPath $p) {
              $item = Get-Item -LiteralPath $p
              if ($item.PSIsContainer) { Write-Host "DIR=$p" }
              else {
                $hash = (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash
                Write-Host "FILE=$p SIZE=$($item.Length) MTIME_UTC=$($item.LastWriteTimeUtc.ToString('o')) SHA256=$hash"
              }
            } else { Write-Host "MISSING=$p" }
          }

          Write-Host 'PROCESS_ENUMERATION_BEGIN'
          $procs = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -match '^(node|powershell|pwsh|cmd|wscript|cscript)(\.exe)?$'
          })
          Write-Host "PROCESS_COUNT=$($procs.Count)"
          foreach ($p in $procs) {
            $owner = Invoke-CimMethod -InputObject $p -MethodName GetOwner -ErrorAction SilentlyContinue
            $ownerName = if ($owner.ReturnValue -eq 0) { "$($owner.Domain)\$($owner.User)" } else { 'unavailable' }
            $cmd = [string]$p.CommandLine
            $cmd = $cmd -replace '(?i)(authorization|bearer|device-token|token|secret|password)(=|:|\s+)\S+','$1$2[redacted]'
            Write-Host "PROC PID=$($p.ProcessId) NAME=$($p.Name) SESSION=$($p.SessionId) OWNER=$ownerName CMD=$cmd"
          }
          Write-Host 'PROCESS_ENUMERATION_END'

          $mutexName = 'Global\ARIA-Windows-Agent-Watchdog-v1'
          try {
            $mutex = [System.Threading.Mutex]::OpenExisting($mutexName)
            $acquired = $false
            try { $acquired = $mutex.WaitOne(0) } catch [System.Threading.AbandonedMutexException] { $acquired = $true }
            Write-Host "WATCHDOG_MUTEX_EXISTS=True"
            Write-Host "WATCHDOG_MUTEX_ACQUIRED_BY_PROBE=$acquired"
            if ($acquired) { $mutex.ReleaseMutex() }
            $mutex.Dispose()
          } catch {
            Write-Host "WATCHDOG_MUTEX_EXISTS=False"
            Write-Host "WATCHDOG_MUTEX_ERROR=$($_.Exception.GetType().Name)"
          }

          try {
            $rootItems = @(Get-ChildItem -LiteralPath $runtime -Force -ErrorAction Stop)
            Write-Host "RUNTIME_ROOT_ENTRIES=$($rootItems.Count)"
            foreach ($item in $rootItems) { Write-Host "RUNTIME_ENTRY=$($item.Name) TYPE=$([string]$item.GetType().Name)" }
          } catch { Write-Host "RUNTIME_LIST_ERROR=$($_.Exception.Message)" }

          if (Test-Path -LiteralPath (Join-Path $logDir 'watchdog.log')) {
            Write-Host 'WATCHDOG_LOG_LAST_12_BEGIN'
            Get-Content -LiteralPath (Join-Path $logDir 'watchdog.log') -Tail 12
            Write-Host 'WATCHDOG_LOG_LAST_12_END'
          }
          Write-Host 'A6_PROCESS_DISCOVERY=PASS'
