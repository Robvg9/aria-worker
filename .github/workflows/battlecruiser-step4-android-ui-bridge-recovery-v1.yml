name: BattleCruiser Step 4 Android UI Bridge Recovery V1 (Read Only)
on:
  push:
    branches:
      - aria/bc-step4-android-e2e-20261021
    paths:
      - .github/workflows/battlecruiser-step4-android-ui-bridge-recovery-v1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-step4-android-ui-bridge-recovery-v1
  cancel-in-progress: false
jobs:
  android-ui-bridge-recovery:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: Recover native Android UI bridge via a single observe request
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.request, urllib.error
          project=os.environ.get('SUPABASE_PROJECT_REF','').strip()
          secret=os.environ.get('ARIA_RUNTIME_SHARED_SECRET','')
          if not project or not secret: raise SystemExit('BLOCKED: production secrets unavailable')
          base=f'https://{project}.supabase.co/functions/v1'
          headers={'Authorization':'Bearer '+secret,'content-type':'application/json','cache-control':'no-store'}
          mission_id=f"mission_bc_step4_android_ui_bridge_recovery_v1_{os.environ['RUN_ID']}_{os.environ['RUN_ATTEMPT']}"
          device='android-termux-a1ebcfc7-9287-4603-a0f9-c519d12fd092'
          marker='BC_STEP4_ANDROID_UI_BRIDGE_RECOVERY_V1'
          command=r"""node <<'NODE'
          const {executeAndroidAccessibilityJob,probeLocalIpcHealth}=require('./computer-use/android-accessibility-v1.js');
          const marker='BC_STEP4_ANDROID_UI_BRIDGE_RECOVERY_V1';
          const command={target_package:'com.android.chrome',allow_any_app:false,allowed_hosts:['battlecruiser.robvg9.workers.dev'],operation:'observe'};
          const clean=s=>typeof s==='string'?s.replace(/\s+/g,' ').trim().slice(0,100):'';
          function scan(root){const out=[],seen=new Set();const walk=(n,d)=>{if(!n||typeof n!=='object'||Array.isArray(n)||seen.has(n)||d>24||out.length>=500)return;seen.add(n);out.push({name:clean(n.name),label:clean(n.label),text:clean(n.text),visible:n.visible!==false,clickable:!!n.clickable});(n.children||[]).forEach(c=>walk(c,d+1));};walk(root,0);return out;}
          (async()=>{
            const r=await executeAndroidAccessibilityJob({command:JSON.stringify(command),timeoutMs:12000});
            const p=r&&r.payload||{},root=p.root||(p.ui&&p.ui.root)||null,ns=root?scan(root):[];
            let h=null;try{h=await probeLocalIpcHealth({timeoutMs:2500});}catch(e){h={ok:false,reason:String(e&&e.message||e)};}
            const hp=h&&h.payload||{};
            const result={
              marker,
              ok:r&&r.status==='succeeded'&&!!root,
              observe_status:r&&r.status||null,
              observe_reason:clean(r&&r.reason||r&&r.stderr||''),
              recovery_attempted:r&&r.metadata&&r.metadata.recovery_attempted===true,
              attempt:r&&r.metadata&&r.metadata.attempt||null,
              nodeCount:ns.length,
              evidenceHash:p.evidence_hash||p.ui&&p.ui.evidence_hash||null,
              menuAvailable:ns.some(n=>n.visible&&n.clickable&&/abrir menu/i.test(n.name+' '+n.label+' '+n.text)),
              probeAfter:{ok:!!(h&&h.ok===true),reason:clean(h&&h.reason||''),version_name:hp.version_name||h&&h.metadata&&h.metadata.version_name||null,version_code:hp.version_code||h&&h.metadata&&h.metadata.version_code||null,build_id:hp.build_id||h&&h.metadata&&h.metadata.build_id||null},
              safety:{observeOnly:true,preferencesChanged:false,businessWrites:false,formsSubmitted:false}
            };
            console.log(JSON.stringify(result));
            if(!result.ok)process.exitCode=1;
          })().catch(e=>{console.log(JSON.stringify({marker,ok:false,error:String(e&&e.message||e).slice(0,160)}));process.exitCode=1;});
          NODE"""
          metadata={'goal_source':'chat','source_application':'ChatGPT','project_name':'BattleCruiser','source':'battlecruiser_step4_android_ui_bridge_recovery_v1','verification_marker':marker,'device_id':device,'requested_device_id':device,'operation':'shell.execute','executor_type':'device','requested_capability':'shell.execute','command':command,'risk':'READ','timeout_ms':12000,'target_package':'com.android.chrome','allowed_hosts':['battlecruiser.robvg9.workers.dev'],'read_only':True,'business_data_mutated':False,'explicit_device_intent':True,'human_gate_required':False}
          def post(fn,payload,timeout=75):
              req=urllib.request.Request(base+'/'+fn,data=json.dumps(payload).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read().decode())
                  except:return e.code,{}
          code,body=post('aria-direct-v1',{'goal':'Ejecuta shell.execute en el Android explícito para una única observación de la interfaz mediante executeAndroidAccessibilityJob. Si el IPC está caído, usa únicamente la recuperación automática integrada que reinicia MainActivity y reintenta observe. Devuelve hash, conteo de nodos, presencia de Abrir menú y resultado del build probe. No cambies preferencias ni datos. Marcador BC_STEP4_ANDROID_UI_BRIDGE_RECOVERY_V1.','mission_id':mission_id,'metadata':metadata})
          print('DISPATCH_HTTP='+str(code));print('MISSION_ID='+mission_id);print('DISPATCH_STATUS='+str(body.get('dispatch',{}).get('status','unknown')))
          if code>=300 or body.get('ok') is not True:print('DISPATCH_ERROR='+json.dumps(body,ensure_ascii=False)[:1200]);raise SystemExit(2)
          terminal={'succeeded','failed','blocked','rejected','cancelled','human_required','paused'}
          last={}
          for i in range(1,41):
              c,last=post('aria-mission-runner-v22',{'mission_id':mission_id})
              s=str(last.get('status','unknown'));print('POLL='+json.dumps({'n':i,'http':c,'status':s,'error':last.get('error'),'next_action':last.get('next_action')}))
              if s in terminal or c in (401,403,404):break
              time.sleep(2)
          s=str(last.get('status','unknown'));print('FINAL_STATUS='+s);print('FINAL='+json.dumps({k:last.get(k) for k in ('ok','status','mission_id','error','next_action','executor_types','results') if k in last},ensure_ascii=False)[:3500])
          if s!='succeeded':raise SystemExit(1)
          PY
