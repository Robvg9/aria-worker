name: ARIA Windows Emergency Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, 'ARIA-REPAIR-') && github.event.issue.user.login == 'Robvg9' && contains(github.event.issue.labels.*.name, 'aria-approved-repair')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
env:
  GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Safe cleanup C and move Ollama models
        run: |
          $ErrorActionPreference = 'Continue'
          $d = 'D:\ARIA-Windows-Agent\Maintenance'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          $before = (Get-PSDrive C).Free
          Write-Host "C_BEFORE_GB=$([math]::Round($before/1GB,2))"
          $paths = @(
            "$env:TEMP\*",
            "$env:LOCALAPPDATA\Temp\*",
            "$env:WINDIR\Temp\*",
            "$env:LOCALAPPDATA\Microsoft\Windows\INetCache\*",
            "$env:LOCALAPPDATA\CrashDumps\*",
            "$env:LOCALAPPDATA\D3DSCache\*",
            "C:\Windows\SoftwareDistribution\Download\*",
            "C:\ProgramData\Microsoft\Windows\WER\ReportQueue\*",
            "C:\ProgramData\Microsoft\Windows\WER\ReportArchive\*"
          )
          foreach ($p in $paths) { try { Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue } catch {} }
          if (Get-Command Delete-DeliveryOptimizationCache -ErrorAction SilentlyContinue) { try { Delete-DeliveryOptimizationCache -Force -ErrorAction SilentlyContinue } catch {} }
          if (Get-Command Clear-RecycleBin -ErrorAction SilentlyContinue) { try { Clear-RecycleBin -Force -ErrorAction SilentlyContinue } catch {} }
          if (Get-Command npm.cmd -ErrorAction SilentlyContinue) { try { npm.cmd cache clean --force | Out-Host } catch {} }
          if (Get-Command pip.exe -ErrorAction SilentlyContinue) { try { pip.exe cache purge | Out-Host } catch {} }
          $ollama = Join-Path $env:USERPROFILE '.ollama\models'
          $ollamaD = Join-Path $d 'ollama-models'
          if (Test-Path $ollama -PathType Container) {
            try {
              $it = Get-Item $ollama -Force
              if (-not ($it.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                New-Item -ItemType Directory -Force -Path $ollamaD | Out-Null
                Get-Process -Name 'ollama' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
                Move-Item -LiteralPath $ollama -Destination $ollamaD -Force
                New-Item -ItemType Junction -Path $ollama -Target $ollamaD | Out-Null
                Write-Host "OLLAMA_MODELS_RELOCATED=True TARGET=$ollamaD"
              } else { Write-Host 'OLLAMA_MODELS_ALREADY_RELOCATED=True' }
            } catch { Write-Warning "OLLAMA_RELOCATE_FAILED=$($_.Exception.Message)" }
          }
          if (Get-Command dism.exe -ErrorAction SilentlyContinue) { try { dism.exe /Online /Cleanup-Image /StartComponentCleanup /Quiet | Out-Host } catch {} }
          $after = (Get-PSDrive C).Free
          Write-Host "C_AFTER_GB=$([math]::Round($after/1GB,2))"
          Write-Host "C_FREED_GB=$([math]::Round(($after-$before)/1GB,2))"

      - name: Enforce single watchdog and single Agent
        run: |
          $ErrorActionPreference = 'Continue'
          $wp = 'D:\ARIA-Windows-Agent\Logs\watchdog.pid'
          $ap = 'D:\ARIA-Windows-Agent\Logs\agent.pid'
          $keepW = 0
          $keepA = 0
          if (Test-Path $wp) { [void][int]::TryParse((Get-Content -Raw $wp).Trim(), [ref]$keepW) }
          if (Test-Path $ap) { [void][int]::TryParse((Get-Content -Raw $ap).Trim(), [ref]$keepA) }
          $watchdogs = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^powershell(\.exe)?$' -and [string]$_.CommandLine -match '(?i)run-agent\.ps1' })
          $agents = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^node(\.exe)?$' -and [string]$_.CommandLine -match '(?i)aria-agent\.js' })
          Write-Host "WATCHDOGS_BEFORE=$($watchdogs.Count) AGENTS_BEFORE=$($agents.Count) KEEP_W=$keepW KEEP_A=$keepA"
          foreach ($p in $watchdogs) {
            if ([int]$p.ProcessId -ne $keepW) {
              Write-Host "STOP_WATCHDOG=$($p.ProcessId)"
              Stop-Process -Id ([int]$p.ProcessId) -Force -ErrorAction SilentlyContinue
            }
          }
          foreach ($p in $agents) {
            if ([int]$p.ProcessId -ne $keepA) {
              Write-Host "STOP_AGENT=$($p.ProcessId)"
              Stop-Process -Id ([int]$p.ProcessId) -Force -ErrorAction SilentlyContinue
            }
          }
          Start-Sleep -Seconds 2
          $lock = 'D:\ARIA-Windows-Agent\Runtime\meditation\controller.lock'
          if (Test-Path $lock) {
            $lp = 0
            try { $j = Get-Content -Raw $lock | ConvertFrom-Json; $lp = [int]$j.pid } catch {}
            $q = $null
            if ($lp -gt 0) { $q = Get-CimInstance Win32_Process -Filter "ProcessId = $lp" -ErrorAction SilentlyContinue }
            if ($null -eq $q -or $lp -eq $keepA) {
              Remove-Item -LiteralPath $lock -Force -ErrorAction SilentlyContinue
              Write-Host "LOCK_CLEARED_PID=$lp"
            }
          }

      - name: Ensure Meditation endpoint and activate
        run: |
          $ErrorActionPreference = 'Stop'
          $u = 'http://127.0.0.1:45873/status'
          $start = 'http://127.0.0.1:45873/start'
          $s = $null
          try { $s = Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5 } catch {}
          if ($null -eq $s) {
            $agent = 'D:\ARIA-Windows-Agent\Runtime\windows\run-agent.ps1'
            if (-not (Test-Path $agent)) { throw 'run-agent.ps1 missing' }
            Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',$agent -WindowStyle Hidden
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try { $s = Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 2; if ($null -ne $s) { break } } catch {}
            }
          }
          if ($null -eq $s) { throw 'Meditation endpoint offline' }
          if ($s.mode -ne 'active') {
            $r = Invoke-RestMethod -Method Post -Uri $start -TimeoutSec 10
            Start-Sleep -Seconds 3
            $s = Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5
            Write-Host ("ACTIVATE status={0} mode={1} session={2} tick={3}" -f $r.status,$s.mode,$s.session_id,$s.tick_count)
          } else {
            Write-Host "ALREADY_ACTIVE session=$($s.session_id)"
          }
          if ($s.mode -ne 'active') { throw "Meditation activation failed mode=$($s.mode)" }

      - name: Verify heartbeat and persist proof
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          $u = 'http://127.0.0.1:45873/status'
          $s = $null
          try { $s = Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5 } catch {}
          $ticks = 0
          $mode = 'unknown'
          $session = $null
          if ($null -ne $s) { $ticks = [int]$s.tick_count; $mode = [string]$s.mode; $session = $s.session_id }
          if ($mode -eq 'active') {
            $t0 = $ticks
            Start-Sleep -Seconds 12
            try { $f = Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5; Write-Host "HEARTBEAT initial=$t0 final=$($f.tick_count) mode=$($f.mode)" } catch { $f = $null }
          } else { $f = $null }
          $dir = Join-Path $env:GITHUB_WORKSPACE 'reports'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          [ordered]@{ timestamp=(Get-Date -Format o); computer=$env:COMPUTERNAME; c_free_gb=[math]::Round((Get-PSDrive C).Free/1GB,2); mode=$mode; session=$session; ticks=$ticks; heartbeat_mode=if($f){$f.mode}else{$null}; heartbeat_ticks=if($f){$f.tick_count}else{$null}; outcome=if($mode -eq 'active' -and $f -and $f.mode -eq 'active'){'PASS'}else{'FAIL'} } | ConvertTo-Json -Depth 8 | Set-Content -Path (Join-Path $dir 'aria-windows-emergency-repair-status.json') -Encoding UTF8
          Get-Content -Raw (Join-Path $dir 'aria-windows-emergency-repair-status.json')
          if (-not ($mode -eq 'active' -and $f -and $f.mode -eq 'active')) { throw 'Emergency repair proof failed' }
          git config user.name 'aria-emergency-repair'
          git config user.email 'aria-emergency-repair@users.noreply.github.com'
          git add reports/aria-windows-emergency-repair-status.json
          git commit -m 'ci: persist emergency Windows repair proof'
          $branch = "aria/emergency-repair/$($env:GITHUB_EVENT_ISSUE_NUMBER)"
          git checkout -B $branch
          git push -u origin $branch
          gh pr create --draft --base main --head $branch --title "ARIA emergency repair proof #$($env:GITHUB_EVENT_ISSUE_NUMBER)" --body "Emergency repair proof generated by an explicitly approved ARIA-REPAIR issue. Human review is required before merge."
