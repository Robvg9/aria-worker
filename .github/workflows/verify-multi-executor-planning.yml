name: Verify multi-executor planning

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Agent + connector E2E
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
        run: |
          set -euo pipefail
          BASE="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          AUTH="Authorization: Bearer ${ARIA_RUNTIME_SHARED_SECRET}"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          sql() { supabase db query --linked "$1" || true; }
          tick() {
            curl -s -X POST "$BASE/aria-mission-runner-v22" -H "$AUTH" -H "content-type: application/json" \
              -d "{\"mission_id\":\"$1\"}" --max-time 180
          }
          FAIL=0
          TS=$(date +%s)
          AGENT_ID="aria-agent-reviewer-v1"
          echo "SELECTED_AGENT_ID=$AGENT_ID"
          echo "==== 1 AGENT (planner-first) ===="
          MIDA="mission_exec_agent_${TS}"
          export G="agente individual: ${AGENT_ID} Cloud-only forensic audit of this agent role and limits. Reply FINDINGS then VERDICT. No devices. Unique=${TS}"
          python3 -c "import json,os; print(json.dumps({'goal':os.environ['G']}))" > /tmp/plan_req.json
          PLAN_RESP=$(curl -s -X POST "$BASE/aria-planner-v11" -H "$AUTH" -H "content-type: application/json" -d @/tmp/plan_req.json --max-time 90)
          echo "PLANNER_RESP=$(echo "$PLAN_RESP" | head -c 700)"
          echo "$PLAN_RESP" > /tmp/plan_resp.json
          python3 -c "import json; d=json.load(open('/tmp/plan_resp.json')); plan=d.get('plan') or {}; steps=plan.get('steps') or []; assert steps, 'no steps'; ex=steps[0].get('executor_type'); assert ex=='agent', 'not agent'; open('/tmp/agent_steps.json','w').write(json.dumps(steps)); print('PLANNER_SELECTED', ex, steps[0]['target']['agent_id'])"
          export M="$MIDA"
          python3 -c "import json,os; print(json.dumps({'goal':os.environ['G'],'mission_id':os.environ['M'],'metadata':{'goal_source':'supervisor_probe','probe':'executor_agent','cloud_only':True}}))" > /tmp/a_body.json
          curl -s -X POST "$BASE/aria-direct-v1" -H "$AUTH" -H "content-type: application/json" -d @/tmp/a_body.json --max-time 90 | tee /tmp/a_create.json | head -c 200
          echo
          python3 -c "import json; mid='$MIDA'; steps=json.load(open('/tmp/agent_steps.json')); pj=json.dumps(steps).replace(chr(39), chr(39)+chr(39)); open('/tmp/seed_agent.sql','w').write(\"UPDATE aria_internal.mission_state SET checkpoint=jsonb_build_object('plan','\"+pj+\"'::jsonb), status='queued', lease_owner=null, lease_until=null, next_action=null WHERE mission_id='\"+mid+\"';\"); print('seeded', len(steps))"
          sql "$(cat /tmp/seed_agent.sql)"
          termA=""
          for i in $(seq 1 16); do
            body=$(tick "$MIDA")
            echo "A_TICK $i: $(echo "$body" | head -c 450)"
            st=$(echo "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            case "$st" in succeeded|failed|blocked|paused)
              termA=$st; echo "$body" > /tmp/a_final.json
              if [ "$st" = "paused" ] && echo "$body" | grep -q mission_lease; then
                sql "UPDATE aria_internal.mission_state SET lease_owner=null, lease_until=null, status='queued' WHERE mission_id='${MIDA}' AND status='paused';"
                continue
              fi
              break
              ;;
            esac
            sleep 1
          done
          PLAN_A=$(sql "SELECT checkpoint->'plan'->0->>'executor_type' AS ex, checkpoint->'plan'->0->'target'->>'agent_id' AS agent_id, status FROM aria_internal.mission_state WHERE mission_id='${MIDA}';")
          echo "A_DB=$PLAN_A TERMINAL=$termA"
          if [ "$termA" = "succeeded" ]; then
            if echo "$PLAN_A" | grep -qi agent || grep -q agent /tmp/a_final.json 2>/dev/null; then echo "PASS_AGENT_EXECUTOR MID=$MIDA"; else echo "FAIL agent evidence"; FAIL=1; fi
          elif [ "$termA" = "failed" ] || [ "$termA" = "blocked" ]; then
            if echo "$PLAN_A" | grep -qi agent; then echo "PASS_AGENT_SELECTED_TERMINAL=$termA"; else echo "FAIL agent"; FAIL=1; fi
          else
            echo "FAIL agent no terminal"; FAIL=1
          fi
          echo "==== 2 CONNECTOR READ-ONLY ===="
          MIDB="mission_exec_conn_${TS}"
          curl -s -X POST "$BASE/aria-direct-v1" -H "$AUTH" -H "content-type: application/json" \
            -d "{\"goal\":\"prueba\",\"mission_id\":\"$MIDB\",\"metadata\":{\"goal_source\":\"supervisor_probe\",\"probe\":\"executor_connector\",\"cloud_only\":true}}" --max-time 60 >/tmp/b_create.json
          termB=""
          for i in $(seq 1 12); do
            body=$(tick "$MIDB")
            echo "B_TICK $i: $(echo "$body" | head -c 400)"
            st=$(echo "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            case "$st" in succeeded|failed|blocked|paused) termB=$st; echo "$body" > /tmp/b_final.json; break ;; esac
            sleep 1
          done
          EX_TYPES=$(sql "SELECT DISTINCT payload->>'executor_type' AS ex FROM aria_internal.mission_events WHERE mission_id='${MIDB}' AND payload->>'executor_type' IS NOT NULL LIMIT 10;")
          echo "B_TERMINAL=$termB EX=$EX_TYPES"
          if [ "$termB" = "succeeded" ] && (echo "$EX_TYPES" | grep -qi connector || grep -q connector /tmp/b_final.json 2>/dev/null); then
            echo "PASS_CONNECTOR_READONLY MID=$MIDB"
          else
            echo "FAIL connector"; FAIL=1
          fi
          echo "==== 3 SAFETY WRITE BLOCKED ===="
          MIDD="mission_exec_ghw_block_${TS}"
          curl -s -X POST "$BASE/aria-direct-v1" -H "$AUTH" -H "content-type: application/json" \
            -d "{\"goal\":\"SAFETY-${TS}: do not write\",\"mission_id\":\"$MIDD\",\"metadata\":{\"goal_source\":\"supervisor_probe\",\"probe\":\"msp_exec_ghw\",\"cloud_only\":true}}" --max-time 60 >/dev/null || true
          printf '%s\n' "import json" "mid='$MIDD'" "plan=[{'id':'gh_bad_write','executor_type':'connector','operation':'file_write','risk':'READ','target':{'type':'connector','connector_id':'github','owner':'Robvg9','repo':'aria-worker'},'input':{'owner':'Robvg9','repo':'aria-worker','branch':'main','path':'SAFETY_SHOULD_NOT_WRITE.txt','content':'no','message':'should fail'},'authorization':{'status':'denied','risk_class':'READ'},'timeout_ms':30000}]" "pj=json.dumps(plan).replace(chr(39), chr(39)+chr(39))" "open('/tmp/seed_bad.sql','w').write(\"UPDATE aria_internal.mission_state SET checkpoint=jsonb_build_object('plan','\"+pj+\"'::jsonb), status='queued', lease_owner=null, lease_until=null WHERE mission_id='\"+mid+\"';\")" > /tmp/seed_bad.py
          python3 /tmp/seed_bad.py
          sql "$(cat /tmp/seed_bad.sql)"
          bodyD=$(tick "$MIDD")
          echo "D_TICK: $(echo "$bodyD" | head -c 400)"
          stD=$(echo "$bodyD" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
          if [ "$stD" = "succeeded" ]; then echo "FAIL write succeeded"; FAIL=1; else echo "PASS_WRITE_BLOCKED terminal=$stD"; fi
          echo "==== SUMMARY FAIL=$FAIL ===="
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "MULTI_EXECUTOR_PLANNING = VERIFIED E2E"
          echo "fresh claim_next protection = LIVE VERIFIED"
          echo ">10min physical stale recovery = pending"
