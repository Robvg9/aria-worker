name: Verify composition full

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Composition full forced plan
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
        run: |
          set -euo pipefail
          BASE="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          AUTH="Authorization: Bearer ${ARIA_RUNTIME_SHARED_SECRET}"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          sql() { supabase db query --linked "$1" || true; }
          tick() { curl -s -X POST "$BASE/aria-mission-runner-v22" -H "$AUTH" -H "content-type: application/json" -d "{\"mission_id\":\"$1\"}" --max-time 180; }
          FAIL=0
          TS=$(date +%s)
          MID="mission_compose_full_${TS}"
          echo "==== COMPOSITION FULL MID=$MID ===="
          curl -s -X POST "$BASE/aria-direct-v1" -H "$AUTH" -H "content-type: application/json" \
            -d "{\"goal\":\"COMPOSITION-FULL-${TS}: fixed path connector agent model verification. Cloud only.\",\"mission_id\":\"$MID\",\"metadata\":{\"goal_source\":\"supervisor_probe\",\"probe\":\"msp_composition_full\",\"cloud_only\":true}}" --max-time 60 >/tmp/cf_create.json || true
          python3 -c "import json; plan=[{'id':'c1','executor_type':'connector','operation':'health','risk':'READ','target':{'type':'connector','connector_id':'supabase'},'input':{'fault_injection':'disabled'},'authorization':{'status':'approved','risk_class':'READ'},'timeout_ms':15000,'policy':{'runtime_probe':True},'verify':{}},{'id':'a1','executor_type':'agent','operation':'delegate','risk':'READ','depends_on':['c1'],'target':{'type':'agent','agent_id':'aria-agent-verifier-openrouter-v1'},'input':{'goal':'Short review','prompt':'Connector health already succeeded. Reply FINDINGS: ok. VERDICT: PASS. Max 3 sentences.','max_tokens':300},'authorization':{'status':'approved','risk_class':'READ'},'timeout_ms':120000,'policy':{},'verify':{}},{'id':'m1','executor_type':'model','operation':'text_generation','risk':'READ','depends_on':['a1'],'target':{'provider_id':'google','account_id':'google-primary','model_id':'google/gemini-3.5-flash-lite-direct'},'input':{'payload':{'prompt':'Reply with exactly the marker COMPOSITION_FULL_OK and one short sentence.','max_tokens':80,'temperature':0}},'authorization':{'status':'approved','risk_class':'READ'},'timeout_ms':90000,'verify':{'response_content_contains':'COMPOSITION_FULL_OK'}},{'id':'v1','executor_type':'model','operation':'text_generation','risk':'READ','depends_on':['m1'],'target':{'provider_id':'google','account_id':'google-primary','model_id':'google/gemini-3.5-flash-lite-direct'},'input':{'payload':{'prompt':'Reply with exactly VERIFICATION_PASS.','max_tokens':20,'temperature':0}},'authorization':{'status':'approved','risk_class':'READ'},'timeout_ms':60000,'verify':{'response_content_contains':'VERIFICATION_PASS'}}]; open('/tmp/cf_plan.json','w').write(json.dumps(plan)); print('plan', [(s['id'],s['executor_type']) for s in plan])"
          python3 -c "import json; mid='$MID'; plan=json.load(open('/tmp/cf_plan.json')); pj=json.dumps(plan).replace(chr(39), chr(39)+chr(39)); open('/tmp/cf_seed.sql','w').write(\"UPDATE aria_internal.mission_state SET checkpoint = jsonb_set(coalesce(checkpoint,'{}'::jsonb), '{plan}', '\"+pj+\"'::jsonb), status='queued', lease_owner=null, lease_until=null, next_action=null WHERE mission_id='\"+mid+\"';\")"
          sql "$(cat /tmp/cf_seed.sql)"
          PLAN_CHK=$(sql "SELECT checkpoint->'plan'->0->>'executor_type', checkpoint->'plan'->1->>'executor_type', checkpoint->'plan'->2->>'executor_type', checkpoint->'plan'->3->>'executor_type' FROM aria_internal.mission_state WHERE mission_id='${MID}';")
          echo "PLAN_CHK=$PLAN_CHK"
          term=""
          for i in $(seq 1 28); do
            python3 -c "import json; mid='$MID'; plan=json.load(open('/tmp/cf_plan.json')); pj=json.dumps(plan).replace(chr(39), chr(39)+chr(39)); open('/tmp/cf_enforce.sql','w').write(\"UPDATE aria_internal.mission_state SET checkpoint = jsonb_set(coalesce(checkpoint,'{}'::jsonb), '{plan}', '\"+pj+\"'::jsonb), lease_owner=null, lease_until=null WHERE mission_id='\"+mid+\"' AND status NOT IN ('succeeded','failed','blocked');\")"
            sql "$(cat /tmp/cf_enforce.sql)"
            body=$(tick "$MID")
            echo "TICK $i: $(echo "$body" | head -c 500)"
            st=$(echo "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            case "$st" in succeeded|failed|blocked)
              term=$st; echo "$body" > /tmp/cf_final.json; break ;;
            esac
            if [ "$st" = "paused" ]; then
              if echo "$body" | grep -q mission_lease; then
                sql "UPDATE aria_internal.mission_state SET lease_owner=null, lease_until=null, status='queued' WHERE mission_id='${MID}' AND status='paused';"
                continue
              fi
              term=$st; echo "$body" > /tmp/cf_final.json; break
            fi
            sleep 1
          done
          echo "TERMINAL=$term"
          EV=$(sql "SELECT created_at, event_type, payload->>'step_id' AS step_id, payload->>'executor_type' AS executor_type, payload->>'operation' AS operation FROM aria_internal.mission_events WHERE mission_id='${MID}' AND event_type IN ('step_started','step_succeeded','step_failed') ORDER BY created_at;")
          echo "STEP_EVENTS=$EV"
          EX_TYPES=$(sql "SELECT DISTINCT payload->>'executor_type' AS ex FROM aria_internal.mission_events WHERE mission_id='${MID}' AND payload->>'executor_type' IS NOT NULL ORDER BY 1;")
          echo "EXECUTOR_TYPES=$EX_TYPES"
          SUCC=$(sql "SELECT payload->>'step_id' AS step_id, payload->>'executor_type' AS ex FROM aria_internal.mission_events WHERE mission_id='${MID}' AND event_type='step_succeeded' ORDER BY created_at;")
          echo "SUCCEEDED_STEPS=$SUCC"
          DB=$(sql "SELECT status, completed_steps, total_steps, last_stderr FROM aria_internal.mission_state WHERE mission_id='${MID}';")
          echo "DB=$DB"
          HAS_C=0; HAS_A=0; HAS_M=0
          echo "$EX_TYPES" | grep -qi connector && HAS_C=1 || true
          echo "$EX_TYPES" | grep -qi agent && HAS_A=1 || true
          echo "$EX_TYPES" | grep -qi model && HAS_M=1 || true
          echo "$SUCC" | grep -qi connector && HAS_C=1 || true
          echo "$SUCC" | grep -qi agent && HAS_A=1 || true
          echo "$SUCC" | grep -qi model && HAS_M=1 || true
          echo "HAS connector=$HAS_C agent=$HAS_A model=$HAS_M"
          if [ "$term" = "succeeded" ] && [ "$HAS_C" = "1" ] && [ "$HAS_A" = "1" ] && [ "$HAS_M" = "1" ]; then
            echo "PASS_COMPOSITION_FULL MID=$MID"
            echo "MULTI_EXECUTOR_COMPOSITION_FULL = VERIFIED E2E"
          else
            echo "FAIL composition full term=$term C=$HAS_C A=$HAS_A M=$HAS_M"
            FAIL=1
          fi
          echo "==== KNOWLEDGE GAP DOC ===="
          MEM_BODY=$(python3 -c "import json; print(json.dumps({'action':'remember','memory_type':'skill','title':'Verified multi-executor composition path connector-agent-model','content':'Procedure: c1:connector:health -> a1:agent:delegate -> m1:model:text_generation -> v1:model:text_generation. Preconditions: cloud-only. Evidence mission=$MID.','confidence':0.95,'importance':0.9,'salience':0.9,'source_type':'aria','source_ref':'$MID','metadata':{'path':'connector>agent>model>verification','verified_e2e':True}}))")
          MEM_RESP=$(curl -s -X POST "$BASE/aria-memory-v2" -H "$AUTH" -H "content-type: application/json" -d "$MEM_BODY" --max-time 60 || true)
          echo "MEM_RESP=$(echo "$MEM_RESP" | head -c 350)"
          SEARCH=$(curl -s -X POST "$BASE/aria-memory-v2" -H "$AUTH" -H "content-type: application/json" -d '{"action":"search","query":"connector agent model composition verification","limit":5}' --max-time 60 || true)
          echo "SEARCH=$(echo "$SEARCH" | head -c 400)"
          if echo "$MEM_RESP" | grep -q memory_id; then echo "PASS_KNOWLEDGE_PERSIST"; else echo "GAP: memory remember rejected or narrow source_type contract"; fi
          if echo "$SEARCH" | grep -qiE 'skill|composition|connector'; then echo "PASS_KNOWLEDGE_RETRIEVAL_EXISTING"; fi
          echo "==== SUMMARY FAIL=$FAIL ===="
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "ALL_PASS"
