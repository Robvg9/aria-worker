name: ARIA Windows Local Agent Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

jobs:
  preflight:
    name: Windows Agent / Ollama Preflight
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Verify runner Node environment
        run: |
          $ErrorActionPreference = 'Stop'
          $node = Get-Command node -ErrorAction Stop
          $version = node --version
          Write-Host "NODE_PATH=$($node.Source)"
          Write-Host "NODE_VERSION=$version"
          if ([version]($version.TrimStart('v')) -lt [version]'20.0.0') { throw 'Node 20+ required' }

      - name: Verify Ollama service
        run: |
          $ErrorActionPreference = 'Stop'
          $response = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/tags' -Method Get -TimeoutSec 10
          Write-Host 'OLLAMA=ONLINE'
          $model = $response.models | Where-Object { $_.name -eq 'qwen3:4b' }
          if (-not $model) { throw 'Required model qwen3:4b is not installed' }
          Write-Host 'OLLAMA_MODEL=qwen3:4b'

      - name: Verify qwen3 execution locally
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = @{
            model = 'qwen3:4b'
            prompt = 'Say OK.'
            stream = $false
            think = $false
            options = @{ temperature = 0; seed = 42; num_predict = 8 }
          } | ConvertTo-Json -Depth 10
          $result = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/generate' -Method Post -ContentType 'application/json' -Body $payload -TimeoutSec 180
          if ($null -eq $result) { throw 'Ollama returned no result' }
          $text = ([string]$result.response).Trim()
          if (-not $result.done) { throw 'Qwen generation did not finish' }
          if ([string]::IsNullOrWhiteSpace($text)) { throw 'Qwen returned an empty response' }
          Write-Host 'QWEN_EXECUTION=PASS'
          Write-Host "QWEN_RESPONSE=$text"
          Write-Host "QWEN_TOTAL_DURATION_NS=$($result.total_duration)"

      - name: Ensure ARIA agent runtime (no Task Scheduler API)
        run: |
          $ErrorActionPreference = 'Stop'
          # NetworkService cannot query interactive-user tasks (E_ACCESSDENIED).
          # Certify health exclusively via process table + public files under D:\ARIA-Windows-Agent.

          $RuntimeRoot = 'D:\ARIA-Windows-Agent'
          $RuntimeAgent = Join-Path $RuntimeRoot 'Runtime\windows\aria-agent.js'
          $RuntimeWatchdog = Join-Path $RuntimeRoot 'Runtime\windows\run-agent.ps1'
          $LogDir = Join-Path $RuntimeRoot 'Logs'
          $LogPath = Join-Path $LogDir 'watchdog.log'
          $PidPath = Join-Path $LogDir 'agent.pid'
          $StatusPath = Join-Path $LogDir 'status.json'
          $DataConfig = Join-Path $RuntimeRoot 'Data\config.json'

          if (-not (Test-Path $RuntimeRoot)) { throw "ARIA runtime root missing: $RuntimeRoot" }
          if (-not (Test-Path $RuntimeAgent)) { throw "ARIA runtime agent missing: $RuntimeAgent" }
          if (-not (Test-Path $RuntimeWatchdog)) { throw "ARIA watchdog missing: $RuntimeWatchdog" }
          if (-not (Test-Path $DataConfig)) { throw "ARIA config missing: $DataConfig" }

          function Find-AriaAgent {
            Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
              Where-Object {
                $_.CommandLine -like '*D:\ARIA-Windows-Agent\Runtime\windows\aria-agent.js*' -or
                $_.CommandLine -like '*D:\\ARIA-Windows-Agent\\Runtime\\windows\\aria-agent.js*'
              }
          }

          function Find-AriaWatchdog {
            Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" -ErrorAction SilentlyContinue |
              Where-Object {
                $_.CommandLine -like '*D:\ARIA-Windows-Agent\Runtime\windows\run-agent.ps1*' -or
                $_.CommandLine -like '*run-agent.ps1*'
              }
          }

          $agent = Find-AriaAgent
          $watchdog = Find-AriaWatchdog

          if (-not $agent) {
            Write-Host 'Agent process not found — waiting up to 30s for watchdog restart...'
            if ($watchdog) { Write-Host "WATCHDOG_HOST_PID=$($watchdog.ProcessId)" }
            for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2
              $agent = Find-AriaAgent
              if ($agent) { break }
            }
          }

          if (-not $agent) {
            Write-Host '--- public diagnostics ---'
            if (Test-Path $LogPath) {
              Write-Host 'watchdog.log (last 40):'
              Get-Content $LogPath -Tail 40 -ErrorAction SilentlyContinue
            } else { Write-Host "No log at $LogPath" }
            if (Test-Path $StatusPath) {
              Write-Host "status.json: $(Get-Content -Raw $StatusPath)"
            }
            if (Test-Path $PidPath) {
              Write-Host "agent.pid file: $(Get-Content -Raw $PidPath)"
            }
            $wd = Find-AriaWatchdog
            if (-not $wd) {
              throw 'ARIA agent process not running AND watchdog host not found. Start the task as ROBVG\robvg (interactive).'
            }
            throw 'ARIA agent process not running (watchdog host is alive but did not spawn agent in time). See Logs above.'
          }

          # Task is considered RUNNING when the official agent process is alive.
          # Task Scheduler ownership is verified locally by the interactive user; runner cannot query it.
          Write-Host 'ARIA_TASK=RUNNING'
          Write-Host 'AGENT_PROCESS=RUNNING'
          Write-Host "AGENT_PID=$($agent.ProcessId)"
          Write-Host "AGENT_CMDLINE=$($agent.CommandLine)"
          Write-Host 'RUNTIME_ROOT=D:\ARIA-Windows-Agent'
          if ($watchdog) { Write-Host "WATCHDOG_HOST_PID=$($watchdog.ProcessId)" }
          if (Test-Path $StatusPath) {
            Write-Host "STATUS_JSON=$(Get-Content -Raw $StatusPath)"
          }
          if (Test-Path $LogPath) { Write-Host 'WATCHDOG_LOG=AVAILABLE' }

      - name: Watchdog recovery proof (kill → restart)
        run: |
          $ErrorActionPreference = 'Stop'
          $RuntimeRoot = 'D:\ARIA-Windows-Agent'
          $LogDir = Join-Path $RuntimeRoot 'Logs'
          $LogPath = Join-Path $LogDir 'watchdog.log'
          $PidPath = Join-Path $LogDir 'agent.pid'
          $StatusPath = Join-Path $LogDir 'status.json'

          function Find-AriaAgent {
            Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
              Where-Object {
                $_.CommandLine -like '*D:\ARIA-Windows-Agent\Runtime\windows\aria-agent.js*' -or
                $_.CommandLine -like '*D:\\ARIA-Windows-Agent\\Runtime\\windows\\aria-agent.js*'
              }
          }

          $before = @(Find-AriaAgent)
          if ($before.Count -eq 0) { throw 'Agent not running before kill test' }

          $oldPid = $null
          if (Test-Path $PidPath) {
            $filePid = 0
            [void][int]::TryParse((Get-Content -Raw $PidPath).Trim(), [ref]$filePid)
            if ($filePid -gt 0 -and ($before | Where-Object { $_.ProcessId -eq $filePid })) {
              $oldPid = $filePid
            }
          }
          if (-not $oldPid) { $oldPid = $before[0].ProcessId }

          $beforeCmd = ($before | Where-Object { $_.ProcessId -eq $oldPid } | Select-Object -First 1).CommandLine
          if ($beforeCmd -notlike '*D:\ARIA-Windows-Agent\Runtime\windows\aria-agent.js*' -and
              $beforeCmd -notlike '*ARIA-Windows-Agent*aria-agent.js*') {
            throw "Refusing to kill non-official agent: $beforeCmd"
          }

          Write-Host "KILL_TARGET_PID=$oldPid"
          Write-Host "KILL_TARGET_CMDLINE=$beforeCmd"
          Stop-Process -Id $oldPid -Force -ErrorAction Stop
          Write-Host 'AGENT_KILLED=True'

          $newAgent = $null
          for ($i = 0; $i -lt 25; $i++) {
            Start-Sleep -Seconds 2
            $candidates = @(Find-AriaAgent | Where-Object { $_.ProcessId -ne $oldPid })
            if ($candidates.Count -gt 0) {
              $newAgent = $candidates[0]
              break
            }
          }

          if (-not $newAgent) {
            Write-Host '--- diagnostics after kill ---'
            if (Test-Path $LogPath) {
              Write-Host 'watchdog.log (last 40):'
              Get-Content $LogPath -Tail 40 -ErrorAction SilentlyContinue
            }
            if (Test-Path $StatusPath) {
              Write-Host "status.json: $(Get-Content -Raw $StatusPath)"
            }
            throw 'Watchdog did not restart aria-agent.js after kill'
          }

          $newCmd = $newAgent.CommandLine
          if ($newCmd -notlike '*D:\ARIA-Windows-Agent\Runtime\windows\aria-agent.js*' -and
              $newCmd -notlike '*ARIA-Windows-Agent*Runtime*windows*aria-agent.js*') {
            throw "Restarted process is not the official runtime agent: $newCmd"
          }

          Write-Host 'WATCHDOG_RESTART=PASS'
          Write-Host "AGENT_NEW_PID=$($newAgent.ProcessId)"
          Write-Host "AGENT_NEW_CMDLINE=$newCmd"
          if (Test-Path $StatusPath) {
            Write-Host "STATUS_JSON=$(Get-Content -Raw $StatusPath)"
          }

      - name: Verify ARIA Gateway heartbeat
        env:
          ARIA_DEVICE_TOKEN: ${{ secrets.ARIA_DEVICE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $deviceId = 'windows-fe722cc6681e4f9c9cc35f5ebbb0a089'
          $url = 'https://icuqsstxfdbvjytkhlog.supabase.co/functions/v1/aria-device-gateway'
          if ([string]::IsNullOrWhiteSpace($env:ARIA_DEVICE_TOKEN)) { throw 'ARIA_DEVICE_TOKEN repository secret is missing' }
          $headers = @{ Authorization = "Bearer $env:ARIA_DEVICE_TOKEN"; 'x-aria-device-id' = $deviceId; 'content-type' = 'application/json' }
          $body = @{ device_id = $deviceId; agent_type = 'windows-local'; capabilities = @('ollama.qwen3') } | ConvertTo-Json
          try { $heartbeat = Invoke-RestMethod -Uri "$url/v1/devices/heartbeat" -Headers $headers -Method Post -Body $body -TimeoutSec 15 }
          catch { throw "Gateway heartbeat probe failed: $($_.Exception.Message)" }
          if ($null -eq $heartbeat) { throw 'Gateway heartbeat returned an empty response' }
          Write-Host 'GATEWAY_HEARTBEAT=PASS'
          Write-Host "DEVICE_ID=$deviceId"
          Write-Host 'CAPABILITY=ollama.qwen3'
