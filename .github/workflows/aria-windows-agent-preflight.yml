name: ARIA Windows Local Agent Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agents/windows/**'
      - 'computer-use/windows-*'
      - '.github/workflows/aria-windows-agent-preflight.yml'

permissions:
  contents: read

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

jobs:
  preflight:
    name: Windows Agent / Ollama Preflight
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Sync official runtime scripts to D drive
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'agents\windows'
          $target = 'D:\ARIA-Windows-Agent\Runtime\windows'
          $logDir = 'D:\ARIA-Windows-Agent\Logs'
          if (-not (Test-Path (Join-Path $source 'run-agent.ps1'))) { throw 'source run-agent.ps1 missing' }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $target -Force
          $synced = Get-Content -Raw (Join-Path $target 'run-agent.ps1')
          if ($synced -match 'Start-Process[\s\S]{0,200}-NoNewWindow') {
            throw 'Synced run-agent.ps1 still uses -NoNewWindow on Start-Process'
          }
          if ($synced -notmatch 'kill-request') {
            throw 'Synced run-agent.ps1 missing kill-request support'
          }
          Write-Host 'RUNTIME_SYNC=PASS'
          Write-Host 'NOTE: If watchdog still logs NoNewWindow, ROBVG\robvg must End+Run the task once to reload the script into memory.'

      - name: Repair Windows device token store from CI secret
        env:
          ARIA_DEVICE_TOKEN: ${{ secrets.ARIA_DEVICE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:ARIA_DEVICE_TOKEN) -or $env:ARIA_DEVICE_TOKEN.Length -lt 32) {
            throw 'ARIA_DEVICE_TOKEN repository secret is missing or invalid'
          }

          Add-Type -AssemblyName System.Security
          $runtimeRoot = 'D:\ARIA-Windows-Agent'
          $dataDir = Join-Path $runtimeRoot 'Data'
          $tokenPath = Join-Path $dataDir 'device-token.dpapi'

          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null

          $interactiveUser = [string](Get-CimInstance Win32_ComputerSystem -ErrorAction SilentlyContinue).UserName
          if ([string]::IsNullOrWhiteSpace($interactiveUser)) {
            throw 'WINDOWS_HUMAN_GATE_NO_INTERACTIVE_USER_SESSION'
          }

          # Repair directly with machine-scope DPAPI. This removes the
          # cross-user DPAPI mismatch that caused the watchdog to fail.
          $tokenBytes = [System.Text.Encoding]::UTF8.GetBytes($env:ARIA_DEVICE_TOKEN)
          $protected = [System.Security.Cryptography.ProtectedData]::Protect(
            $tokenBytes,
            $null,
            [System.Security.Cryptography.DataProtectionScope]::LocalMachine
          )
          $payload = 'ARIA-DPAPI-MACHINE-V1:' + [Convert]::ToBase64String($protected)

          # The previous token file can carry an old restrictive DACL owned by
          # another Windows context. Remove only that file, then recreate it so
          # the directory's existing ACL is inherited cleanly.
          if (Test-Path $tokenPath) {
            Remove-Item -LiteralPath $tokenPath -Force -ErrorAction Stop
          }
          Set-Content -Path $tokenPath -Value $payload -Encoding ASCII -Force

          # Verify both the runner and the interactive user can read the file;
          # do not mutate the file DACL from NetworkService.
          $rawToken = Get-Content -Raw -Path $tokenPath -ErrorAction Stop
          if ([string]::IsNullOrWhiteSpace($rawToken) -or -not $rawToken.StartsWith('ARIA-DPAPI-MACHINE-V1:')) {
            throw 'TOKEN_STORE_WRITE_VERIFY_FAILED'
          }

          Write-Host 'TOKEN_DPAPI_REPAIR=MACHINE_SCOPE'
          Write-Host "INTERACTIVE_USER=$interactiveUser"
          Write-Host 'TOKEN_PLAINTEXT_NOT_LOGGED=True'
      - name: Verify runner Node environment
        run: |
          $ErrorActionPreference = 'Stop'
          $node = Get-Command node -ErrorAction Stop
          $version = node --version
          Write-Host "NODE_PATH=$($node.Source)"
          Write-Host "NODE_VERSION=$version"
          if ([version]($version.TrimStart('v')) -lt [version]'20.0.0') { throw 'Node 20+ required' }

      - name: Verify synced watchdog without disrupting live agent
        run: |
          $ErrorActionPreference = 'Stop'
          $LogDir = 'D:\ARIA-Windows-Agent\Logs'
          $PidPath = Join-Path $LogDir 'agent.pid'
          $WatchdogPidPath = Join-Path $LogDir 'watchdog.pid'
          $LogPath = Join-Path $LogDir 'watchdog.log'

          if (-not (Test-Path $PidPath)) { throw 'agent.pid missing' }
          if (-not (Test-Path $WatchdogPidPath)) { throw 'watchdog.pid missing' }

          $agentPid = 0
          $watchdogPid = 0
          if (-not [int]::TryParse((Get-Content -Raw $PidPath).Trim(), [ref]$agentPid)) { throw 'Invalid agent.pid' }
          if (-not [int]::TryParse((Get-Content -Raw $WatchdogPidPath).Trim(), [ref]$watchdogPid)) { throw 'Invalid watchdog.pid' }

          $agent = Get-Process -Id $agentPid -ErrorAction SilentlyContinue
          $watchdog = Get-Process -Id $watchdogPid -ErrorAction SilentlyContinue
          if (-not $agent -or $agent.ProcessName -notmatch 'node') { throw "ARIA agent process not running: PID=$agentPid" }
          if (-not $watchdog -or $watchdog.ProcessName -notmatch 'powershell') { throw "ARIA watchdog process not running: PID=$watchdogPid" }

          $cimAgent = Get-CimInstance Win32_Process -Filter "ProcessId=$agentPid" -ErrorAction SilentlyContinue
          if (-not $cimAgent -or $cimAgent.CommandLine -notmatch 'aria-agent\.js') { throw "PID $agentPid is not aria-agent.js" }

          Write-Host 'RUNTIME_SYNC=PASS'
          Write-Host 'NON_DISRUPTIVE_PREFLIGHT=True'
          Write-Host "WATCHDOG_PID=$watchdogPid"
          Write-Host "AGENT_PID=$agentPid"
          Write-Host 'NOTE: Live agent is intentionally left running; maintenance restarts belong to explicit operator workflows.'
          if (Test-Path $LogPath) { Get-Content $LogPath -Tail 6 -ErrorAction SilentlyContinue }
          exit 0

      - name: Restart Ollama to clear model OOM state
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          try { & ollama stop qwen3:4b 2>$null | Out-Null } catch {}
          Get-Process -Name 'ollama','ollama app' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $svc = Get-Service -Name 'Ollama' -ErrorAction SilentlyContinue
          if ($svc) { try { Restart-Service -Name 'Ollama' -Force -ErrorAction SilentlyContinue } catch {} }
          else {
            $ollamaCmd = Get-Command ollama -ErrorAction SilentlyContinue
            if ($ollamaCmd) { Start-Process -FilePath $ollamaCmd.Source -ArgumentList 'serve' -WindowStyle Hidden -ErrorAction SilentlyContinue }
          }
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { $null = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/tags' -TimeoutSec 3; $ok = $true; break }
            catch { Start-Sleep -Seconds 2 }
          }
          if ($ok) { Write-Host 'OLLAMA_RESTART=PASS' } else { Write-Host 'OLLAMA_RESTART_WARN=tags not reachable yet' }
          exit 0

      - name: Verify Ollama service
        run: |
          $ErrorActionPreference = 'Stop'
          $response = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/tags' -Method Get -TimeoutSec 15
          Write-Host 'OLLAMA=ONLINE'
          $model = $response.models | Where-Object { $_.name -eq 'qwen3:4b' }
          if (-not $model) { throw 'Required model qwen3:4b is not installed' }
          Write-Host 'OLLAMA_MODEL=qwen3:4b'

      - name: Verify qwen3 execution locally
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = @{
            model = 'qwen3:4b'
            prompt = 'Say OK.'
            stream = $false
            think = $false
            keep_alive = '30s'
            options = @{ temperature = 0; seed = 42; num_predict = 8; num_ctx = 512; num_batch = 16 }
          } | ConvertTo-Json -Depth 10
          $result = $null
          $lastErr = $null
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            try {
              $result = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/generate' -Method Post -ContentType 'application/json' -Body $payload -TimeoutSec 180
              break
            } catch {
              $lastErr = $_
              Write-Host "QWEN_ATTEMPT=$attempt failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 12
            }
          }
          if ($null -eq $result) { throw "Ollama generate failed after retries: $lastErr" }
          $text = ([string]$result.response).Trim()
          if (-not $result.done) { throw 'Qwen generation did not finish' }
          if ([string]::IsNullOrWhiteSpace($text)) { throw 'Qwen returned an empty response' }
          Write-Host 'QWEN_EXECUTION=PASS'
          Write-Host "QWEN_RESPONSE=$text"

      - name: Ensure ARIA agent runtime via public signals
        run: |
          $ErrorActionPreference = 'Stop'
          $RuntimeRoot = 'D:\ARIA-Windows-Agent'
          $LogDir = Join-Path $RuntimeRoot 'Logs'
          $LogPath = Join-Path $LogDir 'watchdog.log'
          $PidPath = Join-Path $LogDir 'agent.pid'
          $StatusPath = Join-Path $LogDir 'status.json'
          $RuntimeAgent = Join-Path $RuntimeRoot 'Runtime\windows\aria-agent.js'
          $RuntimeWatchdog = Join-Path $RuntimeRoot 'Runtime\windows\run-agent.ps1'
          $DataConfig = Join-Path $RuntimeRoot 'Data\config.json'

          foreach ($p in @($RuntimeRoot, $RuntimeAgent, $RuntimeWatchdog, $DataConfig)) {
            if (-not (Test-Path $p)) { throw "Missing required path: $p" }
          }

          # Reject host that is still stuck on the illegal -NoNewWindow combo.
          if (Test-Path $LogPath) {
            $tail = Get-Content $LogPath -Tail 20 -ErrorAction SilentlyContinue | Out-String
            if ($tail -match 'NoNewWindow') {
              Write-Host $tail
              throw 'Watchdog host is still running OLD run-agent.ps1 (NoNewWindow error). As ROBVG\robvg: schtasks /End /TN ARIA-Windows-Local-Agent ; schtasks /Run /TN ARIA-Windows-Local-Agent'
            }
          }

          function Test-LiveAgent {
            if (-not (Test-Path $PidPath)) { return $null }
            $id = 0
            if (-not [int]::TryParse((Get-Content -Raw $PidPath).Trim(), [ref]$id)) { return $null }
            if ($id -le 0) { return $null }
            $proc = Get-Process -Id $id -ErrorAction SilentlyContinue
            if ($proc -and $proc.ProcessName -match 'node') { return $proc }
            return $null
          }

          $agent = $null
          for ($i = 0; $i -lt 50; $i++) {
            $agent = Test-LiveAgent
            if ($agent) { break }
            $cim = Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and ($_.CommandLine -like '*aria-agent.js*') }
            if ($cim) {
              $agent = Get-Process -Id $cim.ProcessId -ErrorAction SilentlyContinue
              if ($agent) {
                try { Set-Content -Path $PidPath -Value $cim.ProcessId -Encoding ASCII -Force } catch {}
                break
              }
            }
            Start-Sleep -Seconds 2
          }

          if (-not $agent) {
            # The watchdog task is configured with InteractiveToken. Never
            # launch a fallback from the self-hosted runner because that would
            # run the desktop agent in the service session and make physical
            # computer-use invalid.
            & schtasks.exe /Run /TN 'ARIA-Windows-Local-Agent' 2>$null | Out-Null
            Write-Host "SCHTASKS_RETRY_EXIT=$LASTEXITCODE"
            $agent = $null
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              $cim = Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
                Where-Object { $_.CommandLine -and ($_.CommandLine -like '*aria-agent.js*') }
              if ($cim) {
                $agent = Get-Process -Id $cim.ProcessId -ErrorAction SilentlyContinue |
                  Where-Object { $_.SessionId -ne 0 } |
                  Select-Object -First 1
                if ($agent) {
                  try { Set-Content -Path $PidPath -Value $agent.Id -Encoding ASCII -Force } catch {}
                  break
                }
              }
            }
          }

          if (-not $agent) {
            if (Test-Path $LogPath) {
              Write-Host 'watchdog.log (last 60):'
              Get-Content $LogPath -Tail 60 -ErrorAction SilentlyContinue
            }
            throw 'ARIA agent process not running after task restart + direct watchdog fallback'
          }

          $agentSessionId = (Get-Process -Id $agent.Id -ErrorAction Stop).SessionId
          if ($agentSessionId -eq 0) {
            throw "ARIA agent is running in Windows service session 0; physical RWHT requires the interactive desktop session. PID=$($agent.Id)"
          }

          Write-Host 'ARIA_TASK=RUNNING'
          Write-Host 'AGENT_PROCESS=RUNNING'
          Write-Host "AGENT_PID=$($agent.Id)"
          Write-Host "AGENT_SESSION_ID=$agentSessionId"
          Write-Host 'ARIA_AGENT_CONTEXT=INTERACTIVE_DESKTOP'
          Write-Host 'RUNTIME_ROOT=D:\ARIA-Windows-Agent'

      - name: Verify watchdog continuity without killing agent
        run: |
          $ErrorActionPreference = 'Stop'
          $LogDir = 'D:\ARIA-Windows-Agent\Logs'
          $PidPath = Join-Path $LogDir 'agent.pid'
          $HeartbeatPath = Join-Path $LogDir 'agent-heartbeat.json'

          if (-not (Test-Path $PidPath)) { throw 'agent.pid missing before continuity test' }
          if (-not (Test-Path $HeartbeatPath)) { throw 'agent-heartbeat.json missing before continuity test' }

          $agentPid = 0
          if (-not [int]::TryParse((Get-Content -Raw $PidPath).Trim(), [ref]$agentPid) -or $agentPid -le 0) {
            throw 'Invalid agent.pid content'
          }

          $before = Get-Process -Id $agentPid -ErrorAction SilentlyContinue
          if (-not $before -or $before.ProcessName -notmatch 'node') {
            throw "PID $agentPid is not a live node process"
          }

          $beforeHeartbeat = (Get-Content -Raw $HeartbeatPath | ConvertFrom-Json).timestamp
          Start-Sleep -Seconds 12

          $after = Get-Process -Id $agentPid -ErrorAction SilentlyContinue
          if (-not $after -or $after.ProcessName -notmatch 'node') {
            throw "ARIA agent PID $agentPid did not remain alive during continuity window"
          }

          $afterHeartbeat = (Get-Content -Raw $HeartbeatPath | ConvertFrom-Json).timestamp
          if ($afterHeartbeat -eq $beforeHeartbeat) {
            throw 'ARIA agent heartbeat timestamp did not advance during continuity window'
          }

          Write-Host 'WATCHDOG_CONTINUITY=PASS'
          Write-Host "AGENT_PID=$agentPid"
          Write-Host "HEARTBEAT_BEFORE=$beforeHeartbeat"
          Write-Host "HEARTBEAT_AFTER=$afterHeartbeat"
          Write-Host 'DESTRUCTIVE_KILL_TEST=False'
      - name: Verify ARIA Gateway heartbeat
        env:
          ARIA_DEVICE_TOKEN: ${{ secrets.ARIA_DEVICE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $deviceId = 'windows-fe722cc6681e4f9c9cc35f5ebbb0a089'
          $url = 'https://icuqsstxfdbvjytkhlog.supabase.co/functions/v1/aria-device-gateway'
          if ([string]::IsNullOrWhiteSpace($env:ARIA_DEVICE_TOKEN)) { throw 'ARIA_DEVICE_TOKEN repository secret is missing' }
          $headers = @{ Authorization = "Bearer $env:ARIA_DEVICE_TOKEN"; 'x-aria-device-id' = $deviceId; 'content-type' = 'application/json' }
          $body = @{ device_id = $deviceId; agent_type = 'windows-local'; capabilities = @('ollama.qwen3') } | ConvertTo-Json
          try { $heartbeat = Invoke-RestMethod -Uri "$url/v1/devices/heartbeat" -Headers $headers -Method Post -Body $body -TimeoutSec 15 }
          catch { throw "Gateway heartbeat probe failed: $($_.Exception.Message)" }
          if ($null -eq $heartbeat) { throw 'Gateway heartbeat returned an empty response' }
          Write-Host 'GATEWAY_HEARTBEAT=PASS'
          Write-Host "DEVICE_ID=$deviceId"
          Write-Host 'CAPABILITY=ollama.qwen3'
