name: ARIA Windows Local Agent Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Windows Agent / Ollama Preflight
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Verify runner Node environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $node = Get-Command node -ErrorAction Stop
          $version = node --version
          Write-Host "NODE_PATH=$($node.Source)"
          Write-Host "NODE_VERSION=$version"
          if ([version]($version.TrimStart('v')) -lt [version]'20.0.0') {
            throw 'Node 20+ required'
          }

      - name: Verify Ollama service
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $response = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/tags' -Method Get -TimeoutSec 10
          Write-Host 'OLLAMA=ONLINE'
          $model = $response.models | Where-Object { $_.name -eq 'qwen3:4b' }
          if (-not $model) {
            throw 'Required model qwen3:4b is not installed'
          }
          Write-Host 'OLLAMA_MODEL=qwen3:4b'

      - name: Verify qwen3 execution locally
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = @{ model = 'qwen3:4b'; prompt = 'Responde exactamente: QWEN_ARIA_OK'; stream = $false } | ConvertTo-Json
          $result = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/generate' -Method Post -ContentType 'application/json' -Body $payload -TimeoutSec 60
          $text = [string]$result.response
          $text = [regex]::Replace($text, '(?is)<think>.*?</think>', '').Trim()
          if ($text -notmatch 'QWEN_ARIA_OK') {
            throw 'Qwen did not return the expected sentinel'
          }
          Write-Host 'QWEN_EXECUTION=PASS'

      - name: Repair Windows Agent DPAPI token and start task
        shell: powershell
        env:
          ARIA_DEVICE_TOKEN: ${{ secrets.ARIA_DEVICE_TOKEN }}
          ARIA_DEVICE_ID: ${{ secrets.ARIA_DEVICE_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('ARIA_DEVICE_TOKEN','ARIA_DEVICE_ID')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "$name repository secret is missing"
            }
          }
          $configDir = Join-Path $env:LOCALAPPDATA 'ARIA-Windows-Agent'
          $tokenPath = Join-Path $configDir 'device-token.dpapi'
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          $secure = ConvertTo-SecureString -String $env:ARIA_DEVICE_TOKEN -AsPlainText -Force
          $encrypted = $secure | ConvertFrom-SecureString
          Set-Content -Path $tokenPath -Value $encrypted -Encoding ASCII
          Write-Host 'TOKEN_STORE_REPAIRED=True'
          & schtasks.exe /Run /TN 'ARIA-Windows-Local-Agent' | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to start ARIA-Windows-Local-Agent. ExitCode=$LASTEXITCODE"
          }
          Start-Sleep -Seconds 8
          $agent = Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -like '*agents\\windows\\aria-agent.js*' }
          if (-not $agent) {
            throw 'ARIA Windows Agent process did not start'
          }
          Write-Host 'AGENT_PROCESS=RUNNING'

      - name: Verify ARIA Gateway environment and heartbeat
        shell: powershell
        env:
          ARIA_DEVICE_GATEWAY_URL: ${{ secrets.ARIA_DEVICE_GATEWAY_URL }}
          ARIA_DEVICE_TOKEN: ${{ secrets.ARIA_DEVICE_TOKEN }}
          ARIA_DEVICE_ID: ${{ secrets.ARIA_DEVICE_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('ARIA_DEVICE_GATEWAY_URL','ARIA_DEVICE_TOKEN','ARIA_DEVICE_ID')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "$name repository secret is missing"
            }
          }
          $url = $env:ARIA_DEVICE_GATEWAY_URL.TrimEnd('/')
          $headers = @{ Authorization = "Bearer $env:ARIA_DEVICE_TOKEN"; 'x-aria-device-id' = $env:ARIA_DEVICE_ID; 'content-type' = 'application/json' }
          $body = @{ device_id = $env:ARIA_DEVICE_ID; agent_type = 'windows-ollama-qwen3'; capabilities = @('shell.execute','ollama.qwen3') } | ConvertTo-Json
          try {
            $heartbeat = Invoke-RestMethod -Uri "$url/v1/devices/heartbeat" -Headers $headers -Method Post -Body $body -TimeoutSec 15
          } catch {
            throw "Gateway heartbeat probe failed: $($_.Exception.Message)"
          }
          if ($null -eq $heartbeat) {
            throw 'Gateway heartbeat returned an empty response'
          }
          Write-Host 'GATEWAY_HEARTBEAT=PASS'
          Write-Host 'DEVICE_ID=present'
          Write-Host 'CAPABILITY=ollama.qwen3'
