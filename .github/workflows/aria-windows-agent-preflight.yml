name: ARIA Windows Local Agent Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

jobs:
  preflight:
    name: Windows Agent / Ollama Preflight
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Verify runner Node environment
        run: |
          $ErrorActionPreference = 'Stop'
          $node = Get-Command node -ErrorAction Stop
          $version = node --version
          Write-Host "NODE_PATH=$($node.Source)"
          Write-Host "NODE_VERSION=$version"
          if ([version]($version.TrimStart('v')) -lt [version]'20.0.0') {
            throw 'Node 20+ required'
          }

      - name: Verify Ollama service
        run: |
          $ErrorActionPreference = 'Stop'
          $response = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/tags' -Method Get -TimeoutSec 10
          Write-Host 'OLLAMA=ONLINE'
          $model = $response.models | Where-Object { $_.name -eq 'qwen3:4b' }
          if (-not $model) {
            throw 'Required model qwen3:4b is not installed'
          }
          Write-Host 'OLLAMA_MODEL=qwen3:4b'

      - name: Verify qwen3 execution locally
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = @{
            model = 'qwen3:4b'
            prompt = 'Say OK.'
            stream = $false
            think = $false
            options = @{
              temperature = 0
              seed = 42
              num_predict = 8
            }
          } | ConvertTo-Json -Depth 10

          $result = Invoke-RestMethod `
            -Uri 'http://127.0.0.1:11434/api/generate' `
            -Method Post `
            -ContentType 'application/json' `
            -Body $payload `
            -TimeoutSec 180

          if ($null -eq $result) {
            throw 'Ollama returned no result'
          }

          $text = ([string]$result.response).Trim()

          if (-not $result.done) {
            throw 'Qwen generation did not finish'
          }

          if ([string]::IsNullOrWhiteSpace($text)) {
            throw 'Qwen returned an empty response'
          }

          Write-Host 'QWEN_EXECUTION=PASS'
          Write-Host "QWEN_RESPONSE=$text"
          Write-Host "QWEN_TOTAL_DURATION_NS=$($result.total_duration)"

      - name: Ensure ARIA task is running (no private profile access)
        run: |
          $ErrorActionPreference = 'Stop'
          $TaskName = 'ARIA-Windows-Local-Agent'
          $PublicDir = Join-Path $env:ProgramData 'ARIA-Windows-Agent'
          $LogPath = Join-Path $PublicDir 'watchdog.log'

          $query = schtasks.exe /Query /TN $TaskName /V /FO LIST 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw 'ARIA-Windows-Local-Agent task is not installed. Run install-v2.ps1 as the interactive user.'
          }

          $text = ($query | Out-String)
          $running = $text -match 'Estado:\s+En ejecución|Status:\s+Running'

          if (-not $running) {
            Write-Host 'Task not running — starting via schtasks /Run'
            & schtasks.exe /Run /TN $TaskName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Unable to start ARIA task. ExitCode=$LASTEXITCODE" }
            Start-Sleep -Seconds 15
          }

          # Poll for node process (system-wide; no user profile needed)
          $agent = $null
          for ($i = 0; $i -lt 12; $i++) {
            $agent = Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -like '*aria-agent.js*' }
            if ($agent) { break }
            Start-Sleep -Seconds 5
          }

          if (-not $agent) {
            if (Test-Path $LogPath) {
              Write-Host '--- watchdog.log (last 30 lines) ---'
              Get-Content -Path $LogPath -Tail 30 -ErrorAction SilentlyContinue
            } else {
              Write-Host "No public watchdog log at $LogPath"
            }
            throw 'ARIA Windows Agent process is not running after task start'
          }

          Write-Host 'ARIA_TASK=RUNNING'
          Write-Host 'AGENT_PROCESS=RUNNING'
          Write-Host "AGENT_PID=$($agent.ProcessId)"
          if (Test-Path $LogPath) {
            Write-Host 'WATCHDOG_LOG=AVAILABLE'
          }

      - name: Verify ARIA local agent runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $agent = Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -like '*aria-agent.js*' }
          if (-not $agent) {
            throw 'ARIA Windows Agent process is not running'
          }
          Write-Host 'ARIA_RUNTIME=AVAILABLE'
          Write-Host 'AGENT_PROCESS=RUNNING'
          Write-Host "AGENT_PID=$($agent.ProcessId)"

      - name: Watchdog recovery proof (kill → restart)
        run: |
          $ErrorActionPreference = 'Stop'
          $PublicDir = Join-Path $env:ProgramData 'ARIA-Windows-Agent'
          $LogPath = Join-Path $PublicDir 'watchdog.log'

          $before = Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -like '*aria-agent.js*' }
          if (-not $before) { throw 'Agent not running before kill test' }
          $oldPid = $before.ProcessId
          Write-Host "KILL_TARGET_PID=$oldPid"

          Stop-Process -Id $oldPid -Force -ErrorAction Stop
          Write-Host 'AGENT_KILLED=True'

          # Watchdog should restart within ~5–20s
          $newAgent = $null
          for ($i = 0; $i -lt 18; $i++) {
            Start-Sleep -Seconds 2
            $newAgent = Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -like '*aria-agent.js*' }
            if ($newAgent -and $newAgent.ProcessId -ne $oldPid) { break }
          }

          if (-not $newAgent) {
            if (Test-Path $LogPath) {
              Write-Host '--- watchdog.log after kill ---'
              Get-Content -Path $LogPath -Tail 20 -ErrorAction SilentlyContinue
            }
            throw 'Watchdog did not restart aria-agent.js after kill'
          }

          Write-Host 'WATCHDOG_RESTART=PASS'
          Write-Host "AGENT_NEW_PID=$($newAgent.ProcessId)"
          if (Test-Path $LogPath) {
            Write-Host '--- recent watchdog log ---'
            Get-Content -Path $LogPath -Tail 10 -ErrorAction SilentlyContinue
          }

      - name: Verify ARIA Gateway heartbeat
        env:
          ARIA_DEVICE_TOKEN: ${{ secrets.ARIA_DEVICE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $deviceId = 'windows-fe722cc6681e4f9c9cc35f5ebbb0a089'
          $url = 'https://icuqsstxfdbvjytkhlog.supabase.co/functions/v1/aria-device-gateway'
          if ([string]::IsNullOrWhiteSpace($env:ARIA_DEVICE_TOKEN)) {
            throw 'ARIA_DEVICE_TOKEN repository secret is missing'
          }
          $headers = @{ Authorization = "Bearer $env:ARIA_DEVICE_TOKEN"; 'x-aria-device-id' = $deviceId; 'content-type' = 'application/json' }
          $body = @{ device_id = $deviceId; agent_type = 'windows-local'; capabilities = @('ollama.qwen3') } | ConvertTo-Json
          try {
            $heartbeat = Invoke-RestMethod -Uri "$url/v1/devices/heartbeat" -Headers $headers -Method Post -Body $body -TimeoutSec 15
          } catch {
            throw "Gateway heartbeat probe failed: $($_.Exception.Message)"
          }
          if ($null -eq $heartbeat) { throw 'Gateway heartbeat returned an empty response' }
          Write-Host 'GATEWAY_HEARTBEAT=PASS'
          Write-Host 'DEVICE_ID=windows-fe722cc6681e4f9c9cc35f5ebbb0a089'
          Write-Host 'CAPABILITY=ollama.qwen3'
