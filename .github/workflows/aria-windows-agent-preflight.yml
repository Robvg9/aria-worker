name: ARIA Windows Local Agent Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

jobs:
  preflight:
    name: Windows Agent / Ollama Preflight
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Verify runner Node environment
        run: |
          $ErrorActionPreference = 'Stop'
          $node = Get-Command node -ErrorAction Stop
          $version = node --version
          Write-Host "NODE_PATH=$($node.Source)"
          Write-Host "NODE_VERSION=$version"
          if ([version]($version.TrimStart('v')) -lt [version]'20.0.0') { throw 'Node 20+ required' }

      - name: Verify Ollama service
        run: |
          $ErrorActionPreference = 'Stop'
          $response = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/tags' -Method Get -TimeoutSec 10
          Write-Host 'OLLAMA=ONLINE'
          $model = $response.models | Where-Object { $_.name -eq 'qwen3:4b' }
          if (-not $model) { throw 'Required model qwen3:4b is not installed' }
          Write-Host 'OLLAMA_MODEL=qwen3:4b'

      - name: Verify qwen3 execution locally
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = @{
            model = 'qwen3:4b'
            prompt = 'Say OK.'
            stream = $false
            think = $false
            options = @{ temperature = 0; seed = 42; num_predict = 8 }
          } | ConvertTo-Json -Depth 10
          $result = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/generate' -Method Post -ContentType 'application/json' -Body $payload -TimeoutSec 180
          if ($null -eq $result) { throw 'Ollama returned no result' }
          $text = ([string]$result.response).Trim()
          if (-not $result.done) { throw 'Qwen generation did not finish' }
          if ([string]::IsNullOrWhiteSpace($text)) { throw 'Qwen returned an empty response' }
          Write-Host 'QWEN_EXECUTION=PASS'
          Write-Host "QWEN_RESPONSE=$text"
          Write-Host "QWEN_TOTAL_DURATION_NS=$($result.total_duration)"

      - name: Ensure ARIA task is running
        run: |
          $ErrorActionPreference = 'Stop'
          $TaskName = 'ARIA-Windows-Local-Agent'
          $RuntimeRoot = 'D:\ARIA-Windows-Agent'
          $RuntimeAgent = Join-Path $RuntimeRoot 'Runtime\windows\aria-agent.js'
          $RuntimeWatchdog = Join-Path $RuntimeRoot 'Runtime\windows\run-agent.ps1'
          $LogPath = Join-Path $RuntimeRoot 'Logs\watchdog.log'

          if (-not (Test-Path $RuntimeRoot)) { throw "ARIA runtime root missing: $RuntimeRoot" }
          if (-not (Test-Path $RuntimeAgent)) { throw "ARIA runtime agent missing: $RuntimeAgent" }
          if (-not (Test-Path $RuntimeWatchdog)) { throw "ARIA watchdog missing: $RuntimeWatchdog" }

          try {
            $service = New-Object -ComObject 'Schedule.Service'
            $service.Connect()
            $folder = $service.GetFolder('\')
            $task = $folder.GetTask($TaskName)
          } catch {
            throw "Unable to access ARIA scheduled task through Task Scheduler API: $($_.Exception.Message)"
          }

          $action = $task.Definition.Actions.Item(1)
          $actionText = "$($action.Path) $($action.Arguments) $($action.WorkingDirectory)"
          if ($actionText -notlike '*D:\ARIA-Windows-Agent\Runtime\windows\run-agent.ps1*') {
            throw 'ARIA task is not pointing to the D: runtime. Re-run install-v2.ps1.'
          }

          if ([int]$task.State -ne 4) {
            try { $task.Run($null) | Out-Null }
            catch { throw "Unable to start ARIA task through Task Scheduler API: $($_.Exception.Message)" }
          }

          $agent = $null
          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 2
            $agent = Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -like '*D:\\ARIA-Windows-Agent\\Runtime\\windows\\aria-agent.js*' }
            if ($agent) { break }
          }

          if (-not $agent) {
            if (Test-Path $LogPath) {
              Write-Host '--- watchdog.log ---'
              Get-Content $LogPath -Tail 40 -ErrorAction SilentlyContinue
            }
            throw 'ARIA Windows Agent process is not running after task start'
          }

          Write-Host 'ARIA_TASK=RUNNING'
          Write-Host 'AGENT_PROCESS=RUNNING'
          Write-Host "AGENT_PID=$($agent.ProcessId)"
          Write-Host 'RUNTIME_ROOT=D:\ARIA-Windows-Agent'

      - name: Watchdog recovery proof (kill → restart)
        run: |
          $ErrorActionPreference = 'Stop'
          $RuntimeRoot = 'D:\ARIA-Windows-Agent'
          $LogPath = Join-Path $RuntimeRoot 'Logs\watchdog.log'
          $PidPath = Join-Path $RuntimeRoot 'Logs\agent.pid'

          $before = Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -like '*D:\\ARIA-Windows-Agent\\Runtime\\windows\\aria-agent.js*' }
          if (-not $before) { throw 'Agent not running before kill test' }

          if (Test-Path $PidPath) {
            $oldPid = [int](Get-Content -Raw $PidPath).Trim()
            $target = $before | Where-Object { $_.ProcessId -eq $oldPid }
            if (-not $target) { $oldPid = $before[0].ProcessId }
          } else { $oldPid = $before[0].ProcessId }

          Write-Host "KILL_TARGET_PID=$oldPid"
          Stop-Process -Id $oldPid -Force -ErrorAction Stop
          Write-Host 'AGENT_KILLED=True'

          $newAgent = $null
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 2
            $candidate = Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -like '*D:\\ARIA-Windows-Agent\\Runtime\\windows\\aria-agent.js*' -and $_.ProcessId -ne $oldPid }
            if ($candidate) { $newAgent = $candidate; break }
          }

          if (-not $newAgent) {
            if (Test-Path $LogPath) {
              Write-Host '--- watchdog.log after kill ---'
              Get-Content $LogPath -Tail 40 -ErrorAction SilentlyContinue
            }
            throw 'Watchdog did not restart aria-agent.js after kill'
          }

          Write-Host 'WATCHDOG_RESTART=PASS'
          Write-Host "AGENT_NEW_PID=$($newAgent.ProcessId)"

      - name: Verify ARIA Gateway heartbeat
        env:
          ARIA_DEVICE_TOKEN: ${{ secrets.ARIA_DEVICE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $deviceId = 'windows-fe722cc6681e4f9c9cc35f5ebbb0a089'
          $url = 'https://icuqsstxfdbvjytkhlog.supabase.co/functions/v1/aria-device-gateway'
          if ([string]::IsNullOrWhiteSpace($env:ARIA_DEVICE_TOKEN)) { throw 'ARIA_DEVICE_TOKEN repository secret is missing' }
          $headers = @{ Authorization = "Bearer $env:ARIA_DEVICE_TOKEN"; 'x-aria-device-id' = $deviceId; 'content-type' = 'application/json' }
          $body = @{ device_id = $deviceId; agent_type = 'windows-local'; capabilities = @('ollama.qwen3') } | ConvertTo-Json
          try { $heartbeat = Invoke-RestMethod -Uri "$url/v1/devices/heartbeat" -Headers $headers -Method Post -Body $body -TimeoutSec 15 }
          catch { throw "Gateway heartbeat probe failed: $($_.Exception.Message)" }
          if ($null -eq $heartbeat) { throw 'Gateway heartbeat returned an empty response' }
          Write-Host 'GATEWAY_HEARTBEAT=PASS'
          Write-Host "DEVICE_ID=$deviceId"
          Write-Host 'CAPABILITY=ollama.qwen3'
