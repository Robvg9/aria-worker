name: ARIA Emergency Agent Recovery

on:
  push:
    branches: [aria/self-improvement-v1-main]
    paths:
      - .github/workflows/aria-emergency-agent-recovery.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Release stuck ARIA shell worker and restart agent
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host 'RECOVERY_START'
          Get-Process -Name robocopy -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $targets = Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Where-Object { $_.CommandLine -like '*D:\ARIA-Windows-Agent\Runtime\windows\aria-agent.js*' }
          foreach ($p in $targets) {
            Write-Host "ARIA_AGENT_PID=$($p.ProcessId)"
            Invoke-CimMethod -InputObject $p -MethodName Terminate | Out-Null
          }
          Start-Sleep -Seconds 15
          Write-Host 'RUNNER_SERVICES'
          Get-Service -Name 'actions.runner.Robvg9-aria-worker.ARIA-WINDOWS' -ErrorAction SilentlyContinue | Format-Table Name,Status
          Write-Host 'ARIA_AGENT_PROCS'
          Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Where-Object { $_.CommandLine -like '*D:\ARIA-Windows-Agent\Runtime\windows\aria-agent.js*' } | Select-Object ProcessId,CommandLine | Format-List
          Write-Host 'RECOVERY_DONE'