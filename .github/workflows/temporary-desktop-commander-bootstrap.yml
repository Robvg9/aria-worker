name: Temporary Desktop Commander Bootstrap

on:
  push:
    paths:
      - '.github/workflows/temporary-desktop-commander-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Start or reuse Desktop Commander Remote
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "RUNNER_USER=$([System.Security.Principal.WindowsIdentity]::GetCurrent().Name)"
          $existing = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -match '^node(\.exe)?$' -and [string]$_.CommandLine -match '(?i)desktop-commander.*remote'
          })
          if ($existing.Count -gt 0) {
            Write-Host "DESKTOP_COMMANDER_ALREADY_RUNNING=True"
            $existing | ForEach-Object { Write-Host "PID=$($_.ProcessId) CMD=$($_.CommandLine)" }
            exit 0
          }

          $tasks = @(Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object {
            $_.TaskName -match '(?i)(Desktop.*Commander|RDC.*Agent|Remote.*Commander)'
          })
          foreach ($task in $tasks) {
            Write-Host "STARTING_TASK=$($task.TaskName)"
            try { Start-ScheduledTask -TaskName $task.TaskName -TaskPath $task.TaskPath -ErrorAction Stop } catch { Write-Warning $_.Exception.Message }
          }

          Start-Sleep -Seconds 5
          $existing = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -match '^node(\.exe)?$' -and [string]$_.CommandLine -match '(?i)desktop-commander.*remote'
          })
          if ($existing.Count -gt 0) {
            Write-Host "DESKTOP_COMMANDER_STARTED=True"
            $existing | ForEach-Object { Write-Host "PID=$($_.ProcessId)" }
            exit 0
          }

          $cmd = Get-Command desktop-commander.cmd -ErrorAction SilentlyContinue
          if ($null -eq $cmd) {
            $cmd = Get-Command npx.cmd -ErrorAction SilentlyContinue
            if ($null -eq $cmd) { throw 'NODE_NPX_NOT_FOUND' }
            Write-Host "STARTING_WITH_NPX=True"
            Start-Process -FilePath $cmd.Source -ArgumentList '@wonderwhy-er/desktop-commander@latest','remote' -WindowStyle Hidden
          } else {
            Write-Host "STARTING_GLOBAL_CLI=True"
            Start-Process -FilePath $cmd.Source -ArgumentList 'remote' -WindowStyle Hidden
          }

          Start-Sleep -Seconds 10
          $existing = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -match '^node(\.exe)?$' -and [string]$_.CommandLine -match '(?i)desktop-commander.*remote'
          })
          if ($existing.Count -eq 0) { throw 'DESKTOP_COMMANDER_PROCESS_NOT_DETECTED_AFTER_START' }
          Write-Host "DESKTOP_COMMANDER_BOOTSTRAP=PASS"
          $existing | ForEach-Object { Write-Host "PID=$($_.ProcessId) CMD=$($_.CommandLine)" }
