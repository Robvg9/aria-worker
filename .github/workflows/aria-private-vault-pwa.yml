name: ARIA private vault PWA crypto
on:
  pull_request:
    paths:
      - 'pwa/src/privateVault/**'
      - 'pwa/src/PrivateVault.tsx'
      - 'pwa/src/PrivateVault.css'
      - 'pwa/src/App.tsx'
      - 'pwa/tests/private-vault-crypto.test.mjs'
      - 'pwa/package.json'
      - 'pwa/package-lock.json'
      - '.github/workflows/aria-private-vault-pwa.yml'
  push:
    branches: [main]
    paths:
      - 'pwa/src/privateVault/**'
      - 'pwa/src/PrivateVault.tsx'
      - 'pwa/src/PrivateVault.css'
      - 'pwa/src/App.tsx'
      - 'pwa/tests/private-vault-crypto.test.mjs'
      - 'pwa/package.json'
      - 'pwa/package-lock.json'
      - '.github/workflows/aria-private-vault-pwa.yml'
permissions:
  contents: read
jobs:
  private-vault-pwa:
    name: Private vault crypto and PWA build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install locked PWA dependencies
        run: npm ci --prefix pwa
      - name: Run vault cryptography tests
        run: npm run test:vault --prefix pwa
      - name: Build PWA
        run: npm run build --prefix pwa
