name: ARIA Windows Direct Repair

# v5 — enforce one watchdog + one Agent, then activate Meditation without restart races
on:
  push:
    branches: [main]
    paths-ignore:
      - 'reports/**'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Safe C cleanup and Ollama relocation
        run: |
          $ErrorActionPreference='Continue'
          $d='D:\ARIA-Windows-Agent\Maintenance'; New-Item -ItemType Directory -Force -Path $d | Out-Null
          $before=(Get-PSDrive C).Free; Write-Host "C_FREE_BEFORE_GB=$([math]::Round($before/1GB,2))"
          foreach($p in @("$env:TEMP\*","$env:LOCALAPPDATA\Temp\*","$env:WINDIR\Temp\*","$env:LOCALAPPDATA\Microsoft\Windows\INetCache\*","$env:LOCALAPPDATA\CrashDumps\*","$env:LOCALAPPDATA\D3DSCache\*","$env:LOCALAPPDATA\NVIDIA\DXCache\*","$env:LOCALAPPDATA\NVIDIA\GLCache\*","C:\Windows\SoftwareDistribution\Download\*","C:\ProgramData\Microsoft\Windows\WER\ReportQueue\*","C:\ProgramData\Microsoft\Windows\WER\ReportArchive\*")){try{Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue}catch{}}
          if(Get-Command Delete-DeliveryOptimizationCache -ErrorAction SilentlyContinue){try{Delete-DeliveryOptimizationCache -Force -ErrorAction SilentlyContinue}catch{}}
          if(Get-Command Clear-RecycleBin -ErrorAction SilentlyContinue){try{Clear-RecycleBin -Force -ErrorAction SilentlyContinue}catch{}}
          if(Get-Command npm.cmd -ErrorAction SilentlyContinue){try{npm.cmd cache clean --force | Out-Host}catch{}}
          if(Get-Command pip.exe -ErrorAction SilentlyContinue){try{pip.exe cache purge | Out-Host}catch{}}
          $ollama=Join-Path $env:USERPROFILE '.ollama\models'; $ollamaD=Join-Path $d 'ollama-models'
          if(Test-Path $ollama -PathType Container){try{$it=Get-Item $ollama -Force;if(-not($it.Attributes -band [IO.FileAttributes]::ReparsePoint)){if(Test-Path $ollamaD){Remove-Item $ollamaD -Recurse -Force -ErrorAction SilentlyContinue};New-Item -ItemType Directory -Force -Path (Split-Path $ollamaD)|Out-Null;Move-Item -LiteralPath $ollama -Destination $ollamaD -Force;New-Item -ItemType Junction -Path $ollama -Target $ollamaD|Out-Null;Write-Host "OLLAMA_MODELS_RELOCATED=True TARGET=$ollamaD"}else{Write-Host 'OLLAMA_MODELS_ALREADY_RELOCATED=True'}}catch{Write-Warning "OLLAMA_RELOCATE_FAILED $($_.Exception.Message)"}}
          if(Get-Command dism.exe -ErrorAction SilentlyContinue){try{dism.exe /Online /Cleanup-Image /StartComponentCleanup /Quiet | Out-Host}catch{}}
          $after=(Get-PSDrive C).Free; Write-Host "C_FREE_AFTER_GB=$([math]::Round($after/1GB,2))"; Write-Host "C_FREED_GB=$([math]::Round(($after-$before)/1GB,2))"; Write-Host 'ARIA_CLEANUP=PASS'

      - name: Enforce single watchdog, single Agent and clean Meditation lock
        run: |
          $ErrorActionPreference='Stop'
          $watchdogPidPath='D:\ARIA-Windows-Agent\Logs\watchdog.pid'; $agentPidPath='D:\ARIA-Windows-Agent\Logs\agent.pid'
          $keepWatchdog=0; $keepAgent=0
          if(Test-Path $watchdogPidPath){[void][int]::TryParse((Get-Content -Raw $watchdogPidPath).Trim(),[ref]$keepWatchdog)}
          if(Test-Path $agentPidPath){[void][int]::TryParse((Get-Content -Raw $agentPidPath).Trim(),[ref]$keepAgent)}
          $watchdogs=Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^powershell(\.exe)?$' -and [string]$_.CommandLine -match '(?i)run-agent\.ps1' }
          Write-Host "ARIA_WATCHDOG_PROCESSES_BEFORE=$($watchdogs.Count) KEEP=$keepWatchdog"
          foreach($p in $watchdogs){if([int]$p.ProcessId -ne $keepWatchdog){Write-Host "STOP_DUPLICATE_WATCHDOG_PID=$($p.ProcessId)";Stop-Process -Id ([int]$p.ProcessId) -Force -ErrorAction SilentlyContinue}}
          $agents=Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^node(\.exe)?$' -and [string]$_.CommandLine -match '(?i)(aria-agent\.js|Runtime\\windows\\aria-agent\.js)' }
          Write-Host "ARIA_AGENT_PROCESSES_BEFORE=$($agents.Count) KEEP=$keepAgent"
          foreach($p in $agents){if([int]$p.ProcessId -ne $keepAgent){Write-Host "STOP_DUPLICATE_AGENT_PID=$($p.ProcessId)";Stop-Process -Id ([int]$p.ProcessId) -Force -ErrorAction SilentlyContinue}}
          Start-Sleep -Seconds 2
          $lock='D:\ARIA-Windows-Agent\Runtime\meditation\controller.lock'
          if(Test-Path $lock){$lp=0;try{$j=Get-Content -Raw $lock|ConvertFrom-Json;$lp=[int]$j.pid}catch{};$q=$null;if($lp -gt 0){$q=Get-CimInstance Win32_Process -Filter "ProcessId = $lp" -ErrorAction SilentlyContinue};if($null -eq $q -or $lp -eq $keepAgent){Remove-Item $lock -Force -ErrorAction SilentlyContinue;Write-Host "MEDITATION_LOCK_CLEARED=True PID=$lp"}else{Write-Host "MEDITATION_LOCK_OWNER_PID=$lp CMD=$($q.CommandLine)"}}
          $watchdogs2=Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^powershell(\.exe)?$' -and [string]$_.CommandLine -match '(?i)run-agent\.ps1' }
          $agents2=Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^node(\.exe)?$' -and [string]$_.CommandLine -match '(?i)(aria-agent\.js|Runtime\\windows\\aria-agent\.js)' }
          Write-Host "ARIA_WATCHDOG_PROCESSES_AFTER=$($watchdogs2.Count) ARIA_AGENT_PROCESSES_AFTER=$($agents2.Count)"

      - name: Ensure Meditation endpoint is online and activate
        run: |
          $ErrorActionPreference='Stop'
          $u='http://127.0.0.1:45873/status'; $start='http://127.0.0.1:45873/start'
          $online=$false; try{$s=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 3;if($s){$online=$true}}catch{}
          if(-not $online){$agent='D:\ARIA-Windows-Agent\Runtime\windows\run-agent.ps1';if(-not(Test-Path $agent)){throw "Agent launcher missing: $agent"};Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',$agent -WindowStyle Hidden;for($i=0;$i-lt30;$i++){Start-Sleep -Seconds 1;try{$s=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 2;if($s){$online=$true;break}}catch{}};if(-not $online){throw 'Meditation control endpoint did not become online'}}
          $s=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5
          if($s.mode -eq 'active'){Write-Host "MEDITATION_ALREADY_ACTIVE session=$($s.session_id)";exit 0}
          $r=Invoke-RestMethod -Method Post -Uri $start -TimeoutSec 10;Start-Sleep -Seconds 3;$f=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5
          Write-Host ("MEDITATION_ACTIVATE status={0} mode={1} session={2} tick={3}" -f $r.status,$f.mode,$f.session_id,$f.tick_count)
          if($f.mode -ne 'active'){throw "Meditation IA activation failed mode=$($f.mode) start=$($r.status)"};Write-Host 'MEDITATION_ACTIVATION=PASS'

      - name: Verify continuity heartbeat
        run: |
          $ErrorActionPreference='Stop';$u='http://127.0.0.1:45873/status';$a=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5
          if($a.mode -ne 'active'){throw "Mode not active: $($a.mode)"};$t=[int]$a.tick_count;Start-Sleep -Seconds 12;$b=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5
          Write-Host "MEDITATION_TICKS_INITIAL=$t MEDITATION_TICKS_FINAL=$($b.tick_count) MODE=$($b.mode)";if($b.mode -ne 'active'){throw "Meditation stopped: $($b.mode)"};if([int]$b.tick_count-lt$t){throw 'Tick counter regressed'};Write-Host 'MEDITATION_HEARTBEAT=PASS'

      - name: Final evidence and persistent proof
        if: always()
        run: |
          $ErrorActionPreference='Continue';$c=Get-PSDrive C;$u='http://127.0.0.1:45873/status';$s=$null;try{$s=Invoke-RestMethod $u -TimeoutSec 5}catch{}
          $proofDir=Join-Path $env:GITHUB_WORKSPACE 'reports';New-Item -ItemType Directory -Force -Path $proofDir|Out-Null
          [ordered]@{timestamp=(Get-Date -Format o);computer=$env:COMPUTERNAME;c_free_gb=[math]::Round($c.Free/1GB,2);meditation_mode=$s.mode;meditation_session=$s.session_id;meditation_ticks=$s.tick_count;outcome=if($s -and $s.mode -eq 'active'){'PASS'}else{'FAIL'}}|ConvertTo-Json -Depth 8|Set-Content -Path (Join-Path $proofDir 'aria-windows-direct-repair-status.json') -Encoding UTF8
          Get-Content -Raw (Join-Path $proofDir 'aria-windows-direct-repair-status.json')
          if(-not($s -and $s.mode -eq 'active')){throw 'Persistent proof: Meditation IA is not active'}
          git config user.name 'aria-direct-repair';git config user.email 'aria-direct-repair@users.noreply.github.com';git add reports/aria-windows-direct-repair-status.json;git commit -m 'ci: record Windows direct repair proof';if($LASTEXITCODE -eq 0){git push origin HEAD:main}
