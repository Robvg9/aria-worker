name: Diagnose Native Workers Build Command
on:
  push:
    branches:
      - diagnose/native-build-command-20260928
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run exact Workers Build command
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          ! grep -q '__PWA_BUILD__' worker.js
          test -f pwa/dist/index.html
          test -f pwa/dist/manifest.json
          echo NATIVE_BUILD_COMMAND_PASS
