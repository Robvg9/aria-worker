name: Repair Worker Syntax

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-worker-syntax.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair malformed auth header
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker.js')
          lines = p.read_text().splitlines()
          out = []
          changed = False
          for line in lines:
              if line.strip().startswith('headers.set("WWW-Authenticate"'):
                  out.append('  headers.set("WWW-Authenticate", \'Bearer resource_metadata="\' + RESOURCE_METADATA + \'", scope="\' + SCOPES.join(" ") + \'"\');')
                  changed = True
              else:
                  out.append(line)
          if not changed:
              raise SystemExit('target header line not found')
          p.write_text('\\n'.join(out) + '\\n')
          PY

      - name: Validate syntax
        run: node --check worker.js

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair worker auth header syntax'
          git push origin HEAD:main
