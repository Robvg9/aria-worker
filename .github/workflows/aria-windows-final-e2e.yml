name: ARIA Windows Final E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aria-windows-final-e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

jobs:
  final_e2e:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure ARIA Windows Agent v2
        env:
          ARIA_REQUIRE_DESKTOP_SMOKE: '0'
        run: |
          $ErrorActionPreference='Stop'
          if(-not(Test-Path '.\agents\windows\install-v2.ps1')){throw 'install-v2.ps1 missing'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\agents\windows\install-v2.ps1'
          if($LASTEXITCODE-ne0){throw "Agent installation failed: $LASTEXITCODE"}
          Write-Host 'FINAL_E2E_AGENT_V2_INSTALL=PASS'

      - name: Verify control endpoint and activate Meditation IA
        run: |
          $ErrorActionPreference='Stop'
          $u='http://127.0.0.1:45873/status';$start='http://127.0.0.1:45873/start';$s=$null
          try{$s=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5}catch{}
          if($null-eq$s){$agent='D:\ARIA-Windows-Agent\Runtime\windows\run-agent.ps1';if(-not(Test-Path $agent)){throw 'run-agent.ps1 missing'};Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',$agent -WindowStyle Hidden;for($i=0;$i-lt30;$i++){Start-Sleep 1;try{$s=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 2;if($null-ne$s){break}}catch{}}}
          if($null-eq$s){throw 'Meditation control endpoint offline'}
          if($s.mode-ne'active'){$r=Invoke-RestMethod -Method Post -Uri $start -TimeoutSec 10;Start-Sleep 3;$s=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5;Write-Host ("ACTIVATE status={0} mode={1} session={2} tick={3}"-f$r.status,$s.mode,$s.session_id,$s.tick_count)}else{Write-Host "ALREADY_ACTIVE session=$($s.session_id)"}
          if($s.mode-ne'active'){throw "Meditation IA activation failed mode=$($s.mode)"}
          Write-Host 'MEDITATION_ACTIVATION=PASS'

      - name: Verify physical self-improvement runtime and heartbeat
        run: |
          $ErrorActionPreference='Stop'
          $runtime='D:\ARIA-Windows-Agent\Runtime\windows\self-improvement-runtime.js'
          $agent='D:\ARIA-Windows-Agent\Runtime\windows\aria-agent.js'
          $config='D:\ARIA-Windows-Agent\Data\config.json'
          foreach($p in @($runtime,$agent,$config)){if(-not(Test-Path $p)){throw "Installed file missing: $p"}}
          $j=Get-Content -Raw $config|ConvertFrom-Json
          if($j.agent_version-ne'aria-windows-agent-v2'){throw "Unexpected agent_version=$($j.agent_version)"}
          if(-not($j.capabilities-contains'self.improve')){throw 'self.improve capability missing'}
          $procs=Get-CimInstance Win32_Process -Filter "Name='node.exe'"|Where-Object{$_.CommandLine-like '*D:\ARIA-Windows-Agent\Runtime\windows\aria-agent.js*'}
          if(-not$procs){throw 'ARIA Windows v2 agent process not detected'}
          $u='http://127.0.0.1:45873/status';$s=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5;$t=[int]$s.tick_count;Start-Sleep -Seconds 12;$s2=Invoke-RestMethod -Method Get -Uri $u -TimeoutSec 5
          if($s2.mode-ne'active'){throw "Meditation stopped: $($s2.mode)"}
          if([int]$s2.tick_count-lt$t){throw 'Tick counter regressed'}
          Write-Host "PHYSICAL_AGENT_PROCESS=PASS PID=$($procs[0].ProcessId)"
          Write-Host 'SELF_IMPROVEMENT_CAPABILITY_CONFIG=PASS'
          Write-Host "MEDITATION_HEARTBEAT initial=$t final=$($s2.tick_count)"
          Write-Host 'ARIA_WINDOWS_FINAL_E2E=PASS'
