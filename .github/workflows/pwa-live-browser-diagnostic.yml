name: ARIA PWA Live Browser Diagnostic

on:
  push:
    branches: [diag/pwa-live-browser-20260922]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe live HTTP assets
        run: |
          set -euo pipefail
          base="https://aria.robvg9.workers.dev/pwa/"
          curl --fail --silent --show-error --retry 3 --retry-delay 1 "$base/version.json?browser_probe=$(date +%s)"
          curl --fail --silent --show-error --retry 3 --retry-delay 1 "$base?browser_probe=$(date +%s)" -o /tmp/index.html
          js_asset="$(grep -Eo '/pwa/assets/[^\"]+\.js' /tmp/index.html | head -n 1)"
          css_asset="$(grep -Eo '/pwa/assets/[^\"]+\.css' /tmp/index.html | head -n 1)"
          echo "JS_ASSET=$js_asset"
          echo "CSS_ASSET=$css_asset"
          test -n "$js_asset"
          test -n "$css_asset"
          curl --fail --silent --show-error --retry 3 --retry-delay 1 "https://aria.robvg9.workers.dev$js_asset" -o /tmp/app.js
          curl --fail --silent --show-error --retry 3 --retry-delay 1 "https://aria.robvg9.workers.dev$css_asset" -o /tmp/app.css
          test -s /tmp/app.js
          test -s /tmp/app.css
          echo "JS_BYTES=$(wc -c </tmp/app.js)"
          echo "CSS_BYTES=$(wc -c </tmp/app.css)"
          echo STATIC_ASSETS_OK

      - name: Browser smoke
        run: |
          set -euo pipefail
          google-chrome --version || chromium --version
          if command -v google-chrome >/dev/null 2>&1; then chrome=google-chrome; else chrome=chromium; fi
          rm -rf /tmp/aria-chrome
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/aria-chrome --virtual-time-budget=15000 --dump-dom 'https://aria.robvg9.workers.dev/pwa/?browser_probe=clean' > /tmp/aria-dom.html
          echo "DOM markers:"
          grep -Eo 'Tu centro de mando cognitivo|ARIA no pudo iniciar|Error al iniciar ARIA|Iniciando Centro de Mando' /tmp/aria-dom.html | sort | uniq -c || true
          if grep -q 'Tu centro de mando cognitivo' /tmp/aria-dom.html; then
            echo BROWSER_MOUNT_PASS
          else
            echo BROWSER_MOUNT_FAIL
            sed -n '1,220p' /tmp/aria-dom.html
            exit 1
          fi
