name: BattleCruiser Step 4 Android Agent Recovery — Termux Activity Manager
on:
  push:
    branches:
      - aria/bc-step4-android-e2e-20261021
    paths:
      - .github/workflows/battlecruiser-step4-android-ipc-tree-preflight-v1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-step4-android-ipc-tree-preflight-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  android-ipc-tree-preflight:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Install Termux AM helper if missing; relaunch agent; observe Android tree
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.request, urllib.error
          project=os.environ.get('SUPABASE_PROJECT_REF','').strip()
          secret=os.environ.get('ARIA_RUNTIME_SHARED_SECRET','')
          if not project or not secret: raise SystemExit('BLOCKED: required production secrets unavailable')
          base=f'https://{project}.supabase.co/functions/v1'
          headers={'Authorization':'Bearer '+secret,'content-type':'application/json','cache-control':'no-store'}
          mission_id=f"mission_bc_step4_android_ipc_tree_preflight_{os.environ['RUN_ID']}_{os.environ['RUN_ATTEMPT']}"
          device='android-termux-a1ebcfc7-9287-4603-a0f9-c519d12fd092'
          marker='BC_STEP4_ANDROID_AGENT_RECOVERY_V2'
          host='battlecruiser.robvg9.workers.dev'
          command=r"""node <<'NODE'
          const fs=require('node:fs'), path=require('node:path'), crypto=require('node:crypto');
          const repoRoot=process.env.HOME+'/aria-agent';
          const transportPath=path.join(repoRoot,'computer-use/android-accessibility-v1.js');
          const transportBefore=fs.readFileSync(transportPath,'utf8');
          const oldHardcoded="'broadcast', '--user', '0',";
          const currentProfile="'broadcast', '--user', String(localAndroidUserId()),";
          const oldBare="'broadcast',\n      '-a', 'com.robvg9.ariauiagent.ACTION_EXECUTE',";
          const newProfile="'broadcast', '--user', String(localAndroidUserId()),\n      '-a', 'com.robvg9.ariauiagent.ACTION_EXECUTE',";
          const hardcodedCount=transportBefore.split(oldHardcoded).length-1;
          const bareCount=transportBefore.split(oldBare).length-1;
          let transportPatch={status:'blocked_no_unique_safe_match',hardcodedCount,bareCount};
          if(hardcodedCount===1||bareCount===1){
            const backupPath=path.join(process.env.HOME,'.aria-step4-android-accessibility-v1.pre-dynamic-profile-fix-20261022.bak');
            if(!fs.existsSync(backupPath)) fs.copyFileSync(transportPath,backupPath);
            const transportAfter=hardcodedCount===1
              ? transportBefore.replace(oldHardcoded,currentProfile)
              : transportBefore.replace(oldBare,newProfile);
            fs.writeFileSync(transportPath,transportAfter,'utf8');
            transportPatch={status:'patched_unique_broadcast_target_to_calling_profile',backupCreated:true,before_sha256:crypto.createHash('sha256').update(transportBefore).digest('hex'),after_sha256:crypto.createHash('sha256').update(transportAfter).digest('hex'),hardcodedUser0:transportAfter.includes(oldHardcoded),dynamicProfile:transportAfter.includes(currentProfile)};
          }else if(transportBefore.includes(currentProfile)){
            transportPatch={status:'already_dynamic_current_profile'};
          }
          console.log('ANDROID_TRANSPORT_PATCH='+JSON.stringify(transportPatch));
          const {probeLocalIpcHealth,probeAndroidCommandReceiver,executeAndroidAccessibilityJob}=require('./computer-use/android-accessibility-v1.js');
          const marker='BC_STEP4_ANDROID_IPC_TREE_PREFLIGHT_V1';
          const host='battlecruiser.robvg9.workers.dev';

          const {spawnSync}=require('node:child_process');
          const sourceForToken=fs.readFileSync(transportPath,'utf8');
          const tokenMatch=sourceForToken.match(/const IPC_TOKEN = '([a-f0-9]{64})'/);
          const probe=(bin,args,timeout=4000)=>{try{const r=spawnSync(bin,args,{encoding:'utf8',timeout});return {status:r.status,error:r.error?.message||null,stdout:String(r.stdout||'').trim().slice(0,900),stderr:String(r.stderr||'').trim().slice(0,500)}}catch(e){return {status:null,error:String(e?.message||e).slice(0,180),stdout:'',stderr:''}}};
          const safe=s=>String(s||'').replace(/data="[A-Za-z0-9+/=]+"/g,'data="[redacted]"').replace(tokenMatch?new RegExp(tokenMatch[1],'g'):/a^/,'[token]').slice(0,1400);
          const testPayload=Buffer.from(JSON.stringify({operation:'action',action:{action:'wait',ms:0}}),'utf8').toString('base64');
          const receiverProbes={};
          for(const packageName of ['com.robvg9.ariauiagent.debug','com.robvg9.ariauiagent']){
            const raw=probe('am',['broadcast','--user',String(Math.floor(process.getuid()/100000)),'-a','com.robvg9.ariauiagent.ACTION_EXECUTE','-n',packageName+'/.CommandReceiver','--es','payload_b64',testPayload,'--es','ipc_token',tokenMatch?.[1]||''],5000);
            receiverProbes[packageName]={...raw,stdout:safe(raw.stdout),stderr:safe(raw.stderr),responseDataPresent:/Broadcast completed: result=\d+, data="/.test(raw.stdout||'')};
          }
          const toolsCommand="for x in termux-am am termux-open-url termux-open pm pkg; do printf '%s=' \"$x\"; command -v \"$x\" 2>/dev/null || true; printf '\\n'; done; printf 'PREFIX=%s\\n' \"$PREFIX\"; id";
          const tools=probe('sh',['-c',toolsCommand],5000);
          const currentAmPath=(tools.stdout.match(/^am=(.+)$/m)||[])[1]?.trim()||'';
          let termuxAmInstall={attempted:false,status:'skipped',reason:'Termux app-level am already available'};
          if(!currentAmPath || currentAmPath==='/system/bin/am'){
            termuxAmInstall={attempted:true,...probe('pkg',['install','-y','termux-am'],90000)};
          }
          const toolsAfter=probe('sh',['-c',toolsCommand],5000);
          const effectiveAmPath=(toolsAfter.stdout.match(/^am=(.+)$/m)||[])[1]?.trim()||'';
          const prefix=process.env.PREFIX||'/data/data/com.termux/files/usr';
          const appAmPath=path.join(prefix,'bin','am');
          let termuxAmRepair={attempted:false,status:'skipped',reason:'Termux AM files already present'};
          if(!fs.existsSync(appAmPath)){
            termuxAmRepair={attempted:true,...probe('apt',['reinstall','-y','termux-am'],90000)};
          }
          const packageFiles=probe('sh',['-c',"ls -l \"$PREFIX/bin/am\" \"$PREFIX/libexec/termux-am/am.apk\" 2>&1; dpkg -L termux-am 2>&1 | head -20"],6000);
          const appAmExists=fs.existsSync(appAmPath);
          let activityLaunch={attempted:false,status:'skipped',reason:'Termux AM wrapper absent',appAmPath,appAmExists,effectiveAmPath};
          if(appAmExists){
            activityLaunch={attempted:true,appAmPath,appAmExists,...probe(appAmPath,['start','-n','com.robvg9.ariauiagent.debug/.MainActivity'],12000)};
          }
          const diag={
            toolsBefore:tools,
            termuxAmInstall,termuxAmRepair,
            toolsAfter,packageFiles,appAmPath,appAmExists,effectiveAmPath,
            packageDebug:probe('pm',['path','com.robvg9.ariauiagent.debug']),
            packageRelease:probe('pm',['path','com.robvg9.ariauiagent']),
            enabledAccessibilitySettings:probe('settings',['get','secure','enabled_accessibility_services']),
            matchingProcesses:probe('sh',['-c',"ps -A | grep -E 'ariauiagent|com.termux' | head -12"]),
            ipcListener:probe('sh',['-c'," (toybox netstat -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep '45874' | head -4"]),
            receiverProbes,activityLaunch
          };
          console.log('ANDROID_ENV_DIAG='+JSON.stringify(diag));
          const base={target_package:'com.android.chrome',allow_any_app:false,allowed_hosts:[host]};
          const clean=s=>typeof s==='string'?s.replace(/\\s+/g,' ').trim().replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}/ig,'[redacted]').slice(0,150):'';
          const norm=s=>clean(s).toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n');
          function scan(root){const nodes=[],seen=new Set();let count=0;const walk=(n,path,d)=>{if(!n||typeof n!=='object'||Array.isArray(n)||seen.has(n)||d>28||count>=1200)return;seen.add(n);count++;const names=['name','label','contentDescription','text','hint'].map(k=>clean(n[k])).filter(Boolean);nodes.push({id:typeof n.id==='string'&&n.id?n.id:path,path,role:clean(n.role),className:clean(n.className||n.class),names,text:names.join(' | '),visible:n.visible!==false,clickable:!!n.clickable,enabled:n.enabled!==false,scrollable:!!n.scrollable,bounds:n.bounds||null});if(Array.isArray(n.children))n.children.forEach((c,i)=>walk(c,path+'.'+i,d+1));};walk(root,'0',0);return nodes;}
          (async()=>{
            let h=await probeLocalIpcHealth({timeoutMs:3000}),hp=h&&h.payload||{};
            let activityStart=null;
            if(!h?.ok){
              const launch=spawnSync('am',['start','-n','com.robvg9.ariauiagent.debug/.MainActivity'],{encoding:'utf8',timeout:5000});
              const safeLaunch=s=>String(s||'').replace(/data="[A-Za-z0-9+/=]+"/g,'data="[redacted]"').slice(0,800);
              activityStart={status:launch.status,error:launch.error?.message||null,stdout:safeLaunch(launch.stdout),stderr:safeLaunch(launch.stderr)};
              console.log('ANDROID_ACTIVITY_START_DIAG='+JSON.stringify(activityStart));
              await new Promise(r=>setTimeout(r,1200));
              h=await probeLocalIpcHealth({timeoutMs:3000});hp=h&&h.payload||{};
            }
            const receiver=await probeAndroidCommandReceiver({timeoutMs:3000});
            let req=await executeAndroidAccessibilityJob({command:JSON.stringify({...base,operation:'observe'}),timeoutMs:9000});
            let p=req&&req.payload||{},root=p.root||(p.ui&&p.ui.root)||null,ns=root?scan(root):[];
            let recoveryNavigation={attempted:false,status:'not_needed',reason:null};
            if(!root||ns.length===0||String(req?.reason||'').includes('no_active_application_window')){
              recoveryNavigation.attempted=true;
              const nav=await executeAndroidAccessibilityJob({command:JSON.stringify({...base,operation:'action',action:{action:'navigate',url:'https://'+host+'/'}}),timeoutMs:12000});
              recoveryNavigation.status=nav?.status||'unknown';
              recoveryNavigation.reason=clean(nav?.reason||nav?.payload?.reason||'');
              await new Promise(r=>setTimeout(r,1800));
              req=await executeAndroidAccessibilityJob({command:JSON.stringify({...base,operation:'observe'}),timeoutMs:9000});
              p=req&&req.payload||{};root=p.root||(p.ui&&p.ui.root)||null;ns=root?scan(root):[];
            }
            const labels=ns.filter(n=>n.visible&&n.text).slice(0,80).map(n=>({text:clean(n.text),role:n.role,className:n.className,clickable:n.clickable,scrollable:n.scrollable,bounds:n.bounds}));
            const summary={marker,ok:!!(h&&h.ok===true&&req&&req.status==='succeeded'&&root&&ns.length>0),health:{ok:!!h?.ok,status:h?.status||null,version_name:hp.version_name||null,version_code:hp.version_code||null,build_id:hp.build_id||null,reason:h?.reason||null,activityStart},receiver:{ok:!!receiver?.ok,reason:receiver?.reason||null,transport:receiver?.metadata?.transport||null,exit_code:receiver?.metadata?.exit_code??null,duration_ms:receiver?.metadata?.duration_ms??null,stderr:clean(receiver?.metadata?.stderr||'')},recoveryNavigation,observe:{status:req?.status||null,reason:req?.reason||null,ok:p.ok??null,nodeCount:ns.length,evidence_hash:p.evidence_hash||null,reportQuickActions:labels.filter(n=>/abrir reporte (ventas|compras|rentabilidad|transferencias|stock|movimiento)/i.test(n.text)),chromeBar:labels.filter(n=>/buscar en google o escribir una url|pestanas|personalizar y controlar google chrome/i.test(n.text)),labels},safety:{navigationPerformed:recoveryNavigation.attempted,onlyAllowedBattlecruiserUrl:true,buttonActionsPerformed:false,formsSubmitted:false,businessWrites:false,stockMutated:false}};
            console.log(JSON.stringify(summary));if(!summary.ok)process.exitCode=3;
          })().catch(e=>{console.log(JSON.stringify({marker,ok:false,error:clean(String(e&&e.message||e))}));process.exitCode=1});
          NODE"""
          metadata={'goal_source':'chat','source_application':'ChatGPT','project_name':'BattleCruiser','source':'battlecruiser_step4_android_agent_recovery_v2','verification_marker':marker,'device_id':device,'requested_device_id':device,'operation':'shell.execute','executor_type':'device','requested_capability':'shell.execute','command':command,'risk':'WRITE','timeout_ms':120000,'target_package':'com.android.chrome','allowed_hosts':[host],'read_only':False,'business_data_mutated':False,'explicit_device_intent':True,'human_gate_required':False}
          def post(fn,payload,timeout=45):
              req=urllib.request.Request(base+'/'+fn,data=json.dumps(payload).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read().decode())
                  except:return e.code,{}
          code,body=post('aria-direct-v1',{'goal':'Install the official Termux app-level am helper only if the system am is the only available one, launch the installed ARIA UI Agent if available, then observe the tree and navigate Chrome only to the allowlisted BattleCruiser LIVE URL. Do not click business controls or submit forms. Marker BC_STEP4_ANDROID_AGENT_RECOVERY_V2.','mission_id':mission_id,'metadata':metadata})
          print('DISPATCH_HTTP='+str(code));print('MISSION_ID='+mission_id);print('DISPATCH_STATUS='+str(body.get('dispatch',{}).get('status','unknown')))
          if code>=300 or body.get('ok') is not True: print(json.dumps(body)[:1200]);raise SystemExit(2)
          terminal={'succeeded','failed','blocked','rejected','cancelled','human_required','paused'}
          last={}
          for i in range(1,66):
              c,last=post('aria-mission-runner-v22',{'mission_id':mission_id})
              s=str(last.get('status','unknown'))
              print('POLL='+json.dumps({'n':i,'http':c,'status':s,'error':last.get('error'),'next_action':last.get('next_action')}))
              if s in terminal or c in (401,403,404):break
              time.sleep(2)
          s=str(last.get('status','unknown'));print('FINAL_STATUS='+s);print('FINAL='+json.dumps({k:last.get(k) for k in ('ok','status','mission_id','error','next_action','executor_types','results') if k in last},ensure_ascii=False)[:6000])
          if s!='succeeded':raise SystemExit(1)
          PY
