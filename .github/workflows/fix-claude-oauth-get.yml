name: Fix Claude OAuth GET start

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-claude-oauth-get.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Worker OAuth form and GET bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker.js')
          s = p.read_text()
          old = '''    const upstreamStart = `action="${SUPABASE_OAUTH}/authorize/start"`;
    const rewritten = html.replace(upstreamStart, `action="${publicStart}"`);'''
          new = '''    const upstreamStart = `action="${SUPABASE_OAUTH}/authorize/start"`;
    const rewritten = html
      .replace(upstreamStart, `action="${publicStart}"`)
      .replace('<form method="post"', '<form method="get"');'''
          if old not in s:
              raise SystemExit('authorize HTML patch target not found')
          s = s.replace(old, new, 1)
          marker = '''  const upstream = await fetch(new Request(upstreamUrl.toString(), {
    method: request.method,
    headers,
    body: request.method === "GET" || request.method === "HEAD" ? undefined : request.body,
    redirect: "manual"
  }));'''
          bridge = '''  let upstream;
  if (url.pathname === "/authorize/start" && request.method === "GET") {
    const params = new URLSearchParams(url.search);
    upstreamUrl.pathname = `${SUPABASE_OAUTH}/authorize/start`.replace(/^https?:\\/\\/[^/]+/, "").replace(/\\/$/, "");
    upstream = await fetch(new Request(upstreamUrl.toString(), {
      method: "POST",
      headers: { "content-type": "application/x-www-form-urlencoded", "accept": "text/html" },
      body: params.toString(),
      redirect: "manual"
    }));
  } else {
    upstream = await fetch(new Request(upstreamUrl.toString(), {
      method: request.method,
      headers,
      body: request.method === "GET" || request.method === "HEAD" ? undefined : request.body,
      redirect: "manual"
    }));
  }'''
          if marker not in s:
              raise SystemExit('authorize fetch marker not found')
          s = s.replace(marker, bridge, 1)
          p.write_text(s)
          PY
      - name: Validate Worker with Wrangler
        run: npx --yes wrangler@latest deploy worker.js --dry-run --outdir=.wrangler-dry-run
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js
          git rm .github/workflows/fix-claude-oauth-get.yml
          git commit -m 'fix: make Claude OAuth authorize start browser-native GET'
          git push origin HEAD:main
