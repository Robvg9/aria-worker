name: ARIA Certification Integrity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tests/certification-label-integrity.test.js'
  workflow_dispatch:

jobs:
  certification-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard certification labels
        run: node tests/certification-label-integrity.test.js
