name: ARIA EAS Live Verification Auto

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aria-eas-live-verification-auto
  cancel-in-progress: false

env:
  EAS_PROJECT_ID: 1b23b091-f7b6-4dc2-b328-c8e5ec07de57
  EAS_API: https://api.expo.dev
  ARIA_GIT_REF: aria/android-browser-bridge-v1
  ARIA_EAS_WORKFLOW_FILE: android-development.yml

jobs:
  verify:
    name: Verify EAS Robot access and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify EXPO_TOKEN is present
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          echo "EXPO_TOKEN present (value not printed)."

      - name: Verify EAS project access
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$EAS_API/graphql" \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Content-Type: application/json" \
            --data-raw "$(cat <<JSON
          {"query":"query App(\$appId: String!) { app { byId(appId: \$appId) { id name slug } } }","variables":{"appId":"$EAS_PROJECT_ID"}}
          JSON
          )" > app.json
          python - <<'PY'
          import json
          d=json.load(open('app.json'))
          if d.get('errors'): raise SystemExit(d['errors'])
          app=((d.get('data') or {}).get('app') or {}).get('byId')
          if not app or app.get('id') != '1b23b091-f7b6-4dc2-b328-c8e5ec07de57': raise SystemExit('EAS project access failed')
          print('EAS project access: PASS', app.get('slug'))
          PY

      - name: Dispatch Android workflow from exact bridge branch
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          cat > dispatch.json <<JSON
          {"appId":"$EAS_PROJECT_ID","gitRef":"$ARIA_GIT_REF","fileName":"$ARIA_EAS_WORKFLOW_FILE","inputs":{}}
          JSON
          curl -fsS --max-time 30 -X POST "$EAS_API/v2/workflows/dispatch" \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Content-Type: application/json" \
            --data @dispatch.json > dispatch-response.json
          python - <<'PY'
          import json
          d=json.load(open('dispatch-response.json'))
          if d.get('errors'): raise SystemExit(d['errors'])
          run_id=((d.get('data') or {}).get('id'))
          if not run_id: raise SystemExit(f'No EAS run id: {d}')
          print('EAS workflow dispatched:', run_id)
          print(run_id)
          PY
          python - <<'PY'
          import json
          rid=((json.load(open('dispatch-response.json')).get('data') or {}).get('id'))
          open('eas-run-id.txt','w').write(rid or '')
          PY

      - name: Wait for EAS workflow and report build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID=$(cat eas-run-id.txt)
          deadline=$((SECONDS+1200))
          while true; do
            curl -fsS --max-time 30 "$EAS_API/v2/workflows/runs/$RUN_ID" \
              -H "Authorization: Bearer $EXPO_TOKEN" \
              -H "Accept: application/json" > run.json
            python - <<'PY'
          import json
          d=json.load(open('run.json'))['data']
          print('EAS status:', d.get('status'))
          for j in d.get('jobs') or []:
              if j.get('key')=='build_android':
                  print('BUILD_ID:', j.get('buildId'))
                  print('BUILD_STATUS:', j.get('status'))
          PY
            STATUS=$(python - <<'PY'
          import json
          print(json.load(open('run.json'))['data'].get('status',''))
          PY
          )
            case "$STATUS" in success|failure|canceled) break;; esac
            if [ "$SECONDS" -ge "$deadline" ]; then echo 'Timed out waiting for EAS workflow'; exit 2; fi
            sleep 10
          done
          python - <<'PY'
          import json
          d=json.load(open('run.json'))['data']
          print('FINAL_STATUS:', d.get('status'))
          hit=next((j for j in d.get('jobs') or [] if j.get('key')=='build_android'),None)
          if hit:
              print('FINAL_BUILD_ID:',hit.get('buildId'))
              print('FINAL_BUILD_STATUS:',hit.get('status'))
              open('final-build-id.txt','w').write(hit.get('buildId') or '')
          PY
