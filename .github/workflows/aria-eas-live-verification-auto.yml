name: ARIA EAS Live Verification Auto

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aria-eas-live-verification-auto
  cancel-in-progress: false

env:
  EAS_PROJECT_ID: 1b23b091-f7b6-4dc2-b328-c8e5ec07de57
  EAS_API: https://api.expo.dev
  ARIA_WORKFLOW_RUN_ID: 01a082b3-b13b-71fc-997e-7dc0624c4b53
  ARIA_BUILD_ID: c2b45a20-a56a-4440-9037-905ac72f99d0

jobs:
  verify:
    name: Verify EAS Robot access (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify EXPO_TOKEN is present
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          echo "EXPO_TOKEN present (value not printed)."

      - name: Verify EAS project access via GraphQL
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --max-time 30 "$EAS_API/graphql" \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Content-Type: application/json" \
            --data-raw "$(cat <<JSON
          {"query":"query App(\$appId: String!) { app { byId(appId: \$appId) { id name slug ownerAccount { id name } } } }","variables":{"appId":"$EAS_PROJECT_ID"}}
          JSON
          )")"
          export EAS_RESPONSE="$response"
          python - <<'PY'
          import json, os
          body = json.loads(os.environ['EAS_RESPONSE'])
          errors = body.get('errors') or []
          if errors:
              raise SystemExit(f"EAS GraphQL errors: {errors}")
          app = (((body.get('data') or {}).get('app') or {}).get('byId'))
          if not app:
              raise SystemExit('EAS project missing from response')
          if app.get('id') != os.environ['EAS_PROJECT_ID']:
              raise SystemExit(f"Unexpected EAS project id: {app.get('id')}")
          print(f"EAS project access: PASS ({app.get('slug')})")
          print(f"EAS project name: {app.get('name')}")
          PY

      - name: Verify known ARIA workflow run via REST
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --max-time 30 "$EAS_API/v2/workflows/runs/$ARIA_WORKFLOW_RUN_ID" \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Accept: application/json")"
          export EAS_RUN_RESPONSE="$response"
          python - <<'PY'
          import json, os
          body = json.loads(os.environ['EAS_RUN_RESPONSE'])
          if body.get('errors'):
              raise SystemExit(f"EAS workflow response contains errors: {body['errors']}")
          if not isinstance(body, dict):
              raise SystemExit('Unexpected EAS workflow response shape')
          print("Known ARIA workflow run lookup: PASS")
          print(json.dumps(body, indent=2)[:12000])
          PY

      - name: Verify EAS workflow definitions via GraphQL
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --max-time 30 "$EAS_API/graphql" \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Content-Type: application/json" \
            --data-raw "$(cat <<JSON
          {"query":"query Workflows(\$appId: String!) { app { byId(appId: \$appId) { id workflows { id name fileName } } } }","variables":{"appId":"$EAS_PROJECT_ID"}}
          JSON
          )")"
          export EAS_WORKFLOWS_RESPONSE="$response"
          python - <<'PY'
          import json, os
          body = json.loads(os.environ['EAS_WORKFLOWS_RESPONSE'])
          errors = body.get('errors') or []
          if errors:
              raise SystemExit(f"EAS GraphQL workflow errors: {errors}")
          app = (((body.get('data') or {}).get('app') or {}).get('byId'))
          workflows = (app or {}).get('workflows') or []
          if not workflows:
              raise SystemExit('No EAS workflow definitions returned')
          print(f"EAS workflow definition access: PASS ({len(workflows)} definitions visible)")
          for item in workflows[:10]:
              print(f"- {item.get('fileName') or item.get('name')}")
          PY

      - name: Verify EAS build visibility via GraphQL
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --max-time 30 "$EAS_API/graphql" \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Content-Type: application/json" \
            --data-raw "$(cat <<JSON
          {"query":"query Builds(\$appId: String!) { app { byId(appId: \$appId) { id builds(offset: 0, limit: 10) { id status platform gitCommitHash gitCommitMessage createdAt completedAt artifacts { buildUrl applicationArchiveUrl } error { errorCode message } } } } }","variables":{"appId":"$EAS_PROJECT_ID"}}
          JSON
          )")"
          export EAS_BUILDS_RESPONSE="$response"
          python - <<'PY'
          import json, os
          body = json.loads(os.environ['EAS_BUILDS_RESPONSE'])
          errors = body.get('errors') or []
          if errors:
              raise SystemExit(f"EAS GraphQL build errors: {errors}")
          app = (((body.get('data') or {}).get('app') or {}).get('byId'))
          builds = (app or {}).get('builds') or []
          print(f"EAS build visibility: PASS ({len(builds)} recent builds visible)")
          for build in builds[:10]:
              print(f"- {build.get('id')} | {build.get('platform')} | {build.get('status')}")
          PY

      - name: Inspect known failed Android build via GraphQL
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --max-time 30 "$EAS_API/graphql" \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Content-Type: application/json" \
            --data-raw "$(cat <<JSON
          {"query":"query Build(\$buildId: ID!) { builds { byId(buildId: \$buildId) { id status platform error { errorCode message docsUrl } logFiles artifacts { buildUrl applicationArchiveUrl buildArtifactsUrl } gitCommitHash gitCommitMessage createdAt completedAt } } }","variables":{"buildId":"$ARIA_BUILD_ID"}}
          JSON
          )")"
          export EAS_BUILD_RESPONSE="$response"
          python - <<'PY'
          import json, os
          body = json.loads(os.environ['EAS_BUILD_RESPONSE'])
          errors = body.get('errors') or []
          if errors:
              raise SystemExit(f"EAS GraphQL build detail errors: {errors}")
          build = (((body.get('data') or {}).get('builds') or {}).get('byId'))
          if not build:
              raise SystemExit('Known EAS build not found')
          print('Known EAS build detail lookup: PASS')
          print('Build ID:', build.get('id'))
          print('Status:', build.get('status'))
          print('Platform:', build.get('platform'))
          print('Git commit:', build.get('gitCommitHash'))
          print('Created:', build.get('createdAt'))
          print('Completed:', build.get('completedAt'))
          print('Error:', json.dumps(build.get('error'), ensure_ascii=False))
          print('Log files:', len(build.get('logFiles') or []))
          print('Artifacts:', json.dumps(build.get('artifacts'), ensure_ascii=False))
          with open('eas-build-detail.json', 'w') as f:
              json.dump(build, f)
          PY

      - name: Inspect EAS build log tails
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          build = json.load(open('eas-build-detail.json'))
          urls = build.get('logFiles') or []
          print(f"Attempting bounded fetch of {min(len(urls), 5)} log files")
          for i, url in enumerate(urls[:5], 1):
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      text = r.read().decode('utf-8', 'replace')
                  print(f"--- log {i} tail ---")
                  print(text[-12000:])
              except Exception as exc:
                  print(f"log {i}: fetch failed: {exc}")
          PY

      - name: Publish verification summary
        run: |
          {
            echo "## ARIA EAS Live Verification"
            echo ""
            echo "- Project: \`$EAS_PROJECT_ID\`"
            echo "- EXPO_TOKEN: present"
            echo "- EAS project access: PASS"
            echo "- Known ARIA workflow lookup: PASS"
            echo "- EAS workflow definition access: PASS"
            echo "- EAS build visibility: PASS"
            echo "- Known Android build inspection: PASS"
            echo "- Workflow dispatch: NOT PERFORMED"
            echo "- Build creation: NOT PERFORMED"
            echo "- Secrets exposed: NO"
          } >> "$GITHUB_STEP_SUMMARY"
