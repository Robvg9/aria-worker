name: ARIA Runtime Secret Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aria-runtime-secret-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aria-runtime-secret-sync-production
  cancel-in-progress: false

jobs:
  sync-and-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[runtime-secret-sync]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase CLI and Wrangler
        run: |
          set -euo pipefail
          npm install --global supabase wrangler@latest

      - name: Require production credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo PRODUCTION_CREDENTIALS_PRESENT=true

      - name: Generate and synchronize runtime bridge secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$runtime_secret"
          echo "ARIA_RUNTIME_SHARED_SECRET=$runtime_secret" >> "$GITHUB_ENV"
          printf 'ROTATION_BYTES=%s\n' "${#runtime_secret}"
          supabase secrets set "ARIA_RUNTIME_SHARED_SECRET=$runtime_secret" --project-ref "$SUPABASE_PROJECT_REF"
          printf '%s' "$runtime_secret" | wrangler secret put ARIA_RUNTIME_SHARED_SECRET --name aria
          echo RUNTIME_SECRET_SYNCED_BOTH_SIDES=true

      - name: Verify canonical scheduler acknowledgement with synchronized secret
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/canonical-runtime-smoke.json"
          code="$(curl --silent --show-error --max-time 25 -o "$response_file" -w '%{http_code}'             -X POST "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/aria-canonical-runtime-v1"             -H "Authorization: Bearer $ARIA_RUNTIME_SHARED_SECRET"             -H 'x-aria-trigger: scheduler'             -H 'content-type: application/json'             --data '{}')"
          echo "CANONICAL_RUNTIME_STATUS=$code"
          cat "$response_file"
          test "$code" = '202'
          grep -q '"accepted"' "$response_file"
          echo RUNTIME_BRIDGE_SMOKE_PASS
