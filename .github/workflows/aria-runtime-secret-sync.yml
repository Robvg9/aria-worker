name: Sync canonical ARIA runtime secret to Supabase
run-name: Sync canonical ARIA runtime secret to Supabase (explicit opt-in)

on:
  workflow_dispatch:
    inputs:
      confirm_supabase_sync:
        description: "Set true only after an approved secret-maintenance action."
        required: true
        type: boolean
        default: false
      change_reference:
        description: "Issue, PR, or approved change reference for this synchronization."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aria-runtime-secret-sync
  cancel-in-progress: false

jobs:
  sync:
    if: inputs.confirm_supabase_sync == true
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Validate explicit change reference and required secret inputs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
          CHANGE_REFERENCE: ${{ inputs.change_reference }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CHANGE_REFERENCE"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$ARIA_RUNTIME_SHARED_SECRET"
          echo "CHANGE_REFERENCE_PRESENT=true"
          echo "CANONICAL_SECRET_SOURCE=github_actions_secret"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Supabase CLI
        run: npm install --global supabase@2.122.0

      - name: Synchronize canonical runtime secret to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARIA_RUNTIME_SHARED_SECRET: ${{ secrets.ARIA_RUNTIME_SHARED_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set "ARIA_RUNTIME_SHARED_SECRET=$ARIA_RUNTIME_SHARED_SECRET" --project-ref "$SUPABASE_PROJECT_REF"
          echo SUPABASE_RUNTIME_SECRET_SYNC_PASS
