name: Multimodal + Voice v1 LIVE
# Final certification workflow: perception -> structured state -> cognition + voice output boundary.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full regression suite
        run: npm test
      - name: Multimodal + Voice v1 LIVE certification
        run: node tests/multimodal-v1-live.js
