name: Multimodal + Voice v1 CONTRACT
# Contract certification: perception -> structured state -> cognition + voice output boundary.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full regression suite
        run: npm test
      - name: Multimodal + Voice contract test
        run: node tests/multimodal-v1-live.js
