name: Grok Consent Hotfix Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grok-consent-hotfix.yml'
      - 'worker.js'
  workflow_dispatch:

permissions:
  contents: read

env:
  ARIA_ORIGIN: https://aria.robvg9.workers.dev
  GROK_CALLBACK: https://grok.com/connectors-oauth-exchange-code/
  ARIA_RESOURCE: https://aria.robvg9.workers.dev/mcp

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify consent UI uses direct HTTPS links
        run: |
          set -euo pipefail
          grep -q 'Authorize ARIA MCP' worker.js
          grep -q 'decision=allow' worker.js
          grep -q 'decision=deny' worker.js
          grep -q 'const id=encodeURIComponent(String(pendingId))' worker.js
          grep -q '<a class="btn" href="${allow}">Authorize</a>' worker.js
          grep -q '<a class="btn secondary" href="${deny}">Deny</a>' worker.js
          if grep -q '<form' worker.js; then
            echo 'ERROR: HTML form remains in worker.js; direct-link consent is required'
            exit 1
          fi
          echo CONSENT_UI_SOURCE=OK

      - name: Verify deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy ARIA Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy worker.js --name aria

      - name: Validate LIVE consent page with a valid DCR client
        run: |
          set -euo pipefail
          register_body="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            -X POST "$ARIA_ORIGIN/register" \
            -H 'content-type: application/json' \
            -H 'accept: application/json' \
            --data "$(jq -nc --arg cb "$GROK_CALLBACK" --arg name 'ARIA CI Grok Consent Test' \
              '{redirect_uris:[$cb],client_name:$name,response_types:["code"],grant_types:["authorization_code","refresh_token"],token_endpoint_auth_method:"none"}')")")"
          client_id="$(echo "$register_body" | jq -r '.client_id // empty')"
          test -n "$client_id"
          echo "DCR_CLIENT=OK"

          auth_url="$ARIA_ORIGIN/authorize?client_id=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$client_id")&redirect_uri=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$GROK_CALLBACK")&response_type=code&state=ci&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256&scope=aria.mcp.inbound&resource=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$ARIA_RESOURCE")"
          body="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$auth_url")"
          echo "$body" | grep -q 'decision=allow'
          echo "$body" | grep -q 'decision=deny'
          echo "$body" | grep -q 'Authorize ARIA MCP'
          echo "$body" | grep -q '<a class="btn" href='
          if echo "$body" | grep -q '<form'; then
            echo 'ERROR: LIVE consent page still contains form elements'
            exit 1
          fi
          echo LIVE_CONSENT=OK
