name: Grok Consent Hotfix Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grok-consent-hotfix.yml'
      - 'worker.js'
  workflow_dispatch:

env:
  ARIA_ORIGIN: https://aria.robvg9.workers.dev
  GROK_CALLBACK: https://grok.com/connectors-oauth-exchange-code/
  ARIA_RESOURCE: https://aria.robvg9.workers.dev/mcp

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify consent UI source
        run: |
          set -euo pipefail
          grep -q 'Authorize ARIA MCP' worker.js
          grep -q 'decision=allow' worker.js
          grep -q 'decision=deny' worker.js
          grep -q '<a class="btn" href="${allow}">Authorize</a>' worker.js
          grep -q '<a class="btn secondary" href="${deny}">Deny</a>' worker.js
          if grep -q '<form' worker.js; then
            echo 'ERROR: consent page still contains HTML forms'
            exit 1
          fi
          echo CONSENT_UI_SOURCE=OK

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy ARIA Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy worker.js --name aria

      - name: Validate LIVE consent page
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import urllib.parse
          from pathlib import Path

          params = {
              'client_id': 'aria-ci',
              'redirect_uri': 'https://grok.com/connectors-oauth-exchange-code/',
              'response_type': 'code',
              'state': 'ci',
              'code_challenge': 'E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM',
              'code_challenge_method': 'S256',
              'scope': 'aria.mcp.inbound',
              'resource': 'https://aria.robvg9.workers.dev/mcp',
          }
          url = 'https://aria.robvg9.workers.dev/authorize?' + urllib.parse.urlencode(params)
          Path('/tmp/authorize_url').write_text(url)
          print(url)
          PY

          AUTH_URL="$(cat /tmp/authorize_url)"
          HTTP_CODE="$(curl -sS -o /tmp/authorize_body -w '%{http_code}' --retry 5 --retry-delay 2 "$AUTH_URL")"
          echo "AUTHORIZE_STATUS=$HTTP_CODE"
          echo '--- AUTHORIZE BODY ---'
          cat /tmp/authorize_body
          echo
          echo '--- END AUTHORIZE BODY ---'

          if [ "$HTTP_CODE" != "200" ]; then
            echo 'AUTHORIZE request did not return 200'
            exit 1
          fi
          grep -q 'Authorize ARIA MCP' /tmp/authorize_body
          grep -q 'decision=allow' /tmp/authorize_body
          grep -q 'decision=deny' /tmp/authorize_body
          grep -q '<a class="btn" href=' /tmp/authorize_body
          if grep -q '<form' /tmp/authorize_body; then
            echo 'ERROR: LIVE consent page still contains HTML forms'
            exit 1
          fi
          echo LIVE_CONSENT=OK
