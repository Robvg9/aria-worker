name: Grok Consent Hotfix Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grok-consent-hotfix.yml'
      - 'worker.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify consent UI uses direct HTTPS links
        run: |
          set -euo pipefail
          grep -q 'Authorize ARIA MCP' worker.js
          grep -q 'decision=allow' worker.js
          grep -q 'decision=deny' worker.js
          grep -q 'const id=encodeURIComponent(String(pendingId))' worker.js
          grep -q '<a class="btn" href="${allow}">Authorize</a>' worker.js
          grep -q '<a class="btn secondary" href="${deny}">Deny</a>' worker.js
          if grep -q '<form' worker.js; then
            echo 'ERROR: HTML form remains in worker.js; direct-link consent is required'
            exit 1
          fi
          echo CONSENT_UI_SOURCE=OK

      - name: Verify deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy ARIA Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy worker.js --name aria

      - name: Validate LIVE consent page
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 'https://aria.robvg9.workers.dev/authorize?client_id=aria-ci&redirect_uri=https%3A%2F%2Fgrok.com%2Fconnectors-oauth-exchange-code%2F&response_type=code&state=ci&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256&scope=aria.mcp.inbound&resource=https%3A%2F%2Faria.robvg9.workers.dev%2Fmcp')"
          echo "$body" | grep -q 'decision=allow'
          echo "$body" | grep -q 'decision=deny'
          echo "$body" | grep -q 'Authorize ARIA MCP'
          echo "$body" | grep -q '<a class="btn" href='
          if echo "$body" | grep -q '<form'; then
            echo 'ERROR: LIVE consent page still contains form elements'
            exit 1
          fi
          echo LIVE_CONSENT=OK
