name: Grok Consent Hotfix Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grok-consent-hotfix.yml'
      - 'worker.js'
  workflow_dispatch:

env:
  ARIA_ORIGIN: https://aria.robvg9.workers.dev
  GROK_CALLBACK: https://grok.com/connectors-oauth-exchange-code/
  ARIA_RESOURCE: https://aria.robvg9.workers.dev/mcp

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify consent UI source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Authorize ARIA MCP' worker.js
          grep -Fq 'decision=allow' worker.js
          grep -Fq 'decision=deny' worker.js
          grep -Fq '<a class="btn" href="${allow}">Authorize</a>' worker.js
          grep -Fq '<a class="btn secondary" href="${deny}">Deny</a>' worker.js
          if grep -Fq '<form' worker.js; then
            echo 'ERROR: consent page still contains HTML forms'
            exit 1
          fi
          echo CONSENT_UI_SOURCE=OK

      - name: Verify Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo CLOUDFLARE_AUTH=OK

      - name: Deploy ARIA Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@latest deploy worker.js --name aria

      - name: Validate LIVE OAuth consent flow with Node
        shell: bash
        run: |
          set -euo pipefail
          node > /tmp/oauth-smoke.log 2>&1 <<'NODE'
          const origin = process.env.ARIA_ORIGIN;
          const callback = process.env.GROK_CALLBACK;
          const resource = process.env.ARIA_RESOURCE;

          async function readResponse(url, options = {}) {
            const response = await fetch(url, { redirect: 'manual', ...options });
            const body = await response.text();
            return { status: response.status, body, headers: response.headers };
          }

          const register = await readResponse(`${origin}/register`, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'accept': 'application/json'
            },
            body: JSON.stringify({
              redirect_uris: [callback],
              client_name: 'ARIA CI Grok Consent Test',
              response_types: ['code'],
              grant_types: ['authorization_code', 'refresh_token'],
              token_endpoint_auth_method: 'none'
            })
          });

          console.log(`DCR_STATUS=${register.status}`);
          console.log(`DCR_BODY=${register.body}`);
          if (register.status !== 201) process.exit(20);

          const client = JSON.parse(register.body);
          if (!client.client_id) process.exit(21);

          const auth = new URL(`${origin}/authorize`);
          auth.search = new URLSearchParams({
            client_id: client.client_id,
            redirect_uri: callback,
            response_type: 'code',
            state: 'ci',
            code_challenge: 'E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM',
            code_challenge_method: 'S256',
            scope: 'aria.mcp.inbound',
            resource
          }).toString();

          const consent = await readResponse(auth.toString());
          console.log(`AUTHORIZE_STATUS=${consent.status}`);
          console.log('--- AUTHORIZE BODY ---');
          console.log(consent.body);
          console.log('--- END AUTHORIZE BODY ---');
          if (consent.status !== 200) process.exit(22);
          if (!consent.body.includes('Authorize ARIA MCP')) process.exit(23);
          if (!consent.body.includes('decision=allow')) process.exit(24);
          if (!consent.body.includes('decision=deny')) process.exit(25);
          if (!consent.body.includes('<a class="btn" href=')) process.exit(26);
          if (consent.body.includes('<form')) process.exit(27);

          console.log('DCR=OK');
          console.log('LIVE_CONSENT_FLOW=OK');
          NODE
          cat /tmp/oauth-smoke.log
          test -s /tmp/oauth-smoke.log

      - name: Validate LIVE OAuth metadata
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail --retry 5 --retry-delay 2 "$ARIA_ORIGIN/.well-known/oauth-protected-resource/mcp" -o /tmp/prm.json
          grep -Fq 'aria.robvg9.workers.dev/mcp' /tmp/prm.json
          grep -Fq 'aria.mcp.inbound' /tmp/prm.json

          curl -sS --fail --retry 5 --retry-delay 2 "$ARIA_ORIGIN/.well-known/oauth-authorization-server" -o /tmp/as.json
          grep -Fq 'aria.robvg9.workers.dev' /tmp/as.json
          grep -Fq 'authorization_code' /tmp/as.json
          grep -Fq 'refresh_token' /tmp/as.json
          grep -Fq 'S256' /tmp/as.json
          echo LIVE_OAUTH_METADATA=OK
